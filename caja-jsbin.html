<title>CAJA</title>

<style>
/* Layout: charcoal banking assistant — app bar, graphite balance board with yellow corner, flat account cards, chat of receipts, composer, bottom sheet */
:root {
  --bg: #0d0e10;
  --surface: #16181b;
  --raise: #1e2125;
  --raise-2: #24272c;
  --line: #2a2d33;
  --line-2: #363a42;
  --ink: #f1f2f4;
  --muted: #9aa0aa;
  --faint: #626873;
  --accent: #ffcb47;
  --accent-2: #f2b62a;
  --accent-soft: rgb(255 203 71 / .12);
  --accent-ink: #1c1505;
  --gold: #ffc83d;
  --sand: #ffc83d;
  --green: #62d5a1;
  --red: #ff7a86;
  --amber: #ffc83d;
  --c1: #ffcb47; --c2: #7cc4ff; --c3: #62d5a1; --c4: #ff9a7a; --c5: #b9a4ff; --c6: #e8d3a8;
  --font-display: "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
  --font-mono: "Nunito", ui-rounded, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; }
svg { display: block; }
.aurora, .grain { display: none; }
.app {
  height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box;
}
.icon-btn { cursor: pointer; flex: none; width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; transition: color .15s, border-color .15s, transform .1s; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:hover { color: var(--ink); border-color: var(--line-2); }
.icon-btn:active { transform: scale(.95); }
.icon-btn.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }

/* app bar */
.bar { display: flex; align-items: center; gap: 11px; }
.avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--accent); }
.avatar svg { width: 20px; height: 20px; overflow: visible; }
.logo-box { fill: none; stroke: var(--accent-ink); stroke-width: 2.4; stroke-linejoin: round; }
.logo-slot { stroke: var(--accent-ink); stroke-width: 2.4; stroke-linecap: round; }
.coin { fill: var(--accent-ink); transform-box: view-box; }
.row .mini .logo-box, .row .mini .logo-slot { stroke: var(--accent-ink); }
.row .mini .coin { fill: var(--accent-ink); }
.coin.drop { animation: drop .55s ease-in; }
.coin.pop { animation: pop .55s ease-out; }
@keyframes drop { 0% { transform: translateY(-2px); } 70% { transform: translateY(9px); opacity: 1; } 71% { opacity: 0; } 100% { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: translateY(8px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.who { display: grid; line-height: 1.25; min-width: 0; }
.who b { font-family: var(--font-display); font-weight: 800; letter-spacing: .03em; font-size: 15px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync.on::before { background: var(--green); }
.sync.local::before { background: var(--accent); }
.sync.err::before { background: var(--red); }
.bar .icon-btn:first-of-type { margin-left: auto; }

/* balance board */
.summary { position: relative; overflow: hidden; background: linear-gradient(160deg, #2a2d33, #1d1f23 70%); border: 1px solid var(--line-2); border-radius: 18px; padding: 10px 12px 11px; display: grid; gap: 8px; }
.summary::before { content: ""; position: absolute; right: -32px; top: -32px; width: 68px; height: 68px; background: var(--accent); transform: rotate(45deg); border-radius: 18px; pointer-events: none; }
.summary > * { position: relative; }
.sum-top { display: flex; align-items: center; gap: 8px; padding-right: 34px; }
.book-pill { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: rgb(0 0 0 / .3); border-radius: 99px; padding: 4px 8px 4px 10px; font-size: 12.5px; font-weight: 700; max-width: 55%; }
.book-pill::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); flex: none; }
.book-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.book-pill svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.tc { cursor: pointer; margin-left: auto; border: 1px solid var(--line-2); background: rgb(0 0 0 / .25); color: var(--muted); border-radius: 8px; padding: 3px 7px; font: 11px var(--font-mono); }
.tc.stale { border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); }
.collapse-btn { position: absolute; right: -6px; top: -7px; width: 28px; height: 28px; border-radius: 10px; background: transparent; color: var(--accent-ink); border: 0; }
.collapse-btn:hover { color: var(--accent-ink); }
.collapse-btn svg { width: 16px; height: 16px; transition: transform .2s; }
.summary.collapsed .collapse-btn svg { transform: rotate(180deg); }
.sum-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 10.5px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin-bottom: 3px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: clamp(23px, 6.6vw, 28px); line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; color: var(--ink); }
.big .cur { font-size: .48em; margin-right: .25em; color: var(--accent); font-weight: 600; }
.big.neg { color: var(--red); }
.spark { width: 92px; height: 32px; flex: none; overflow: visible; }
.spark .area { fill: url(#sparkFill); }
.spark .lineS { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.spark .end { fill: var(--accent); stroke: var(--raise-2); stroke-width: 1.5; }
.spark .base { stroke: var(--line-2); stroke-dasharray: 2 3; }
.daily { font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; margin-top: -2px; font-variant-numeric: tabular-nums; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.daily span { color: var(--muted); }
.daily b { color: var(--ink); font-weight: 700; }
.daily .pace { color: var(--accent); }
.sum-main { align-items: center; }

/* account cards */
.cards { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; scroll-padding: 3px; padding: 3px; margin: -3px; }
.acard { --cc: var(--c1); scroll-snap-align: start; flex: none; cursor: pointer; min-width: 112px; box-sizing: border-box; border-radius: 11px; padding: 7px 10px 6px; text-align: left; display: grid; gap: 3px;
  background: rgb(0 0 0 / .28); border: 1px solid var(--line-2); transition: border-color .15s, transform .12s; }
.acard:hover { transform: translateY(-1px); }
.acard[aria-pressed="true"] { border-color: color-mix(in srgb, var(--cc) 75%, transparent); background: color-mix(in srgb, var(--cc) 10%, rgb(0 0 0 / .28)); }
.ac-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.ac-top::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--cc); flex: none; }
.ac-top b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ac-top em { margin-left: auto; font: normal 600 9.5px var(--font-mono); color: var(--c2); border: 1px solid color-mix(in srgb, var(--c2) 45%, transparent); border-radius: 4px; padding: 0 4px; }
.ac-bal { font: 600 13px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.ac-bal.neg { color: var(--red); }
.ac-share { height: 2px; border-radius: 99px; background: var(--line); overflow: hidden; }
.ac-share i { display: block; height: 100%; background: var(--cc); }
.acard.add { border-style: dashed; border-color: rgb(255 203 71 / .4); color: var(--accent); place-content: center; text-align: center; min-width: 78px; font-size: 12px; font-weight: 700; background: transparent; }
.goals { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.goal { flex: none; cursor: pointer; border: 1px solid var(--line-2); border-radius: 9px; padding: 3px 9px; font-size: 11.5px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; color: var(--ink);
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent) var(--p), rgb(0 0 0 / .25) var(--p)); }
.goal .ring { font: 600 11px var(--font-mono); color: var(--accent); }
.summary.collapsed .cards, .summary.collapsed .goals, .summary.collapsed .daily, .summary.collapsed .spark { display: none; }
.summary.collapsed { gap: 8px; }

/* chat */
.chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding: 4px 1px 10px; scroll-behavior: smooth; }
.row { display: flex; gap: 8px; align-items: flex-end; }
.row.me { justify-content: flex-end; }
.row .mini { width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center; background: var(--accent); }
.row .mini svg { width: 14px; height: 14px; }
.row .gap { width: 24px; flex: none; }
.msg { max-width: min(86%, 450px); line-height: 1.5; overflow-wrap: anywhere; min-width: 0; }
.msg .meta { display: block; font: 10px var(--font-mono); color: var(--faint); margin-top: 6px; text-align: right; }
.msg.me { background: #272a30; border: 1px solid var(--line-2); color: var(--ink); padding: 9px 13px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
.msg.me .meta { color: var(--muted); }
.msg.bot { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; border-radius: 16px 16px 16px 4px; white-space: pre-wrap; }
.msg.bot b { color: #fff; }
.enter { animation: enter .28s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
.day { align-self: center; font-size: 11px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; }

/* option buttons */
.opts { display: grid; gap: 7px; margin-top: 11px; white-space: normal; }
.opts.grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts.amounts { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); }
.opts.row { grid-template-columns: 1fr 1fr; }
.opts.row .opt:nth-child(3) { grid-column: 1 / -1; background: transparent; border-style: dashed; color: var(--muted); }
.opts.chips { display: flex; flex-wrap: wrap; }
.opts.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { cursor: pointer; border: 1px solid var(--line-2); background: var(--raise); border-radius: 11px; padding: 9px 11px; font-size: 13px; font-weight: 600; text-align: left; display: grid; gap: 2px; align-content: center; min-height: 40px; transition: border-color .15s, background .15s, transform .1s; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:active:not(:disabled) { transform: scale(.97); }
.opt small { font: 11px var(--font-mono); color: var(--muted); font-weight: 400; }
.opt.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 800; text-align: center; }
.opts.row .opt, .opts.amounts .opt { text-align: center; }
.opts.amounts .opt { font-family: var(--font-mono); font-weight: 500; }
.opts.chips .opt { border-radius: 99px; padding: 7px 13px; min-height: 0; }
.opts.grid .opt { text-align: center; justify-items: center; padding: 12px 6px; gap: 7px; }
.opt .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line-2); }
.opt[data-action="ingreso"] .ic { color: var(--green); border-color: rgb(98 213 161 / .3); background: rgb(98 213 161 / .08); }
.opt[data-action="transferir"] .ic, .opt[data-action="recuentos"] .ic, .opt[data-action="tc"] .ic { color: var(--c2); border-color: rgb(124 196 255 / .3); background: rgb(124 196 255 / .08); }
.opt[data-action="metas"] .ic, .opt[data-action="nuevameta"] .ic { color: var(--c5); border-color: rgb(185 164 255 / .3); background: rgb(185 164 255 / .08); }
.opt .ic svg { width: 19px; height: 19px; }
.opt[data-action="gasto"] .ic { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opts.stale .opt { opacity: .4; cursor: default; }
.opts.stale .opt.chosen { opacity: 1; border-color: var(--accent); }

/* receipts and info cards */
.tk { display: grid; gap: 5px; white-space: normal; font-variant-numeric: tabular-nums; }
.tk-row { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
.amt { font: 500 14px var(--font-mono); white-space: nowrap; }
.tk-sub { font-size: 12px; color: var(--muted); }
.tk-hr { border-top: 1px dashed var(--line-2); margin: 6px 0 3px; }
.tk-foot { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); }
.tk-foot b { color: var(--ink); font: 500 12.5px var(--font-mono); }
.tk-title { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .01em; }
.tk-quip { font-size: 12.5px; color: var(--muted); }
.bar-l { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar-l i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar-l.green i { background: var(--green); }
.bar-l.warn i { background: #ff9f43; }
.bar-l.over i { background: var(--red); }
.cat-line { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.cat-line .bar-l { grid-column: 1 / -1; }
.out { color: var(--red); }
.in { color: var(--green); }
.rc { display: grid; gap: 9px; white-space: normal; min-width: 236px; }
.rc-head { display: grid; grid-template-columns: auto 1fr auto; gap: 11px; align-items: center; }
.rc-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 18px; background: var(--raise); border: 1px solid var(--line); }
.rc:has(.rc-amt.out) .rc-ic { background: rgb(255 122 134 / .1); border-color: rgb(255 122 134 / .22); }
.rc:has(.rc-amt.in) .rc-ic { background: rgb(98 213 161 / .1); border-color: rgb(98 213 161 / .22); }
.rc-t { display: grid; min-width: 0; }
.rc-t b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-t small { font-size: 12px; color: var(--muted); }
.rc-amt { font: 600 15px var(--font-mono); white-space: nowrap; }
.rc-foot { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--line-2); padding-top: 9px; }
.rc-foot .ok { display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-family: var(--font-mono); }
.rc-foot .ok svg { width: 14px; height: 14px; }
.rc-foot .ok.fresh path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .5s .15s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.rc-foot .sal { margin-left: auto; }
.rc-foot .sal b { color: var(--ink); font: 500 12px var(--font-mono); }
.rc-more { cursor: pointer; border: 0; background: transparent; color: var(--faint); width: 26px; height: 22px; border-radius: 7px; display: grid; place-items: center; }
.rc-more:hover { color: var(--ink); background: var(--raise); }
.rc-more svg { width: 16px; height: 16px; }
.cf-amt { font: 800 24px var(--font-display); margin: 2px 0 6px; }
.dl { cursor: pointer; margin-top: 10px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13.5px; padding: 11px 12px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.dl svg { width: 16px; height: 16px; }
.msg.bot .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }

/* quick actions + composer */
.chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
.chip { flex: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 13px 6px 10px; transition: border-color .15s; }
.chip svg { width: 15px; height: 15px; color: var(--muted); }
.chip[data-action="gasto"] svg { color: var(--accent); } .chip[data-action="ingreso"] svg { color: var(--green); } .chip[data-action="transferir"] svg { color: var(--c2); }
.chip:hover { border-color: var(--accent); }
.chip.cancel svg { color: var(--red); }
form { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
form .icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--raise); border-color: transparent; }
#entrada { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 0; padding: 9px 4px; }
#entrada:focus { outline: none; }
form:focus-within { border-color: var(--line-2); }
#entrada::placeholder { color: var(--faint); }
.send { cursor: pointer; border: 0; border-radius: 12px; width: 44px; height: 40px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; transition: transform .1s; }
.send:active { transform: scale(.94); }
.send svg { width: 18px; height: 18px; }
#plus svg { transition: transform .2s; }
#plus.on { color: var(--accent); }
#plus.on svg { transform: rotate(45deg); }
#mic.on { color: var(--red); border-color: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--red) 22%, transparent); } }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .6); z-index: 20; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; width: min(640px, 100%); transform: translate(-50%, 100%); transition: transform .26s cubic-bezier(.2, .8, .3, 1); box-sizing: border-box;
  background: var(--surface); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 24px 24px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 80%; overflow-y: auto; }
.sheet.open { transform: translate(-50%, 0); }
.grab { width: 42px; height: 4px; border-radius: 99px; background: var(--line-2); margin: 0 auto 14px; }
.sheet h3 { margin: 0 0 14px; font: 600 15px var(--font-display); }
.sheet .opts { margin-top: 0; }
.lib-row { cursor: pointer; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line-2); background: var(--raise); border-radius: 13px; padding: 13px 14px; margin-bottom: 7px; }
.lib-row::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--faint); }
.lib-row b { font-weight: 700; }
.lib-row small { margin-left: auto; font: 12px var(--font-mono); color: var(--muted); }
.lib-row.on { border-color: var(--accent); }
.lib-row.on::before { background: var(--accent); }
.lib-row.add { color: var(--accent); border-style: dashed; background: transparent; }
.lib-row.add::before { display: none; }
.sheet-note { font-size: 12px; color: var(--faint); margin-top: 10px; }


/* each account owns a color: the board, its card and its tags take it */
.summary { --acct: var(--accent); background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--acct) 16%, transparent), transparent 55%), linear-gradient(160deg, #26292e, #1b1d21 75%); border-color: color-mix(in srgb, var(--acct) 28%, var(--line-2)); transition: border-color .3s; }
.summary::before { background: var(--acct); transition: background .3s; }
.big .cur { color: var(--acct); }
.daily b, .daily .pace { color: var(--ink); }
.daily span:first-child b { color: var(--acct); }
.spark .lineS { stroke: var(--acct); }
.spark .end { fill: var(--acct); }
.spark .area { fill: color-mix(in srgb, var(--acct) 16%, transparent); }
.eyebrow { display: flex; align-items: center; gap: 6px; color: var(--ink); letter-spacing: .06em; }
.eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--acct); }
.book-pill::before { background: var(--accent); }
.acard { background: color-mix(in srgb, var(--cc) 9%, rgb(0 0 0 / .3)); border-color: color-mix(in srgb, var(--cc) 30%, transparent); min-width: 118px; position: relative; overflow: hidden; }
.acard::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--cc); }
.acard[aria-pressed="true"] { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 20%, rgb(0 0 0 / .3)); box-shadow: 0 6px 16px -10px var(--cc); }
.acard.add::after { display: none; }
.ac-top { color: var(--ink); }
.ac-top::before { display: none; }
.ac-sub { font-size: 10px; color: var(--muted); letter-spacing: .04em; }
.acct-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--cc); background: color-mix(in srgb, var(--cc) 12%, transparent); border: 1px solid color-mix(in srgb, var(--cc) 30%, transparent); border-radius: 6px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.acct-tag::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--cc); }
.tk-foot span .acct-tag { margin-left: 0; font-size: 12px; }
.rc-t small { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.msg.bot { background: linear-gradient(180deg, #1a1c20, #16181b); }
.chat .day { background: transparent; border: 0; color: var(--faint); text-transform: capitalize; }
.chat .day::before, .chat .day::after { content: ""; display: inline-block; width: 28px; height: 1px; background: var(--line-2); vertical-align: middle; margin: 0 8px; }
form { box-shadow: 0 -10px 30px -18px rgb(0 0 0 / .9); }

/* ---------- soul: mascot, greeting, texture, stamps, confetti ---------- */
body { background:
  radial-gradient(80% 50% at 50% -10%, rgb(255 203 71 / .09), transparent 70%),
  radial-gradient(rgb(255 255 255 / .045) 1px, transparent 1.3px) 0 0 / 18px 18px,
  var(--bg); }
.caji-wrap { width: 46px; height: 46px; flex: none; display: grid; place-items: center; position: relative; }
.caji-wrap::after { content: ""; position: absolute; inset: auto 6px 0; height: 6px; border-radius: 50%; background: rgb(0 0 0 / .45); filter: blur(2px); }
.caji { width: 44px; height: 44px; overflow: visible; position: relative; z-index: 1; }
.bar .caji { animation: bob 3.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.caji .c-body { fill: var(--accent); stroke: #1c1505; stroke-width: 2.2; }
.caji .c-slot { fill: #1c1505; }
.caji .coin { fill: #fff3cf; stroke: #1c1505; stroke-width: 1.8; }
.caji .c-eyes { fill: #1c1505; transform-box: fill-box; transform-origin: center; }
.caji .c-eyes.blink { animation: blinkEye .22s ease-in-out; }
@keyframes blinkEye { 50% { transform: scaleY(.1); } }
.caji .c-happy, .caji .c-sleep { fill: none; stroke: #1c1505; stroke-width: 2.2; stroke-linecap: round; display: none; }
.caji .c-cheek { fill: #ff8f6b; opacity: .45; }
.caji .c-m { display: none; fill: none; stroke: #1c1505; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.caji .c-big { fill: #1c1505; } .caji .c-o { fill: #1c1505; stroke: none; }
.caji .c-brows { display: none; fill: none; stroke: #1c1505; stroke-width: 2; stroke-linecap: round; }
.caji .c-z { display: none; font: 800 9px var(--font-display); fill: var(--muted); }
.caji.smile .c-smile, .caji.big .c-big, .caji.worry .c-worry, .caji.o .c-o, .caji.sleep .c-smile { display: block; }
.caji.big .c-eyes, .caji.sleep .c-eyes { display: none; }
.caji.big .c-happy { display: block; }
.caji.sleep .c-sleep, .caji.sleep .c-z { display: block; }
.caji.worry .c-brows { display: block; }
.caji.worry .c-cheek { opacity: 0; }
.bar .caji.big { animation: hop .5s ease-out 2; }
@keyframes hop { 40% { transform: translateY(-6px) rotate(-4deg); } }
.row .mini { background: transparent; width: 26px; height: 26px; }
.row .mini .caji { width: 26px; height: 26px; }
.who b { font: 800 17px var(--font-display); letter-spacing: -.01em; }
.insight { font-size: 12.5px; line-height: 1.4; color: var(--ink); background: rgb(0 0 0 / .28); border: 1px solid var(--line); border-left: 3px solid var(--acct); border-radius: 10px; padding: 7px 10px; }
.summary.collapsed .insight { display: none; }
.big { font-family: var(--font-display); font-weight: 800; letter-spacing: -.03em; font-size: clamp(26px, 7.6vw, 32px); }
.tk-title, .cf-amt, .sheet h3 { font-family: var(--font-display); }
.cf-amt { font-weight: 800; letter-spacing: -.02em; }
.stamp { display: inline-block; white-space: nowrap; flex: none; font: 800 10px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--cc); border: 1.6px solid var(--cc); border-radius: 5px; padding: 2px 6px 1px; transform: rotate(-7deg); opacity: .85; }
.stamp.fresh { animation: stampIn .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stampIn { from { transform: rotate(-16deg) scale(1.9); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: .85; } }
.rc-foot .op { font: 11px var(--font-mono); color: var(--faint); }
.rc-foot .op, .rc-foot .sal { white-space: nowrap; }
.rc-foot { flex-wrap: wrap; row-gap: 6px; }
.confetti { position: fixed; z-index: 30; pointer-events: none; width: 0; height: 0; }
.confetti i { position: absolute; width: 7px; height: 11px; border-radius: 2px; animation: burst 1.2s cubic-bezier(.15, .7, .3, 1) forwards; }
.confetti i:nth-child(3n) { width: 8px; height: 8px; border-radius: 50%; }
@keyframes burst { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .bar .caji, .caji .c-eyes.blink, .stamp.fresh { animation: none; } }
.privacy .big, .privacy .ac-bal, .privacy .amt, .privacy .rc-amt, .privacy .tk-foot b, .privacy .rc-foot .sal b, .privacy .lib-row small, .privacy .opt small, .privacy .daily b, .privacy .cf-amt { filter: blur(7px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

<script>
(() => {
  // ---------- state ----------
  let cuentas = [];   // {id, nombre, inicial, moneda:'PEN'|'USD'}
  let metas = [];     // {id, nombre, objetivo, ahorrado}  (soles)
  let limites = {};   // {Categoria: monto mensual en soles}
  let movs = [];
  let tc = null;      // {valor, fecha, fuente}
  let libros = [{ id: "principal", nombre: "Personal" }];   // recuentos
  let activo = "principal";
  let data = {};      // recuento id -> {cuentas, metas, limites, movs}
  try { activo = localStorage.getItem("caja-libro") || "principal"; } catch (e) {}
  let ephemeral = [];
  let store = null;
  let pendingReset = false, pendingDelete = null, pendingText = null;
  let sel = "all";
  try { sel = localStorage.getItem("caja-sel") || "all"; } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const SYM = { PEN: "S/", USD: "US$" };
  const num = (n) => (Math.round(n * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = (n, cur = "PEN") => (n < 0 ? "−" : "") + SYM[cur] + " " + num(Math.abs(n));
  const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
  const words = (s) => " " + norm(s).replace(/[^a-z0-9ñ ]/g, " ").replace(/\s+/g, " ").trim() + " ";
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const acc = (id) => cuentas.find((c) => c.id === id);
  const accName = (id) => (acc(id) || { nombre: "Cuenta borrada" }).nombre;
  const accCur = (id) => (acc(id) || { moneda: "PEN" }).moneda;
  const newId = (p = "c") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const rate = () => (tc && tc.valor > 0 ? tc.valor : null);
  const toPEN = (v, cur) => (cur === "USD" ? v * (rate() || 0) : v);
  const convert = (v, from, to) => { if (from === to) return v; const r = rate(); if (!r) return null; return from === "USD" ? v * r : v / r; };
  const libro = (id) => libros.find((l) => l.id === id);
  // a recuento named in the text: full name first, then a partial match ("viaje" -> "Viaje a Cusco")
  function libroIn(text) {
    const exact = namesIn(text, libros)[0];
    if (exact) return exact;
    const q = norm(text).replace(/^(el|la|recuento|caja)\s+/, "");
    if (q.length < 3) return undefined;
    const hit = libros.find((l) => norm(l.nombre).includes(q)) || libros.find((l) => q.includes(norm(l.nombre).split(" ")[0]));
    return hit && hit.id;
  }
  function syncActive() { data[activo] = { cuentas, metas, limites, movs }; }
  function loadActive() {
    if (!libro(activo)) activo = libros[0].id;
    const d = data[activo] || { cuentas: [], metas: [], limites: {}, movs: [] };
    cuentas = d.cuentas; metas = d.metas; limites = d.limites; movs = d.movs;
    if (activo === "principal") adoptOrphans();
  }
  // run fn with another recuento's state loaded, then restore the active one
  function withLibro(id, fn) {
    syncActive(); const keep = activo; activo = id; loadActive();
    try { return fn(); } finally { syncActive(); activo = keep; loadActive(); }
  }
  const pickBy = (arr, seed) => arr[Math.abs(Math.floor(seed)) % arr.length];
  const monthStart = (t = Date.now()) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
  const daysLeft = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate() + 1; };

  // ---------- categories ----------
  const CATS = [
    ["Servicios", "💡", "luz agua internet cable gas telefono celular recarga movistar claro entel bitel sedapal enel calidda plan"],
    ["Viajes", "✈️", "hotel hostal hospedaje airbnb vuelo vuelos avion aereo latam sky jetsmart booking tour excursion"],
    ["Transporte", "🚕", "taxi uber cabify didi indriver bus combi pasaje pasajes gasolina grifo metropolitano peaje cochera estacionamiento corredor"],
    ["Comida", "🍔", "menu almuerzo cena desayuno pizza pollo polleria chifa comida restaurante cafe rappi pedidosya ceviche hamburguesa lonche salchipapa delivery sanguche anticuchos kfc bembos"],
    ["Mercado", "🛒", "super supermercado mercado plaza vea tottus wong metro bodega abarrotes viveres makro mass"],
    ["Casa", "🏠", "alquiler renta depa departamento cuarto mantenimiento jato"],
    ["Suscripciones", "📺", "netflix spotify disney hbo max prime youtube icloud chatgpt claude xbox playstation psn gamepass"],
    ["Salud", "💊", "farmacia inkafarma mifarma doctor clinica medicina medicinas dentista seguro gimnasio gym smartfit proteina"],
    ["Salidas", "🍻", "cine chelas cerveza chela salida concierto juerga tono bar discoteca previa trago tragos karaoke"],
    ["Compras", "👟", "ropa zapatillas polo regalo amazon falabella ripley oechsle saga aliexpress temu"],
    ["Gaming", "🎮", "juego juegos steam ps5 nintendo skins pase fortnite valorant"],
    ["Educación", "📚", "curso universidad libro libros pension matricula udemy platzi certificacion"],
    ["Deudas", "💳", "tarjeta prestamo cuota deuda credito"],
  ].map(([n, e, w]) => ({ n, e, w: w.split(" ") }));
  function catOf(desc, tipo) {
    if (tipo === "in") return "Ingreso";
    const ws = norm(desc).split(/[^a-z0-9ñ]+/);
    for (const c of CATS) if (c.w.some((w) => ws.includes(w))) return c.n;
    return "Otros";
  }
  const catEmoji = (n) => n === "Ingreso" ? "💸" : n === "Transferencia" ? "🔁" : ((CATS.find((c) => c.n === n) || {}).e || "🧾");
  function catFromWord(w) {
    const n = norm(w);
    const c = CATS.find((c) => norm(c.n) === n || norm(c.n).startsWith(n) || c.w.includes(n));
    return c ? c.n : n === "otros" ? "Otros" : null;
  }

  // ---------- parsing ----------
  function parseAmount(raw) {
    let s = raw.replace(/\s/g, "");
    const hasC = s.includes(","), hasD = s.includes(".");
    if (hasC && hasD) {
      const dec = s.lastIndexOf(",") > s.lastIndexOf(".") ? "," : ".";
      s = s.split(dec === "," ? "." : ",").join("").replace(dec, ".");
    } else if (hasC || hasD) {
      const sep = hasC ? "," : ".";
      const parts = s.split(sep);
      const thousands = parts.length > 2 || (parts.length === 2 && parts[1].length === 3);
      s = thousands ? parts.join("") : parts.join(".");
    }
    return parseFloat(s);
  }
  const NUM = /(\d[\d.,]*(?:\s\d{3})*)\s*(k|mil\b|lucas?\b)?/i;
  // pick the amount: the number next to a currency mark wins, otherwise the largest one
  function amountIn(t) {
    const src = t.replace(/\bps5\b/gi, " ");
    const re = /(s\/\.?\s*|us\$\s*|\$\s*)?(\d[\d.,]*(?:\s\d{3})*)\s*(k\b|mil\b|lucas?\b|soles?\b|d[oó]lares?\b|usd\b)?/gi;
    let best = null, mk;
    while ((mk = re.exec(src))) {
      let v = parseAmount(mk[2]);
      if (mk[3] && /^(k|mil)/i.test(mk[3])) v *= 1000;
      if (!isFinite(v) || v <= 0) continue;
      const tagged = !!(mk[1] || mk[3]);
      const c = { v, raw: mk[0].trim(), tagged };
      if (!best || (tagged && !best.tagged) || (tagged === best.tagged && v > best.v)) best = c;
    }
    return best;
  }
  function curIn(t) {
    const l = norm(t);
    if (/us\$|\busd\b|\bdolar(es)?\b|(^|[^s\/])\$/.test(l)) return "USD";
    if (/s\/|\bsoles?\b|\bpen\b|\blucas?\b/.test(l)) return "PEN";
    return null;
  }
  const CUR_WORDS = /(?<![\p{L}])(en\s+)?(d[oó]lares|d[oó]lar|usd|soles|sol|pen|lucas|luca)(?![\p{L}])/giu;
  const stripCur = (s) => s.replace(/us\$|s\/\.?|\$/gi, " ").replace(CUR_WORDS, " ");
  const IN_WORDS = /\b(deposit\w*|cobr[éeoa]\w*|recib\w*|ingres\w*|me pagaron|me pagó|me pago|entr[óo]|sueldo|salario|quincena|ganancia|gané|gane|me dieron|me transfirieron|me yapearon|me plinearon|me devolvieron|abono|cachuelo)/i;
  const TR_WORDS = /\b(pas[ée]|pasar|transfer\w*|mov[ií]|mover|traspas\w*|cambi[ée])\b/i;
  const INI_WORDS = /\b(saldo inicial|inicial|empiezo con|comienzo con|tengo)\b/i;
  const FILLER = /(?<![\p{L}\d])(se\s+pag[óo]|pagu[ée]|pag[óo]|pago|gast[ée]|gast[óo]|gasto|compr[ée]|compr[óo]|compra|yape[ée]|plin[ée]|deposit\w*|me\s+pagaron|me\s+pag[óo]|cobr[ée]\w*|recib\w*|ingres\w*|entr[óo]|me\s+dieron|me\s+transfirieron|me\s+yapearon|me\s+plinearon|me\s+devolvieron|abono|un|una|el|la|los|las|de|del|desde|en|por|para|con|a|al|monto|k|mil|hoy|ayer|me|se|cuenta)(?![\p{L}\d])/giu;

  function namesIn(text, list) {
    const t = words(text);
    const hits = [];
    for (const c of [...list].sort((a, b) => b.nombre.length - a.nombre.length)) {
      const n = words(c.nombre);
      const i = t.indexOf(n);
      if (i >= 0 && !hits.some((h) => i < h.i + h.len && h.i < i + n.length)) hits.push({ id: c.id, i, len: n.length });
    }
    return hits.sort((a, b) => a.i - b.i).map((h) => h.id);
  }
  const accountsIn = (t) => namesIn(t, cuentas);
  const metasIn = (t) => namesIn(t, metas);
  function stripNames(text, list) {
    let d = text;
    for (const c of list) d = d.replace(new RegExp("(?<![\\p{L}\\d])" + c.nombre.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\p{L}\\d])", "giu"), " ");
    return d;
  }
  const cleanDesc = (text, numRaw) => cap(stripCur(stripNames(text.replace(numRaw, " "), cuentas)).replace(/[+\-]/g, " ").replace(FILLER, " ").replace(/\s+/g, " ").trim());
  const cleanName = (s, a) => cap(stripCur(a ? s.replace(a.raw, " ") : s).replace(/\s+(con|de|por|a)\s*$/i, "").replace(/\s+/g, " ").trim());

  function interpret(text) {
    const t = text.trim();
    const low = norm(t);
    if (!t) return null;
    if (/^si,? ?reiniciar$/.test(low)) return { cmd: "reset-ok" };
    if (/^si,? ?borrar$/.test(low)) return { cmd: "del-ok" };
    if (/^(reiniciar|borrar todo|empezar de nuevo)$/.test(low)) return { cmd: "reset" };
    if (/^(deshacer|borra el ultimo|borrar ultimo|undo|me equivoque)$/.test(low)) return { cmd: "undo" };
    if (/^(resumen|reporte|balance|como voy)\??/.test(low)) return { cmd: "resumen" };
    if (/^(mis )?cuentas\??$/.test(low)) return { cmd: "cuentas" };
    if (/^(mis )?metas\??$/.test(low)) return { cmd: "metas" };
    if (/^(mis )?(limites|topes)\??$/.test(low)) return { cmd: "limites" };
    if (/^(saldo|cuanto tengo|cuanto me queda)\??$/.test(low)) return { cmd: "saldo" };
    if (/^(ayuda|help|\?|que puedes hacer)\??$/.test(low)) return { cmd: "ayuda" };
    if (/^(hola|holi|buenas|buenos dias|buenas tardes|buenas noches|hey|que tal|gracias|ok|listo)\b[!. ]*$/.test(low)) return { cmd: "hola", gracias: /gracias/.test(low) };
    if (/^(tc|t\.?c\.?|tipo de cambio|(el )?dolar( esta)?( a| en)?)\??$/.test(low)) return { cmd: "tc?" };
    let m = low.match(/^(?:tc|t\.c\.?|tipo de cambio|(?:el )?dolar(?: esta)?(?: a| en)?)\s*(?:s\/\.?)?\s*(\d+(?:[.,]\d+)?)$/);
    if (m) return { cmd: "tc", valor: parseFloat(m[1].replace(",", ".")) };

          const ts1 = Date.now(); markFresh(ts1);

        case "undo": {
          const last = movs.filter((m) => sel === "all" || touches(m, sel)).sort((a, b) => b.ts - a.ts)[0];
          if (!last) { say("No hay nada que deshacer aquí."); break; }
          await store.remove(last.id);

        case "ren": {
          const id = r.ids[0];
          if (!id || !r.nombre) { say("No encontré esa cuenta. Escribe <b>cuentas</b> para ver los nombres."); break; }
          const old = accName(id);
          await store.save({ cuentas: cuentas.map((c) => (c.id === id ? { ...c, nombre: r.nombre } : c)) });
          say(`<b>${esc(old)}</b> ahora es <b>${esc(r.nombre)}</b>.`);

        case "del": {
          const id = r.ids[0];

          pendingDelete = id;
          const n = movs.filter((m) => touches(m, id)).length;
          say(`¿Borro <b>${esc(accName(id))}</b> y sus ${n} movimiento${n === 1 ? "" : "s"}?\nEscribe <b>sí, borrar</b> para confirmar.`);
          break;

        case "del-ok": {
          if (!pendingDelete) { say("Primero escribe <b>borrar cuenta</b> y el nombre."); break; }
          if (pendingDelete.libro) {
            const id = pendingDelete.libro; pendingDelete = null;

            if (id === activo) setLibro(libros.find((l) => l.id !== id).id);
            syncActive();
            await store.deleteLibro(id);
            say(`Borré el recuento <b>${esc(name)}</b>.`);
            break;
          }
          const id = pendingDelete; pendingDelete = null;
          const name = accName(id);
          for (const m of movs.filter((m) => touches(m, id))) await store.remove(m.id);
          await store.save({ cuentas: cuentas.filter((c) => c.id !== id) });
          if (sel === id) setSel("all");
          say(`Borré la cuenta <b>${esc(name)}</b>.`);
          break;
        }
        case "reset": pendingReset = true; say(`¿Seguro? En <b>${esc(libro(activo).nombre)}</b> se borran ${cuentas.length} cuentas, ${movs.length} movimientos, tus metas y topes.\nEscribe <b>sí, reiniciar</b> para confirmar.`); break;
        case "reset-ok":
          if (!pendingReset) { say("Primero escribe <b>reiniciar</b>."); break; }
          pendingReset = false;
          for (const m of [...movs]) await store.remove(m.id);
          await store.save({ cuentas: [], metas: [], limites: {} });
          ephemeral = []; setSel("all");
          say("Caja vacía. Arranca con <b>nueva cuenta Efectivo 200</b>.");
          break;
        default: say(`No encontré un monto.\nPrueba <b>pagué 12 de taxi</b> o escribe <b>ayuda</b>.`);
      }
    } catch (e) {
      say(`No pude guardar eso (${esc((e && (e.message || e.code)) || "error")}). Inténtalo otra vez.`);
    }
  }

  // ---------- exports (PDF / Excel) ----------
  const LIBS = {
    excel: ["https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"],
    pdf: ["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js", "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"],
  };
  const loaded = {};
  function loadScript(src) {
    if (!loaded[src]) loaded[src] = new Promise((ok, ko) => {
      const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => { delete loaded[src]; ko(new Error("No pude cargar la librería")); };
      document.head.append(s);
    });
    return loaded[src];
  }
  const loadLibs = async (k) => { for (const u of LIBS[k]) await loadScript(u); };
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  function parsePeriod(low) {
    const now = new Date();
    if (/\b(todo|completo|historial|total)\b/.test(low.replace(/todos los recuentos/, ""))) return { from: 0, to: Infinity, label: "Todo el historial", slug: "historial" };
    let y = now.getFullYear(), mo = now.getMonth();
    const ym = low.match(/\b(20\d\d)\b/);
    const mi = MESES.findIndex((m) => low.includes(m) || (m === "septiembre" && low.includes("setiembre")));
    if (/mes pasado|mes anterior/.test(low)) { mo -= 1; if (mo < 0) { mo = 11; y -= 1; } }
    else if (mi >= 0) { mo = mi; if (ym) y = +ym[1]; else if (mi > now.getMonth()) y -= 1; }
    else if (ym && !/mes/.test(low)) return { from: new Date(+ym[1], 0, 1).getTime(), to: new Date(+ym[1] + 1, 0, 1).getTime(), label: "Año " + ym[1], slug: ym[1] };
    return { from: new Date(y, mo, 1).getTime(), to: new Date(y, mo + 1, 1).getTime(), label: cap(MESES[mo]) + " " + y, slug: MESES[mo] + "-" + y, month: true };
  }
  // one recuento's report (runs against the active recuento's state)
  function reportData(per) {
    const b = {};
    for (const c of cuentas) b[c.id] = c.inicial || 0;
    const rows = [];
    for (const m of [...movs].sort((x, y) => x.ts - y.ts)) {
      if (m.tipo === "tr") { if (m.desde in b) b[m.desde] -= m.monto; if (m.hacia in b) b[m.hacia] += m.montoDest != null ? m.montoDest : m.monto; }
      else if (m.cuenta in b) b[m.cuenta] += m.tipo === "in" ? m.monto : -m.monto;
      if (m.ts < per.from || m.ts >= per.to) continue;
      const cur = m.tipo === "tr" ? accCur(m.desde) : accCur(m.cuenta);
      const signed = m.tipo === "out" ? -m.monto : m.monto;
      rows.push({
        fecha: new Date(m.ts), tipo: m.tipo === "out" ? "Gasto" : m.tipo === "in" ? "Ingreso" : "Transferencia",
        cuenta: m.tipo === "tr" ? `${accName(m.desde)} a ${accName(m.hacia)}` : accName(m.cuenta),
        cat: m.cat, desc: m.desc || m.texto, monto: signed, moneda: cur,
        soles: m.tipo === "tr" ? 0 : Math.round(toPEN(signed, cur) * 100) / 100,
        saldo: m.tipo === "tr" ? b[m.desde] : b[m.cuenta],
        nota: m.orig ? `${SYM[m.orig.moneda]} ${num(m.orig.monto)} a TC ${m.orig.tc.toFixed(3)}` : "",
      });
    }
    let inn = 0, out = 0; const cats = {};
    for (const r of rows) { if (r.tipo === "Ingreso") inn += r.soles; if (r.tipo === "Gasto") { out += -r.soles; (cats[r.cat] = cats[r.cat] || { v: 0, n: 0 }); cats[r.cat].v += -r.soles; cats[r.cat].n++; } }
    const catRows = Object.entries(cats).sort((a, c) => c[1].v - a[1].v).map(([k, x]) => ({ cat: k, v: x.v, n: x.n, pct: out ? x.v / out : 0, tope: per.month ? limites[k] || null : null }));
    const bal = balances();
    const cuentasRows = cuentas.map((c) => ({ nombre: c.nombre, moneda: c.moneda, saldo: bal[c.id], soles: toPEN(bal[c.id], c.moneda) }));
    return { per, libro: (libro(activo) || {}).nombre || "Recuento", rows, inn, out, neto: inn - out, catRows, cuentasRows, total: totals("all").saldo, metas: metas.slice() };
  }
  const fechaLarga = (d) => d.toLocaleDateString("es-PE", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hour12: false });
  const sheetName = (s, used) => { let n = String(s).replace(/[\\\/\?\*\[\]:]/g, " ").trim().slice(0, 28) || "Recuento"; let k = n, i = 2; while (used.has(k.toLowerCase())) k = n.slice(0, 25) + " " + i++; used.add(k.toLowerCase()); return k; };

  async function buildExcel(Rs, per, general) {
    await loadLibs("excel");
    const wb = new window.ExcelJS.Workbook();
    const now = new Date();
    wb.creator = "CAJA"; wb.created = now;
    const MONEY = '#,##0.00;[Red]-#,##0.00';
    const INK = "FF1B1F27", MUTED = "FF6A7080", HEAD = "FF4B57C9", BAND = "FFF3F4FA";
    const head = (row) => { row.font = { bold: true, color: { argb: "FFFFFFFF" } }; row.eachCell({ includeEmpty: false }, (c) => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: HEAD } }; c.alignment = { vertical: "middle" }; }); row.height = 20; };
    const section = (ws, text) => { ws.addRow([]); const r = ws.addRow([text]); r.font = { bold: true, size: 12, color: { argb: INK } }; r.height = 20; };
    const band = (row, cols) => { for (let i = 1; i <= cols; i++) row.getCell(i).fill = { type: "pattern", pattern: "solid", fgColor: { argb: BAND } }; };
    const titleBlock = (ws, t) => {
      ws.addRow([t]).font = { bold: true, size: 16, color: { argb: INK } };
      ws.addRow([`Periodo: ${per.label}`]).font = { color: { argb: MUTED } };
      ws.addRow([`Generado: ${fechaLarga(now)}` + (rate() ? `  ·  Tipo de cambio: S/ ${rate().toFixed(3)}` : "")]).font = { color: { argb: MUTED } };
    };
    const used = new Set();

    function resumen(ws, R) {
      section(ws, "Totales del periodo (S/)");
      head(ws.addRow(["Concepto", "Monto S/"]));
      [["Ingresos", R.inn], ["Gastos", -R.out], ["Neto", R.neto]].forEach(([k, v], i) => { const r = ws.addRow([k, v]); r.getCell(2).numFmt = MONEY; if (i === 2) r.font = { bold: true }; });
      section(ws, "Saldo actual por cuenta");
      head(ws.addRow(["Cuenta", "Moneda", "Saldo", "Saldo en S/"]));
      R.cuentasRows.forEach((c, i) => { const r = ws.addRow([c.nombre, c.moneda === "USD" ? "Dólares" : "Soles", c.saldo, c.soles]); r.getCell(3).numFmt = MONEY; r.getCell(4).numFmt = MONEY; if (i % 2) band(r, 4); });
      const tr = ws.addRow(["Total", "", "", R.total]); tr.font = { bold: true }; tr.getCell(4).numFmt = MONEY;
      section(ws, "Gastos por categoría");
      head(ws.addRow(["Categoría", "Monto S/", "% del gasto", "Movimientos", "Tope mensual"]));
      R.catRows.forEach((c, i) => { const r = ws.addRow([c.cat, c.v, c.pct, c.n, c.tope]); r.getCell(2).numFmt = MONEY; r.getCell(3).numFmt = "0.0%"; r.getCell(5).numFmt = MONEY; if (i % 2) band(r, 5); });
      if (!R.catRows.length) ws.addRow(["Sin gastos en este periodo"]).font = { italic: true, color: { argb: MUTED } };
      if (R.metas.length) {
        section(ws, "Metas de ahorro");
        head(ws.addRow(["Meta", "Objetivo S/", "Ahorrado S/", "Avance"]));
        R.metas.forEach((g) => { const r = ws.addRow([g.nombre, g.objetivo, g.ahorrado, g.objetivo ? g.ahorrado / g.objetivo : 0]); r.getCell(2).numFmt = MONEY; r.getCell(3).numFmt = MONEY; r.getCell(4).numFmt = "0%"; });
      }
    }
    function movimientos(ws, R) {
      ws.columns = [
        { header: "Fecha", key: "fecha", width: 17 }, { header: "Tipo", key: "tipo", width: 14 }, { header: "Cuenta", key: "cuenta", width: 22 },
        { header: "Categoría", key: "cat", width: 15 }, { header: "Descripción", key: "desc", width: 32 }, { header: "Monto", key: "monto", width: 13 },
        { header: "Moneda", key: "moneda", width: 9 }, { header: "Monto en S/", key: "soles", width: 14 }, { header: "Saldo de la cuenta", key: "saldo", width: 18 }, { header: "Nota", key: "nota", width: 26 },
      ];
      head(ws.getRow(1));
      R.rows.forEach((r) => {
        const row = ws.addRow({ ...r, fecha: new Date(r.fecha.getTime() - r.fecha.getTimezoneOffset() * 60000), moneda: r.moneda === "USD" ? "US$" : "S/", soles: r.tipo === "Transferencia" ? null : r.soles });
        row.getCell("fecha").numFmt = "dd/mm/yyyy hh:mm";

      if (R.rows.length) {

  async function buildPdf(Rs, per, general) {

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const clean = (s) => String(s).replace(/−/g, "-").replace(/→/g, "a").replace(/[^\x20-\xFF\n]/g, "").trim();
    const money = (v, cur = "PEN") => clean(fmt(v, cur));
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
    const ACC = [75, 87, 201], INK = [27, 31, 39], MUTED = [106, 112, 128], LINE = [226, 228, 236], RED = [196, 60, 76], GREEN = [26, 135, 90];
    const now = new Date();
    const base = { theme: "plain", margin: { left: M, right: M, top: 50, bottom: 46 },
      styles: { font: "helvetica", fontSize: 9, textColor: INK, cellPadding: { top: 4, bottom: 4, left: 5, right: 5 }, lineColor: LINE },
      headStyles: { fillColor: ACC, textColor: 255, fontStyle: "bold" }, alternateRowStyles: { fillColor: [246, 247, 251] },
      didParseCell: (d) => { if (d.section !== "body") { const cs = (d.table.styles.columnStyles || {})[d.column.index]; if (cs && cs.halign) d.cell.styles.halign = cs.halign; } } };
    const title = (t, y) => { doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...INK); doc.text(clean(t), M, y); doc.setFont("helvetica", "normal"); };
    const room = (y, need) => { if (y + need > H - 60) { doc.addPage(); return 56; } return y; };
    function header(sub) {
      doc.setDrawColor(...ACC); doc.setLineWidth(1.4); doc.roundedRect(M, 40, 14, 12, 2, 2, "S"); doc.line(M + 4, 40, M + 10, 40);
      doc.setFillColor(214, 170, 100); doc.circle(M + 7, 35, 3, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(...INK); doc.text("CAJA", M + 22, 51);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
      doc.text(clean(sub), W - M, 44, { align: "right" }); doc.text(clean(per.label), W - M, 56, { align: "right" });
      doc.setDrawColor(...LINE); doc.setLineWidth(.6); doc.line(M, 68, W - M, 68);
    }
    function strip(y, items) {
      const bw = (W - 2 * M) / items.length;
      items.forEach(([k, v, col], i) => {
        const x = M + i * bw;
        doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(k, x, y);
        doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(...(col || INK)); doc.text(v, x, y + 17); doc.setFont("helvetica", "normal");

    }
    function recuento(R, y) {
      y = strip(y, [["Ingresos", money(R.inn), GREEN], ["Gastos", money(-R.out), RED], ["Neto", money(R.neto)], ["Saldo actual", money(R.total)]]);
      y = room(y + 10, 80); title("Saldo por cuenta", y);
      doc.autoTable({ ...base, startY: y + 8, head: [["Cuenta", "Moneda", "Saldo", "Saldo en S/"]],
        body: R.cuentasRows.length ? R.cuentasRows.map((c) => [clean(c.nombre), c.moneda === "USD" ? "Dólares" : "Soles", money(c.saldo, c.moneda), money(c.soles)]) : [["Sin cuentas", "", "", ""]],
        foot: [["Total", "", "", money(R.total)]], footStyles: { fontStyle: "bold", fillColor: [238, 240, 251] },
        columnStyles: { 2: { halign: "right" }, 3: { halign: "right" } } });
      y = room(doc.lastAutoTable.finalY + 24, 80); title("Gastos por categoría", y);
      doc.autoTable({ ...base, startY: y + 8, head: [["Categoría", "Monto", "% del gasto", "Movs.", "Tope"]],
        body: R.catRows.length ? R.catRows.map((c) => [c.cat, money(c.v), (c.pct * 100).toFixed(1) + "%", c.n, c.tope ? money(c.tope) : "-"]) : [["Sin gastos en este periodo", "", "", "", ""]],
        columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" } } });
      y = doc.lastAutoTable.finalY + 24;
      if (R.metas.length) {
        y = room(y, 70); title("Metas de ahorro", y);
        doc.autoTable({ ...base, startY: y + 8, head: [["Meta", "Objetivo", "Ahorrado", "Avance"]],
          body: R.metas.map((g) => [clean(g.nombre), money(g.objetivo), money(g.ahorrado), Math.round(g.objetivo ? (g.ahorrado / g.objetivo) * 100 : 0) + "%"]),

        y = doc.lastAutoTable.finalY + 24;

      doc.autoTable({ ...base, startY: y + 8, styles: { ...base.styles, fontSize: 8 },
        head: [["Fecha", "Cuenta", "Categoría", "Descripción", "Monto", "Saldo"]],
        body: R.rows.length ? R.rows.map((r) => [
          r.fecha.toLocaleDateString("es-PE", { day: "2-digit", month: "2-digit" }) + " " + r.fecha.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hour12: false }),
          clean(r.cuenta), r.cat, clean(r.desc) + (r.nota ? "\n" + clean(r.nota) : ""), money(r.monto, r.moneda), money(r.saldo, r.moneda)]) : [["", "", "", "Sin movimientos en este periodo", "", ""]],

    }

  }

  async function download(key) {
    const f = files[key];

    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {}
    if (!dl && !window.claude) {
      const link = document.createElement("a"); link.href = URL.createObjectURL(f.blob); link.download = f.name;
      document.body.append(link); link.click(); setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 1500); return;
    }
    if (!dl) { say("La descarga no está disponible en esta vista. Abre CAJA en claude.ai desde el navegador para guardar el archivo."); return; }
    try { await dl.save({ filename: f.name, data: f.blob }); }
    catch (e) {
      const c = e && e.code;
      if (c === "declined") return;
      say(c === "rate_limited" ? "Ya hay una descarga abierta. Espera un momento y vuelve a tocar el botón."

        await handle(text, null, { cmd: "mov", tipo: f.tipo, monto: d.monto, cur: d.cur, desc: d.desc ? cap(d.desc) : "", cat: gasto ? d.cat : "Ingreso", ids: [d.cuenta] });

    },

    tc: {

  function startFlow(kind, extra = {}) {

    clearTmp();
    if (flow) {
      if (/^(cancelar|cancela|salir)$/.test(norm(v))) { echo(v); cancelFlow(); return; }
      if (flow.input === "amount") { const a = amountIn(v); if (a) { echo(v); answer({ monto: a.v, cur: curIn(v) }); return; } }
      else if (flow.input === "text") { echo(v); answer(v.trim()); return; }
      endFlow();
    }
    handle(v);
  });
  // one delegated handler for every button the app draws
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t || !$("app").contains(t)) return;
    if (t.dataset.dl) return download(t.dataset.dl);
    if (t.dataset.clearfilter) { filterCat = null; return render(); }
    if (t.dataset.filtercat) { filterCat = t.dataset.filtercat; closeSheet(); return render(); }
    if (t.dataset.dup) {
      const m = movs.find((x) => x.id === t.dataset.dup); if (!m || !store) return;
      expanded.delete(m.id); buzz(15);
      if (m.tipo === "tr") return handle(m.texto, null, { cmd: "tr", monto: m.monto, cur: null, desde: m.desde, hacia: m.hacia });
      return handle(m.texto, null, { cmd: "mov", tipo: m.tipo, monto: m.monto, cur: null, desc: m.desc, cat: m.cat, ids: [m.cuenta] });
    }
    if (t.dataset.opt != null && t.dataset.step) return chooseOpt(+t.dataset.opt, +t.dataset.step);
    if (t.dataset.action) return runAction(t.dataset.action);
    if (t.dataset.cancel) return cancelFlow();
    if (t.dataset.mov) return startFlow("delmov", { d: { id: t.dataset.mov } });
    if (t.dataset.libro) { closeSheet(); if (t.dataset.libro !== activo) setLibro(t.dataset.libro); return; }
    if (t.dataset.meta && store) { clearTmp(); return handle("meta " + t.dataset.meta); }
    if (t.dataset.pick && store && pendingText) { const p = pendingText; clearTmp(); return handle(p, t.dataset.pick); }
    if (t.classList.contains("acard") && t.dataset.id) { filterCat = null; buzz(6); return setSel(t.dataset.id); }
  });

  // voice dictation where the viewer's browser supports it
  let dict = null, dictBase = "";
  (async () => {
    try { dict = window.claude && window.claude.use ? await window.claude.use("dictation") : null; } catch (e) { dict = null; }
    if (!dict) return;
    $("mic").hidden = false;
    dict.onPartial(({ text }) => { $("entrada").value = dictBase + text; });
    dict.onFinal(({ text }) => { dictBase += text + " "; $("entrada").value = dictBase; });
    dict.onState(({ state }) => { $("mic").classList.toggle("on", state === "listening"); });
  })();
  $("mic").addEventListener("click", () => {
    if (!dict) return;
    if ($("mic").classList.contains("on")) { dict.stop().catch(() => {}); return; }
    dictBase = $("entrada").value ? $("entrada").value + " " : "";
    dict.start().catch((e) => { if (e && e.code === "not_granted") $("mic").hidden = true; });
  });

  setInterval(() => { const e = document.querySelectorAll(".caji .c-eyes"); e.forEach((x) => { x.classList.remove("blink"); void x.getBBox(); x.classList.add("blink"); }); }, 4200);
  // "Instalar app" chip when the browser offers it (hosted standalone version)
  let installEvt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; renderChips(); });
  window.addEventListener("appinstalled", () => { installEvt = null; renderChips(); say("¡CAJA quedó instalada! Ábrela desde tu pantalla de inicio."); });
  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-install]"); if (!t || !installEvt) return;
    installEvt.prompt(); try { await installEvt.userChoice; } catch (er) {} installEvt = null; renderChips();
  });
  window.__cajaInstall = () => installEvt;
  applyPrefs();
  render();
  connect();
})();
</script>
