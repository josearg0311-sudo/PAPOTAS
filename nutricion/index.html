<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="nutri-pwa" content="1">
<meta name="theme-color" content="#2C6A4D">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<!--APP-->
<title>Balanza y Plato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: app de una columna (máx. 1040px) con cabecera fija y pestañas; en pantallas anchas, "Armar comida" va en dos columnas (plato | buscador) */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --sunk:#E6EDE8; --ink:#16211D; --muted:#5A6963; --line:#D5DFD9;
  --accent:#2C6A4D; --accent-ink:#FFFFFF; --hi:#B57A0C; --warn:#B4472E; --ok:#2C7A4C; --scrim:rgba(10,20,15,.55);
  --c0:#1D7385; --c1:#8C4878; --c2:#9E6612; --c3:#3F5FA8; --c4:#2C7A4C; --c5:#A3434F;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18201C; --sunk:#212B26; --ink:#E5EDE8; --muted:#97A69F; --line:#2D3933;
  --accent:#6CBD8C; --accent-ink:#0F1512; --hi:#E5B04A; --warn:#E8826A; --ok:#6CBD8C; --scrim:rgba(0,0,0,.7);
  --c0:#5BB7CA; --c1:#CB8CB9; --c2:#DDAA55; --c3:#8EA6E6; --c4:#6CBD8C; --c5:#E38B97; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18201C; --sunk:#212B26; --ink:#E5EDE8; --muted:#97A69F; --line:#2D3933;
  --accent:#6CBD8C; --accent-ink:#0F1512; --hi:#E5B04A; --warn:#E8826A; --ok:#6CBD8C; --scrim:rgba(0,0,0,.7);
  --c0:#5BB7CA; --c1:#CB8CB9; --c2:#DDAA55; --c3:#8EA6E6; --c4:#6CBD8C; --c5:#E38B97; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.4rem}
h3{font-size:1rem;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.note{font-size:.8rem;color:var(--muted);max-width:72ch}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* botones y campos */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .86rem var(--f-body);padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:4px 10px;font-size:.78rem;min-height:30px}
.btn.icon{width:34px;min-height:34px;padding:0;font-size:1rem}
.btn[aria-pressed="true"]{background:var(--sunk);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
input[type=number],input[type=date],input[type=text],input[type=password],input[type=search],select,textarea{font:500 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.full{grid-column:1/-1}
.cks{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:.88rem}
.cks label{display:flex;gap:7px;align-items:center;cursor:pointer}
.cks input,.ck{accent-color:var(--accent);width:18px;height:18px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand h1{font-size:1.45rem;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.av{width:30px;height:30px;border-radius:50%;background:var(--uc);color:var(--surface);display:grid;place-items:center;font:700 .85rem var(--f-body);flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 .9rem var(--f-body);padding:10px 11px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 56px;display:grid;gap:18px}

/* barras */
.bar{position:relative;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--warn)}
.macro{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.macro .bar{height:6px}
.macro>span:last-child{color:var(--muted)}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.hi{color:var(--hi)} .pill.warn{color:var(--warn)} .pill.mu{color:var(--muted)}

/* hoy */
.datenav{display:flex;align-items:center;gap:6px}
.equation{display:grid;grid-template-columns:repeat(7,auto);align-items:end;justify-content:start;gap:4px 12px;overflow-x:auto}
.equation div{display:grid}
.equation b{font:500 1.35rem var(--f-mono);letter-spacing:-.02em}
.equation small{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.equation .op{font:400 1.2rem var(--f-mono);color:var(--muted);padding-bottom:16px}
.equation .res b{color:var(--accent)}
.equation .res.neg b{color:var(--warn)}
@media (max-width:560px){.equation{gap:4px 8px}.equation b{font-size:1.1rem}}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{appearance:none;width:30px;height:38px;border:2px solid var(--c0);border-top-width:0;border-radius:0 0 7px 7px;background:none;cursor:pointer;position:relative;padding:0}
.glass.on{background:linear-gradient(to top,var(--c0) 75%,transparent 75%)}
.meal{padding:0;overflow:hidden}
.meal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.meal .mh h3{font-family:var(--f-display);font-weight:400;font-size:1.12rem}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 14px;border-top:1px dashed var(--line);font-size:.9rem}
.items li .q{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.mf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{appearance:none;border:0;padding:0;background:none;cursor:pointer;border-radius:8px;overflow:hidden;width:54px;height:54px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.empty{color:var(--muted);font-size:.88rem;padding:10px 14px;border-top:1px dashed var(--line)}

/* armar */
.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.builder{grid-template-columns:1fr}}
.plate li{grid-template-columns:minmax(0,1fr) 92px auto}
.plate .nm{min-width:0}
.plate .nm small{display:block;color:var(--muted);font-size:.76rem;font-family:var(--f-mono)}
.gin{display:flex;align-items:center;gap:4px}
.gin input{padding:6px 6px;text-align:right;font-family:var(--f-mono)}
.gin span{font-size:.78rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font:600 .8rem var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.flist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0}
.flist .fn{font-weight:600;font-size:.92rem}
.flist .fm{font-size:.76rem;color:var(--muted);font-family:var(--f-mono)}
.flist .tg{font-size:.7rem;font-weight:700;color:var(--hi);margin-left:6px}
.flist li.excl .fn{text-decoration:line-through;color:var(--muted)}
.tog{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1rem;line-height:1;display:inline-grid;place-items:center}
.tog.fav[aria-pressed="true"]{color:var(--hi);border-color:var(--hi)}
.tog.ex[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.add{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font:700 1.1rem var(--f-body)}

/* tablas, listas */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}

/* peso */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);padding:12px 14px}
.stat small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat b{font:500 1.3rem var(--f-mono)}
.chart svg{display:block;width:100%;height:auto}
.proj{font-size:.9rem;padding:10px 14px;border-radius:10px;background:var(--sunk)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:720px){.twocol{grid-template-columns:1fr}}

/* fotos */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ph{appearance:none;border:0;padding:0;cursor:pointer;background:var(--sunk);border-radius:10px;overflow:hidden;aspect-ratio:1;position:relative;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:6px;font-size:.68rem;font-weight:700;background:var(--surface);color:var(--ink);padding:1px 7px;border-radius:99px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0;display:grid;gap:4px}
.compare img{border-radius:10px;aspect-ratio:3/4;object-fit:cover;width:100%;background:var(--sunk)}
.compare figcaption{font-size:.8rem;color:var(--muted)}

/* etiqueta nutricional */
.nlabel{border:2px solid var(--ink);padding:8px 10px;font-size:.86rem;background:var(--surface);max-width:420px}
.nlabel .ttl{font-family:var(--f-display);font-size:1.2rem;border-bottom:8px solid var(--ink);padding-bottom:2px;margin-bottom:2px}
.nlabel .ln{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ink);padding:3px 0}
.nlabel .ln.thick{border-bottom-width:4px}
.nlabel .ln.ind{padding-left:14px}
.nlabel .ln span:last-child{font-family:var(--f-mono)}
.nlabel .foot{font-size:.72rem;color:var(--muted);padding-top:5px;line-height:1.4}

/* acceso */
.gate{min-height:100%;display:grid;place-items:start center;padding-block:7vh 40px}
.gate .box{width:100%;max-width:520px;display:grid;gap:18px}
.gate h1{font-size:2.2rem}
.gate h1 span{color:var(--accent)}
.users{display:flex;gap:10px;flex-wrap:wrap}
.ubtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px 10px 10px;display:flex;gap:10px;align-items:center;cursor:pointer;font:600 .95rem var(--f-body)}
.ubtn[aria-pressed="true"]{border-color:var(--uc);box-shadow:inset 0 0 0 1px var(--uc)}
.err{color:var(--warn);font-size:.86rem;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;display:grid;gap:10px;background:var(--surface)}
legend{font-weight:700;padding:0 6px;display:flex;gap:8px;align-items:center}

/* hoja y aviso */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{background:var(--surface);border-radius:14px;max-width:720px;width:100%;max-height:100%;overflow:auto;padding:14px;display:grid;gap:10px}
.sheet img{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--sunk)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.banner{border:1px solid var(--hi);background:color-mix(in srgb,var(--hi) 10%,var(--surface));border-radius:12px;padding:12px 14px;font-size:.92rem}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.86rem}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent)}
footer{border-top:1px solid var(--line);padding-block:16px 28px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}
</style>
</head>

/* ---------- Contraseñas (PBKDF2, nunca se guarda la contraseña) ---------- */
const b64=u=>btoa(String.fromCharCode(...u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPass(pass,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador no permite cifrar contraseñas. Abre la app desde su dirección https.');
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},key,256);
  return b64(new Uint8Array(bits));
}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));

const PH={db:null,urls:{},
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open('nutri-fotos',1)}catch(e){return rej(e)}
    r.onupgradeneeded=()=>{const s=r.result.createObjectStore('fotos',{keyPath:'id'});s.createIndex('uid','uid')};
    r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('fotos',mode);const st=t.objectStore('fotos');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error)})},
  put(o){return this.tx('readwrite',s=>s.put(o))},
  del(id){if(this.urls[id]){URL.revokeObjectURL(this.urls[id]);delete this.urls[id]}return this.tx('readwrite',s=>s.delete(id))},
  byUser(u){return this.tx('readonly',s=>s.index('uid').getAll(u)).then(a=>(a||[]).sort((x,y)=>y.ts-x.ts))},
  url(f){return this.urls[f.id]||(this.urls[f.id]=URL.createObjectURL(f.blob))}
};
async function compress(file){
  let src,w,h;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('No se pudo leer la imagen.'));i.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  const s=Math.min(1,1400/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('No se pudo comprimir la foto.')),'image/jpeg',.82));
}

/* ---------- Cálculos ---------- */
function calc(p){
  const m=p.cm/100,imc=p.kg/(m*m);
  const bmr=10*p.kg+6.25*p.cm-5*p.edad+(p.sexo==='h'?5:-161);
  const tdee=bmr*ACT[p.act].f;
  const delta=p.meta==='perder'?-p.ritmo*7700/7:p.meta==='ganar'?Math.min(p.ritmo,.5)*7700/7:0;
  const piso=Math.max(p.sexo==='h'?1500:1200,bmr);
  let kcal=Math.round((tdee+delta)/10)*10,limitado=false;
  if(kcal<piso){kcal=Math.round(piso/10)*10;limitado=true}
  const pesoRef=imc>30?25*m*m:p.kg;
  const gkg={perder:1.8,mantener:1.4,ganar:1.8}[p.meta]+(p.reparto==='proteico'?.4:0);
  const pg=Math.round(pesoRef*gkg);
  let gg,cg;
  if(p.reparto==='bajo'){cg=Math.round(kcal*.2/4);gg=Math.round((kcal-pg*4-cg*4)/9)}
  else{gg=Math.round(kcal*(p.reparto==='proteico'?.25:.3)/9);cg=Math.round((kcal-pg*4-gg*9)/4)}
  if(cg<0){cg=0;gg=Math.round((kcal-pg*4)/9)}
  const realDelta=kcal-tdee;
  return{imc,bmr,tdee,kcal,pg,gg,cg,fibra:Math.round(kcal/1000*14),agua:Math.round(p.kg*35/50)*50,
    limitado,pesoRef,gkg,realDelta,kgSemana:realDelta*7/7700,sano:[18.5*m*m,24.9*m*m]};
}
function imcTxt(i){return i<18.5?'Bajo peso':i<25?'Normal':i<30?'Sobrepeso':'Obesidad'}
const exKcal=(met,min,kg)=>met*3.5*kg/200*min;
const stepsKcal=(pasos,kg)=>pasos*.0005*kg;

function blocked(f,p){
  const fl=f.fl||'';
  if(p.dieta==='vege'&&/[CPM]/.test(fl))return'No vegetariano';
  if(p.dieta==='pesce'&&/C/.test(fl))return'Lleva carne';
  if(p.dieta==='vegana'&&/[CPMEDH]/.test(fl))return'No vegano';
  for(const k in ALERG)if(p.alerg[k]&&fl.includes(ALERG[k][1]))return k==='gluten'?'Tiene gluten':k==='lactosa'?'Tiene lactosa':'Alergia: '+ALERG[k][0].toLowerCase();
  return'';
}
const usable=f=>!U.excl[f.id]&&!blocked(f,U.perfil);
const itemFrom=(f,g)=>({id:uid(),f:f.id,n:f.n,k:f.k,p:f.p,c:f.c,gr:f.g,fb:f.fb,g,porN:f.porN,porG:f.porG});
const itemT=it=>({k:it.k*it.g/100,p:it.p*it.g/100,c:it.c*it.g/100,g:it.gr*it.g/100,fb:it.fb*it.g/100});
function sum(items){return items.reduce((t,it)=>{const x=itemT(it);for(const k in t)t[k]+=x[k];return t},{k:0,p:0,c:0,g:0,fb:0})}
function day(f,create){if(!U.dias[f]){if(!create)return{c:{},ej:[],agua:0,pasos:0,nota:''};U.dias[f]={c:{},ej:[],agua:0,pasos:0,nota:''}}return U.dias[f]}
function dayFood(f){const d=day(f);return sum(MEALS.flatMap(m=>d.c[m.k]||[]))}
function dayEx(f){const d=day(f);return d.ej.reduce((a,e)=>a+e.kcal,0)+stepsKcal(d.pasos||0,U.perfil.kg)}
function budget(f){const c=calc(U.perfil);const ex=dayEx(f);const add=ex*(U.perfil.ejPct/100);return{c,ex,add,total:c.kcal+add}}
function mealTarget(mk,f){const b=budget(f);const sh=(U.perfil.comidas[mk]||0)/100;return{k:b.total*sh,p:b.c.pg*sh}}

/* ---------- Armar: ajuste y sugerencias ---------- */
function ajustar(items,tK,tP){
  if(!items.length||tK<=0)return;
  const fixed=it=>it.k>=800;
  const isP=it=>!fixed(it)&&it.p*4/Math.max(it.k,1)>=.3;
  const A=items.filter(isP),B=items.filter(it=>!isP(it)&&!fixed(it));
  if(A.length){const pA=sum(A).p;if(pA>0){const f=clamp(tP*.8/pA,.25,4);A.forEach(it=>it.g*=f)}}
  const kFixed=sum(items.filter(fixed)).k,kA=sum(A).k;
  if(B.length){const kB=sum(B).k;if(kB>0){const f=clamp((tK-kA-kFixed)/kB,.25,4);B.forEach(it=>it.g*=f)}}
  const k2=sum(items).k;if(k2>0){const f=clamp(tK/k2,.5,2);if(Math.abs(f-1)>.08)items.filter(it=>!fixed(it)).forEach(it=>it.g*=f)}
  items.forEach(it=>it.g=Math.max(5,Math.round(it.g/5)*5));
}
const NOT_SUG=/\(crud|\(seca|polvo|Harina|Maicena|Panceta|Manteca|Chicharr|Hígado|Costilla|Morcilla|Chorizo|Salami|Mortadela|frit|Frita|Yema|Leche condensada|Leche en polvo|Nata|Crema|Ghee|Mantequilla$/;
function pool(role,mk){
  const F=allFoods().filter(f=>usable(f)&&!NOT_SUG.test(f.n));
  const pr=f=>f.p*4/Math.max(f.k,1);
  switch(role){
    case'protMain':return F.filter(f=>['Carnes y aves','Pescados','Mariscos','Huevos'].includes(f.cat)||(f.cat==='Legumbres y proteína vegetal'&&pr(f)>=.3&&!/Hummus|Falafel|refritos|Gallo/.test(f.n)));
    case'protBreak':return F.filter(f=>['Huevos'].includes(f.cat)||(f.cat==='Lácteos'&&/Yogur|Kéfir|Requesón|Leche/.test(f.n))||(f.cat==='Quesos'&&/Burgos|blanco|ricotta|cottage|mozzarella|mano/i.test(f.n))||/Fiambre de pavo|Jamón cocido|Tofu firme|Yogur de soja|Bebida de soja/.test(f.n));
    case'carbMain':return F.filter(f=>(['Cereales, arroz y pasta','Tubérculos y plátanos'].includes(f.cat)&&/cocid|horno|horneado|asada|Arroz con coco/.test(f.n))||(f.cat==='Legumbres y proteína vegetal'&&/Caraotas|Frijoles rojos|Frijoles pintos|Garbanzos cocidos|Alubias|Lentejas cocidas/.test(f.n))||(f.cat==='Panes, arepas y masas'&&/Arepa \(asada|Tortilla de maíz|Pan integral/.test(f.n)));
    case'carbBreak':return F.filter(f=>(f.cat==='Panes, arepas y masas'&&/Arepa \(asada|integral|centeno|sin gluten|Tortilla de maíz|Cachapa/.test(f.n))||/Copos de avena|Avena sin gluten|Muesli|Granola|Cereales integrales|Tortitas/.test(f.n));
    case'veg':return F.filter(f=>f.cat==='Verduras y hortalizas'&&!/Ajo|Cilantro|Perejil|Aceitunas|Pepinillos|Chucrut|Jalape|Ají|triturado|asado|Cebolleta|Puerro|Rábano|Brotes|Palmito|congeladas/.test(f.n));
    case'fruit':return F.filter(f=>f.cat==='Frutas'&&!/Dátiles|Pasas|pasas|Orejones|Coco|Tamarindo|Aguacate|Limón|Lima|Compota|almíbar/.test(f.n));
    case'fat':return F.filter(f=>/^Aceite de oliva$|Aguacate|^Almendras$|^Nueces$|Semillas de chía|Linaza/.test(f.n));
    case'oil':return F.filter(f=>/^Aceite de oliva$|^Aceite de aguacate$/.test(f.n));
    case'snack':return F.filter(f=>/Yogur griego|skyr|Requesón|Kéfir|^Almendras$|^Nueces$|Maní|Pistachos|Yogur de soja|Hummus|Yogur natural$|Queso fresco tipo Burgos|Huevo cocido/.test(f.n));
  }
  return[];
}
function pickFrom(arr,taken){
  const a=arr.filter(f=>!taken.has(f.id));if(!a.length)return null;
  const fav=a.filter(f=>U.fav[f.id]);const src=fav.length&&Math.random()<.7?fav:a;
  return src[Math.floor(Math.random()*src.length)];
}
function sugerir(mk){
  const T={desayuno:['protBreak','carbBreak','fruit'],media:['fruit','snack'],almuerzo:['protMain','carbMain','veg','veg','oil'],
    merienda:['snack','fruit'],cena:['protMain','veg','veg',Math.random()<.5?'carbMain':'fat','oil']}[mk];
  const taken=new Set(),items=[];
  T.forEach(r=>{const f=pickFrom(pool(r,mk),taken);if(f){taken.add(f.id);items.push(itemFrom(f,r==='oil'?10:(f.porG&&f.porG<=250?f.porG:100)))}});
  return items;
}

function macroRow(label,v,t,unit='g'){
  const w=t>0?Math.min(100,v/t*100):0;const over=v>t*1.1;
  return`<div class="macro"><span>${label}</span><div class="bar"><i class="${over?'over':''}" style="width:${w.toFixed(1)}%"></i></div><span class="num">${n0(v)} / ${n0(t)} ${unit}</span></div>`;
}

  if(q)L.sort((a,b)=>(a.s.startsWith(q)?0:1)-(b.s.startsWith(q)?0:1)||a.n.localeCompare(b.n,'es'));

/* ---------- Peso ---------- */
function linreg(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;let nu=0,de=0;pts.forEach(p=>{nu+=(p.x-mx)*(p.y-my);de+=(p.x-mx)**2});const b=de?nu/de:0;return{b,a:my-b*mx}}
function vPeso(){
  const p=U.perfil,ws=U.pesos,c=calc(p),goal=p.objetivo;
  const form=`<form id="f-peso" class="card stack"><h3>Nuevo registro</h3>
    <div class="grid3"><label class="f">Fecha<input type="date" id="w-d" value="${todayISO()}" required></label>
    <label class="f">Peso (kg)<input type="number" id="w-kg" step="0.1" min="25" max="350" value="${p.kg}" required></label>
    <label class="f">Cintura (cm)<input type="number" id="w-cin" step="0.5" min="40" max="250" placeholder="opcional"></label></div>
    <button class="btn primary" type="submit" style="justify-self:start">Guardar peso</button>
    <p class="note">Pésate en ayunas, el mismo día de la semana. Al guardar, tus calorías se recalculan con el peso nuevo.</p></form>`;
  const kcalWeek=weekKcal();
  if(!ws.length)return`<div class="sechead"><div><h2>Peso</h2><p class="sub">Apunta tu primer peso para empezar la gráfica.</p></div></div><div class="twocol">${form}${kcalWeek}</div>${progressPhotos()}`;
  const t0=parseISO(ws[0].d).getTime(),DAY=864e5;
  const pts=ws.map(w=>({x:(parseISO(w.d).getTime()-t0)/DAY,y:w.kg}));
  const recent=pts.slice(-8),{a,b}=linreg(recent);
  const cur=ws[ws.length-1].kg,first=ws[0].kg,perWeek=b*7;
  let proj='Con dos registros o más te digo a qué ritmo vas y cuándo llegarías a tu objetivo.';
  if(pts.length>=2){const toGo=goal-cur;
    if(Math.abs(toGo)<.2)proj='<b>Estás en tu peso objetivo.</b> Ahora toca mantener.';
    else if(Math.sign(toGo)===Math.sign(b)&&Math.abs(b)>1e-4){const dd=addDays(ws[ws.length-1].d,Math.round(toGo/b));proj=`Al ritmo de las últimas semanas (<b class="num">${perWeek>0?'+':''}${n2(perWeek)} kg/semana</b>) llegarás a <b>${n1(goal)} kg</b> hacia el <b>${fdate(dd)}</b>.`}
    else proj=`Al ritmo actual (<span class="num">${perWeek>0?'+':''}${n2(perWeek)} kg/semana</span>) no te acercas al objetivo. Revisa lo que comes en la pestaña Hoy o ajusta tu meta en Perfil.`}
  const W=640,H=250,L=40,R=14,TP=14,B=28;
  const ys=pts.map(q=>q.y).concat(goal),ymin=Math.floor(Math.min(...ys)-1),ymax=Math.ceil(Math.max(...ys)+1);
  const xmax=Math.max(1,pts[pts.length-1].x);
  const X=x=>L+(x/xmax)*(W-L-R),Y=y=>TP+(ymax-y)/(ymax-ymin)*(H-TP-B);
  const step=Math.max(1,Math.ceil((ymax-ymin)/5));
  let grid='';for(let y=ymin;y<=ymax;y+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(y)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="DM Mono, monospace">${y}</text>`;
  const idx=[...new Set([0,Math.floor((ws.length-1)/2),ws.length-1])];
  const xl=idx.map(k=>`<text x="${X(pts[k].x)}" y="${H-8}" text-anchor="${k===0?'start':k===ws.length-1?'end':'middle'}" font-size="11" fill="var(--muted)">${fdate(ws[k].d)}</text>`).join('');
  const line=pts.map((q,k)=>(k?'L':'M')+X(q.x).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
  const area=line+` L${X(pts[pts.length-1].x).toFixed(1)} ${H-B} L${X(pts[0].x).toFixed(1)} ${H-B} Z`;
  const tx0=recent[0].x,tx1=recent[recent.length-1].x;
  const uc=COLORS[ME.color];
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tu peso">${grid}
    <line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="${W-R}" y="${Y(goal)-6}" text-anchor="end" font-size="11" fill="var(--accent)" font-weight="600">Objetivo ${n1(goal)} kg</text>
    <path d="${area}" fill="${uc}" opacity=".1"/><path d="${line}" fill="none" stroke="${uc}" stroke-width="2.5" stroke-linejoin="round"/>
    ${recent.length>=2?`<line x1="${X(tx0)}" y1="${Y(a+b*tx0)}" x2="${X(tx1)}" y2="${Y(a+b*tx1)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".55"/>`:''}
    ${pts.map((q,k)=>`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="${k===pts.length-1?5:3}" fill="${k===pts.length-1?uc:'var(--surface)'}" stroke="${uc}" stroke-width="2"/>`).join('')}
    <text x="${X(pts[pts.length-1].x)-8}" y="${Y(cur)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="DM Mono, monospace">${n1(cur)} kg</text>${xl}</svg>`;
  const cin=ws.filter(w=>w.cin);
  return`<div class="sechead"><div><h2>Peso</h2><p class="sub">La línea discontinua es tu tendencia de las últimas 8 mediciones. Las subidas sueltas no importan, importa la tendencia.</p></div></div>
  <div class="stats">
    <div class="stat"><small>Peso actual</small><b>${n1(cur)}</b> kg</div>
    <div class="stat"><small>Desde ${fdate(ws[0].d)}</small><b>${cur-first>0?'+':''}${n1(cur-first)}</b> kg</div>
    <div class="stat"><small>Faltan</small><b>${n1(Math.abs(goal-cur))}</b> kg</div>
    <div class="stat"><small>IMC · ${imcTxt(c.imc)}</small><b>${n1(c.imc)}</b></div>
  </div>
  <div class="card chart">${svg}</div>
  <div class="proj">${proj}</div>
  ${cin.length>=2?`<p class="note">Cintura: ${n1(cin[0].cin)} cm el ${fdate(cin[0].d)} → ${n1(cin[cin.length-1].cin)} cm ahora. La cintura dice más que la báscula sobre la grasa abdominal.</p>`:''}
  <div class="twocol">${form}
    <div class="tablewrap"><table><tr><th>Fecha</th><th>Peso</th><th>Cambio</th><th>Cintura</th><th></th></tr>
    ${ws.map((w,k)=>({w,k})).slice(-8).reverse().map(({w,k})=>`<tr><td>${fdate(w.d)}</td><td class="num">${n1(w.kg)}</td><td class="num">${k?((w.kg-ws[k-1].kg)>0?'+':'')+n1(w.kg-ws[k-1].kg):'—'}</td><td class="num">${w.cin?n1(w.cin):'—'}</td><td><button class="btn small" data-a="wDel:${k}" aria-label="Borrar el registro del ${fdate(w.d)}">Borrar</button></td></tr>`).join('')}
    </table></div></div>
  ${kcalWeek}
  ${progressPhotos()}`;
}
function weekKcal(){
  const days=Array.from({length:7},(_,i)=>addDays(todayISO(),i-6));
  const vals=days.map(x=>({x,k:dayFood(x).k,t:budget(x).total}));
  const logged=vals.filter(v=>v.k>0);
  const avg=logged.length?logged.reduce((a,v)=>a+v.k,0)/logged.length:0;
  const mx=Math.max(...vals.map(v=>Math.max(v.k,v.t)),1);
  return`<section class="card stack"><div class="row between"><h3>Calorías de la semana</h3><span class="muted num">media ${n0(avg)} kcal · ${logged.length}/7 días apuntados</span></div>
    <div class="stack" style="gap:6px">${vals.map(v=>`<div class="macro"><span>${fdate(v.x)}</span><div class="bar"><i class="${v.k>v.t*1.05?'over':''}" style="width:${(v.k/mx*100).toFixed(1)}%"></i></div><span class="num">${n0(v.k)} / ${n0(v.t)}</span></div>`).join('')}</div></section>`;
}

const TIPON={comida:'Plato',progreso:'Progreso',otra:'Foto'};
async function fillPhotos(){
  let all;try{all=await PH.byUser(ME.id)}catch(e){document.querySelectorAll('[data-gallery]').forEach(el=>el.innerHTML='<p class="err">Este navegador no deja guardar fotos (modo privado o almacenamiento bloqueado).</p>');return}
  document.querySelectorAll('[data-thumbs]').forEach(el=>{const[f,m]=el.dataset.thumbs.split('|');
    el.innerHTML=all.filter(p=>p.fecha===f&&p.meal===m).map(p=>`<button data-a="verFoto:${p.id}" aria-label="Ver foto"><img src="${PH.url(p)}" alt="Foto del plato"></button>`).join('')});
  const g=document.querySelector('[data-gallery]');
  if(g){const L=all.filter(p=>ui.fotos.tipo==='todas'||p.tipo===ui.fotos.tipo);
    g.innerHTML=L.length?`<div class="gallery">${L.map(p=>`<button class="ph" data-a="verFoto:${p.id}" aria-label="Ver foto del ${fdate(p.fecha)}"><img src="${PH.url(p)}" alt="" loading="lazy"><span>${fdate(p.fecha)} · ${p.meal?MEALN[p.meal]:TIPON[p.tipo]}</span></button>`).join('')}</div>`
      :'<p class="muted">Todavía no hay fotos aquí. Usa «Tomar foto» o el botón de cada comida en la pestaña Hoy.</p>';
    const st=document.querySelector('[data-storage]');
    if(st&&navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{st.textContent=`${all.length} fotos tuyas. Espacio usado por la app en este aparato: ${n1((e.usage||0)/1048576)} MB.`}).catch(()=>{})}
  const cmp=document.querySelector('[data-compare]');
  if(cmp){const pr=all.filter(p=>p.tipo==='progreso').sort((a,b)=>a.ts-b.ts);
    cmp.innerHTML=pr.length>=2?`<div class="compare">${[pr[0],pr[pr.length-1]].map((p,i)=>`<figure><img src="${PH.url(p)}" alt="Foto de progreso del ${fdate(p.fecha)}"><figcaption>${i?'Ahora':'Al empezar'} · ${fdate(p.fecha)}</figcaption></figure>`).join('')}</div>`
      :pr.length?`<p class="muted">Tienes 1 foto. Con la siguiente verás el antes y el después lado a lado.</p>`:'<p class="muted">Una foto cada 2-4 semanas, misma luz y misma ropa, enseña cambios que la báscula no ve.</p>'}
  if(ui.sheet){const p=all.find(x=>x.id===ui.sheet);const im=document.getElementById('sheet-img');if(p&&im)im.src=PH.url(p)}
}
function vSheet(){
  return`<div class="sheet"><div class="in" data-stop>
    <img id="sheet-img" alt="Foto">
    <div class="row between"><span id="sheet-info" class="muted"></span>
      <div class="row">${ui.confirm==='foto'?`<span class="confirm">¿Borrar esta foto? <button class="btn small danger" data-a="fotoDelYes">Sí, borrar</button><button class="btn small" data-a="cancel">No</button></span>`:`<button class="btn small danger" data-a="fotoDel">Borrar</button>`}
      <button class="btn small" data-a="closeSheet">Cerrar</button></div></div></div></div>`;
}
async function handlePhoto(input){
  const[tipo,fecha,meal]=input.dataset.photo.split('|');const files=[...input.files];input.value='';
  if(!files.length)return;
  try{for(const file of files){const blob=await compress(file);await PH.put({id:uid(),uid:ME.id,tipo,fecha,meal:meal||'',ts:Date.now(),blob})}
    toast(files.length>1?`${files.length} fotos guardadas.`:'Foto guardada.');render()}
  catch(e){toast(e.message||'No se pudo guardar la foto.')}
}

/* ---------- Perfil ---------- */
function vPerfil(){
  const p=U.perfil,c=calc(p);
  const num=(k,label,attrs)=>`<label class="f">${label}<input type="number" id="pf-${k}" data-f="pf:${k}" value="${p[k]}" ${attrs}></label>`;
  const sel=(k,label,opts)=>`<label class="f">${label}<select id="pf-${k}" data-f="pf:${k}">${Object.entries(opts).map(([v,o])=>`<option value="${v}" ${String(p[k])===v?'selected':''}>${typeof o==='string'?o:o.n}</option>`).join('')}</select></label>`;
  const sumC=MEALS.reduce((a,m)=>a+(+p.comidas[m.k]||0),0);
  const semanas=p.meta!=='mantener'&&Math.abs(c.kgSemana)>.01?Math.abs((p.objetivo-p.kg)/c.kgSemana):0;
  return`${!p.completo?`<div class="banner"><b>Hola, ${esc(ME.nombre)}.</b> Completa tus datos y pulsa «Guardar perfil» para calcular tus calorías y nutrientes.</div>`:''}
  <div class="sechead"><div><h2>Perfil de ${esc(ME.nombre)}</h2><p class="sub">Cualquier cambio recalcula tus calorías al momento.</p></div></div>
  <div class="twocol">
    <section class="card stack">
      <h3>Tus datos</h3>
      <div class="grid2">
        ${sel('sexo','Sexo',{m:'Mujer',h:'Hombre'})}
        ${num('edad','Edad (años)','min="14" max="100" step="1"')}
        ${num('cm','Altura (cm)','min="120" max="230" step="1"')}
        ${num('kg','Peso actual (kg)','min="30" max="350" step="0.1"')}
        ${num('objetivo','Peso objetivo (kg)','min="30" max="350" step="0.1"')}
        ${sel('meta','Meta',METAS)}
        <div class="full">${sel('act','Actividad diaria',ACT)}</div>
        ${p.meta!=='mantener'?sel('ritmo','Ritmo',p.meta==='perder'?{'0.25':'0,25 kg/semana (suave)','0.5':'0,5 kg/semana (recomendado)','0.75':'0,75 kg/semana','1':'1 kg/semana (exigente)'}:{'0.25':'0,25 kg/semana (recomendado)','0.5':'0,5 kg/semana'}):'<span></span>'}
        ${sel('reparto','Reparto de nutrientes',REPARTOS)}
      </div>
      <h3>Alimentación</h3>
      ${sel('dieta','Tipo de dieta',DIETAS)}
      <div class="cks"><span class="lbl" style="width:100%">Alergias o intolerancias (se ocultan de las sugerencias)</span>${Object.entries(ALERG).map(([k,[n]])=>`<label><input type="checkbox" id="pf-al-${k}" data-f="alerg:${k}" ${p.alerg[k]?'checked':''}>${n}</label>`).join('')}</div>
      <div><span class="lbl">Reparto de calorías por comida (%)</span>
        <div class="grid3" style="margin-top:6px">${MEALS.map(m=>`<label class="f">${m.n}<input type="number" id="pf-c-${m.k}" min="0" max="100" step="5" value="${p.comidas[m.k]||0}" data-f="comida:${m.k}"></label>`).join('')}</div>
        <p class="note" style="margin-top:4px">${sumC===100?'Suma 100 %.':`Suma ${sumC} %: ajusta para que sume 100 %. Pon 0 en una comida que no hagas.`}</p></div>
      ${sel('ejPct','Calorías del ejercicio que se suman a tu día',{'0':'Ninguna (más rápido para perder peso)','50':'La mitad (recomendado)','75':'Tres cuartos','100':'Todas'})}
      ${!p.completo?`<button class="btn primary" data-a="perfilOk">Guardar perfil</button>`:''}
    </section>
    <div class="stack">
      <div class="nlabel">
        <div class="ttl">Necesidades diarias</div>
        <div class="ln"><span>Metabolismo basal</span><span>${n0(c.bmr)} kcal</span></div>
        <div class="ln"><span>Gasto con tu actividad (×${ACT[p.act].f})</span><span>${n0(c.tdee)} kcal</span></div>
        <div class="ln thick"><b>Objetivo diario</b><b class="num">${n0(c.kcal)} kcal</b></div>
        <div class="ln"><b>Proteínas</b><span>${c.pg} g</span></div>
        <div class="ln ind"><span>${n1(c.gkg)} g por kg${c.pesoRef!==p.kg?' (sobre peso ajustado '+n0(c.pesoRef)+' kg)':''}</span><span>${Math.round(c.pg*4/c.kcal*100)} %</span></div>
        <div class="ln"><b>Carbohidratos</b><span>${c.cg} g</span></div>
        <div class="ln ind"><span>de calorías</span><span>${Math.round(c.cg*4/c.kcal*100)} %</span></div>
        <div class="ln"><b>Grasas</b><span>${c.gg} g</span></div>
        <div class="ln ind"><span>de calorías</span><span>${Math.round(c.gg*9/c.kcal*100)} %</span></div>
        <div class="ln"><b>Fibra</b><span>${c.fibra} g</span></div>
        <div class="ln thick"><span>Agua</span><span>${n1(c.agua/1000)} L</span></div>

        <div class="foot">Fórmula Mifflin-St Jeor. ${p.meta==='mantener'?'Sin ajuste: meta de mantener.':`Ajuste de ${c.realDelta>0?'+':''}${n0(c.realDelta)} kcal/día ≈ ${n2(Math.abs(c.kgSemana))} kg por semana.`}

function enter(u){
  ME=u;U=LS.get('nutri:u:'+u.id)||freshUserData();
  U.perfil={...defaultPerfil(),...U.perfil,alerg:{...(U.perfil&&U.perfil.alerg)},comidas:{...defaultPerfil().comidas,...(U.perfil&&U.perfil.comidas)}};
  ['dias','fav','excl'].forEach(k=>U[k]=U[k]||{});['pesos','mis'].forEach(k=>U[k]=U[k]||[]);
  ui.screen='app';ui.tab=U.perfil.completo?'hoy':'perfil';ui.fecha=todayISO();ui.ar={...ui.ar,items:[],fecha:todayISO()};ui.confirm=null;ui.sheet=null;
  render();window.scrollTo(0,0);
}
function logout(){LS.del(SKEY);try{sessionStorage.removeItem(SKEY)}catch(e){}ME=null;U=null;ui.screen='login';ui.login={usuario:'',err:'',busy:false};render()}
function syncKg(){if(U.pesos.length)U.perfil.kg=U.pesos[U.pesos.length-1].kg}

async function act(a,el){
  const[k,...r]=a.split(':');const x=r.join(':');
  if(!['fotoDel','delUser','wipe','fotoDelYes','delUserYes','wipeYes'].includes(k))ui.confirm=null;
  switch(k){
    case'demo':return makeDemo();
    case'pickuser':ui.login.usuario=x;ui.login.err='';render();document.getElementById('li-p').focus();return;
    case'logout':return logout();
    case'tab':ui.tab=x;ui.sheet=null;render();window.scrollTo(0,0);return;
    case'dia':ui.fecha=x==='0'?todayISO():addDays(ui.fecha,+x);break;
    case'agua':{const d=day(ui.fecha,true);d.agua=d.agua===+x?+x-1:+x;saveU();break}
    case'delItem':{const[m,id]=x.split(':');const d=day(ui.fecha,true);d.c[m]=(d.c[m]||[]).filter(i=>i.id!==id);saveU();break}
    case'copiaAyer':{const prev=day(addDays(ui.fecha,-1)).c[x]||[];if(!prev.length){toast('Ayer no apuntaste nada en '+MEALN[x].toLowerCase()+'.');return}
      const d=day(ui.fecha,true);d.c[x]=(d.c[x]||[]).concat(prev.map(i=>({...i,id:uid()})));saveU();toast('Copiado de ayer.');break}
    case'armarMeal':ui.ar.meal=x;ui.ar.fecha=ui.fecha;ui.tab='armar';render();window.scrollTo(0,0);return;
    case'delEj':{const d=day(ui.fecha,true);d.ej=d.ej.filter(e=>e.id!==x);saveU();break}
    case'arAdd':{const f=foodById(x);if(!f)return;ui.ar.items.push(itemFrom(f,f.porG&&f.porG<=300?f.porG:100));
      if(ui.tab==='armar'){render()}else toast(`${f.n} añadido al plato. Ve a «Armar comida».`);return}
    case'arDel':ui.ar.items.splice(+x,1);break;
    case'arClear':ui.ar.items=[];break;
    case'arAdj':{const mt=mealTarget(ui.ar.meal,ui.ar.fecha);ajustar(ui.ar.items,mt.k,mt.p);toast('Cantidades ajustadas a tu objetivo.');break}
    case'arSug':{const its=sugerir(ui.ar.meal);if(!its.length){toast('No hay alimentos suficientes con tus filtros. Revisa los excluidos.');return}
      const mt=mealTarget(ui.ar.meal,ui.ar.fecha);ajustar(its,mt.k,mt.p);ui.ar.items=its;break}
    case'arSave':{const d=day(ui.ar.fecha,true);d.c[ui.ar.meal]=(d.c[ui.ar.meal]||[]).concat(ui.ar.items.map(i=>({...i,id:uid()})));saveU();
      toast(`Guardado en ${MEALN[ui.ar.meal].toLowerCase()} · ${fday(ui.ar.fecha).toLowerCase()}.`);ui.ar.items=[];ui.fecha=ui.ar.fecha;break}
    case'misSave':{const nm=(ui.ar.nombre||'').trim()||MEALN[ui.ar.meal]+' '+(U.mis.length+1);U.mis.unshift({id:uid(),nombre:nm,items:ui.ar.items.map(i=>({...i}))});ui.ar.nombre='';saveU();toast('Plato guardado en «Mis comidas».');break}
    case'misLoad':{const m=U.mis.find(m=>m.id===x);if(m)ui.ar.items=ui.ar.items.concat(m.items.map(i=>({...i,id:uid()})));break}
    case'misDel':U.mis=U.mis.filter(m=>m.id!==x);saveU();break;
    case'cat':{const[ctx,...c]=x.split(':');ui[ctx].cat=c.join(':');ui[ctx].show=ctx==='ar'?60:80;fillFoodList(ctx);setPressed(el);return}
    case'filtro':ui.al.filtro=x;ui.al.show=80;fillFoodList('al');setPressed(el);return;
    case'more':ui[x].show+=80;fillFoodList(x);return;
    case'fav':if(U.fav[x])delete U.fav[x];else{U.fav[x]=1;delete U.excl[x]}saveU();fillFoodList(ui.tab==='armar'?'ar':'al');return;
    case'excl':if(U.excl[x])delete U.excl[x];else{U.excl[x]=1;delete U.fav[x]}saveU();
      if(ui.tab==='alimentos')render();else fillFoodList('ar');toast(U.excl[x]?'Excluido: no saldrá en tus comidas ni sugerencias.':'Ya no está excluido.');return;
    case'delPropio':G.propios=G.propios.filter(f=>f.id!==x);saveG();break;
    case'ejCat':ui.ej.cat=x;fillExList();setPressed(el);return;
    case'ejSel':ui.ej.sel=x;break;
    case'ejMin':ui.ej.min=+x;break;
    case'ejAdd':{const e=EXS.find(e=>e.id===ui.ej.sel);if(!e)return;const d=day(ui.fecha,true);
      d.ej.push({id:uid(),n:e.n,met:e.met,min:ui.ej.min,kcal:Math.round(exKcal(e.met,ui.ej.min,U.perfil.kg))});saveU();toast(`${e.n}: ${n0(exKcal(e.met,ui.ej.min,U.perfil.kg))} kcal añadidas.`);break}
    case'wDel':U.pesos.splice(+x,1);syncKg();saveU();break;
    case'ftipo':ui.fotos.tipo=x;break;
    case'verFoto':ui.sheet=x;ui.confirm=null;render();infoSheet(x);return;
    case'closeSheet':ui.sheet=null;break;
    case'fotoDel':ui.confirm='foto';render();infoSheet(ui.sheet);return;
    case'fotoDelYes':await PH.del(ui.sheet);ui.sheet=null;ui.confirm=null;toast('Foto borrada.');break;
    case'perfilOk':U.perfil.completo=true;saveU();toast('Perfil guardado. Ya puedes empezar a apuntar.');ui.tab='hoy';break;
    case'resetPass':{const v=document.getElementById('rp-'+x).value;if(v.length<4){toast('La contraseña necesita al menos 4 caracteres.');return}
      const u=G.users.find(u=>u.id===x);u.salt=newSalt();u.hash=await hashPass(v,u.salt);saveG();toast(`Contraseña de ${u.nombre} cambiada.`);break}
    case'delUser':ui.confirm='delu:'+x;break;
    case'delUserYes':{G.users=G.users.filter(u=>u.id!==x);saveG();LS.del('nutri:u:'+x);try{const ph=await PH.byUser(x);for(const p of ph)await PH.del(p.id)}catch(e){}toast('Cuenta borrada.');break}
    case'export':return exportar();
    case'wipe':ui.confirm='wipe';break;
    case'wipeYes':return wipe();
    case'cancel':ui.confirm=null;break;
  }
  render();
  if(ui.sheet)infoSheet(ui.sheet);
}
function setPressed(el){el.parentElement.querySelectorAll('[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',b===el))}
async function infoSheet(id){try{const all=await PH.byUser(ME.id);const p=all.find(x=>x.id===id);if(!p)return;
  document.getElementById('sheet-img').src=PH.url(p);document.getElementById('sheet-info').textContent=`${fday(p.fecha)} · ${p.meal?MEALN[p.meal]:TIPON[p.tipo]}`}catch(e){}}

async function exportar(){
  const data={app:'balanza-y-plato',v:1,fecha:new Date().toISOString(),G,users:{},fotos:[]};
  G.users.forEach(u=>data.users[u.id]=LS.get('nutri:u:'+u.id));
  try{for(const u of G.users)for(const p of await PH.byUser(u.id))data.fotos.push({...p,blob:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(p.blob)})})}catch(e){}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`balanza-y-plato-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();
  toast('Copia preparada. Si no se descarga, ábrelo desde la app instalada.');
}
async function importar(file){
  try{const data=JSON.parse(await file.text());if(data.app!=='balanza-y-plato')throw new Error('Ese archivo no es una copia de Balanza y Plato.');
    G=data.G;saveG();for(const id in data.users)if(data.users[id])LS.set('nutri:u:'+id,data.users[id]);
    for(const p of data.fotos||[]){const[h,b]=p.blob.split(',');const bin=atob(b);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      await PH.put({...p,blob:new Blob([u8],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'})})}
    toast('Copia cargada. Vuelve a entrar.');logout();
  }catch(e){toast(e.message||'No se pudo leer la copia.')}
}
async function wipe(){
  G.users.forEach(u=>LS.del('nutri:u:'+u.id));LS.del(GKEY);LS.del(SKEY);
  try{for(const u of G.users)for(const p of await PH.byUser(u.id))await PH.del(p.id)}catch(e){}
  G={v:1,users:[],propios:[]};ME=null;U=null;ui.screen='setup';ui.confirm=null;render();
}

    {nombre:'Ana',usuario:'ana',perfil:{sexo:'m',edad:34,cm:165,kg:72.4,objetivo:65,act:'moderado',meta:'perder',ritmo:.5,alerg:{lactosa:true}},start:75.6},
    {nombre:'Luis',usuario:'luis',perfil:{sexo:'h',edad:38,cm:178,kg:88.1,objetivo:80,act:'ligero',meta:'perder',ritmo:.5,alerg:{}},start:92},
    {nombre:'Marta',usuario:'marta',perfil:{sexo:'m',edad:29,cm:160,kg:55.2,objetivo:58,act:'moderado',meta:'ganar',ritmo:.25,dieta:'vege',alerg:{}},start:54}];
  G={v:1,users:[],propios:[]};
  for(let i=0;i<people.length;i++){const P=people[i];const salt=newSalt();
    const u={id:uid(),nombre:P.nombre,usuario:P.usuario,salt,hash:await hashPass('1234',salt),color:i,admin:i===0};G.users.push(u);
    ME=u;U=freshUserData();U.perfil={...U.perfil,...P.perfil,completo:true};
    for(let w=0;w<12;w++){const dd=addDays(todayISO(),-(11-w)*7);const base=P.start+(P.perfil.kg-P.start)*(w/11);U.pesos.push({d:dd,kg:Math.round((base+(w===11?0:(Math.random()-.5)*.7))*10)/10,cin:w%4===0||w===11?Math.round((P.perfil.cm*.5+(base-P.perfil.kg)*.8)*2)/2:undefined})}
    for(let k=3;k>=0;k--){const f=addDays(todayISO(),-k);const d=day(f,true);
      MEALS.forEach(m=>{if(!U.perfil.comidas[m.k])return;if(k===0&&['merienda','cena'].includes(m.k))return;const its=sugerir(m.k);const mt=mealTarget(m.k,f);ajustar(its,mt.k,mt.p);d.c[m.k]=its});
      d.agua=k===0?4:7+Math.round(Math.random()*2);
      const ex=[EXS.find(e=>e.n.startsWith('Caminar rápido')),EXS.find(e=>e.n.startsWith('Pesas / musculación moderada')),EXS.find(e=>e.n.startsWith('Baile latino'))][(i+k)%3];
      if(k!==1)d.ej.push({id:uid(),n:ex.n,met:ex.met,min:[30,45,40][i],kcal:Math.round(exKcal(ex.met,[30,45,40][i],U.perfil.kg))})}
    U.fav={'b-copos-de-avena':1,'b-pechuga-de-pollo-a-la-plancha':1,'b-arepa-asada-sin-relleno':1};
    if(i===1)U.excl={'b-higado-de-res':1,'b-coles-de-bruselas':1};
    saveU();}
  saveG();ME=null;U=null;ui.screen='login';ui.login={usuario:'ana',err:'',busy:false};render();
  toast('Listo: 3 cuentas de ejemplo. Contraseña 1234.');
  }catch(e){toast(e.message);render()}
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const sh=e.target.closest('.sheet');
  if(sh&&!e.target.closest('[data-stop]')){ui.sheet=null;ui.confirm=null;render();return}
  const b=e.target.closest('[data-a]');if(!b||b.matches('input'))return;
  act(b.dataset.a,b);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet){ui.sheet=null;ui.confirm=null;render()}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.q){const c=el.dataset.q;ui[c].q=el.value;if(c==='ej')fillExList();else{ui[c].show=c==='ar'?60:80;fillFoodList(c)}return}
  if(el.dataset.f==='nota'){day(ui.fecha,true).nota=el.value;saveU()}
  if(el.dataset.f==='ar-nombre')ui.ar.nombre=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.type==='file'&&el.dataset.photo)return handlePhoto(el);
  if(el.id==='imp-file'&&el.files[0])return importar(el.files[0]);
  const f=el.dataset.f;if(!f)return;
  const[k,x]=f.split(':');
  if(k==='pf'){let v=el.value;if(el.type==='number'){v=parseFloat(v);if(!isFinite(v))return render()}if(x==='ritmo'||x==='ejPct')v=parseFloat(v);
    U.perfil[x]=v;if(x==='meta'&&v==='ganar'&&U.perfil.ritmo>.5)U.perfil.ritmo=.25;if(x==='kg'&&U.pesos.length){const t=todayISO();const last=U.pesos[U.pesos.length-1];if(last.d===t)last.kg=v;else U.pesos.push({d:t,kg:v})}saveU()}
  else if(k==='alerg'){U.perfil.alerg[x]=el.checked;saveU()}
  else if(k==='comida'){U.perfil.comidas[x]=clamp(parseFloat(el.value)||0,0,100);saveU()}
  else if(k==='pasos'){day(ui.fecha,true).pasos=Math.max(0,parseInt(el.value)||0);saveU()}
  else if(k==='nota')return;
  else if(k==='ar-meal')ui.ar.meal=el.value;
  else if(k==='ar-fecha'){if(el.value)ui.ar.fecha=el.value}
  else if(k==='ar-fav'){ui.ar.fav=el.checked;fillFoodList('ar');return}
  else if(k==='ar-g'){ui.ar.items[+x].g=Math.max(0,parseFloat(el.value)||0)}
  else if(k==='ej-min'){ui.ej.min=clamp(parseInt(el.value)||1,1,600)}
  else if(k==='ar-nombre')return;
  render();
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const id=e.target.id;const v=i=>(document.getElementById(i)||{}).value||'';
  if(id==='f-setup'){
    const err=document.getElementById('su-err');const rows=[];
    for(let i=0;i<3;i++){const n=v('su-n-'+i).trim(),u=v('su-u-'+i).trim().toLowerCase(),p=v('su-p-'+i),r=v('su-r-'+i);
      if(!n&&!u&&!p)continue;
      if(!n||!u||!p){err.textContent=`Persona ${i+1}: faltan datos.`;return}
      if(!/^[a-z0-9._-]{2,20}$/.test(u)){err.textContent=`Persona ${i+1}: el usuario solo puede tener letras sin tilde, números, punto o guion.`;return}
      if(p.length<4){err.textContent=`Persona ${i+1}: la contraseña necesita al menos 4 caracteres.`;return}
      if(p!==r){err.textContent=`Persona ${i+1}: las contraseñas no coinciden.`;return}
      if(rows.some(x=>x.u===u)){err.textContent=`El usuario «${u}» está repetido.`;return}
      rows.push({n,u,p})}
    if(!rows.length){err.textContent='Crea al menos una cuenta.';return}
    err.textContent='Creando cuentas…';
    try{for(let i=0;i<rows.length;i++){const salt=newSalt();G.users.push({id:uid(),nombre:rows[i].n,usuario:rows[i].u,salt,hash:await hashPass(rows[i].p,salt),color:i,admin:i===0})}}
    catch(x){err.textContent=x.message;G.users=[];return}
    saveG();ui.screen='login';ui.login={usuario:rows[0].u,err:'',busy:false};render();toast('Cuentas creadas. Ya podéis entrar.');return}
  if(id==='f-login'){
    const L=ui.login;const u=v('li-u').trim().toLowerCase(),p=v('li-p'),keep=document.getElementById('li-keep').checked;
    if(L.until&&Date.now()<L.until){L.err=`Demasiados intentos. Espera ${Math.ceil((L.until-Date.now())/1000)} segundos.`;render();return}
    const user=G.users.find(x=>x.usuario===u);L.usuario=u;L.busy=true;render();
    let ok=false;try{ok=!!user&&await hashPass(p,user.salt)===user.hash}catch(x){L.busy=false;L.err=x.message;render();return}
    L.busy=false;
    if(!ok){L.fails=(L.fails||0)+1;L.err='Usuario o contraseña incorrectos.';if(L.fails>=5){L.until=Date.now()+30000;L.fails=0;L.err='Demasiados intentos. Espera 30 segundos.'}render();document.getElementById('li-p').focus();return}
    L.fails=0;L.err='';
    if(keep)LS.set(SKEY,{uid:user.id});else{LS.del(SKEY);try{sessionStorage.setItem(SKEY,JSON.stringify({uid:user.id}))}catch(x){}}
    return enter(user)}
  if(id==='f-propio'){
    const fl=[...document.querySelectorAll('[id^="pr-fl-"]:checked')].map(c=>c.value).join('');
    const n=v('pr-n').trim();if(!n)return;
    G.propios.push({id:'u-'+uid(),n,cat:'Mis alimentos',k:+v('pr-k')||0,p:+v('pr-p')||0,c:+v('pr-c')||0,g:+v('pr-g')||0,fb:+v('pr-fb')||0,fl,porN:v('pr-pn').trim(),porG:+v('pr-pg')||0});
    saveG();ui.al.cat='Mis alimentos';ui.al.q='';toast(`${n} guardado.`);render();return}
  if(id==='f-ejlibre'){
    const n=v('el-n').trim(),min=parseInt(v('el-m'))||0;if(!n||!min)return;const kc=parseFloat(v('el-k'));const met=parseFloat(v('el-i'))||5;
    day(ui.fecha,true).ej.push({id:uid(),n,met,min,kcal:Math.round(isFinite(kc)&&kc>0?kc:exKcal(met,min,U.perfil.kg))});saveU();toast(`${n} añadido.`);render();return}
  if(id==='f-peso'){
    const d=v('w-d'),kg=parseFloat(v('w-kg')),cin=parseFloat(v('w-cin'));if(!d||!isFinite(kg))return;
    const ex=U.pesos.find(w=>w.d===d);const rec={d,kg:Math.round(kg*10)/10};if(isFinite(cin))rec.cin=cin;
    if(ex)Object.assign(ex,rec);else U.pesos.push(rec);U.pesos.sort((a,b)=>a.d.localeCompare(b.d));syncKg();saveU();toast('Peso guardado. Calorías recalculadas.');render();return}
  if(id==='f-pass'){
    const err=document.getElementById('cp-err');const a=v('cp-a'),n=v('cp-n'),r=v('cp-r');
    if(await hashPass(a,ME.salt)!==ME.hash){err.textContent='La contraseña actual no es correcta.';return}
    if(n.length<4){err.textContent='La nueva necesita al menos 4 caracteres.';return}
    if(n!==r){err.textContent='Las contraseñas nuevas no coinciden.';return}
    ME.salt=newSalt();ME.hash=await hashPass(n,ME.salt);saveG();toast('Contraseña cambiada.');render();return}
  if(id==='f-adduser'){
    const n=v('nu-n').trim(),u=v('nu-u').trim().toLowerCase(),p=v('nu-p');
    if(!/^[a-z0-9._-]{2,20}$/.test(u)){toast('Usuario: solo letras sin tilde, números, punto o guion.');return}
    if(G.users.some(x=>x.usuario===u)){toast('Ese usuario ya existe.');return}
    if(p.length<4){toast('La contraseña necesita al menos 4 caracteres.');return}
    const used=new Set(G.users.map(x=>x.color));const color=[0,1,2,3,4,5].find(c=>!used.has(c))??0;
    const salt=newSalt();G.users.push({id:uid(),nombre:n,usuario:u,salt,hash:await hashPass(p,salt),color,admin:false});saveG();toast(`${n} añadido.`);render();return}
});

/* ---------- Arranque ---------- */
(function boot(){
  if(!G.users.length){ui.screen='setup';return render()}
  let s=LS.get(SKEY);if(!s){try{s=JSON.parse(sessionStorage.getItem(SKEY)||'null')}catch(e){}}
  const u=s&&G.users.find(x=>x.id===s.uid);
  if(u)return enter(u);
  ui.screen='login';render();
})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&document.querySelector('meta[name="nutri-pwa"]')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}));
}
</script>
