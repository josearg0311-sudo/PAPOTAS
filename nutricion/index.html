<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="nutri-pwa" content="1">
<meta name="theme-color" content="#0E0A15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<!--APP-->
<title>Balanza y Plato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: cabecera con pastillas y cambio de perfil siempre a la vista; contenido en tarjetas redondeadas; en el celular, barra flotante con botón + central.
   Un solo tema oscuro de alto contraste: morado de maíz morado, amarillo ají, rojo rocoto, verde palta. */
:root{
  color-scheme:dark;
  --bg:#0E0A15; --surface:#1A1326; --sunk:#271D37; --ink:#FBF8FF; --muted:#C7BCDB; --line:#40335A;
  --brand:#4A1D6E; --accent:#FFC23D; --accent-soft:#3A2C10; --accent-ink:#17110A; --lila:#C9A6FF;
  --sun:#FFC23D; --sun-ink:#17110A; --hi:#FFC23D; --warn:#FF6B6B; --ok:#4ADE80; --scrim:rgba(0,0,0,.75);
  --mp:#FF6B6B; --mc:#FFC23D; --mg:#4ADE80; --agua:#6CB4FF;
  --side:#4A1D6E; --side-2:#5E2A88; --side-ink:#FFFFFF; --side-mute:#D9C8EC;
  --c0:#C9A6FF; --c1:#FFA552; --c2:#4ADE80; --c3:#FF6B6B; --c4:#6CB4FF; --c5:#FF8FC8;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-disp:"Unbounded", "Figtree", system-ui, sans-serif;
  --f-mono:"Figtree", system-ui, sans-serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.35rem} h3{font-size:1rem}
p{margin:0}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.note{font-size:.8rem;color:var(--muted);max-width:72ch}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3:first-child,.card>.ch:first-child{padding-bottom:10px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:4px}
.sechead h2{font-size:1.5rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* botones y campos */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .88rem var(--f-body);padding:8px 14px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:4px 10px;font-size:.8rem;min-height:30px}
.btn.icon{width:34px;min-height:34px;padding:0;font-size:1rem}
.btn[aria-pressed="true"]{background:var(--sunk);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:grid;gap:5px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
input[type=number],input[type=date],input[type=text],input[type=password],input[type=search],select,textarea{font:400 .95rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.full{grid-column:1/-1}
.cks{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.9rem}
.cks label{display:flex;gap:7px;align-items:center;cursor:pointer}
.cks input,.ck{accent-color:var(--accent);width:18px;height:18px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* estructura */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px}
.logo b{display:block;font-size:1rem;color:inherit}
.logo small{display:block;font-size:.74rem;color:var(--side-mute)}
.side .logo{padding:0 6px}
.navs{display:grid;gap:2px}
.nav{appearance:none;border:0;background:none;color:var(--side-ink);display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;font:500 .92rem var(--f-body);cursor:pointer;text-align:left;width:100%}
.nav svg{color:var(--side-mute);flex:none}
.nav:hover{background:var(--side-2)}
.nav[aria-current="page"]{background:var(--side-2);color:#FFFFFF;font-weight:600}
.nav[aria-current="page"] svg{color:var(--accent)}
.me{margin-top:auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--side-2)}
.me b{display:block;font-size:.92rem;color:#FFFFFF;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;font-size:.76rem;color:var(--side-mute)}
.me .btn{grid-column:1/-1;background:transparent;color:var(--side-ink);border-color:var(--side-2)}
.mainc{min-width:0;display:flex;flex-direction:column}
.content{width:100%;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.content{padding-block:28px 56px;display:grid;gap:18px;align-content:start;flex:1}
.mtop{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
  .mtop{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--side);color:var(--side-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mbar{padding-block:10px 4px}
  .mbar .btn{background:transparent;color:var(--side-ink);border-color:var(--side-2)}
  main.content{padding-block:18px 48px}
}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--side-mute);font:500 .88rem var(--f-body);padding:9px 10px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:#FFFFFF;border-bottom-color:var(--accent)}
.av{width:34px;height:34px;border-radius:50%;background:var(--uc);color:#FFFFFF;display:grid;place-items:center;font:600 .9rem var(--f-body);flex:none}
.av.lg{width:56px;height:56px;font-size:1.35rem}
.foot{padding-block:16px 28px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}

/* ficha de perfil */
.ficha{display:grid;grid-template-columns:minmax(220px,auto) minmax(0,1fr);gap:16px 28px;align-items:center;border-top:4px solid var(--uc)}
.fid{display:flex;gap:14px;align-items:center;min-width:0}
.fid h2{font-size:1.3rem}
.fkpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
.fkpi div{border-left:1px solid var(--line);padding-left:12px;min-width:0}
.fkpi dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fkpi dd{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.fkpi dd b{font-size:1.25rem;color:var(--ink);font-weight:500}
.fprog{grid-column:1/-1;display:grid;gap:6px}
@media (max-width:760px){.ficha{grid-template-columns:1fr}.fkpi{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi span{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{font:500 1.7rem var(--f-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{font-size:.78rem;color:var(--muted)}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main span,.kpi.main small{color:var(--accent-ink);opacity:.85}
.kpi.neg{background:var(--warn);border-color:var(--warn);color:#FFFFFF}
.kpi.neg span,.kpi.neg small{color:#FFFFFF;opacity:.9}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
.dash>.dside{order:2;position:sticky;top:20px}
@media (max-width:1000px){.dash{grid-template-columns:1fr}.dash>.dside{order:0;position:static}}

/* barras */
.bar{position:relative;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--warn)}
.macro{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.85rem}
.macro .bar{height:6px}
.macro>span:last-child{color:var(--muted)}
.pill{font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.hi{color:var(--hi)} .pill.warn{color:var(--warn)} .pill.mu{color:var(--muted)}

/* hoy */
.datenav{display:flex;align-items:center;gap:8px}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{appearance:none;width:26px;height:34px;border:2px solid var(--c0);border-top-width:0;border-radius:0 0 6px 6px;background:none;cursor:pointer;padding:0}
.glass.on{background:linear-gradient(to top,var(--c0) 75%,transparent 75%)}
.meal{padding:0;overflow:hidden}
.meal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;background:var(--sunk);border-bottom:1px solid var(--line)}
.meal .mh h3{font-size:1rem}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font-size:.92rem}
.items li:first-child{border-top:0}
.items li .q{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.mf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{appearance:none;border:0;padding:0;background:none;cursor:pointer;border-radius:6px;overflow:hidden;width:52px;height:52px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.empty{color:var(--muted);font-size:.88rem;padding:12px 16px}

/* armar */
.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.builder{grid-template-columns:1fr}}
.plate li{grid-template-columns:minmax(0,1fr) 92px auto}
.plate .nm{min-width:0}
.plate .nm small{display:block;color:var(--muted);font-size:.76rem;font-family:var(--f-mono)}
.gin{display:flex;align-items:center;gap:4px}
.gin input{padding:6px;text-align:right;font-family:var(--f-mono)}
.gin span{font-size:.78rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font:500 .8rem var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.flist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0}
.flist .fn{font-weight:500;font-size:.93rem}
.flist .fm{font-size:.76rem;color:var(--muted);font-family:var(--f-mono)}
.flist .tg{font-size:.7rem;font-weight:600;color:var(--hi);margin-left:6px}
.flist li.excl .fn{text-decoration:line-through;color:var(--muted)}
.tog{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:34px;height:34px;border-radius:7px;cursor:pointer;font-size:1rem;line-height:1;display:inline-grid;place-items:center}
.tog.fav[aria-pressed="true"]{color:var(--hi);border-color:var(--hi)}
.tog.ex[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.add{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);width:34px;height:34px;border-radius:7px;cursor:pointer;font:600 1.1rem var(--f-body)}

/* tablas */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}

/* peso */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat b{font:500 1.4rem var(--f-mono)}
.chart svg{display:block;width:100%;height:auto}
.proj{font-size:.9rem;padding:12px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.twocol{grid-template-columns:1fr}}

/* fotos */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{appearance:none;border:0;padding:0;cursor:pointer;background:var(--sunk);border-radius:8px;overflow:hidden;aspect-ratio:1;position:relative;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:6px;font-size:.68rem;font-weight:600;background:var(--surface);color:var(--ink);padding:1px 7px;border-radius:99px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare figure{margin:0;display:grid;gap:4px}
.compare img{border-radius:8px;aspect-ratio:3/4;object-fit:cover;width:100%;background:var(--sunk)}
.compare figcaption{font-size:.8rem;color:var(--muted)}

/* etiqueta nutricional */
.nlabel{border:2px solid var(--ink);padding:10px 12px;font-size:.88rem;background:var(--surface)}
.nlabel .ttl{font-weight:700;font-size:1.2rem;border-bottom:8px solid var(--ink);padding-bottom:2px;margin-bottom:2px}
.nlabel .ln{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ink);padding:3px 0}
.nlabel .ln.thick{border-bottom-width:4px}
.nlabel .ln.ind{padding-left:14px}
.nlabel .ln span:last-child{font-family:var(--f-mono)}
.nlabel .foot2{font-size:.74rem;color:var(--muted);padding-top:6px;line-height:1.4}

/* perfil */
.pgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.pgrid{grid-template-columns:1fr}}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:.92rem}
.sw input{width:40px;height:22px;accent-color:var(--accent)}

/* familia */
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.fcard{border-top:4px solid var(--uc);display:grid;gap:12px}
.fcard dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.fcard dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fcard dd{margin:0;font:500 1.1rem var(--f-mono)}

/* acceso */
.gate{display:grid;grid-template-columns:minmax(280px,420px) minmax(0,1fr);min-height:100vh}
.gbrand{background:var(--side);color:var(--side-ink);padding-block:48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:20px}
.gbrand h1{color:#FFFFFF;font-size:1.9rem}
.gbrand p{color:var(--side-ink)}
.gbrand ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:.92rem}
.gbrand li{padding-left:18px;position:relative}
.gbrand li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.gbrand .foot3{margin-top:auto;font-size:.78rem;color:var(--side-mute)}
.gmain{display:grid;place-items:start center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gbox{width:100%;max-width:600px;display:grid;gap:18px}
@media (max-width:820px){.gate{grid-template-columns:1fr;min-height:0}.gbrand{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.gbrand ul,.gbrand .foot3{display:none}.gmain{padding-block:24px 40px}}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{appearance:none;border:1px solid var(--line);border-top:4px solid var(--uc);background:var(--surface);color:var(--ink);border-radius:10px;padding:16px;display:grid;justify-items:start;gap:10px;cursor:pointer;text-align:left;font:inherit}
.pcard b{font-size:1.02rem}
.pcard small{color:var(--muted);font-size:.8rem}
.pcard[aria-pressed="true"]{box-shadow:0 0 0 2px var(--uc);border-color:var(--uc)}
.err{color:var(--warn);font-size:.86rem;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0;display:grid;gap:10px;background:var(--surface)}
legend{font-weight:600;padding:0 6px;display:flex;gap:8px;align-items:center}
legend .av{width:26px;height:26px;font-size:.8rem}

/* hoja y aviso */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:16px;display:grid;gap:12px}
.sheet img{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--sunk)}

/* ---------- Preparación de catálogos ---------- */
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const FOODS=[],FOOD_CATS=[];
(function(){let cat='';FOOD_TXT.split('\n').forEach(l=>{l=l.trim();if(!l)return;
  if(l.startsWith('## ')){cat=l.slice(3);FOOD_CATS.push(cat);return}
  const [n,k,p,c,g,fb,fl,por]=l.split(';');let porN='',porG=0;
  if(por){const i=por.lastIndexOf('=');porN=por.slice(0,i);porG=+por.slice(i+1)}
  FOODS.push({id:'b-'+slug(n),n,cat,k:+k,p:+p,c:+c,g:+g,fb:+fb||0,fl:fl||'',porN,porG,s:fold(n)});
})})();
const EXS=[],EX_CATS=[];
(function(){let cat='';EX_TXT.split('\n').forEach(l=>{l=l.trim();if(!l)return;
  if(l.startsWith('## ')){cat=l.slice(3);EX_CATS.push(cat);return}
  const [n,m]=l.split(';');EXS.push({id:'e-'+slug(n),n,cat,met:+m,s:fold(n)});
})})();

function calc(p){

  const piso=Math.max(p.sexo==='h'?1500:1200,bmr);

  if(kcal<piso){kcal=Math.round(piso/10)*10;limitado=true}

  const gkg={perder:1.8,mantener:1.4,ganar:1.8}[p.meta]+(p.reparto==='proteico'?.4:0);
  const pg=Math.round(pesoRef*gkg);

  else{gg=Math.round(kcal*(p.reparto==='proteico'?.25:.3)/9);cg=Math.round((kcal-pg*4-gg*9)/4)}

  return{imc,bmr,tdee,tdeeF,adaptado,kcal,pg,gg,cg,fibra:Math.round(kcal/1000*14),agua:Math.round(p.kg*35/50)*50,
    limitado,pesoRef,gkg,realDelta,kgSemana:realDelta*7/7700,sano:[18.5*m*m,24.9*m*m]};
}

function ajustar(items,tK,tP){
  if(!items.length||tK<=0)return;
  const fixed=it=>it.k>=800;
  const isP=it=>!fixed(it)&&it.p*4/Math.max(it.k,1)>=.3;
  const A=items.filter(isP),B=items.filter(it=>!isP(it)&&!fixed(it));
  if(A.length){const pA=sum(A).p;if(pA>0){const f=clamp(tP*.8/pA,.25,4);A.forEach(it=>it.g*=f)}}
  const kFixed=sum(items.filter(fixed)).k,kA=sum(A).k;
  if(B.length){const kB=sum(B).k;if(kB>0){const f=clamp((tK-kA-kFixed)/kB,.25,4);B.forEach(it=>it.g*=f)}}
  const k2=sum(items).k;if(k2>0){const f=clamp(tK/k2,.5,2);if(Math.abs(f-1)>.08)items.filter(it=>!fixed(it)).forEach(it=>it.g*=f)}
  items.forEach(it=>{const cap=it.porG?Math.min(600,Math.max(it.porG*2.5,60)):400;it.g=Math.max(5,Math.round(Math.min(it.g,cap)/5)*5)});
}

/* ---------- Sincronización entre celulares (Supabase) ----------
   Cada bloque de datos se guarda aparte: «g» (perfiles, alimentos y recetas de la casa),
   «u:<perfil>» (perfil, pesos, plan…) y «d:<perfil>:<mes>» (el diario de cada mes).
   Gana el cambio más reciente; las fotos se quedan en cada celular. */
const NUBE_SQL=`-- Balanza & Plato · preparación de Supabase.
-- Pégalo entero en SQL Editor y pulsa Run. Puede ser el mismo proyecto de PAPOTAS.
--
-- Los datos de cada familia se guardan en filas separadas por un «código de familia»
-- largo y secreto. La tabla no se puede leer directamente con la clave pública:
-- solo a través de estas dos funciones, que exigen ese código.

create table if not exists public.balanza_datos (
  familia        text        not null,
  clave          text        not null,
  datos          jsonb       not null,
  ts             bigint      not null,
  actualizado_en timestamptz not null default now(),
  primary key (familia, clave)
);

alter table public.balanza_datos enable row level security;
revoke all on public.balanza_datos from anon, authenticated;

create or replace function public.balanza_guardar(p_familia text, p_clave text, p_datos jsonb, p_ts bigint)
returns void language plpgsql security definer set search_path = public as $$
begin
  if length(p_familia) < 16 then raise exception 'codigo de familia demasiado corto'; end if;
  insert into balanza_datos (familia, clave, datos, ts) values (p_familia, p_clave, p_datos, p_ts)
  on conflict (familia, clave) do update
    set datos = excluded.datos, ts = excluded.ts, actualizado_en = now()
    where balanza_datos.ts < excluded.ts;
end $$;

create or replace function public.balanza_leer(p_familia text, p_desde bigint)
returns table (clave text, datos jsonb, ts bigint, srv bigint)
language sql stable security definer set search_path = public as $$
  select clave, datos, ts, (extract(epoch from actualizado_en) * 1000)::bigint
  from balanza_datos
  where familia = p_familia and length(p_familia) >= 16
    and actualizado_en > to_timestamp(p_desde / 1000.0);
$$;

grant execute on function public.balanza_guardar(text, text, jsonb, bigint) to anon;
grant execute on function public.balanza_leer(text, bigint) to anon;
`;

const hsh=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+'.'+s.length};
function partsOfUser(id,D){const meta={...D};delete meta.dias;const P={['u:'+id]:meta},by={};
  for(const f in D.dias)(by[f.slice(0,7)]=by[f.slice(0,7)]||{})[f]=D.dias[f];for(const m in by)P[`d:${id}:${m}`]=by[m];return P}
function partsAll(){const P={g:G};G.users.forEach(u=>{const D=ME&&u.id===ME.id?U:LS.get('nutri:u:'+u.id);if(D)Object.assign(P,partsOfUser(u.id,D))});return P}
async function rpc(fn,body){
  const h={'Content-Type':'application/json',apikey:NUBE.key};if(/^eyJ/.test(NUBE.key))h.Authorization='Bearer '+NUBE.key;
  let r;try{r=await fetch(NUBE.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)})}catch(e){throw new Error('Sin conexión con Supabase.')}
  const txt=await r.text();
  if(!r.ok){if(r.status===404||/function|schema cache/i.test(txt))throw new Error('Supabase no tiene preparada la base: pega y ejecuta el código SQL.');
    if(r.status===401||r.status===403||/api key|JWT/i.test(txt))throw new Error('La clave de Supabase no es válida.');throw new Error('Supabase respondió con un error ('+r.status+').')}

}
function mergeG(L,R){const del=new Set([...(L.borrados||[]),...(R.borrados||[])]);
  const by=(a,b)=>{const m=new Map();(a||[]).forEach(x=>m.set(x.id,x));(b||[]).forEach(x=>m.set(x.id,x));return[...m.values()].filter(x=>!del.has(x.id))};
  return{...L,...R,users:by(L.users,R.users),propios:by(L.propios,R.propios),recetas:by(L.recetas,R.recetas),borrados:[...del]}}

  if(k==='g'){G=mergeG(G,datos);LS.set(GKEY,G);rebuildRecipes();if(ME)ME=G.users.find(u=>u.id===ME.id)||ME;return}
  const um=k.match(/^u:(.+)$/),dm=k.match(/^d:(.+):(\d{4}-\d{2})$/),id=um?um[1]:dm?dm[1]:null;if(!id)return;
  const mine=ME&&ME.id===id,D=mine?U:normData(LS.get('nutri:u:'+id));let nd;
  if(um)nd={...datos,dias:D.dias};else{nd=D;for(const f of Object.keys(nd.dias))if(f.startsWith(dm[2]))delete nd.dias[f];Object.assign(nd.dias,datos)}
  LS.set('nutri:u:'+id,nd);if(mine)U=normData(nd);
}
async function pullNow(){
  const rows=(await rpc('balanza_leer',{p_familia:NUBE.fam,p_desde:NUBE.since||0}))||[];let maxS=NUBE.since||0;const applied=[];
  rows.sort((a,b)=>(a.clave==='g'?0:1)-(b.clave==='g'?0:1));
  for(const r of rows){maxS=Math.max(maxS,+r.srv);if((NT[r.clave]||0)>=+r.ts)continue;applyPart(r.clave,r.datos);NT[r.clave]=+r.ts;applied.push(r.clave)}
  if(applied.length){const P=partsAll();applied.forEach(k=>{if(P[k])NH[k]=hsh(JSON.stringify(P[k]))});LS.set('nutri:nube:h',NH);LS.set('nutri:nube:t',NT)}
  NUBE.since=maxS;LS.set('nutri:nube',NUBE);return applied.length;
}
async function pushNow(){
  const P=partsAll();let n=0;
  for(const k in P){const s=JSON.stringify(P[k]),h=hsh(s);if(NH[k]===h)continue;const ts=Math.max(Date.now(),(NT[k]||0)+1);
    await rpc('balanza_guardar',{p_familia:NUBE.fam,p_clave:k,p_datos:P[k],p_ts:ts});NH[k]=h;NT[k]=ts;n++}
  if(n){LS.set('nutri:nube:h',NH);LS.set('nutri:nube:t',NT)}return n;
}

function planTarget(D,mk){const c=calc(D.perfil);const sh=(D.perfil.comidas[mk]||0)/100;return{k:c.kcal*sh,p:c.pg*sh}}
function genMeal(D,mk,base,avoid=[]){
  return withData(D,()=>{
    let r=base&&base[0]&&base[0].rec?RECBY[base[0].f]:null;
    if(r&&!recUsable(r))r=null;
    if(!r)r=pickRecipe(mk,avoid);
    const t=planTarget(D,mk);
    if(r)return[recItem(r,recFactor(r,t.k))];
    const its=sugerir(mk);ajustar(its,t.k,t.p);return its});
}
function planHas(D,ws){return Array.from({length:7},(_,i)=>addDays(ws,i)).some(f=>D.plan[f]&&Object.keys(D.plan[f]).length)}
function generarSemana(fam){
  const ws=ui.plan.semana,recent={};
  const others=fam?G.users.filter(u=>u.id!==ME.id).map(u=>({u,D:dataOf(u)})).filter(o=>o.D.perfil.completo):[];
  for(let i=0;i<7;i++){const f=addDays(ws,i);U.plan[f]={};const today=[];
    MEALS.forEach(m=>{if(!(U.perfil.comidas[m.k]>0))return;
      const mine=genMeal(U,m.k,null,(recent[m.k]||[]).concat(today));U.plan[f][m.k]=mine;
      const id=mine[0]&&mine[0].rec?mine[0].f:null;if(id){today.push(id);recent[m.k]=[id,...(recent[m.k]||[])].slice(0,4)}
      if(['almuerzo','cena'].includes(m.k))others.forEach(o=>{if((o.D.perfil.comidas[m.k]||0)>0){o.D.plan[f]=o.D.plan[f]||{};o.D.plan[f][m.k]=genMeal(o.D,m.k,mine)}})})}
  saveU();others.forEach(o=>LS.set('nutri:u:'+o.u.id,o.D));
  return others.length;
}

/* ---------- Ficha de perfil ---------- */
function progresoMeta(p,pesos){
  const start=pesos.length?pesos[0].kg:p.kg,cur=p.kg,goal=p.objetivo,tot=start-goal;
  const pct=p.meta==='mantener'||Math.abs(tot)<.05?(Math.abs(cur-goal)<1?1:0):clamp((start-cur)/tot,0,1);
  return{start,cur,goal,pct};
}
function ficha(){
  const p=U.perfil,c=calc(p),g=progresoMeta(p,U.pesos),falta=Math.abs(g.cur-g.goal);
  return`<section class="card ficha" style="--uc:${COLORS[ME.color]}">
    <div class="fid"><span class="av lg">${ini(ME.nombre)}</span><div><h2>${esc(ME.nombre)}</h2><p class="sub">${p.sexo==='h'?'Hombre':'Mujer'} · ${p.edad} años · ${p.cm} cm · ${METAS[p.meta]}</p>${(r=>r?`<span class="pill ok" style="display:inline-block;margin-top:6px">Racha: ${r} día${r>1?'s':''} seguido${r>1?'s':''} apuntando</span>`:'')(racha(U))}</div></div>
    <dl class="fkpi">
      <div><dt>Peso actual</dt><dd><b class="num">${n1(p.kg)}</b> kg</dd></div>
      <div><dt>Objetivo</dt><dd><b class="num">${n1(p.objetivo)}</b> kg</dd></div>
      <div><dt>IMC</dt><dd><b class="num">${n1(c.imc)}</b> ${imcTxt(c.imc)}</dd></div>
      <div><dt>Calorías al día</dt><dd><b class="num">${n0(c.kcal)}</b> kcal</dd></div>
    </dl>
    <div class="fprog"><div class="row between"><span class="lbl">Avance hacia tu objetivo</span><span class="num muted">${Math.round(g.pct*100)} %${falta>=.1?` · faltan ${n1(falta)} kg`:' · ¡objetivo cumplido!'}</span></div><div class="bar"><i style="width:${(g.pct*100).toFixed(1)}%"></i></div></div>
  </section>`;
}

/* ---------- Hoy ---------- */
function macroRow(label,v,t,unit='g'){
  const w=t>0?Math.min(100,v/t*100):0;const over=v>t*1.1;
  return`<div class="macro"><span>${label}</span><div class="bar"><i class="${over?'over':''}" style="width:${w.toFixed(1)}%"></i></div><span class="num">${n0(v)} / ${n0(t)} ${unit}</span></div>`;
}
function weekStrip(f){
  const ws=weekStart(f);
  return`<div class="wstrip"><button class="btn icon ghost" data-a="dia:-7" aria-label="Semana anterior">‹</button>${Array.from({length:7},(_,i)=>{const x=addDays(ws,i),dd=day(x),has=MEALS.some(m=>(dd.c[m.k]||[]).length);
    return`<button class="wd ${x===f?'on':''} ${x===todayISO()?'today':''}" data-a="goDia:${x}" aria-label="${fday(x)}"><small>${'LMMJVSD'[i]}</small><b>${parseISO(x).getDate()}</b><i class="${has?'dot':''}"></i></button>`}).join('')}<button class="btn icon ghost" data-a="dia:7" aria-label="Semana siguiente">›</button></div>`;
}
function itemRow(m,it){
  return`<li><span>${it.rec?`<button class="lnk" data-a="recOpen:${it.f}:${it.por}">${esc(it.n)}</button>`:esc(it.n)}</span><span class="q">${it.rec?fmtPor(it.por)+' porc.':qtyTxt(itemObj(it),it.g)} · ${n0(itemT(it).k)} kcal</span><button class="btn icon ghost" data-a="delItem:${m}:${it.id}" aria-label="Quitar ${esc(it.n)}">×</button></li>`;
}
function vHoy(){
  const f=ui.fecha,d=day(f),b=budget(f),c=b.c,T=dayFood(f);
  const left=b.total-T.k;
  const glasses=Math.max(6,Math.round(c.agua/250));
  const mini=(lab,v,t,col)=>`<div class="mring">${ring(v,t,58,7,col)}<div><b>${n0(v)}<small> / ${n0(t)} g</small></b><span>${lab}</span></div></div>`;
  const meals=MEALS.filter(m=>(U.perfil.comidas[m.k]||0)>0||(d.c[m.k]||[]).length).map(m=>{
    const its=d.c[m.k]||[],t=sum(its),mt=mealTarget(m.k,f),pl=(U.plan[f]||{})[m.k]||[];
    return`<section class="card meal"><div class="mh"><div><h3>${m.n}</h3><span class="sub num">${n0(t.k)} de ≈${n0(mt.k)} kcal</span></div>
      <div class="row"><button class="btn small" data-a="copiaAyer:${m.k}">Copiar de ayer</button><button class="btn small primary" data-a="qaOpen:${m.k}">+ Añadir</button></div></div>
      ${its.length?`<ul class="items">${its.map(it=>itemRow(m.k,it)).join('')}</ul>`:pl.length?`<div class="empty row between"><span>En tu plan: ${pl[0].rec?`<button class="lnk" data-a="recOpen:${pl[0].f}:${pl[0].por}">${esc(pl[0].n)}</button>`:esc(pl.map(i=>i.n).slice(0,3).join(', '))}</span><button class="btn small" data-a="usePlan:${m.k}">Lo comí (${n0(sum(pl).k)} kcal)</button></div>`:`<p class="empty">Nada apuntado todavía.</p>`}
      <div class="mf"><div class="thumbs" data-thumbs="${f}|${m.k}"></div>
        <label class="btn small filebtn">Foto del plato<input type="file" accept="image/*" capture="environment" data-photo="comida|${f}|${m.k}" aria-label="Tomar foto: ${m.n}"></label></div>
    </section>`}).join('');
  const A=U.ayuno;
  const rr=racha(U);
  return`<section class="card stack"><div class="row between"><div class="row"><h2>${fday(f)}</h2>${rr?`<span class="pill ok">Racha: ${rr} día${rr>1?'s':''}</span>`:''}</div><div class="row">${MEALS.some(m=>((U.plan[f]||{})[m.k]||[]).length&&!(d.c[m.k]||[]).length)?`<button class="btn small primary" data-a="planDia">Comí todo lo del plan</button>`:''}${f!==todayISO()?`<button class="btn small" data-a="dia:0">Ir a hoy</button>`:''}</div></div>${weekStrip(f)}</section>
  <section class="card rings">
    <div class="bigring">${ring(T.k,b.total,180,14,'var(--lila)')}<div class="rc"><b>${n0(Math.abs(left))}</b><span>${left<0?'kcal de más':'kcal restantes'}</span></div></div>
    <div class="stack">
      <dl class="eq"><div><dt>Objetivo</dt><dd>${n0(c.kcal)}</dd></div><div><dt>Comido</dt><dd>${n0(T.k)}</dd></div><div><dt>Ejercicio</dt><dd>+${n0(b.add)}</dd></div></dl>
      <div class="mrings">${mini('Proteínas',T.p,c.pg,'var(--mp)')}${mini('Carbohidratos',T.c,c.cg,'var(--mc)')}${mini('Grasas',T.g,c.gg,'var(--mg)')}</div>
      ${macroRow('Fibra',T.fb,c.fibra)}

      <section class="card stack"><div class="ch"><h3>Ejercicio</h3><span class="num muted">${n0(b.ex)} kcal</span></div>

        <div class="row"><label class="f" style="flex:1">Pasos del día<input type="number" id="pasos" min="0" step="100" value="${d.pasos||''}" placeholder="0" data-f="pasos"></label>
        <button class="btn primary" data-a="tab:ejercicio" style="align-self:end">Añadir</button></div></section>
      <section class="card stack"><h3>Notas del día</h3><textarea id="nota" data-f="nota" placeholder="Cómo te sentiste, hambre, sueño, si comiste fuera…">${esc(d.nota||'')}</textarea></section>
    </div>

/* ---------- Familia ---------- */
function mesaHoy(){
  const f=todayISO();
  const cols=G.users.map(u=>{const D=dataOf(u);if(!D.perfil.completo)return'';const c=calc(D.perfil);let tot=0;
    const rows=MEALS.filter(m=>(D.perfil.comidas[m.k]||0)>0).map(m=>{const log=((D.dias[f]||{}).c||{})[m.k]||[],pl=(D.plan[f]||{})[m.k]||[],its=log.length?log:pl,k=sum(its).k;if(log.length)tot+=k;
      return`<li><span class="lbl">${m.n}</span><span>${its.length?esc(its.map(i=>i.n).join(', ')):'<span class="muted">Sin nada</span>'}</span>${its.length?`<span class="q">${n0(k)} kcal${log.length?' · comido':' · en el plan'}</span>`:''}</li>`}).join('');
    return`<article class="card mcol" style="--uc:${COLORS[u.color]}"><div class="row between"><div class="row"><span class="av">${ini(u.nombre)}</span><b>${esc(u.nombre)}</b></div><span class="num muted">${n0(tot)} / ${n0(c.kcal)} kcal</span></div>
      <div class="bar"><i style="width:${Math.min(100,tot/c.kcal*100).toFixed(1)}%"></i></div><ul class="mlist">${rows}</ul></article>`}).join('');
  return`<div class="sechead"><div><h2>Mesa de hoy</h2><p class="sub">Qué come cada uno hoy y cuánto lleva. Lo apuntado y, si falta, lo del plan.</p></div>${G.users.length<MAX_USERS?'<button class="btn" data-a="newProfile">+ Nuevo perfil</button>':''}</div>
  <div class="mesa">${cols}</div>`;
}
function vFamilia(){
  const cards=G.users.map(u=>{
    const D=dataOf(u);const uc=COLORS[u.color];
    const head=`<div class="row"><span class="av" style="--uc:${uc}">${ini(u.nombre)}</span><div><b>${esc(u.nombre)}</b><p class="sub">${u.id===ME.id?'Tú':(D&&D.perfil&&D.perfil.completo?METAS[D.perfil.meta]:'Sin completar')}</p></div></div>`;
    if(!D||!D.perfil||!D.perfil.completo)return`<article class="card fcard" style="--uc:${uc}">${head}<p class="muted">Todavía no ha completado su perfil.</p></article>`;
    const p=D.perfil,g=progresoMeta(p,D.pesos||[]);
    const wk=Array.from({length:7},(_,i)=>addDays(todayISO(),i-6));
    const dias=wk.filter(x=>D.dias[x]&&MEALS.some(m=>(D.dias[x].c[m.k]||[]).length)).length;
    const min=wk.reduce((a,x)=>a+((D.dias[x]&&D.dias[x].ej)||[]).reduce((s,e)=>s+e.min,0),0);
    const ps=D.pesos||[];const hace=ps.filter(w=>w.d<=addDays(todayISO(),-28));const ref=hace.length?hace[hace.length-1].kg:(ps[0]||{}).kg;
    const cambio=ref!=null?p.kg-ref:0;
    return`<article class="card fcard" style="--uc:${uc}">${head}
      <dl><div><dt>Peso actual</dt><dd>${n1(p.kg)} kg</dd></div><div><dt>Objetivo</dt><dd>${n1(p.objetivo)} kg</dd></div>
        <div><dt>Últimas 4 semanas</dt><dd>${cambio>0?'+':''}${n1(cambio)} kg</dd></div><div><dt>Ejercicio (7 días)</dt><dd>${min} min</dd></div></dl>
      <div><div class="row between"><span class="lbl">Avance</span><span class="num muted">${Math.round(g.pct*100)} %</span></div><div class="bar"><i style="width:${(g.pct*100).toFixed(1)}%"></i></div></div>
      <p class="note">Apuntó sus comidas ${dias} de los últimos 7 días${(r=>r?` · racha de ${r} día${r>1?'s':''}`:'')(racha(normData(D)))}.</p></article>`;
  }).join('');
  return`${mesaHoy()}<div class="sechead"><div><h2>Avance de cada uno</h2><p class="sub">Para animarse entre todos.</p></div></div>
  <div class="fam">${cards}</div>`;
}

/* ---------- Perfil ---------- */
function vPerfil(){
  const p=U.perfil,c=calc(p);

function foodSearch(ctx){
  const S=ui[ctx];
  return`<section class="stack">
    <label class="f">Buscar alimento<input type="search" id="${ctx}-q" data-q="${ctx}" value="${esc(S.q)}" placeholder="Ej.: arepa, pollo, yogur…" autocomplete="off"></label>
    <div class="chips"><button class="chip" aria-pressed="${!S.cat}" data-a="cat:${ctx}:">Todos</button>${FOOD_CATS.concat(G.propios.length?['Mis alimentos']:[]).map(c=>`<button class="chip" aria-pressed="${S.cat===c}" data-a="cat:${ctx}:${esc(c)}">${esc(c)}</button>`).join('')}</div>
    ${ctx==='ar'?`<div class="cks"><label><input type="checkbox" id="ar-fav" data-f="ar-fav" ${S.fav?'checked':''}>Solo favoritos ★</label></div>`
      :`<div class="chips">${[['todos','Todos'],['fav','Favoritos ★'],['excl','Excluidos'],['noapto','No aptos para mí']].map(([k,n])=>`<button class="chip" aria-pressed="${S.filtro===k}" data-a="filtro:${k}">${n}</button>`).join('')}</div>`}
    <p class="note" id="${ctx}-count"></p>
    <ul class="flist" id="${ctx}-list"></ul>
    <div id="${ctx}-more"></div>
  </section>`;
}
function filterFoods(ctx){
  const S=ui[ctx],q=fold(S.q.trim());
  let L=allFoods();
  if(S.cat)L=L.filter(f=>f.cat===S.cat);
  if(q)L=L.filter(f=>q.split(/\s+/).every(w=>f.s.includes(w)||(SYN[w]&&f.s.includes(SYN[w]))));
  if(ctx==='ar'){L=L.filter(f=>!U.excl[f.id]);if(S.fav)L=L.filter(f=>U.fav[f.id])}
  else if(S.filtro==='fav')L=L.filter(f=>U.fav[f.id]);
  else if(S.filtro==='excl')L=L.filter(f=>U.excl[f.id]);
  else if(S.filtro==='noapto')L=L.filter(f=>blocked(f,U.perfil));
  if(q)L.sort((a,b)=>(a.s.startsWith(q)?0:1)-(b.s.startsWith(q)?0:1)||a.n.localeCompare(b.n,'es'));
  if(ctx==='ar')L.sort((a,b)=>(blocked(a,U.perfil)?1:0)-(blocked(b,U.perfil)?1:0)||(U.fav[b.id]?1:0)-(U.fav[a.id]?1:0));
  return L;
}
function fillFoodList(ctx){
  const S=ui[ctx],L=filterFoods(ctx),list=document.getElementById(ctx+'-list');if(!list)return;
  const shown=L.slice(0,S.show);
  document.getElementById(ctx+'-count').textContent=L.length?`${L.length} alimentos${ctx==='ar'&&Object.keys(U.excl).length?' (sin los que excluiste)':''}. Valores por 100 g, o 100 ml en bebidas.`:'';
  list.innerHTML=shown.length?shown.map(f=>{const bl=blocked(f,U.perfil);return`<li class="${U.excl[f.id]?'excl':''}">
    <div style="min-width:0"><div class="fn">${esc(f.n)}${bl?`<span class="tg">${bl}</span>`:''}</div>
      <div class="fm">${n0(f.k)} kcal · P ${n1(f.p)} · C ${n1(f.c)} · G ${n1(f.g)}${f.porN?` · ${esc(f.porN)} ${qtyTxt(f,f.porG)}`:''} · por ${per100(f)}</div></div>
    <div class="row" style="flex-wrap:nowrap">
      <button class="tog fav" aria-pressed="${!!U.fav[f.id]}" data-a="fav:${f.id}" aria-label="Favorito" title="Favorito">★</button>
      <button class="tog ex" aria-pressed="${!!U.excl[f.id]}" data-a="excl:${f.id}" aria-label="Excluir de mis comidas" title="Excluir de mis comidas">⊘</button>
      ${ctx==='ar'||!U.excl[f.id]?`<button class="add" data-a="arAdd:${f.id}" aria-label="Añadir ${esc(f.n)} al plato" title="Añadir al plato">+</button>`:''}
      ${f.id.startsWith('u-')&&ctx==='al'?`<button class="btn icon ghost" data-a="delPropio:${f.id}" aria-label="Borrar ${esc(f.n)}">×</button>`:''}
    </div></li>`}).join(''):`<li><span class="muted">No hay alimentos con ese filtro. ${ctx==='ar'?'Puedes crear uno en la pestaña Alimentos.':''}</span></li>`;
  document.getElementById(ctx+'-more').innerHTML=L.length>S.show?`<button class="btn" data-a="more:${ctx}">Ver ${Math.min(80,L.length-S.show)} más</button>`:'';
}

function linreg(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;let nu=0,de=0;pts.forEach(p=>{nu+=(p.x-mx)*(p.y-my);de+=(p.x-mx)**2});const b=de?nu/de:0;return{b,a:my-b*mx}}
function vPeso(){
  const p=U.perfil,ws=U.pesos,c=calc(p),goal=p.objetivo;
  const form=`<form id="f-peso" class="card stack"><h3>Nuevo registro</h3>
    <div class="grid2"><label class="f">Fecha<input type="date" id="w-d" value="${todayISO()}" required></label>
    <label class="f">Peso (kg)<input type="number" id="w-kg" step="0.1" min="25" max="350" value="${p.kg}" required></label>
    <label class="f">Cintura (cm)<input type="number" id="w-cin" step="0.5" min="40" max="250" placeholder="opcional"></label>
    <label class="f">Cadera (cm)<input type="number" id="w-cad" step="0.5" min="40" max="250" placeholder="opcional"></label></div>
    <button class="btn primary" type="submit" style="justify-self:start">Guardar peso</button>
    <p class="note">Pésate en ayunas, el mismo día de la semana. Al guardar, tus calorías se recalculan con el peso nuevo.</p></form>`;
  if(!ws.length)return`<div class="sechead"><div><h2>Peso</h2><p class="sub">Apunta tu primer peso para empezar la gráfica.</p></div></div><div class="twocol">${form}</div>`;
  const t0=parseISO(ws[0].d).getTime(),DAY=864e5;
  const pts=ws.map(w=>({x:(parseISO(w.d).getTime()-t0)/DAY,y:w.kg}));
  const recent=pts.slice(-8),{a,b}=linreg(recent);
  const cur=ws[ws.length-1].kg,first=ws[0].kg,perWeek=b*7;
  let proj='Con dos registros o más te digo a qué ritmo vas y cuándo llegarías a tu objetivo.';
  if(pts.length>=2){const toGo=goal-cur;
    if(Math.abs(toGo)<.2)proj='<b>Estás en tu peso objetivo.</b> Ahora toca mantener.';
    else if(Math.sign(toGo)===Math.sign(b)&&Math.abs(b)>1e-4){const dd=addDays(ws[ws.length-1].d,Math.round(toGo/b));proj=`Al ritmo de las últimas semanas (<b class="num">${perWeek>0?'+':''}${n2(perWeek)} kg/semana</b>) llegarás a <b>${n1(goal)} kg</b> hacia el <b>${fdate(dd)}</b>.`}
    else proj=`Al ritmo actual (<span class="num">${perWeek>0?'+':''}${n2(perWeek)} kg/semana</span>) no te acercas al objetivo. Revisa lo que comes en la pestaña Hoy o ajusta tu meta en Perfil.`}
  const W=640,H=250,L=40,R=14,TP=14,B=28;
  const ys=pts.map(q=>q.y).concat(goal),ymin=Math.floor(Math.min(...ys)-1),ymax=Math.ceil(Math.max(...ys)+1);
  const xmax=Math.max(1,pts[pts.length-1].x);
  const X=x=>L+(x/xmax)*(W-L-R),Y=y=>TP+(ymax-y)/(ymax-ymin)*(H-TP-B);
  const step=Math.max(1,Math.ceil((ymax-ymin)/5));
  let grid='';for(let y=ymin;y<=ymax;y+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(y)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${y}</text>`;
  const idx=[...new Set([0,Math.floor((ws.length-1)/2),ws.length-1])];
  const xl=idx.map(k=>`<text x="${X(pts[k].x)}" y="${H-8}" text-anchor="${k===0?'start':k===ws.length-1?'end':'middle'}" font-size="11" fill="var(--muted)">${fdate(ws[k].d)}</text>`).join('');
  const line=pts.map((q,k)=>(k?'L':'M')+X(q.x).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
  const area=line+` L${X(pts[pts.length-1].x).toFixed(1)} ${H-B} L${X(pts[0].x).toFixed(1)} ${H-B} Z`;
  const tx0=recent[0].x,tx1=recent[recent.length-1].x;
  const uc=COLORS[ME.color];
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tu peso">${grid}
    <line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="${W-R}" y="${Y(goal)-6}" text-anchor="end" font-size="11" fill="var(--accent)" font-weight="600">Objetivo ${n1(goal)} kg</text>
    <path d="${area}" fill="${uc}" opacity=".1"/><path d="${line}" fill="none" stroke="${uc}" stroke-width="2.5" stroke-linejoin="round"/>
    ${recent.length>=2?`<line x1="${X(tx0)}" y1="${Y(a+b*tx0)}" x2="${X(tx1)}" y2="${Y(a+b*tx1)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".55"/>`:''}
    ${pts.map((q,k)=>`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="${k===pts.length-1?5:3}" fill="${k===pts.length-1?uc:'var(--surface)'}" stroke="${uc}" stroke-width="2"/>`).join('')}
    <text x="${X(pts[pts.length-1].x)-8}" y="${Y(cur)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${n1(cur)} kg</text>${xl}</svg>`;
  const cin=ws.filter(w=>w.cin);
  return`<div class="sechead"><div><h2>Peso</h2><p class="sub">La línea discontinua es tu tendencia de las últimas 8 mediciones. Las subidas sueltas no importan, importa la tendencia.</p></div></div>
  <div class="stats">
    <div class="stat"><small>Peso actual</small><b>${n1(cur)}</b> kg</div>
    <div class="stat"><small>Desde ${fdate(ws[0].d)}</small><b>${cur-first>0?'+':''}${n1(cur-first)}</b> kg</div>
    <div class="stat"><small>Faltan</small><b>${n1(Math.abs(goal-cur))}</b> kg</div>
    <div class="stat"><small>IMC · ${imcTxt(c.imc)}</small><b>${n1(c.imc)}</b></div>
  </div>
  <div class="card chart">${svg}</div>
  <div class="proj">${proj}</div>
  ${medidas(cin,p)}
  <div class="twocol">${form}
    <div class="tablewrap"><table><tr><th>Fecha</th><th>Peso</th><th>Cambio</th><th>Cintura</th><th></th></tr>
    ${ws.map((w,k)=>({w,k})).slice(-8).reverse().map(({w,k})=>`<tr><td>${fdate(w.d)}</td><td class="num">${n1(w.kg)}</td><td class="num">${k?((w.kg-ws[k-1].kg)>0?'+':'')+n1(w.kg-ws[k-1].kg):'—'}</td><td class="num">${w.cin?n1(w.cin):'—'}</td><td><button class="btn small" data-a="wDel:${k}" aria-label="Borrar el registro del ${fdate(w.d)}">Borrar</button></td></tr>`).join('')}
    </table></div></div>
  `;
}
function medidas(cin,p){
  if(!cin.length)return'';
  const last=cin[cin.length-1],r=last.cin/p.cm;
  const est=r<.5?['ok','Saludable']:r<.6?['hi','Riesgo aumentado']:['warn','Riesgo alto'];
  const cad=[...cin].reverse().find(w=>w.cad);const icc=cad?cad.cin/cad.cad:0;const iccLim=p.sexo==='h'?.9:.85;
  return`<section class="card stack"><div class="ch"><h3>Medidas</h3><span class="pill ${est[0]}">${est[1]}</span></div>
    <div class="grid3"><div><span class="lbl">Cintura</span><p class="num" style="font-size:1.2rem">${n1(last.cin)} cm</p>${cin.length>=2?`<p class="note">${cin[cin.length-1].cin-cin[0].cin>0?'+':''}${n1(cin[cin.length-1].cin-cin[0].cin)} cm desde el ${fdate(cin[0].d)}</p>`:''}</div>
    <div><span class="lbl">Cintura / altura</span><p class="num" style="font-size:1.2rem">${n2(r)}</p><p class="note">Lo sano es menos de 0,50</p></div>
    ${icc?`<div><span class="lbl">Cintura / cadera</span><p class="num" style="font-size:1.2rem">${n2(icc)}</p><p class="note">${icc<iccLim?'Dentro de lo recomendado':'Por encima de '+n2(iccLim)}</p></div>`:''}</div>
    <p class="note">La cintura dice más que la balanza sobre la grasa del abdomen, que es la que más afecta la salud.</p></section>`;
}
function weekKcal(){

  const vals=days.map(x=>({x,k:dayFood(x).k,t:budget(x).total}));

  const avg=logged.length?logged.reduce((a,v)=>a+v.k,0)/logged.length:0;

  return`<section class="card stack"><div class="row between"><h3>Calorías de la semana</h3><span class="muted num">media ${n0(avg)} kcal · ${logged.length}/7 días apuntados</span></div>
    <div class="stack" style="gap:6px">${vals.map(v=>`<div class="macro"><span>${fdate(v.x)}</span><div class="bar"><i class="${v.k>v.t*1.05?'over':''}" style="width:${(v.k/mx*100).toFixed(1)}%"></i></div><span class="num">${n0(v.k)} / ${n0(v.t)}</span></div>`).join('')}</div></section>`;
}

  const exMin=days.reduce((a,x)=>a+day(x).ej.reduce((s,e)=>s+e.min,0),0),exK=days.reduce((a,x)=>a+dayEx(x),0);

  <div class="stats">${st('Proteínas',n0(avg('p'))+' g','de '+c.pg+' g al día')}${st('Carbohidratos',n0(avg('c'))+' g','de '+c.cg+' g al día')}${st('Grasas',n0(avg('g'))+' g','de '+c.gg+' g al día')}${st('Agua',qtyTxt({liq:1},agua),'de '+qtyTxt({liq:1},c.agua)+' al día')}</div>
  <div class="stats">${st('Ejercicio',exMin+' min',n0(exK)+' kcal quemadas')}${st('Ayunos completos',U.ayunos.filter(a=>a.fin>=parseISO(days[0]).getTime()&&a.fin-a.ini>=a.h*36e5).length,'')}${st('Racha',racha(U)+' días','seguidos apuntando')}${st('Fibra',n0(avg('fb'))+' g','de '+c.fibra+' g al día')}</div>

function chart28(){
  const days=Array.from({length:28},(_,i)=>addDays(todayISO(),i-27)),vals=days.map(x=>({x,k:dayFood(x).k,t:budget(x).total}));
  if(!vals.some(v=>v.k))return'';
  const ws=U.pesos.filter(w=>w.d>=days[0]),W=640,H=230,L=40,R=44,T=14,B=26,bw=(W-L-R)/28;
  const mx=Math.max(...vals.map(v=>Math.max(v.k,v.t)),500)*1.08,Y=v=>T+(1-v/mx)*(H-T-B),X=i=>L+i*bw+bw/2;
  let s=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  [0,.5,1].forEach(f=>{const v=Math.round(mx*f/100)*100;s+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${n0(v)}</text>`});
  vals.forEach((v,i)=>{if(v.k)s+=`<rect x="${(L+i*bw+1.5).toFixed(1)}" y="${Y(v.k).toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${(H-B-Y(v.k)).toFixed(1)}" rx="2" fill="${v.k>v.t*1.1?'var(--warn)':'var(--lila)'}"/>`});
  s+=`<polyline points="${vals.map((v,i)=>X(i).toFixed(1)+','+Y(v.t).toFixed(1)).join(' ')}" fill="none" stroke="var(--sun)" stroke-width="2" stroke-dasharray="4 4"/>`;
  if(ws.length>=2){const ys=ws.map(w=>w.kg),lo=Math.min(...ys)-.5,hi=Math.max(...ys)+.5,WY=k=>T+(1-(k-lo)/(hi-lo))*(H-T-B),ix=d=>days.indexOf(d);
    const pts=ws.filter(w=>ix(w.d)>=0).map(w=>[X(ix(w.d)),WY(w.kg)]);
    if(pts.length>=2)s+=`<polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--ok)"/>`).join('');
    s+=`<text x="${W-R+6}" y="${WY(hi-.5)+4}" font-size="10" fill="var(--ok)">${n1(hi-.5)}</text><text x="${W-R+6}" y="${WY(lo+.5)+4}" font-size="10" fill="var(--ok)">${n1(lo+.5)}</text>`}
  [0,13,27].forEach(i=>s+=`<text x="${X(i)}" y="${H-8}" text-anchor="${i?i===27?'end':'middle':'start'}" font-size="10" fill="var(--muted)">${fdate(days[i])}</text>`);

    <div class="legend2"><span><i style="background:var(--lila)"></i>Calorías del día</span><span><i style="background:var(--warn)"></i>Más de 10 % sobre el objetivo</span><span><i style="background:var(--sun)"></i>Objetivo</span>${ws.length>=2?'<span><i style="background:var(--ok)"></i>Peso (kg)</span>':''}</div></section>`;
}

const plural=(w,n)=>n===1?w:/[aeiouáéó]$/.test(w)?w+'s':w+'es';
function compraData(){
  const ws=ui.plan.semana,users=ui.compra.fam?G.users:[ME],tot={},ref={};
  const add=(id,g,o)=>{tot[id]=(tot[id]||0)+g;ref[id]=o};
  users.forEach(u=>{const D=dataOf(u);for(let i=0;i<7;i++){const pd=D.plan[addDays(ws,i)]||{};Object.values(pd).forEach(its=>its.forEach(it=>{if(it.rec){const r=RECBY[it.f];if(r)r.ings.forEach(x=>add(x.f.id,x.g*it.por,x.f))}else add(it.f,it.g,it)}))}});
  const cats={};Object.keys(tot).forEach(id=>{const c=(foodById(id)||{}).cat||'Otros';(cats[c]=cats[c]||[]).push(id)});
  const order=Object.keys(cats).sort((a,b)=>(FOOD_CATS.indexOf(a)+1||99)-(FOOD_CATS.indexOf(b)+1||99));
  order.forEach(c=>cats[c].sort((a,b)=>ref[a].n.localeCompare(ref[b].n,'es')));
  return{ws,tot,ref,cats,order,n:Object.keys(tot).length};
}
function qty(it,g){
  const o=it.cat?it:itemObj(it);
  let s=qtyTxt(o,g>=10?Math.ceil(g/10)*10:g);
  const m=(it.porN||'').match(/^1 (unidad|mediana|mediano|filete|presa|tajada)\b/);
  if(m&&it.porG){const n=Math.max(1,Math.round(g/it.porG));s+=` · ${n} ${plural(m[1]==='mediana'||m[1]==='mediano'?'unidad':m[1],n)}`}
  return s;
}

      ${pres?`<div class="bar"><i class="${total>pres?'over':''}" style="width:${Math.min(100,total/pres*100).toFixed(1)}%"></i></div><span class="pill ${total>pres?'warn':'ok'}" style="justify-self:start">${total>pres?`Te pasas ${sol(total-pres)}: activa el modo económico en el plan`:`Te sobran ${sol(pres-total)}`}</span>`:''}</div></section>

function listText(){

let scanStream=null,scanTimer=null,scanReader=null,zxP=null;
const FMT=['ean_13','ean_8','upc_a','upc_e','code_128'];
const hasBD=()=>'BarcodeDetector' in window;
function stopScan(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanReader){try{scanReader.reset()}catch(e){}scanReader=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
function loadZX(){if(window.ZXing)return Promise.resolve(window.ZXing);if(zxP)return zxP;
  zxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='zxing.min.js';s.onload=()=>window.ZXing?res(window.ZXing):rej(new Error('lector'));s.onerror=()=>{zxP=null;rej(new Error('No se pudo cargar el lector de códigos.'))};document.head.appendChild(s)});return zxP}

const scanSay=m=>{if(ui.modal)ui.modal.st=m;const e=document.getElementById('scan-st');if(e)e.textContent=m};

      <div class="row"><select id="scan-meal" aria-label="Comida" style="width:auto">${MEALS.map(m=>`<option value="${m.k}" ${m.k===meal?'selected':''}>${m.n}</option>`).join('')}</select>

      <div class="row"><button class="btn primary" type="submit">Guardar producto</button><button type="button" class="btn ghost" data-a="scanAgain">Escanear otro</button></div></form>`;
  else body=`<div class="scanbox"><video id="scan-v" class="scanv" playsinline muted hidden></video><div class="aim" id="scan-aim" hidden></div></div>

      <div class="row"><label class="btn primary filebtn">Tomar foto del código<input type="file" accept="image/*" capture="environment" id="scan-photo" aria-label="Tomar foto del código de barras"></label>

async function startScan(){
  const v=document.getElementById('scan-v');if(!v)return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){scanSay('Aquí no se puede abrir la cámara en vivo. Toma una foto del código: funciona igual.');return}
  const show=()=>{v.hidden=false;const a=document.getElementById('scan-aim');if(a)a.hidden=false;scanSay('Apunta al código de barras y mantenlo dentro del recuadro.')};
  try{
    if(hasBD()){const det=new BarcodeDetector({formats:FMT});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      v.srcObject=scanStream;await v.play();show();
      scanTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){stopScan();found(r[0].rawValue)}}catch(e){}},300);
    }else{const Z=await loadZX();scanReader=zxReader(Z);show();
      scanReader.decodeFromConstraints({video:{facingMode:'environment'}},v,res=>{if(res){const c=res.getText();stopScan();found(c)}})
        .catch(()=>{stopScan();v.hidden=true;scanSay('No se pudo abrir la cámara. Toma una foto del código: funciona igual.')});
    }
  }catch(e){stopScan();v.hidden=true;scanSay('No se pudo abrir la cámara. Toma una foto del código: funciona igual.')}
}
async function decodePhoto(file){
  stopScan();const v=document.getElementById('scan-v');if(v)v.hidden=true;const a=document.getElementById('scan-aim');if(a)a.hidden=true;
  scanSay('Leyendo el código de la foto…');
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('foto'));i.src=URL.createObjectURL(file)});
    const W=img.naturalWidth,H=img.naturalHeight;
    const draw=(rot,max)=>{const s=Math.min(1,max/Math.max(W,H)),w=Math.round(W*s),h=Math.round(H*s),c=document.createElement('canvas');c.width=rot?h:w;c.height=rot?w:h;const x=c.getContext('2d');if(rot){x.translate(h,0);x.rotate(Math.PI/2)}x.drawImage(img,0,0,w,h);return c};
    for(const [rot,max] of [[0,1600],[0,900],[1,1600]]){
      const cv=draw(rot,max);
      if(hasBD()){try{const r=await new BarcodeDetector({formats:FMT}).detect(cv);if(r.length)return found(r[0].rawValue)}catch(e){}}
      try{const Z=await loadZX();const res=await zxReader(Z).decodeFromImageUrl(cv.toDataURL('image/png'));if(res)return found(res.getText())}catch(e){}
    }
    scanSay('No pudimos leer el código en esa foto. Acércate más, con buena luz y el código derecho, o escribe el número.');
  }catch(e){scanSay('No se pudo leer la foto.')}
}
function found(code){
  code=String(code||'').replace(/\D/g,'');if(code.length<6){scanSay('Ese código no es válido. Escribe el número que está debajo de las barras.');return}
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  const loc=allFoods().find(f=>f.code===code);
  if(loc){ui.modal={...ui.modal,code,prod:{...loc,src:'local'},manual:false};return render()}
  return lookup(code);
}
async function lookup(code){
  ui.modal.code=code;scanSay('Código '+code+'. Buscando el producto…');
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_es,brands,nutriments,serving_size,quantity`);const j=await r.json();
    if(j.status!==1||!j.product){ui.modal.manual=true;ui.modal.st=`El producto ${code} no está en la base de datos.`;return render()}
    const P=j.product,N=P.nutriments||{},kcal=N['energy-kcal_100g']??(N['energy_100g']!=null?N['energy_100g']/4.184:null);

    case'arSave':{const A=ui.ar,d=day(A.fecha,true);d.c[A.meal]=(d.c[A.meal]||[]).concat(A.items.map(i=>({...i,id:uid()})));saveU();

    case'ftipo':ui.fotos.tipo=x;break;

function setPressed(el){el.parentElement.querySelectorAll('[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',b===el))}
async function infoSheet(id){try{const all=await PH.byUser(ME.id);const p=all.find(x=>x.id===id);if(!p)return;
  document.getElementById('sheet-img').src=PH.url(p);document.getElementById('sheet-info').textContent=`${fday(p.fecha)} · ${p.meal?MEALN[p.meal]:TIPON[p.tipo]}`}catch(e){}}

async function exportar(){
  const data={app:'balanza-y-plato',v:1,fecha:new Date().toISOString(),G,users:{},fotos:[]};
  G.users.forEach(u=>data.users[u.id]=LS.get('nutri:u:'+u.id));
  try{for(const u of G.users)for(const p of await PH.byUser(u.id))data.fotos.push({...p,blob:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(p.blob)})})}catch(e){}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`balanza-y-plato-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();
  toast('Copia preparada. Si no se descarga, ábrelo desde la app instalada.');
}
async function importar(file){
  try{const data=JSON.parse(await file.text());if(data.app!=='balanza-y-plato')throw new Error('Ese archivo no es una copia de Balanza y Plato.');
    G=data.G;saveG();for(const id in data.users)if(data.users[id])LS.set('nutri:u:'+id,data.users[id]);
    for(const p of data.fotos||[]){const[h,b]=p.blob.split(',');const bin=atob(b);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      await PH.put({...p,blob:new Blob([u8],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'})})}
    toast('Copia cargada.');toPicker(false);
  }catch(e){toast(e.message||'No se pudo leer la copia.')}
}
async function wipe(){
  G.users.forEach(u=>LS.del('nutri:u:'+u.id));LS.del(GKEY);LS.del(LAST);
  try{for(const u of G.users)for(const p of await PH.byUser(u.id))await PH.del(p.id)}catch(e){}
  G={v:1,users:[],propios:[]};toPicker(true);
}

    const c=document.querySelector('input[name="np-c"]:checked');
    const u={id:uid(),nombre:n.slice(0,20),color:c?+c.value:freeColor()};G.users.push(u);saveG();
    toast(`Perfil de ${u.nombre} creado. Completa tus datos.`);return enter(u)}
  if(id==='f-propio'){
    const fl=[...document.querySelectorAll('[id^="pr-fl-"]:checked')].map(c=>c.value).join('');
    const n=v('pr-n').trim();if(!n)return;
    G.propios.push({id:'u-'+uid(),n,cat:'Mis alimentos',k:+v('pr-k')||0,p:+v('pr-p')||0,c:+v('pr-c')||0,g:+v('pr-g')||0,fb:+v('pr-fb')||0,fl,porN:v('pr-pn').trim(),porG:+v('pr-pg')||0,code:v('pr-code').replace(/\D/g,''),liq:document.getElementById('pr-liq').checked});
    saveG();ui.al.cat='Mis alimentos';ui.al.q='';toast(`${n} guardado.`);render();return}
  if(id==='f-ejlibre'){
    const n=v('el-n').trim(),min=parseInt(v('el-m'))||0;if(!n||!min)return;const kc=parseFloat(v('el-k'));const met=parseFloat(v('el-i'))||5;
    day(ui.fecha,true).ej.push({id:uid(),n,met,min,kcal:Math.round(isFinite(kc)&&kc>0?kc:exKcal(met,min,U.perfil.kg))});saveU();toast(`${n} añadido.`);render();return}
  if(id==='f-peso'){
    const d=v('w-d'),kg=parseFloat(v('w-kg')),cin=parseFloat(v('w-cin'));if(!d||!isFinite(kg))return;
    const cad=parseFloat(v('w-cad'));const ex=U.pesos.find(w=>w.d===d);const rec={d,kg:Math.round(kg*10)/10};if(isFinite(cin))rec.cin=cin;if(isFinite(cad))rec.cad=cad;
    if(ex)Object.assign(ex,rec);else U.pesos.push(rec);U.pesos.sort((a,b)=>a.d.localeCompare(b.d));syncKg();saveU();toast('Peso guardado. Calorías recalculadas.');actualizarGasto(true);render();return}
});

/* ---------- Arranque ---------- */
(function boot(){
  rebuildRecipes();
  G.users=(G.users||[]).map(u=>({id:u.id,nombre:u.nombre,color:u.color??0}));
  const last=LS.get(LAST);const u=G.users.find(x=>x.id===last);
  if(u)return enter(u);
  toPicker(!G.users.length);
})();
setInterval(()=>{if(nubeOn()&&document.visibilityState==='visible')syncNow()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
document.addEventListener('focusout',()=>{if(pendRender){setTimeout(()=>{if(pendRender&&!['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName)){pendRender=false;render()}},200)}});
if(nubeOn())setTimeout(syncNow,800);
setInterval(()=>{if(ui.screen==='app'&&!ui.modal&&!ui.sheet&&U&&U.ayuno&&['ayuno','hoy'].includes(ui.tab)&&!['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName))render()},30000);
if('serviceWorker' in navigator&&location.protocol==='https:'&&document.querySelector('meta[name="nutri-pwa"]')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}));
}
</script>
