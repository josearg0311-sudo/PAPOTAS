<!doctype html>
<html lang="es" data-tema="tech">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F0D">
<title>Progresa</title>
<style>
/*@FUENTES@*/
:root{
  --m1:#1F7A55; --m2:#D9692F; --m3:#2F5D8C;
  --cP:#4FD1C5; --cC:#F6C453; --cG:#F28AB2; --ok:#34D399; --med:#F6C453; --mal:#F87171;
  --r:18px; --nav:66px;
}
/* tema tecnológico (por defecto) */
:root[data-tema=tech]{
  --bg:#070C0A; --bg2:#0C1411; --s1:rgba(255,255,255,.045); --s2:rgba(255,255,255,.075); --s3:rgba(255,255,255,.12);
  --bd:rgba(255,255,255,.085); --bd2:rgba(255,255,255,.14); --tx:#E9F2EE; --tx2:#8FA39A; --tx3:#5E7068;
  --brillo:0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.35);
  --vidrio:blur(14px) saturate(140%);
  color-scheme:dark;
}
/* tema claro crema */
:root[data-tema=claro]{
  --bg:#FBF8F2; --bg2:#F4EFE4; --s1:#FFFFFF; --s2:#F6F2EA; --s3:#ECE6D9;
  --bd:#E6E0D3; --bd2:#D9D1C0; --tx:#17251F; --tx2:#55655D; --tx3:#8B968F;
  --brillo:0 1px 2px rgba(23,37,31,.06),0 6px 18px rgba(23,37,31,.07);
  --vidrio:none; --cP:#0F8F83; --cC:#C9961A; --cG:#C44D7F; --ok:#1F7A55; --med:#C9961A; --mal:#C2412D;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1,"cv11" 1}
:root[data-tema=tech] body{background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--m) 22%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(79,209,197,.07),transparent 60%),var(--bg);background-attachment:fixed}
:root[data-tema=tech] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(#000,transparent 70%)}
h1,h2,h3,h4,.pop{font-family:Poppins,Inter,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15.5px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.suave{color:var(--tx2)} .peq{font-size:13px} .mini{font-size:12px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2)}
.num{font-family:Poppins,Inter,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}

/* cabecera */
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:var(--vidrio);-webkit-backdrop-filter:var(--vidrio);border-bottom:1px solid var(--bd)}
.cab{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.cab .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--m),color-mix(in srgb,var(--m) 50%,#4FD1C5));color:#fff;font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:14px;box-shadow:0 0 18px color-mix(in srgb,var(--m) 55%,transparent)}
.cab .t{flex:1;min-width:0}
.cab h1{font-size:16px;line-height:1.2}
.cab .sub{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icono-btn{background:var(--s2);border:1px solid var(--bd);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--tx)}
.icono-btn svg{width:20px;height:20px}

main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:14px 16px calc(var(--nav) + 34px + env(safe-area-inset-bottom))}
section.tab{display:none} section.tab.on{display:block;animation:entra .3s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* barra inferior */
nav.barra{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;border-radius:22px;background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:var(--vidrio);-webkit-backdrop-filter:var(--vidrio);border:1px solid var(--bd2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
nav.barra .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.barra button{border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--tx3);position:relative;transition:color .2s}
nav.barra svg{width:23px;height:23px;transition:transform .2s}
nav.barra button.on{color:var(--tx)}
nav.barra button.on svg{color:var(--m);transform:translateY(-2px);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--m) 70%,transparent))}
nav.barra button.on::after{content:"";position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--m);box-shadow:0 0 8px var(--m)}

/* piezas */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--brillo);backdrop-filter:var(--vidrio);-webkit-backdrop-filter:var(--vidrio)}
.pila>*+*{margin-top:12px}
.fila{display:flex;align-items:center;gap:8px}
.entre{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{white-space:nowrap;border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--m);color:#fff;min-height:42px;box-shadow:0 4px 16px color-mix(in srgb,var(--m) 35%,transparent);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:color-mix(in srgb,var(--m) 16%,transparent);color:var(--tx);box-shadow:none;border:1px solid color-mix(in srgb,var(--m) 40%,transparent)}
.btn.borde{background:var(--s2);border:1px solid var(--bd2);color:var(--tx);box-shadow:none}
.btn.chico{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ancho{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.chip{border:1px solid var(--bd2);background:var(--s1);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;min-height:36px;transition:all .15s;color:var(--tx)}
.chip.on{background:var(--m);border-color:var(--m);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--m) 45%,transparent)}
.chip .e{margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.etq{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--m) 18%,transparent);color:var(--tx);white-space:nowrap;border:1px solid color-mix(in srgb,var(--m) 35%,transparent)}
.etq.pre{background:rgba(246,196,83,.14);border-color:rgba(246,196,83,.4)} .etq.post{background:rgba(79,209,197,.14);border-color:rgba(79,209,197,.4)}
.etq.gris{background:var(--s2);border-color:var(--bd)}
.barra-p{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}
.barra-p>i{display:block;height:100%;border-radius:99px;background:var(--m);transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px color-mix(in srgb,var(--m) 60%,transparent)}
.tip{border:1px solid color-mix(in srgb,var(--m) 35%,transparent);background:color-mix(in srgb,var(--m) 10%,transparent);border-radius:14px;padding:10px 12px;font-size:13.5px}
.vacio{text-align:center;padding:22px 10px;color:var(--tx2);font-size:14px}
.titulo-sec{margin:22px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.titulo-sec h2{font-size:16.5px}
input[type=number],input[type=date],input[type=text],input[type=search],select{border:1px solid var(--bd2);background:var(--s1);border-radius:12px;padding:9px 11px;min-height:42px;width:100%;color:var(--tx)}
select option{background:var(--bg2);color:var(--tx)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--m);outline-offset:2px}
label.campo{display:block;font-size:12px;font-weight:600;color:var(--tx2)}
label.campo>input,label.campo>select{margin-top:4px}
.rejilla2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--tx2);transition:all .15s}
.seg button.on{background:var(--m);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--m) 45%,transparent)}
.macro{display:flex;gap:10px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.macro b{color:var(--tx);font-weight:600}
.macro i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:1px}
.mbar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:var(--s3);margin-top:6px}
.mbar i{display:block;height:100%}
.ilus{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:var(--s2);border:1px solid var(--bd)}
.ilus.chica{width:40px;height:40px;font-size:21px;border-radius:12px}
.ilus.grande{width:64px;height:64px;font-size:34px;border-radius:18px}
.match{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.flota{display:inline-block;animation:flota 3.2s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m) 60%,transparent)}50%{box-shadow:0 0 0 8px transparent}}

/* HOY */
.semana{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:4px;align-items:center;margin-bottom:12px}
.semana .flecha{border:0;background:none;color:var(--tx2);font-size:18px;height:54px}
.dia-b{border:1px solid var(--bd);background:var(--s1);border-radius:14px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:all .15s;padding:0}
.dia-b small{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--tx2);text-transform:uppercase}
.dia-b b{font-family:Poppins,Inter,sans-serif;font-size:16px}
.dia-b .pts{display:flex;gap:2px;height:5px}
.dia-b .pts i{width:5px;height:5px;border-radius:50%;background:var(--s3)}
.dia-b .pts i.si{background:var(--m)}
.dia-b.hoy{border-color:color-mix(in srgb,var(--m) 60%,transparent)}
.dia-b.sel{background:var(--m);border-color:var(--m);color:#fff;box-shadow:0 0 16px color-mix(in srgb,var(--m) 50%,transparent)}
.dia-b.sel small{color:rgba(255,255,255,.85)} .dia-b.sel .pts i{background:rgba(255,255,255,.35)} .dia-b.sel .pts i.si{background:#fff}
.dia-b:disabled{opacity:.3}
.hud{position:relative;overflow:hidden;border-radius:22px;padding:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--m) 34%,var(--bg2)),var(--bg2) 70%);border:1px solid color-mix(in srgb,var(--m) 35%,var(--bd));box-shadow:var(--brillo)}
:root[data-tema=claro] .hud{background:linear-gradient(145deg,var(--m),color-mix(in srgb,var(--m) 70%,#000));color:#fff;border:0}
:root[data-tema=claro] .hud .suave,:root[data-tema=claro] .hud .lbl{color:rgba(255,255,255,.85)}
.hud::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);pointer-events:none}
.hud>*{position:relative;z-index:1}
.anillos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.anillo{position:relative;border:1px solid var(--bd);background:rgba(0,0,0,.18);border-radius:16px;padding:8px 4px 8px;color:inherit;display:flex;flex-direction:column;align-items:center}
:root[data-tema=claro] .anillo{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.anillo svg{width:74px;height:74px;overflow:visible}
.anillo .arco{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.anillo .centro{position:absolute;top:30px;left:0;right:0;text-align:center;font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:16px;line-height:1}
.anillo .centro small{display:block;font-size:9.5px;font-weight:600;opacity:.75;margin-top:2px}
.anillo .pie{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:3px}
.pastilla{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid var(--bd2);color:inherit;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
:root[data-tema=claro] .pastilla{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
.pastilla.boton{background:#fff;color:#0A0F0D;border-color:#fff}
.entrenos{display:grid;gap:8px}
.act-fila{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:6px 8px}
.act-ico{font-size:22px;text-align:center}
.mini-seg{display:flex;width:100%}
.mini-seg button{flex:1;padding:7px 2px;font-size:11.5px}
.regla-graf{display:flex;align-items:stretch;gap:4px;margin-top:10px;text-align:center}
.regla-graf>div{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;gap:2px;justify-content:center}
.regla-graf span{font-size:22px}
.regla-graf small{font-size:10.5px;color:var(--tx2)}
.regla-graf b{font-size:11px;color:var(--tx)}
.regla-graf .fl{flex:none;background:none;border:0;font-size:16px;color:var(--m);font-weight:700;padding:0 2px}
details.plegable>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.plegable>summary::-webkit-details-marker{display:none}
details.plegable>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--tx2);border-bottom:2px solid var(--tx2);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.plegable[open]>summary::after{transform:rotate(225deg)}
.linea-tiempo{position:relative;padding-left:18px}
.linea-tiempo::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(var(--m),transparent)}
.linea-tiempo>*{position:relative;margin-bottom:10px}
.franja{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:8px;margin:16px 0 8px -18px}
.franja span{width:26px;height:26px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--m);display:grid;place-items:center;font-size:13px;z-index:1;box-shadow:0 0 10px color-mix(in srgb,var(--m) 45%,transparent)}
.hito{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#fff;background:linear-gradient(90deg,var(--m),color-mix(in srgb,var(--m) 55%,#000));border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px color-mix(in srgb,var(--m) 30%,transparent)}
.hito-ico{font-size:21px;animation:flota 2.4s ease-in-out infinite}
.comida{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--brillo);overflow:hidden;transition:opacity .2s,border-color .2s}
.comida.hecha{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.comida.hecha .ilus{filter:saturate(.6)}
.comida .cab-c{display:flex;gap:11px;padding:12px;align-items:flex-start}
.comida .info{flex:1;min-width:0}
.comida .nombre{font-family:Poppins,Inter,sans-serif;font-weight:600;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.comida .formula{font-size:12.5px;color:var(--tx2);margin-top:3px}
.comida .elegida{font-size:14px;margin-top:3px;font-weight:600;line-height:1.3}
.comida .acciones{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.elegir{width:100%;border:1.5px dashed color-mix(in srgb,var(--m) 55%,transparent);background:color-mix(in srgb,var(--m) 8%,transparent);color:var(--tx);border-radius:13px;padding:11px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.elegir:hover{background:color-mix(in srgb,var(--m) 14%,transparent)}
.check{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--bd2);background:var(--s1);display:grid;place-items:center;transition:all .2s;color:#fff}
.check svg{width:18px;height:18px;opacity:0;transform:scale(.5);transition:all .2s}
.check.on{background:var(--ok);border-color:var(--ok);animation:pop .35s ease;box-shadow:0 0 14px color-mix(in srgb,var(--ok) 55%,transparent)}
.check.on svg{opacity:1;transform:none}
.vasos{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.vaso-btn{border:0;background:none;padding:0;cursor:pointer;transition:transform .15s}
.vaso-btn:active{transform:scale(.85)}
.vaso{width:20px;height:26px}
.agua-in{animation:llena .45s ease-out;transform-origin:bottom;transform-box:fill-box}
@keyframes llena{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.contador{display:flex;align-items:center;gap:8px}
.redondo{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd2);background:var(--s2);font-size:20px;font-weight:600;display:grid;place-items:center;line-height:1}
.redondo.lleno{background:var(--m);color:#fff;border-color:var(--m)}
.antojo{width:100%;border:1px solid rgba(242,138,178,.35);border-radius:var(--r);padding:14px;background:linear-gradient(135deg,rgba(242,138,178,.16),rgba(246,196,83,.12));color:var(--tx);font-weight:700;font-family:Poppins,Inter,sans-serif;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.acc-rapidas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acc{border:1px solid var(--bd);background:var(--s1);border-radius:14px;padding:11px;display:flex;align-items:center;gap:9px;text-align:left;font-size:13px;font-weight:600}
.acc span{font-size:22px}
.acc small{display:block;font-weight:500;color:var(--tx2);font-size:11.5px}

/* hoja / selector */
.velo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:velo .2s ease}
@keyframes velo{from{opacity:0}to{opacity:1}}
.hoja{background:var(--bg2);border:1px solid var(--bd2);border-bottom:0;width:100%;max-width:620px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sube .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.hoja.alta{height:93vh}
@media(min-width:700px){.velo{align-items:center}.hoja{border-radius:24px;border-bottom:1px solid var(--bd2)}}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.hoja .cerrar{float:right;border:1px solid var(--bd);background:var(--s2);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;color:var(--tx)}
.hoja .agarre{width:40px;height:4px;border-radius:4px;background:var(--bd2);margin:-6px auto 12px}
.opcion-grande{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:9px}
.opcion-grande .letra{flex:none;width:36px;height:36px;border-radius:11px;background:var(--m);color:#fff;display:grid;place-items:center;font-family:Poppins,Inter,sans-serif;font-weight:700}
.opcion-grande b{display:block;font-size:14.5px}
.opcion-grande span{font-size:12.5px;color:var(--tx2)}
.pasos{display:flex;gap:6px;margin:12px 0}

'use strict';
const RECETARIO = /*@RECETARIO@*/;

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const fmt = (n, d = 0) => Number(n).toLocaleString('es-ES', {minimumFractionDigits: d, maximumFractionDigits: d});

const sinTilde = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function vibrar() { try { navigator.vibrate?.(12); } catch (e) {} }

/* ============ fechas y fases ============ */
const pad = n => String(n).padStart(2, '0');
const clave = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const deClave = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const hoyFecha = (() => {
  // ?hoy=2026-12-10 sirve para probar otra fecha
  try { const q = new URLSearchParams(location.search).get('hoy'); if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return deClave(q); } catch (e) {}
  const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate());
})();
const HOY = clave(hoyFecha);
const sumar = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];

const fCorta = d => `${d.getDate()} ${MESES[d.getMonth()]}`;

const tazas = t => t === 1 ? '1 taza' : t === .75 ? '¾ taza' : t === .5 ? '½ taza' : t === .25 ? '¼ taza' : t === 1.25 ? '1¼ taza' : t === 1.5 ? '1½ taza' : `${fmt(t, 2)} taza`;

/* =====================================================================
   PERFILES: cada persona tiene su propio perfil y sus propios datos
   ===================================================================== */
const K_PERFILES = 'progresa:perfiles', K_DATOS = id => 'progresa:p:' + id, K_VIEJO = 'plan90';

const base = () => ({v: 3, perfil: null, dias: {}, pesos: [], cintura: [], favRecetas: [], favPlatos: [], lecciones: {}, checkpoints: {}, compras: {}, ui: {tab: 'hoy', tema: 'tech'}});

function normalizar(o) {
  const b = base();
  if (!o || typeof o !== 'object') return b;
  for (const k of Object.keys(b)) if (o[k] !== undefined && o[k] !== null && typeof o[k] === typeof b[k] && Array.isArray(o[k]) === Array.isArray(b[k])) b[k] = o[k];
  if (o.perfil && typeof o.perfil === 'object') b.perfil = {...perfilBase(), ...o.perfil, manual: {...perfilBase().manual, ...(o.perfil.manual || {})}};
  b.ui = {...base().ui, ...b.ui};
  b.pesos = b.pesos.filter(x => x && typeof x.f === 'string' && isFinite(x.kg));
  b.cintura = b.cintura.filter(x => x && typeof x.f === 'string' && isFinite(x.cm));
  for (const k of Object.keys(b.dias)) { const d = b.dias[k]; if (!d || typeof d !== 'object') { delete b.dias[k]; continue; } d.comidas ||= {}; d.extras ||= []; d.agua ||= 0; }
  return b;
}

   ===================================================================== */
const INICIO = deClave(PF.inicio || HOY);
const diaN = d => Math.round((d - INICIO) / 864e5);
const bmr = w => 10 * w + 6.25 * PF.talla - 5 * PF.edad + (PF.sexo === 'm' ? -161 : 5);
const deportesActivos = () => Object.entries(PF.deportes || {}).filter(([k, v]) => DEPORTES[k] && v && v.dias > 0);
const diasEntreno = () => Math.min(7, deportesActivos().reduce((a, [, v]) => a + v.dias, 0));
const gastoDeporte = w => deportesActivos().reduce((a, [k, v]) => a + v.dias * (DEPORTES[k].met - 1) * w * (v.h || DEPORTES[k].h), 0) / 7;
const tdee = w => bmr(w) * (TRABAJOS[PF.trabajo]?.f || 1.2) + gastoDeporte(w);
const minimoKcal = () => PF.sexo === 'm' ? 1200 : 1500;
const red10 = n => Math.round(n / 10) * 10;
// promedio diario de calorías para un peso dado (modo automático)
function promedioAuto(w) {
  const t = tdee(w);
  if (PF.objetivo === 'mantener') return t;
  const delta = PF.ritmo * 7700 / 7;
  if (PF.objetivo === 'subir') return t + delta;
  return Math.max(minimoKcal(), bmr(w) * 1.05, t - Math.min(delta, t * .25));
}
// del promedio a días de entreno y descanso (300 kcal de diferencia)
function partir(prom) {
  const nT = diasEntreno();
  if (!nT) return {entreno: red10(prom + 200), descanso: red10(prom)};
  const entreno = prom + 300 * (7 - nT) / 7;
  return {entreno: red10(entreno), descanso: red10(entreno - 300)};
}
const COLORES_ETAPA = [['#1F7A55', '#2BC48A'], ['#D9692F', '#FF8A4C'], ['#2F5D8C', '#5B9BFF'], ['#7A3FA0', '#B07CFF'], ['#A33A55', '#FF6B95'], ['#2E7D7A', '#3FD6CF']];
const etapaN = d => Math.max(1, Math.floor(diaN(d) / 28) + 1);
const promedioSemanaReal = (desde, hasta) => { const v = S.pesos.filter(x => x.f >= clave(desde) && x.f < clave(hasta)).map(x => x.kg); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const ajusteHasta = k => (PF.ajustes || []).filter(a => a.f <= k).reduce((s, a) => s + a.kcal, 0);
const cacheEtapa = {};
function etapa(n) {
  if (cacheEtapa[n]) return cacheEtapa[n];
  const desde = sumar(INICIO, (n - 1) * 28), hasta = sumar(desde, 27);
  // peso de referencia: lo real de la última semana antes de la etapa, si hay; si no, lo proyectado
  const real = n > 1 ? promedioSemanaReal(sumar(desde, -7), desde) : null;
  const w = real ?? PROY.peso[Math.min((n - 1) * 4, PROY.peso.length - 1)] ?? PF.peso0;
  let kc;
  if (PF.manual?.on) kc = {entreno: PF.manual.entreno - (PF.manual.paso || 0) * (n - 1), descanso: PF.manual.descanso - (PF.manual.paso || 0) * (n - 1)};
  else kc = partir(promedioAuto(w));
  const aj = ajusteHasta(clave(hasta));
  kc.entreno = Math.max(minimoKcal() + 300, kc.entreno + aj); kc.descanso = Math.max(minimoKcal(), kc.descanso + aj);
  const r4 = x => clamp(Math.round(x * 4) / 4, .5, 1.5);
  const comidaRef = kc.entreno * 28 / 90;
  const [color, neon] = COLORES_ETAPA[(n - 1) % COLORES_ETAPA.length];
  return (cacheEtapa[n] = {n, nombre: `Etapa ${n}`, color, neon, desdeF: desde, hastaF: hasta, desde: fCorta(desde), hasta: fCorta(hasta), entreno: kc.entreno, descanso: kc.descanso, pesoRef: r1(w),
    arrozAlm: r4(comidaRef / 720), arrozCen: r4(comidaRef * 25 / 28 / 720)});
}
// proteína: 1,8 g/kg (2 g/kg si gana músculo), redondeada a 5
const PROT_META = Math.round((PF.objetivo === 'subir' ? 2 : 1.8) * Math.min(PF.peso0, (PF.meta || PF.peso0) * 1.25) / 5) * 5;
const aguaBase = () => Math.round(PF.peso0 * .035 * 4) / 4;

// proyección semana a semana con el gasto recalculado según el peso
const PROY = (() => {
  const peso = [PF.peso0], cint = PF.cintura0 ? [PF.cintura0] : null;
  const kc = PF.sexo === 'm' ? .85 : 1;
  const nT = diasEntreno();
  const maxW = PF.objetivo === 'mantener' ? 12 : 52;
  let w = PF.peso0;
  for (let s = 1; s <= maxW; s++) {
    const n = Math.floor((s - 1) / 4) + 1;
    let e;
    if (PF.manual?.on) e = {entreno: PF.manual.entreno - (PF.manual.paso || 0) * (n - 1), descanso: PF.manual.descanso - (PF.manual.paso || 0) * (n - 1)};
    else e = partir(promedioAuto(peso[(n - 1) * 4] ?? w));
    const prom = (nT * e.entreno + (7 - nT) * e.descanso) / 7;
    const cambio = (prom - tdee(w)) * 7 / 7700;
    w = r1(w + cambio);
    peso.push(w);
    if (cint) cint.push(r1(PF.cintura0 - (PF.peso0 - w) * kc));
    const llego = PF.objetivo === 'bajar' ? w <= PF.meta : PF.objetivo === 'subir' ? w >= PF.meta : false;
    if (llego && s >= 4) break;
  }
  return {peso, cint, semanas: peso.length - 1};
})();
const SEMANAS = Math.max(4, PROY.semanas);
const DIAS_BLOQUE = SEMANAS * 7;
const PROY_PESO = PROY.peso, PROY_CINT = PROY.cint || PROY.peso.map(() => null);

let tToast;
function toast(msg) {
  $('.toast')?.remove(); clearTimeout(tToast);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.append(t); tToast = setTimeout(() => t.remove(), 2600);
}
function hoja(html, {alCerrar, sinCerrar, alta} = {}) {
  cerrarHoja(true);
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="hoja ${alta ? 'alta' : ''}" role="dialog" aria-modal="true"><div class="agarre"></div>${sinCerrar ? '' : '<button class="cerrar" aria-label="Cerrar">×</button>'}${html}</div>`;
  v._alCerrar = alCerrar;
  v.addEventListener('click', e => { if (!sinCerrar && (e.target === v || e.target.closest('.cerrar'))) cerrarHoja(); });
  document.body.append(v); document.body.style.overflow = 'hidden';
  return v.firstElementChild;
}
function cerrarHoja(silencio) {
  const v = $('.velo'); if (!v) return;
  v.remove(); document.body.style.overflow = '';
  if (!silencio) v._alCerrar?.();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.velo .cerrar')) cerrarHoja(); });

/* ---------- FICHA DE RECETA ---------- */
function donut(p, c, g) {
  const kp = p * 4, kc = c * 4, kg = g * 9, t = kp + kc + kg || 1, R = 38, C = 2 * Math.PI * R;
  let off = 0; const seg = (v, col) => { const l = v / t * C; const s = `<circle cx="48" cy="48" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}" transform="rotate(-90 48 48)"/>`; off += l; return s; };
  return `<svg class="donut" viewBox="0 0 96 96" aria-label="Reparto de calorías: proteína ${Math.round(kp / t * 100)} %, carbo ${Math.round(kc / t * 100)} %, grasa ${Math.round(kg / t * 100)} %">${seg(kp, 'var(--cP)')}${seg(kc, 'var(--cC)')}${seg(kg, 'var(--cG)')}<text x="48" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${Math.round(kp / t * 100)}%</text><text x="48" y="60" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7">proteína</text></svg>`;
}

      ${f ? `<div class="mini suave" style="margin-top:4px">⏱ prep ${esc(f.prep || '—')} · cocción ${esc(f.coc || '—')} · rinde ${f.n} porci${f.n > 1 ? 'ones' : 'ón'}</div>` : ''}</div></div>

    $('#fElegir', hj)?.addEventListener('click', elegir);
    $('#fHoy', hj)?.addEventListener('click', () => agregarAHoy(code));
    $('#fVolver', hj)?.addEventListener('click', volver);
    $$('[data-esc]', hj).forEach(b => b.onclick = () => { completa = b.dataset.esc === '0'; const y = hj.scrollTop; pinta(); $('.hoja').scrollTop = y; });
    $$('[data-ing]', hj).forEach(b => b.onchange = () => b.closest('.ing').classList.toggle('tachado', b.checked));
    $$('[data-paso]', hj).forEach(b => b.onclick = e => { if (e.target.closest('[data-timer]')) return; b.classList.toggle('hecho'); });

// cantidad de un ingrediente para 1 porción o para la receta completa
function cantidad(t, n, completa) {
  const x = leerIng(t);
  if (completa || n <= 1) return esc(t).replace(/^([^·]+)·/, '<span class="q">$1</span>·');
  if (x.g != null) { const v = x.g / n; const q = v >= 10 ? Math.round(v) : r1(v); return `<span class="q">${fmt(q, q < 10 && q % 1 ? 1 : 0)} ${x.ml ? 'ml' : 'g'}</span> · ${esc(x.nombre.replace(/\s*\(.*?\)/g, ''))}`; }
  if (x.unid) return `<span class="q">${fmt(r1(x.unid / n), 1)}</span> ${esc(t.replace(/^\d+\s*/, ''))}`;
  return esc(t);
}
function temporizador(b) {
  const [code, i, mins] = b.dataset.timer.split('|'); const k = code + i;
  if (timers[k]) { clearInterval(timers[k].iv); delete timers[k]; b.classList.remove('corre'); b.textContent = `⏱ ${mins} min`; return; }
  let s = mins * 60; b.classList.add('corre');
  const tick = () => { if (!document.body.contains(b)) { clearInterval(timers[k]?.iv); delete timers[k]; return; } b.textContent = `⏸ ${Math.floor(s / 60)}:${pad(s % 60)}`; if (s-- <= 0) { clearInterval(timers[k].iv); delete timers[k]; b.classList.remove('corre'); b.textContent = '✅ ¡Listo!'; vibrar(); toast(`⏱ Paso ${+i + 1}: ¡tiempo!`); } };
  timers[k] = {iv: setInterval(tick, 1000)}; tick();
}

// los platos armados se miden cocidos; para comprar se pasa a crudo/seco
const CRUDO = {arroz: 2.5, quinua: 2.7, fideos: 2.2, lentejas: 2.4, frejoles: 2.4, pallares: 2.4, habas: 2.2, pollo: .75, pavo: .75, res: .7, molida: .7, cerdo: .7, pescado: .8, bonito: .8, jurel: .8, caballa: .8, trucha: .8, pejerrey: .8};
function listaCompras() {
  const lun = lunesDe(deClave(SEL)); const semK = clave(lun);
  const tot = {}; const otros = {}; let recetas = 0, dias = 0;
  for (let i = 0; i < 7; i++) {
    const k = clave(sumar(lun, i)), d = S.dias[k]; if (!d?.modo) continue;
    let hay = false;
    for (const st of Object.values(d.comidas)) {
      const rec = st?.receta; if (!rec) continue;
      if (rec.code === 'plato') { for (const it of rec.items || []) { const a = ALIM_ID[it.id]; if (!a || a.cat === 'sazon') continue; const t = (tot[a.id] ||= {a, g: 0}); t.g += (it.g || a.u * (it.q || 1)) / (CRUDO[a.id] || 1); } hay = true; continue; }
      const f = FICHAS[rec.code]; if (!f) { const r = buscarReceta(rec.code); if (r) { for (const id of r.alims) { const a = ALIM_ID[id]; if (a.cat !== 'sazon') (tot[id] ||= {a, g: 0, aprox: true}).aprox = true; } hay = true; } continue; }
      recetas++; hay = true;
      for (const t of f.ing) {
        const x = leerIng(t); if (x.sec) continue;
        const a = alimDe(x.nombre);
        if (!a) { if (!/^(sal|agua)/i.test(x.nombre)) (otros[x.nombre.replace(/\s*\(.*?\)/g, '')] ||= 0); continue; }
        const it = (tot[a.id] ||= {a, g: 0, u: 0});
        if (x.g != null) it.g += x.g / f.n; else if (x.unid) it.u = (it.u || 0) + x.unid / f.n;
      }
    }
    if (hay) dias++;
  }
  const marc = (S.compras[semK] ||= {});
  const grupos = {};
  for (const t of Object.values(tot)) (grupos[t.a.cat] ||= []).push(t);
  const linea = t => { const q = t.a.id === 'huevo' ? `${Math.ceil((t.u || 0) + t.g / 50)} unid` : t.g ? (t.g >= 1000 ? `${fmt(t.g / 1000, 1)} kg` : `${Math.ceil(t.g / 10) * 10} g`) : t.aprox ? 'según receta' : ''; return {k: t.a.id, txt: `${t.a.e} ${t.a.n}`, q}; };
  const secciones = Object.keys(CATS).filter(c => grupos[c]).map(c => ({c, items: grupos[c].sort((a, b) => b.g - a.g).map(linea)}));
  const texto = () => `🛒 Lista de compras · semana del ${fCorta(lun)}\n` + secciones.map(s => `\n${CATS[s.c].n.toUpperCase()}\n` + s.items.map(i => `${marc[i.k] ? '✓' : '•'} ${i.txt.replace(/^\S+\s/, '')} ${i.q}`).join('\n')).join('\n') + (Object.keys(otros).length ? `\n\nOTROS\n${Object.keys(otros).map(o => '• ' + o).join('\n')}` : '');
  const hj = hoja(`<div class="lbl">Semana del ${fCorta(lun)} al ${fCorta(sumar(lun, 6))}</div><h2 style="margin:2px 0 6px">🛒 Lista de compras</h2>
    <div class="mini suave">Sumo las comidas que elegiste en ${dias} día${dias === 1 ? '' : 's'} (${recetas} recetas con ficha), en cantidades para 1 porción. Toca para tachar.</div>
    ${secciones.length ? secciones.map(s => `<div class="ing-sec" style="margin-top:14px">${CATS[s.c].e} ${CATS[s.c].n}</div>${s.items.map(i => `<label class="compra ${marc[i.k] ? 'ok' : ''}"><input type="checkbox" data-c="${i.k}" ${marc[i.k] ? 'checked' : ''}><span>${esc(i.txt)}</span><span class="q">${esc(i.q)}</span></label>`).join('')}`).join('')
      + (Object.keys(otros).length ? `<div class="ing-sec" style="margin-top:14px">🧂 Otros</div><div class="mini suave">${Object.keys(otros).map(esc).join(' · ')}</div>` : '')
      : '<div class="vacio">Elige comidas en los días de esta semana y aquí aparece todo lo que necesitas comprar.</div>'}
    <div class="fila" style="margin-top:14px"><button class="btn" id="cCopiar" style="flex:1" ${secciones.length ? '' : 'disabled'}>📋 Copiar / compartir</button><button class="btn borde" id="cLimpiar" ${secciones.length ? '' : 'disabled'}>Desmarcar</button></div>`, {alta: true});
  $$('[data-c]', hj).forEach(b => b.onchange = () => { marc[b.dataset.c] = b.checked; b.closest('.compra').classList.toggle('ok', b.checked); guardar(); });
  $('#cLimpiar', hj).onclick = () => { S.compras[semK] = {}; guardar(); listaCompras(); };
  $('#cCopiar', hj).onclick = async () => {
    const t = texto();
    try { if (navigator.share) { await navigator.share({title: 'Lista de compras', text: t}); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(t); toast('Lista copiada. Pégala en WhatsApp o notas'); } catch (e) { toast('No pude copiar en este navegador'); }
  };
}

  else estado = `<span class="suave">Fue el ${fCorta(f)}</span>`;

    } else res = `<div class="peq suave" style="margin-top:4px">Sin pesos esa semana para comparar.</div>`;
  }

function abrirLeccion(num) {

  const car = $('#car', hj);
  const paso = () => (car.firstElementChild.offsetWidth + 12);
  const idx = () => Math.round(car.scrollLeft / paso());
  const actualizar = () => { const i = idx(); $$('#pts i', hj).forEach((p, j) => p.classList.toggle('on', j === i)); $('#ant', hj).disabled = i === 0; $('#sig', hj).style.visibility = i >= total - 1 ? 'hidden' : 'visible'; };
  car.addEventListener('scroll', () => requestAnimationFrame(actualizar), {passive: true});
  const mover = n => car.scrollTo({left: clamp(idx() + n, 0, total - 1) * paso(), behavior: 'smooth'});
  $('#ant', hj).onclick = () => mover(-1); $('#sig', hj).onclick = () => mover(1);
  actualizar();
  if (L.calc) {
    const calc = () => {
      const a = parseFloat($('#hAntes', hj).value), b = parseFloat($('#hDesp', hj).value);
      const out = $('#hRes', hj);
      if (!(a > 30 && b > 30)) { out.innerHTML = 'Pésate sin ropa mojada, antes y después del partido.'; return; }
      const perd = r1(a - b);

      out.innerHTML = `Perdiste <b>${fmt(perd, 1)} kg</b> de sudor. Repón entre <b>${fmt(perd * 1, 1)} y ${fmt(perd * 1.5, 1)} litros</b> en las próximas 2–4 horas (≈ ${Math.round(perd * 4)}–${Math.round(perd * 6)} vasos).${perd / a > .02 ? '<br>⚠️ Perdiste más del 2 % de tu peso: lleva más agua al próximo partido.' : ''}`;
    };
    $('#hAntes', hj).oninput = calc; $('#hDesp', hj).oninput = calc;
  }
  pintarQuiz(num, $('#quiz', hj));
}
function pintarQuiz(num, box) {
  const L = LECCIONES[num - 1]; const resp = [];
  const pinta = () => {
    const listo = resp.length === L.q.length && resp.every(x => x !== undefined);
    const pts = resp.filter((x, i) => x === L.q[i].r).length;
    box.innerHTML = `${vineta('<b>¡Hora del quiz!</b> 3 preguntas, apruebas con 2.')}${L.q.map((q, i) => `<div class="preg"><p>${i + 1}. ${esc(q.p)}</p>${q.o.map((o, j) => {
      const c = resp[i] === undefined ? '' : j === q.r ? 'bien' : j === resp[i] ? 'malr' : '';
      return `<button class="resp ${c}" data-q="${i}" data-o="${j}" ${resp[i] !== undefined ? 'disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>`).join('')}
      ${listo ? `<div style="margin-top:12px">${vineta(pts >= 2 ? `🎉 <b>${pts}/3 · ¡Aprobada!</b> ${pts === 3 ? '¡Perfecto, crack!' : 'Bien hecho.'}` : `<b>${pts}/3.</b> Casi. Repasa las viñetas y vuelve a intentarlo.`)}</div><button class="btn ancho ${pts >= 2 ? '' : 'sec'}" style="margin-top:10px" id="qFin">${pts >= 2 ? 'Terminar' : 'Reintentar'}</button>` : ''}`;
    $$('[data-q]', box).forEach(b => b.onclick = () => {
      resp[+b.dataset.q] = +b.dataset.o; pinta();
      if (resp.filter(x => x !== undefined).length === L.q.length) {
        const p = resp.filter((x, i) => x === L.q[i].r).length;
        const antes = estadoLecciones();
        const prev = S.lecciones[num]?.puntos ?? -1;
        S.lecciones[num] = {puntos: Math.max(prev, p)}; guardar();
        const nuevas = INSIGNIAS.filter(x => x.ok(estadoLecciones()) && !x.ok(antes));
        if (nuevas.length) toast(`¡Nueva insignia: ${nuevas.map(x => x.e + ' ' + x.t).join(', ')}!`);
      }
    });
    $('#qFin', box)?.addEventListener('click', () => { if (pts >= 2) cerrarHoja(); else { resp.length = 0; pinta(); } });
  };
  pinta();
}

// cálculo de la vista previa del asistente (mismas fórmulas que el motor, sobre un perfil cualquiera)
function calcular(W) {
  const bm = w => 10 * w + 6.25 * W.talla - 5 * W.edad + (W.sexo === 'm' ? -161 : 5);
  const act = Object.entries(W.deportes).filter(([k, v]) => DEPORTES[k] && v.dias > 0);
  const nT = Math.min(7, act.reduce((a, [, v]) => a + v.dias, 0));
  const td = w => bm(w) * TRABAJOS[W.trabajo].f + act.reduce((a, [k, v]) => a + v.dias * (DEPORTES[k].met - 1) * w * v.h, 0) / 7;
  const minK = W.sexo === 'm' ? 1200 : 1500;
  const prom = w => { const t = td(w); if (W.objetivo === 'mantener') return t; const dl = W.ritmo * 7700 / 7; return W.objetivo === 'subir' ? t + dl : Math.max(minK, bm(w) * 1.05, t - Math.min(dl, t * .25)); };
  const part = p => nT ? (e => ({entreno: red10(e), descanso: red10(e - 300)}))(p + 300 * (7 - nT) / 7) : {entreno: red10(p + 200), descanso: red10(p)};
  const e1 = W.manual.on ? {entreno: W.manual.entreno, descanso: W.manual.descanso} : part(prom(W.peso0));
  let w = W.peso0, sem = 0; const serie = [w];
  while (sem < 52) {
    sem++; const n = Math.floor((sem - 1) / 4);
    const e = W.manual.on ? {entreno: W.manual.entreno - W.manual.paso * n, descanso: W.manual.descanso - W.manual.paso * n} : part(prom(serie[n * 4] ?? w));
    w = w + ((nT * e.entreno + (7 - nT) * e.descanso) / 7 - td(w)) * 7 / 7700; serie.push(r1(w));
    if (W.objetivo === 'bajar' ? w <= W.meta : W.objetivo === 'subir' ? w >= W.meta : sem >= 12) break;
  }
  const llega = W.objetivo !== 'mantener' && (W.objetivo === 'bajar' ? w <= W.meta + .05 : w >= W.meta - .05);
  return {gasto: Math.round(td(W.peso0)), ...e1, prot: Math.round((W.objetivo === 'subir' ? 2 : 1.8) * Math.min(W.peso0, W.meta * 1.25) / 5) * 5, agua: Math.round(W.peso0 * .035 * 4) / 4, semanas: sem, llega, serie, nT};
}
function sparkline(serie, meta) {
  const W = 300, H = 70, mn = Math.min(...serie, meta ?? Infinity) - .5, mx = Math.max(...serie, meta ?? -Infinity) + .5;
  const x = i => i / Math.max(1, serie.length - 1) * (W - 8) + 4, y = v => 6 + (H - 12) * (mx - v) / (mx - mn || 1);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${meta != null ? `<line x1="0" x2="${W}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--mal)" stroke-dasharray="4 4"/>` : ''}<polyline points="${serie.map((v, i) => `${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--m)" stroke-width="2.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px var(--m))"/><circle cx="${x(serie.length - 1)}" cy="${y(serie[serie.length - 1])}" r="4" fill="var(--m)"/></svg>`;
}

    $('#aNom', hj)?.addEventListener('input', e => { W.nombre = e.target.value.trim(); });
    $('#aCint', hj)?.addEventListener('input', () => { W.cintura0 = num('aCint'); });
    $('#aGrasa', hj)?.addEventListener('input', () => { W.grasa0 = num('aGrasa'); });
    $('#aMetaC', hj)?.addEventListener('input', () => { W.metaCintura = num('aMetaC'); });
    $$('[data-sexo]', hj).forEach(b => b.onclick = () => { W.sexo = b.dataset.sexo; pinta(); });
    $$('[data-obj]', hj).forEach(b => b.onclick = () => { W.objetivo = b.dataset.obj; W.ritmo = RITMOS[W.objetivo][Math.min(1, RITMOS[W.objetivo].length - 1)][0]; ajustarMeta(true); pinta(); });
    $$('[data-rit]', hj).forEach(b => b.onclick = () => { W.ritmo = +b.dataset.rit; pinta(); });
    $$('[data-trab]', hj).forEach(b => b.onclick = () => { W.trabajo = b.dataset.trab; pinta(); });
    $$('[data-dmas]', hj).forEach(b => b.onclick = () => { const v = W.deportes[b.dataset.dmas]; v.dias = Math.min(7, v.dias + .5); pinta(); });
    $$('[data-dmen]', hj).forEach(b => b.onclick = () => { const v = W.deportes[b.dataset.dmen]; v.dias = Math.max(0, v.dias - .5); pinta(); });
    $$('[data-dur]', hj).forEach(b => b.onchange = () => { W.deportes[b.dataset.dur].h = +b.value; });
    $$('[data-com]', hj).forEach(b => b.onclick = () => { W.comidas = +b.dataset.com; pinta(); });
    $$('[data-fru]', hj).forEach(b => b.onclick = () => { const i = W.frutas.indexOf(b.dataset.fru); if (i >= 0) W.frutas.splice(i, 1); else W.frutas.push(b.dataset.fru); pinta(); });
    $$('[data-exc]', hj).forEach(b => b.onclick = () => { const i = W.excl.indexOf(b.dataset.exc); if (i >= 0) W.excl.splice(i, 1); else W.excl.push(b.dataset.exc); pinta(); });
    const leerManual = () => { if (!$('#aMan', hj)) return; W.manual = {on: $('#aMan', hj).checked, entreno: num('aMe') || W.manual.entreno, descanso: num('aMd') || W.manual.descanso, paso: num('aMp') ?? W.manual.paso}; W.inicio = $('#aIni', hj).value || W.inicio; };
    ['aMan', 'aMe', 'aMd', 'aMp'].forEach(id => $('#' + id, hj)?.addEventListener('change', () => { leerManual(); pinta(); }));
    $('#aIni', hj)?.addEventListener('change', () => { leerManual(); pinta(); });
    $('#aAtras', hj)?.addEventListener('click', () => { leerManual(); paso--; pinta(); });
    $('#aCancelar', hj)?.addEventListener('click', () => cerrarHoja(true));
    $('#aSig', hj).onclick = () => {
      if (paso === 0 && !W.nombre) { toast('Escribe tu nombre'); $('#aNom', hj).focus(); return; }
      if (paso < N - 1) { paso++; pinta(); caja.closest('.hoja').scrollTop = 0; return; }
      leerManual(); guardarPerfil(W, editar);
    };
  };
  const ajustarMeta = forzar => {
    if (W.objetivo === 'mantener') { W.meta = W.peso0; return; }
    const bajar = W.objetivo === 'bajar';
    if (forzar || (bajar ? W.meta >= W.peso0 : W.meta <= W.peso0)) W.meta = r1(Math.round((bajar ? W.peso0 * .9 : W.peso0 + 5) * 2) / 2);
  };
  if (W.objetivo === 'mantener') W.meta = W.peso0;
  pinta();
}
function guardarPerfil(W, editar) {
  W.nombre = W.nombre || 'Yo';
  for (const k of Object.keys(W.deportes)) if (!W.deportes[k].dias) delete W.deportes[k];
  if (editar && PERFILES.activo) {
    S.perfil = W; guardar();
    const p = PERFILES.lista.find(x => x.id === PERFILES.activo); if (p) p.nombre = W.nombre;
  } else {
    const id = nuevoId(); const datos = base(); datos.perfil = W; datos.ui.tema = S.ui?.tema || 'tech';
    lsSet(K_DATOS(id), JSON.stringify(datos));
    PERFILES.lista.push({id, nombre: W.nombre}); PERFILES.activo = id;
  }
  guardarPerfiles();
  cerrarHoja(true); toast(editar ? 'Perfil actualizado' : `¡Listo, ${W.nombre}! Tu plan está armado`);
  setTimeout(() => location.reload(), 600);
}

function abrirAjustes() {
  const c = calcular({...PF, deportes: PF.deportes || {}, manual: PF.manual || {on: false}});
  const hj = hoja(`<div class="lbl">Perfil activo</div><h2 style="margin:2px 0 8px">👤 ${esc(PF.nombre)}</h2>
    <div class="card peq"><div class="suave">${PF.sexo === 'm' ? 'Mujer' : 'Hombre'} · ${PF.edad} años · ${fmt(PF.talla / 100, 2)} m · inicio ${fLarga(INICIO)}: ${fmt(PF.peso0, 1)} kg${PF.cintura0 ? `, cintura ${fmt(PF.cintura0, 1)} cm` : ''}. ${OBJETIVOS[PF.objetivo].e} ${OBJETIVOS[PF.objetivo].n}${PF.objetivo !== 'mantener' ? ` hasta ${fmt(PF.meta, 1)} kg` : ''}${PF.metaCintura ? ` y cintura ≤ ${fmt(PF.metaCintura, 1)} cm` : ''}.</div>
      <div class="suave" style="margin-top:6px">${[1, 2, 3, 4].filter(n => n <= Math.ceil(SEMANAS / 4)).map(n => { const e = etapa(n); return `<span style="color:${S.ui.tema === 'claro' ? e.color : e.neon};font-weight:700">${e.nombre}</span> (${e.desde}–${e.hasta}): ${fmt(e.entreno)}/${fmt(e.descanso)} kcal`; }).join('<br>')}${Math.ceil(SEMANAS / 4) > 4 ? '<br>…' : ''}</div>
      <div class="suave" style="margin-top:6px">Proteína ${PROT_META} g · gasto estimado ${fmt(c.gasto)} kcal${PF.manual?.on ? ' · calorías puestas a mano' : ''}</div></div>
    <button class="btn ancho sec" id="bEditar" style="margin-top:10px">✏️ Editar mi perfil y metas</button>
    <div class="titulo-sec"><h2>Perfiles en este aparato</h2></div>
    <div class="pila">${PERFILES.lista.map(p => `<div class="sel-item"><span class="e">${p.id === PERFILES.activo ? '🟢' : '👤'}</span><b class="peq" style="flex:1">${esc(p.nombre)}</b>${p.id === PERFILES.activo ? '<span class="mini suave">activo</span>' : `<button class="btn chico sec" data-usar="${p.id}">Cambiar</button>`}</div>`).join('')}</div>
    <button class="btn ancho borde" id="bNuevo" style="margin-top:10px">＋ Nuevo perfil (otra persona)</button>
    <div class="titulo-sec"><h2>Respaldo</h2></div>
    <p class="suave peq" style="margin-top:0">Los datos viven solo en este navegador. Exporta un respaldo de vez en cuando y guárdalo en tu Drive o WhatsApp.</p>
    <div class="pila">
      <button class="btn ancho" id="bExp">⬇️ Exportar respaldo de ${esc(PF.nombre)}</button>
      <label class="btn ancho sec" style="display:flex;align-items:center;justify-content:center;cursor:pointer">⬆️ Importar respaldo<input type="file" id="bImp" accept="application/json,.json" style="display:none"></label>
      <button class="btn ancho borde" id="bBorrar" style="color:var(--mal)">Borrar mis registros (días, pesos, favoritos)</button>
      ${PERFILES.lista.length > 1 ? '<button class="btn ancho borde" id="bBorrarPerfil" style="color:var(--mal)">Eliminar este perfil</button>' : ''}
    </div>`);
  $('#bEditar', hj).onclick = () => asistente({editar: true});
  $('#bNuevo', hj).onclick = () => asistente();
  $$('[data-usar]', hj).forEach(b => b.onclick = () => { PERFILES.activo = b.dataset.usar; guardarPerfiles(); location.reload(); });
  $('#bExp', hj).onclick = () => {
    try {
      const blob = new Blob([JSON.stringify({app: 'progresa', exportado: new Date().toISOString(), datos: S}, null, 1)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `progresa-${sinTilde(PF.nombre).replace(/[^a-z0-9]+/g, '-')}-${HOY}.json`;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Respaldo descargado');
    } catch (e) { toast('No se pudo exportar: ' + e.message); }
  };
  $('#bImp', hj).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const o = JSON.parse(await f.text());
      const datos = o && (o.app === 'progresa' || o.app === 'plan90') ? o.datos : o;
      if (!datos || typeof datos !== 'object' || !('dias' in datos || 'pesos' in datos)) throw new Error('no parece un respaldo de esta app');
      if (!confirm(`Esto reemplaza los datos de ${PF.nombre} por los del respaldo. ¿Seguir?`)) return;
      const nuevo = normalizar(datos);
      if (!nuevo.perfil) nuevo.perfil = o.app === 'plan90' ? perfilDelPlanOriginal() : PF;
      S = nuevo; guardar();
      const p = PERFILES.lista.find(x => x.id === PERFILES.activo); if (p) { p.nombre = S.perfil.nombre; guardarPerfiles(); }
      toast(`Respaldo importado: ${S.pesos.length} pesos, ${Object.keys(S.dias).length} días`); setTimeout(() => location.reload(), 700);
    } catch (err) { toast('Archivo no válido: ' + err.message); }
    e.target.value = '';
  };
  $('#bBorrar', hj).onclick = () => {
    if (!confirm(`¿Borrar los registros de ${PF.nombre} (días, pesos, favoritos, lecciones)? El perfil se mantiene. No se puede deshacer.`)) return;
    const per = S.perfil, tema = S.ui.tema; S = base(); S.perfil = per; S.ui.tema = tema; guardar(); location.reload();
  };
  $('#bBorrarPerfil', hj)?.addEventListener('click', () => {
    if (!confirm(`¿Eliminar el perfil de ${PF.nombre} y todos sus datos? No se puede deshacer.`)) return;
    lsDel(K_DATOS(PERFILES.activo)); PERFILES.lista = PERFILES.lista.filter(x => x.id !== PERFILES.activo); PERFILES.activo = PERFILES.lista[0]?.id || null; guardarPerfiles(); location.reload();
  });
}
$('#btnAjustes').onclick = abrirAjustes;

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(function iniciar() {
  aplicarTema();
  $('#btnTema').onclick = () => { S.ui.tema = S.ui.tema === 'claro' ? 'tech' : 'claro'; guardar(); aplicarTema(); TABS[S.ui.tab]?.(); toast(S.ui.tema === 'claro' ? 'Tema claro' : 'Tema tech'); };
  if (!S.perfil) {
    $('#cabTitulo').textContent = 'Progresa'; $('#cabSub').textContent = 'Tu plan de comidas peruanas, a tu medida';
    asistente(); return;
  }
  $('.cab .logo').textContent = (PF.nombre || 'P').trim().slice(0, 1).toUpperCase();
  document.title = `Progresa · ${PF.nombre}`;
  const n = diaN(hoyFecha);
  $('#cabTitulo').textContent = n < 0 ? `${PF.nombre} · empieza pronto` : `${PF.nombre} · ${F.nombre} · sem ${semanaDe(hoyFecha)}`;
  $('#cabSub').textContent = n < 0 ? `Empieza el ${fLarga(INICIO)} (faltan ${-n} días)` : `${fmt(F.entreno)} kcal entreno / ${fmt(F.descanso)} descanso · ${PROT_META} g proteína`;
  // si hoy todavía no dijo cómo entrena, se abre en Hoy para preguntárselo
  ir(S.dias[HOY]?.modo ? (S.ui.tab || 'hoy') : 'hoy');
})();
</script>
</body>
