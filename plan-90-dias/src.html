<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F7A55">
<title>Plan 90 días</title>
<style>
/*@FUENTES@*/
:root{
  --crema:#FBF8F2; --tinta:#17251F; --tinta2:#4A5A52; --linea:#E6E0D3; --blanco:#FFFFFF;
  --m1:#1F7A55; --m2:#D9692F; --m3:#2F5D8C;
  --m:var(--m1); --ok:#1F7A55; --med:#C9961A; --mal:#C2412D;
  --r:16px; --sombra:0 1px 2px rgba(23,37,31,.06),0 4px 14px rgba(23,37,31,.06);
  --nav:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--crema);color:var(--tinta);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,.pop{font-family:Poppins,Inter,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.suave{color:var(--tinta2)} .peq{font-size:13px} .mini{font-size:12px}
.mc{background:color-mix(in srgb,var(--m) 11%,var(--crema))}

/* cabecera */
header{position:sticky;top:0;z-index:20;background:var(--m);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.cab{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.cab .t{flex:1;min-width:0}
.cab h1{font-size:18px;line-height:1.2}
.cab .sub{font-size:12.5px;opacity:.9}
.icono-btn{background:rgba(255,255,255,.16);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:#fff}
.icono-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding:14px 16px calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
section.tab{display:none} section.tab.on{display:block;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* barra inferior */
nav.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.barra .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.barra button{border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#7C8A83;position:relative}
nav.barra svg{width:24px;height:24px}
nav.barra button.on{color:var(--m)}
nav.barra button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--m)}

/* piezas */
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:14px;box-shadow:var(--sombra)}
.pila>*+*{margin-top:12px}
.fila{display:flex;align-items:center;gap:8px}
.entre{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{white-space:nowrap;border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--m);color:#fff;min-height:42px}
.btn.sec{background:color-mix(in srgb,var(--m) 12%,#fff);color:var(--m)}
.btn.borde{background:#fff;border:1.5px solid var(--linea);color:var(--tinta)}
.btn.chico{min-height:34px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.ancho{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1.5px solid var(--linea);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;min-height:36px;transition:background .15s,border-color .15s,color .15s}
.chip.on{background:var(--m);border-color:var(--m);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.etq{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--m) 13%,#fff);color:var(--m);white-space:nowrap}
.etq.pre{background:#FFF1E2;color:#A34A12} .etq.post{background:#E3F1EA;color:#1F6B4B}
.etq.gris{background:#F0EDE5;color:var(--tinta2)}
.barra-p{height:10px;border-radius:99px;background:#EEE9DE;overflow:hidden}
.barra-p>i{display:block;height:100%;border-radius:99px;background:var(--m);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tip{border-left:4px solid var(--m);background:color-mix(in srgb,var(--m) 8%,#fff);border-radius:12px;padding:10px 12px;font-size:13.5px}
.vacio{text-align:center;padding:20px 10px;color:var(--tinta2);font-size:14px}
.titulo-sec{margin:20px 2px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.titulo-sec h2{font-size:17px}
input[type=number],input[type=date],input[type=text],input[type=search],select{border:1.5px solid var(--linea);background:#fff;border-radius:11px;padding:9px 11px;min-height:42px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2.5px solid var(--m);outline-offset:2px}
label.campo{display:block;font-size:12.5px;font-weight:600;color:var(--tinta2)}
label.campo>input,label.campo>select{margin-top:4px}
.rejilla2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* HOY */
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dato{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 12px}
.dato b{display:block;font-family:Poppins,Inter,sans-serif;font-size:20px;font-weight:600;line-height:1.2}
.dato span{font-size:12px;color:var(--tinta2)}
.comida{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;transition:opacity .2s}
.comida.hecha{opacity:.72}
.comida .cab-c{display:flex;gap:10px;padding:12px 12px 12px 14px;align-items:flex-start}
.comida .info{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.comida .nombre{font-family:Poppins,Inter,sans-serif;font-weight:600;font-size:15.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.comida .formula{font-size:13px;color:var(--tinta2);margin-top:3px}
.comida .elegida{font-size:13px;margin-top:5px;color:var(--tinta);font-weight:500}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--linea);background:#fff;display:grid;place-items:center;transition:all .2s}
.check svg{width:18px;height:18px;opacity:0;transform:scale(.5);transition:all .2s}
.check.on{background:var(--m);border-color:var(--m);color:#fff}
.check.on svg{opacity:1;transform:none}
.comida .abre{border-top:1px dashed var(--linea);padding:10px 12px 12px;background:#FDFBF7}
.opc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:12px;padding:9px 11px;margin-bottom:7px}
.opc.on{border-color:var(--m);background:color-mix(in srgb,var(--m) 7%,#fff)}
.opc .cod{font-size:11px;font-weight:700;color:var(--m)}
.opc .tt{font-size:14px;font-weight:600;line-height:1.3}
.opc .aj{font-size:12px;color:var(--tinta2)}
.opc .num{margin-left:auto;text-align:right;font-size:12px;white-space:nowrap;color:var(--tinta2)}
.opc .num b{display:block;font-size:14px;color:var(--tinta)}
.hito{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--m);padding:2px 6px}
.hito::before,.hito::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--m) 0 6px,transparent 6px 11px);opacity:.5}
.vasos{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.vaso{width:20px;height:26px}
.contador{display:flex;align-items:center;gap:8px}
.redondo{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--linea);background:#fff;font-size:20px;font-weight:600;display:grid;place-items:center;line-height:1}
.antojo{width:100%;border:0;border-radius:var(--r);padding:14px;background:linear-gradient(135deg,#FFE7D6,#FFF3E6);color:#8A3A10;font-weight:700;font-family:Poppins,Inter,sans-serif;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}

/* modal / hoja */
.velo{position:fixed;inset:0;z-index:50;background:rgba(23,37,31,.45);display:flex;align-items:flex-end;justify-content:center;animation:velo .2s ease}
@keyframes velo{from{opacity:0}to{opacity:1}}
.hoja{background:var(--crema);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sube .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.velo{align-items:center}.hoja{border-radius:22px}}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.hoja .cerrar{float:right;border:0;background:#EEE9DE;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
.opcion-grande{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:14px;padding:12px;margin-top:9px}
.opcion-grande .letra{flex:none;width:36px;height:36px;border-radius:11px;background:var(--m);color:#fff;display:grid;place-items:center;font-family:Poppins,Inter,sans-serif;font-weight:700}
.opcion-grande b{display:block;font-size:14.5px}
.opcion-grande span{font-size:12.5px;color:var(--tinta2)}
.pasos{display:flex;gap:6px;margin:12px 0}
.pasos i{flex:1;height:5px;border-radius:9px;background:#E6E0D3}
.pasos i.on{background:var(--m2)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:sube .25s ease}

/* PLATO */
.plato-zona{display:grid;gap:14px}
@media(min-width:720px){.plato-zona{grid-template-columns:300px 1fr;align-items:start}.plato-fijo{position:sticky;top:84px}}
.plato-svg{width:100%;max-width:300px;display:block;margin:0 auto}
.sector{transform-box:fill-box;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.leyenda{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:inline-block}
.col-alim h3{font-size:14.5px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.col-alim h3 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.porcion{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:8px 10px;font-size:13.5px}
.porcion .mano{font-size:22px;width:30px;text-align:center}
.semaf{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.medidor+.medidor{margin-top:12px}
.aviso{background:#FFF4D6;border:1px solid #F0D58A;color:#6B4E00;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600}

/* RECETAS */
.buscador{position:relative}
.buscador svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--tinta2)}
.buscador input{padding-left:38px}
.receta{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sombra)}
.receta .top{display:flex;gap:8px;align-items:flex-start}
.receta .cod{font-size:11.5px;font-weight:700;color:var(--m);letter-spacing:.02em}
.receta h3{font-size:15px;line-height:1.3;margin-top:1px}
.estrella{flex:none;border:0;background:none;font-size:22px;line-height:1;color:#C9C2B2;padding:2px 4px}
.estrella.on{color:#E2A400}
.receta .libro{font-size:12.5px;color:var(--tinta2);margin-top:4px}
.receta .plan{margin-top:8px;font-size:13.5px;background:color-mix(in srgb,var(--m) 7%,#fff);border-radius:10px;padding:8px 10px}
.receta .total{display:flex;gap:14px;margin-top:8px;align-items:center;flex-wrap:wrap}
.receta .total b{font-family:Poppins,Inter,sans-serif;font-size:16px}
.nota{font-size:12.5px;color:#8A3A10;background:#FFF1E2;border-radius:8px;padding:5px 9px;margin-top:7px}
.tag-Libre{background:#E3F1EA;color:#1F6B4B}.tag-Grasa{background:#FFF4D6;color:#7A5A00}.tag-Carbo{background:#FFE9DC;color:#A34A12}.tag-Plato{background:#E4ECF6;color:#2F5D8C}

/* PROGRESO */
.grafico svg{width:100%;height:auto;display:block}
.cp{display:flex;gap:12px;align-items:flex-start}
.cp .num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Poppins,Inter,sans-serif;font-weight:700;color:#fff}
.ajuste{border-radius:14px;padding:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.ajuste .ico{font-size:22px;line-height:1}
.ajuste.ok{background:#E3F1EA;color:#174F38}.ajuste.sube{background:#FFF4D6;color:#5E4500}.ajuste.baja{background:#FFE9DC;color:#7A3410}.ajuste.info{background:#EFF3F8;color:#22405F}
.racha{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.racha i{width:18px;height:18px;border-radius:5px;background:#EEE9DE}
.racha i.si{background:var(--m)}
.racha i.hoy{outline:2px solid var(--tinta);outline-offset:1px}
.lista-reg{max-height:220px;overflow:auto}
.lista-reg .r{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--linea);font-size:14px}
.lista-reg .r button{border:0;background:none;color:var(--mal);font-size:13px;padding:4px 6px}
.seg{display:inline-flex;background:#EEE9DE;border-radius:11px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tinta2)}
.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* APRENDE */
.lecciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.lecciones{grid-template-columns:1fr 1fr 1fr}}
.leccion{text-align:left;background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:12px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:6px;min-height:118px}
.leccion .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:Poppins,Inter,sans-serif;font-weight:700;background:color-mix(in srgb,var(--m) 13%,#fff);color:var(--m)}
.leccion.hecha .n{background:var(--m);color:#fff}
.leccion b{font-size:14px;line-height:1.3}
.carrusel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:10px -16px 0;padding:4px 16px 10px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.diapo{flex:0 0 100%;scroll-snap-align:center;background:#fff;border:1px solid var(--linea);border-radius:18px;padding:16px;min-height:250px;box-shadow:var(--sombra)}
.diapo .gr{font-size:40px;line-height:1;margin-bottom:8px}
.diapo h3{margin-bottom:6px}
.diapo p{margin:6px 0;font-size:14.5px}
.diapo ul{padding-left:20px;margin:6px 0;font-size:14.5px}
.puntos{display:flex;justify-content:center;gap:6px;margin-top:4px}
.puntos i{width:7px;height:7px;border-radius:50%;background:#D8D1C2;transition:all .2s}
.puntos i.on{width:20px;border-radius:9px;background:var(--m)}
.preg{margin-top:10px}
.preg p{font-weight:600;margin:0 0 6px;font-size:14.5px}
.resp{display:block;width:100%;text-align:left;border:1.5px solid var(--linea);background:#fff;border-radius:11px;padding:9px 11px;margin-top:6px;font-size:14px}
.resp.bien{border-color:var(--ok);background:#E3F1EA}
.resp.malr{border-color:var(--mal);background:#FBE5E1}
.insignias{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.insignia{text-align:center;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 6px;font-size:12px}
.insignia .e{font-size:30px;display:block;filter:grayscale(1);opacity:.35}
.insignia.on .e{filter:none;opacity:1}
.insignia b{display:block;font-size:12.5px;margin-top:3px}
.insignia.on{border-color:color-mix(in srgb,var(--m) 40%,#fff)}

/* ===== capa ilustrada e interactiva ===== */
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flota{display:inline-block;animation:flota 3.2s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.hero{border-radius:22px;color:#fff;overflow:hidden;position:relative;box-shadow:0 8px 24px rgba(23,37,31,.16)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero-in{position:relative;z-index:1;padding:16px}
.hero h2{font-size:19px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.hero .sol{font-size:34px}
.btn.blanco{background:#fff;color:var(--m)}
.anillos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 10px}
.anillo{position:relative;border:0;background:rgba(255,255,255,.14);border-radius:16px;padding:8px 4px 6px;color:#fff;display:flex;flex-direction:column;align-items:center}
.anillo svg{width:68px;height:68px}
.anillo .arco{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.anillo .centro{position:absolute;top:30px;left:0;right:0;text-align:center;font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:15px}
.anillo .pie{font-size:11px;font-weight:600;opacity:.92;margin-top:2px}
.pastilla{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.pastilla.boton{background:#fff;color:var(--tinta)}
details.regla{margin-top:12px}
details.regla summary{cursor:pointer;list-style:none}
details.regla summary::-webkit-details-marker{display:none}
details.regla summary::after{content:" ▾";opacity:.6}
.regla-graf{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:10px;text-align:center}
.regla-graf>div{flex:1;background:#fff;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;gap:2px}
.regla-graf span{font-size:24px}
.regla-graf small{font-size:11px;color:var(--tinta2)}
.regla-graf b{font-size:11.5px;color:var(--m)}
.regla-graf .flecha{flex:none;background:none;font-size:18px;color:var(--m);font-weight:700;padding:0}
.linea-tiempo{position:relative;padding-left:16px}
.linea-tiempo::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--m),color-mix(in srgb,var(--m) 25%,#fff))}
.linea-tiempo>*{position:relative;margin-bottom:10px}
.franja{font-family:Poppins,Inter,sans-serif;font-weight:600;font-size:13px;color:var(--tinta2);display:flex;align-items:center;gap:6px;margin:14px 0 6px -16px}
.franja span{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--m);display:grid;place-items:center;font-size:14px;z-index:1}
.hito{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#fff;background:linear-gradient(90deg,var(--m),color-mix(in srgb,var(--m) 70%,#000));border-radius:14px;padding:9px 12px;box-shadow:0 4px 12px color-mix(in srgb,var(--m) 30%,transparent)}
.hito::before,.hito::after{display:none}
.hito-ico{font-size:22px;animation:flota 2.4s ease-in-out infinite}
.ilus{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px}
.ilus.chica{width:38px;height:38px;font-size:21px;border-radius:11px}
.comida .ver{color:var(--m);font-weight:700;margin-left:4px}
.comida.hecha .ilus{filter:saturate(.5)}
.check.on{animation:pop .35s ease}

<script>
'use strict';
const RECETARIO = /*@RECETARIO@*/;

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ fechas y fases ============ */
const pad = n => String(n).padStart(2, '0');

const deClave = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const hoyFecha = (() => {
  // ?hoy=2026-12-10 sirve para probar otra fecha
  try { const q = new URLSearchParams(location.search).get('hoy'); if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return deClave(q); } catch (e) {}
  const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate());
})();
const HOY = clave(hoyFecha);
const INICIO = new Date(2026, 10, 4);

const FASES = {
  1: {nombre: 'Mes 1', color: '#1F7A55', desde: '4 nov', hasta: '1 dic', entreno: 2350, descanso: 2050, arrozAlm: 1, arrozCen: 1},

};

const tazas = t => t === 1 ? '1 taza' : t === .75 ? '¾ taza' : t === .5 ? '½ taza' : t === .25 ? '¼ taza' : `${fmt(t, 2)} taza`;

const PROY_PESO = [93.6, 92.8, 92.1, 91.4, 90.7, 90.1, 89.5, 89.0, 88.7, 88.4, 87.8, 87.2, 86.7, 86.2];
const PROY_CINT = [99, 98.2, 97.5, 96.8, 96.1, 95.5, 94.9, 94.4, 94.1, 93.8, 93.2, 92.6, 92.1, 91.6];

/* ============ almacenamiento ============ */
const LLAVE = 'plan90';
const base = () => ({v: 1, dias: {}, pesos: [], cintura: [], favRecetas: [], favPlatos: [], lecciones: {}, checkpoints: {}, ui: {tab: 'hoy'}});
function cargar() {
  try {
    const t = localStorage.getItem(LLAVE);
    if (!t) return base();
    return normalizar(JSON.parse(t));
  } catch (e) { return base(); }
}
function normalizar(o) {
  const b = base();
  if (!o || typeof o !== 'object') return b;
  for (const k of Object.keys(b)) if (o[k] !== undefined && typeof o[k] === typeof b[k] && Array.isArray(o[k]) === Array.isArray(b[k])) b[k] = o[k];
  b.pesos = b.pesos.filter(x => x && typeof x.f === 'string' && isFinite(x.kg));
  b.cintura = b.cintura.filter(x => x && typeof x.f === 'string' && isFinite(x.cm));
  return b;
}
let S = cargar();
let avisoGuardado = false;
function guardar() {
  try { localStorage.setItem(LLAVE, JSON.stringify(S)); }
  catch (e) { if (!avisoGuardado) { avisoGuardado = true; toast('No pude guardar en este navegador. Exporta un respaldo.'); } }
}
const dia = (k = HOY) => (S.dias[k] ||= {modo: null, hora: null, horas: null, comidas: {}, extras: [], agua: 0, protExtra: 0});

/* ============ toast y hoja ============ */
let tToast;
function toast(msg) {
  $('.toast')?.remove(); clearTimeout(tToast);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.append(t); tToast = setTimeout(() => t.remove(), 2600);
}
function hoja(html, {alCerrar, sinCerrar} = {}) {
  cerrarHoja();
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="hoja" role="dialog" aria-modal="true">${sinCerrar ? '' : '<button class="cerrar" aria-label="Cerrar">×</button>'}${html}</div>`;
  v._alCerrar = alCerrar;
  v.addEventListener('click', e => { if (!sinCerrar && (e.target === v || e.target.closest('.cerrar'))) cerrarHoja(); });
  document.body.append(v); document.body.style.overflow = 'hidden';
  return v.firstElementChild;
}
function cerrarHoja() {
  const v = $('.velo'); if (!v) return;
  v.remove(); document.body.style.overflow = '';
  v._alCerrar?.();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.velo .cerrar')) cerrarHoja(); });

/* ============ navegación ============ */
const TABS = {hoy: renderHoy, plato: renderPlato, recetas: renderRecetas, progreso: renderProgreso, aprende: renderAprende};
function ir(tab) {
  if (!TABS[tab]) tab = 'hoy';
  S.ui.tab = tab; guardar();
  $$('nav.barra button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('section.tab').forEach(s => s.classList.toggle('on', s.id === 't-' + tab));
  TABS[tab]();
  window.scrollTo(0, 0);
}
$$('nav.barra button').forEach(b => b.addEventListener('click', () => ir(b.dataset.tab)));

/* =====================================================================
   PESTAÑA 1 · HOY
   ===================================================================== */
const ACT = {gym: {n: 'Gym', e: '🏋️', horas: 1}, fut: {n: 'Fútbol', e: '⚽', horas: 1.5}};
const FRANJAS = {m: {n: 'Mañana', e: '🌅', d: 'antes de las 11 am'}, t: {n: 'Tarde', e: '🌤️', d: '12 a 5 pm'}, n: {n: 'Noche', e: '🌙', d: 'desde las 6 pm'}};
const PRESETS = {
  A: {t: 'Doble: uno temprano y otro después', d: 'Ej.: gym o fútbol en la mañana, el otro en la noche', ses: [{act: 'gym', t: 'm'}, {act: 'fut', t: 'n'}], ilus: '🌅🏋️ → 🌙⚽'},
  B: {t: 'Doble: los dos en la tarde o noche', d: 'Ej.: gym a las 6 pm y fútbol a las 8 pm', ses: [{act: 'gym', t: 'n'}, {act: 'fut', t: 'n'}], ilus: '🌙🏋️⚽'},
  C: {t: 'Un solo entreno', d: 'Gym o fútbol, una vez. Elige cuál y a qué hora', ses: null, ilus: '🏋️ o ⚽'},
  D: {t: 'No entreno', d: 'Día de descanso: comes un poco menos', ses: [], ilus: '😴🛋️'},
};
const PESOS_COMIDA = {des: 24, alm: 28, cen: 25, snack: 13};
const NOMBRE_TIPO = {des: 'Desayuno', alm: 'Almuerzo', cen: 'Cena', snack: 'Merienda'};
const EMOJI_TIPO = {des: '🍳', alm: '🍛', cen: '🥗', snack: '🍌', extra: '🍎'};

// Sesiones del día (con compatibilidad para datos guardados con la versión anterior)
function sesionesDe(d) {
  if (Array.isArray(d.ses)) return d.ses;
  if (d.modo === 'A') return [{act: 'gym', t: 'm'}, {act: 'fut', t: 'n'}];
  if (d.modo === 'B') return [{act: 'gym', t: 't'}, {act: 'fut', t: 'n'}];
  if (d.modo === 'C') return [{act: 'gym', t: d.hora || 't'}];
  return [];
}
function codigoModo(ses) {
  if (!ses.length) return 'D';
  if (ses.length === 1) return 'C';
  const ts = new Set(ses.map(s => s.t));
  return ts.has('m') && ts.size > 1 ? 'A' : 'B';
}
const etiquetaSes = ses => ses.map(s => `${ACT[s.act].e} ${ACT[s.act].n}`).join(' + ');

function formula(tipo, rol) {
  if (rol === 'prepost') return 'Recarga entre sesiones, carbo + proteína fácil: 1 plátano + 1 yogur griego, o 1 pan con pollo';
  if (tipo === 'des') return 'Proteína 1 palma (2 huevos + 2 claras) · Carbo 1 puño (1 pan francés o ½ taza de avena) · 1 fruta';
  if (tipo === 'alm') return `Proteína 1½ palmas (≈150 g cocido) · ${tazas(F.arrozAlm)} de arroz o equivalente · ½ plato de verduras · 1 pulgar de grasa`;
  if (tipo === 'cen') return `Proteína 1½ palmas (≈150 g cocido) · ${tazas(F.arrozCen)} de arroz o equivalente · ½ plato de verduras`;
  if (rol === 'pre') return 'Carbo + proteína, 1–3 h antes: 1 plátano o 1 pan + 1 yogur griego o 2 huevos';
  if (rol === 'post') return 'Carbo + proteína, hasta 2 h después: 1 pan con pollo o atún, o yogur griego + fruta';
  return '1 yogur griego o 2 huevos sancochados + 1 fruta (manzana, mandarina, plátano o papaya)';
}

// Arma el orden del día: los entrenos se meten entre comidas según su franja
function planDelDia(d) {
  const ses = sesionesDe(d);
  const en = t => ses.filter(s => s.t === t);
  const H = t => ({hito: etiquetaSes(en(t)), nombres: en(t).map(s => ACT[s.act].n).join(' + '), franja: t});
  const C = (id, tipo, nombre, franja) => ({id, tipo, nombre, franja, rol: ''});
  const l = [];
  if (en('m').length) l.push(C('pre1', 'snack', 'Pre-entreno', 'm'), H('m'));
  l.push(C('des', 'des', 'Desayuno', 'm'), C('alm', 'alm', 'Almuerzo', 't'));
  if (en('t').length) l.push(H('t'));
  l.push(C('mer', 'snack', 'Merienda', 't'));
  if (en('n').length) l.push(H('n'));
  l.push(C('cen', 'cen', 'Cena', 'n'));
  // rol: la comida justo antes de un entreno es "pre", la de justo después es "post"
  l.forEach((c, i) => {
    if (c.hito) return;
    const antes = l[i + 1]?.hito, despues = l[i - 1]?.hito;
    c.rol = antes && despues ? 'prepost' : antes ? 'pre' : despues ? 'post' : '';
  });
  if (ses.length >= 2) l.push({id: 'extra', tipo: 'extra', nombre: 'Extra día doble', franja: 'n', rol: ''});
  const kcalDia = ses.length ? F.entreno : F.descanso;
  const comidas = l.filter(x => !x.hito && x.tipo !== 'extra');
  const suma = comidas.reduce((a, c) => a + PESOS_COMIDA[c.tipo], 0);
  for (const c of l) {
    if (c.hito) continue;
    if (c.tipo === 'extra') { c.kcal = 100; c.prot = 6; c.formula = '+1 fruta o 1 yogur griego, cuando más te convenga'; continue; }
    c.kcal = Math.round(kcalDia * PESOS_COMIDA[c.tipo] / suma / 10) * 10;
    c.prot = Math.round(PROT_META * PESOS_COMIDA[c.tipo] / suma);
    c.formula = formula(c.tipo, c.rol);
  }
  return {lista: l, kcal: kcalDia + (ses.length >= 2 ? 100 : 0), ses};
}

// Recetas sugeridas para un tipo de comida
function poolPara(tipo) {
  if (tipo === 'des') return RECETARIO.des;
  if (tipo === 'alm') return RECETARIO.alm;
  if (tipo === 'cen') return RECETARIO.cen;
  return RECETARIO.des.filter(r => r.snack);
}
function semilla(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function sugerencias(c, ronda) {
  const pool = poolPara(c.tipo).slice();
  let s = semilla(HOY + c.id + ronda);
  for (let i = pool.length - 1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i + 1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, 3);
}
const buscarReceta = code => { for (const k of ['des', 'alm', 'cen', 'ens']) { const r = RECETARIO[k].find(x => x.code === code); if (r) return {...r, grupo: k}; } return null; };

// Ilustración de una receta según lo que lleva
const ICONOS = [[/ensalada|salpic|solterito/, '🥗'], [/s[aá]nguche/, '🥪'], [/panqueque|crepe/, '🥞'], [/waffle/, '🧇'], [/tostada/, '🍞'],
  [/huevo|tortilla|omelette|bocadito/, '🍳'], [/quinua|avena|ca[ñn]ihua|mazamorra/, '🥣'], [/tamal|humita|choclo|mote/, '🌽'],
  [/pescado|bonito|jurel|caballa|trucha|merluza|pejerrey|at[uú]n/, '🐟'], [/pollo|gallina/, '🍗'], [/pav[oi]/, '🦃'], [/cerdo/, '🍖'],
  [/res|lomo|bistec|carne|asado/, '🥩'], [/tallar|fideo/, '🍝'], [/arroz|chaufa|tacu/, '🍚'], [/lenteja|frejol|pallar|haba|tarwi/, '🫘'],
  [/palta/, '🥑'], [/camote|papa|yuca/, '🥔'], [/br[oó]coli|coliflor/, '🥦'], [/zanahoria/, '🥕'], [/zapallo/, '🎃'], [/queso|ricota/, '🧀'], [/rocoto|aj[ií]/, '🌶️']];
const iconoReceta = t => { const s = String(t).toLowerCase(); for (const [re, e] of ICONOS) if (re.test(s)) return e; return '🍽️'; };
const FONDO_TIPO = {des: '#FFF1D6', alm: '#FFE4D6', cen: '#E3F1EA', snack: '#FDF0C4', extra: '#FBE3E8', ens: '#E3F1EA'};

function aguaMeta(d) {
  const ses = sesionesDe(d);
  const horas = d.horas ?? ses.reduce((a, s) => a + ACT[s.act].horas, 0);
  return {litros: 3 + .5 * horas, horas};
}
function protDelDia(d, plan) {
  let p = d.protExtra || 0;
  for (const c of plan.lista) {

function porcionComida(tipo) {
  if (tipo === 'alm') return {palmas: 1.5, gramos: 150, carbT: F.arrozAlm, huevos: '3 huevos + 3 claras'};
  if (tipo === 'cen') return {palmas: 1.5, gramos: 150, carbT: F.arrozCen, huevos: '3 huevos + 3 claras'};
  if (tipo === 'des') return {palmas: 1, gramos: 100, carbT: .5, huevos: '2 huevos + 2 claras'};

  lechuga: '🥬', tomate: '🍅', pepino: '🥒', 'brócoli': '🥦', zanahoria: '🥕', zapallito: '🥒', espinaca: '🍃', cebolla: '🧅', pimiento: '🫑', repollo: '🥬', caigua: '🫑', coliflor: '🥦', betarraga: '🍠', zapallo: '🎃', oliva: '🫒', palta: '🥑', queso: '🧀'};

function metaComida(tipo) {
  const d = dia();

  const kd = entreno ? F.entreno : F.descanso;
  const suma = PESOS_COMIDA.des + PESOS_COMIDA.alm + PESOS_COMIDA.cen + PESOS_COMIDA.snack;
  return {kcal: Math.round(kd * PESOS_COMIDA[tipo] / suma / 10) * 10, prot: Math.round(PROT_META * PESOS_COMIDA[tipo] / suma), entreno};
}
function calcPlato() {
  const por = porcionComida(P.comida);
  let k = 0, p = 0;
  const nP = P.prot.length || 1;
  for (const id of P.prot) { const a = ALIM.prot.find(x => x.id === id); k += a.k * por.gramos / 100 / nP; p += a.p * por.gramos / 100 / nP; }
  const nC = P.carb.length || 1;
  for (const id of P.carb) { const a = ALIM.carb.find(x => x.id === id); k += a.k * por.carbT / nC; p += a.p * por.carbT / nC; }
  if (P.verd.length) { k += 50; p += 3; }
  for (const id of P.gras) { const a = ALIM.gras.find(x => x.id === id); k += a.k; p += a.p; }
  return {k: Math.round(k), p: Math.round(p), por};
}

const G = {ver: 'peso'};
function promediosSemana() {

  const cBaja = cint.length >= 2 && cint[cint.length - 1].cm < cint[cint.length - 2].cm - .2;
  if (ws.length < 3 || !(w - 1 in A) || !(w - 2 in A)) {

      return `<button class="resp ${c}" data-q="${i}" data-o="${j}" ${resp[i] !== undefined ? 'disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>`).join('')}
      ${listo ? `<div style="margin-top:12px">${vineta(pts >= 2 ? `🎉 <b>${pts}/3 · ¡Aprobada!</b> ${pts === 3 ? '¡Perfecto, crack!' : 'Bien hecho.'}` : `<b>${pts}/3.</b> Casi. Repasa las viñetas y vuelve a intentarlo.`)}</div><button class="btn ancho ${pts >= 2 ? '' : 'sec'}" style="margin-top:10px" id="qFin">${pts >= 2 ? 'Terminar' : 'Reintentar'}</button>` : ''}`;
    $$('[data-q]', box).forEach(b => b.onclick = () => {
      resp[+b.dataset.q] = +b.dataset.o; pinta();
      if (resp.filter(x => x !== undefined).length === L.q.length) {
        const p = resp.filter((x, i) => x === L.q[i].r).length;
        const antes = estadoLecciones();
        const prev = S.lecciones[num]?.puntos ?? -1;
        S.lecciones[num] = {puntos: Math.max(prev, p)}; guardar();
        const nuevas = INSIGNIAS.filter(x => x.ok(estadoLecciones()) && !x.ok(antes));
        if (nuevas.length) toast(`¡Nueva insignia: ${nuevas.map(x => x.e + ' ' + x.t).join(', ')}!`);
      }
    });
    $('#qFin', box)?.addEventListener('click', () => { if (pts >= 2) cerrarHoja(); else { resp.length = 0; pinta(); } });
  };
  pinta();
}

/* =====================================================================
   RESPALDO
   ===================================================================== */
function abrirAjustes() {
  const hj = hoja(`<h2>Respaldo</h2><p class="suave peq">Tus datos viven solo en este navegador. Exporta un respaldo de vez en cuando y guárdalo en tu Drive o WhatsApp.</p>
    <div class="pila" style="margin-top:12px">
      <button class="btn ancho" id="bExp">⬇️ Exportar respaldo (JSON)</button>
      <label class="btn ancho sec" style="display:flex;align-items:center;justify-content:center;cursor:pointer">⬆️ Importar respaldo<input type="file" id="bImp" accept="application/json,.json" style="display:none"></label>
      <div class="card peq"><b>Tu bloque</b><div class="suave">Hombre · 26 años · 1,70 m · inicio 4 nov 2026: 93,6 kg, cintura 99 cm, pecho 106 cm, ~30 % grasa. Meta 78–80 kg y cintura ≤ 85 cm.</div>
      <div class="suave" style="margin-top:6px">${Object.entries(FASES).map(([k, f]) => `<span style="color:${f.color};font-weight:700">${f.nombre}</span> (${f.desde}–${f.hasta}): ${f.entreno}/${f.descanso} kcal`).join('<br>')}</div></div>
      <button class="btn ancho borde" id="bBorrar" style="color:var(--mal)">Borrar todos mis datos</button>
    </div>`);
  $('#bExp', hj).onclick = () => {
    try {
      const blob = new Blob([JSON.stringify({app: 'plan90', exportado: new Date().toISOString(), datos: S}, null, 1)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `plan90-respaldo-${HOY}.json`;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Respaldo descargado');
    } catch (e) { toast('No se pudo exportar: ' + e.message); }
  };
  $('#bImp', hj).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const o = JSON.parse(await f.text());
      const datos = o && o.app === 'plan90' ? o.datos : o;
      if (!datos || typeof datos !== 'object' || !('dias' in datos || 'pesos' in datos)) throw new Error('no parece un respaldo de esta app');
      if (!confirm('Esto reemplaza tus datos actuales por los del respaldo. ¿Seguir?')) return;
      S = normalizar(datos); guardar(); cerrarHoja(); ir(S.ui.tab); toast(`Respaldo importado: ${S.pesos.length} pesos, ${Object.keys(S.dias).length} días`);
    } catch (err) { toast('Archivo no válido: ' + err.message); }
    e.target.value = '';
  };
  $('#bBorrar', hj).onclick = () => {
    if (!confirm('¿Borrar TODO (días, pesos, favoritos, lecciones)? No se puede deshacer.')) return;
    S = base(); guardar(); cerrarHoja(); ir('hoy');
  };
}
$('#btnAjustes').onclick = abrirAjustes;

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(function iniciar() {
  document.documentElement.style.setProperty('--m', F.color);
  try { $('meta[name=theme-color]').content = F.color; } catch (e) {}
  const n = diaN(hoyFecha);
  $('#cabTitulo').textContent = n < 0 ? 'Plan 90 días · pronto' : n >= DIAS_BLOQUE ? 'Plan 90 días · bloque cerrado' : `${F.nombre} · semana ${semanaDe(hoyFecha)}`;
  $('#cabSub').textContent = n < 0 ? `Empieza el 4 nov 2026 (faltan ${-n} días)` : n >= DIAS_BLOQUE ? 'Terminaste las 13 semanas. ¡Mídete y planea el siguiente bloque!' : `${F.desde} – ${F.hasta} · ${F.entreno} kcal entreno / ${F.descanso} descanso · ${PROT_META} g proteína`;
  // si hoy todavía no dijo cómo entrena, se abre en Hoy para preguntárselo
  ir(S.dias[HOY]?.modo ? (S.ui.tab || 'hoy') : 'hoy');
})();
</script>
