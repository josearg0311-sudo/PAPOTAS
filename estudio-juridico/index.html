<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f2e">
<title>Estudio Rodríguez y Rodríguez</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --papel:#f3ebe0; --hoja:#fffaf2; --hoja-2:#f8f0e4; --regla:#e3d5c3; --regla-2:#cdb89f;
  --tinta:#2b1d1a; --tinta-2:#6a5650; --tinta-3:#9a857c;
  --vino:#7d1d2c; --vino-2:#5e1420; --vino-suave:#f1dfdc; --oro:#a8824c; --sobre-vino:#fff8ef;
  --ok:#3d6b3f; --ok-suave:#e5ecd9; --ambar:#9a5b0e; --ambar-suave:#f6e6c9; --mal:#a3241b; --mal-suave:#f6dcd6; --azul:#35557a; --azul-suave:#e2e8ee;
  --sombra:0 1px 0 rgba(90,50,30,.06),0 10px 24px -14px rgba(90,40,20,.35);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#1d1512; --hoja:#271d19; --hoja-2:#2f2420; --regla:#433430; --regla-2:#5a4740;
    --tinta:#f2e7da; --tinta-2:#c8b6a8; --tinta-3:#93807a;
    --vino:#d77a84; --vino-2:#e6949c; --vino-suave:#40242a; --oro:#c9a46a; --sobre-vino:#1d1512;
    --ok:#9cc49a; --ok-suave:#26331f; --ambar:#e2ae5c; --ambar-suave:#3b2d17; --mal:#ec8b80; --mal-suave:#43231f; --azul:#9ab6d6; --azul-suave:#1f2a36;
    --sombra:0 10px 24px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#1d1512; --hoja:#271d19; --hoja-2:#2f2420; --regla:#433430; --regla-2:#5a4740;
  --tinta:#f2e7da; --tinta-2:#c8b6a8; --tinta-3:#93807a;
  --vino:#d77a84; --vino-2:#e6949c; --vino-suave:#40242a; --oro:#c9a46a; --sobre-vino:#1d1512;
  --ok:#9cc49a; --ok-suave:#26331f; --ambar:#e2ae5c; --ambar-suave:#3b2d17; --mal:#ec8b80; --mal-suave:#43231f; --azul:#9ab6d6; --azul-suave:#1f2a36;
  --sombra:0 10px 24px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--vino)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-family:var(--serif);font-weight:700}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:15px}
.muted{color:var(--tinta-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--tinta-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.02em}
.versal{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}

/* ---------- membrete y pestañas ---------- */
.cab{background:var(--hoja);border-bottom:1px solid var(--regla);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.cab:after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--vino) 0 70%,var(--oro) 70% 100%)}
.cab-in{max-width:1180px;margin:0 auto;padding:14px 28px 0;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tinta);flex:1;min-width:0}
.marca svg{width:46px;height:46px;flex:none}
.marca b{display:block;font-family:var(--serif);font-size:21px;letter-spacing:.12em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca b i{font-style:italic;letter-spacing:0;color:var(--vino);font-weight:400;padding:0 .1em}
.marca em{display:block;font-family:var(--serif);font-style:italic;color:var(--tinta-2);font-size:14px;margin-top:1px}
.cab-acc{display:flex;gap:4px}
.cab-acc a{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--tinta-2)}
.cab-acc a:hover,.cab-acc a.on{background:var(--vino-suave);color:var(--vino)}
.cab-acc svg{width:20px;height:20px}
.pestanas{max-width:1180px;margin:0 auto;padding:14px 28px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas a{display:flex;align-items:center;gap:7px;padding:9px 16px 8px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;text-decoration:none;color:var(--tinta-2);font-weight:600;font-size:14px;white-space:nowrap;position:relative;top:1px}
.pestanas a svg{width:17px;height:17px}
.pestanas a:hover{color:var(--vino)}
.pestanas a.on{background:var(--papel);border-color:var(--regla);color:var(--vino)}
.pestanas a.on:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--vino);border-radius:9px 9px 0 0}

main{padding:28px 28px 80px;max-width:1180px;margin:0 auto;width:100%;min-width:0;overflow-x:clip}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--regla)}
.head .sub{color:var(--tinta-2);font-size:14px;margin-top:6px;font-family:var(--serif);font-style:italic}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- hojas ---------- */
.card{background:var(--hoja);border:1px solid var(--regla);border-radius:4px;box-shadow:var(--sombra);padding:18px 20px}
.card + .card{margin-top:18px}
.grid > .card + .card{margin-top:0}
.grid > *{min-width:0}
.card h2{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px double var(--regla-2);border-bottom-width:3px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}

/* sumario tipo libro mayor */
.sumario{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:0}
.sumario .stat{padding:14px 18px;border-left:1px solid var(--regla)}
.sumario .stat:first-child{border-left:0}
.stat .k{font-size:10.5px;color:var(--tinta-3);text-transform:uppercase;letter-spacing:.18em;font-weight:700}
.stat .v{font-family:var(--serif);font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums lining-nums}
.stat .d{font-size:12px;color:var(--tinta-3);font-style:italic;font-family:var(--serif)}
.stat.alert .v{color:var(--mal)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--regla-2);background:var(--hoja);padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--tinta);white-space:nowrap;letter-spacing:.01em}
.btn:hover{border-color:var(--vino);color:var(--vino)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--vino);border-color:var(--vino);color:var(--sobre-vino)}
.btn.pri:hover{background:var(--vino-2);border-color:var(--vino-2);color:var(--sobre-vino)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--vino)}
.btn.danger{color:var(--mal);border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.wa{background:#246b45;border-color:#246b45;color:#fff}

/* renglones */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px dashed var(--regla-2);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover .t{color:var(--vino)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--tinta-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
/* hoja de calendario arrancable */
.datebox{width:44px;flex:none;text-align:center;border:1px solid var(--regla-2);border-radius:3px;background:var(--hoja);overflow:hidden}
.datebox span{display:block;background:var(--tinta-2);color:var(--hoja);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:1px 0;order:-1}
.datebox{display:flex;flex-direction:column}
.datebox b{display:block;font-family:var(--serif);font-size:20px;line-height:1.25;padding:1px 0 2px}
.datebox.bad{border-color:var(--mal)} .datebox.bad span{background:var(--mal)} .datebox.bad b{color:var(--mal)}
.datebox.warn{border-color:var(--ambar)} .datebox.warn span{background:var(--ambar)}
.inic{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--vino);color:var(--vino);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.04em}

.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:2px;color:var(--tinta-2);border:1px solid var(--regla-2);white-space:nowrap;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.b-ok{color:var(--ok);border-color:currentColor;background:var(--ok-suave)}
.b-warn{color:var(--ambar);border-color:currentColor;background:var(--ambar-suave)}
.b-bad{color:var(--mal);border-color:currentColor;background:var(--mal-suave)}
.b-info{color:var(--azul);border-color:currentColor;background:var(--azul-suave)}
.b-brand{color:var(--vino);border-color:currentColor;background:var(--vino-suave)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--regla-2);border-radius:3px;background:var(--hoja)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--tinta-3)}
select.f,input.f{padding:9px 10px;border:1px solid var(--regla-2);border-radius:3px;background:var(--hoja)}
.chips{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--regla)}
.chip{border:0;border-bottom:2px solid transparent;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--tinta-2);font-weight:600;margin-bottom:-1px}
.chip:hover{color:var(--vino)}
.chip.on{color:var(--vino);border-bottom-color:var(--vino)}

.empty{text-align:center;padding:30px 16px;color:var(--tinta-2);font-family:var(--serif);font-style:italic}
.empty svg{width:40px;height:40px;color:var(--regla-2);margin-bottom:8px}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 22px}
.kv div span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--tinta-3);font-weight:700;margin-bottom:2px}
.kv div b{font-weight:500;word-break:break-word}

.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--regla-2)}
.tl{position:relative;padding:4px 0 14px}
.tl:before{content:"§";position:absolute;left:-21px;top:4px;width:13px;height:16px;line-height:16px;text-align:center;font-family:var(--serif);font-weight:700;color:var(--vino);background:var(--hoja);font-size:13px}
.tl .x{float:right;opacity:.45;cursor:pointer;border:0;background:none;padding:0 4px}
.tl .x:hover{opacity:1;color:var(--mal)}
.tl .tiny{font-family:var(--serif);font-style:italic}
.inline-add{display:flex;gap:8px;margin-top:8px}
.inline-add input{flex:1;min-width:0}

.money{font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--serif);font-size:15.5px}
.pos{color:var(--ok)} .neg{color:var(--mal)}
.bar{height:6px;background:var(--hoja-2);overflow:hidden;border:1px solid var(--regla)}
.bar i{display:block;height:100%;background:var(--ok)}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{font-size:22px;border:0;padding:0;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--regla);border-left:1px solid var(--regla)}
.cal .dow{font-size:10.5px;text-align:center;color:var(--tinta-3);font-weight:700;text-transform:uppercase;letter-spacing:.14em;padding:6px 0;border-right:1px solid var(--regla);border-bottom:1px solid var(--regla);background:var(--hoja-2)}
.cal .d{min-height:74px;border-right:1px solid var(--regla);border-bottom:1px solid var(--regla);padding:4px 5px;cursor:pointer;background:var(--hoja);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d:hover{background:var(--vino-suave)}
.cal .d.out{color:var(--tinta-3);background:var(--hoja-2)}
.cal .d.out > *{opacity:.55}
.cal .d.inh{background:repeating-linear-gradient(135deg,var(--hoja) 0 6px,var(--hoja-2) 6px 12px)}
.cal .d.today .n{background:var(--vino);color:var(--sobre-vino);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--vino)}
.cal .n{font-family:var(--serif);font-size:14px;font-weight:700;align-self:flex-start}
.cal .ev{font-size:10.5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--azul);color:var(--azul);background:var(--azul-suave)}
.cal .ev.audiencia{border-color:var(--vino);color:var(--vino);background:var(--vino-suave)}
.cal .ev.plazo{border-color:var(--ambar);color:var(--ambar);background:var(--ambar-suave)}
.cal .ev.hecho{text-decoration:line-through;opacity:.6}
.cal .fer{font-size:9.5px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;font-family:var(--serif)}
.dots{display:none;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--azul)}
.dots i.audiencia{background:var(--vino)} .dots i.plazo{background:var(--ambar)}

.check{width:20px;height:20px;border-radius:2px;border:1.5px solid var(--tinta-3);flex:none;display:grid;place-items:center;background:var(--hoja);cursor:pointer;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:13px;height:13px}
.done .t{text-decoration:line-through;color:var(--tinta-3)}

.portal{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--tinta)}
.portal .ic{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--vino);color:var(--vino);display:grid;place-items:center;flex:none;font-weight:700;font-size:12px;font-family:var(--serif);letter-spacing:.04em}
.portal b{font-family:var(--serif);font-size:16px}
.portal:hover b{color:var(--vino)}

/* ---------- portada del despacho ---------- */
.portada{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:26px}
.cinta{display:inline-block;background:var(--vino);color:var(--sobre-vino);font-size:11.5px;letter-spacing:.26em;font-weight:700;padding:5px 14px 5px 16px;text-transform:uppercase;border-radius:2px}
.titular{font-size:44px;line-height:1.02;margin:14px 0 10px;letter-spacing:-.02em}
.titular em{color:var(--vino);font-style:normal}
.resumen{font-family:var(--serif);font-size:18px;color:var(--tinta-2);margin:0 0 16px;max-width:36em}
.resumen b{color:var(--tinta)}
.nota-papel{background:var(--hoja);padding:18px 20px;border:1px solid var(--regla);box-shadow:var(--sombra);transform:rotate(-1.2deg);position:relative}
.nota-papel:before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(168,130,76,.35);transform:rotate(2deg)}
.nota-papel .grande{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--vino);line-height:1;font-variant-numeric:lining-nums}
.nota-papel .linea{border-top:1px solid var(--regla-2);margin:10px 0 8px}
.firma{font-family:var(--serif);font-style:italic;color:var(--vino);font-size:17px;transform:rotate(-6deg);display:inline-block}
.fichas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.fichas > *{min-width:0}
.ficha{position:relative;margin-top:16px}
.ficha .lengueta{position:absolute;top:-17px;left:16px;background:var(--hoja);border:1px solid var(--regla);border-bottom:0;border-radius:6px 6px 0 0;padding:2px 12px;font-size:10.5px;letter-spacing:.2em;font-weight:700;color:var(--vino);text-transform:uppercase}
.ficha .dibujo{float:right;width:54px;height:54px;color:var(--vino);margin:-6px -4px 0 8px}
.ficha h2{border:0;padding:0;display:block}
.ficha .cuenta{font-family:var(--serif);font-style:italic;color:var(--tinta-2);font-size:14px;margin:2px 0 10px}

/* ---------- ventanas ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(40,20,15,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
.modal{background:var(--hoja);border-radius:4px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.35);border-top:4px solid var(--vino)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--regla);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal header h2{font-size:21px}
.modal .body{padding:18px 20px;overflow:auto}
.modal footer{padding:12px 20px;border-top:1px solid var(--regla);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--hoja-2)}
.modal footer .l{margin-right:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;font-weight:700;color:var(--tinta-2);letter-spacing:.16em;text-transform:uppercase}
.form label.cb{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px}
.form input:not([type=checkbox]),.form select,.form textarea{padding:8px 2px;border:0;border-bottom:1.5px solid var(--regla-2);border-radius:0;background:transparent;font-weight:400;color:var(--tinta);width:100%;font-size:15px;letter-spacing:0;text-transform:none}
.form select{padding-right:0}
.form textarea{min-height:80px;resize:vertical;border:1.5px solid var(--regla-2);padding:8px}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--vino)}
.search input:focus,input.f:focus,select.f:focus{outline:2px solid var(--vino);outline-offset:-1px}
.form .hint{font-weight:400;font-size:12px;color:var(--tinta-3);letter-spacing:0;text-transform:none;font-style:italic;font-family:var(--serif)}
.req{color:var(--mal)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:10px 16px;border-radius:3px;z-index:60;font-weight:500;box-shadow:var(--sombra);max-width:calc(100% - 32px);border-left:4px solid var(--oro)}

.welcome{background:var(--hoja);border:1px solid var(--regla);border-left:5px solid var(--vino);margin-bottom:24px}
.welcome h2{border:0;padding:0;font-size:22px}

#imprimir{display:none}

/* escritos */
.titulo-edit{display:block;width:100%;font-family:var(--serif);font-size:28px;font-weight:700;border:0;background:transparent;color:var(--tinta);padding:2px 0;margin-top:4px;border-bottom:1px dashed transparent}
.titulo-edit:focus{outline:0;border-bottom-color:var(--vino)}
.hoja-a4{background:#fffdf8;color:#1d1512;max-width:820px;margin:0 auto;box-shadow:var(--sombra);border:1px solid var(--regla);padding:56px 64px 56px 76px;position:relative}
.hoja-a4:before{content:"";position:absolute;left:52px;top:0;bottom:0;border-left:1px solid #e9c9c5}
.hoja-a4 textarea{width:100%;min-height:70vh;border:0;background:transparent;resize:vertical;font:15px/1.7 Arial,Helvetica,sans-serif;color:#1d1512;outline:0;text-align:justify}
.grabando{background:var(--mal)!important;color:#fff!important;border-color:var(--mal)!important;animation:latido 1.2s infinite}
@keyframes latido{50%{opacity:.6}}

/* generador de documentos */
.cat-titulo{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2);margin:22px 0 10px;font-family:system-ui,sans-serif}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.modelos > .card + .card{margin-top:0}
.modelo{display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--vino)}
.modelo h3{font-size:17px}
.modelo p{margin:0 0 6px;flex:1}
.generador{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.gen-form .card + .card{margin-top:14px}
.gen-prev{position:sticky;top:150px}
.previa{white-space:pre-wrap;font:13px/1.65 Arial,Helvetica,sans-serif;text-align:justify;max-height:calc(100vh - 190px);overflow:auto;padding:36px 40px 36px 56px}
.previa:before{left:36px}
mark.falta{background:var(--ambar-suave);color:var(--ambar);padding:0 2px;border-radius:2px}
.gen-form details summary{cursor:pointer;list-style:none}
.gen-form details summary::-webkit-details-marker{display:none}
.chips-ins{display:flex;flex-wrap:wrap;gap:6px}
.chip-ins{border:1px solid var(--regla-2);background:var(--hoja-2);border-radius:2px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--tinta)}
.chip-ins:hover{border-color:var(--vino);color:var(--vino)}
.ayuda p{margin:0 0 8px}
.ayuda code,#modDetect code{background:var(--hoja-2);border:1px solid var(--regla);padding:0 4px;font-size:12px;border-radius:2px;word-break:break-all}

/* asistente con IA */
.asistente{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.asistente > *{min-width:0}
#iaExp{max-width:100%;min-width:0}
.ia-lado .card + .card{margin-top:14px}
.ia-lado .card h2{font-size:16px}
.ia-chat{background:var(--hoja);border:1px solid var(--regla);box-shadow:var(--sombra);border-radius:4px;display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:460px;padding:0 0 10px}
.ia-chat.soltando{outline:3px dashed var(--vino);outline-offset:-6px}
.ia-hilo{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.ia-vacio{margin:auto;text-align:center;max-width:380px}
.ia-vacio svg{width:56px;height:56px}
.ia-vacio h3{font-size:22px;margin:10px 0 6px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.yo{justify-content:flex-end}
.msg.yo .globo{background:var(--vino-suave);border:1px solid var(--regla);max-width:80%;padding:10px 14px;border-radius:12px 12px 2px 12px}
.msg.ia .globo{flex:1;min-width:0;max-width:100%}
.msg .avatar svg{width:30px;height:30px;flex:none}
.cuerpo{font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.cuerpo p{margin:0}
.cuerpo h4{font-family:var(--serif);font-size:17px;margin:10px 0 4px}
.cuerpo ul,.cuerpo ol{margin:4px 0;padding-left:22px}
.cuerpo .hueco{height:10px}
.cuerpo code{background:var(--hoja-2);border:1px solid var(--regla);padding:0 4px;font-size:13px}
.cuerpo hr{border:0;border-top:1px solid var(--regla);margin:10px 0}
.pensando{color:var(--tinta-3);font-style:italic;font-family:var(--serif)}
.pensando i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--vino);margin-right:3px;animation:latido 1s infinite}
.pensando i:nth-child(2){animation-delay:.2s}.pensando i:nth-child(3){animation-delay:.4s}
.acciones-ia{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.aviso-ia{margin-top:8px;font-size:13px;color:var(--ambar);background:var(--ambar-suave);padding:6px 10px;border-radius:3px}
.aviso-ia.mal{color:var(--mal);background:var(--mal-suave)}
.ia-adjuntos{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px}
.ia-adjuntos .adj{background:var(--hoja-2);border:1px solid var(--regla-2);padding:3px 4px 3px 9px;font-size:12.5px;border-radius:2px;display:inline-flex;align-items:center;gap:4px}
.ia-adjuntos .adj button{border:0;background:none;cursor:pointer;color:var(--tinta-3)}
.ia-caja{display:flex;gap:8px;align-items:flex-end;margin:8px 14px 0;border:1px solid var(--regla-2);border-radius:4px;padding:6px 6px 6px 12px;background:var(--papel)}
.ia-caja textarea{flex:1;border:0;background:transparent;resize:none;font:15px/1.5 system-ui,sans-serif;outline:0;max-height:200px;min-height:44px;color:var(--tinta)}
.ia-botones{display:flex;gap:4px}
.pasos{font-family:var(--serif);font-size:16px;line-height:1.7;margin:4px 0 14px}

/* cronómetro flotante */
#crono{position:fixed;right:18px;bottom:18px;z-index:40;background:var(--tinta);color:var(--papel);padding:8px 8px 8px 14px;border-radius:999px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#crono a{color:inherit;text-decoration:none;font-size:16px;font-weight:700}
#crono .punto{width:9px;height:9px;border-radius:50%;background:#e5484d;animation:latido 1s infinite}

/* tablero */
.tablero{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.tablero .col{flex:0 0 240px;background:var(--hoja-2);border:1px solid var(--regla);border-radius:4px;padding:10px;min-height:120px}
.tablero .col.sobre{outline:2px dashed var(--vino);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tarjeta{background:var(--hoja);border:1px solid var(--regla);border-left:3px solid var(--vino);padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:var(--sombra)}
.tarjeta .t{font-weight:600;font-size:13.5px;line-height:1.3;margin-bottom:3px}
.tarjeta.arrastrando{opacity:.4}
.tarjeta .mover{margin-top:6px;width:100%;font-size:12px;padding:3px;border:1px solid var(--regla);background:var(--hoja-2);border-radius:2px}
.col .vacio{text-align:center;padding:16px 0;font-style:italic}

/* gráficos */
.graf{width:100%;display:block}
.graf .eje{stroke:var(--regla);stroke-width:1}
.graf .et{fill:var(--tinta-3);font-size:11px;font-family:system-ui,sans-serif}
.graf .et.fuerte{fill:var(--tinta);font-weight:700}
.graf .barra{fill:var(--vino)}
.graf .hov:hover .barra{fill:var(--vino-2)}
.vbars{display:grid;grid-template-columns:auto 1fr;gap:8px;height:230px}
.vb-ejes{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--tinta-3);text-align:right;padding-bottom:22px;margin-top:-6px}
.vb-area{position:relative;display:flex;gap:2px;align-items:stretch}
.vb-linea{position:absolute;left:0;right:0;border-top:1px solid var(--regla);margin-bottom:22px;bottom:0}
.vb-area .vb-linea:nth-child(2){bottom:calc(50% + 11px)!important;margin:0}
.vb-area .vb-linea:nth-child(3){bottom:auto!important;top:0;margin:0}
.vb{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
.vb-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.vb-col i{display:block;width:62%;max-width:46px;background:var(--vino);border-radius:4px 4px 0 0;min-height:0}
.vb:hover .vb-col i{background:var(--vino-2)}
.vb-val{font-size:11px;font-weight:700;margin-bottom:3px;white-space:nowrap}
.vb-et{height:22px;line-height:22px;text-align:center;font-size:11px;color:var(--tinta-3)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tinta-2)}
.hb .hv{height:14px;display:block}
.hb .hv i{display:block;height:100%;background:var(--vino);border-radius:0 4px 4px 0}
.hb:hover .hv i{background:var(--vino-2)}
.hb .hn{font-variant-numeric:tabular-nums;font-weight:600;min-width:54px;text-align:right}
#tip{position:fixed;z-index:70;background:var(--tinta);color:var(--papel);padding:5px 9px;font-size:12.5px;border-radius:3px;pointer-events:none;white-space:nowrap}
.tabla-ver{margin-top:8px}
.tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tabla th,.tabla td{border-bottom:1px solid var(--regla);padding:5px 4px;text-align:left}
.tabla .r{text-align:right;font-variant-numeric:tabular-nums}

/* candado */
#candado{position:fixed;inset:0;z-index:100;background:var(--papel);display:grid;place-items:center;padding:20px}
.candado-in{text-align:center;max-width:320px;width:100%}
.candado-in h2{margin:12px 0 4px}
#formPin{display:flex;gap:8px;margin:14px 0}
#pinIn{flex:1;min-width:0;font-size:24px;letter-spacing:.4em;text-align:center;padding:8px;border:1px solid var(--regla-2);background:var(--hoja);border-radius:3px}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teclado button{padding:14px 0;font-size:20px;font-family:var(--serif);background:var(--hoja);border:1px solid var(--regla);border-radius:3px;cursor:pointer}
.teclado button:active{background:var(--vino-suave)}

/* ---------- teléfono ---------- */
@media (max-width:1050px) and (min-width:901px){ .fichas{grid-template-columns:1fr 1fr} }
@media (max-width:900px){
  .cab-in{padding:10px 16px 0;gap:8px}
  .marca{gap:9px}
  .marca svg{width:36px;height:36px}
  .marca b{font-size:14.5px;letter-spacing:.03em;white-space:normal;line-height:1.15}
  .marca em{font-size:12.5px}
  .cab-acc a{width:34px;height:34px}
  .pestanas{padding:10px 8px 0;gap:0}
  .pestanas a{padding:8px 8px 7px;font-size:12.5px;flex:1 0 auto;justify-content:center}
  .pestanas a svg{display:none}
  main{padding:18px 16px calc(60px + env(safe-area-inset-bottom))}
  h1{font-size:25px}
  .g3,.g2,.fichas,.portada{grid-template-columns:1fr}
  .titular{font-size:34px}
  .resumen{font-size:16.5px}
  .nota-papel{transform:rotate(-.8deg);margin:6px 4px 0}
  .form{grid-template-columns:1fr}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{max-height:94vh;border-radius:6px 6px 0 0}
  .modal footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .cal .d{min-height:46px;align-items:center}
  .cal .ev,.cal .fer{display:none}
  .dots{display:flex}
  .hide-m{display:none!important}
  .sumario{grid-template-columns:1fr 1fr}
  .sumario .stat:nth-child(odd){border-left:0}
  .sumario .stat:nth-child(n+3){border-top:1px solid var(--regla)}
  .stat .v{font-size:21px}
  .inline-add{flex-wrap:wrap}
  .hoja-a4{padding:28px 18px 28px 30px;margin:0 -6px}
  .hoja-a4:before{left:18px}
  .hoja-a4 textarea{font-size:14px}
  .titulo-edit{font-size:22px}
  #crono{right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .tablero .col{flex-basis:78vw}
  .modal{border-radius:18px 18px 0 0}
  .generador{grid-template-columns:1fr}
  .asistente{grid-template-columns:1fr}
  .ia-lado{order:2}
  .ia-chat{height:calc(100vh - 210px);min-height:420px}
  .msg.yo .globo{max-width:92%}
  .ia-hilo{padding:14px 12px}
  .gen-prev{position:static}
  .previa{max-height:none;padding:22px 16px 22px 26px;font-size:12.5px}
  .previa:before{left:14px}
  .inline-add input[name=texto],.inline-add input[name=motivo]{flex-basis:100%;order:-1}
}
@media (max-width:380px){ .marca em{display:none} }


/* =====================================================================
   TEMA «VINO RENOVADO»
   Cabecera vino, fondo claro, tarjetas limpias y letra moderna.
   Va al final para mandar sobre los estilos anteriores.
   ===================================================================== */
:root{
  --papel:#f4f1f2; --hoja:#ffffff; --hoja-2:#f8f5f6; --regla:#ebe4e6; --regla-2:#dcd2d5;
  --tinta:#1f1a1c; --tinta-2:#5c5256; --tinta-3:#8d8387;
  --vino:#7a1f2e; --vino-2:#962a3c; --vino-suave:#f8e9ec; --oro:#d6ae6b; --sobre-vino:#ffffff;
  --cab:#7a1f2e; --cab-2:#5d1622;
  --ok:#1d7a4c; --ok-suave:#e3f4ea; --ambar:#a35d00; --ambar-suave:#fdf0d9; --mal:#bd2a2a; --mal-suave:#fde6e4; --azul:#2c5d9b; --azul-suave:#e6eef9;
  --morado:#6b3fa0; --morado-suave:#efe8f8;
  --sombra:0 1px 2px rgba(60,20,30,.05),0 6px 20px -8px rgba(60,20,30,.12);
  --serif:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#141113; --hoja:#1d191b; --hoja-2:#252022; --regla:#332c2f; --regla-2:#463d41;
    --tinta:#f2edef; --tinta-2:#c1b6ba; --tinta-3:#8c8186;
    --vino:#e2687b; --vino-2:#ee8494; --vino-suave:#3a1c23; --oro:#d9b578; --sobre-vino:#1a0a0e;
    --cab:#4a1420; --cab-2:#360e17;
    --ok:#5cc68f; --ok-suave:#173225; --ambar:#efae4f; --ambar-suave:#3a2a12; --mal:#f17c74; --mal-suave:#3f1b1a; --azul:#86aee6; --azul-suave:#18263a;
    --morado:#b39ae3; --morado-suave:#2a2140;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --papel:#141113; --hoja:#1d191b; --hoja-2:#252022; --regla:#332c2f; --regla-2:#463d41;
  --tinta:#f2edef; --tinta-2:#c1b6ba; --tinta-3:#8c8186;
  --vino:#e2687b; --vino-2:#ee8494; --vino-suave:#3a1c23; --oro:#d9b578; --sobre-vino:#1a0a0e;
  --cab:#4a1420; --cab-2:#360e17;
  --ok:#5cc68f; --ok-suave:#173225; --ambar:#efae4f; --ambar-suave:#3a2a12; --mal:#f17c74; --mal-suave:#3f1b1a; --azul:#86aee6; --azul-suave:#18263a;
  --morado:#b39ae3; --morado-suave:#2a2140;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
}
body{font:15px/1.5 var(--serif);letter-spacing:-.003em}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.015em}
h1{font-size:26px;font-weight:750}
.versal{letter-spacing:.08em;font-size:11px}

/* cabecera */
.cab{background:var(--hoja);border-bottom:1px solid var(--regla);box-shadow:0 2px 10px -6px rgba(60,20,30,.25)}
.cab:after{display:none}
.cab-banda{background:linear-gradient(100deg,var(--cab),var(--cab-2));color:#fff}
.cab-in{padding:12px 28px}
.marca{color:#fff}
.marca svg{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.marca b{font-family:var(--serif);font-size:17px;letter-spacing:.06em;font-weight:750}
.marca b i{color:var(--oro);font-style:normal;font-weight:600;letter-spacing:0}
.marca em{font-family:var(--serif);font-style:normal;color:rgba(255,255,255,.72);font-size:12.5px;letter-spacing:.02em}
.cab-acc a{color:rgba(255,255,255,.9)}
.cab-acc a:hover,.cab-acc a.on{background:rgba(255,255,255,.16);color:#fff}
.cab-sync{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.85);padding:0 6px;white-space:nowrap}
.cab-sync i{width:8px;height:8px;border-radius:50%;background:#9be3b9;box-shadow:0 0 0 3px rgba(155,227,185,.25)}
.cab-sync.off i{background:rgba(255,255,255,.45);box-shadow:none}
.cab-sync.err i{background:#ffb4a8;box-shadow:0 0 0 3px rgba(255,180,168,.25)}
.cab-yo{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:12.5px;text-decoration:none;margin-left:4px}
.pestanas{padding:0 22px;gap:2px}
.pestanas a{border:0;border-radius:0;padding:12px 12px 10px;color:var(--tinta-2);font-size:14px;font-weight:600;top:0;border-bottom:3px solid transparent}
.pestanas a:hover{color:var(--vino)}
.pestanas a.on{background:transparent;color:var(--vino);border-bottom-color:var(--vino)}
.pestanas a.on:before{display:none}
.pestanas a svg{opacity:.85}

main{padding-top:26px}
.head{border-bottom:0;padding-bottom:0;margin-bottom:22px;align-items:center}
.head .sub{font-family:var(--serif);font-style:normal;font-size:14px;color:var(--tinta-3);margin-top:3px}

/* tarjetas */
.card{border-radius:var(--r);border:1px solid var(--regla);box-shadow:var(--sombra);padding:18px 20px}
.card h2{border-bottom:0;padding-bottom:0;margin-bottom:12px;font-size:16px;font-weight:700}
.sumario{border-radius:var(--r)}
.stat .k{letter-spacing:.06em;font-size:11.5px}
.stat .v{font-family:var(--serif);font-weight:750;letter-spacing:-.02em}
.stat .d{font-family:var(--serif);font-style:normal}

/* botones */
.btn{border-radius:10px;border-color:var(--regla-2);padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--vino);color:var(--vino);background:var(--hoja)}
.btn.pri{box-shadow:0 2px 8px -3px rgba(122,31,46,.55)}
.btn.sm{border-radius:8px;padding:5px 10px}
.btn.danger{text-decoration:none}
.btn.danger:hover{background:var(--mal-suave);color:var(--mal)}
.btn.wa{border-radius:10px}

/* renglones y etiquetas */
.row{border-top:1px solid var(--regla);padding:11px 2px}
.datebox{border:0;border-radius:11px;background:var(--vino-suave);color:var(--vino);width:46px;padding:5px 0 4px}
.datebox b{font-family:var(--serif);font-size:18px;line-height:1.1;padding:0;order:1;font-weight:750}
.datebox span{background:none;color:inherit;order:2;font-size:10px;letter-spacing:.08em;padding:0;opacity:.85}
.datebox.bad{background:var(--mal-suave);color:var(--mal)} .datebox.bad span{background:none} .datebox.bad b{color:var(--mal)}
.datebox.warn{background:var(--ambar-suave);color:var(--ambar)} .datebox.warn span{background:none}
.inic{border:0;background:var(--vino-suave);font-family:var(--serif);font-size:14px}
.badge{border-radius:999px;border:0;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600;padding:2px 9px;background:var(--hoja-2)}
.b-ok,.b-warn,.b-bad,.b-info,.b-brand{border:0}
.chips{border-bottom:0;gap:6px}
.chip{border:1px solid var(--regla-2);border-radius:999px;margin:0;padding:5px 13px;background:var(--hoja);font-size:13px}
.chip.on{background:var(--vino);border-color:var(--vino);color:var(--sobre-vino)}
.chip:hover{border-color:var(--vino)}
.empty{font-family:var(--serif);font-style:normal;color:var(--tinta-3)}
.kv div span{letter-spacing:.06em;font-size:11px}
.tl:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--vino);left:-19px;top:10px;box-shadow:0 0 0 3px var(--hoja)}
.tl .tiny{font-family:var(--serif);font-style:normal}
.search input,select.f,input.f{border-radius:10px;border-color:var(--regla-2)}
.money{font-family:var(--serif);font-weight:700}
.bar{border-radius:999px;border:0;height:8px}
.bar i{border-radius:999px}
.cal{border-radius:12px;overflow:hidden}
.cal .n{font-family:var(--serif)}
.cal .d.today .n{border-radius:8px;width:24px}
.cal .fer{font-family:var(--serif);font-style:normal}
.cal-head h2{font-size:20px}
.portal .ic{border:0;background:var(--vino-suave);font-family:var(--serif);border-radius:12px}
.portal b{font-family:var(--serif)}

/* ventanas y formularios */
.modal{border-radius:18px;border-top:0;overflow:hidden}
.modal header{background:var(--hoja)}
.modal header h2{font-size:19px}
.form label{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--tinta-2)}
.form input:not([type=checkbox]),.form select,.form textarea{border:1px solid var(--regla-2);border-radius:10px;padding:9px 12px;background:var(--hoja);font-size:15px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--vino);box-shadow:0 0 0 3px var(--vino-suave)}
.form .hint{font-family:var(--serif);font-style:normal}
.toast{border-radius:12px;border-left:0}
.welcome{background:linear-gradient(120deg,var(--cab),var(--cab-2));border:0;color:#fff}
.welcome h2{color:#fff}
.welcome .muted,.welcome p,.welcome .tiny{color:rgba(255,255,255,.85)!important}
.welcome a{color:#fff}
.welcome .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.welcome .btn.pri{background:#fff;color:var(--cab);border-color:#fff}
.welcome input.f{background:rgba(255,255,255,.95);color:#1f1a1c}
.hoja-a4{border-radius:10px}
.titulo-edit{font-family:var(--serif)}
.modelo{border-top:0;border-left:4px solid var(--vino)}
.cat-titulo{letter-spacing:.08em;font-size:13px}
.tarjeta{border-radius:10px}
.tablero .col{border-radius:14px}
.ia-chat{border-radius:var(--r)}
.msg.yo .globo{border-radius:16px 16px 4px 16px;border:0}
.cuerpo h4{font-family:var(--serif)}
#crono{border-radius:999px}

/* equipo */
.persona{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c,#7a1f2e);color:#fff;font-size:9.5px;font-weight:700;vertical-align:middle;letter-spacing:0}
.persona.grande{width:44px;height:44px;font-size:15px;flex:none}
.equipo{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.equipo > .card + .card{margin-top:0}
.miembro{cursor:pointer}
.miembro .sumario{grid-template-columns:repeat(3,minmax(0,1fr))}
.miembro .sumario .stat{border-left:1px solid var(--regla)}
.miembro .sumario .stat:first-child{border-left:0}
.cab-sync{text-decoration:none}
.miembro:hover{border-color:var(--vino)}
.cab-yo.on{background:#fff;color:var(--cab)}

/* flujo del proceso */
.flujo{margin-top:18px}
.pasos-flujo{display:flex;gap:0;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.paso{flex:1 0 auto;min-width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;position:relative;padding:0 6px;color:var(--tinta-3);font-size:12px;font-weight:600}
.paso:before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:2px;background:var(--regla-2);z-index:0}
.paso:first-child:before{display:none}
.paso i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hoja);border:2px solid var(--regla-2);font-style:normal;font-size:12px;z-index:1;position:relative}
.paso i svg{width:14px;height:14px}
.paso span{text-align:center;max-width:110px;line-height:1.25}
.paso.hecho{color:var(--tinta-2)} .paso.hecho i{background:var(--vino);border-color:var(--vino);color:var(--sobre-vino)} .paso.hecho:before,.paso.actual:before{background:var(--vino)}
.paso.actual{color:var(--vino)} .paso.actual i{border-color:var(--vino);color:var(--vino);box-shadow:0 0 0 4px var(--vino-suave)}
.que-sigue{border-top:1px solid var(--regla);padding-top:12px}
.chip-ins.hito{border-radius:999px;padding:6px 12px;font-size:12.5px}
.chip-ins.hito b{color:var(--vino)}

/* subnavegación */
.subnav{display:inline-flex;gap:4px;background:var(--hoja);border:1px solid var(--regla);border-radius:12px;padding:4px;margin-bottom:18px;max-width:100%;overflow-x:auto}
.subnav a{padding:6px 14px;border-radius:9px;text-decoration:none;color:var(--tinta-2);font-weight:600;font-size:13.5px;white-space:nowrap}
.subnav a.on{background:var(--vino);color:var(--sobre-vino)}
.subnav a:not(.on):hover{color:var(--vino)}
.vb-col.doble{flex-direction:row;align-items:flex-end;justify-content:center;gap:3px}
.vb-col.doble i{width:34%;max-width:22px}
.vb-col.doble i.b2{background:var(--tinta-3);opacity:.6}
.vb:hover .vb-col.doble i.b2{opacity:.85}
.tarjeta .mover-p{margin-top:6px;width:100%;font-size:12px;padding:3px;border:1px solid var(--regla);background:var(--hoja-2);border-radius:6px}

/* portada nueva */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;padding:16px 18px}
.kpi:hover{border-color:var(--vino)}
.kpi .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--vino-suave);color:var(--vino)}
.kpi .ico svg{width:22px;height:22px}
.kpi .ico.az{background:var(--azul-suave);color:var(--azul)} .kpi .ico.am{background:var(--ambar-suave);color:var(--ambar)} .kpi .ico.ok{background:var(--ok-suave);color:var(--ok)} .kpi .ico.mo{background:var(--morado-suave);color:var(--morado)}
.kpi .v{font-size:24px;font-weight:750;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--tinta-2);font-weight:600}
.kpi .d{font-size:12px;color:var(--tinta-3)}
.kpi.alerta .v{color:var(--mal)}
.portada2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.portada2 > *{min-width:0}
.kpis > .card + .card{margin-top:0}
.kpi > span{min-width:0}
.portada2 > div > .card + .card{margin-top:18px}
.hoy-lista{display:flex;flex-direction:column}
.hoy-item{display:grid;grid-template-columns:54px 14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--regla);cursor:pointer}
.hoy-item:first-child{border-top:0}
.hoy-item .h{font-weight:700;font-variant-numeric:tabular-nums;color:var(--tinta-2);font-size:14px}
.hoy-item .p{width:10px;height:10px;border-radius:50%;background:var(--azul)}
.hoy-item .p.audiencia{background:var(--vino)} .hoy-item .p.plazo{background:var(--ambar)} .hoy-item .p.tarea{background:var(--azul)} .hoy-item .p.reunion{background:var(--morado)}
.hoy-item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoy-item .s{font-size:12.5px;color:var(--tinta-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoy-item.hecho .t{text-decoration:line-through;color:var(--tinta-3)}
.dia-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);margin:12px 0 2px}
.dia-t:first-child{margin-top:0}
.ia-rapida{display:flex;gap:8px}
.ia-rapida input{flex:1;min-width:0}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tinta-3)}
.leyenda i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

@media (max-width:1050px) and (min-width:901px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .cab-in{padding:10px 14px}
  .marca svg{width:34px;height:34px}
  .marca b{font-size:14px;letter-spacing:.03em}
  .cab-sync span{display:none}
  .pestanas{padding:0 6px}
  .pestanas a{padding:11px 10px 9px;font-size:13px;flex:0 0 auto}
  h1{font-size:23px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px;gap:10px}
  .kpi .ico{width:36px;height:36px;border-radius:10px}
  .kpi .v{font-size:20px}
  .portada2{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:18px;white-space:nowrap}
  .leyenda{display:none}
  .hoy-item{grid-template-columns:46px 12px minmax(0,1fr)}
  .hoy-item .end{display:none}
}

@page{size:A4;margin:2.5cm 2.5cm 2.5cm 3cm}
@media print{
  body{background:#fff;color:#000}
  .cab,main,.modal-bg,.toast{display:none!important}
  #imprimir{display:block;font:12px/1.45 Georgia,serif;color:#000}
  #imprimir h1{font-size:20px;margin-bottom:4px;letter-spacing:.08em}
  #imprimir table{width:100%;border-collapse:collapse;margin-top:12px}
  #imprimir th,#imprimir td{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left}
  #imprimir td.r,#imprimir th.r{text-align:right}
  #imprimir .tot{font-weight:bold;border-top:2px solid #000}
  #imprimir .escrito-print{white-space:pre-wrap;font:12pt/1.5 Arial,Helvetica,sans-serif;text-align:justify}
  #crono,#tip,#candado{display:none!important}
  #imprimir .hdr{display:flex;justify-content:space-between;border-bottom:3px double #7d1d2c;padding-bottom:8px;margin-bottom:12px}
}
</style>

/* =====================================================================

/* ---------- días inhábiles (Perú) ---------- */
function pascua(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
const _fer = {};
function feriados(y) {
  if (_fer[y]) return _fer[y];
  const m = new Map();
  const fijo = [['01-01', 'Año Nuevo'], ['05-01', 'Día del Trabajo'], ['06-07', 'Batalla de Arica'], ['06-29', 'San Pedro y San Pablo'],
    ['07-23', 'Día de la Fuerza Aérea'], ['07-28', 'Fiestas Patrias'], ['07-29', 'Fiestas Patrias'], ['08-06', 'Batalla de Junín'],
    ['08-30', 'Santa Rosa de Lima'], ['10-08', 'Combate de Angamos'], ['11-01', 'Todos los Santos'], ['12-08', 'Inmaculada Concepción'],
    ['12-09', 'Batalla de Ayacucho'], ['12-25', 'Navidad']];
  fijo.forEach(([md, n]) => m.set(`${y}-${md}`, n));
  const p = pascua(y);
  const jue = new Date(p); jue.setDate(p.getDate() - 3);
  const vie = new Date(p); vie.setDate(p.getDate() - 2);
  m.set(iso(jue), 'Jueves Santo'); m.set(iso(vie), 'Viernes Santo');
  return (_fer[y] = m);
}
function inhabil(s) {
  const d = parse(s);
  if (d.getDay() === 0 || d.getDay() === 6) return 'Fin de semana';
  const f = feriados(d.getFullYear()).get(s);
  if (f) return f;
  const x = DB.ajustes.inhabiles.find((i) => i.fecha === s);
  return x ? (x.motivo || 'Día inhábil') : '';
}
const nombreFeriado = (s) => { const f = feriados(parse(s).getFullYear()).get(s); if (f) return f; const x = DB.ajustes.inhabiles.find((i) => i.fecha === s); return x ? (x.motivo || 'Día inhábil') : ''; };
/* El plazo empieza a correr el día siguiente de la notificación y sólo cuenta días hábiles. */
function vencimientoHabiles(desde, n) {
  let d = desde, c = 0, guard = 0;
  while (c < n && guard++ < 2000) { d = sumar(d, 1); if (!inhabil(d)) c++; }
  return d;
}
function vencimientoNaturales(desde, n) {
  let d = sumar(desde, n), guard = 0;
  while (inhabil(d) && guard++ < 60) d = sumar(d, 1); // si vence en inhábil, pasa al siguiente hábil
  return d;
}

/* ---------- cálculos ---------- */
function saldo(filtro) {
  let cargo = 0, pagado = 0, honor = 0, gasto = 0;
  DB.movimientos.filter(filtro).forEach((m) => {
    if (m.tipo === 'pago') pagado += num(m.monto);
    else { cargo += num(m.monto); if (m.tipo === 'gasto') gasto += num(m.monto); else honor += num(m.monto); }
  });
  return { cargo, pagado, honor, gasto, pend: Math.round((cargo - pagado) * 100) / 100 };
}
const saldoCliente = (cid) => saldo((m) => m.clienteId === cid);
const saldoExp = (eid) => saldo((m) => m.expedienteId === eid);
function urg(ev) {
  if (ev.hecho) return '';
  const d = dias(hoy(), ev.fecha);
  if (d < 0) return 'bad';
  if (d <= 1) return 'bad';
  if (d <= 3) return 'warn';
  return '';
}
function cuando(f) {
  const d = dias(hoy(), f);
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  if (d === -1) return 'ayer';
  if (d < 0) return `hace ${-d} días`;
  return `en ${d} días`;
}
function caratula(e) {

/* ---------- agenda ---------- */
function vAgenda() {
  const [y, m] = estado.mes.split('-').map(Number);
  const primero = new Date(y, m - 1, 1);
  const off = (primero.getDay() + 6) % 7; // semana empieza en lunes

  evs.forEach((e) => (porDia[e.fecha] = porDia[e.fecha] || []).push(e));
  const h = hoy();
  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio); d.setDate(inicio.getDate() + i);
    const s = iso(d), lst = (porDia[s] || []).sort(ordenEv), fer = nombreFeriado(s), inh = inhabil(s);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    celdas += `<div class="d ${d.getMonth() !== m - 1 ? 'out' : ''} ${inh ? 'inh' : ''} ${s === h ? 'today' : ''} ${s === estado.diaSel ? 'sel' : ''}" data-act="dia" data-v="${s}">

      ${lst.slice(0, 3).map((e) => `<span class="ev ${e.tipo} ${e.hecho ? 'hecho' : ''}">${e.hora ? esc(e.hora) + ' ' : ''}${esc(e.titulo || TIPOS_EV[e.tipo])}</span>`).join('')}
      ${lst.length > 3 ? `<span class="tiny">+${lst.length - 3}</span>` : ''}
      <span class="dots">${lst.slice(0, 4).map((e) => `<i class="${e.tipo}"></i>`).join('')}</span></div>`;
  }
  let lista, titulo;
  if (estado.diaSel) {
    lista = (porDia[estado.diaSel] || []).sort(ordenEv);
    const f = nombreFeriado(estado.diaSel);
    titulo = fFechaL(estado.diaSel) + (f ? ` · ${f}` : '');
  } else {
    lista = evs.filter((e) => e.fecha.startsWith(estado.mes)).sort(ordenEv);
    titulo = `${MESL[m - 1]} ${y}`;
  }
  return `
  <div class="head"><div><h1>Agenda</h1><div class="sub">Audiencias, plazos, tareas y reuniones</div></div>
    <div class="actions"><button class="btn" data-act="calc">${icon('i-clock')} Calcular plazo</button><button class="btn hide-m" data-act="ics">Exportar a calendario</button><button class="btn pri" data-act="nuevoEvento" data-fecha="${estado.diaSel}">${icon('i-plus')} Nuevo</button></div></div>
  <div class="chips" style="margin-bottom:12px">${[['', 'Todo'], ['audiencia', 'Audiencias'], ['plazo', 'Plazos'], ['tarea', 'Tareas'], ['reunion', 'Reuniones']].map(([k, t]) => `<button class="chip ${estado.fTipo === k ? 'on' : ''}" data-act="fTipo" data-v="${k}">${t}</button>`).join('')}
    <button class="chip ${estado.verHechos ? 'on' : ''}" data-act="verHechos">Mostrar realizados</button>${yo() ? `<button class="chip ${estado.soloMio ? 'on' : ''}" data-act="soloMio">Sólo lo mío</button>` : ''}</div>
  <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start" id="ag">
    <div class="card"><div class="cal-head"><button class="btn sm ghost" data-act="mes" data-v="-1" aria-label="Mes anterior">${icon('i-left')}</button>
      <h2 style="margin:0">${MESL[m - 1]} ${y}</h2>

      <div class="cal">${['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].map((d) => `<div class="dow">${d}</div>`).join('')}${celdas}</div></div>

  const c = cliente(m.clienteId), e = expediente(m.expedienteId), pago = m.tipo === 'pago';

    <div class="end money ${pago ? 'pos' : ''}">${pago ? '+ ' : ''}${sol(m.monto)}</div></div>`;
}

let modalCb = null;
function abrirModal({ titulo, campos, valores = {}, guardar: alGuardar, borrar, extra = '', boton = 'Guardar' }) {
  cerrarModal();
  const html = campos.map((f) => {
    const v = valores[f.k] ?? f.def ?? '';
    const req = f.req ? ' required' : '';
    const lab = `${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}`;
    const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
    const cls = f.full ? 'full' : '';
    if (f.t === 'select') return `<label class="${cls}">${lab}<select name="${f.k}"${req}>${f.op.map((o) => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(txt)}</option>`; }).join('')}</select>${hint}</label>`;
    if (f.t === 'textarea') return `<label class="full">${lab}<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>${hint}</label>`;
    if (f.t === 'checkbox') return `<label class="cb ${cls}"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${lab}</label>`;
    return `<label class="${cls}">${lab}<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}"${req}${f.t === 'number' ? ' step="0.01" min="0" inputmode="decimal"' : ''}${f.list ? ` list="dl-${f.k}"` : ''}>${f.list ? `<datalist id="dl-${f.k}">${f.list.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}${hint}</label>`;
  }).join('');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<form class="modal" novalidate><header><h2>${esc(titulo)}</h2><button type="button" class="btn ghost sm" data-close aria-label="Cerrar">${icon('i-x')}</button></header>
    <div class="body"><div class="form">${html}</div>${extra}</div>
    <footer>${borrar ? `<button type="button" class="btn danger l" data-del>Eliminar</button>` : ''}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">${esc(boton)}</button></footer></form>`;
  document.body.appendChild(bg);
  const form = bg.querySelector('form');
  bg.addEventListener('mousedown', (ev) => { if (ev.target === bg) cerrarModal(); });
  bg.querySelectorAll('[data-close]').forEach((b) => b.onclick = cerrarModal);
  if (borrar) bg.querySelector('[data-del]').onclick = () => { if (borrar() !== false) cerrarModal(); };
  form.onsubmit = (ev) => {
    ev.preventDefault();
    const datos = {};
    for (const f of campos) {
      const el = form.elements[f.k];
      datos[f.k] = f.t === 'checkbox' ? el.checked : el.value.trim();
      if (f.req && !datos[f.k]) { el.focus(); toast(`Falta: ${f.l}`); return; }
      if (f.t === 'number' && f.req && !(num(datos[f.k]) > 0)) { el.focus(); toast(`${f.l}: escribe un monto mayor que cero`); return; }
    }
    if (alGuardar(datos, form) !== false) cerrarModal();
  };
  modalCb = bg;
  const primero = form.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
  if (primero && window.innerWidth > 900) setTimeout(() => primero.focus(), 30);
  return form;
}
function cerrarModal() { if (modalCb) { modalCb.remove(); modalCb = null; } }
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') cerrarModal();
  if (e.target && e.target.id === 'iaTexto' && e.key === 'Enter' && !e.shiftKey && window.innerWidth > 900) { e.preventDefault(); enviarIA(); return; }
  const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !escribiendo)) {
    e.preventDefault(); cerrarModal(); location.hash = '#/buscar'; setTimeout(() => { const q = $('#qGlobal'); if (q) { q.focus(); q.select(); } }, 30);
  }
});

function formCalc() {
  const form = abrirModal({
    titulo: 'Calculadora de plazos', boton: 'Agendar vencimiento',
    valores: { desde: hoy(), dias: 3, modo: 'habiles' },
    campos: [
      { k: 'frecuente', l: 'Plazo frecuente (opcional)', t: 'select', full: true, op: [['', '— Escribe los días a mano —'], ...PLAZOS_FREC.map(([t, n], i) => [String(i), `${t} · ${n} días`])] },
      { k: 'desde', l: 'Notificado el', t: 'date', req: true },
      { k: 'dias', l: 'Plazo (días)', t: 'number', req: true },
      { k: 'modo', l: 'Cómputo', t: 'select', op: [['habiles', 'Días hábiles'], ['naturales', 'Días calendario']], full: true },
      { k: 'expedienteId', l: 'Expediente (para agendar)', t: 'select', op: opExps(), full: true },
      { k: 'titulo', l: 'Descripción', full: true, def: 'Vence plazo', list: ['Vence plazo para apelar', 'Vence plazo para contestar', 'Vence plazo para absolver traslado', 'Vence plazo para subsanar'] },
    ],
    extra: `<div class="card" id="calcRes" style="margin-top:14px;background:var(--hoja-2);box-shadow:none"></div>
      <p class="tiny" style="margin-top:8px">Los plazos frecuentes son referenciales: confírmalos con la norma vigente y la resolución que te notificaron. El plazo corre desde el día siguiente de la notificación. Verifica siempre la norma aplicable y los días inhábiles de tu distrito judicial (agrégalos en Ajustes).</p>`,
    guardar: (d) => {
      const r = calcular(d);
      if (!r) return false;
      const ev = { id: uid(), tipo: 'plazo', hecho: false, creado: ahora(), fecha: r, hora: '', lugar: '', expedienteId: d.expedienteId, titulo: d.titulo || 'Vence plazo', notas: `Notificado el ${fFecha(d.desde)} · ${d.dias} días ${d.modo === 'habiles' ? 'hábiles' : 'calendario'}` };
      DB.eventos.push(ev); tocarExp(d.expedienteId); guardar(); toast('Vencimiento agendado: ' + fFecha(r)); reRender();
    },
  });
  const calcular = (d) => { const n = Math.floor(num(d.dias)); if (!d.desde || n < 1 || n > 3650) return null; return d.modo === 'habiles' ? vencimientoHabiles(d.desde, n) : vencimientoNaturales(d.desde, n); };
  const pintar = () => {
    const d = { desde: form.elements.desde.value, dias: form.elements.dias.value, modo: form.elements.modo.value };
    const r = calcular(d), box = $('#calcRes');
    if (!r) { box.innerHTML = '<span class="muted">Completa la fecha y el número de días.</span>'; return; }
    const saltos = [];
    for (let x = sumar(d.desde, 1); x <= r; x = sumar(x, 1)) { const f = nombreFeriado(x); if (f) saltos.push(`${fFecha(x)} (${f})`); }
    box.innerHTML = `<div class="tiny">VENCE EL</div><div style="font-size:22px;font-weight:700;font-family:Georgia,serif">${fFechaL(r)} de ${parse(r).getFullYear()}</div>
      <div class="small muted">${cuando(r)}${saltos.length ? ` · se saltaron: ${esc(saltos.join(', '))}` : ''}</div>`;
  };
  form.addEventListener('input', pintar);
  form.elements.frecuente.addEventListener('change', (ev) => {
    const p = PLAZOS_FREC[ev.target.value]; if (!p) return;
    form.elements.dias.value = p[1]; form.elements.modo.value = 'habiles'; form.elements.titulo.value = 'Vence: ' + p[0].replace(/ \(.*\)$/, '').toLowerCase(); pintar();
  });
  pintar();
}

function borrarExp(id) {
  const e = expediente(id); if (!e) return;
  const nE = DB.eventos.filter((v) => v.expedienteId === id).length, nM = DB.movimientos.filter((m) => m.expedienteId === id).length;
  if (!confirm(`¿Eliminar el expediente ${e.numero || caratula(e)}?\nTambién se borrarán ${nE} evento(s) de agenda.${nM ? `\nSus ${nM} movimiento(s) de honorarios se conservan en el cliente.` : ''}`)) return false;
  DB.expedientes = DB.expedientes.filter((x) => x.id !== id);
  DB.eventos = DB.eventos.filter((v) => v.expedienteId !== id);
  DB.movimientos.forEach((m) => { if (m.expedienteId === id) m.expedienteId = ''; });
  DB.cuotas.forEach((q) => { if (q.expedienteId === id) q.expedienteId = ''; });
  DB.horas = DB.horas.filter((h) => h.expedienteId !== id);
  DB.escritos = DB.escritos.filter((x) => x.expedienteId !== id);
  DB.archivos.filter((a) => a.expedienteId === id).forEach((a) => idbDel(a.id).catch(() => {}));
  DB.archivos = DB.archivos.filter((a) => a.expedienteId !== id);
  if (DB.timer && DB.timer.expedienteId === id) DB.timer = null;
  guardar(); cerrarModal(); toast('Expediente eliminado'); location.hash = '#/expedientes';
}
function borrarCliente(id) {
  const c = cliente(id); if (!c) return;
  const ex = expsDe(id), nM = DB.movimientos.filter((m) => m.clienteId === id).length;
  if (!confirm(`¿Eliminar a ${c.nombre}?\nSe borrarán también ${ex.length} expediente(s), su agenda y ${nM} movimiento(s) de honorarios.\nEsto no se puede deshacer.`)) return;
  const ids = new Set(ex.map((e) => e.id));
  DB.clientes = DB.clientes.filter((x) => x.id !== id);
  DB.expedientes = DB.expedientes.filter((e) => !ids.has(e.id));
  DB.eventos = DB.eventos.filter((v) => !ids.has(v.expedienteId));
  DB.movimientos = DB.movimientos.filter((m) => m.clienteId !== id);
  DB.cuotas = DB.cuotas.filter((q) => q.clienteId !== id);
  DB.horas = DB.horas.filter((h) => !ids.has(h.expedienteId));
  DB.escritos = DB.escritos.filter((x) => !ids.has(x.expedienteId));
  DB.archivos.filter((a) => ids.has(a.expedienteId)).forEach((a) => idbDel(a.id).catch(() => {}));
  DB.archivos = DB.archivos.filter((a) => !ids.has(a.expedienteId));
  if (DB.timer && ids.has(DB.timer.expedienteId)) DB.timer = null;
  guardar(); toast('Cliente eliminado'); location.hash = '#/clientes';
}

/* ---------- monto en letras (para recibos y contratos) ---------- */
function enLetras(n) {
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const cien = (x) => {
    if (!x) return '';
    if (x === 100) return 'cien';
    const c = Math.floor(x / 100), r = x % 100;
    const dec = r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' y ' + U[r % 10] : '');
    return [C[c], dec].filter(Boolean).join(' ');
  };
  const apocope = (s) => s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
  const mil = (x) => {
    const m = Math.floor(x / 1000), r = x % 1000;
    const a = m ? (m === 1 ? 'mil' : apocope(cien(m)) + ' mil') : '';
    return [a, cien(r)].filter(Boolean).join(' ');
  };
  const total = Math.round(Math.abs(Number(n) || 0) * 100), ent = Math.floor(total / 100), cent = total % 100;
  let s = 'cero';
  if (ent) {
    const mm = Math.floor(ent / 1e6), r = ent % 1e6;
    s = [mm ? (mm === 1 ? 'un millón' : apocope(mil(mm)) + ' millones') : '', mil(r)].filter(Boolean).join(' ');
  }
  return `${s} con ${pad(cent)}/100 soles`.toUpperCase();
}

/* ---------- documentos adjuntos (IndexedDB) ---------- */
let _idb = null;
function idb() {
  if (!_idb) _idb = new Promise((res, rej) => {
    const r = indexedDB.open('rr_documentos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('archivos');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _idb;
}
async function idbHacer(modo, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('archivos', modo), req = fn(t.objectStore('archivos'));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const idbPut = (id, blob) => idbHacer('readwrite', (s) => s.put(blob, id));
const idbGet = (id) => idbHacer('readonly', (s) => s.get(id));
const idbDel = (id) => idbHacer('readwrite', (s) => s.delete(id));
const tamano = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
async function subirArchivos(expId, files, silencioso) {
  let ok = 0;
  for (const f of files) {
    if (f.size > 40 * 1048576) { toast(`«${f.name}» pesa más de 40 MB; no se guardó`); continue; }
    const id = uid();
    try {
      await idbPut(id, f);
      DB.archivos.push({ id, expedienteId: expId, nombre: f.name, tipo: f.type || '', tam: f.size, fecha: hoy() });
      ok++;
    } catch (e) { toast('No se pudo guardar el documento: el aparato no tiene espacio o lo bloquea'); break; }
  }
  if (ok) { tocarExp(expId); guardar(); if (silencioso) return; reRender(); toast(ok === 1 ? 'Documento guardado' : `${ok} documentos guardados`); }
}
async function abrirArchivo(id) {
  const meta = DB.archivos.find((a) => a.id === id);
  const blob = meta && await idbGet(id).catch(() => null);
  if (!blob) { toast('El documento no está en este aparato (¿se cargó desde un respaldo sin documentos?)'); return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  if (!/^(application\/pdf|image\/|text\/)/.test(meta.tipo)) a.download = meta.nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const blobA64 = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(b); });
const a64ABlob = (s, tipo) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: tipo }); };
async function respaldoCompleto() {
  toast('Preparando el respaldo con documentos…');
  const docs = [];

/* ---------- conflicto de intereses ---------- */
const limpio = (s) => norm(s).replace(/[^a-z0-9 ]/g, ' ').replace(/\b(sac|saa|srl|eirl|sa|s a c|s a)\b/g, ' ').replace(/\s+/g, ' ').trim();
const digitos = (s) => String(s || '').replace(/\D/g, '');
function seParecen(a, b) {
  const x = limpio(a), y = limpio(b);
  if (!x || !y || x.length < 5 || y.length < 5) return false;
  return x === y || (x.length >= 8 && y.includes(x)) || (y.length >= 8 && x.includes(y));
}
function conflictosDeContraparte(contraparte, clienteId) {
  if (!contraparte) return [];
  const dig = digitos(contraparte);
  return DB.clientes.filter((c) => c.id !== clienteId && (seParecen(c.nombre, contraparte) || (dig.length >= 8 && digitos(c.documento) === dig)));
}
function conflictosDeCliente(c) {
  return DB.expedientes.filter((e) => e.clienteId !== c.id && e.contraparte && (seParecen(e.contraparte, c.nombre) || (digitos(c.documento).length >= 8 && digitos(e.contraparte).includes(digitos(c.documento)))));
}

async function hashPin(pin, sal) {
  const txt = sal + ':' + pin;
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < txt.length; i++) { const c = txt.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }

}

async function leerZip(buf, nombre) {

    }

}

    const nuevo = textoDe(final).replace(/^```[a-z]*\n?|\n?```$/g, '').trim();
    if (final.stop_reason !== 'end_turn' || !nuevo) throw new Error(final.stop_reason === 'refusal' ? 'La IA no pudo procesar este documento.' : 'La respuesta de la IA quedó incompleta. Vuelve a intentarlo.');
    p.textoAnterior = p.texto; p.texto = nuevo; guardar(); reRender(); toast('Marcas puestas. Revisa el resultado; puedes deshacer.');
  } catch (e) { toast(mensajeErrorIA(e)); reRender(); }
}

function barrasDobles(datos, fmt) {
  const max = Math.max(1, ...datos.flatMap((d) => [d.a, d.b]));
  const paso = Math.pow(10, Math.floor(Math.log10(max))), tope = Math.ceil(max / paso) * paso;
  return `<div class="vbars"><div class="vb-ejes">${[tope, tope / 2, 0].map((t) => `<span>${esc(fmt(t, true))}</span>`).join('')}</div>
    <div class="vb-area">${[0, 50, 100].map((y) => `<i class="vb-linea" style="bottom:${y}%"></i>`).join('')}
      ${datos.map((d) => `<div class="vb hov" data-tip="${esc(d.l)} · ingresos ${esc(fmt(d.a))} · gastos ${esc(fmt(d.b))} · utilidad ${esc(fmt(d.a - d.b))}"><div class="vb-col doble"><i style="height:${(d.a / tope) * 100}%"></i><i class="b2 ${d.proy ? 'proy' : ''}" style="height:${(d.b / tope) * 100}%"></i></div><span class="vb-et">${esc(d.c)}</span></div>`).join('')}</div></div>`;
}

  const atrasadas = DB.cuotas.filter((q) => !q.pagada && q.fecha < mes + '-01').reduce((s, q) => s + q.monto, 0);
  const fS = (v, c) => c && Math.abs(v) >= 1000 ? 'S/ ' + (v / 1000).toLocaleString('es-PE', { maximumFractionDigits: 1 }) + ' mil' : sol(v);
  const margen = act.a ? Math.round(((act.a - act.b) / act.a) * 100) : 0;
  return `${subnav(SUB_FINANZAS, 'flujo')}

    <form class="form" data-form="nubeEntrar"><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label>
      <label class="full">Tu nombre (sólo para crear cuenta)<input name="nombre" placeholder="Dr. José Rodríguez"></label>
      <div class="full actions"><button class="btn pri" name="modo" value="entrar">Entrar</button><button class="btn" name="modo" value="crear">Crear cuenta</button></div></form>
    <p class="tiny" style="margin:10px 0 0">Solo pueden entrar los correos que un administrador agregue en Equipo (la primera cuenta del proyecto es la administradora).</p>`;
  return `<div class="list"><div class="row" style="cursor:default"><div class="main"><div class="t">${esc(NUBE.sesion.email)} ${NUBE.admin ? '<span class="badge b-brand">administra</span>' : ''}</div><div class="s">${esc(c.url.replace(/^https?:\/\//, ''))} · ${NUBE.ultima ? 'sincronizado ' + new Date(NUBE.ultima).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }) : 'aún sin sincronizar'}${NUBE.msg ? ' · ' + esc(NUBE.msg) : ''}</div></div>
    <div class="end actions"><button class="btn sm pri" data-act="nubeSync">Sincronizar ahora</button><button class="btn sm" data-act="nubeSalir">Salir</button></div></div></div>
    <p class="tiny" style="margin:8px 0 0">${NUBE.admin ? 'Para dar acceso a alguien, agrégalo al equipo con su correo: podrá crear su cuenta y entrar. ' : ''}Los documentos adjuntos y la clave de la IA no se suben: quedan en cada aparato.</p>`;
}

/* ---------- varios ---------- */
let tToast;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(tToast); tToast = setTimeout(() => t.remove(), 2600);
}
function aplicarTema() {
  const t = DB.ajustes.tema;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
// Otro pestaña cambió los datos: recargar
window.addEventListener('storage', (e) => { if (e.key === CLAVE) { DB = cargar(); reRender(); } });

render();
if (NUBE.sesion) setTimeout(() => sincronizar('inicio'), 400);
if (DB.ajustes.pin) bloquear();
setTimeout(revisarAvisos, 3000);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
