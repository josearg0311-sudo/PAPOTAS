<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf2">
<title>Estudio Rodríguez y Rodríguez</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --papel:#f3ebe0; --hoja:#fffaf2; --hoja-2:#f8f0e4; --regla:#e3d5c3; --regla-2:#cdb89f;
  --tinta:#2b1d1a; --tinta-2:#6a5650; --tinta-3:#9a857c;
  --vino:#7d1d2c; --vino-2:#5e1420; --vino-suave:#f1dfdc; --oro:#a8824c; --sobre-vino:#fff8ef;
  --ok:#3d6b3f; --ok-suave:#e5ecd9; --ambar:#9a5b0e; --ambar-suave:#f6e6c9; --mal:#a3241b; --mal-suave:#f6dcd6; --azul:#35557a; --azul-suave:#e2e8ee;
  --sombra:0 1px 0 rgba(90,50,30,.06),0 10px 24px -14px rgba(90,40,20,.35);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#1d1512; --hoja:#271d19; --hoja-2:#2f2420; --regla:#433430; --regla-2:#5a4740;
    --tinta:#f2e7da; --tinta-2:#c8b6a8; --tinta-3:#93807a;
    --vino:#d77a84; --vino-2:#e6949c; --vino-suave:#40242a; --oro:#c9a46a; --sobre-vino:#1d1512;
    --ok:#9cc49a; --ok-suave:#26331f; --ambar:#e2ae5c; --ambar-suave:#3b2d17; --mal:#ec8b80; --mal-suave:#43231f; --azul:#9ab6d6; --azul-suave:#1f2a36;
    --sombra:0 10px 24px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#1d1512; --hoja:#271d19; --hoja-2:#2f2420; --regla:#433430; --regla-2:#5a4740;
  --tinta:#f2e7da; --tinta-2:#c8b6a8; --tinta-3:#93807a;
  --vino:#d77a84; --vino-2:#e6949c; --vino-suave:#40242a; --oro:#c9a46a; --sobre-vino:#1d1512;
  --ok:#9cc49a; --ok-suave:#26331f; --ambar:#e2ae5c; --ambar-suave:#3b2d17; --mal:#ec8b80; --mal-suave:#43231f; --azul:#9ab6d6; --azul-suave:#1f2a36;
  --sombra:0 10px 24px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--vino)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-family:var(--serif);font-weight:700}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:15px}
.muted{color:var(--tinta-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--tinta-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.02em}
.versal{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}

/* ---------- membrete y pestañas ---------- */
.cab{background:var(--hoja);border-bottom:1px solid var(--regla);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.cab:after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--vino) 0 70%,var(--oro) 70% 100%)}
.cab-in{max-width:1180px;margin:0 auto;padding:14px 28px 0;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tinta);flex:1;min-width:0}
.marca svg{width:46px;height:46px;flex:none}
.marca b{display:block;font-family:var(--serif);font-size:21px;letter-spacing:.12em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca b i{font-style:italic;letter-spacing:0;color:var(--vino);font-weight:400;padding:0 .1em}
.marca em{display:block;font-family:var(--serif);font-style:italic;color:var(--tinta-2);font-size:14px;margin-top:1px}
.cab-acc{display:flex;gap:4px}
.cab-acc a{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--tinta-2)}
.cab-acc a:hover,.cab-acc a.on{background:var(--vino-suave);color:var(--vino)}
.cab-acc svg{width:20px;height:20px}
.pestanas{max-width:1180px;margin:0 auto;padding:14px 28px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas a{display:flex;align-items:center;gap:7px;padding:9px 16px 8px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;text-decoration:none;color:var(--tinta-2);font-weight:600;font-size:14px;white-space:nowrap;position:relative;top:1px}
.pestanas a svg{width:17px;height:17px}
.pestanas a:hover{color:var(--vino)}
.pestanas a.on{background:var(--papel);border-color:var(--regla);color:var(--vino)}
.pestanas a.on:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--vino);border-radius:9px 9px 0 0}

main{padding:28px 28px 80px;max-width:1180px;margin:0 auto;width:100%;min-width:0;overflow-x:clip}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--regla)}
.head .sub{color:var(--tinta-2);font-size:14px;margin-top:6px;font-family:var(--serif);font-style:italic}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- hojas ---------- */
.card{background:var(--hoja);border:1px solid var(--regla);border-radius:4px;box-shadow:var(--sombra);padding:18px 20px}
.card + .card{margin-top:18px}
.grid > .card + .card{margin-top:0}
.grid > *{min-width:0}
.card h2{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px double var(--regla-2);border-bottom-width:3px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}

/* sumario tipo libro mayor */
.sumario{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:0}
.sumario .stat{padding:14px 18px;border-left:1px solid var(--regla)}
.sumario .stat:first-child{border-left:0}
.stat .k{font-size:10.5px;color:var(--tinta-3);text-transform:uppercase;letter-spacing:.18em;font-weight:700}
.stat .v{font-family:var(--serif);font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums lining-nums}
.stat .d{font-size:12px;color:var(--tinta-3);font-style:italic;font-family:var(--serif)}
.stat.alert .v{color:var(--mal)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--regla-2);background:var(--hoja);padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--tinta);white-space:nowrap;letter-spacing:.01em}
.btn:hover{border-color:var(--vino);color:var(--vino)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--vino);border-color:var(--vino);color:var(--sobre-vino)}
.btn.pri:hover{background:var(--vino-2);border-color:var(--vino-2);color:var(--sobre-vino)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--vino)}
.btn.danger{color:var(--mal);border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.wa{background:#246b45;border-color:#246b45;color:#fff}

/* renglones */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px dashed var(--regla-2);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover .t{color:var(--vino)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--tinta-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
/* hoja de calendario arrancable */
.datebox{width:44px;flex:none;text-align:center;border:1px solid var(--regla-2);border-radius:3px;background:var(--hoja);overflow:hidden}
.datebox span{display:block;background:var(--tinta-2);color:var(--hoja);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:1px 0;order:-1}
.datebox{display:flex;flex-direction:column}
.datebox b{display:block;font-family:var(--serif);font-size:20px;line-height:1.25;padding:1px 0 2px}
.datebox.bad{border-color:var(--mal)} .datebox.bad span{background:var(--mal)} .datebox.bad b{color:var(--mal)}
.datebox.warn{border-color:var(--ambar)} .datebox.warn span{background:var(--ambar)}
.inic{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--vino);color:var(--vino);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.04em}

.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:2px;color:var(--tinta-2);border:1px solid var(--regla-2);white-space:nowrap;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.b-ok{color:var(--ok);border-color:currentColor;background:var(--ok-suave)}
.b-warn{color:var(--ambar);border-color:currentColor;background:var(--ambar-suave)}
.b-bad{color:var(--mal);border-color:currentColor;background:var(--mal-suave)}
.b-info{color:var(--azul);border-color:currentColor;background:var(--azul-suave)}
.b-brand{color:var(--vino);border-color:currentColor;background:var(--vino-suave)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--regla-2);border-radius:3px;background:var(--hoja)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--tinta-3)}
select.f,input.f{padding:9px 10px;border:1px solid var(--regla-2);border-radius:3px;background:var(--hoja)}
.chips{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--regla)}
.chip{border:0;border-bottom:2px solid transparent;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--tinta-2);font-weight:600;margin-bottom:-1px}
.chip:hover{color:var(--vino)}
.chip.on{color:var(--vino);border-bottom-color:var(--vino)}

.empty{text-align:center;padding:30px 16px;color:var(--tinta-2);font-family:var(--serif);font-style:italic}
.empty svg{width:40px;height:40px;color:var(--regla-2);margin-bottom:8px}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 22px}
.kv div span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--tinta-3);font-weight:700;margin-bottom:2px}
.kv div b{font-weight:500;word-break:break-word}

.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--regla-2)}
.tl{position:relative;padding:4px 0 14px}
.tl:before{content:"§";position:absolute;left:-21px;top:4px;width:13px;height:16px;line-height:16px;text-align:center;font-family:var(--serif);font-weight:700;color:var(--vino);background:var(--hoja);font-size:13px}
.tl .x{float:right;opacity:.45;cursor:pointer;border:0;background:none;padding:0 4px}
.tl .x:hover{opacity:1;color:var(--mal)}
.tl .tiny{font-family:var(--serif);font-style:italic}
.inline-add{display:flex;gap:8px;margin-top:8px}
.inline-add input{flex:1;min-width:0}

.money{font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--serif);font-size:15.5px}
.pos{color:var(--ok)} .neg{color:var(--mal)}
.bar{height:6px;background:var(--hoja-2);overflow:hidden;border:1px solid var(--regla)}
.bar i{display:block;height:100%;background:var(--ok)}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{font-size:22px;border:0;padding:0;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--regla);border-left:1px solid var(--regla)}
.cal .dow{font-size:10.5px;text-align:center;color:var(--tinta-3);font-weight:700;text-transform:uppercase;letter-spacing:.14em;padding:6px 0;border-right:1px solid var(--regla);border-bottom:1px solid var(--regla);background:var(--hoja-2)}
.cal .d{min-height:74px;border-right:1px solid var(--regla);border-bottom:1px solid var(--regla);padding:4px 5px;cursor:pointer;background:var(--hoja);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d:hover{background:var(--vino-suave)}
.cal .d.out{color:var(--tinta-3);background:var(--hoja-2)}
.cal .d.out > *{opacity:.55}
.cal .d.inh{background:repeating-linear-gradient(135deg,var(--hoja) 0 6px,var(--hoja-2) 6px 12px)}
.cal .d.today .n{background:var(--vino);color:var(--sobre-vino);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--vino)}
.cal .n{font-family:var(--serif);font-size:14px;font-weight:700;align-self:flex-start}
.cal .ev{font-size:10.5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--azul);color:var(--azul);background:var(--azul-suave)}
.cal .ev.audiencia{border-color:var(--vino);color:var(--vino);background:var(--vino-suave)}
.cal .ev.plazo{border-color:var(--ambar);color:var(--ambar);background:var(--ambar-suave)}
.cal .ev.hecho{text-decoration:line-through;opacity:.6}
.cal .fer{font-size:9.5px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;font-family:var(--serif)}
.dots{display:none;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--azul)}
.dots i.audiencia{background:var(--vino)} .dots i.plazo{background:var(--ambar)}

.check{width:20px;height:20px;border-radius:2px;border:1.5px solid var(--tinta-3);flex:none;display:grid;place-items:center;background:var(--hoja);cursor:pointer;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:13px;height:13px}
.done .t{text-decoration:line-through;color:var(--tinta-3)}

.portal{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--tinta)}
.portal .ic{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--vino);color:var(--vino);display:grid;place-items:center;flex:none;font-weight:700;font-size:12px;font-family:var(--serif);letter-spacing:.04em}
.portal b{font-family:var(--serif);font-size:16px}
.portal:hover b{color:var(--vino)}

/* ---------- portada del despacho ---------- */
.portada{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:26px}
.cinta{display:inline-block;background:var(--vino);color:var(--sobre-vino);font-size:11.5px;letter-spacing:.26em;font-weight:700;padding:5px 14px 5px 16px;text-transform:uppercase;border-radius:2px}
.titular{font-size:44px;line-height:1.02;margin:14px 0 10px;letter-spacing:-.02em}
.titular em{color:var(--vino);font-style:normal}
.resumen{font-family:var(--serif);font-size:18px;color:var(--tinta-2);margin:0 0 16px;max-width:36em}
.resumen b{color:var(--tinta)}
.nota-papel{background:var(--hoja);padding:18px 20px;border:1px solid var(--regla);box-shadow:var(--sombra);transform:rotate(-1.2deg);position:relative}
.nota-papel:before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(168,130,76,.35);transform:rotate(2deg)}
.nota-papel .grande{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--vino);line-height:1;font-variant-numeric:lining-nums}
.nota-papel .linea{border-top:1px solid var(--regla-2);margin:10px 0 8px}
.firma{font-family:var(--serif);font-style:italic;color:var(--vino);font-size:17px;transform:rotate(-6deg);display:inline-block}
.fichas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.fichas > *{min-width:0}
.ficha{position:relative;margin-top:16px}
.ficha .lengueta{position:absolute;top:-17px;left:16px;background:var(--hoja);border:1px solid var(--regla);border-bottom:0;border-radius:6px 6px 0 0;padding:2px 12px;font-size:10.5px;letter-spacing:.2em;font-weight:700;color:var(--vino);text-transform:uppercase}
.ficha .dibujo{float:right;width:54px;height:54px;color:var(--vino);margin:-6px -4px 0 8px}
.ficha h2{border:0;padding:0;display:block}
.ficha .cuenta{font-family:var(--serif);font-style:italic;color:var(--tinta-2);font-size:14px;margin:2px 0 10px}

/* ---------- ventanas ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(40,20,15,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
.modal{background:var(--hoja);border-radius:4px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.35);border-top:4px solid var(--vino)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--regla);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal header h2{font-size:21px}
.modal .body{padding:18px 20px;overflow:auto}
.modal footer{padding:12px 20px;border-top:1px solid var(--regla);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--hoja-2)}
.modal footer .l{margin-right:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;font-weight:700;color:var(--tinta-2);letter-spacing:.16em;text-transform:uppercase}
.form label.cb{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px}
.form input:not([type=checkbox]),.form select,.form textarea{padding:8px 2px;border:0;border-bottom:1.5px solid var(--regla-2);border-radius:0;background:transparent;font-weight:400;color:var(--tinta);width:100%;font-size:15px;letter-spacing:0;text-transform:none}
.form select{padding-right:0}
.form textarea{min-height:80px;resize:vertical;border:1.5px solid var(--regla-2);padding:8px}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--vino)}
.search input:focus,input.f:focus,select.f:focus{outline:2px solid var(--vino);outline-offset:-1px}
.form .hint{font-weight:400;font-size:12px;color:var(--tinta-3);letter-spacing:0;text-transform:none;font-style:italic;font-family:var(--serif)}
.req{color:var(--mal)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:10px 16px;border-radius:3px;z-index:60;font-weight:500;box-shadow:var(--sombra);max-width:calc(100% - 32px);border-left:4px solid var(--oro)}

.welcome{background:var(--hoja);border:1px solid var(--regla);border-left:5px solid var(--vino);margin-bottom:24px}
.welcome h2{border:0;padding:0;font-size:22px}

#imprimir{display:none}

/* ---------- teléfono ---------- */
@media (max-width:1050px) and (min-width:901px){ .fichas{grid-template-columns:1fr 1fr} }
@media (max-width:900px){
  .cab-in{padding:10px 16px 0;gap:8px}
  .marca{gap:9px}
  .marca svg{width:36px;height:36px}
  .marca b{font-size:14.5px;letter-spacing:.03em;white-space:normal;line-height:1.15}
  .marca em{font-size:12.5px}
  .cab-acc a{width:34px;height:34px}
  .pestanas{padding:10px 8px 0;gap:0}
  .pestanas a{padding:8px 8px 7px;font-size:12.5px;flex:1 0 auto;justify-content:center}
  .pestanas a svg{display:none}
  main{padding:18px 16px calc(60px + env(safe-area-inset-bottom))}
  h1{font-size:25px}

<script>
'use strict';
/* =====================================================================
   Estudio Rodríguez y Rodríguez · gestión del estudio jurídico
   Todo vive en este archivo y los datos en el navegador (localStorage).
   ===================================================================== */

const CLAVE = 'causa_datos_v1';
const MARCA = 'Estudio Rodríguez y Rodríguez';
const VERSION = 1;

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => iso(new Date());
const parse = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const sumar = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dias = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
const MESL = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Setiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fFecha = (s) => { if (!s) return '—'; const d = parse(s); return `${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`; };
const fFechaL = (s) => { const d = parse(s); return `${['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][d.getDay()]} ${d.getDate()} de ${MESL[d.getMonth()].toLowerCase()}`; };
const nf = new Intl.NumberFormat('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sol = (n) => 'S/ ' + nf.format(Number(n) || 0);
const num = (v) => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const icon = (id) => `<svg><use href="#${id}"/></svg>`;

/* ---------- datos ---------- */
const VACIO = () => ({
  version: VERSION,
  clientes: [], expedientes: [], eventos: [], movimientos: [],
  ajustes: { estudio: MARCA, abogado: '', colegiatura: '', telefono: '', ruc: '', direccion: '', inhabiles: [], tema: 'auto' }
});
let DB = cargar();
function cargar() {
  try {
    const raw = localStorage.getItem(CLAVE);
    if (raw) return arreglar(JSON.parse(raw));
  } catch (e) { console.warn(e); }
  return VACIO();
}
function arreglar(d) {
  const base = VACIO();
  if (!d || typeof d !== 'object') return base;
  for (const k of ['clientes', 'expedientes', 'eventos', 'movimientos']) base[k] = Array.isArray(d[k]) ? d[k].filter((x) => x && x.id) : [];
  base.ajustes = Object.assign(base.ajustes, d.ajustes || {});
  if (!Array.isArray(base.ajustes.inhabiles)) base.ajustes.inhabiles = [];
  if (!String(base.ajustes.estudio || '').trim()) base.ajustes.estudio = MARCA;
  base.expedientes.forEach((e) => { if (!Array.isArray(e.actuaciones)) e.actuaciones = []; });
  return base;
}
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(DB)); }
  catch (e) { toast('No se pudo guardar: el almacenamiento del navegador está lleno o bloqueado.'); }
}
const cliente = (id) => DB.clientes.find((c) => c.id === id);
const expediente = (id) => DB.expedientes.find((e) => e.id === id);
const expsDe = (cid) => DB.expedientes.filter((e) => e.clienteId === cid);

/* ---------- catálogos ---------- */
const MATERIAS = ['Civil', 'Penal', 'Laboral', 'Familia', 'Constitucional', 'Contencioso administrativo', 'Comercial', 'Tributario', 'Administrativo', 'Arbitraje', 'Otro'];
const ESTADOS = ['En trámite', 'Por presentar', 'En calificación', 'Sentenciado', 'Apelación', 'Casación', 'Ejecución', 'Conciliado', 'Archivado'];
const ESTADO_COLOR = { 'En trámite': 'b-info', 'Por presentar': 'b-warn', 'En calificación': 'b-warn', 'Sentenciado': 'b-brand', 'Apelación': 'b-brand', 'Casación': 'b-brand', 'Ejecución': 'b-ok', 'Conciliado': 'b-ok', 'Archivado': '' };
const CERRADOS = ['Archivado', 'Conciliado'];
const TIPOS_EV = { audiencia: 'Audiencia', plazo: 'Plazo', tarea: 'Tarea', reunion: 'Reunión' };
const TIPOS_MOV = { honorario: 'Honorario pactado', gasto: 'Gasto / tasa', pago: 'Pago recibido' };
const MEDIOS = ['Efectivo', 'Transferencia', 'Yape', 'Plin', 'Depósito', 'Cheque', 'Otro'];

/* ---------- días inhábiles (Perú) ---------- */
function pascua(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
const _fer = {};
function feriados(y) {
  if (_fer[y]) return _fer[y];
  const m = new Map();
  const fijo = [['01-01', 'Año Nuevo'], ['05-01', 'Día del Trabajo'], ['06-07', 'Batalla de Arica'], ['06-29', 'San Pedro y San Pablo'],
    ['07-23', 'Día de la Fuerza Aérea'], ['07-28', 'Fiestas Patrias'], ['07-29', 'Fiestas Patrias'], ['08-06', 'Batalla de Junín'],
    ['08-30', 'Santa Rosa de Lima'], ['10-08', 'Combate de Angamos'], ['11-01', 'Todos los Santos'], ['12-08', 'Inmaculada Concepción'],
    ['12-09', 'Batalla de Ayacucho'], ['12-25', 'Navidad']];
  fijo.forEach(([md, n]) => m.set(`${y}-${md}`, n));
  const p = pascua(y);
  const jue = new Date(p); jue.setDate(p.getDate() - 3);
  const vie = new Date(p); vie.setDate(p.getDate() - 2);
  m.set(iso(jue), 'Jueves Santo'); m.set(iso(vie), 'Viernes Santo');
  return (_fer[y] = m);
}
function inhabil(s) {
  const d = parse(s);
  if (d.getDay() === 0 || d.getDay() === 6) return 'Fin de semana';
  const f = feriados(d.getFullYear()).get(s);
  if (f) return f;
  const x = DB.ajustes.inhabiles.find((i) => i.fecha === s);
  return x ? (x.motivo || 'Día inhábil') : '';
}
const nombreFeriado = (s) => { const f = feriados(parse(s).getFullYear()).get(s); if (f) return f; const x = DB.ajustes.inhabiles.find((i) => i.fecha === s); return x ? (x.motivo || 'Día inhábil') : ''; };
/* El plazo empieza a correr el día siguiente de la notificación y sólo cuenta días hábiles. */
function vencimientoHabiles(desde, n) {
  let d = desde, c = 0, guard = 0;
  while (c < n && guard++ < 2000) { d = sumar(d, 1); if (!inhabil(d)) c++; }
  return d;
}
function vencimientoNaturales(desde, n) {
  let d = sumar(desde, n), guard = 0;
  while (inhabil(d) && guard++ < 60) d = sumar(d, 1); // si vence en inhábil, pasa al siguiente hábil
  return d;
}

/* ---------- cálculos ---------- */
function saldo(filtro) {
  let cargo = 0, pagado = 0, honor = 0, gasto = 0;
  DB.movimientos.filter(filtro).forEach((m) => {
    if (m.tipo === 'pago') pagado += num(m.monto);
    else { cargo += num(m.monto); if (m.tipo === 'gasto') gasto += num(m.monto); else honor += num(m.monto); }
  });
  return { cargo, pagado, honor, gasto, pend: Math.round((cargo - pagado) * 100) / 100 };
}
const saldoCliente = (cid) => saldo((m) => m.clienteId === cid);
const saldoExp = (eid) => saldo((m) => m.expedienteId === eid);
function urg(ev) {
  if (ev.hecho) return '';
  const d = dias(hoy(), ev.fecha);
  if (d < 0) return 'bad';
  if (d <= 1) return 'bad';
  if (d <= 3) return 'warn';
  return '';
}
function cuando(f) {
  const d = dias(hoy(), f);
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  if (d === -1) return 'ayer';
  if (d < 0) return `hace ${-d} días`;
  return `en ${d} días`;
}
function caratula(e) {
  const c = cliente(e.clienteId);
  return [c ? c.nombre : '', e.contraparte].filter(Boolean).join(' vs. ') || e.materia || 'Expediente';
}
const ordenEv = (a, b) => (a.fecha + (a.hora || '99')).localeCompare(b.fecha + (b.hora || '99'));

/* ---------- navegación ---------- */
const NAV = [
  ['inicio', 'Inicio', 'i-home'],
  ['clientes', 'Clientes', 'i-users'],
  ['expedientes', 'Expedientes', 'i-folder'],
  ['agenda', 'Agenda', 'i-cal'],
  ['honorarios', 'Honorarios', 'i-money'],
];
function pintarNav(ruta) {
  const base = { cliente: 'clientes', expediente: 'expedientes' }[ruta] ?? ruta;
  $('#nav').innerHTML = NAV.map(([k, t, i]) => `<a href="#/${k}" class="${k === base ? 'on' : ''}">${icon(i)}<span>${t}</span></a>`).join('');
  document.querySelectorAll('.cab-acc a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#/' + base));
  const on = $('#nav a.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

let estado = { qCli: '', qExp: '', fEstado: 'activos', fMateria: '', mes: hoy().slice(0, 7), diaSel: '', fTipo: '', verHechos: false, fMov: '' };

function render() {
  const [ruta, id] = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/');
  pintarNav(ruta);
  const vistas = { inicio: vInicio, clientes: vClientes, cliente: vCliente, expedientes: vExpedientes, expediente: vExpediente, agenda: vAgenda, honorarios: vHonorarios, portales: vPortales, ajustes: vAjustes, buscar: vBuscar };
  const v = vistas[ruta] || vInicio;
  $('#main').innerHTML = v(id ? decodeURIComponent(id) : '');
  aplicarTema();
}
function reRender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

/* ===================================================================
   VISTAS
   =================================================================== */
function vInicio() {
  const h = hoy();
  const activos = DB.expedientes.filter((e) => !CERRADOS.includes(e.estado));
  const pend = DB.eventos.filter((e) => !e.hecho);
  const vencidos = pend.filter((e) => e.fecha < h).sort(ordenEv);
  const en = (e, n) => e.fecha >= h && e.fecha <= sumar(h, n);
  const aud7 = pend.filter((e) => e.tipo === 'audiencia' && en(e, 7)).length;
  const pla7 = pend.filter((e) => e.tipo === 'plazo' && en(e, 7)).length;
  const auds = pend.filter((e) => e.tipo === 'audiencia' && en(e, 30)).sort(ordenEv);
  const otros = pend.filter((e) => e.tipo !== 'audiencia' && en(e, 14)).sort(ordenEv);
  const total = saldo(() => true);
  const deudores = DB.clientes.map((c) => ({ c, s: saldoCliente(c.id) })).filter((x) => x.s.pend > 0.004).sort((a, b) => b.s.pend - a.s.pend);
  const nombre = String(DB.ajustes.abogado || '').replace(/^(dra?|abog|lic)\.?\s+/i, '').split(' ')[0];
  const hora = new Date().getHours();
  const saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';
  const pl = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  let frase = aud7 || pla7
    ? `Esta semana tienes ${[aud7 && `<b>${pl(aud7, 'audiencia', 'audiencias')}</b>`, pla7 && `<b>${pl(pla7, 'plazo', 'plazos')}</b> por vencer`].filter(Boolean).join(' y ')}.`
    : 'Esta semana no tienes audiencias ni plazos por vencer.';
  if (vencidos.length) frase += ` <b class="neg">${pl(vencidos.length, 'pendiente quedó', 'pendientes quedaron')} atrás sin marcar.</b>`;
  const vacio = !DB.clientes.length && !DB.expedientes.length;
  return `
  ${vacio ? `<div class="card welcome"><h2>Bienvenido al Estudio Rodríguez y Rodríguez</h2>
    <p class="muted" style="font-family:var(--serif);font-size:16px">Clientes, expedientes, audiencias, plazos y honorarios en un solo cuaderno. Todo se guarda en este aparato; puedes descargar un respaldo cuando quieras.</p>
    <div class="actions"><button class="btn pri" data-act="nuevoCliente">Registrar el primer cliente</button><button class="btn" data-act="ejemplo">Ver con datos de ejemplo</button></div></div>` : ''}
  <section class="portada">
    <div>
      <span class="cinta">Despacho · ${esc(fFechaL(h))}</span>
      <h1 class="titular">${saludo}${nombre ? `, <em>${esc(nombre)}</em>` : ''}.</h1>
      <p class="resumen">${frase}</p>
      <div class="actions"><button class="btn pri" data-act="nuevoEvento">${icon('i-plus')} Audiencia o plazo</button><button class="btn" data-act="nuevoExp">${icon('i-plus')} Expediente</button><button class="btn" data-act="calc">${icon('i-clock')} Calcular plazo</button></div>
    </div>
    <a class="nota-papel" href="#/honorarios" style="text-decoration:none;color:inherit;display:block">
      <div class="versal muted">Por cobrar</div>
      <div class="grande">${sol(total.pend)}</div>
      <div class="linea"></div>
      <div class="small muted">Cobrado <b>${sol(total.pagado)}</b> · ${pl(activos.length, 'expediente activo', 'expedientes activos')}</div>
      <div style="text-align:right;margin-top:8px"><span class="firma">Rodríguez y Rodríguez</span></div>
    </a>
  </section>
  <div class="fichas">
    <div class="card ficha"><span class="lengueta">Audiencias</span><svg class="dibujo"><use href="#d-cal"/></svg>
      <h2>Próximas audiencias</h2><div class="cuenta">${auds.length ? pl(auds.length, 'en los próximos 30 días', 'en los próximos 30 días') : 'Ninguna en los próximos 30 días'}</div>
      <div class="list" style="clear:both">${auds.slice(0, 6).map((e) => filaEvento(e)).join('')}</div>
      <a class="btn ghost sm" href="#/agenda" style="margin-top:6px;padding-left:0">Ver agenda completa →</a></div>
    <div class="card ficha"><span class="lengueta">Plazos</span><svg class="dibujo"><use href="#d-reloj"/></svg>
      <h2>Plazos y tareas</h2><div class="cuenta">${vencidos.length ? `<span class="neg">${pl(vencidos.length, 'atrasado', 'atrasados')}</span> · ` : ''}${otros.length ? pl(otros.length, 'en dos semanas', 'en dos semanas') : 'Nada en dos semanas'}</div>
      <div class="list" style="clear:both">${[...vencidos, ...otros].slice(0, 7).map((e) => filaEvento(e)).join('')}</div>

      <button class="btn ghost sm" data-act="nuevoMov" data-tipo="pago" style="margin-top:6px;padding-left:0">Registrar un pago →</button></div>
  </div>`;
}

function filaEvento(ev, conExp = true) {

/* ---------- agenda ---------- */
function vAgenda() {
  const [y, m] = estado.mes.split('-').map(Number);
  const primero = new Date(y, m - 1, 1);
  const off = (primero.getDay() + 6) % 7; // semana empieza en lunes
  const inicio = new Date(y, m - 1, 1 - off);
  const evs = DB.eventos.filter((e) => (estado.verHechos || !e.hecho) && (!estado.fTipo || e.tipo === estado.fTipo));
  const porDia = {};
  evs.forEach((e) => (porDia[e.fecha] = porDia[e.fecha] || []).push(e));
  const h = hoy();
  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio); d.setDate(inicio.getDate() + i);
    const s = iso(d), lst = (porDia[s] || []).sort(ordenEv), fer = nombreFeriado(s), inh = inhabil(s);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    celdas += `<div class="d ${d.getMonth() !== m - 1 ? 'out' : ''} ${inh ? 'inh' : ''} ${s === h ? 'today' : ''} ${s === estado.diaSel ? 'sel' : ''}" data-act="dia" data-v="${s}">
      <span class="n">${d.getDate()}</span>${fer ? `<span class="fer">${esc(fer)}</span>` : ''}
      ${lst.slice(0, 3).map((e) => `<span class="ev ${e.tipo} ${e.hecho ? 'hecho' : ''}">${e.hora ? esc(e.hora) + ' ' : ''}${esc(e.titulo || TIPOS_EV[e.tipo])}</span>`).join('')}
      ${lst.length > 3 ? `<span class="tiny">+${lst.length - 3}</span>` : ''}
      <span class="dots">${lst.slice(0, 4).map((e) => `<i class="${e.tipo}"></i>`).join('')}</span></div>`;
  }
  let lista, titulo;
  if (estado.diaSel) {
    lista = (porDia[estado.diaSel] || []).sort(ordenEv);
    const f = nombreFeriado(estado.diaSel);
    titulo = fFechaL(estado.diaSel) + (f ? ` · ${f}` : '');
  } else {
    lista = evs.filter((e) => e.fecha.startsWith(estado.mes)).sort(ordenEv);
    titulo = `${MESL[m - 1]} ${y}`;
  }
  return `
  <div class="head"><div><h1>Agenda</h1><div class="sub">Audiencias, plazos, tareas y reuniones</div></div>
    <div class="actions"><button class="btn" data-act="calc">${icon('i-clock')} Calcular plazo</button><button class="btn hide-m" data-act="ics">Exportar a calendario</button><button class="btn pri" data-act="nuevoEvento" data-fecha="${estado.diaSel}">${icon('i-plus')} Nuevo</button></div></div>
  <div class="chips" style="margin-bottom:12px">${[['', 'Todo'], ['audiencia', 'Audiencias'], ['plazo', 'Plazos'], ['tarea', 'Tareas'], ['reunion', 'Reuniones']].map(([k, t]) => `<button class="chip ${estado.fTipo === k ? 'on' : ''}" data-act="fTipo" data-v="${k}">${t}</button>`).join('')}
    <button class="chip ${estado.verHechos ? 'on' : ''}" data-act="verHechos">Mostrar realizados</button></div>
  <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start" id="ag">
    <div class="card"><div class="cal-head"><button class="btn sm ghost" data-act="mes" data-v="-1" aria-label="Mes anterior">${icon('i-left')}</button>

let modalCb = null;
function abrirModal({ titulo, campos, valores = {}, guardar: alGuardar, borrar, extra = '', boton = 'Guardar' }) {
  cerrarModal();
  const html = campos.map((f) => {
    const v = valores[f.k] ?? f.def ?? '';
    const req = f.req ? ' required' : '';
    const lab = `${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}`;
    const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
    const cls = f.full ? 'full' : '';
    if (f.t === 'select') return `<label class="${cls}">${lab}<select name="${f.k}"${req}>${f.op.map((o) => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(txt)}</option>`; }).join('')}</select>${hint}</label>`;
    if (f.t === 'textarea') return `<label class="full">${lab}<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>${hint}</label>`;
    if (f.t === 'checkbox') return `<label class="cb ${cls}"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${lab}</label>`;
    return `<label class="${cls}">${lab}<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}"${req}${f.t === 'number' ? ' step="0.01" min="0" inputmode="decimal"' : ''}${f.list ? ` list="dl-${f.k}"` : ''}>${f.list ? `<datalist id="dl-${f.k}">${f.list.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}${hint}</label>`;
  }).join('');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<form class="modal" novalidate><header><h2>${esc(titulo)}</h2><button type="button" class="btn ghost sm" data-close aria-label="Cerrar">${icon('i-x')}</button></header>
    <div class="body"><div class="form">${html}</div>${extra}</div>
    <footer>${borrar ? `<button type="button" class="btn danger l" data-del>Eliminar</button>` : ''}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">${esc(boton)}</button></footer></form>`;
  document.body.appendChild(bg);
  const form = bg.querySelector('form');
  bg.addEventListener('mousedown', (ev) => { if (ev.target === bg) cerrarModal(); });
  bg.querySelectorAll('[data-close]').forEach((b) => b.onclick = cerrarModal);
  if (borrar) bg.querySelector('[data-del]').onclick = () => { if (borrar() !== false) cerrarModal(); };
  form.onsubmit = (ev) => {
    ev.preventDefault();
    const datos = {};
    for (const f of campos) {
      const el = form.elements[f.k];
      datos[f.k] = f.t === 'checkbox' ? el.checked : el.value.trim();
      if (f.req && !datos[f.k]) { el.focus(); toast(`Falta: ${f.l}`); return; }
      if (f.t === 'number' && f.req && !(num(datos[f.k]) > 0)) { el.focus(); toast(`${f.l}: escribe un monto mayor que cero`); return; }
    }
    if (alGuardar(datos, form) !== false) cerrarModal();
  };
  modalCb = bg;
  const primero = form.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
  if (primero && window.innerWidth > 900) setTimeout(() => primero.focus(), 30);
  return form;
}

function formCalc() {
  const form = abrirModal({

      { k: 'expedienteId', l: 'Expediente (para agendar)', t: 'select', op: opExps(), full: true },
      { k: 'titulo', l: 'Descripción', full: true, def: 'Vence plazo', list: ['Vence plazo para apelar', 'Vence plazo para contestar', 'Vence plazo para absolver traslado', 'Vence plazo para subsanar'] },

    guardar: (d) => {
      const r = calcular(d);
      if (!r) return false;
      const ev = { id: uid(), tipo: 'plazo', hecho: false, creado: ahora(), fecha: r, hora: '', lugar: '', expedienteId: d.expedienteId, titulo: d.titulo || 'Vence plazo', notas: `Notificado el ${fFecha(d.desde)} · ${d.dias} días ${d.modo === 'habiles' ? 'hábiles' : 'calendario'}` };
      DB.eventos.push(ev); tocarExp(d.expedienteId); guardar(); toast('Vencimiento agendado: ' + fFecha(r)); reRender();
    },
  });
  const calcular = (d) => { const n = Math.floor(num(d.dias)); if (!d.desde || n < 1 || n > 3650) return null; return d.modo === 'habiles' ? vencimientoHabiles(d.desde, n) : vencimientoNaturales(d.desde, n); };
  const pintar = () => {
    const d = { desde: form.elements.desde.value, dias: form.elements.dias.value, modo: form.elements.modo.value };
    const r = calcular(d), box = $('#calcRes');
    if (!r) { box.innerHTML = '<span class="muted">Completa la fecha y el número de días.</span>'; return; }
    const saltos = [];
    for (let x = sumar(d.desde, 1); x <= r; x = sumar(x, 1)) { const f = nombreFeriado(x); if (f) saltos.push(`${fFecha(x)} (${f})`); }
    box.innerHTML = `<div class="tiny">VENCE EL</div><div style="font-size:22px;font-weight:700;font-family:Georgia,serif">${fFechaL(r)} de ${parse(r).getFullYear()}</div>
      <div class="small muted">${cuando(r)}${saltos.length ? ` · se saltaron: ${esc(saltos.join(', '))}` : ''}</div>`;
  };
  form.addEventListener('input', pintar);
  pintar();
}

function borrarExp(id) {
  const e = expediente(id); if (!e) return;
  const nE = DB.eventos.filter((v) => v.expedienteId === id).length, nM = DB.movimientos.filter((m) => m.expedienteId === id).length;
  if (!confirm(`¿Eliminar el expediente ${e.numero || caratula(e)}?\nTambién se borrarán ${nE} evento(s) de agenda.${nM ? `\nSus ${nM} movimiento(s) de honorarios se conservan en el cliente.` : ''}`)) return false;
  DB.expedientes = DB.expedientes.filter((x) => x.id !== id);
  DB.eventos = DB.eventos.filter((v) => v.expedienteId !== id);
  DB.movimientos.forEach((m) => { if (m.expedienteId === id) m.expedienteId = ''; });
  guardar(); cerrarModal(); toast('Expediente eliminado'); location.hash = '#/expedientes';
}
function borrarCliente(id) {
  const c = cliente(id); if (!c) return;
  const ex = expsDe(id), nM = DB.movimientos.filter((m) => m.clienteId === id).length;
  if (!confirm(`¿Eliminar a ${c.nombre}?\nSe borrarán también ${ex.length} expediente(s), su agenda y ${nM} movimiento(s) de honorarios.\nEsto no se puede deshacer.`)) return;
  const ids = new Set(ex.map((e) => e.id));
  DB.clientes = DB.clientes.filter((x) => x.id !== id);
  DB.expedientes = DB.expedientes.filter((e) => !ids.has(e.id));
  DB.eventos = DB.eventos.filter((v) => !ids.has(v.expedienteId));
  DB.movimientos = DB.movimientos.filter((m) => m.clienteId !== id);
  guardar(); toast('Cliente eliminado'); location.hash = '#/clientes';
}

function descargar(nombre, contenido, tipo) {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function cargarRespaldo(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const d = j && j.app === 'causa' ? j.datos : j;
      if (!d || !Array.isArray(d.clientes)) throw new Error('formato');
      const nuevo = arreglar(d);
      if (!confirm(`El respaldo tiene ${nuevo.clientes.length} cliente(s) y ${nuevo.expedientes.length} expediente(s).\nReemplazará los datos de este aparato. ¿Continuar?`)) return;
      DB = nuevo; guardar(); render(); toast('Respaldo cargado');
    } catch { toast('Ese archivo no es un respaldo del estudio'); }
  };
  r.readAsText(file);
}
function exportarCSV() {

  const ag = tabla(['Fecha', 'Hora', 'Tipo', 'Descripción', 'Expediente', 'Lugar', 'Realizado'],
    DB.eventos.slice().sort(ordenEv).map((v) => [v.fecha, v.hora, TIPOS_EV[v.tipo], v.titulo, (expediente(v.expedienteId) || {}).numero, v.lugar, v.hecho ? 'Sí' : 'No']));
  const cli = tabla(['Nombre', 'Tipo', 'Documento', 'Teléfono', 'Correo', 'Dirección', 'Saldo'],
    DB.clientes.map((c) => [c.nombre, c.tipo, c.documento, c.telefono, c.email, c.direccion, saldoCliente(c.id).pend.toFixed(2)]));
  const bom = '﻿';
  descargar(`rodriguez-expedientes-${hoy()}.csv`, bom + exp, 'text/csv');
  setTimeout(() => descargar(`rodriguez-honorarios-${hoy()}.csv`, bom + mov, 'text/csv'), 300);

function exportarICS() {
  const evs = DB.eventos.filter((v) => !v.hecho && v.fecha >= sumar(hoy(), -30));
  if (!evs.length) { toast('No hay eventos pendientes para exportar'); return; }
  const tx = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Estudio Rodriguez y Rodriguez//Agenda//ES', 'CALSCALE:GREGORIAN'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  evs.forEach((v) => {
    const e = expediente(v.expedienteId), d = v.fecha.replace(/-/g, '');
    L.push('BEGIN:VEVENT', `UID:${v.id}@causa`, `DTSTAMP:${stamp}`);
    if (v.hora) { const [h, m] = v.hora.split(':'); const fin = new Date(parse(v.fecha).setHours(+h + 1, +m)); L.push(`DTSTART:${d}T${h}${m}00`, `DTEND:${iso(fin).replace(/-/g, '')}T${pad(fin.getHours())}${pad(fin.getMinutes())}00`); }
    else L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${sumar(v.fecha, 1).replace(/-/g, '')}`);
    L.push(`SUMMARY:${tx(`[${TIPOS_EV[v.tipo]}] ${v.titulo || ''}`)}`);
    if (v.lugar) L.push(`LOCATION:${tx(v.lugar)}`);
    L.push(`DESCRIPTION:${tx([e ? `Expediente ${e.numero || ''} · ${caratula(e)}` : '', v.notas].filter(Boolean).join('\n'))}`);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Recordatorio', 'TRIGGER:-P1D', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  descargar(`rodriguez-agenda-${hoy()}.ics`, L.join('\r\n'), 'text/calendar');
  toast(`${evs.length} evento(s) exportados. Ábrelo con Google Calendar o el calendario del celular.`);
}

  const mv = (o) => Object.assign({ id: uid(), creado: ahora(), medio: '' }, o);

  DB.clientes.push(cA, cB, cC); DB.expedientes.push(e1, e2, e3, e4); DB.eventos.push(...eventos); DB.movimientos.push(...movs);
  guardar(); toast('Datos de ejemplo cargados'); location.hash = '#/inicio'; render();
}

/* ---------- varios ---------- */
let tToast;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(tToast); tToast = setTimeout(() => t.remove(), 2600);
}
function aplicarTema() {
  const t = DB.ajustes.tema;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
// Otro pestaña cambió los datos: recargar
window.addEventListener('storage', (e) => { if (e.key === CLAVE) { DB = cargar(); reRender(); } });

render();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
