<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<title>Estudio Rodríguez y Rodríguez</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f3f1; --panel:#ffffff; --panel-2:#fbf8f6; --line:#e8dfdb; --ink:#231b1c; --ink-2:#5f5354; --ink-3:#8d8182;
  --brand:#7a1f2b; --brand-2:#9b2c3b; --brand-soft:#f6e7e9; --on-brand:#fff;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#a46200; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe5e3; --info:#2d5b9a; --info-soft:#e5edf8;
  --shadow:0 1px 2px rgba(40,20,20,.06),0 6px 18px rgba(40,20,20,.06);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161213; --panel:#1f1a1b; --panel-2:#252021; --line:#3a3133; --ink:#f3ecea; --ink-2:#c3b6b5; --ink-3:#8f8382;
    --brand:#c8505f; --brand-2:#d9707d; --brand-soft:#3a2125; --on-brand:#fff;
    --ok:#5cc28d; --ok-soft:#1c3328; --warn:#e6a64a; --warn-soft:#3a2d17; --bad:#ef7a70; --bad-soft:#3d1f1d; --info:#7fa8e0; --info-soft:#1d2a3d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161213; --panel:#1f1a1b; --panel-2:#252021; --line:#3a3133; --ink:#f3ecea; --ink-2:#c3b6b5; --ink-3:#8f8382;
  --brand:#c8505f; --brand-2:#d9707d; --brand-soft:#3a2125; --on-brand:#fff;
  --ok:#5cc28d; --ok-soft:#1c3328; --warn:#e6a64a; --warn-soft:#3a2d17; --bad:#ef7a70; --bad-soft:#3d1f1d; --info:#7fa8e0; --info-soft:#1d2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em}
h2{font-size:16px}
h3{font-size:14px}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}

/* Estructura */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo svg{width:34px;height:34px;flex:none}
.logo b{display:block;font-family:Georgia,serif;font-size:17px;line-height:1.15;letter-spacing:.01em}
.logo span{display:block;font-size:10.5px;color:var(--brand);letter-spacing:.18em;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.side .sep{flex:1}
main{padding:24px 28px 100px;max-width:1180px;width:100%;min-width:0}
.top{display:none}
.bottom{display:none}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.grid > .card + .card{margin-top:0}
.grid > *{min-width:0}
.card h2{margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.stat{padding:14px 16px}
.stat .k{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--ink-3)}
.stat.alert .v{color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.wa{background:#1e8e4e;border-color:#1e8e4e;color:#fff}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--panel-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.datebox{width:46px;flex:none;text-align:center;border-radius:10px;padding:4px 0;background:var(--panel-2);border:1px solid var(--line)}
.datebox b{display:block;font-size:18px;line-height:1.1}
.datebox span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.datebox.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.datebox.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.datebox.bad span,.datebox.warn span{color:inherit}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.b-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.b-brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
select.f,input.f{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2);font-weight:500}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

.empty{text-align:center;padding:32px 16px;color:var(--ink-2)}
.empty svg{width:42px;height:42px;color:var(--ink-3);margin-bottom:8px}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 18px}
.kv div span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kv div b{font-weight:500;word-break:break-word}

.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:4px 0 12px}
.tl:before{content:"";position:absolute;left:-17px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--panel)}
.tl .x{float:right;opacity:.5;cursor:pointer;border:0;background:none;padding:0 4px}
.tl .x:hover{opacity:1;color:var(--bad)}
.inline-add{display:flex;gap:8px;margin-top:8px}
.inline-add input{flex:1;min-width:0}

.money{font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--ink-3);font-weight:600;text-transform:uppercase;padding-bottom:2px}
.cal .d{min-height:62px;border:1px solid var(--line);border-radius:9px;padding:4px 5px;cursor:pointer;background:var(--panel);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d:hover{border-color:var(--brand)}
.cal .d.out{opacity:.4}
.cal .d.inh{background:var(--panel-2)}
.cal .d.today .n{background:var(--brand);color:var(--on-brand);border-radius:6px;padding:0 5px}
.cal .d.sel{outline:2px solid var(--brand);outline-offset:-1px}
.cal .n{font-size:12px;font-weight:600;align-self:flex-start}
.cal .ev{font-size:10.5px;border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--info-soft);color:var(--info)}
.cal .ev.audiencia{background:var(--brand-soft);color:var(--brand)}
.cal .ev.plazo{background:var(--warn-soft);color:var(--warn)}
.cal .ev.hecho{text-decoration:line-through;opacity:.6}
.cal .fer{font-size:9.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:none;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--info)}
.dots i.audiencia{background:var(--brand)} .dots i.plazo{background:var(--warn)}

.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center;background:transparent;cursor:pointer;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:14px;height:14px}
.done .t{text-decoration:line-through;color:var(--ink-3)}

.portal{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink)}
.portal .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.portal:hover b{color:var(--brand)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,10,12,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .body{padding:16px 18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal footer .l{margin-right:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.form label.cb{flex-direction:row;align-items:center;gap:8px}
.form input:not([type=checkbox]),.form select,.form textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-weight:400;color:var(--ink);width:100%}
.form textarea{min-height:80px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,.search input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.form .hint{font-weight:400;font-size:12px;color:var(--ink-3)}
.req{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.welcome{background:linear-gradient(135deg,var(--brand),#4b111a);color:#fff;border:0}
.welcome h2{font-family:Georgia,serif;font-size:22px}
.welcome p{color:#f3dfe2}
.welcome .btn{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff}
.welcome .btn.pri{background:#fff;color:var(--brand);border-color:#fff}

#imprimir{display:none}

/* Teléfono */
@media (max-width:900px){
  .app{display:block}
  .side{display:none}
  main{padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
  .top b{font-family:Georgia,serif;font-size:17px;flex:1;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top b small{display:block;font-family:system-ui,sans-serif;font-size:9.5px;letter-spacing:.2em;opacity:.8;font-weight:700}
  .top a{color:#fff;display:grid;place-items:center;width:36px;height:36px;border-radius:10px}
  .top a svg{width:21px;height:21px}
  .top svg.lg{width:28px;height:28px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--ink-3);text-decoration:none;font-weight:600}
  .bottom a svg{width:22px;height:22px}
  .bottom a.on{color:var(--brand)}
  .g4{grid-template-columns:1fr 1fr} .g3,.g2{grid-template-columns:1fr}
  .stat .v{font-size:21px}
  h1{font-size:20px}
  .form{grid-template-columns:1fr}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
  .modal footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .cal .d{min-height:44px;align-items:center}
  .cal .ev,.cal .fer{display:none}
  .dots{display:flex}
  .hide-m{display:none!important}
  .inline-add{flex-wrap:wrap}
  .inline-add input[name=texto],.inline-add input[name=motivo]{flex-basis:100%;order:-1}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}

@media print{
  body{background:#fff;color:#000}
  .app,.top,.bottom,.modal-bg,.toast{display:none!important}
  #imprimir{display:block;font:12px/1.45 Georgia,serif;color:#000}
  #imprimir h1{font-size:20px;margin-bottom:4px}
  #imprimir table{width:100%;border-collapse:collapse;margin-top:12px}
  #imprimir th,#imprimir td{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left}
  #imprimir td.r,#imprimir th.r{text-align:right}
  #imprimir .tot{font-weight:bold;border-top:2px solid #000}
  #imprimir .hdr{display:flex;justify-content:space-between;border-bottom:2px solid #7a1f2b;padding-bottom:8px;margin-bottom:12px}
}
</style>
</head>
<body>
<header class="top">
  <svg class="lg" viewBox="0 0 512 512"><use href="#marca"/></svg>
  <b class="marca"><small>ESTUDIO</small>Rodríguez y Rodríguez</b>
  <a href="#/buscar" aria-label="Buscar"><svg><use href="#i-search"/></svg></a>
  <a href="#/portales" aria-label="Portales"><svg><use href="#i-globe"/></svg></a>

<div class="app">

    <div class="logo">

    <nav class="nav" id="nav-side"></nav>
    <div class="sep"></div>

  <main id="main"></main>
</div>

<nav class="bottom" id="nav-bottom"></nav>

<script>
'use strict';
/* =====================================================================
   Estudio Rodríguez y Rodríguez · gestión del estudio jurídico
   Todo vive en este archivo y los datos en el navegador (localStorage).
   ===================================================================== */

const CLAVE = 'causa_datos_v1';
const MARCA = 'Estudio Rodríguez y Rodríguez';
const VERSION = 1;

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => iso(new Date());
const parse = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const sumar = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dias = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
const MESL = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Setiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fFecha = (s) => { if (!s) return '—'; const d = parse(s); return `${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`; };
const fFechaL = (s) => { const d = parse(s); return `${['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][d.getDay()]} ${d.getDate()} de ${MESL[d.getMonth()].toLowerCase()}`; };
const nf = new Intl.NumberFormat('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sol = (n) => 'S/ ' + nf.format(Number(n) || 0);
const num = (v) => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const icon = (id) => `<svg><use href="#${id}"/></svg>`;

/* ---------- datos ---------- */
const VACIO = () => ({
  version: VERSION,
  clientes: [], expedientes: [], eventos: [], movimientos: [],
  ajustes: { estudio: MARCA, abogado: '', colegiatura: '', telefono: '', ruc: '', direccion: '', inhabiles: [], tema: 'auto' }
});
let DB = cargar();
function cargar() {
  try {
    const raw = localStorage.getItem(CLAVE);
    if (raw) return arreglar(JSON.parse(raw));
  } catch (e) { console.warn(e); }
  return VACIO();
}
function arreglar(d) {
  const base = VACIO();
  if (!d || typeof d !== 'object') return base;
  for (const k of ['clientes', 'expedientes', 'eventos', 'movimientos']) base[k] = Array.isArray(d[k]) ? d[k].filter((x) => x && x.id) : [];
  base.ajustes = Object.assign(base.ajustes, d.ajustes || {});
  if (!Array.isArray(base.ajustes.inhabiles)) base.ajustes.inhabiles = [];
  if (!String(base.ajustes.estudio || '').trim()) base.ajustes.estudio = MARCA;
  base.expedientes.forEach((e) => { if (!Array.isArray(e.actuaciones)) e.actuaciones = []; });
  return base;
}
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(DB)); }
  catch (e) { toast('No se pudo guardar: el almacenamiento del navegador está lleno o bloqueado.'); }
}
const cliente = (id) => DB.clientes.find((c) => c.id === id);
const expediente = (id) => DB.expedientes.find((e) => e.id === id);
const expsDe = (cid) => DB.expedientes.filter((e) => e.clienteId === cid);

/* ---------- catálogos ---------- */
const MATERIAS = ['Civil', 'Penal', 'Laboral', 'Familia', 'Constitucional', 'Contencioso administrativo', 'Comercial', 'Tributario', 'Administrativo', 'Arbitraje', 'Otro'];
const ESTADOS = ['En trámite', 'Por presentar', 'En calificación', 'Sentenciado', 'Apelación', 'Casación', 'Ejecución', 'Conciliado', 'Archivado'];
const ESTADO_COLOR = { 'En trámite': 'b-info', 'Por presentar': 'b-warn', 'En calificación': 'b-warn', 'Sentenciado': 'b-brand', 'Apelación': 'b-brand', 'Casación': 'b-brand', 'Ejecución': 'b-ok', 'Conciliado': 'b-ok', 'Archivado': '' };
const CERRADOS = ['Archivado', 'Conciliado'];
const TIPOS_EV = { audiencia: 'Audiencia', plazo: 'Plazo', tarea: 'Tarea', reunion: 'Reunión' };
const TIPOS_MOV = { honorario: 'Honorario pactado', gasto: 'Gasto / tasa', pago: 'Pago recibido' };
const MEDIOS = ['Efectivo', 'Transferencia', 'Yape', 'Plin', 'Depósito', 'Cheque', 'Otro'];

/* ---------- días inhábiles (Perú) ---------- */
function pascua(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
const _fer = {};
function feriados(y) {
  if (_fer[y]) return _fer[y];
  const m = new Map();
  const fijo = [['01-01', 'Año Nuevo'], ['05-01', 'Día del Trabajo'], ['06-07', 'Batalla de Arica'], ['06-29', 'San Pedro y San Pablo'],
    ['07-23', 'Día de la Fuerza Aérea'], ['07-28', 'Fiestas Patrias'], ['07-29', 'Fiestas Patrias'], ['08-06', 'Batalla de Junín'],
    ['08-30', 'Santa Rosa de Lima'], ['10-08', 'Combate de Angamos'], ['11-01', 'Todos los Santos'], ['12-08', 'Inmaculada Concepción'],
    ['12-09', 'Batalla de Ayacucho'], ['12-25', 'Navidad']];
  fijo.forEach(([md, n]) => m.set(`${y}-${md}`, n));
  const p = pascua(y);
  const jue = new Date(p); jue.setDate(p.getDate() - 3);
  const vie = new Date(p); vie.setDate(p.getDate() - 2);
  m.set(iso(jue), 'Jueves Santo'); m.set(iso(vie), 'Viernes Santo');
  return (_fer[y] = m);
}
function inhabil(s) {
  const d = parse(s);
  if (d.getDay() === 0 || d.getDay() === 6) return 'Fin de semana';
  const f = feriados(d.getFullYear()).get(s);
  if (f) return f;
  const x = DB.ajustes.inhabiles.find((i) => i.fecha === s);
  return x ? (x.motivo || 'Día inhábil') : '';
}
const nombreFeriado = (s) => { const f = feriados(parse(s).getFullYear()).get(s); if (f) return f; const x = DB.ajustes.inhabiles.find((i) => i.fecha === s); return x ? (x.motivo || 'Día inhábil') : ''; };
/* El plazo empieza a correr el día siguiente de la notificación y sólo cuenta días hábiles. */
function vencimientoHabiles(desde, n) {
  let d = desde, c = 0, guard = 0;
  while (c < n && guard++ < 2000) { d = sumar(d, 1); if (!inhabil(d)) c++; }
  return d;
}
function vencimientoNaturales(desde, n) {
  let d = sumar(desde, n), guard = 0;
  while (inhabil(d) && guard++ < 60) d = sumar(d, 1); // si vence en inhábil, pasa al siguiente hábil
  return d;
}

/* ---------- cálculos ---------- */
function saldo(filtro) {
  let cargo = 0, pagado = 0, honor = 0, gasto = 0;
  DB.movimientos.filter(filtro).forEach((m) => {
    if (m.tipo === 'pago') pagado += num(m.monto);
    else { cargo += num(m.monto); if (m.tipo === 'gasto') gasto += num(m.monto); else honor += num(m.monto); }
  });
  return { cargo, pagado, honor, gasto, pend: Math.round((cargo - pagado) * 100) / 100 };
}
const saldoCliente = (cid) => saldo((m) => m.clienteId === cid);
const saldoExp = (eid) => saldo((m) => m.expedienteId === eid);
function urg(ev) {
  if (ev.hecho) return '';
  const d = dias(hoy(), ev.fecha);
  if (d < 0) return 'bad';
  if (d <= 1) return 'bad';
  if (d <= 3) return 'warn';
  return '';
}
function cuando(f) {
  const d = dias(hoy(), f);
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  if (d === -1) return 'ayer';
  if (d < 0) return `hace ${-d} días`;
  return `en ${d} días`;
}
function caratula(e) {
  const c = cliente(e.clienteId);
  return [c ? c.nombre : '', e.contraparte].filter(Boolean).join(' vs. ') || e.materia || 'Expediente';
}
const ordenEv = (a, b) => (a.fecha + (a.hora || '99')).localeCompare(b.fecha + (b.hora || '99'));

/* ---------- navegación ---------- */
const NAV = [
  ['inicio', 'Inicio', 'i-home'],
  ['clientes', 'Clientes', 'i-users'],
  ['expedientes', 'Expedientes', 'i-folder'],
  ['agenda', 'Agenda', 'i-cal'],
  ['honorarios', 'Honorarios', 'i-money'],
];
const NAV_EXTRA = [['portales', 'Portales', 'i-globe'], ['ajustes', 'Ajustes', 'i-gear']];
function pintarNav(ruta) {
  const base = { cliente: 'clientes', expediente: 'expedientes', buscar: '' }[ruta] ?? ruta;
  const a = ([k, t, i]) => `<a href="#/${k}" class="${k === base ? 'on' : ''}">${icon(i)}<span>${t}</span></a>`;
  $('#nav-side').innerHTML = NAV.map(a).join('') + '<div style="height:10px"></div>' + NAV_EXTRA.map(a).join('');
  $('#nav-bottom').innerHTML = NAV.map(a).join('');
  const s = DB.ajustes;
  $('#side-estudio').innerHTML = s.estudio ? `<b style="color:var(--ink-2)">${esc(s.estudio)}</b><br>${esc(s.abogado)}` : 'Configura tu estudio en Ajustes';
}

let estado = { qCli: '', qExp: '', fEstado: 'activos', fMateria: '', mes: hoy().slice(0, 7), diaSel: '', fTipo: '', verHechos: false, fMov: '' };

function render() {
  const [ruta, id] = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/');
  pintarNav(ruta);
  const vistas = { inicio: vInicio, clientes: vClientes, cliente: vCliente, expedientes: vExpedientes, expediente: vExpediente, agenda: vAgenda, honorarios: vHonorarios, portales: vPortales, ajustes: vAjustes, buscar: vBuscar };
  const v = vistas[ruta] || vInicio;
  $('#main').innerHTML = v(id ? decodeURIComponent(id) : '');
  aplicarTema();
}
function reRender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

/* ===================================================================
   VISTAS
   =================================================================== */
function vInicio() {
  const h = hoy();
  const activos = DB.expedientes.filter((e) => !CERRADOS.includes(e.estado));
  const pend = DB.eventos.filter((e) => !e.hecho);
  const vencidos = pend.filter((e) => e.fecha < h).sort(ordenEv);
  const prox = pend.filter((e) => e.fecha >= h && e.fecha <= sumar(h, 14)).sort(ordenEv);
  const aud7 = pend.filter((e) => e.tipo === 'audiencia' && e.fecha >= h && e.fecha <= sumar(h, 7)).length;
  const pla7 = pend.filter((e) => e.tipo === 'plazo' && e.fecha >= h && e.fecha <= sumar(h, 7)).length;
  const total = saldo(() => true);
  const deudores = DB.clientes.map((c) => ({ c, s: saldoCliente(c.id) })).filter((x) => x.s.pend > 0.004).sort((a, b) => b.s.pend - a.s.pend).slice(0, 5);
  const nombre = DB.ajustes.abogado ? ', ' + esc(DB.ajustes.abogado.split(' ')[0]) : '';
  const hora = new Date().getHours();
  const saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';

  const vacio = !DB.clientes.length && !DB.expedientes.length;
  return `
  <div class="head"><div><h1>${saludo}${nombre}</h1><div class="sub">${fFechaL(h)} · ${DB.ajustes.estudio ? esc(DB.ajustes.estudio) : 'tu estudio, en orden'}</div></div>
    <div class="actions"><button class="btn pri" data-act="nuevoEvento">${icon('i-plus')} Audiencia o plazo</button><button class="btn hide-m" data-act="nuevoExp">${icon('i-plus')} Expediente</button></div></div>
  ${vacio ? `<div class="card welcome" style="margin-bottom:14px"><h2>Bienvenido al Estudio Rodríguez y Rodríguez</h2>
    <p>Lleva clientes, expedientes, audiencias, plazos y honorarios en un solo lugar. Todo se guarda en este aparato; puedes descargar un respaldo cuando quieras.</p>
    <div class="actions"><button class="btn pri" data-act="nuevoCliente">Registrar mi primer cliente</button><button class="btn" data-act="ejemplo">Ver con datos de ejemplo</button></div></div>` : ''}
  <div class="grid g4">
    <a class="card stat" href="#/expedientes" style="text-decoration:none;color:inherit"><div class="k">Expedientes activos</div><div class="v">${activos.length}</div><div class="d">${DB.expedientes.length} en total</div></a>
    <a class="card stat" href="#/agenda" style="text-decoration:none;color:inherit"><div class="k">Audiencias · 7 días</div><div class="v">${aud7}</div><div class="d">próxima semana</div></a>
    <a class="card stat ${pla7 || vencidos.length ? 'alert' : ''}" href="#/agenda" style="text-decoration:none;color:inherit"><div class="k">Plazos · 7 días</div><div class="v">${pla7}</div><div class="d">${vencidos.length ? vencidos.length + ' vencido(s) sin marcar' : 'ninguno vencido'}</div></a>
    <a class="card stat" href="#/honorarios" style="text-decoration:none;color:inherit"><div class="k">Por cobrar</div><div class="v">${sol(total.pend)}</div><div class="d">cobrado ${sol(total.pagado)}</div></a>
  </div>
  <div class="grid g2" style="margin-top:14px;align-items:start">
    <div class="card"><h2>Próximos 14 días <a class="btn sm ghost" href="#/agenda">Ver agenda</a></h2>
      ${vencidos.length ? `<div class="tiny" style="color:var(--bad);font-weight:700;margin:4px 0">VENCIDOS SIN MARCAR</div><div class="list">${vencidos.map(filaEvento).join('')}</div><div style="height:10px"></div>` : ''}
      ${prox.length ? `<div class="list">${prox.map(filaEvento).join('')}</div>` : `<div class="empty">${icon('i-cal')}<div>Nada en agenda para las próximas dos semanas.</div></div>`}
    </div>
    <div>
      <div class="card"><h2>Saldos por cobrar <a class="btn sm ghost" href="#/honorarios">Honorarios</a></h2>
        ${deudores.length ? `<div class="list">${deudores.map(({ c, s }) => `<div class="row" data-go="cliente/${c.id}"><div class="main"><div class="t">${esc(c.nombre)}</div><div class="s">${expsDe(c.id).length} expediente(s) · pagó ${sol(s.pagado)} de ${sol(s.cargo)}</div></div><div class="end money neg">${sol(s.pend)}</div></div>`).join('')}</div>` : `<div class="empty small">Nadie te debe nada. 👏</div>`}
      </div>
      <div class="card"><h2>Calculadora de plazos</h2>
        <p class="small muted" style="margin:0 0 10px">Cuenta días hábiles desde el día siguiente a la notificación, sin fines de semana ni feriados.</p>
        <button class="btn" data-act="calc">${icon('i-clock')} Calcular un vencimiento</button>
      </div>
    </div>
  </div>`;
}

function filaEvento(ev, conExp = true) {
  const d = parse(ev.fecha), u = urg(ev), e = expediente(ev.expedienteId);
  const t = { audiencia: 'b-brand', plazo: 'b-warn', tarea: 'b-info', reunion: '' }[ev.tipo] || '';
  return `<div class="row ${ev.hecho ? 'done' : ''}" data-act="editEvento" data-id="${ev.id}">
    <button class="check ${ev.hecho ? 'on' : ''}" data-act="toggleEvento" data-id="${ev.id}" aria-label="Marcar como hecho">${ev.hecho ? icon('i-check') : ''}</button>
    <div class="datebox ${u}"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div>
    <div class="main"><div class="t">${esc(ev.titulo || TIPOS_EV[ev.tipo])}</div>
      <div class="s"><span class="badge ${t}">${TIPOS_EV[ev.tipo] || 'Evento'}</span> ${ev.hora ? esc(ev.hora) + ' · ' : ''}${conExp && e ? esc(e.numero || caratula(e)) : esc(ev.lugar || '')}</div></div>
    <div class="end tiny hide-m">${cuando(ev.fecha)}</div></div>`;
}

/* ---------- clientes ---------- */
function vClientes() {
  const q = norm(estado.qCli);
  const lista = DB.clientes.filter((c) => !q || norm([c.nombre, c.documento, c.telefono, c.email].join(' ')).includes(q)).sort((a, b) => a.nombre.localeCompare(b.nombre));
  return `
  <div class="head"><div><h1>Clientes</h1><div class="sub">${DB.clientes.length} registrado(s)</div></div>

/* ---------- agenda ---------- */
function vAgenda() {
  const [y, m] = estado.mes.split('-').map(Number);
  const primero = new Date(y, m - 1, 1);
  const off = (primero.getDay() + 6) % 7; // semana empieza en lunes
  const inicio = new Date(y, m - 1, 1 - off);
  const evs = DB.eventos.filter((e) => (estado.verHechos || !e.hecho) && (!estado.fTipo || e.tipo === estado.fTipo));
  const porDia = {};
  evs.forEach((e) => (porDia[e.fecha] = porDia[e.fecha] || []).push(e));
  const h = hoy();
  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio); d.setDate(inicio.getDate() + i);
    const s = iso(d), lst = (porDia[s] || []).sort(ordenEv), fer = nombreFeriado(s), inh = inhabil(s);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    celdas += `<div class="d ${d.getMonth() !== m - 1 ? 'out' : ''} ${inh ? 'inh' : ''} ${s === h ? 'today' : ''} ${s === estado.diaSel ? 'sel' : ''}" data-act="dia" data-v="${s}">
      <span class="n">${d.getDate()}</span>${fer ? `<span class="fer">${esc(fer)}</span>` : ''}
      ${lst.slice(0, 3).map((e) => `<span class="ev ${e.tipo} ${e.hecho ? 'hecho' : ''}">${e.hora ? esc(e.hora) + ' ' : ''}${esc(e.titulo || TIPOS_EV[e.tipo])}</span>`).join('')}
      ${lst.length > 3 ? `<span class="tiny">+${lst.length - 3}</span>` : ''}
      <span class="dots">${lst.slice(0, 4).map((e) => `<i class="${e.tipo}"></i>`).join('')}</span></div>`;
  }
  let lista, titulo;
  if (estado.diaSel) {
    lista = (porDia[estado.diaSel] || []).sort(ordenEv);
    const f = nombreFeriado(estado.diaSel);
    titulo = fFechaL(estado.diaSel) + (f ? ` · ${f}` : '');
  } else {
    lista = evs.filter((e) => e.fecha.startsWith(estado.mes)).sort(ordenEv);
    titulo = `${MESL[m - 1]} ${y}`;
  }
  return `
  <div class="head"><div><h1>Agenda</h1><div class="sub">Audiencias, plazos, tareas y reuniones</div></div>
    <div class="actions"><button class="btn" data-act="calc">${icon('i-clock')} Calcular plazo</button><button class="btn hide-m" data-act="ics">Exportar a calendario</button><button class="btn pri" data-act="nuevoEvento" data-fecha="${estado.diaSel}">${icon('i-plus')} Nuevo</button></div></div>
  <div class="chips" style="margin-bottom:12px">${[['', 'Todo'], ['audiencia', 'Audiencias'], ['plazo', 'Plazos'], ['tarea', 'Tareas'], ['reunion', 'Reuniones']].map(([k, t]) => `<button class="chip ${estado.fTipo === k ? 'on' : ''}" data-act="fTipo" data-v="${k}">${t}</button>`).join('')}
    <button class="chip ${estado.verHechos ? 'on' : ''}" data-act="verHechos">Mostrar realizados</button></div>
  <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start" id="ag">
    <div class="card"><div class="cal-head"><button class="btn sm ghost" data-act="mes" data-v="-1" aria-label="Mes anterior">${icon('i-left')}</button>
      <h2 style="margin:0">${MESL[m - 1]} ${y}</h2>
      <span><button class="btn sm ghost" data-act="mesHoy">Hoy</button><button class="btn sm ghost" data-act="mes" data-v="1" aria-label="Mes siguiente">${icon('i-right')}</button></span></div>
      <div class="cal">${['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].map((d) => `<div class="dow">${d}</div>`).join('')}${celdas}</div></div>
    <div class="card"><h2>${esc(titulo)} ${estado.diaSel ? `<button class="btn sm ghost" data-act="dia" data-v="">Ver mes</button>` : ''}</h2>
      ${lista.length ? `<div class="list">${lista.map((e) => filaEvento(e)).join('')}</div>` : `<div class="empty small">Sin eventos${estado.diaSel ? ' este día' : ' este mes'}.</div>`}</div>
  </div>
  <style>@media(max-width:900px){#ag{grid-template-columns:1fr!important}}</style>`;
}

  let res = '';

      ${!cs.length && !es.length && !vs.length ? `<div class="card empty">Sin resultados para «${esc(qGlobal)}».</div>` : ''}`;

  return `<div class="head"><div><h1>Buscar</h1></div></div>

}

let modalCb = null;
function abrirModal({ titulo, campos, valores = {}, guardar: alGuardar, borrar, extra = '', boton = 'Guardar' }) {
  cerrarModal();
  const html = campos.map((f) => {
    const v = valores[f.k] ?? f.def ?? '';
    const req = f.req ? ' required' : '';
    const lab = `${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}`;
    const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
    const cls = f.full ? 'full' : '';
    if (f.t === 'select') return `<label class="${cls}">${lab}<select name="${f.k}"${req}>${f.op.map((o) => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(txt)}</option>`; }).join('')}</select>${hint}</label>`;
    if (f.t === 'textarea') return `<label class="full">${lab}<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>${hint}</label>`;
    if (f.t === 'checkbox') return `<label class="cb ${cls}"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${lab}</label>`;
    return `<label class="${cls}">${lab}<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}"${req}${f.t === 'number' ? ' step="0.01" min="0" inputmode="decimal"' : ''}${f.list ? ` list="dl-${f.k}"` : ''}>${f.list ? `<datalist id="dl-${f.k}">${f.list.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}${hint}</label>`;
  }).join('');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<form class="modal" novalidate><header><h2>${esc(titulo)}</h2><button type="button" class="btn ghost sm" data-close aria-label="Cerrar">${icon('i-x')}</button></header>
    <div class="body"><div class="form">${html}</div>${extra}</div>
    <footer>${borrar ? `<button type="button" class="btn danger l" data-del>Eliminar</button>` : ''}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">${esc(boton)}</button></footer></form>`;
  document.body.appendChild(bg);
  const form = bg.querySelector('form');
  bg.addEventListener('mousedown', (ev) => { if (ev.target === bg) cerrarModal(); });
  bg.querySelectorAll('[data-close]').forEach((b) => b.onclick = cerrarModal);
  if (borrar) bg.querySelector('[data-del]').onclick = () => { if (borrar() !== false) cerrarModal(); };
  form.onsubmit = (ev) => {
    ev.preventDefault();
    const datos = {};
    for (const f of campos) {
      const el = form.elements[f.k];
      datos[f.k] = f.t === 'checkbox' ? el.checked : el.value.trim();
      if (f.req && !datos[f.k]) { el.focus(); toast(`Falta: ${f.l}`); return; }
      if (f.t === 'number' && f.req && !(num(datos[f.k]) > 0)) { el.focus(); toast(`${f.l}: escribe un monto mayor que cero`); return; }
    }
    if (alGuardar(datos, form) !== false) cerrarModal();
  };
  modalCb = bg;
  const primero = form.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
  if (primero && window.innerWidth > 900) setTimeout(() => primero.focus(), 30);
  return form;
}

function formCalc() {
  const form = abrirModal({
    titulo: 'Calculadora de plazos', boton: 'Agendar vencimiento',
    valores: { desde: hoy(), dias: 3, modo: 'habiles' },
    campos: [
      { k: 'desde', l: 'Notificado el', t: 'date', req: true },
      { k: 'dias', l: 'Plazo (días)', t: 'number', req: true },
      { k: 'modo', l: 'Cómputo', t: 'select', op: [['habiles', 'Días hábiles'], ['naturales', 'Días calendario']], full: true },
      { k: 'expedienteId', l: 'Expediente (para agendar)', t: 'select', op: opExps(), full: true },
      { k: 'titulo', l: 'Descripción', full: true, def: 'Vence plazo', list: ['Vence plazo para apelar', 'Vence plazo para contestar', 'Vence plazo para absolver traslado', 'Vence plazo para subsanar'] },
    ],
    extra: `<div class="card" id="calcRes" style="margin-top:14px;background:var(--panel-2);box-shadow:none"></div>
      <p class="tiny" style="margin-top:8px">Referencia general: el plazo corre desde el día siguiente de la notificación. Verifica siempre la norma aplicable y los días inhábiles de tu distrito judicial (agrégalos en Ajustes).</p>`,
    guardar: (d) => {
      const r = calcular(d);
      if (!r) return false;
      const ev = { id: uid(), tipo: 'plazo', hecho: false, creado: ahora(), fecha: r, hora: '', lugar: '', expedienteId: d.expedienteId, titulo: d.titulo || 'Vence plazo', notas: `Notificado el ${fFecha(d.desde)} · ${d.dias} días ${d.modo === 'habiles' ? 'hábiles' : 'calendario'}` };
      DB.eventos.push(ev); tocarExp(d.expedienteId); guardar(); toast('Vencimiento agendado: ' + fFecha(r)); reRender();
    },
  });
  const calcular = (d) => { const n = Math.floor(num(d.dias)); if (!d.desde || n < 1 || n > 3650) return null; return d.modo === 'habiles' ? vencimientoHabiles(d.desde, n) : vencimientoNaturales(d.desde, n); };
  const pintar = () => {
    const d = { desde: form.elements.desde.value, dias: form.elements.dias.value, modo: form.elements.modo.value };
    const r = calcular(d), box = $('#calcRes');
    if (!r) { box.innerHTML = '<span class="muted">Completa la fecha y el número de días.</span>'; return; }
    const saltos = [];
    for (let x = sumar(d.desde, 1); x <= r; x = sumar(x, 1)) { const f = nombreFeriado(x); if (f) saltos.push(`${fFecha(x)} (${f})`); }
    box.innerHTML = `<div class="tiny">VENCE EL</div><div style="font-size:22px;font-weight:700;font-family:Georgia,serif">${fFechaL(r)} de ${parse(r).getFullYear()}</div>
      <div class="small muted">${cuando(r)}${saltos.length ? ` · se saltaron: ${esc(saltos.join(', '))}` : ''}</div>`;
  };
  form.addEventListener('input', pintar);
  pintar();
}

/* ---------- borrados ---------- */
function borrarExp(id) {
  const e = expediente(id); if (!e) return;
  const nE = DB.eventos.filter((v) => v.expedienteId === id).length, nM = DB.movimientos.filter((m) => m.expedienteId === id).length;
  if (!confirm(`¿Eliminar el expediente ${e.numero || caratula(e)}?\nTambién se borrarán ${nE} evento(s) de agenda.${nM ? `\nSus ${nM} movimiento(s) de honorarios se conservan en el cliente.` : ''}`)) return false;
  DB.expedientes = DB.expedientes.filter((x) => x.id !== id);
  DB.eventos = DB.eventos.filter((v) => v.expedienteId !== id);
  DB.movimientos.forEach((m) => { if (m.expedienteId === id) m.expedienteId = ''; });
  guardar(); cerrarModal(); toast('Expediente eliminado'); location.hash = '#/expedientes';
}
function borrarCliente(id) {
  const c = cliente(id); if (!c) return;
  const ex = expsDe(id), nM = DB.movimientos.filter((m) => m.clienteId === id).length;
  if (!confirm(`¿Eliminar a ${c.nombre}?\nSe borrarán también ${ex.length} expediente(s), su agenda y ${nM} movimiento(s) de honorarios.\nEsto no se puede deshacer.`)) return;
  const ids = new Set(ex.map((e) => e.id));
  DB.clientes = DB.clientes.filter((x) => x.id !== id);
  DB.expedientes = DB.expedientes.filter((e) => !ids.has(e.id));
  DB.eventos = DB.eventos.filter((v) => !ids.has(v.expedienteId));
  DB.movimientos = DB.movimientos.filter((m) => m.clienteId !== id);
  guardar(); toast('Cliente eliminado'); location.hash = '#/clientes';
}

  csv: () => exportarCSV(),
  ics: () => exportarICS(),

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act],[data-go]');
  if (!el || el.closest('.modal-bg')) return;
  if (el.dataset.act) { ev.preventDefault(); ev.stopPropagation(); ACC[el.dataset.act] && ACC[el.dataset.act](el.dataset); }
  else if (el.dataset.go) location.hash = '#/' + el.dataset.go;
});
document.addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'qCli' || id === 'qExp') {
    estado[id] = ev.target.value; const pos = ev.target.selectionStart; reRender();
    const n = $('#' + id); n.focus(); n.setSelectionRange(pos, pos);
  } else if (id === 'qGlobal') {
    qGlobal = ev.target.value; const box = document.createElement('div'); box.innerHTML = vBuscar(); $('#resBuscar').innerHTML = box.querySelector('#resBuscar').innerHTML;
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'fMateria') { estado.fMateria = ev.target.value; reRender(); }
  if (ev.target.id === 'fileRespaldo') cargarRespaldo(ev.target.files[0]);
});
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('[data-form]');
  if (!f) return;
  ev.preventDefault();
  const tipo = f.dataset.form, fd = Object.fromEntries(new FormData(f));
  if (tipo === 'actuacion') {
    const e = expediente(f.dataset.id); if (!e || !fd.texto.trim()) return;
    e.actuaciones.push({ id: uid(), fecha: fd.fecha || hoy(), texto: fd.texto.trim() }); e.actualizado = ahora(); guardar(); reRender(); toast('Anotado');
  } else if (tipo === 'ajustes') {
    Object.assign(DB.ajustes, fd); guardar(); render(); toast('Ajustes guardados');
  } else if (tipo === 'inhabil') {
    if (!fd.fecha) return;
    DB.ajustes.inhabiles = DB.ajustes.inhabiles.filter((i) => i.fecha !== fd.fecha);
    DB.ajustes.inhabiles.push({ fecha: fd.fecha, motivo: fd.motivo.trim() }); guardar(); reRender(); toast('Día inhábil agregado');
  }
});

/* ===================================================================
   SALIDAS: respaldo, CSV, ICS, impresión
   =================================================================== */
function descargar(nombre, contenido, tipo) {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function cargarRespaldo(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const d = j && j.app === 'causa' ? j.datos : j;
      if (!d || !Array.isArray(d.clientes)) throw new Error('formato');
      const nuevo = arreglar(d);
      if (!confirm(`El respaldo tiene ${nuevo.clientes.length} cliente(s) y ${nuevo.expedientes.length} expediente(s).\nReemplazará los datos de este aparato. ¿Continuar?`)) return;
      DB = nuevo; guardar(); render(); toast('Respaldo cargado');
    } catch { toast('Ese archivo no es un respaldo del estudio'); }
  };
  r.readAsText(file);
}
function exportarCSV() {
  const q = (v) => { const s = String(v ?? ''); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const tabla = (cab, filas) => [cab, ...filas].map((f) => f.map(q).join(';')).join('\r\n');
  const exp = tabla(['N.° expediente', 'Cliente', 'Condición', 'Contraparte', 'Materia', 'Pretensión', 'Órgano', 'Distrito', 'Juez', 'Especialista', 'Estado', 'Inicio', 'Pactado', 'Pagado', 'Saldo'],
    DB.expedientes.map((e) => { const s = saldoExp(e.id); return [e.numero, (cliente(e.clienteId) || {}).nombre, e.condicion, e.contraparte, e.materia, e.pretension, e.juzgado, e.distrito, e.juez, e.especialista, e.estado, e.inicio, s.cargo.toFixed(2), s.pagado.toFixed(2), s.pend.toFixed(2)]; }));
  const mov = tabla(['Fecha', 'Tipo', 'Cliente', 'Expediente', 'Concepto', 'Medio', 'Monto'],
    DB.movimientos.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).map((m) => [m.fecha, TIPOS_MOV[m.tipo], (cliente(m.clienteId) || {}).nombre, (expediente(m.expedienteId) || {}).numero, m.concepto, m.medio, (m.tipo === 'pago' ? -1 : 1) * num(m.monto)]));
  const ag = tabla(['Fecha', 'Hora', 'Tipo', 'Descripción', 'Expediente', 'Lugar', 'Realizado'],
    DB.eventos.slice().sort(ordenEv).map((v) => [v.fecha, v.hora, TIPOS_EV[v.tipo], v.titulo, (expediente(v.expedienteId) || {}).numero, v.lugar, v.hecho ? 'Sí' : 'No']));
  const cli = tabla(['Nombre', 'Tipo', 'Documento', 'Teléfono', 'Correo', 'Dirección', 'Saldo'],
    DB.clientes.map((c) => [c.nombre, c.tipo, c.documento, c.telefono, c.email, c.direccion, saldoCliente(c.id).pend.toFixed(2)]));
  const bom = '﻿';
  descargar(`rodriguez-expedientes-${hoy()}.csv`, bom + exp, 'text/csv');
  setTimeout(() => descargar(`rodriguez-honorarios-${hoy()}.csv`, bom + mov, 'text/csv'), 300);
  setTimeout(() => descargar(`rodriguez-agenda-${hoy()}.csv`, bom + ag, 'text/csv'), 600);
  setTimeout(() => descargar(`rodriguez-clientes-${hoy()}.csv`, bom + cli, 'text/csv'), 900);
  toast('Se descargan 4 archivos CSV (se abren en Excel)');
}
function exportarICS() {
  const evs = DB.eventos.filter((v) => !v.hecho && v.fecha >= sumar(hoy(), -30));
  if (!evs.length) { toast('No hay eventos pendientes para exportar'); return; }
  const tx = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Estudio Rodriguez y Rodriguez//Agenda//ES', 'CALSCALE:GREGORIAN'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  evs.forEach((v) => {
    const e = expediente(v.expedienteId), d = v.fecha.replace(/-/g, '');
    L.push('BEGIN:VEVENT', `UID:${v.id}@causa`, `DTSTAMP:${stamp}`);
    if (v.hora) { const [h, m] = v.hora.split(':'); const fin = new Date(parse(v.fecha).setHours(+h + 1, +m)); L.push(`DTSTART:${d}T${h}${m}00`, `DTEND:${iso(fin).replace(/-/g, '')}T${pad(fin.getHours())}${pad(fin.getMinutes())}00`); }
    else L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${sumar(v.fecha, 1).replace(/-/g, '')}`);
    L.push(`SUMMARY:${tx(`[${TIPOS_EV[v.tipo]}] ${v.titulo || ''}`)}`);
    if (v.lugar) L.push(`LOCATION:${tx(v.lugar)}`);
    L.push(`DESCRIPTION:${tx([e ? `Expediente ${e.numero || ''} · ${caratula(e)}` : '', v.notas].filter(Boolean).join('\n'))}`);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Recordatorio', 'TRIGGER:-P1D', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  descargar(`rodriguez-agenda-${hoy()}.ics`, L.join('\r\n'), 'text/calendar');
  toast(`${evs.length} evento(s) exportados. Ábrelo con Google Calendar o el calendario del celular.`);
}
function imprimirEstado(cid) {
  const c = cliente(cid), s = saldoCliente(cid), a = DB.ajustes;
  const movs = DB.movimientos.filter((m) => m.clienteId === cid).sort((x, y) => x.fecha.localeCompare(y.fecha));
  let corr = 0;
  $('#imprimir').innerHTML = `<div class="hdr"><div><h1>${esc(a.estudio || 'Estado de cuenta')}</h1><div>${esc([a.abogado, a.colegiatura].filter(Boolean).join(' · '))}</div><div>${esc([a.ruc && 'RUC ' + a.ruc, a.telefono, a.direccion].filter(Boolean).join(' · '))}</div></div>
    <div style="text-align:right"><b>ESTADO DE CUENTA</b><br>${fFecha(hoy())}</div></div>
    <p><b>Cliente:</b> ${esc(c.nombre)}${c.documento ? ' · ' + esc(c.documento) : ''}</p>
    <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Expediente</th><th class="r">Cargo</th><th class="r">Abono</th><th class="r">Saldo</th></tr></thead><tbody>
    ${movs.map((m) => { const p = m.tipo === 'pago'; corr += p ? -num(m.monto) : num(m.monto); const e = expediente(m.expedienteId);
      return `<tr><td>${fFecha(m.fecha)}</td><td>${esc(m.concepto || TIPOS_MOV[m.tipo])}${p && m.medio ? ' (' + esc(m.medio) + ')' : ''}</td><td>${esc(e ? e.numero || '' : '')}</td><td class="r">${p ? '' : sol(m.monto)}</td><td class="r">${p ? sol(m.monto) : ''}</td><td class="r">${sol(corr)}</td></tr>`; }).join('')}
    <tr class="tot"><td colspan="3">Totales</td><td class="r">${sol(s.cargo)}</td><td class="r">${sol(s.pagado)}</td><td class="r">${sol(s.pend)}</td></tr></tbody></table>
    <p style="margin-top:24px">Saldo pendiente: <b>${sol(s.pend)}</b></p>`;
  window.print();
}

let tToast;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }

}
function aplicarTema() {
  const t = DB.ajustes.tema;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
