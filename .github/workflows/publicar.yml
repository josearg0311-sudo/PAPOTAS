# Publica PAPOTAS en una dirección web, gratis, con GitHub Pages.
#
# Por qué hace falta: instalar el programa en la pantalla de inicio -y que
# funcione sin internet, y que los datos no se muevan de sitio- son cosas que
# el navegador SOLO concede a una dirección https de verdad. Un archivo
# abierto desde el gestor de archivos nunca lo es, por bien hecho que esté.
#
# Qué hace: coge los archivos del repositorio y los deja publicados, poniendo
# el programa nuevo como portada y dejando el de siempre en /anterior.html,
# sin tocar nada del repositorio.
#
# No hay que encender nada a mano: el propio flujo enciende Pages la
# primera vez (el «enablement: true» de más abajo). A partir de ahí se
# publica solo cada vez que se sube un cambio.
#
# La dirección queda en:  https://josearg0311-sudo.github.io/PAPOTAS/
#
# Ojo con una cosa, porque es la letra pequeña: esa dirección es PÚBLICA.
# Lo que se publica es el programa, no tus datos: los clientes, las claves
# de las cuentas y los cobros viven en el navegador de tu celular y no
# salen de ahí ni están en este repositorio. Quien entre a la dirección ve
# un PAPOTAS vacío.

name: Publicar PAPOTAS

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Solo hace falta poder escribir en el repositorio: el sitio se deja en la
# rama «gh-pages» y GitHub la reconoce solo. No se usa el despliegue por
# Actions porque ESE camino exige que alguien entre antes a Settings a
# encenderlo, y el token del flujo no tiene permiso para encenderlo él.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p sitio
          # El programa nuevo es la portada: quien entre a la dirección
          # aterriza en él, y al instalarlo se instala él.
          cp papotas-nuevo.html sitio/index.html
          # El de siempre queda a mano, por si hace falta volver.
          cp index.html sitio/anterior.html
          cp papotas-nuevo.html sitio/papotas-nuevo.html
          cp sw.js manifest.webmanifest sitio/
          cp icono.svg icon-192.png icon-512.png sitio/
          cp icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png sitio/
          # El manifiesto debe arrancar en la portada, que ahora es el nuevo.
          sed -i 's#"start_url": "./papotas-nuevo.html"#"start_url": "./"#' sitio/manifest.webmanifest
          sed -i 's#"id": "./papotas-nuevo.html"#"id": "./"#' sitio/manifest.webmanifest
          # Aquí sí hay sw.js al lado, así que se marca: el programa lo
          # registra directo, sin tantear, y no deja ni un 404 en el registro.
          sed -i 's#<meta name="pap-sitio" content="0">#<meta name="pap-sitio" content="1">#' \
            sitio/index.html sitio/papotas-nuevo.html
          grep -q '"pap-sitio" content="1"' sitio/index.html
          # Sin esto GitHub se salta los archivos que empiezan por guión bajo.
          touch sitio/.nojekyll
          ls -la sitio

      # El sitio se empuja a la rama «gh-pages», que GitHub reconoce sin
      # que nadie encienda nada. El camino de antes -desplegar por
      # Actions- fallaba siempre en el mismo sitio: pedía que alguien
      # entrara a Settings → Pages primero, y esa era justo la parte que
      # sobraba. La rama se rehace entera en cada publicación, a
      # propósito: lo que hay ahí es el resultado, no historia que
      # conservar.
      - name: Dejarlo en la rama gh-pages
        run: |
          cd sitio
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "PAPOTAS publicado desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Publicado. En un minuto estará en:"
          echo "  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
