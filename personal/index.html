<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121016">
<meta name="description" content="Personal: agenda y recordatorios.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Personal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#121016;--panel:#1b1820;--panel2:#24202b;--line:#332d3c;--text:#efeaf4;--muted:#a197ad;
  --acc:#a970ff;--acc-ink:#fff;--acc-bg:rgba(169,112,255,.14);--ok:#2fbf71;--late:#f0574a;--warn:#e9a23b;
  --r:14px;--shadow:0 10px 30px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#f6f4f9;--panel:#fff;--panel2:#f1edf6;--line:#e4dfec;--text:#1b1621;--muted:#6b6276;
  --acc:#7c3aed;--acc-bg:rgba(124,58,237,.10);--ok:#14894b;--late:#d0362a;--warn:#b36b00;--shadow:0 10px 30px rgba(40,20,70,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 18px}
.brand img{width:30px;height:30px}
.tab{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--muted);text-align:left;font-weight:600;position:relative}
.tab svg{width:20px;height:20px;flex:none}
.tab:hover{background:var(--panel2);color:var(--text)}
.tab[aria-current="page"]{background:var(--panel2);color:var(--acc)}
.badge{margin-left:auto;background:var(--late);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:800}
main{padding:24px 28px 120px;max-width:960px;width:100%}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--late)}
.btn.sm{padding:6px 10px;font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--panel2);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 5px}
.hint{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.hide{display:none!important}
.late{color:var(--late)!important;font-weight:700}
.today{color:var(--acc)!important;font-weight:700}
.grp{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 2px}
/* recordatorios */
.rec{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-checked="true"] svg{opacity:1}
.body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.txt{font-weight:500;overflow-wrap:anywhere}
.rec.done .txt{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta svg{width:13px;height:13px;vertical-align:-2px}
.quick{display:grid;grid-template-columns:1fr 150px 110px auto;gap:8px}
.card .quick{grid-template-columns:1fr 1fr auto}
.card .quick input[type=text]{grid-column:1/-1}
/* eventos */
.ev{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;align-items:stretch}
.ev:last-child{border-bottom:0}
.ev:hover{background:var(--panel2)}
.ev .hr{width:54px;flex:none;font-weight:700;font-size:14px}
.ev .hr small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ev .stripe{width:4px;border-radius:3px;background:var(--ec,var(--acc));flex:none}
.ev .t{font-weight:600;overflow-wrap:anywhere}
.ev.past{opacity:.55}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1/0.9;border:1px solid transparent;background:var(--panel2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 4px;gap:4px;font-weight:600;min-width:0}
.cal button.out{opacity:.35}
.cal button.is-today{border-color:var(--acc);color:var(--acc)}
.cal button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--ec,var(--acc))}
.cal button[aria-pressed="true"] .dots i{background:#fff}
.cal .dots i.r{background:var(--warn);border-radius:1px}
/* notas */
.notes{columns:2 240px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:4px solid var(--nc,var(--line))}
.note h3{margin:0 0 6px;font-size:15px;overflow-wrap:anywhere}
.note p{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.note .when{font-size:12px;color:var(--muted);margin-top:8px}
/* varios */
.hero{display:flex;align-items:center;gap:16px}
.hero .big{width:64px;height:64px;border-radius:16px;background:var(--acc-bg);color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.hero .big b{font-size:26px}.hero .big span{font-size:11px;font-weight:800;text-transform:uppercase;margin-top:3px}
.banner{display:flex;gap:12px;align-items:center;background:var(--acc-bg);border:1px solid var(--acc);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.banner svg{width:22px;height:22px;color:var(--acc);flex:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--text)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--acc)}
.fab{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--acc-ink);box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.fab svg{width:26px;height:26px}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;gap:10px}
.dlg-h h3{margin:0;font-size:18px}
.dlg-b{padding:4px 18px 18px;max-height:70vh;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pick{display:grid;gap:10px;padding:8px 18px 18px}
.pick button{display:flex;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2)}
.pick button:hover{border-color:var(--acc)}
.pick svg{width:26px;height:26px;color:var(--acc);flex:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:var(--shadow);font-weight:600;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:#7c3aed;font-weight:800}
:root[data-theme="light"] .toast button{color:#c4a3ff}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:10;justify-content:space-around;gap:0}
  .brand{display:none}
  .tab{flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;justify-content:center;align-items:center}
  .tab[aria-current="page"]{background:none}
  .badge{position:absolute;top:0;right:calc(50% - 22px);margin:0;padding:0 5px}
  main{padding:18px 16px 150px}
  .g2{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr 1fr auto}
  .quick input[type=text]{grid-column:1/-1}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom));right:16px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
  .notes{columns:1}
  .cal{gap:3px}.cal button{border-radius:8px;font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Secciones">
    <div class="brand"><img src="icono.svg" alt=""> Personal</div>
    <button class="tab" data-view="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button class="tab" data-view="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Agenda</button>
    <button class="tab" data-view="recs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>Recordatorios<span class="badge hide" id="bdg"></span></button>
    <button class="tab" data-view="notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Notas</button>
    <button class="tab" data-view="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Ajustes</button>
  </nav>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Nuevo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="dlg"></dialog>

<script>
"use strict";
const KEY="personal_app_v1";
const COLORS=["#a970ff","#4f8cff","#2fbf71","#e9a23b","#f0574a","#18b6c9","#ff7ab6","#8a94a6"];
const DIAS=["L","M","X","J","V","S","D"];
const REPITE={no:"No se repite",dia:"Cada día",semana:"Cada semana",mes:"Cada mes","año":"Cada año"};
const AVISOS=[[-1,"Sin aviso"],[0,"A la hora"],[5,"5 minutos antes"],[15,"15 minutos antes"],[30,"30 minutos antes"],[60,"1 hora antes"],[120,"2 horas antes"],[1440,"1 día antes"]];
const HORA_SIN_HORA="09:00"; // a qué hora se avisa de lo que no tiene hora
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fresh=()=>({v:2,tema:"dark",nombre:"",eventos:[],recs:[],notas:[],avisados:{}});
let S;
function normalizar(d){
  const x=Object.assign(fresh(),d);
  // De la versión anterior (tareas): pasan a ser recordatorios.
  if(Array.isArray(x.tareas)){ x.tareas.forEach(t=>x.recs.push({id:t.id,t:t.t||Date.now(),texto:t.texto,fecha:t.fecha||"",hora:"",repite:"no",nota:t.nota||"",hecho:!!t.hecha,hechoEn:t.hechaEn})); delete x.tareas; }
  delete x.habitos;
  x.recs.forEach(r=>{r.repite=REPITE[r.repite]?r.repite:"no"; r.hora=r.hora||"";});
  x.eventos.forEach(e=>{e.repite=REPITE[e.repite]?e.repite:"no"; e.excl=e.excl||[]; if(e.aviso==null) e.aviso=-1;});
  if(typeof x.avisados!=="object"||!x.avisados) x.avisados={};
  return x;
}
function load(){ try{const r=localStorage.getItem(KEY);S=normalizar(r?JSON.parse(r):{});}catch(e){S=fresh();} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("No se pudo guardar en este aparato");} badge(); }

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoy=()=>iso(new Date());
const ahoraHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const masDias=(f,k)=>{const d=new Date(f+"T12:00");d.setDate(d.getDate()+k);return iso(d);};
const diaSemana=f=>(new Date(f+"T12:00").getDay()+6)%7;
const difDias=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const cap=s=>s.replace(/^./,c=>c.toUpperCase());
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fechaRel(f){
  const d=difDias(f,hoy());
  if(d===0) return "Hoy"; if(d===1) return "Mañana"; if(d===-1) return "Ayer";
  if(d<0&&d>-7) return "Hace "+(-d)+" días";
  if(d>0&&d<7) return cap(new Date(f+"T12:00").toLocaleDateString("es",{weekday:"long"}));
  return new Date(f+"T12:00").toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short",year:f.slice(0,4)===hoy().slice(0,4)?undefined:"numeric"});
}
const fechaLarga=f=>cap(new Date(f+"T12:00").toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"}));
const hace=t=>{const s=(Date.now()-t)/1000; if(s<60)return"ahora"; if(s<3600)return"hace "+Math.floor(s/60)+" min"; if(s<86400)return"hace "+Math.floor(s/3600)+" h";
  return new Date(t).toLocaleDateString("es",{day:"numeric",month:"short"});};
const ICON={
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></svg>'
};
let toastT;
function toast(msg,deshacer){
  document.querySelectorAll(".toast").forEach(t=>t.remove()); clearTimeout(toastT);
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML="<span>"+esc(msg)+"</span>"+(deshacer?'<button type="button">Deshacer</button>':"");
  if(deshacer) t.querySelector("button").onclick=()=>{deshacer();t.remove();};
  document.body.appendChild(t); toastT=setTimeout(()=>t.remove(),deshacer?6000:3000);
}

/* ---------- repeticiones ---------- */
function ocurre(x,f){
  if(!x.fecha||f<x.fecha) return false;
  if(x.excl&&x.excl.includes(f)) return false;
  switch(x.repite){
    case "dia": return true;
    case "semana": return difDias(f,x.fecha)%7===0;
    case "mes": return f.slice(8)===x.fecha.slice(8);
    case "año": return f.slice(5)===x.fecha.slice(5);
    default: return f===x.fecha;
  }
}
function siguiente(x,f){ // próxima vez después de f
  if(x.repite==="no") return null;
  if(x.repite==="dia") return masDias(f,1);
  if(x.repite==="semana") return masDias(f,7);
  for(let k=1;k<=12*8;k++){
    let [y,m]=f.split("-").map(Number);
    if(x.repite==="mes"){ m+=k; y+=Math.floor((m-1)/12); m=(m-1)%12+1; } else { y+=k; }
    const cand=y+"-"+pad(m)+"-"+x.fecha.slice(8);
    if(iso(new Date(cand+"T12:00"))===cand) return cand; // el día existe ese mes
    if(x.repite==="año"&&k>8) break;
  }
  return null;
}
const eventosDel=f=>S.eventos.filter(e=>ocurre(e,f)).sort((a,b)=>(a.todoDia?"":a.hora||"").localeCompare(b.todoDia?"":b.hora||""));
const recsDel=f=>S.recs.filter(r=>!r.hecho&&r.fecha===f).sort((a,b)=>(a.hora||"99").localeCompare(b.hora||"99"));

/* ---------- navegación ---------- */
let vista="hoy", diaSel=hoy(), mesCal=hoy().slice(0,7);
function ir(v){
  vista=v;
  document.querySelectorAll(".tab").forEach(b=>{ if(b.dataset.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#fab").classList.toggle("hide", v==="ajustes");

}

/* ---------- filas ---------- */
function filaRec(r){
  const h=hoy(), hm=ahoraHM(); let meta=[];
  if(r.fecha){ const tarde=!r.hecho&&(r.fecha<h||(r.fecha===h&&r.hora&&r.hora<hm));
    meta.push(`<span class="${tarde?"late":r.fecha===h&&!r.hecho?"today":""}">${esc(fechaRel(r.fecha))}${r.hora?" · "+r.hora:""}</span>`); }
  if(r.repite!=="no") meta.push(`<span>${ICON.rep} ${REPITE[r.repite]}</span>`);
  if(r.nota) meta.push(`<span>· ${esc(r.nota.length>40?r.nota.slice(0,40)+"…":r.nota)}</span>`);
  return `<div class="rec ${r.hecho?"done":""}"><button class="check" role="checkbox" aria-checked="${!!r.hecho}" aria-label="Hecho: ${esc(r.texto)}" data-rk="${r.id}">${ICON.ok}</button>
    <button class="body" data-re="${r.id}"><div class="txt">${esc(r.texto)}</div>${meta.length?`<div class="meta">${meta.join("")}</div>`:""}</button></div>`;
}
function filaEv(e,f){
  const pasado = f<hoy() || (f===hoy() && !e.todoDia && (e.fin||e.hora) && (e.fin||e.hora)<ahoraHM());
  return `<button class="ev ${pasado?"past":""}" style="--ec:${e.color||"var(--acc)"}" data-ee="${e.id}" data-ef="${f}">
    <div class="hr num">${e.todoDia?"Todo<small>el día</small>":esc(e.hora||"")+(e.fin?`<small>${esc(e.fin)}</small>`:"")}</div><span class="stripe"></span>
    <div class="grow"><div class="t">${esc(e.titulo)}</div><div class="meta">${e.lugar?`<span>${ICON.pin} ${esc(e.lugar)}</span>`:""}${e.repite!=="no"?`<span>${ICON.rep} ${REPITE[e.repite]}</span>`:""}${e.aviso>=0&&!e.todoDia?`<span>${ICON.bell}</span>`:""}</div></div></button>`;
}
function enlazar(M){

  M.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>formRec(S.recs.find(x=>x.id===b.dataset.re)));

const formRapida=f=>`<form class="quick" id="qf"><input type="text" id="qt" maxlength="200" placeholder="Recordarme…" aria-label="Nuevo recordatorio"><input type="date" id="qd" value="${f}" aria-label="Fecha"><input type="time" id="qh" aria-label="Hora"><button class="btn pri">Añadir</button></form>`;
function marcarRec(r){
  if(!r.hecho && r.repite!=="no" && r.fecha){
    const antes=r.fecha, sig=siguiente(r,r.fecha);
    if(sig){ r.fecha=sig; save(); render(); toast("Hecho. Próxima vez: "+fechaRel(sig).toLowerCase(),()=>{r.fecha=antes;save();render();}); return; }
  }
  r.hecho=!r.hecho; r.hechoEn=r.hecho?Date.now():undefined; save(); render();
  if(r.hecho) toast("Hecho ✓",()=>{r.hecho=false;delete r.hechoEn;save();render();});
}

/* ---------- hoy ---------- */
function vHoy(M){
  const h=hoy(), hr=new Date().getHours();
  const saludo=(hr<6?"Buenas noches":hr<13?"Buenos días":hr<20?"Buenas tardes":"Buenas noches")+(S.nombre?", "+S.nombre:"");
  const evs=eventosDel(h);
  const recs=S.recs.filter(r=>!r.hecho&&r.fecha&&r.fecha<=h).sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.hora||"99").localeCompare(b.hora||"99"));
  const hechosHoy=S.recs.filter(r=>r.hecho&&r.hechoEn&&iso(new Date(r.hechoEn))===h);
  const prox=[]; for(let k=1;k<=7;k++){ const f=masDias(h,k); const e=eventosDel(f), r=recsDel(f); if(e.length||r.length) prox.push([f,e,r]); }
  const d=new Date();
  M.innerHTML=`${bannerAvisos()}
    <div class="card hero" style="margin-bottom:14px"><div class="big"><b>${d.getDate()}</b><span>${MESES[d.getMonth()].slice(0,3)}</span></div>

      <p class="hint" style="margin:4px 0 0">${evs.length?`${evs.length} evento${evs.length>1?"s":""}`:"Sin eventos"} · ${recs.length?`${recs.length} recordatorio${recs.length>1?"s":""} pendiente${recs.length>1?"s":""}`:"nada pendiente"}</p></div></div>
    <div class="grid g2">
      <div class="card"><h2>Agenda de hoy</h2>${evs.map(e=>filaEv(e,h)).join("")||'<div class="empty">Nada en la agenda hoy.</div>'}
        <button class="btn sm" style="margin-top:10px" id="nuevoEv">+ Evento hoy</button></div>
      <div class="card"><h2>Recordatorios</h2>${formRapida(h)}<div style="margin-top:4px">${recs.map(filaRec).join("")}${hechosHoy.map(filaRec).join("")}
        ${recs.length||hechosHoy.length?"":'<div class="empty">Nada pendiente para hoy.</div>'}</div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Próximos 7 días</h2>
      ${prox.map(([f,e,r])=>`<div class="grp">${esc(fechaRel(f))}${difDias(f,hoy())<7?" · "+new Date(f+"T12:00").toLocaleDateString("es",{day:"numeric",month:"short"}):""}</div>${e.map(x=>filaEv(x,f)).join("")}${r.map(filaRec).join("")}`).join("")
        ||'<div class="empty">Semana despejada.</div>'}</div>
    ${(()=>{const fj=S.notas.filter(n=>n.fijada).sort((a,b)=>b.mod-a.mod).slice(0,4); return fj.length?`<div class="grp" style="margin:20px 2px 10px">Notas fijadas</div><div class="notes">${fj.map(filaNota).join("")}</div>`:"";})()}`;
  $("#nuevoEv").onclick=()=>formEvento(null,h);
  enlazar(M); enlazarBanner(M);
}

/* ---------- agenda ---------- */
function vAgenda(M){

      <span class="num">${+f.slice(8)}</span><span class="dots">${evs.slice(0,3).map(e=>`<i style="--ec:${e.color||"var(--acc)"}"></i>`).join("")}${nr?'<i class="r"></i>':""}</span></button>`;

      <div class="cal">${DIAS.map(d=>`<div class="dw">${d}</div>`).join("")}${celdas}</div>
      <div class="row" style="margin-top:10px;justify-content:space-between"><span class="hint"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc)"></span> evento &nbsp; <span style="display:inline-block;width:8px;height:8px;background:var(--warn)"></span> recordatorio</span>
      ${diaSel!==h||mesCal!==h.slice(0,7)?'<button class="btn sm" id="cH">Ir a hoy</button>':""}</div>
    </div>
    <div class="card"><h2>${esc(fechaLarga(diaSel))}</h2>
      ${evs.map(e=>filaEv(e,diaSel)).join("")}${recs.map(filaRec).join("")}
      ${evs.length||recs.length?"":'<div class="empty">Día libre.</div>'}

    </div>`;
  $("#cP").onclick=()=>{const d=new Date(y,m-2,1);mesCal=iso(d).slice(0,7);render();};

  const ch=$("#cH"); if(ch) ch.onclick=()=>{diaSel=h;mesCal=h.slice(0,7);render();};
  M.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{diaSel=b.dataset.d; if(diaSel.slice(0,7)!==mesCal) mesCal=diaSel.slice(0,7); render();});

/* ---------- recordatorios ---------- */

  } else {

  }

    ${formRapida("")}
    <div class="row" style="margin:14px 0 10px">${[["pendientes","Pendientes"],["hechos","Hechos"]].map(([k,t])=>`<button class="chip" data-fr="${k}" aria-pressed="${filtroR===k}">${t}</button>`).join("")}</div>
    <div class="card" style="padding-top:4px">${html}</div>`;

      const fecha=$("#rF",d).value, hora=$("#rH",d).value, repite=$("#rR",d).value;
      if(repite!=="no"&&!fecha) return $("#rErr",d).textContent="Para que se repita, ponle un día de inicio.";
      if(hora&&!fecha) return $("#rErr",d).textContent="Pon también el día.";
      const datos={texto,fecha,hora,repite,nota:$("#rN",d).value.trim()};
      if(nuevo) S.recs.push(Object.assign({id:uid(),t:Date.now(),hecho:false},datos)); else Object.assign(orig,datos);
      save(); dlg.close(); render(); toast(nuevo?"Recordatorio guardado":"Cambios guardados"); if(fecha) pedirPermisoSuave(); };
  });
}

/* ---------- notas ---------- */
let buscaN="";
const filaNota=n=>`<button class="note" style="--nc:${n.color||"var(--line)"}" data-ne="${n.id}">${n.titulo?`<h3>${esc(n.titulo)}</h3>`:""}<p>${esc(n.texto)||"<i>Vacía</i>"}</p><div class="when">${n.fijada?"📌 ":""}${esc(hace(n.mod))}</div></button>`;
function vNotas(M){
  const q=buscaN.toLowerCase();
  const l=S.notas.filter(n=>!q||(n.titulo+" "+n.texto).toLowerCase().includes(q)).sort((a,b)=>(b.fijada?1:0)-(a.fijada?1:0)||b.mod-a.mod);
  M.innerHTML=`<h1>Notas</h1><p class="sub">${S.notas.length} nota${S.notas.length===1?"":"s"}</p>
    <input type="search" id="nq" placeholder="Buscar en las notas" value="${esc(buscaN)}" style="margin-bottom:14px">
    <div class="notes">${l.map(filaNota).join("")}</div>${l.length?"":`<div class="empty">${q?"Ninguna nota coincide.":"Toca <b>+</b> para escribir tu primera nota."}</div>`}`;
  const qi=$("#nq",M); qi.oninput=()=>{buscaN=qi.value;const p=qi.selectionStart;render();const n=$("#nq");n.focus();n.setSelectionRange(p,p);};
  enlazar(M);
}
function formNota(n){
  const nuevo=!n; n=n||{titulo:"",texto:"",fijada:false,color:""}; let color=n.color||"";
  abrir(`<form id="fn"><div class="dlg-h"><input type="text" id="nT" maxlength="100" placeholder="Título" value="${esc(n.titulo)}" style="font-weight:700;font-size:17px;border:0;background:none;padding:6px 0">
      <button type="button" class="icon-btn" data-close aria-label="Cerrar">${ICON.x}</button></div>
    <div class="dlg-b"><textarea id="nX" placeholder="Escribe aquí…" aria-label="Texto" style="min-height:220px">${esc(n.texto)}</textarea>
    <label class="toggle"><input type="checkbox" id="nF" ${n.fijada?"checked":""}> Fijar en la pantalla Hoy</label>
    <div class="swatches" style="margin-top:12px"><button type="button" data-k="" style="background:var(--panel2);border-color:${color?"transparent":"var(--text)"}" aria-label="Sin color" aria-pressed="${!color}"></button>${COLORS.map(k=>`<button type="button" data-k="${k}" style="background:${k}" aria-label="Color" aria-pressed="${k===color}"></button>`).join("")}</div></div>
    <div class="dlg-f">${nuevo?"":'<button type="button" class="btn danger" id="nDel" style="margin-right:auto">Borrar</button>'}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">Guardar</button></div></form>`,d=>{
    d.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{color=b.dataset.k;d.querySelectorAll("[data-k]").forEach(x=>{x.setAttribute("aria-pressed",x.dataset.k===color);if(x.dataset.k==="")x.style.borderColor=color?"transparent":"var(--text)";});});
    setTimeout(()=>$("#nX",d).focus(),50);
    if(!nuevo) $("#nDel",d).onclick=()=>{const i=S.notas.indexOf(n);S.notas.splice(i,1);save();dlg.close();render();toast("Nota borrada",()=>{S.notas.splice(i,0,n);save();render();});};
    $("#fn",d).onsubmit=e=>{e.preventDefault(); const titulo=$("#nT",d).value.trim(), texto=$("#nX",d).value;
      if(!titulo&&!texto.trim()){dlg.close();return;}
      const datos={titulo,texto,fijada:$("#nF",d).checked,color,mod:Date.now()};
      if(nuevo) S.notas.push(Object.assign({id:uid()},datos)); else Object.assign(n,datos);
      save(); dlg.close(); render(); };
  });
}

/* ---------- avisos ---------- */
const puedeAvisar=()=>"Notification" in window;
const permiso=()=>puedeAvisar()?Notification.permission:"unsupported";
function bannerAvisos(){
  if(permiso()!=="default"||S.ocultarBanner) return "";
  return `<div class="banner">${ICON.bell}<div class="grow"><b>Activa los avisos</b><div class="hint">Para que te salte una notificación a la hora de cada cosa.</div></div>
    <button class="btn sm pri" id="bOn">Activar</button><button class="icon-btn" id="bOff" aria-label="Ahora no" style="width:32px;height:32px">${ICON.x}</button></div>`;
}
function enlazarBanner(M){
  const on=$("#bOn",M), off=$("#bOff",M);
  if(on) on.onclick=async()=>{ await pedirPermiso(); render(); };
  if(off) off.onclick=()=>{ S.ocultarBanner=true; save(); render(); };
}
async function pedirPermiso(){
  if(!puedeAvisar()) return toast("Este navegador no permite avisos");
  const r=await Notification.requestPermission();
  if(r==="granted"){ toast("Avisos activados"); notificar("Avisos activados","Así se verán tus recordatorios.","prueba"); }
  else if(r==="denied") toast("Bloqueaste los avisos. Puedes activarlos en los permisos del navegador.");
}
function pedirPermisoSuave(){ if(permiso()==="default"&&!S.preguntado){ S.preguntado=true; save(); pedirPermiso(); } }
async function notificar(titulo,cuerpo,tag){
  try{
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
    const op={body:cuerpo,tag,icon:"icon-192.png",badge:"icon-192.png",renotify:true,requireInteraction:true};
    if(reg) await reg.showNotification(titulo,op); else new Notification(titulo,op);
  }catch(e){}
}
function revisarAvisos(){
  const ahora=Date.now(), h=hoy(); let cambio=false;
  const avisar=(clave,cuando,titulo,cuerpo)=>{
    if(S.avisados[clave]) return;
    if(ahora>=cuando && ahora-cuando < 6*3600e3){ // no avisa de cosas de hace más de 6 h
      S.avisados[clave]=ahora; cambio=true;
      if(permiso()==="granted") notificar(titulo,cuerpo,clave);
      toast("🔔 "+titulo+(cuerpo?" · "+cuerpo:""));
    }
  };
  for(const r of S.recs){ if(r.hecho||!r.fecha) continue;
    avisar("r:"+r.id+":"+r.fecha+":"+(r.hora||""), new Date(r.fecha+"T"+(r.hora||HORA_SIN_HORA)).getTime(), r.texto, r.hora?"Hoy a las "+r.hora:"Recordatorio de hoy"); }
  for(const e of S.eventos){ if(e.todoDia||e.aviso<0||!e.hora) continue;
    for(const f of [masDias(h,-1),h,masDias(h,1)]) if(ocurre(e,f)){
      const ini=new Date(f+"T"+e.hora).getTime();
      avisar("e:"+e.id+":"+f+":"+e.hora+":"+e.aviso, ini-e.aviso*60e3, e.titulo, (e.aviso===0?"Ahora":"A las "+e.hora+(f!==h?" ("+fechaRel(f).toLowerCase()+")":""))+(e.lugar?" · "+e.lugar:""));
    }}
  for(const k in S.avisados) if(ahora-S.avisados[k]>40*864e5){ delete S.avisados[k]; cambio=true; }
  if(cambio){ save(); if(!dlg.open) render(); } else badge();
}

/* ---------- calendario del teléfono (.ics) ---------- */
const icsTxt=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
const icsF=f=>f.replace(/-/g,""); const icsH=h=>h.replace(":","")+"00";
const RR={dia:"DAILY",semana:"WEEKLY",mes:"MONTHLY","año":"YEARLY"};
const stamp=()=>new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
function icsEvento(e){
  const L=["BEGIN:VEVENT","UID:"+e.id+"@personal","DTSTAMP:"+stamp(),"SUMMARY:"+icsTxt(e.titulo)];
  if(e.todoDia){ L.push("DTSTART;VALUE=DATE:"+icsF(e.fecha),"DTEND;VALUE=DATE:"+icsF(masDias(e.fecha,1))); }
  else { L.push("DTSTART:"+icsF(e.fecha)+"T"+icsH(e.hora)); L.push("DTEND:"+icsF(e.fecha)+"T"+icsH(e.fin||(pad(Math.min(+e.hora.slice(0,2)+1,23))+e.hora.slice(2)))); }
  if(e.lugar) L.push("LOCATION:"+icsTxt(e.lugar)); if(e.nota) L.push("DESCRIPTION:"+icsTxt(e.nota));
  if(RR[e.repite]) L.push("RRULE:FREQ="+RR[e.repite]);
  (e.excl||[]).forEach(f=>L.push(e.todoDia?"EXDATE;VALUE=DATE:"+icsF(f):"EXDATE:"+icsF(f)+"T"+icsH(e.hora)));
  if(e.aviso>=0&&!e.todoDia) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(e.titulo),"TRIGGER:-PT"+e.aviso+"M","END:VALARM");
  L.push("END:VEVENT"); return L;
}
function icsRec(r){
  const hora=r.hora||HORA_SIN_HORA, fin=pad(Math.min(+hora.slice(0,2),23))+":"+pad(Math.min(+hora.slice(3)+15,59));
  const L=["BEGIN:VEVENT","UID:"+r.id+"@personal","DTSTAMP:"+stamp(),"SUMMARY:"+icsTxt(r.texto),"DTSTART:"+icsF(r.fecha)+"T"+icsH(hora),"DTEND:"+icsF(r.fecha)+"T"+icsH(fin)];
  if(r.nota) L.push("DESCRIPTION:"+icsTxt(r.nota)); if(RR[r.repite]) L.push("RRULE:FREQ="+RR[r.repite]);
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(r.texto),"TRIGGER:PT0M","END:VALARM","END:VEVENT"); return L;
}
function bajarIcs(bloques,nombre){
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Personal//ES","CALSCALE:GREGORIAN",...bloques.flat(),"END:VCALENDAR"].join("\r\n");
  bajar(new Blob([txt],{type:"text/calendar"}),(nombre||"agenda").replace(/[^\wáéíóúñ -]/gi,"").slice(0,40).trim()+".ics");
  toast("Ábrelo y elige «Añadir» en tu calendario");
}
function bajar(blob,nombre){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }

/* ---------- ajustes ---------- */
function vAjustes(M){
  const p=permiso();
  M.innerHTML=`<h1>Ajustes</h1><p class="sub">Todo se guarda en este aparato.</p>
    <div class="grid" style="gap:14px">
    <div class="card"><h2>General</h2><div class="grid g2" style="gap:10px">
      <div><label class="f" for="aN">Tu nombre (para el saludo)</label><input type="text" id="aN" maxlength="30" value="${esc(S.nombre)}"></div>
      <div><label class="f" for="aT">Tema</label><select id="aT"><option value="dark" ${S.tema!=="light"?"selected":""}>Oscuro</option><option value="light" ${S.tema==="light"?"selected":""}>Claro</option></select></div></div></div>
    <div class="card"><h2>Avisos</h2>
      <p style="margin-top:0">Estado: <b>${{granted:"activados",denied:"bloqueados en el navegador",default:"sin activar",unsupported:"este navegador no los permite"}[p]}</b></p>
      ${p==="default"?'<button class="btn pri" id="aOn">Activar avisos</button>':""}${p==="granted"?'<button class="btn" id="aPr">Probar un aviso</button>':""}
      <p class="hint">Los avisos saltan mientras la app está abierta o en segundo plano. Si cierras la app del todo, el teléfono no la despierta. Para algo que <b>no puedes olvidar</b>, ábrelo y pulsa <b>«Al calendario del teléfono»</b>: queda en tu calendario con su alarma, que suena siempre.</p>
      <button class="btn" id="aIcs">Pasar toda la agenda al calendario del teléfono</button></div>
    <div class="card"><h2>Tus datos</h2><p class="hint" style="margin-top:0">${S.eventos.length} eventos · ${S.recs.length} recordatorios · ${S.notas.length} notas. Descarga un respaldo de vez en cuando: si borras los datos del navegador o cambias de teléfono, es lo único que los recupera.</p>
      <div class="row"><button class="btn pri" id="aE">Descargar respaldo</button><button class="btn" id="aI">Cargar respaldo</button></div>
      <input type="file" id="aF" accept=".json,application/json" class="hide">
      <div class="row" style="margin-top:14px"><button class="btn danger" id="aB">Borrar todo</button></div></div></div>`;
  $("#aN").onchange=e=>{S.nombre=e.target.value.trim();save();toast("Guardado");};
  $("#aT").onchange=e=>{S.tema=e.target.value;save();tema();};
  const on=$("#aOn"); if(on) on.onclick=async()=>{await pedirPermiso();render();};
  const pr=$("#aPr"); if(pr) pr.onclick=()=>notificar("Así se ve un aviso","Recordatorio de prueba","prueba");
  $("#aIcs").onclick=()=>{ const b=[...S.eventos.map(icsEvento),...S.recs.filter(r=>!r.hecho&&r.fecha).map(icsRec)];
    if(!b.length) return toast("No hay nada con fecha todavía"); bajarIcs(b,"mi-agenda"); };
  $("#aE").onclick=()=>bajar(new Blob([JSON.stringify({app:"personal",exportado:new Date().toISOString(),datos:S},null,1)],{type:"application/json"}),"personal-respaldo-"+hoy()+".json");
  $("#aI").onclick=()=>$("#aF").click();
  $("#aF").onchange=async e=>{const f=e.target.files[0]; if(!f) return;
    try{const j=JSON.parse(await f.text()),d=j.datos||j; if(!Array.isArray(d.notas)) throw 0;
      const x=normalizar(d);
      if(!confirm(`El respaldo tiene ${x.eventos.length} eventos, ${x.recs.length} recordatorios y ${x.notas.length} notas. Sustituirá lo que hay ahora. ¿Seguir?`)) return;
      S=x; save(); tema(); render(); toast("Respaldo cargado");
    }catch(_){toast("Ese archivo no es un respaldo de Personal");} e.target.value="";};
  $("#aB").onclick=()=>{ if(confirm("Se borrarán todos los eventos, recordatorios y notas de este aparato. ¿Seguro?")){const c=S;S=fresh();S.tema=c.tema;S.nombre=c.nombre;save();render();toast("Todo borrado",()=>{S=c;save();render();});} };
}

/* ---------- diálogo ---------- */
const dlg=$("#dlg");
const cab=t=>`<div class="dlg-h"><h3>${t}</h3><button type="button" class="icon-btn" data-close aria-label="Cerrar">${ICON.x}</button></div>`;
function abrir(html,alMontar){ if(dlg.open) dlg.close(); dlg.innerHTML=html; dlg.showModal(); dlg.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>dlg.close()); alMontar&&alMontar(dlg); }
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();});
function tema(){ document.documentElement.dataset.theme=S.tema==="light"?"light":"dark"; $('meta[name="theme-color"]').content=S.tema==="light"?"#f6f4f9":"#121016"; }

/* ---------- arranque ---------- */
window.addEventListener("storage",e=>{if(e.key===KEY){load();if(!dlg.open)render();badge();}});
let diaVisto=hoy();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(hoy()!==diaVisto){ diaVisto=hoy(); diaSel=hoy(); mesCal=hoy().slice(0,7); if(!dlg.open) render(); } revisarAvisos(); } });
load(); tema(); badge(); ir("hoy");
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
revisarAvisos(); setInterval(revisarAvisos,20000);
</script>
