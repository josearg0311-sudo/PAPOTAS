<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ff5f8f"/>
      <stop offset=".40" stop-color="#e11d48"/>
      <stop offset="1"   stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="luz" cx=".24" cy=".14" r=".9">
      <stop offset="0"  stop-color="#fff" stop-opacity=".26"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- La P de PAPOTAS. El hueco del ojo no es redondo: es un play.
         El ojo se dibuja con el lado izquierdo recto -lo tapa el asta-,
         porque redondearlo dejaba una muesca donde se juntan los dos. -->
    <mask id="pe">
      <rect width="512" height="512" fill="#000"/>
      <rect x="146" y="100" width="62" height="312" rx="18" fill="#fff"/>
      <path d="M146 100 H274 a104 104 0 0 1 0 208 H146 Z" fill="#fff"/>
      <path d="M246 182 L300 208 L246 234 Z" fill="#000" stroke="#000"
            stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#aurora)"/>
  <rect width="512" height="512" rx="116" fill="url(#luz)"/>
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none"
        stroke="url(#filo)" stroke-width="10"/>
  <rect width="512" height="512" fill="#fff" mask="url(#pe)"/>
</svg>
