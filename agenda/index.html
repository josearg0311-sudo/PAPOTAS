<script>
/* Tema ANTES de pintar, para que no parpadee. Lee la preferencia nueva y,
   si aún no existe, la que tenías en la versión anterior. */
(function(){
  try{
    var p = JSON.parse(localStorage.getItem('agenda5_pref') || 'null'), t = p && p.tema;
    if(!t){ var v = JSON.parse(localStorage.getItem('agenda_pref') || '{}') || {}; t = v.temaAuto ? 'auto' : (localStorage.getItem('agenda_tema') || 'auto'); }
    if(t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
    document.documentElement.setAttribute('data-tema', t === 'claro' ? 'claro' : 'oscuro');
    if(p && p.guia) document.documentElement.classList.add('guia-previa');
  }catch(e){}
})();
</script>
