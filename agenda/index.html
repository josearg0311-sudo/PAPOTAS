<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apuntes</title>
<meta name="description" content="Listas, recordatorios y agenda. Sincroniza en tiempo real entre tus aparatos.">
<meta name="theme-color" content="#0B0F15" id="metaTema">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" href="icono.svg?v=1" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=1" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apuntes">
<style>
/* ==========================================================================
   APUNTES · listas, recordatorios y agenda
   Hermana de Apuntado: mismo azul marino, naranja de acento y tipografía.
   ========================================================================== */
:root,:root[data-tema="noche"]{
  --fondo:#0B0F15; --sup:#121821; --sup2:#19212C; --sup3:#222C39;
  --borde:rgba(170,200,235,.08); --borde2:rgba(170,200,235,.15);
  --tinta:#EEF3F8; --tinta2:#A9B6C6; --tinta3:#6C7B8E;
  --azul:#5AA9F0; --azul-g:#3A8DDE; --azul-s:rgba(90,169,240,.12); --azul-t:rgba(90,169,240,.3);
  --nar:#F0954A; --nar-g:#CC7726; --nar-s:rgba(240,149,74,.12); --nar-t:rgba(240,149,74,.32);
  --ok:#4CC38A; --ok-s:rgba(76,195,138,.12); --mal:#F0705A; --mal-s:rgba(240,112,90,.12);
  --degradado:linear-gradient(135deg,#3A86E8,#1D4E9E);
  --sombra:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  --radio:16px; --radio2:12px;
  --display:"Space Grotesk",system-ui,sans-serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-tema="dia"]{
  --fondo:#EEF1F5; --sup:#FFFFFF; --sup2:#F4F6F9; --sup3:#E8ECF2;
  --borde:rgba(15,30,55,.09); --borde2:rgba(15,30,55,.16);
  --tinta:#0F1722; --tinta2:#475467; --tinta3:#8391A3;
  --azul:#1F6FC5; --azul-g:#1F6FC5; --azul-s:rgba(31,111,197,.09); --azul-t:rgba(31,111,197,.22);
  --nar:#C76A12; --nar-g:#C76A12; --nar-s:rgba(199,106,18,.09); --nar-t:rgba(199,106,18,.24);
  --ok:#14915A; --ok-s:rgba(20,145,90,.1); --mal:#C9432D; --mal-s:rgba(201,67,45,.09);
  --degradado:linear-gradient(135deg,#2F74D6,#173F80);
  --sombra:0 1px 2px rgba(20,20,60,.05), 0 16px 36px -22px rgba(20,20,60,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tinta);font:15px/1.5 var(--sans);font-weight:500;
  background:radial-gradient(1000px 520px at 80% -10%, rgba(47,111,216,.18), transparent 62%),
    linear-gradient(rgba(170,200,235,.03) 1px, transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg, rgba(170,200,235,.03) 1px, transparent 1px) 0 0/32px 100%, var(--fondo);
  background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom)}
:root[data-tema="dia"] body{background:radial-gradient(1000px 520px at 80% -10%, rgba(47,111,216,.09), transparent 62%),linear-gradient(rgba(15,30,55,.03) 1px, transparent 1px) 0 0/100% 32px,linear-gradient(90deg, rgba(15,30,55,.03) 1px, transparent 1px) 0 0/32px 100%,var(--fondo);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.oculto{display:none!important}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
::selection{background:rgba(47,111,216,.45)}
svg.i{width:18px;height:18px;flex:none}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Botones */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--borde2);background:var(--sup2);color:var(--tinta);
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;line-height:1.1;white-space:nowrap;transition:background .15s,transform .08s}
.bt:hover{background:var(--sup3)} .bt:active{transform:scale(.97)} .bt:disabled{opacity:.4;cursor:not-allowed}
.bt svg{width:16px;height:16px;flex:none}
.bt.tinta{background:var(--degradado);border:0;color:#fff;box-shadow:0 10px 24px -10px rgba(47,111,216,.6)}
.bt.nar{background:linear-gradient(135deg,#F0954A,#C2621A);border:0;color:#fff}
.bt.peligro{color:var(--mal);border-color:var(--mal-s);background:var(--mal-s)}
.bt.plano{border-color:transparent;background:transparent} .bt.plano:hover{background:var(--sup2)}
.bt.chico{padding:7px 12px;font-size:13px}
.bt.icono{width:38px;height:38px;padding:0;border-radius:50%}
.bt.icono svg{width:18px;height:18px}

/* Cabecera */
.cab{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:20px 18px 6px}
.marca{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.marca svg{width:42px;height:42px;flex:none;filter:drop-shadow(0 6px 14px rgba(47,111,216,.35))}
.marca h1{margin:0;font:700 21px/1.1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.marca small{display:block;font-size:12.5px;font-weight:600;color:var(--tinta3);margin-top:2px;white-space:nowrap}
.marca small::first-letter{text-transform:uppercase}
.pastilla{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borde2);background:var(--sup);padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--tinta2);white-space:nowrap}
.pastilla svg{width:16px;height:16px}
.pastilla i{width:7px;height:7px;border-radius:50%;background:var(--tinta3);display:none}
.pastilla[data-e="busy"] i{display:block;background:#E8B84A;animation:late 1s infinite}
.pastilla[data-e="err"] i{display:block;background:var(--mal)}
.pastilla[data-vivo="1"]{color:var(--ok)}
.pastilla[data-vivo="1"] i{display:block;background:var(--ok);animation:latido 2s ease-in-out infinite}
@keyframes late{50%{opacity:.3}}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(76,195,138,.55)}50%{box-shadow:0 0 0 6px rgba(76,195,138,0)}}

/* Pestañas */
.nav{max-width:880px;margin:8px auto 0;padding:0 18px}
.pestanas{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--sup);border:1px solid var(--borde);box-shadow:var(--sombra)}
.pestanas button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;padding:10px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--tinta3);transition:background .15s,color .15s}
.pestanas button svg{width:18px;height:18px}
.pestanas button[aria-selected="true"]{background:var(--tinta);color:var(--fondo)}
.pestanas .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--nar);color:#1A1205;font:800 11.5px var(--sans);display:inline-flex;align-items:center;justify-content:center}

/* Contenido */
main{max-width:880px;margin:14px auto 0;padding:0 18px 130px;display:flex;flex-direction:column;gap:14px}
.tarjeta{border-radius:var(--radio);background:var(--sup);border:1px solid var(--borde);box-shadow:var(--sombra);padding:16px 18px}
.t-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.t-cab h2,.t-cab h3{margin:0;font:700 16px var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.tic{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--azul-s);color:var(--azul);flex:none}
.tic svg{width:16px;height:16px}
.tic.nar{background:var(--nar-s);color:var(--nar)} .tic.ok{background:var(--ok-s);color:var(--ok)} .tic.mal{background:var(--mal-s);color:var(--mal)}
.vacio{text-align:center;padding:30px 16px;color:var(--tinta3);font-weight:600}
.vacio b{display:block;font:700 18px var(--display);color:var(--tinta);margin:8px 0 4px}
.faltan{font-size:13px;color:var(--tinta3);font-weight:600}

/* Hoy: cabecera grande */
.dia-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dia-hero .gr{font:700 46px/1 var(--display);letter-spacing:-.04em}
.dia-hero .gr small{display:block;font:600 14px var(--sans);color:var(--tinta3);letter-spacing:0;margin-top:6px}
.resumen-dia{display:flex;gap:8px;flex-wrap:wrap}
.resumen-dia span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:var(--sup2);border:1px solid var(--borde);font-size:13px;font-weight:700;color:var(--tinta2)}
.resumen-dia b{font-family:var(--display);color:var(--tinta)}
.resumen-dia .nar b{color:var(--nar)}

/* Apunte rápido */
.apunte{border-radius:var(--radio);background:var(--sup);border:1px solid var(--borde);box-shadow:var(--sombra);padding:6px 6px 6px;transition:border-color .15s,box-shadow .15s}
.apunte:focus-within{border-color:var(--azul-t);box-shadow:0 0 0 4px rgba(47,111,216,.14),var(--sombra)}
.apunte-fila{display:flex;align-items:center;gap:6px}
.apunte-ic{width:36px;display:flex;justify-content:center;color:var(--tinta3)}
.apunte-in{flex:1;min-width:0;border:0;background:transparent;font:600 16px var(--sans);padding:10px 4px;outline:none}
.apunte-in::placeholder{color:var(--tinta3)}
.apunte-voz,.apunte-ok{width:40px;height:40px;border-radius:12px;border:1px solid var(--borde);background:var(--sup2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--tinta2)}
.apunte-ok{background:var(--degradado);border:0;color:#fff}
.apunte-voz.oyendo{background:var(--nar-s);border-color:var(--nar);animation:late 1s infinite}
.apunte-vista{font-size:12.5px;color:var(--tinta2);padding:2px 10px 6px 46px;font-weight:600;display:none}
.apunte-vista.ok{display:block}
.apunte-vista b{color:var(--tinta)}
.apunte-vista .pista{color:var(--tinta3)}
.apunte-vista kbd{font:700 10.5px var(--display);border:1px solid var(--borde2);border-radius:5px;padding:0 5px;margin-left:4px;color:var(--tinta3)}

/* Elementos (tareas y citas) */
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 8px;border-radius:14px;cursor:pointer;transition:background .12s;position:relative;touch-action:pan-y}
.item:hover{background:rgba(170,200,235,.04)}
.item.sel{background:rgba(47,111,216,.16)}
.item.nuevo{animation:brillo 1.6s ease-out}
@keyframes brillo{0%{background:rgba(232,184,74,.22)}100%{background:transparent}}
.marca-ck{grid-row:1/3;width:26px;height:26px;border-radius:50%;border:2px solid var(--borde2);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none;transition:all .15s;color:transparent}
.marca-ck:hover{border-color:var(--azul)}
.marca-ck svg{width:15px;height:15px}
.item.hecho .marca-ck{background:var(--ok);border-color:var(--ok);color:#06210F}
.item .hora-ev{grid-row:1/3;width:52px;text-align:center;padding:4px 0;border-radius:10px;background:var(--azul-s);color:var(--azul);font:700 13px/1.1 var(--display)}
.item .hora-ev small{display:block;font:600 10.5px var(--sans);color:var(--tinta3);margin-top:2px}
.item .hora-ev.todo{font-size:11px}
.item .tx{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.item.hecho .tx{text-decoration:line-through;color:var(--tinta3)}
.item .sub{grid-column:2;font-size:12.5px;color:var(--tinta3);font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .sub .atras{color:var(--mal)}
.item .sub .pronto{color:var(--nar)}
.item .der{grid-column:3;grid-row:1/3;display:flex;gap:2px;align-items:center}
.item .der button{border:0;background:transparent;width:32px;height:32px;border-radius:9px;color:var(--tinta3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s}
.item:hover .der button,.item .der button:focus-visible{opacity:1}
.item .der button:hover{background:var(--sup3);color:var(--tinta)}
.item .der svg{width:16px;height:16px}
.chipi{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sup2);color:var(--tinta2)}
.chipi svg{width:12px;height:12px}
.selmode .marca-ck{border-radius:7px}
.grupo-t{display:flex;justify-content:space-between;align-items:baseline;padding:14px 8px 4px;font:700 13px var(--display);color:var(--tinta2)}
.grupo-t:first-child{padding-top:2px}
.grupo-t.mal{color:var(--mal)}

/* Listas */
.listas{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lista-c{position:relative;text-align:left;border:1px solid var(--borde);border-radius:var(--radio);padding:16px;min-height:118px;display:flex;flex-direction:column;gap:6px;color:var(--tinta);
  background:radial-gradient(120% 120% at 100% 0%, color-mix(in srgb, var(--c) 28%, transparent), transparent 60%), var(--sup);box-shadow:var(--sombra);transition:transform .15s,border-color .15s}
.lista-c:hover{transform:translateY(-2px);border-color:var(--borde2)}
.lista-c .em{font-size:26px;line-height:1}
.lista-c b{font:700 16px var(--display);letter-spacing:-.01em}
.lista-c small{font-size:12.5px;color:var(--tinta3);font-weight:600}
.lista-c .barra{height:5px;border-radius:5px;background:var(--sup3);overflow:hidden;margin-top:auto}
.lista-c .barra i{display:block;height:100%;background:var(--c);border-radius:5px}
.lista-c.nueva{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--tinta2);box-shadow:none}
.lista-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lista-cab .em{font-size:30px}
.lista-cab h2{margin:0;font:700 24px var(--display);letter-spacing:-.02em;flex:1;min-width:0}
.prog{font-size:13px;color:var(--tinta3);font-weight:700}

/* Agenda */
.cal-cab{display:flex;align-items:center;gap:8px}
.cal-cab h2{margin:0;flex:1;font:700 20px var(--display);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-ds{text-align:center;font-size:11px;font-weight:800;color:var(--tinta3);padding:4px 0}
.cal-d{height:58px;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 14px var(--display);color:var(--tinta);padding:0;position:relative}
.cal-d:hover{background:var(--sup2)}
.cal-d.otro{color:var(--tinta3);opacity:.5}
.cal-d.hoy{color:var(--azul);border-color:var(--azul-t)}
.cal-d.vivo{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.cal-d .pts{display:flex;gap:3px;height:6px}
.cal-d .pts i{width:5px;height:5px;border-radius:50%;background:var(--azul)}
.cal-d .pts i.n{background:var(--nar)}
.cal-d.vivo .pts i{box-shadow:0 0 0 1.5px var(--tinta)}

/* Barra de selección, flotante, aviso */
.selbar{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  background:var(--sup3);border:1px solid var(--borde2);padding:9px 10px 9px 18px;border-radius:999px;box-shadow:0 20px 40px -12px rgba(0,0,0,.7);max-width:calc(100vw - 24px);font-weight:700;font-size:14px}
.barra-fija{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.barra-fija .bt{pointer-events:auto;padding:15px 24px;font-size:15px;box-shadow:0 16px 30px -10px rgba(47,111,216,.7)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;background:var(--sup3);border:1px solid var(--borde2);padding:12px 14px;border-radius:16px;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:700;transition:.25s;pointer-events:none;max-width:calc(100vw - 24px);box-shadow:0 20px 40px -12px rgba(0,0,0,.7)}
.toast::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px var(--ok-s)}
.toast.ver{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:var(--tinta);color:var(--fondo);font-weight:800;padding:6px 12px;border-radius:99px}
.hecho-anim{position:fixed;left:50%;top:42%;z-index:90;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;pointer-events:none;animation:pop .8s cubic-bezier(.2,.9,.3,1.3) forwards}
.hecho-anim svg{width:44px;height:44px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.06);opacity:1}70%{opacity:1}100%{transform:scale(.9);opacity:0}}

/* Diálogos */
dialog{border:1px solid var(--borde2);background:var(--sup);color:var(--tinta);padding:0;border-radius:18px;box-shadow:0 40px 90px -30px rgba(0,0,0,.85);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,5,12,.6);backdrop-filter:blur(6px)}
:root[data-tema="dia"] dialog::backdrop{background:rgba(30,30,60,.35)}
dialog[open]{animation:aparece .22s cubic-bezier(.2,.8,.3,1)}
@keyframes aparece{from{opacity:0;transform:translateY(14px) scale(.98)}}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dlg-cab{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.dlg-cab h3{font:700 22px/1.15 var(--display);margin:0;letter-spacing:-.02em;flex:1}
.dlg-cab p{margin:4px 0 0;font-size:13px;color:var(--tinta3);font-weight:600}
.dlg-cuerpo{padding:8px 22px 16px;overflow:auto}
.dlg-pie{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--borde);background:var(--sup2);border-radius:0 0 18px 18px}
.dlg-pie .crece{flex:1}
.x{border:0;background:var(--sup2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--tinta2);padding:0;flex:none}
label.et{display:block;font-size:12px;font-weight:800;color:var(--tinta2);margin:0 0 7px}
.campo{border:1px solid var(--borde2);background:var(--sup2);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;min-width:0;width:100%}
.campo:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(47,111,216,.2)}
.campo::placeholder{color:var(--tinta3)}
textarea.campo{resize:vertical;min-height:70px}
select.campo{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--tinta3) 50%),linear-gradient(135deg,var(--tinta3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.campo option{background:var(--sup);color:var(--tinta)}
input[type="date"].campo,input[type="time"].campo{color-scheme:inherit}
.grupo{margin-bottom:14px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--sup2);border:1px solid var(--borde)}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--tinta3)}
.seg button[aria-pressed="true"]{background:var(--sup);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.2),0 0 0 1px var(--borde2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde2);background:var(--sup2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.colores{display:flex;flex-wrap:wrap;gap:8px}
.colores button{width:32px;height:32px;border-radius:10px;border:0;background:var(--c)}
.colores button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sup),0 0 0 4px var(--tinta)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.emojis button{height:40px;border-radius:10px;border:1px solid var(--borde);background:var(--sup2);font-size:20px}
.emojis button[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-s)}
.ayuda{font-size:12.5px;color:var(--tinta3);margin:6px 0 0;font-weight:600}
.alerta{font-size:13px;font-weight:600;padding:11px 14px;border-radius:12px;background:var(--azul-s);border:1px solid var(--azul-t)}
.cuadro{border-radius:14px;padding:12px 14px;background:var(--sup2);border:1px solid var(--borde)}
.cuadro .fila{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14px;font-weight:600}
.codigo{font:600 12.5px var(--display);word-break:break-all;background:var(--sup2);border:1px dashed var(--borde2);border-radius:12px;padding:12px;user-select:all}
.pasos-nube{margin:0;padding-left:20px;font-size:14px;color:var(--tinta2);font-weight:600}
.pasos-nube li{margin-bottom:6px} .pasos-nube a{color:var(--azul)}

/* Menú */
.menu{position:fixed;z-index:60;background:var(--sup2);border:1px solid var(--borde2);box-shadow:0 24px 50px -16px rgba(0,0,0,.7);border-radius:16px;min-width:250px;padding:6px;max-width:calc(100vw - 20px)}
.menu button{display:flex;width:100%;align-items:flex-start;gap:12px;border:0;background:transparent;padding:10px 12px;text-align:left;border-radius:10px;font-size:14px;font-weight:700}
.menu button:hover{background:var(--sup3)}
.menu button svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--tinta2)}
.menu button small{display:block;color:var(--tinta3);font-size:12px;font-weight:600}
.menu button.peligro,.menu button.peligro svg{color:var(--mal)}
.menu hr{border:0;border-top:1px solid var(--borde);margin:5px 0}
.menu .tit{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3);padding:8px 12px 4px}

@media (max-width:720px){
  .cab{padding:14px 14px 4px}
  .marca svg{width:38px;height:38px}
  .marca h1{font-size:19px}
  .pastilla span{display:none} .pastilla{padding:10px}
  .nav{padding:0 12px}
  .pestanas button{padding:10px 6px;font-size:13px}
  main{padding:0 12px 130px}
  .dia-hero .gr{font-size:38px}
  .listas{grid-template-columns:repeat(2,1fr);gap:10px}
  .item .der{display:none}
  .cal-d{height:auto;aspect-ratio:1/1;min-height:42px}
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0;border:0}
  .dlg{max-height:100dvh;height:100dvh} .dlg-cuerpo{flex:1} .dlg-pie{border-radius:0}
  .dlg-cab,.dlg-cuerpo,.dlg-pie{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
/* ==========================================================================
   APUNTES · datos
   db = { v:1, listas:[Lista], items:[Item] }
   Lista = { id, nom, emo, col, o, upd, borr }
   Item  = { id, tipo:'tarea'|'evento', txt, lista, fecha, hora, fin, aviso,
             rep:''|'d'|'l'|'s'|'m'|'a', lugar, nota, hecho, hechoEn, k, upd, borr }
   upd y borr permiten mezclar sin perder nada al sincronizar.
   ========================================================================== */
const K_DATOS = 'apuntes_datos_v1', K_PREF = 'apuntes_pref_v1', K_NUBE = 'apuntes_nube_v1';
const COLORES = ['#3A8DDE','#F0954A','#16B8A6','#8B6CFF','#E8B21C','#E05A6B','#4CC38A','#64748B'];
const EMOS = '📝🛒✅💼🏠📚💊🎁✈️🏋️🍳🐶💡🎯🧾🛠️🎉💰📞🚗'.match(/\p{Extended_Pictographic}️?/gu);
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIA3 = ['dom','lun','mar','mié','jue','vie','sáb'];

let db = { v:1, listas:[], items:[] };
let pref = { tema:'noche', vista:'hoy', lista:null, verHechas:false };
let seleccion = new Set(), modoSel = false, calMes = null, calDia = null, ultimoNuevo = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ahora = () => Date.now();
const normal = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function hoy(){ return iso(new Date()); }
function aFecha(f){ const [a,m,d] = f.split('-').map(Number); return new Date(a, m-1, d); }
function sumarDias(f, n){ const d = aFecha(f); d.setDate(d.getDate() + n); return iso(d); }
function diasEntre(a, b){ return Math.round((aFecha(b) - aFecha(a)) / 864e5); }
function nombreDia(f){
  const n = diasEntre(hoy(), f);
  if(n === 0) return 'Hoy'; if(n === 1) return 'Mañana'; if(n === -1) return 'Ayer';
  const d = aFecha(f);
  const base = DIA3[d.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + d.getDate() + ' ' + MES3[d.getMonth()];
  return d.getFullYear() !== new Date().getFullYear() ? base + ' ' + d.getFullYear() : base;
}
function fLarga(f){ const d = aFecha(f); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }

/* ---------- Repeticiones ---------- */
function siguiente(f, rep){
  const d = aFecha(f);
  if(rep === 'd') d.setDate(d.getDate() + 1);
  else if(rep === 'l'){ let n = 0; do d.setDate(d.getDate() + 1); while((d.getDay() === 0 || d.getDay() === 6) && ++n < 7); }
  else if(rep === 's') d.setDate(d.getDate() + 7);
  else if(rep === 'm'){ const dia = aFecha(f).getDate(); d.setMonth(d.getMonth() + 1, 1); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  else if(rep === 'a') d.setFullYear(d.getFullYear() + 1);
  return iso(d);
}
/* Las veces que algo cae entre dos fechas (para la agenda y los avisos) */
function ocurrencias(it, desde, hasta){
  if(!it.fecha) return [];
  if(!it.rep) return it.fecha >= desde && it.fecha <= hasta ? [it.fecha] : [];
  if(it.tipo === 'tarea') return it.fecha >= desde && it.fecha <= hasta ? [it.fecha] : [];   /* la tarea repetida avanza al completarla */
  const out = []; let f = it.fecha, n = 0;
  while(f <= hasta && n++ < 800){ if(f >= desde) out.push(f); f = siguiente(f, it.rep); }
  return out;
}
const REP_TXT = { d:'cada día', l:'de lunes a viernes', s:'cada semana', m:'cada mes', a:'cada año' };

/* ==========================================================================
   LENGUAJE NATURAL: «dentista mañana 10am», «comprar pan #compras»,
   «pagar luz el 20», «reunión viernes 3:30pm», «gimnasio cada lunes 7am»
   ========================================================================== */
function leerFrase(txt){
  let t = ' ' + String(txt || '').trim() + ' ';
  if(!t.trim()) return null;
  const r = { txt:'', fecha:'', hora:'', rep:'', lista:'', tipo:'tarea' };
  const quita = re => { const m = t.match(re); if(m){ t = t.replace(m[0], ' '); } return m; };
  /* #lista */
  let m = quita(/\s#([\p{L}\p{N}_-]+)/u);
  if(m){ const n = normal(m[1]); const l = listas().find(x => normal(x.nom).replace(/\s+/g, '') === n || normal(x.nom).startsWith(n)); r.lista = l ? l.id : '#' + m[1]; }
  const nt = () => normal(t);
  /* Repetición */
  const DS = { domingo:0, lunes:1, martes:2, miercoles:3, jueves:4, viernes:5, sabado:6 };
  if((m = nt().match(/\b(todos los dias|cada dia|diario|diariamente)\b/))){ t = t.replace(new RegExp(m[0].replace(/i/g, '[ií]'), 'i'), ' '); r.rep = 'd'; }
  else if((m = nt().match(/\b(entre semana|de lunes a viernes)\b/))){ t = t.replace(new RegExp(m[0], 'i'), ' '); r.rep = 'l'; }
  else if((m = nt().match(/\b(cada|todos los) (lunes|martes|miercoles|jueves|viernes|sabados?|domingos?)\b/))){
    const dia = m[2].replace(/^(sabado|domingo)s$/, '$1'); t = t.replace(new RegExp(m[0].replace(/e/g, '[eé]').replace(/a/g, '[aá]'), 'i'), ' ');
    r.rep = 's'; let f = hoy(); for(let n = 0; n < 7 && aFecha(f).getDay() !== DS[dia]; n++) f = sumarDias(f, 1); r.fecha = f;
  }
  else if((m = nt().match(/\b(cada semana|semanal|semanalmente)\b/))){ t = t.replace(new RegExp(m[0], 'i'), ' '); r.rep = 's'; }
  else if((m = nt().match(/\b(cada mes|mensual|mensualmente|todos los meses)\b/))){ t = t.replace(new RegExp(m[0], 'i'), ' '); r.rep = 'm'; }
  else if((m = nt().match(/\b(cada ano|anual|todos los anos)\b/))){ t = t.replace(new RegExp(m[0].replace(/ano/g, 'a[ñn]o'), 'i'), ' '); r.rep = 'a'; }
  /* Hora: 10am, 3:30pm, 15:30, a las 8, 8 de la noche, mediodía */
  if((m = quita(/\s(?:a las?\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.|hrs?|h)(?=\s)/i)) ){
    let H = +m[1]; const M = +(m[2] || 0), suf = m[3].toLowerCase();
    if(/p/.test(suf) && H < 12) H += 12; if(/a/.test(suf) && H === 12) H = 0;
    if(H < 24 && M < 60) r.hora = String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0');
  } else if((m = quita(/\s(?:a las?\s+)?(\d{1,2}):(\d{2})(?=\s)/i))){
    const H = +m[1], M = +m[2]; if(H < 24 && M < 60) r.hora = String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0');
  } else if((m = t.match(/\sa las?\s+(\d{1,2})(?:\s+de la\s+(mañana|manana|tarde|noche))?(?=\s)/i))){
    t = t.replace(m[0], ' '); let H = +m[1]; const p = normal(m[2] || '');
    if((p === 'tarde' || p === 'noche') && H < 12) H += 12; else if(!p && H >= 1 && H <= 7) H += 12;
    if(H < 24) r.hora = String(H).padStart(2,'0') + ':00';
  } else if((m = quita(/\s(mediod[ií]a)(?=\s)/i))) r.hora = '12:00';
  /* Fecha */
  const n2 = nt();
  if((m = n2.match(/\bpasado manana\b/))){ t = t.replace(/pasado\s+ma[ñn]ana/i, ' '); r.fecha = sumarDias(hoy(), 2); }
  else if(/\bmanana\b/.test(n2) && !/\bde la manana\b/.test(n2)){ t = t.replace(/\bma[ñn]ana\b/i, ' '); r.fecha = sumarDias(hoy(), 1); }
  else if(/\bhoy\b/.test(n2)){ t = t.replace(/\bhoy\b/i, ' '); r.fecha = hoy(); }
  else if(/\besta noche\b/.test(n2)){ t = t.replace(/esta noche/i, ' '); r.fecha = hoy(); if(!r.hora) r.hora = '20:00'; }
  else if((m = n2.match(/\b(?:el\s+)?(?:proximo\s+)?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/)) && !r.fecha){
    t = t.replace(new RegExp('(?:el\\s+)?(?:pr[oó]ximo\\s+)?' + m[1].replace(/e/g, '[eé]').replace(/a/g, '[aá]'), 'i'), ' ');
    let f = sumarDias(hoy(), 1); for(let n = 0; n < 7 && aFecha(f).getDay() !== DS[m[1]]; n++) f = sumarDias(f, 1); r.fecha = f;
  }
  else if((m = t.match(/\s(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?(?=\s)/))){
    t = t.replace(m[0], ' '); const a = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : new Date().getFullYear();
    let f = iso(new Date(a, +m[2] - 1, +m[1])); if(!m[3] && f < hoy()) f = iso(new Date(a + 1, +m[2] - 1, +m[1])); r.fecha = f;
  }
  else if((m = t.match(/\s(?:el\s+)?(\d{1,2})\s+de\s+([a-záéíóú]+)(?=\s)/i)) && MESES.includes(normal(m[2]))){
    t = t.replace(m[0], ' '); const mes = MESES.indexOf(normal(m[2])); const a = new Date().getFullYear();
    let f = iso(new Date(a, mes, +m[1])); if(f < hoy()) f = iso(new Date(a + 1, mes, +m[1])); r.fecha = f;
  }
  else if((m = t.match(/\sel\s+(\d{1,2})(?=\s)/i))){
    t = t.replace(m[0], ' '); const d = new Date(); let f = iso(new Date(d.getFullYear(), d.getMonth(), +m[1]));
    if(f < hoy()) f = iso(new Date(d.getFullYear(), d.getMonth() + 1, +m[1])); r.fecha = f;
  }
  else if((m = n2.match(/\ben (\d{1,2}) dias?\b/))){ t = t.replace(/\ben\s+\d{1,2}\s+d[ií]as?/i, ' '); r.fecha = sumarDias(hoy(), +m[1]); }
  else if(/\b(la )?(proxima|siguiente) semana\b/.test(n2)){ t = t.replace(/(la\s+)?(pr[oó]xima|siguiente)\s+semana/i, ' '); r.fecha = sumarDias(hoy(), 7); }
  if(r.hora && !r.fecha) r.fecha = r.hora > new Date().toTimeString().slice(0, 5) ? hoy() : sumarDias(hoy(), 1);
  if(r.rep && !r.fecha) r.fecha = hoy();
  if(r.rep === 'l' && r.fecha){ for(let n = 0; n < 3 && [0, 6].includes(aFecha(r.fecha).getDay()); n++) r.fecha = sumarDias(r.fecha, 1); }
  /* Citas: palabras típicas de un evento con hora */
  const ntx = normal(t);
  if(r.hora && /\b(cita|reunion|junta|dentista|doctor|medico|clase|cumple|cumpleanos|cena|almuerzo|vuelo|entrevista|partido|evento|fiesta|boda|consulta|llamada)\b/.test(ntx)) r.tipo = 'evento';
  r.txt = t.replace(/\s+(a|el|la|para|de)\s*$/i, '').replace(/\s+/g, ' ').trim().replace(/^[,.:-]\s*/, '');
  if(r.txt) r.txt = r.txt.charAt(0).toUpperCase() + r.txt.slice(1);
  return r;
}

  if(prox.length){

  const porDia = new Map();

function marcar(id){
  const it = db.items.find(x => x.id === id); if(!it || it.tipo !== 'tarea') return;
  if(!it.hecho && it.rep && it.fecha){
    /* Repetida: no se tacha, salta a la próxima vez */
    const antes = it.fecha; it.fecha = siguiente(it.fecha, it.rep); tocar(it); guardar(); celebrar(); pintar();
    aviso('Hecho. La próxima es ' + nombreDia(it.fecha).toLowerCase() + '.', () => { it.fecha = antes; tocar(it); guardar(); pintar(); });
    return;
  }
  it.hecho = !it.hecho; it.hechoEn = it.hecho ? hoy() : ''; tocar(it); guardar();
  if(it.hecho) celebrar();
  pintar();
  if(it.hecho) aviso('¡Hecho! ' + it.txt, () => { it.hecho = false; it.hechoEn = ''; tocar(it); guardar(); pintar(); });
}
function borrarItems(ids){
  const t = ahora(), lst = ids.map(id => db.items.find(x => x.id === id)).filter(x => x && !x.borr);
  if(!lst.length) return;
  lst.forEach(x => { x.borr = 1; x.upd = t; });
  guardar(); seleccion.clear(); modoSel = false; pintar();
  aviso(lst.length === 1 ? 'Borrado.' : lst.length + ' borrados.', () => { const t2 = ahora(); lst.forEach(x => { delete x.borr; x.upd = t2; }); guardar(); pintar(); });
}

/* ==========================================================================
   AVISOS
   El navegador solo puede avisar mientras la app está abierta (o en segundo
   plano reciente). Para que suene SIEMPRE, «A mi calendario» crea un .ics con
   alarma que el teléfono guarda en su agenda.
   ========================================================================== */
const K_AVISADOS = 'apuntes_avisados';
function pedirPermisoAvisos(){
  if(!('Notification' in window) || Notification.permission !== 'default') return;
  Notification.requestPermission().then(p => { if(p === 'granted') aviso('Listo: te avisaré con una notificación.'); });
}
function revisarAvisos(){
  const n = new Date(), h = hoy(), avisados = (() => { try{ return JSON.parse(localStorage.getItem(K_AVISADOS) || '{}'); }catch(e){ return {}; } })();
  let cambio = false;
  items().forEach(it => {
    if(it.aviso === '' || it.aviso == null || !it.hora || (it.tipo === 'tarea' && it.hecho)) return;
    ocurrencias(it, sumarDias(h, -1), sumarDias(h, 2)).forEach(f => {
      const [H, M] = it.hora.split(':').map(Number), cuando = aFecha(f); cuando.setHours(H, M, 0, 0);
      const alarma = cuando.getTime() - (+it.aviso) * 60000, clave = it.id + '|' + f;
      if(n.getTime() >= alarma && n.getTime() - alarma < 6 * 3600000 && !avisados[clave]){
        avisados[clave] = ahora(); cambio = true;
        const titulo = (it.tipo === 'evento' ? '📅 ' : '⏰ ') + it.txt, cuerpo = (+it.aviso ? 'En ' + textoAviso(it.aviso).replace(' antes', '') + ' · ' : 'Ahora · ') + hora12(it.hora) + (it.lugar ? ' · ' + it.lugar : '');
        notificar(titulo, cuerpo, it.id);
      }
    });
  });
  if(cambio){ const lim = ahora() - 7 * 864e5; Object.keys(avisados).forEach(k => { if(avisados[k] < lim) delete avisados[k]; }); try{ localStorage.setItem(K_AVISADOS, JSON.stringify(avisados)); }catch(e){} }
}
function notificar(titulo, cuerpo, id){
  aviso(titulo + ' — ' + cuerpo);
  if(navigator.vibrate) navigator.vibrate([120, 80, 120]);
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const opc = { body:cuerpo, icon:'icon-192.png', badge:'favicon-32.png', tag:id, renotify:true };
  if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(titulo, opc)).catch(() => { try{ new Notification(titulo, opc); }catch(e){} });
  else { try{ new Notification(titulo, opc); }catch(e){} }
}

/* ---------- Calendario del teléfono (.ics) ---------- */
function descargarIcs(lst, nombre){
  const p = n => String(n).padStart(2, '0');
  const fh = (f, h) => f.replace(/-/g, '') + (h ? 'T' + h.replace(':', '') + '00' : '');
  const ahoraIcs = (() => { const d = new Date(); return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + 'T' + p(d.getUTCHours()) + p(d.getUTCMinutes()) + '00Z'; })();
  const limpio = s => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\r?\n/g, '\\n');
  const RR = { d:'FREQ=DAILY', l:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', s:'FREQ=WEEKLY', m:'FREQ=MONTHLY', a:'FREQ=YEARLY' };
  let s = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Apuntes//ES\r\nCALSCALE:GREGORIAN\r\n';
  lst.filter(i => i.fecha).forEach(i => {
    s += 'BEGIN:VEVENT\r\nUID:' + i.id + '@apuntes\r\nDTSTAMP:' + ahoraIcs + '\r\nSUMMARY:' + limpio(i.txt) + '\r\n';
    if(i.hora){
      const finH = i.fin && i.fin > i.hora ? i.fin : (() => { const [H, M] = i.hora.split(':').map(Number); const t = H * 60 + M + (i.tipo === 'evento' ? 60 : 15); return t >= 1440 ? '23:59' : p(Math.floor(t / 60)) + ':' + p(t % 60); })();
      s += 'DTSTART:' + fh(i.fecha, i.hora) + '\r\nDTEND:' + fh(i.fecha, finH) + '\r\n';

    if(t.closest('#btApunte')){ guardarApunte(); return; }
    if(t.closest('#btVoz')){ dictar(); return; }
    const ck = t.closest('[data-ck]'); if(ck){ if(modoSel){ alternarSel(ck.dataset.ck); return; } marcar(ck.dataset.ck); return; }
    const bo = t.closest('[data-borra]'); if(bo){ borrarItems([bo.dataset.borra]); return; }
    const il = t.closest('[data-ir-lista]'); if(il){ pref.vista = 'listas'; pref.lista = il.dataset.irLista; guardarPref(); seleccion.clear(); modoSel = false; pintar(); scrollTo(0, 0); return; }
    if(t.closest('#btVolverListas')){ pref.lista = null; guardarPref(); seleccion.clear(); modoSel = false; pintar(); return; }
    if(t.closest('#btNuevaLista')){ abrirLista(); return; }
    if(t.closest('#btMenuLista')){ menuLista(t.closest('#btMenuLista')); return; }
    if(t.closest('#btVerHechas')){ pref.verHechas = !pref.verHechas; guardarPref(); pintar(); return; }
    if(t.closest('#btLimpiar')){ borrarItems(items().filter(i => i.lista === pref.lista && i.hecho).map(i => i.id)); return; }
    if(t.closest('#btModoSel')){ modoSel = !modoSel; if(!modoSel) seleccion.clear(); pintar(); return; }
    if(t.closest('#btPasarHoy')){ const at = items().filter(i => i.tipo === 'tarea' && !i.hecho && i.fecha && i.fecha < hoy()); const antes = at.map(i => [i, i.fecha]); at.forEach(i => { i.fecha = hoy(); tocar(i); }); guardar(); pintar(); aviso(at.length + ' pasadas a hoy.', () => { antes.forEach(([i, f]) => { i.fecha = f; tocar(i); }); guardar(); pintar(); }); return; }
    const cm = t.closest('[data-calmes]'); if(cm){ const [a, m] = (calMes || (calDia || hoy()).slice(0, 7)).split('-').map(Number); calMes = iso(new Date(a, m - 1 + +cm.dataset.calmes, 1)).slice(0, 7); pintar(); return; }
    const cd = t.closest('[data-caldia]'); if(cd){ calDia = cd.dataset.caldia; calMes = calDia.slice(0, 7); pintar(); return; }
    if(t.closest('#btCalHoy')){ calDia = hoy(); calMes = null; pintar(); return; }
    const nc = t.closest('[data-nueva-cita]'); if(nc){ abrirItem(null, { tipo:'evento', fecha:nc.dataset.nuevaCita }); return; }
    if(t.closest('#selNada')){ seleccion.clear(); modoSel = false; pintar(); return; }
    if(t.closest('#selBorrar')){ borrarItems([...seleccion]); return; }
    if(t.closest('#selHecho')){ const t0 = ahora(); [...seleccion].forEach(id => { const it = db.items.find(x => x.id === id); if(it && it.tipo === 'tarea' && !it.hecho){ if(it.rep && it.fecha) it.fecha = siguiente(it.fecha, it.rep); else { it.hecho = true; it.hechoEn = hoy(); } it.upd = t0; } }); const n = seleccion.size; seleccion.clear(); modoSel = false; guardar(); celebrar(); pintar(); aviso(n + ' marcados como hechos.'); return; }
    if(t.closest('#selHoy')){ [...seleccion].forEach(id => { const it = db.items.find(x => x.id === id); if(it){ it.fecha = hoy(); tocar(it); } }); seleccion.clear(); modoSel = false; guardar(); pintar(); aviso('Pasados a hoy.'); return; }
    if(t.closest('#selMover')){ const b = t.closest('#selMover'); abrirMenu(b, [{ tit:'Mover a…' }, ...listas().map(l => ({ icono:'lista', txt:l.emo + ' ' + l.nom, fn:() => { [...seleccion].forEach(id => { const it = db.items.find(x => x.id === id); if(it && it.tipo === 'tarea'){ it.lista = l.id; tocar(it); } }); seleccion.clear(); modoSel = false; guardar(); pintar(); aviso('Movidos a ' + l.nom + '.'); } }))]); return; }
    if(t.closest('#toastBt')){ const f = deshacerFn; deshacerFn = null; $('toast').classList.remove('ver'); if(f) f(); return; }
    const fila = t.closest('[data-item]');
    if(fila){ if(modoSel){ alternarSel(fila.dataset.item); return; } abrirItem(fila.dataset.item); return; }
  });
  document.addEventListener('input', e => { if(e.target.id === 'apunteIn') pintarApunte(); });
  document.addEventListener('focusin', e => { if(e.target.id === 'apunteIn') pintarApunte(); });
  /* Enter apunta; pegar varias líneas en una lista crea varias tareas */
  document.addEventListener('keydown', e => { if(e.target.id === 'apunteIn' && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); guardarApunte(); } });
  document.addEventListener('paste', e => {
    if(e.target.id !== 'apunteIn') return;
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    const lineas = txt.split(/\r?\n/).map(s => s.replace(/^\s*([-*•☐☑✓]|\d+[.)])\s*/, '').trim()).filter(Boolean);
    if(lineas.length < 2) return;
    e.preventDefault();
    const destino = pref.vista === 'listas' && pref.lista ? pref.lista : asegurarBandeja().id, t0 = ahora();
    const nuevos = lineas.map((l, i) => { const r = leerFrase(l) || { txt:l }; return nuevoItem({ txt:r.txt || l, lista:destino, fecha:r.fecha || '', hora:r.hora || '', rep:r.rep || '', k:t0 + i }); });
    guardar(); pintar(); aviso(nuevos.length + ' apuntes añadidos de una vez.', () => { nuevos.forEach(n => { n.borr = 1; tocar(n); }); guardar(); pintar(); });
  });
  document.addEventListener('keydown', e => {
    if(document.querySelector('dialog[open]') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key === 'n' || e.key === 'N'){ e.preventDefault(); $('btNuevo').click(); }
    else if((e.key === 'a' || e.key === 'A') && $('apunteIn')){ e.preventDefault(); $('apunteIn').focus(); }
    else if(['1','2','3'].includes(e.key)){ pref.vista = ['hoy','listas','agenda'][+e.key - 1]; guardarPref(); pintar(); }
    else if(e.key === 'Escape' && seleccion.size){ seleccion.clear(); modoSel = false; pintar(); }
  });
  /* Mantener pulsado un apunte = empezar a seleccionar */
  let tLargo = null;
  document.addEventListener('touchstart', e => { const f = e.target.closest('[data-item]'); if(!f) return; tLargo = setTimeout(() => { tLargo = 'hecho'; modoSel = true; seleccion.add(f.dataset.item); pintar(); if(navigator.vibrate) navigator.vibrate(12); }, 520); }, { passive:true });
  document.addEventListener('touchmove', () => { if(tLargo !== 'hecho') clearTimeout(tLargo); }, { passive:true });
  document.addEventListener('touchend', e => { if(tLargo === 'hecho') e.preventDefault(); else clearTimeout(tLargo); tLargo = null; });
  $('archivoRespaldo').addEventListener('change', e => { if(e.target.files[0]) restaurar(e.target.files[0]); e.target.value = ''; });
  window.addEventListener('storage', e => { if(e.key === K_DATOS){ cargar(); pintar(); } });
  document.addEventListener('visibilitychange', () => { if(document.hidden) return; pintarSaludo(); pintar(); revisarAvisos(); if(nube){ sincronizar('vuelta'); if(!vivo.es || vivo.es.readyState === 2) conectarVivo(); } });
  window.addEventListener('online', () => { if(nube){ sincronizar('red'); conectarVivo(); } });
  setInterval(() => { if(nube && !document.hidden && (!vivo.conectado ? ahora() - nubeUltima > 20000 : ahora() - nubeUltima > 300000)) sincronizar('sondeo'); }, 20000);
  setInterval(revisarAvisos, 30000); revisarAvisos();
  /* A medianoche cambia el «hoy» */
  let diaVisto = hoy(); setInterval(() => { if(hoy() !== diaVisto){ diaVisto = hoy(); pintarSaludo(); pintar(); } }, 60000);
  pintar(); ponerEstado(nube ? 'busy' : 'off');
  if(nube){ sincronizar('inicio'); conectarVivo(); }
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
function alternarSel(id){
  if(seleccion.has(id)) seleccion.delete(id); else seleccion.add(id);
  const f = document.querySelector('[data-item="' + id + '"]'); if(f) f.classList.toggle('sel', seleccion.has(id));
  pintarSelbar();
}
init();
</script>
