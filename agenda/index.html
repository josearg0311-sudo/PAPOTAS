*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:var(--letra); font-size:15px; line-height:1.5;
  color:var(--tinta); background:var(--papel);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
}
button,input,select,textarea{ font:inherit; color:inherit }
button{ cursor:pointer; background:none; border:none; padding:0 }
a{ color:var(--verde) }
:focus-visible{ outline:2px solid var(--verde); outline-offset:2px; border-radius:6px }
.oculto{ display:none !important }
.cifra{ font-family:var(--cifra); font-variant-numeric:tabular-nums; letter-spacing:-.01em }
svg.i{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important }
}

/* ===== Esqueleto ========================================================= */
.app{ min-height:100vh; min-height:100dvh }

.lateral{
  position:fixed; inset:0 auto 0 0; width:var(--lateral); z-index:30;
  background:var(--hoja); border-right:1px solid var(--regla);
  display:flex; flex-direction:column; padding:16px 12px;
  overflow-y:auto;
}
.marca{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px }
.marca svg{ width:34px; height:34px; flex:none }
.marca b{ display:block; font-size:17px; letter-spacing:-.02em }
.marca small{ display:block; font-size:11.5px; color:var(--tinta-3); margin-top:-2px }

.nav-lat{ display:flex; flex-direction:column; gap:2px }
.nav-lat button{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:9px 10px; border-radius:10px; text-align:left;
  font-size:14px; font-weight:600; color:var(--tinta-2);
  transition:background .12s, color .12s;
}
.nav-lat button:hover{ background:var(--hoja-2); color:var(--tinta) }
.nav-lat button[aria-current="page"]{ background:var(--verde-piso); color:var(--verde-sube) }
.nav-lat .cuenta{
  margin-left:auto; min-width:22px; padding:0 6px; height:20px; border-radius:99px;
  font-size:11px; font-weight:750; display:grid; place-items:center;
  background:var(--regla-2); color:var(--tinta-2);
}
.nav-lat .cuenta.alerta{ background:var(--debe-piso); color:var(--debe) }
.nav-lat .separa{ height:1px; background:var(--regla); margin:10px 6px }
.lateral .pie{ margin-top:auto; padding-top:12px }

.principal{ min-width:0 }
.cabecera{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px;
  height:var(--arriba); padding:0 16px;
  padding-top:env(safe-area-inset-top);
  box-sizing:content-box;
  background:color-mix(in srgb, var(--papel) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--regla-2);
}
.cabecera h1{ margin:0; font-size:19px; letter-spacing:-.02em; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.cabecera .acciones{ margin-left:auto; display:flex; gap:4px; align-items:center }
.btn-icono{
  width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
  color:var(--tinta-2); transition:background .12s, color .12s;
}
.btn-icono:hover{ background:var(--hoja-2); color:var(--tinta) }
.pastilla{
  display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px;
  border-radius:99px; font-size:12px; font-weight:650; color:var(--tinta-2);
  background:var(--hoja); border:1px solid var(--regla);
}
.pastilla .punto{ width:7px; height:7px; border-radius:50%; background:var(--tinta-3) }
.pastilla[data-estado="ok"] .punto{ background:var(--haber) }
.pastilla[data-estado="busy"] .punto{ background:var(--oro); animation:late 1s infinite alternate }
.pastilla[data-estado="err"] .punto{ background:var(--debe) }
@keyframes late{ to{ opacity:.3 } }

.contenido{ padding:18px 16px 110px; max-width:1180px; margin:0 auto }
.vista{ animation:entra .22s ease-out }
@keyframes entra{ from{ opacity:0; transform:translateY(6px) } }

.barra-inf{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:grid; grid-template-columns:repeat(5,1fr);
  height:calc(var(--barra) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--hoja) 94%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--regla);
}
.barra-inf button{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:10.5px; font-weight:650; color:var(--tinta-3); position:relative;
}
.barra-inf button svg{ width:22px; height:22px }
.barra-inf button[aria-current="page"]{ color:var(--verde-sube) }
.barra-inf button[aria-current="page"]::before{
  content:""; position:absolute; top:0; left:30%; right:30%; height:2.5px; border-radius:0 0 3px 3px; background:var(--verde);
}
.barra-inf .globo{
  position:absolute; top:7px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px;
  border-radius:99px; background:var(--debe); color:#fff; font-size:9.5px; font-weight:800; display:grid; place-items:center;
}

.fab{
  position:fixed; right:18px; bottom:calc(var(--barra) + 16px + env(safe-area-inset-bottom)); z-index:25;
  width:56px; height:56px; border-radius:18px; display:grid; place-items:center;
  background:var(--verde); color:var(--papel); box-shadow:var(--sombra-alta);
  transition:transform .15s;
}
.fab:hover{ transform:translateY(-2px) }
.fab svg{ width:26px; height:26px; stroke-width:2.6 }

@media (min-width:900px){
  .principal{ margin-left:var(--lateral) }
  .barra-inf{ display:none }
  .fab{ bottom:26px; right:28px }
  .contenido{ padding:26px 32px 90px }
  .solo-movil{ display:none !important }
}
@media (max-width:899px){
  .lateral{ display:none }
  .solo-escritorio{ display:none !important }
}

/* Cuentas vive dentro, a toda la altura que queda */
.marco-cuentas{
  display:block; width:100%; border:0; background:var(--papel);
  height:calc(100vh - var(--arriba) - var(--barra) - env(safe-area-inset-bottom) - env(safe-area-inset-top) - 1px);
  height:calc(100dvh - var(--arriba) - var(--barra) - env(safe-area-inset-bottom) - env(safe-area-inset-top) - 1px);
}
@media (min-width:900px){
  .marco-cuentas{ height:calc(100vh - var(--arriba) - 1px); height:calc(100dvh - var(--arriba) - 1px) }
}
/* Cuentas trae su propia cabecera: la de la agenda se retira para no tener dos */
body.en-cuentas .cabecera{ display:none }
body.en-cuentas .marco-cuentas{
  height:calc(100vh - var(--barra) - env(safe-area-inset-bottom));
  height:calc(100dvh - var(--barra) - env(safe-area-inset-bottom));
}
@media (min-width:900px){ body.en-cuentas .marco-cuentas{ height:100vh; height:100dvh } }
body.en-cuentas .fab{ display:none }

/* ===== Piezas comunes ==================================================== */
.tarjeta{
  background:var(--hoja); border:1px solid var(--regla); border-radius:var(--r-l);
  box-shadow:var(--sombra); min-width:0;
}
.tarjeta-cab{
  display:flex; align-items:center; gap:10px; padding:14px 16px 8px;
}
.tarjeta-cab h2, .tarjeta-cab h3{ margin:0; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-2) }
.tarjeta-cab .mas{ margin-left:auto; font-size:12.5px; font-weight:650; color:var(--verde-sube) }
.tarjeta-cuerpo{ padding:4px 16px 14px }

.rejilla{ display:grid; gap:14px; grid-template-columns:minmax(0,1fr) }
@media (min-width:760px){ .rejilla.dos{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
@media (min-width:1100px){ .rejilla.tres{ grid-template-columns:repeat(3,minmax(0,1fr)) } }
@media (min-width:760px) and (max-width:1099px){ .rejilla.tres{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.ancho-2{ grid-column:1/-1 }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:40px; padding:0 16px; border-radius:11px;
  font-size:14px; font-weight:700;
  background:var(--hoja-2); border:1px solid var(--regla); color:var(--tinta);
  transition:background .12s, border-color .12s, transform .08s;
}
.btn:hover{ border-color:var(--tinta-3) }
.btn:active{ transform:scale(.98) }
.btn.primario{ background:var(--verde); border-color:var(--verde); color:var(--papel) }
.btn.primario:hover{ background:var(--verde-sube) }
.btn.peligro{ color:var(--debe); border-color:color-mix(in srgb, var(--debe) 35%, transparent); background:var(--debe-piso) }
.btn.chico{ height:32px; padding:0 11px; font-size:12.5px; border-radius:9px }
.btn svg{ width:17px; height:17px }

.fichas{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px }
.ficha{
  height:32px; padding:0 13px; border-radius:99px; font-size:13px; font-weight:650;
  background:var(--hoja); border:1px solid var(--regla); color:var(--tinta-2);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.ficha[aria-pressed="true"]{ background:var(--verde-piso); border-color:var(--verde); color:var(--verde-sube) }
.ficha .n{ font-size:11px; opacity:.75 }
.desliza{ overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; margin-left:-16px; margin-right:-16px; padding:0 16px }
.desliza::-webkit-scrollbar{ display:none }

.campo{ display:flex; flex-direction:column; gap:5px; min-width:0 }
.campo > span{ font-size:12px; font-weight:700; color:var(--tinta-2) }
.entrada, .campo input, .campo select, .campo textarea{
  width:100%; min-width:0; height:42px; padding:0 12px; border-radius:11px;
  background:var(--hoja-2); border:1px solid var(--regla); color:var(--tinta);
  font-size:15px; outline:none; transition:border-color .12s, box-shadow .12s;
}
.campo textarea{ height:auto; min-height:84px; padding:10px 12px; resize:vertical; line-height:1.45 }
.entrada:focus, .campo input:focus, .campo select:focus, .campo textarea:focus{
  border-color:var(--verde); box-shadow:0 0 0 3px color-mix(in srgb, var(--verde) 22%, transparent);
}
.fila-campos{ display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)) }
.fila-campos.tres{ grid-template-columns:repeat(3,minmax(0,1fr)) }
.form{ display:flex; flex-direction:column; gap:12px }

.interruptor{ display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; cursor:pointer }
.interruptor input{ appearance:none; -webkit-appearance:none; width:40px; height:24px; border-radius:99px; background:var(--regla); position:relative; transition:background .15s; flex:none; cursor:pointer }
.interruptor input::after{ content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s }
.interruptor input:checked{ background:var(--verde) }
.interruptor input:checked::after{ transform:translateX(16px) }

.vacio{ text-align:center; padding:26px 14px; color:var(--tinta-3); font-size:13.5px }
.vacio b{ display:block; color:var(--tinta-2); font-size:14.5px; margin-bottom:3px }
.vacio .emoji{ font-size:30px; display:block; margin-bottom:6px }

.seccion-tit{
  font-size:11.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--tinta-3); margin:18px 2px 8px; display:flex; align-items:center; gap:8px;
}
.seccion-tit.rojo{ color:var(--debe) }
.seccion-tit .n{ font-weight:700; letter-spacing:0; opacity:.8 }

/* ===== Casilla de marcar ================================================= */
.casilla{
  width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center;
  border:2px solid var(--c, var(--tinta-3)); color:transparent;
  transition:background .15s, border-color .15s, transform .12s;
}
.casilla:hover{ background:color-mix(in srgb, var(--c, var(--tinta-3)) 18%, transparent) }
.casilla:active{ transform:scale(.88) }
.casilla svg{ width:13px; height:13px; stroke-width:3.4 }
.casilla[aria-checked="true"]{ background:var(--c, var(--haber)); border-color:var(--c, var(--haber)); color:var(--papel) }
.casilla.cuadrada{ border-radius:7px }
.casilla.pop{ animation:pop .35s ease-out }
@keyframes pop{ 40%{ transform:scale(1.25) } }

/* ===== Filas (tareas, recordatorios, eventos) ============================ */
.lista-filas{ display:flex; flex-direction:column }
.fila{
  display:flex; align-items:flex-start; gap:12px; padding:11px 14px;
  border-bottom:1px solid var(--regla-2); min-width:0;
  transition:background .12s;
}
.fila:last-child{ border-bottom:none }
.fila:hover{ background:var(--hoja-2) }
.fila .cuerpo{ flex:1; min-width:0; cursor:pointer }
.fila .titulo{ font-size:14.5px; font-weight:600; overflow-wrap:anywhere }
.fila.hecha .titulo{ text-decoration:line-through; color:var(--tinta-3) }
.fila .meta{ display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:2px; font-size:12px; color:var(--tinta-3) }
.fila .meta span{ display:inline-flex; align-items:center; gap:4px }
.fila .meta svg{ width:13px; height:13px }
.fila .meta .tarde{ color:var(--debe); font-weight:650 }
.fila .meta .hoy{ color:var(--oro); font-weight:650 }
.fila .lado{ display:flex; gap:2px; align-items:center; flex:none }
.fila .lado .btn-icono{ width:32px; height:32px }
.fila .lado svg{ width:17px; height:17px }
.fila .hora{
  font-family:var(--cifra); font-size:12.5px; font-weight:700; color:var(--tinta-2);
  width:46px; flex:none; padding-top:1px;
}
.fila .barrita{ width:4px; align-self:stretch; border-radius:99px; background:var(--c, var(--verde)); flex:none }
.fila .icono-tipo{ width:22px; height:22px; display:grid; place-items:center; color:var(--c, var(--tinta-3)); flex:none }
.fila .icono-tipo svg{ width:18px; height:18px }
.etiqueta{
  display:inline-flex; align-items:center; height:19px; padding:0 7px; border-radius:6px;
  font-size:11px; font-weight:700; background:var(--regla-2); color:var(--tinta-2);
}
.fila.encendida{ animation:enciende 1.2s ease-out }
@keyframes enciende{ from{ background:var(--verde-piso) } }

/* ===== Hoy =============================================================== */
.saludo{ margin:2px 0 18px }
.saludo h2{ margin:0; font-size:26px; letter-spacing:-.03em; font-weight:800; line-height:1.15 }
.saludo p{ margin:4px 0 0; color:var(--tinta-2); font-size:14px }
.anillo-fila{ display:flex; align-items:center; gap:14px; padding:4px 16px 16px }
.anillo{ width:64px; height:64px; flex:none; transform:rotate(-90deg) }
.anillo circle{ fill:none; stroke-width:7 }
.anillo .fondo{ stroke:var(--regla) }
.anillo .valor{ stroke:var(--haber); stroke-linecap:round; transition:stroke-dashoffset .6s ease }
.anillo-texto b{ font-size:22px; letter-spacing:-.02em; display:block; line-height:1.1 }
.anillo-texto span{ font-size:12.5px; color:var(--tinta-2) }

.cifras{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:6px 16px 16px }
.cifras div{ background:var(--hoja-2); border:1px solid var(--regla-2); border-radius:12px; padding:9px 10px; min-width:0 }
.cifras small{ display:block; font-size:10.5px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-3) }
.cifras b{ display:block; font-family:var(--cifra); font-size:14px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.cifras .entra b{ color:var(--haber) }
.cifras .sale b{ color:var(--debe) }

.enfoque{ display:flex; flex-direction:column; gap:6px; padding:2px 16px 14px }
.enfoque label{ display:flex; align-items:center; gap:10px }
.enfoque .n{ width:20px; font-family:var(--cifra); font-size:12px; font-weight:800; color:var(--verde-sube); text-align:center; flex:none }
.enfoque input[type=text]{
  flex:1; min-width:0; height:38px; border:none; border-bottom:1px dashed var(--regla); background:transparent;
  font-size:14.5px; font-weight:600; outline:none; padding:0 2px;
}
.enfoque input[type=text]:focus{ border-bottom-color:var(--verde) }
.enfoque .hecho input[type=text]{ text-decoration:line-through; color:var(--tinta-3) }

.semana-mini{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; padding:4px 16px 16px }
.semana-mini button{
  border-radius:12px; padding:8px 0 7px; background:var(--hoja-2); border:1px solid var(--regla-2);
  display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0;
}
.semana-mini small{ font-size:10.5px; font-weight:750; color:var(--tinta-3); text-transform:uppercase }
.semana-mini b{ font-size:16px }
.semana-mini .puntos{ display:flex; gap:2px; height:6px; align-items:center }
.semana-mini .puntos i{ width:5px; height:5px; border-radius:50%; background:var(--verde) }
.semana-mini .hoy{ border-color:var(--verde); background:var(--verde-piso) }
.semana-mini .hoy b{ color:var(--verde-sube) }

.chips-habito{ display:flex; flex-wrap:wrap; gap:8px; padding:4px 16px 16px }
.chip-habito{
  display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 13px 0 9px; border-radius:99px;
  background:var(--hoja-2); border:1px solid var(--regla); font-size:13.5px; font-weight:650;
  transition:background .15s, border-color .15s;
}
.chip-habito .em{ font-size:16px }
.chip-habito[aria-pressed="true"]{ background:var(--haber-piso); border-color:var(--haber); color:var(--haber) }

/* ===== Captura rápida ==================================================== */
.captura{
  display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; margin-bottom:16px;
  background:var(--hoja); border:1px solid var(--regla); border-radius:16px; box-shadow:var(--sombra);
}
.captura:focus-within{ border-color:var(--verde) }
.captura input{ flex:1; min-width:0; height:40px; border:none; background:transparent; outline:none; font-size:15px }
.captura .btn{ height:38px }
.pista{ font-size:12px; color:var(--tinta-3); margin:-8px 4px 14px; min-height:18px }
.pista b{ color:var(--verde-sube); font-weight:700 }

/* ===== Calendario ======================================================== */
.cal-cab{ display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap }
.cal-cab h2{ margin:0; font-size:20px; letter-spacing:-.02em; text-transform:capitalize; min-width:170px }
.cal-cab .der{ margin-left:auto; display:flex; gap:6px }
.cal-dias{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-bottom:4px }
.cal-dias span{ text-align:center; font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--tinta-3); text-transform:uppercase }
.cal-mes{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px }
.celda{
  min-height:58px; border-radius:11px; padding:5px 5px 4px; text-align:left;
  background:var(--hoja); border:1px solid var(--regla-2); min-width:0; overflow:hidden;
  display:flex; flex-direction:column; gap:2px; transition:border-color .12s, background .12s;
}
.celda:hover{ border-color:var(--tinta-3) }
.celda .num{ font-size:13px; font-weight:700; line-height:1; padding:2px 3px }
.celda.fuera{ opacity:.38 }
.celda.hoy .num{ background:var(--verde); color:var(--papel); border-radius:6px; align-self:flex-start; padding:3px 5px }
.celda.sel{ border-color:var(--verde); background:var(--verde-piso) }
.celda .puntos{ display:flex; gap:3px; flex-wrap:wrap; padding:0 3px }
.celda .puntos i{ width:6px; height:6px; border-radius:50%; background:var(--c, var(--verde)) }
.celda .mini{ display:none; font-size:11px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 4px; border-radius:4px;
  background:color-mix(in srgb, var(--c, var(--verde)) 20%, transparent); color:var(--tinta) }
@media (min-width:760px){
  .celda{ min-height:96px }
  .celda .mini{ display:block }
  .celda .puntos.solo-movil-p{ display:none }
}
.cal-layout{ display:grid; gap:16px; grid-template-columns:minmax(0,1fr) }
@media (min-width:1100px){ .cal-layout{ grid-template-columns:minmax(0,1fr) 340px } }

/* ===== Listas ============================================================ */
.listas-rejilla{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)) }
.tarjeta-lista{
  text-align:left; padding:14px; display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, border-color .12s;
}
.tarjeta-lista:hover{ transform:translateY(-2px); border-color:var(--c, var(--verde)) }
.tarjeta-lista .cab{ display:flex; align-items:center; gap:10px }
.tarjeta-lista .em{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-size:20px;
  background:color-mix(in srgb, var(--c, var(--verde)) 18%, transparent) }
.tarjeta-lista b{ font-size:15px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.tarjeta-lista small{ color:var(--tinta-3); font-size:12px }
.barra-prog{ height:6px; border-radius:99px; background:var(--regla-2); overflow:hidden }
.barra-prog i{ display:block; height:100%; border-radius:99px; background:var(--c, var(--haber)); transition:width .4s ease }
.item-lista{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--regla-2) }
.item-lista:last-child{ border-bottom:none }
.item-lista .t{ flex:1; min-width:0; font-size:15px; overflow-wrap:anywhere; cursor:text }
.item-lista.ok .t{ text-decoration:line-through; color:var(--tinta-3) }
.item-lista .btn-icono{ width:30px; height:30px; opacity:.55 }
.item-lista .btn-icono:hover{ opacity:1; color:var(--debe) }
.item-lista .btn-icono svg{ width:15px; height:15px }

/* ===== Hábitos =========================================================== */
.habito{ padding:14px 16px }
.habito .cab{ display:flex; align-items:center; gap:10px; margin-bottom:12px }
.habito .em{ font-size:24px; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--hoja-2); flex:none }
.habito .nom{ flex:1; min-width:0 }
.habito .nom b{ display:block; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.habito .nom small{ color:var(--tinta-3); font-size:12px }
.racha{ font-family:var(--cifra); font-weight:800; font-size:14px; color:var(--oro); white-space:nowrap }
.dias-habito{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px }
.dia-h{
  display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:var(--tinta-3); text-transform:uppercase;
}
.dia-h .c{
  width:100%; max-width:40px; aspect-ratio:1; border-radius:11px; display:grid; place-items:center;
  background:var(--hoja-2); border:1.5px solid var(--regla); color:transparent; transition:background .15s, border-color .15s;
}
.dia-h .c svg{ width:15px; height:15px; stroke-width:3 }
.dia-h.ok .c{ background:var(--haber); border-color:var(--haber); color:var(--papel) }
.dia-h.libre .c{ opacity:.35; border-style:dashed }
.dia-h.hoy{ color:var(--verde-sube) }
.dia-h.hoy .c{ border-color:var(--verde) }
.dia-h.ok.hoy .c{ border-color:var(--haber) }
.habito .pie-h{ display:flex; align-items:center; gap:10px; margin-top:12px; font-size:12px; color:var(--tinta-3) }
.habito .pie-h .barra-prog{ flex:1 }

/* ===== Notas ============================================================= */
.notas-muro{ columns:220px; column-gap:12px }
.nota{
  break-inside:avoid; margin-bottom:12px; padding:14px; cursor:pointer; display:block; width:100%; text-align:left;
  border-top:4px solid var(--c, var(--regla));
  transition:transform .12s;
}
.nota:hover{ transform:translateY(-2px) }
.nota b{ display:block; font-size:15px; margin-bottom:4px; overflow-wrap:anywhere }
.nota p{ margin:0; font-size:13.5px; color:var(--tinta-2); white-space:pre-wrap; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-line-clamp:9; -webkit-box-orient:vertical; overflow:hidden }
.nota small{ display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11px; color:var(--tinta-3) }
.nota small svg{ width:12px; height:12px }

/* ===== Hoja flotante (editor) ============================================ */
.velo{
  position:fixed; inset:0; z-index:60; background:rgba(4,6,10,.55);
  display:flex; align-items:flex-end; justify-content:center;
  animation:aparece .18s ease-out;
}
@keyframes aparece{ from{ opacity:0 } }
.hoja-flot{
  width:100%; max-width:560px; max-height:92vh; max-height:92dvh; overflow-y:auto;
  background:var(--hoja); border:1px solid var(--regla); border-radius:22px 22px 0 0;
  box-shadow:var(--sombra-alta); padding:8px 18px calc(18px + env(safe-area-inset-bottom));
  animation:sube .24s cubic-bezier(.2,.8,.2,1);
}
@keyframes sube{ from{ transform:translateY(40px); opacity:.4 } }
.hoja-flot .asa{ width:40px; height:4px; border-radius:99px; background:var(--regla); margin:4px auto 10px }
.hoja-flot .cab{ display:flex; align-items:center; gap:10px; margin-bottom:14px }
.hoja-flot .cab h3{ margin:0; font-size:18px; letter-spacing:-.02em; flex:1 }
.hoja-flot .botones{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap }
.hoja-flot .botones .btn{ flex:1 1 auto }
.hoja-flot .botones .btn.peligro{ flex:0 0 auto }
@media (min-width:640px){
  .velo{ align-items:center; padding:20px }
  .hoja-flot{ border-radius:22px }
  .hoja-flot .asa{ display:none }
  .hoja-flot{ padding-top:18px }
}

.selector{ display:flex; gap:6px; flex-wrap:wrap }
.selector button{
  height:34px; padding:0 12px; border-radius:10px; font-size:13px; font-weight:650;
  background:var(--hoja-2); border:1px solid var(--regla); color:var(--tinta-2);
}
.selector button[aria-pressed="true"]{ background:var(--verde-piso); border-color:var(--verde); color:var(--verde-sube) }
.selector.colores button{ width:34px; padding:0; border-radius:50%; background:var(--c); border:3px solid transparent }
.selector.colores button[aria-pressed="true"]{ border-color:var(--tinta); box-shadow:inset 0 0 0 2px var(--hoja) }
.selector.emojis button{ width:40px; padding:0; font-size:19px }

.subtareas{ display:flex; flex-direction:column; gap:4px }
.subtarea{ display:flex; align-items:center; gap:10px }
.subtarea input[type=text]{ flex:1; height:36px; border:none; border-bottom:1px solid var(--regla-2); background:transparent; outline:none; font-size:14px; min-width:0 }
.subtarea.ok input[type=text]{ text-decoration:line-through; color:var(--tinta-3) }

/* ===== Menú "Más" y búsqueda ============================================= */
.rejilla-mas{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px }
.rejilla-mas button{
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:16px 6px 13px; border-radius:16px;
  background:var(--hoja-2); border:1px solid var(--regla); font-size:12.5px; font-weight:700; position:relative;
}
.rejilla-mas button svg{ width:24px; height:24px; color:var(--verde-sube) }
.rejilla-mas .globo{ position:absolute; top:8px; right:10px; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--debe); color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center }

.resultado{ display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px solid var(--regla-2); width:100%; text-align:left; border-radius:8px }
.resultado:hover{ background:var(--hoja-2) }
.resultado svg{ width:18px; height:18px; color:var(--tinta-3); flex:none }
.resultado b{ display:block; font-size:14px; font-weight:600 }
.resultado small{ color:var(--tinta-3); font-size:12px }
mark{ background:color-mix(in srgb, var(--oro) 35%, transparent); color:inherit; border-radius:3px; padding:0 1px }

/* ===== Avisos ============================================================ */
.avisos{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--barra) + 18px + env(safe-area-inset-bottom)); z-index:80; display:flex; flex-direction:column; gap:8px; width:min(440px, calc(100% - 24px)); pointer-events:none }
@media (min-width:900px){ .avisos{ bottom:24px; left:calc(50% + var(--lateral)/2) } }
.aviso{
  pointer-events:auto; display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--tinta); color:var(--papel); border-radius:14px; box-shadow:var(--sombra-alta);
  font-size:13.5px; animation:sube .25s ease-out;
}
.aviso b{ display:block }
.aviso .txt{ flex:1; min-width:0 }
.aviso button{ font-weight:800; color:var(--verde); white-space:nowrap; padding:4px 6px }
:root:not([data-tema="claro"]) .aviso button{ color:var(--verde) }
.aviso.alarma{ background:var(--oro); color:#1a1405 }
.aviso.alarma button{ color:#1a1405; text-decoration:underline }

.banda{
  display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:14px; border-radius:14px;
  background:var(--oro-piso); border:1px solid color-mix(in srgb, var(--oro) 35%, transparent); font-size:13.5px;
}
.banda svg{ color:var(--oro); flex:none }
.banda .txt{ flex:1; min-width:0 }
.banda .txt b{ display:block }

.ajuste{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--regla-2); flex-wrap:wrap }
.ajuste:last-child{ border-bottom:none }
.ajuste .txt{ flex:1 1 220px; min-width:0 }
.ajuste .txt b{ display:block; font-size:14.5px }
.ajuste .txt small{ display:block; color:var(--tinta-3); font-size:12.5px; line-height:1.4; margin-top:2px }
.rejilla-paletas{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; width:100% }
@media (min-width:520px){ .rejilla-paletas{ grid-template-columns:repeat(4,minmax(0,1fr)) } }
.muestra{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 6px; border-radius:12px; background:var(--hoja-2); border:1.5px solid var(--regla); font-size:12.5px; font-weight:700 }
.muestra[aria-pressed="true"]{ border-color:var(--verde) }
.muestra .gotas{ display:flex; gap:4px }
.muestra .gotas i{ width:16px; height:16px; border-radius:50% }

/* ==========================================================================
   ESTILO 2
   Más aire, tarjetas con su icono de color, un saludo que manda y un halo
   del color de la paleta al fondo. Sin cambiar los tokens: todo sigue
   leyendo la misma paleta que Cuentas.
   ========================================================================== */
body{
  background:
    radial-gradient(900px 420px at 85% -120px, color-mix(in srgb, var(--verde) 16%, transparent), transparent 70%),
    radial-gradient(700px 380px at -10% 10%, color-mix(in srgb, var(--haber) 7%, transparent), transparent 70%),
    var(--papel);
  background-attachment:fixed;
}
.tarjeta{
  border-radius:20px;
  border-color:color-mix(in srgb, var(--regla) 85%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb, var(--hoja) 92%, var(--tinta) 3%), var(--hoja));
}
.tarjeta-cab{ padding:15px 16px 9px }
.tarjeta-cab h2, .tarjeta-cab h3{
  display:flex; align-items:center; gap:10px;
  font-size:15px; font-weight:750; letter-spacing:-.01em; text-transform:none; color:var(--tinta);
}
.azulejo{
  width:30px; height:30px; border-radius:10px; flex:none; display:grid; place-items:center;
  color:var(--c, var(--verde)); background:color-mix(in srgb, var(--c, var(--verde)) 16%, transparent);
}
.azulejo svg{ width:17px; height:17px }
.tarjeta-cab .mas{
  display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:99px;
  background:var(--verde-piso); font-size:12px;
}
.tarjeta-cab .mas svg{ width:13px; height:13px }

.btn.primario{
  background:linear-gradient(135deg, var(--verde-sube), var(--verde));
  border-color:transparent; box-shadow:0 4px 14px color-mix(in srgb, var(--verde) 35%, transparent);
}
.fab{
  background:linear-gradient(135deg, var(--verde-sube), var(--verde));
  box-shadow:0 10px 30px color-mix(in srgb, var(--verde) 45%, transparent), var(--sombra);
  border-radius:20px;
}
.fab:active{ transform:scale(.94) }

/* Barra inferior: el activo va en una pastilla */
.barra-inf button svg{ width:44px; height:28px; padding:3px 11px; border-radius:99px; transition:background .2s }
.barra-inf button[aria-current="page"] svg{ background:var(--verde-piso) }
.barra-inf button[aria-current="page"]::before{ display:none }
.barra-inf .globo{ top:4px; left:calc(50% + 8px) }

/* Lateral por grupos */
.nav-lat .grupo{ font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-3); padding:14px 10px 5px }
.nav-lat .grupo:first-child{ padding-top:2px }
.nav-lat button[aria-current="page"]{ background:linear-gradient(90deg, var(--verde-piso), transparent); box-shadow:inset 3px 0 0 var(--verde) }

/* ===== Saludo principal ================================================== */
.heroe{
  position:relative; overflow:hidden; border-radius:24px; padding:20px 18px 18px; margin-bottom:16px; color:#fff;
  background:
    radial-gradient(420px 220px at 100% 0%, rgba(255,255,255,.22), transparent 60%),
    linear-gradient(135deg, var(--verde-sube) 0%, var(--verde) 45%, color-mix(in srgb, var(--verde) 55%, #140f3a) 100%);
  box-shadow:0 18px 40px color-mix(in srgb, var(--verde) 30%, transparent);
}
.heroe::after{
  content:""; position:absolute; right:-40px; bottom:-60px; width:200px; height:200px; border-radius:50%;
  border:28px solid rgba(255,255,255,.08);
}
.heroe .fecha{ font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85 }
.heroe h2{ margin:4px 0 0; font-size:27px; line-height:1.15; letter-spacing:-.03em; font-weight:800 }
.heroe .frase{ margin:10px 0 0; font-size:13.5px; line-height:1.45; opacity:.92; max-width:560px; font-style:italic }
.heroe .datos{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; position:relative; z-index:1 }
.heroe .dato{
  display:flex; align-items:center; gap:8px; padding:8px 12px 8px 9px; border-radius:14px;
  background:rgba(255,255,255,.14); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  font-size:12.5px; font-weight:650; color:#fff; border:1px solid rgba(255,255,255,.14);
}
.heroe .dato b{ font-size:17px; font-weight:800; letter-spacing:-.02em }
.heroe .dato svg{ width:17px; height:17px; opacity:.9 }
.heroe .anillo{ width:54px; height:54px }
.heroe .anillo .fondo{ stroke:rgba(255,255,255,.22) }
.heroe .anillo .valor{ stroke:#fff }
.heroe .arriba{ display:flex; gap:14px; align-items:flex-start; justify-content:space-between }
@media (min-width:760px){ .heroe{ padding:26px 26px 22px } .heroe h2{ font-size:32px } }

/* ===== Pastilla del temporizador ========================================= */
.pastilla.foco{ color:var(--verde-sube); border-color:var(--verde); background:var(--verde-piso); font-family:var(--cifra); font-weight:800 }
.pastilla.foco svg{ width:14px; height:14px }

/* ===== Portada (al abrir) ================================================= */
.portada{
  position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:var(--papel); transition:opacity .35s ease, visibility .35s;
}
.portada svg{ width:96px; height:96px; animation:latir .7s cubic-bezier(.2,.9,.3,1.3) both; filter:drop-shadow(0 16px 30px rgba(60,40,200,.45)) }
.portada b{ font-size:22px; letter-spacing:-.02em; animation:entra .5s .15s both }
.portada.fuera{ opacity:0; visibility:hidden }
@keyframes latir{ from{ transform:scale(.6); opacity:0 } }

/* ===== Candado ============================================================ */
.candado{
  position:fixed; inset:0; z-index:190; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:var(--papel); padding:24px;
}
.candado .logo{ width:64px; height:64px }
.candado b{ font-size:18px }
.candado small{ color:var(--tinta-3); min-height:18px; text-align:center }
.puntos-pin{ display:flex; gap:14px; height:18px }
.puntos-pin i{ width:14px; height:14px; border-radius:50%; border:2px solid var(--tinta-3); transition:background .15s, border-color .15s }
.puntos-pin i.lleno{ background:var(--verde); border-color:var(--verde) }
.puntos-pin.mal{ animation:sacude .4s }
@keyframes sacude{ 20%,60%{ transform:translateX(-10px) } 40%,80%{ transform:translateX(10px) } }
.teclado{ display:grid; grid-template-columns:repeat(3,72px); gap:14px }
.teclado button{
  width:72px; height:72px; border-radius:50%; font-size:26px; font-weight:600;
  background:var(--hoja); border:1px solid var(--regla); transition:background .1s, transform .08s;
}
.teclado button:active{ transform:scale(.92); background:var(--verde-piso) }
.teclado button.fantasma{ background:none; border:none; font-size:14px; color:var(--tinta-2) }

.confeti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:120 }

/* ===== Metas ============================================================== */
.meta-t{ padding:16px }
.meta-t .cab{ display:flex; align-items:center; gap:12px }
.meta-t .em{ width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:24px; flex:none;
  background:color-mix(in srgb, var(--c) 16%, transparent) }
.meta-t .nom{ flex:1; min-width:0 }
.meta-t .nom b{ display:block; font-size:15.5px; overflow-wrap:anywhere }
.meta-t .nom small{ color:var(--tinta-3); font-size:12px }
.meta-t .cifra-grande{ font-family:var(--cifra); font-size:22px; font-weight:800; letter-spacing:-.02em; margin:14px 0 8px }
.meta-t .cifra-grande small{ font-size:13px; color:var(--tinta-3); font-weight:600 }
.meta-t .barra-prog{ height:10px }
.meta-t .barra-prog i{ background:linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, #fff 0%), var(--c)) }
.meta-t .acciones{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; align-items:center }
.meta-t .ritmo{ font-size:12px; color:var(--tinta-3); margin-top:8px }
.meta-t.lograda{ border-color:color-mix(in srgb, var(--haber) 50%, transparent) }

/* ===== Pagos ============================================================== */
.resumen-pagos{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:14px }
.resumen-pagos div{ background:var(--hoja); border:1px solid var(--regla); border-radius:16px; padding:12px; min-width:0 }
.resumen-pagos small{ display:block; font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--tinta-3) }
.resumen-pagos b{ display:block; font-family:var(--cifra); font-size:15px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.fila .monto{ font-family:var(--cifra); font-weight:800; font-size:14px; white-space:nowrap; padding-top:1px }
.fila .em-fila{ font-size:20px; width:26px; text-align:center; flex:none; line-height:1.2 }

/* ===== Diario ============================================================= */
.animos{ display:flex; gap:8px; justify-content:space-between }
.animo{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 2px 8px; border-radius:14px;
  background:var(--hoja-2); border:1.5px solid var(--regla); font-size:10.5px; font-weight:700; color:var(--tinta-3);
  transition:transform .12s, border-color .12s, background .12s;
}
.animo span{ font-size:26px; line-height:1; filter:grayscale(.5); transition:filter .12s }
.animo[aria-pressed="true"]{ border-color:var(--verde); background:var(--verde-piso); color:var(--verde-sube); transform:translateY(-2px) }
.animo[aria-pressed="true"] span, .animo:hover span{ filter:none }
.mes-animo{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px }
.mes-animo button{ aspect-ratio:1; border-radius:9px; font-size:11px; font-weight:700; color:var(--tinta-3); background:var(--hoja-2); border:1px solid var(--regla-2); display:grid; place-items:center; padding:0 }
.mes-animo button.hay{ font-size:17px }
.mes-animo button.sel{ border-color:var(--verde); box-shadow:0 0 0 2px var(--verde-piso) }
.mes-animo button.vacio-d{ visibility:hidden }
.entrada-diario{ display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--regla-2); text-align:left; width:100%; align-items:flex-start }
.entrada-diario:last-child{ border-bottom:none }
.entrada-diario .em{ font-size:24px; line-height:1 }
.entrada-diario b{ font-size:13px; display:block }
.entrada-diario p{ margin:2px 0 0; font-size:13.5px; color:var(--tinta-2); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap }

/* ===== Enfoque (temporizador) ============================================= */
.reloj-foco{ display:flex; flex-direction:column; align-items:center; padding:22px 16px 18px; gap:16px }
.reloj-foco .circulo{ position:relative; width:min(270px, 72vw); aspect-ratio:1 }
.reloj-foco svg.aro{ width:100%; height:100%; transform:rotate(-90deg) }
.reloj-foco .aro circle{ fill:none; stroke-width:12 }
.reloj-foco .aro .fondo{ stroke:var(--regla) }
.reloj-foco .aro .valor{ stroke:url(#gradFoco); stroke-linecap:round; transition:stroke-dashoffset .9s linear }
.reloj-foco .centro{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center }
.reloj-foco .tiempo{ font-family:var(--cifra); font-size:clamp(44px, 13vw, 60px); font-weight:800; letter-spacing:-.04em; line-height:1 }
.reloj-foco .modo{ font-size:13px; font-weight:700; color:var(--tinta-2); margin-top:6px }
.reloj-foco .mandos{ display:flex; gap:12px; align-items:center }
.reloj-foco .grande{ width:68px; height:68px; border-radius:50%; display:grid; place-items:center; color:var(--papel);
  background:linear-gradient(135deg, var(--verde-sube), var(--verde)); box-shadow:0 10px 26px color-mix(in srgb, var(--verde) 40%, transparent) }
.reloj-foco .grande svg{ width:28px; height:28px; fill:currentColor; stroke:none }
.reloj-foco .grande.pausa svg{ fill:none; stroke:currentColor; stroke-width:3.2 }
.tomates{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; font-size:18px; min-height:24px }

/* ===== Progreso =========================================================== */
.grafica{ width:100%; height:auto; display:block }
.grafica text{ fill:var(--tinta-3); font-size:10px; font-family:var(--letra) }
.kpis{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:14px }
@media (min-width:760px){ .kpis{ grid-template-columns:repeat(4,minmax(0,1fr)) } }
.kpi{ padding:14px }
.kpi small{ display:block; font-size:11px; font-weight:750; color:var(--tinta-3); text-transform:uppercase; letter-spacing:.06em }
.kpi b{ display:block; font-size:26px; letter-spacing:-.03em; margin-top:2px }
.kpi span{ font-size:12px; color:var(--tinta-3) }
.kpi .sube{ color:var(--haber) } .kpi .baja{ color:var(--debe) }
.barra-h{ display:grid; grid-template-columns:minmax(0,130px) minmax(0,1fr) 42px; gap:10px; align-items:center; padding:6px 16px; font-size:13px }
.barra-h span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.barra-h b{ text-align:right; font-family:var(--cifra); font-size:12.5px }

.cumple{ font-size:12px; color:var(--rosa); font-weight:700 }
.pie-fila-btn{ display:flex; gap:8px; flex-wrap:wrap; padding:4px 16px 14px }

.barras-v{ display:flex; gap:4px; align-items:stretch; padding-top:4px }
.barras-v .col{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center }
.barras-v .col b{ font-size:11px; font-weight:750; color:var(--tinta-2); min-height:16px }
.barras-v .zona{ flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; border-bottom:1px solid var(--regla) }
.barras-v .zona i{ width:70%; max-width:34px; border-radius:7px 7px 3px 3px; transition:height .5s ease }
.barras-v .col small{ font-size:10.5px; color:var(--tinta-3); margin-top:5px; white-space:nowrap; overflow:hidden; max-width:100% }
@media (max-width:420px){ .resumen-pagos b{ font-size:12.5px } .resumen-pagos div{ padding:10px 9px } }

function leerJSON(k, def){ try{ var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; }catch(e){ return def; } }
function escribirJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

function docVacio(){
  var d = { v:1, perfil:{ nombre:'', upd:0 } };
  COLS.forEach(function(c){ d[c] = []; });
  return d;
}
function normalizar(d){
  var out = docVacio();
  if(!d || typeof d !== 'object') return out;
  if(d.perfil && typeof d.perfil === 'object') out.perfil = { nombre:String(d.perfil.nombre || '').slice(0,40), upd:+d.perfil.upd || 0 };
  COLS.forEach(function(c){
    if(Array.isArray(d[c])) out[c] = d[c].filter(function(x){ return x && x.id; });
  });
  return out;
}

var db   = normalizar(leerJSON(CLAVE, null));
var pref = Object.assign({ lunes:true, sonido:true }, leerJSON(CLAVE_PREF, {}));
var avisados = leerJSON(CLAVE_AVISADOS, {});

function nid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function vivos(col){ return db[col].filter(function(x){ return !x.del; }); }
function buscarId(col, id){ return db[col].find(function(x){ return x.id === id; }); }

function guardarLocal(){
  if(!escribirJSON(CLAVE, db)) aviso('No se pudo guardar', 'El almacenamiento del navegador está lleno o bloqueado.');
}
function guardar(){
  guardarLocal();
  programarSubida();
}
/* Mete o actualiza una cosa, siempre con la hora del cambio */
function poner(col, obj){
  obj.upd = Date.now();
  var i = db[col].findIndex(function(x){ return x.id === obj.id; });
  if(i < 0) db[col].push(obj); else db[col][i] = obj;
  guardar();
  return obj;
}
var ultimoBorrado = null;
function quitar(col, id, nombre){
  var o = buscarId(col, id);
  if(!o) return;
  o.del = true; o.upd = Date.now();
  ultimoBorrado = { col:col, id:id };
  guardar();
  aviso((nombre || 'Borrado'), null, 'Deshacer', function(){
    var x = buscarId(col, id);
    if(x){ delete x.del; x.upd = Date.now(); guardar(); pintar(); }
  });
}

/* Junta dos copias: por cada cosa gana la que se tocó más tarde */
function fusionar(a, b){
  var out = docVacio();
  out.perfil = (+(b.perfil && b.perfil.upd) > +(a.perfil && a.perfil.upd)) ? b.perfil : a.perfil;
  var limite = Date.now() - 60 * 864e5;   // los borrados de hace más de 60 días ya no hacen falta
  COLS.forEach(function(c){
    var m = {};
    (a[c] || []).forEach(function(x){ m[x.id] = x; });
    (b[c] || []).forEach(function(x){ var y = m[x.id]; if(!y || (+x.upd || 0) > (+y.upd || 0)) m[x.id] = x; });
    out[c] = Object.keys(m).map(function(k){ return m[k]; })
                   .filter(function(x){ return !(x.del && (+x.upd || 0) < limite); });
  });
  return out;
}

/* ==========================================================================
   FECHAS
   Siempre en hora local y como texto AAAA-MM-DD: se comparan como texto,
   se guardan como texto y no hay zonas horarias que se cuelen.
   ========================================================================== */
var DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DIAS3 = ['dom','lun','mar','mié','jue','vie','sáb'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MESES3= ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function dos(n){ return (n < 10 ? '0' : '') + n; }
function iso(d){ return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); }
function hoyISO(){ return iso(new Date()); }
function deISO(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function sumarDias(s, n){ var d = deISO(s); d.setDate(d.getDate() + n); return iso(d); }
function diasEntre(a, b){ return Math.round((deISO(b) - deISO(a)) / 864e5); }
function horaAhora(){ var d = new Date(); return dos(d.getHours()) + ':' + dos(d.getMinutes()); }
function fechaLarga(s){ var d = deISO(s); return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fechaCorta(s){
  var d = deISO(s), t = d.getDate() + ' ' + MESES3[d.getMonth()];
  if(d.getFullYear() !== new Date().getFullYear()) t += ' ' + d.getFullYear();
  return t;
}
function relativo(s){
  if(!s) return '';
  var n = diasEntre(hoyISO(), s);
  if(n === 0) return 'Hoy';
  if(n === 1) return 'Mañana';
  if(n === -1) return 'Ayer';
  if(n > 1 && n < 7) return cap(DIAS[deISO(s).getDay()]);
  if(n < -1 && n > -7) return 'Hace ' + (-n) + ' días';
  return DIAS3[deISO(s).getDay()] + ' ' + fechaCorta(s);
}
function hora12(h){ return h || ''; }
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function inicioSemana(s){
  var d = deISO(s), w = d.getDay();
  var atras = pref.lunes ? (w + 6) % 7 : w;
  return sumarDias(s, -atras);
}

/* ---------- Repeticiones -------------------------------------------------- */
var REPS = { no:'No se repite', dia:'Cada día', lab:'De lunes a viernes', sem:'Cada semana', mes:'Cada mes', ano:'Cada año' };
var REPS_CORTO = { dia:'diario', lab:'laborables', sem:'semanal', mes:'mensual', ano:'anual' };

function ocurre(base, rep, dia, hasta){
  if(!base) return false;
  if(dia === base) return true;
  if(dia < base) return false;
  if(!rep || rep === 'no') return !!hasta && dia <= hasta;
  var d = deISO(dia), b = deISO(base);
  switch(rep){
    case 'dia': return true;
    case 'lab': return d.getDay() > 0 && d.getDay() < 6;
    case 'sem': return d.getDay() === b.getDay();
    case 'mes': return d.getDate() === b.getDate();
    case 'ano': return d.getDate() === b.getDate() && d.getMonth() === b.getMonth();
  }
  return false;
}
function siguiente(fecha, rep){
  var d = deISO(fecha);
  switch(rep){
    case 'dia': d.setDate(d.getDate() + 1); break;
    case 'lab': do{ d.setDate(d.getDate() + 1); }while(d.getDay() === 0 || d.getDay() === 6); break;
    case 'sem': d.setDate(d.getDate() + 7); break;
    case 'mes':
      var dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1);
      var fin = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(dia, fin)); break;
    case 'ano': d.setFullYear(d.getFullYear() + 1); break;
    default: return fecha;
  }
  return iso(d);
}
/* Próxima vez que toca, contando desde `desde` inclusive */
function proximaDesde(base, rep, desde){
  if(!base) return '';
  if(base >= desde || !rep || rep === 'no') return base;
  for(var i = 0; i < 800; i++){
    var d = sumarDias(desde, i);
    if(ocurre(base, rep, d)) return d;
  }
  return '';
}

/* ---------- Utilidades --------------------------------------------------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function ico(id, cls){ return '<svg class="i' + (cls ? ' ' + cls : '') + '"><use href="#' + id + '"/></svg>'; }
function dinero(v){
  return (v < 0 ? '−' : '') + MONEDA + ' ' + Math.abs(v).toLocaleString('es-PE', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function sinTildes(s){
  return String(s || '').toLowerCase()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i')
    .replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
}

};
function color(k){ return COLORES[k] || COLORES.acento; }
var PRIOS = [
  { n:'Sin prioridad', c:'var(--tinta-3)' },
  { n:'Baja',  c:'var(--azul)' },
  { n:'Media', c:'var(--oro)' },
  { n:'Alta',  c:'var(--debe)' }
];

/* ==========================================================================
   ENTENDER LO QUE ESCRIBES
   "Llamar al banco mañana a las 5" → tarea «Llamar al banco», mañana, 17:00.
   Se busca sobre una copia en minúsculas y sin tildes que tiene EXACTAMENTE
   la misma longitud que el original, así lo encontrado se puede recortar
   del texto de verdad sin perder mayúsculas ni tildes.
   ========================================================================== */
var DIAS_N = { domingo:0, lunes:1, martes:2, miercoles:3, jueves:4, viernes:5, sabado:6 };
var MESES_N = { enero:1, febrero:2, marzo:3, abril:4, mayo:5, junio:6, julio:7, agosto:8, septiembre:9, setiembre:9, octubre:10, noviembre:11, diciembre:12 };

function interpretar(texto){
  var orig = ' ' + texto + ' ';
  var bajo = sinTildes(orig);
  var fecha = '', hora = '', prio = 0, area = '';
  var hoy = hoyISO();

  function cortar(m){
    var i = m.index, n = m[0].length;
    orig = orig.slice(0, i) + ' '.repeat(n) + orig.slice(i + n);
    bajo = bajo.slice(0, i) + ' '.repeat(n) + bajo.slice(i + n);
  }
  function buscar(re){ var m = re.exec(bajo); if(m) cortar(m); return m; }

  var m, parte = '';
  /* Primero lo que modifica la hora, para que "de la mañana" no se lea como el día */
  if((m = buscar(/\s(?:de la|por la) (manana|tarde|noche)(?=\s)/))) parte = m[1];
  if((m = buscar(/\s(?:al )?mediodia(?=\s)/))) hora = '12:00';

  if(buscar(/\spasado manana(?=\s)/)) fecha = sumarDias(hoy, 2);
  else if(buscar(/\smanana(?=\s)/)) fecha = sumarDias(hoy, 1);
  else if(buscar(/\shoy(?=\s)/)) fecha = hoy;
  else if((m = buscar(/\sen (\d{1,3}) (dia|dias|semana|semanas|mes|meses)(?=\s)/))){
    var k = +m[1], u = m[2];
    if(u.indexOf('dia') === 0) fecha = sumarDias(hoy, k);
    else if(u.indexOf('semana') === 0) fecha = sumarDias(hoy, 7 * k);
    else { var dm = deISO(hoy); dm.setMonth(dm.getMonth() + k); fecha = iso(dm); }
  }
  else if(buscar(/\sen una semana(?=\s)/)) fecha = sumarDias(hoy, 7);
  else if((m = buscar(/\s(?:el |este |esta |proximo |el proximo |la proxima )?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)(?=\s)/))){
    var obj = DIAS_N[m[1]], w = deISO(hoy).getDay();
    var falta = (obj - w + 7) % 7 || 7;
    fecha = sumarDias(hoy, falta);
  }
  else if((m = buscar(/\s(?:el )?(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?: de (\d{4}))?(?=\s)/))){
    fecha = armarFecha(+m[1], MESES_N[m[2]], m[3] ? +m[3] : 0);
  }
  else if((m = buscar(/\s(?:el )?(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?(?=\s)/))){
    var an = m[3] ? +m[3] : 0; if(an && an < 100) an += 2000;
    fecha = armarFecha(+m[1], +m[2], an);
  }

  function armarFecha(d, mes, an){
    if(mes < 1 || mes > 12 || d < 1 || d > 31) return '';
    var y = an || new Date().getFullYear();
    var f = y + '-' + dos(mes) + '-' + dos(d);
    if(!an && f < hoy) f = (y + 1) + '-' + dos(mes) + '-' + dos(d);
    return f;
  }

  /* La hora: "a las 5", "a las 17:30", "5pm", "9:15", "18h" */
  if(!hora){
    if((m = buscar(/\s(?:a las?|alas|sobre las) (\d{1,2})(?::(\d{2}))?\s?(am|pm|a\.m\.|p\.m\.|h|hs|hrs)?(?=\s)/))){
      hora = armarHora(+m[1], m[2] ? +m[2] : 0, m[3], true);
    } else if((m = buscar(/\s(\d{1,2}):(\d{2})\s?(am|pm|a\.m\.|p\.m\.|h|hs|hrs)?(?=\s)/))){
      hora = armarHora(+m[1], +m[2], m[3], false);
    } else if((m = buscar(/\s(\d{1,2})\s?(am|pm|a\.m\.|p\.m\.|h|hs|hrs)(?=\s)/))){
      hora = armarHora(+m[1], 0, m[2], false);
    }
  }
  function armarHora(h, mi, suf, adivinar){
    suf = (suf || '').replace(/\./g,'');
    if(h > 23 || mi > 59) return '';
    if(suf === 'pm' && h < 12) h += 12;
    else if(suf === 'am' && h === 12) h = 0;
    else if(!suf || suf.charAt(0) === 'h'){
      if(parte === 'tarde' || parte === 'noche'){ if(h < 12) h += 12; }
      else if(parte !== 'manana' && adivinar && h >= 1 && h <= 7) h += 12;   // "a las 5" casi siempre es de la tarde
    }
    return dos(h) + ':' + dos(mi);
  }

  /* Prioridad con signos de exclamación, área con almohadilla */
  if((m = buscar(/\s(!{1,3})(?=\s)/))) prio = m[1].length;
  if((m = /\s#([\wáéíóúñü]+)(?=\s)/i.exec(orig))){ area = cap(m[1]); cortar(m); }

  /* Solo la hora: hoy si aún no ha pasado; si ya pasó, mañana */
  if(hora && !fecha) fecha = hora > horaAhora() ? hoy : sumarDias(hoy, 1);

  var limpio = orig.replace(/\s+/g, ' ').trim()
                   .replace(/\s+(el|la|a|para|de|en|y)$/i, '')
                   .replace(/^(el|la|para)\s+/i, '');
  return { texto:limpio, fecha:fecha, hora:hora, prio:prio, area:area };
}

/* ==========================================================================
   LO QUE TOCA CADA DÍA
   Junta en una sola lista los eventos, los recordatorios, las tareas y los
   pagos de un día, con su hora, para pintarlos igual en Hoy y en el
   Calendario.
   ========================================================================== */
function momentoR(r){ return r.pospuesto || (r.fecha + 'T' + (r.hora || '09:00')); }

/* Día del mes en que vence un pago (el 31 en febrero es el 28) */
function diaPago(p, ym){
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  var fin = new Date(y, m, 0).getDate();
  return ym + '-' + dos(Math.min(+p.dia || 1, fin));
}
function pagado(p, ym){ return !!(p.pagados && p.pagados[ym]); }
function edadCumple(e, dia){ return e.nacio ? +dia.slice(0, 4) - +e.nacio : 0; }

function itemsDelDia(dia){
  var out = [];
  vivos('eventos').forEach(function(e){
    if(ocurre(e.fecha, e.rep, dia, e.hasta)){
      var t = e.cumple ? '🎂 ' + e.t + (edadCumple(e, dia) > 0 ? ' (' + edadCumple(e, dia) + ')' : '') : e.t;
      out.push({ tipo:'evento', id:e.id, t:t, hora:e.todo ? '' : (e.ini || ''), fin:e.todo ? '' : (e.fin || ''),
                 c:e.cumple ? 'var(--rosa)' : color(e.color), lugar:e.lugar || '', o:e });
    }
  });
  vivos('recordatorios').forEach(function(r){
    var toca = r.hecho ? r.fecha === dia : ocurre(r.fecha, r.rep, dia);
    if(toca) out.push({ tipo:'rec', id:r.id, t:r.t, hora:r.hora || '09:00', c:'var(--oro)', hecho:!!r.hecho && !r.rep, o:r });
  });
  vivos('tareas').forEach(function(t){
    if(t.fecha === dia) out.push({ tipo:'tarea', id:t.id, t:t.t, hora:t.hora || '', c:PRIOS[t.prio || 0].c, hecho:!!t.hecha, o:t });
  });
  var ym = dia.slice(0, 7);
  vivos('pagos').forEach(function(p){
    if(p.activo === false || (p.desde && ym < p.desde)) return;
    if(diaPago(p, ym) === dia) out.push({ tipo:'pago', id:p.id, t:(p.em ? p.em + ' ' : '') + p.t, hora:'', c:'var(--oro)', hecho:pagado(p, ym), ym:ym, o:p });
  });
  out.sort(function(a, b){
    if(!a.hora !== !b.hora) return a.hora ? 1 : -1;       // lo de todo el día, arriba
    return (a.hora || '').localeCompare(b.hora || '') || a.t.localeCompare(b.t);
  });
  return out;
}

function tareasPendientesHoy(){
  var hoy = hoyISO();
  return vivos('tareas').filter(function(t){ return !t.hecha && t.fecha && t.fecha <= hoy; });
}
function recordatoriosVencidos(){
  var ya = hoyISO() + 'T' + horaAhora();
  return vivos('recordatorios').filter(function(r){ return !r.hecho && r.fecha && momentoR(r) <= ya; });
}
/* Pagos sin pagar que vencen en los próximos `dias` (o ya vencieron este mes) */
function pagosProximos(dias){
  var hoy = hoyISO(), lim = sumarDias(hoy, dias), out = [];
  [hoy.slice(0, 7), sumarDias(hoy.slice(0, 7) + '-28', 7).slice(0, 7)].forEach(function(ym){
    vivos('pagos').forEach(function(p){
      if(p.activo === false || (p.desde && ym < p.desde) || pagado(p, ym)) return;
      var d = diaPago(p, ym);
      if(d <= lim && (d >= hoy || ym === hoy.slice(0, 7))) out.push({ p:p, ym:ym, dia:d });
    });
  });
  return out.sort(function(a, b){ return a.dia.localeCompare(b.dia); });
}
function proximosCumples(dias){
  var hoy = hoyISO(), out = [];
  vivos('eventos').forEach(function(e){
    if(!e.cumple) return;
    for(var i = 0; i <= dias; i++){
      var d = sumarDias(hoy, i);
      if(ocurre(e.fecha, 'ano', d)){ out.push({ e:e, dia:d, en:i }); break; }
    }
  });
  return out.sort(function(a, b){ return a.en - b.en; });
}

/* Cuentas guarda sus movimientos en el mismo navegador: se leen de ahí */
function movimientos(clave){
  var raw = leerJSON(clave || CLAVE_LEDGER, null);
  var l = raw && Array.isArray(raw.transactions) ? raw.transactions : (Array.isArray(raw) ? raw : []);
  return l.filter(function(t){ return t && /^\d{4}-\d{2}-\d{2}$/.test(t.date); });
}

  $('barraInf').innerHTML = ABAJO.map(function(id){

    var n = id === 'tareas' ? k.tareas : 0;
    return '<button type="button" data-ir="' + id + '"' + (ui.vista === id ? ' aria-current="page"' : '') + '>' +
             ico(s.ico) + (s.corto || s.nom) + (n ? '<span class="globo">' + n + '</span>' : '') + '</button>';
  }).join('') +
  '<button type="button" data-acc="menu-mas"' + (enMas ? ' aria-current="page"' : '') + '>' + ico('i-mas') + 'Más' +
    (otros ? '<span class="globo">' + otros + '</span>' : '') + '</button>';
  document.querySelectorAll('.lateral .pie [data-ir]').forEach(function(b){
    if(ui.vista === 'ajustes') b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  $('marcaNombre').textContent = db.perfil.nombre ? 'de ' + db.perfil.nombre : 'Mi organización';
}

function ir(v, sinHash){
  if(v === 'cuentas') v = 'personal';    // la dirección de antes sigue valiendo
  if(v !== 'ajustes' && !SECCIONES.some(function(s){ return s.id === v; })) v = 'hoy';
  if(v !== 'listas') ui.lista = null;
  ui.vista = v;
  if(!sinHash && location.hash !== '#' + v){
    try{ history.pushState(null, '', '#' + v); }catch(e){ location.hash = v; }
  }
  cerrarFlotante();
  pintar();
  window.scrollTo(0, 0);
}

/* Si estás escribiendo en la página, no se repinta por debajo: perderías
   lo escrito. Se espera a que sueltes el campo. */
var repintarAlSoltar = false;
function pintarSeguro(){
  var a = document.activeElement;
  if(a && $('contenido').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ repintarAlSoltar = true; return; }
  pintar();
}

function pintar(){
  repintarAlSoltar = false;
  pintarNav();
  var v = ui.vista;
  var sec = SECCIONES.find(function(s){ return s.id === v; });
  $('tituloVista').textContent = v === 'ajustes' ? 'Ajustes' : (v === 'listas' && ui.lista ? (listaActual() || {}).nombre || 'Listas' : sec.nom);
  if(!foco.fin) document.title = (v === 'hoy' ? 'Agenda' : $('tituloVista').textContent + ' · Agenda');
  document.body.classList.toggle('en-cuentas', esLibro(v));

  if(esLibro(v)){
    $('contenido').classList.add('oculto');
    mostrarLibro(v);
    ui.antes = v;
    return;
  }
  $('zonaCuentas').classList.add('oculto');
  $('contenido').classList.remove('oculto');

  var html = VISTAS[v]();
  var nueva = ui.antes !== v + (ui.lista || '');
  $('contenido').innerHTML = '<div class="' + (nueva ? 'vista' : '') + '">' + html + '</div>';
  ui.antes = v + (ui.lista || '');
  if(v === 'hoy' || v === 'tareas' || v === 'recordatorios') actualizarPista();
  tictac();
}

/* ==========================================================================
   PIEZAS QUE SE REPITEN
   ========================================================================== */
function casilla(acc, id, marcada, c, cuadrada, extra){
  return '<button type="button" class="casilla' + (cuadrada ? ' cuadrada' : '') + '" role="checkbox" aria-checked="' + !!marcada + '"' +
         (c ? ' style="--c:' + c + '"' : '') + ' data-acc="' + acc + '" data-id="' + id + '"' + (extra || '') + ' aria-label="Marcar">' + CHECK + '</button>';
}

/* Cabecera de tarjeta con su azulejo de color */
function cabTarjeta(icono, titulo, c, mas, masAcc){
  return '<div class="tarjeta-cab"><h2><span class="azulejo" style="--c:' + (c || 'var(--verde)') + '">' + ico(icono) + '</span>' + titulo + '</h2>' +
    (mas ? '<button class="mas" ' + (masAcc || '') + '>' + mas + ico('i-der') + '</button>' : '') + '</div>';
}

function metaFecha(fecha, hora, hecha){
  if(!fecha) return '';
  var hoy = hoyISO();
  var cls = hecha ? '' : (fecha < hoy ? 'tarde' : fecha === hoy ? 'hoy' : '');
  return '<span class="' + cls + '">' + ico('i-cal') + relativo(fecha) + (hora ? ' · ' + hora : '') + '</span>';
}

function filaTarea(t){
  var sub = t.sub && t.sub.length ? t.sub.filter(function(s){ return s.ok; }).length + '/' + t.sub.length : '';
  var paraMover = !t.hecha && t.fecha && t.fecha <= hoyISO();
  return '<div class="fila' + (t.hecha ? ' hecha' : '') + '" data-fila="' + t.id + '">' +
    casilla('tarea-ok', t.id, t.hecha, t.prio ? PRIOS[t.prio].c : '') +
    '<div class="cuerpo" data-acc="tarea-ed" data-id="' + t.id + '">' +
      '<div class="titulo">' + esc(t.t) + '</div>' +
      '<div class="meta">' +
        metaFecha(t.fecha, t.hora, t.hecha) +
        (t.rep && t.rep !== 'no' ? '<span>' + ico('i-rep') + REPS_CORTO[t.rep] + '</span>' : '') +
        (sub ? '<span>' + ico('i-sub') + sub + '</span>' : '') +
        (t.area ? '<span class="etiqueta">' + esc(t.area) + '</span>' : '') +
        (t.notas ? '<span>' + ico('i-notas') + '</span>' : '') +
        (t.hecha && t.hechaEn ? '<span>Hecha ' + relativo(iso(new Date(t.hechaEn))).toLowerCase() + '</span>' : '') +
      '</div>' +
    '</div>' +
    (paraMover ? '<div class="lado"><button class="btn-icono" data-acc="tarea-manana" data-id="' + t.id + '" title="Pasar a mañana" aria-label="Pasar a mañana">' + ico('i-flecha') + '</button></div>' : '') +
  '</div>';
}

function filaAgenda(it, conFecha){
  var izq;
  if(it.tipo === 'tarea') izq = casilla('tarea-ok', it.id, it.hecho, it.o.prio ? it.c : '');
  else if(it.tipo === 'pago') izq = casilla('pago-ok', it.id, it.hecho, 'var(--oro)', false, ' data-ym="' + it.ym + '"');
  else if(it.tipo === 'rec') izq = '<span class="icono-tipo" style="--c:var(--oro)">' + ico('i-campana') + '</span>';
  else izq = '<span class="barrita" style="--c:' + it.c + '"></span>';
  var acc = { tarea:'tarea-ed', rec:'rec-ed', pago:'pago-ed', evento:'evento-ed' }[it.tipo];
  var cuando = it.hora ? it.hora + (it.fin ? '–' + it.fin : '') : (it.tipo === 'evento' ? 'Todo el día' : '');
  var nom = { evento:it.o.cumple ? 'Cumpleaños' : 'Evento', rec:'Recordatorio', tarea:'Tarea', pago:'Pago · ' + dinero(+it.o.monto || 0) }[it.tipo];
  return '<div class="fila' + (it.hecho ? ' hecha' : '') + '">' +
    '<span class="hora">' + (it.hora || '—') + '</span>' + izq +
    '<div class="cuerpo" data-acc="' + acc + '" data-id="' + it.id + '"' + (conFecha ? ' data-dia="' + conFecha + '"' : '') + '>' +
      '<div class="titulo">' + esc(it.t) + '</div>' +
      '<div class="meta">' +
        '<span>' + nom + (cuando && it.tipo === 'evento' && !it.o.cumple ? ' · ' + cuando : '') + '</span>' +
        (it.lugar ? '<span>' + ico('i-lugar') + esc(it.lugar) + '</span>' : '') +
        (it.o.rep && it.o.rep !== 'no' && !it.o.cumple ? '<span>' + ico('i-rep') + REPS_CORTO[it.o.rep] + '</span>' : '') +
      '</div>' +
    '</div>' +
  '</div>';
}

function vacio(emoji, titulo, texto){
  return '<div class="vacio"><span class="emoji">' + emoji + '</span><b>' + titulo + '</b>' + (texto || '') + '</div>';
}

function captura(tipos, placeholder){
  var tipo = tipos.indexOf(ui.capTipo) >= 0 ? ui.capTipo : tipos[0];
  ui.capTipo = tipo;
  var NOM = { tarea:'Tarea', rec:'Recordatorio', evento:'Evento', nota:'Nota' };
  return (tipos.length > 1 ?
    '<div class="fichas desliza" style="margin-bottom:8px">' + tipos.map(function(t){
      return '<button type="button" class="ficha" data-acc="cap-tipo" data-tipo="' + t + '" aria-pressed="' + (t === tipo) + '">' + NOM[t] + '</button>';
    }).join('') + '</div>' : '') +
    '<form class="captura" data-acc="captura" autocomplete="off">' +
      '<input id="entradaCaptura" type="text" enterkeyhint="done" maxlength="200" placeholder="' + esc(placeholder) + '">' +
      '<button type="submit" class="btn primario chico">' + ico('i-plus') + 'Añadir</button>' +
    '</form>' +
    '<div class="pista" id="pista"></div>';
}

function actualizarPista(){
  var el = $('pista'), inp = $('entradaCaptura');
  if(!el || !inp) return;
  var v = inp.value.trim();
  if(!v){
    el.innerHTML = 'Escribe natural: <b>«pagar la luz el viernes a las 6 !!»</b> o <b>«dentista 15/10 9:30 #salud»</b>';
    return;
  }
  var p = interpretar(v), bits = [];
  if(p.fecha) bits.push(relativo(p.fecha) + ' (' + fechaCorta(p.fecha) + ')');
  if(p.hora) bits.push(p.hora);
  if(p.prio) bits.push('prioridad ' + PRIOS[p.prio].n.toLowerCase());
  if(p.area) bits.push('#' + p.area);
  el.innerHTML = bits.length ? 'Se guardará: <b>' + esc(p.texto || '…') + '</b> · ' + esc(bits.join(' · ')) : '';
}

function fraseDelDia(){
  var d = new Date(), ini = new Date(d.getFullYear(), 0, 0);
  return FRASES[Math.floor((d - ini) / 864e5) % FRASES.length];
}

/* ---------- Hoy ---------------------------------------------------------- */
VISTAS.hoy = function(){
  var hoy = hoyISO(), h = new Date().getHours();
  var saludo = h < 6 ? 'Buenas noches' : h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  var emoji = h < 6 ? '🌙' : h < 12 ? '☀️' : h < 19 ? '🌤️' : '🌙';
  var nombre = db.perfil.nombre;
  var total = COLS.reduce(function(s, c){ return s + vivos(c).length; }, 0);

  var tareasHoy = vivos('tareas').filter(function(t){
    return (t.fecha && t.fecha <= hoy && !t.hecha) || (t.hecha && t.hechaEn && iso(new Date(t.hechaEn)) === hoy) || (t.log && t.log.indexOf(hoy) >= 0);
  });

  var pct = tareasHoy.length ? hechas / tareasHoy.length : 0;

      '<p class="frase">«' + esc(fraseDelDia()) + '»</p></div>' +
      '<svg class="anillo" viewBox="0 0 54 54" aria-label="' + Math.round(pct * 100) + '% de las tareas de hoy"><circle class="fondo" cx="27" cy="27" r="22"/>' +
      '<circle class="valor" cx="27" cy="27" r="22" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"/></svg>' +
    '</div>' +
    '<div class="datos">' +
      '<button class="dato" data-ir="tareas">' + ico('i-tareas') + '<b>' + (tareasHoy.length - hechas) + '</b> por hacer</button>' +
      '<button class="dato" data-ir="calendario">' + ico('i-cal') + '<b>' + agenda.filter(function(i){ return i.tipo === 'evento'; }).length + '</b> eventos</button>' +
      '<button class="dato" data-ir="recordatorios">' + ico('i-campana') + '<b>' + agenda.filter(function(i){ return i.tipo === 'rec' && !i.hecho; }).length + '</b> avisos</button>' +
      (pendPagos ? '<button class="dato" data-ir="pagos">' + ico('i-recibo') + '<b>' + pendPagos + '</b> por pagar</button>' : '') +
    '</div></section>';

  if(!total && !nombre){
    html += '<div class="tarjeta" style="margin-bottom:16px"><div class="tarjeta-cuerpo" style="padding:18px 16px">' +
      '<b style="font-size:16px;display:block;margin-bottom:4px">Bienvenido a tu agenda 👋</b>' +
      '<p style="margin:0 0 12px;color:var(--tinta-2);font-size:13.5px">Tareas, listas, calendario, recordatorios que suenan, hábitos, metas, diario, pagos, notas y tu libro de cuentas: todo en un solo sitio y solo para ti. ¿Cómo te llamas?</p>' +
      '<form data-acc="bienvenida" class="captura" style="margin:0 0 10px"><input id="nombreBienvenida" type="text" maxlength="40" placeholder="Tu nombre"><button class="btn primario chico" type="submit">Empezar</button></form>' +
      '<button type="button" class="btn chico" data-acc="ejemplos">Ver con ejemplos</button>' +
    '</div></div>';
  }

  html += captura(['tarea','rec','evento','nota'], 'Añade algo… (Enter para guardar)');
  html += '<div class="rejilla dos">';

  /* Tu día */
  html += '<section class="tarjeta">' + cabTarjeta('i-cal', 'Tu día', 'var(--verde)', 'Calendario', 'data-ir="calendario"') +
    (agenda.length ? '<div class="lista-filas">' + agenda.map(function(i){ return filaAgenda(i); }).join('') + '</div>'
                   : '<div class="vacio" style="padding-top:4px">Sin eventos, avisos ni pagos hoy.</div>') +
    '</section>';

  /* Enfoque */
  var enf = buscarId('enfoque', hoy);
  var ei = (enf && !enf.del && enf.items) || [];
  html += '<section class="tarjeta">' + cabTarjeta('i-diana', 'Enfoque de hoy', 'var(--haber)') +
    '<p style="margin:0 16px 6px;font-size:12.5px;color:var(--tinta-3)">Las tres cosas que harían de hoy un buen día.</p>' +
    '<div class="enfoque">' + [0,1,2].map(function(i){
      var x = ei[i] || { t:'', ok:false };
      return '<label class="' + (x.ok ? 'hecho' : '') + '"><span class="n">' + (i + 1) + '</span>' +
        '<input type="text" maxlength="120" data-enfoque="' + i + '" value="' + esc(x.t) + '" placeholder="' + ['Lo más importante','Lo segundo','Lo tercero'][i] + '">' +
        casilla('enfoque-ok', String(i), x.ok, 'var(--haber)', true) + '</label>';

  /* Metas */

  if(ms.length){
    html += '<section class="tarjeta">' + cabTarjeta('i-meta', 'Tus metas', 'var(--verde)', 'Metas', 'data-ir="metas"') +

  /* Semana */

      return '<div class="fila"><span class="hora" style="width:74px">' + relativo(p.d) + '</span>' +
        '<span class="barrita" style="--c:' + p.x.c + '"></span>' +
        '<div class="cuerpo" data-acc="' + acc + '" data-id="' + p.x.id + '"><div class="titulo">' + esc(p.x.t) + '</div>' +
        '<div class="meta"><span>' + (p.x.hora || 'Todo el día') + '</span></div></div></div>';
    }).join('') + '</div>' : '<div class="vacio" style="padding-top:0">Nada agendado los próximos 7 días.</div>') +
    '</section>';

  /* Dinero: los dos libros */
  var mes = hoy.slice(0, 7);
  [['personal', CLAVE_LEDGER, 'Gastos personales', 'i-cuentas', 'var(--haber)'], ['oficina', CLAVE_OFICINA, 'Oficina', 'i-maletin', 'var(--azul)']].forEach(function(L){
    var ent = 0, sal = 0, tot = 0, n = 0;
    movimientos(L[1]).forEach(function(t){
      var a = Math.abs(+t.amount || 0), sg = t.type === 'Gasto' ? -a : a;
      tot += sg; n++;
      if(t.date.slice(0, 7) === mes){ if(sg < 0) sal += a; else ent += a; }
    });
    html += '<section class="tarjeta">' + cabTarjeta(L[3], L[2] + ' · ' + MESES[new Date().getMonth()], L[4], 'Abrir', 'data-ir="' + L[0] + '"') +
      (n ? '<div class="cifras"><div class="entra"><small>Entró</small><b>' + dinero(ent) + '</b></div>' +
        '<div class="sale"><small>Salió</small><b>' + dinero(sal) + '</b></div>' +
        '<div><small>Saldo</small><b style="color:' + (tot < 0 ? 'var(--debe)' : 'var(--tinta)') + '">' + dinero(tot) + '</b></div></div>'
         : '<div class="vacio" style="padding-top:2px">Aún no hay movimientos. <button class="btn chico" style="margin-top:8px" data-ir="' + L[0] + '">' + ico('i-plus') + 'Anotar el primero</button></div>') +
      '</section>';
  });

  /* Notas fijadas */
  var fijas = vivos('notas').filter(function(n){ return n.fija; });
  if(fijas.length){
    html += '<section class="tarjeta ancho-2">' + cabTarjeta('i-pin', 'Notas fijadas', 'var(--oro)', 'Notas', 'data-ir="notas"') +
      '<div class="tarjeta-cuerpo"><div class="notas-muro">' + fijas.map(tarjetaNota).join('') + '</div></div></section>';
  }
  html += '</div>';
  return html;
};
/* ---------- Tareas -------------------------------------------------------- */
function ordenTareas(a, b){
  return (a.fecha || '9999').localeCompare(b.fecha || '9999') ||
         (b.prio || 0) - (a.prio || 0) ||
         (a.hora || '99').localeCompare(b.hora || '99') ||
         (a.creada || 0) - (b.creada || 0);
}

VISTAS.tareas = function(){
  var hoy = hoyISO(), fin7 = sumarDias(hoy, 7);
  var todas = vivos('tareas');
  var enArea = ui.tArea ? todas.filter(function(t){ return (t.area || '') === ui.tArea; }) : todas;
  var F = {
    hoy:     function(t){ return !t.hecha && t.fecha && t.fecha <= hoy; },
    prox:    function(t){ return !t.hecha && t.fecha > hoy; },
    todas:   function(t){ return !t.hecha; },
    algun:   function(t){ return !t.hecha && !t.fecha; },
    hechas:  function(t){ return t.hecha; }
  };
  var NOM = { hoy:'Hoy', prox:'Próximas', todas:'Pendientes', algun:'Algún día', hechas:'Hechas' };
  var html = captura(['tarea'], 'Nueva tarea… ej. «comprar regalo el sábado #casa»');

  html += '<div class="fichas desliza">' + Object.keys(F).map(function(k){
    var n = enArea.filter(F[k]).length;
    return '<button type="button" class="ficha" data-acc="t-filtro" data-f="' + k + '" aria-pressed="' + (ui.tFiltro === k) + '">' + NOM[k] +
      (k !== 'hechas' && n ? ' <span class="n">' + n + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  var areas = [];
  todas.forEach(function(t){ if(t.area && areas.indexOf(t.area) < 0) areas.push(t.area); });
  if(areas.length){
    html += '<div class="fichas desliza" style="margin-top:-6px">' +
      '<button type="button" class="ficha" data-acc="t-area" data-a="" aria-pressed="' + !ui.tArea + '">Todas las áreas</button>' +
      areas.sort().map(function(a){
        return '<button type="button" class="ficha" data-acc="t-area" data-a="' + esc(a) + '" aria-pressed="' + (ui.tArea === a) + '">#' + esc(a) + '</button>';
      }).join('') + '</div>';
  }

  var lista = enArea.filter(F[ui.tFiltro]);
  if(ui.tFiltro === 'hechas'){
    lista.sort(function(a, b){ return (b.hechaEn || 0) - (a.hechaEn || 0); });
    if(!lista.length) return html + '<div class="tarjeta">' + vacio('🗂️', 'Aún no hay tareas hechas') + '</div>';
    return html + '<div class="tarjeta"><div class="lista-filas">' + lista.slice(0, 200).map(filaTarea).join('') + '</div></div>' +
      '<div style="margin-top:12px"><button class="btn chico peligro" data-acc="t-borrar-hechas">' + ico('i-basura') + 'Borrar las hechas</button></div>';
  }
  lista.sort(ordenTareas);
  if(!lista.length){
    var txt = { hoy:['🌤️','Nada para hoy','Las tareas con fecha de hoy o atrasadas salen aquí.'],
                prox:['📆','Nada más adelante','Pon fecha a una tarea y aparecerá aquí.'],
                todas:['🎉','No tienes nada pendiente',''],
                algun:['💭','Sin tareas sin fecha','Lo que quieras hacer “algún día” va aquí.'] }[ui.tFiltro];
    return html + '<div class="tarjeta">' + vacio(txt[0], txt[1], txt[2]) + '</div>';
  }

  var grupos = [], idx = {};
  function meter(clave, titulo, rojo, t){
    if(!(clave in idx)){ idx[clave] = grupos.length; grupos.push({ t:titulo, rojo:rojo, l:[] }); }
    grupos[idx[clave]].l.push(t);
  }
  lista.forEach(function(t){
    if(!t.fecha) meter('z', 'Sin fecha', false, t);
    else if(t.fecha < hoy) meter('a', 'Atrasadas', true, t);
    else if(t.fecha === hoy) meter('b', 'Hoy', false, t);
    else if(t.fecha <= fin7) meter('c' + t.fecha, cap(relativo(t.fecha)) + ' · ' + fechaCorta(t.fecha), false, t);
    else meter('y' + t.fecha.slice(0, 7), cap(MESES[deISO(t.fecha).getMonth()]) + ' ' + t.fecha.slice(0, 4), false, t);
  });
  return html + grupos.map(function(g){
    return '<div class="seccion-tit' + (g.rojo ? ' rojo' : '') + '">' + g.t + ' <span class="n">' + g.l.length + '</span>' +
      (g.rojo ? '<button class="btn chico" style="margin-left:auto;text-transform:none;letter-spacing:0" data-acc="t-atrasadas-hoy">Pasar a hoy</button>' : '') + '</div>' +
      '<div class="tarjeta"><div class="lista-filas">' + g.l.map(filaTarea).join('') + '</div></div>';
  }).join('');
};

VISTAS.calendario = function(){

  var primero = iso(new Date(y, m, 1));
  var html = '<div class="cal-cab">' +
    '<button class="btn-icono" data-acc="cal-mover" data-n="-1" aria-label="Mes anterior">' + ico('i-izq') + '</button>' +
    '<h2>' + MESES[m] + ' ' + y + '</h2>' +
    '<button class="btn-icono" data-acc="cal-mover" data-n="1" aria-label="Mes siguiente">' + ico('i-der') + '</button>' +
    '<div class="der"><button class="btn chico" data-acc="cal-hoy">Hoy</button>' +
    '<div class="selector"><button data-acc="cal-modo" data-m="mes" aria-pressed="' + (ui.calModo === 'mes') + '">Mes</button>' +
    '<button data-acc="cal-modo" data-m="agenda" aria-pressed="' + (ui.calModo === 'agenda') + '">Agenda</button></div></div>' +
  '</div>';

  if(ui.calModo === 'agenda'){
    var dias = '', cuantos = 0;
    var desde = ui.calMes === hoy.slice(0, 7) ? hoy : primero;
    for(var i = 0; i < 90; i++){
      var d = sumarDias(desde, i), its = itemsDelDia(d);
      if(!its.length) continue;
      cuantos++;
      dias += '<div class="seccion-tit' + (d === hoy ? '" style="color:var(--verde-sube)' : '') + '">' + cap(relativo(d)) + (Math.abs(diasEntre(hoy, d)) < 7 ? ' · ' + fechaCorta(d) : '') + '</div>' +
        '<div class="tarjeta"><div class="lista-filas">' + its.map(function(x){ return filaAgenda(x, d); }).join('') + '</div></div>';
    }
    return html + (cuantos ? dias : '<div class="tarjeta">' + vacio('🗓️', 'Nada en los próximos 90 días', 'Toca + para añadir un evento.') + '</div>');
  }

  var ini = inicioSemana(primero);
  var cab = [];
  for(var k = 0; k < 7; k++) cab.push(DIAS3[deISO(sumarDias(ini, k)).getDay()]);
  var celdas = '';
  for(var j = 0; j < 42; j++){
    var dd = sumarDias(ini, j);
