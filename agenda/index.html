<head>

<meta name="description" content="Agenda personal: tareas, listas, calendario, recordatorios, hábitos, metas, diario, pagos, notas y cuentas.">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="jakarta.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="barlow-700.woff2" as="font" type="font/woff2" crossorigin>
<title>Agenda</title>
<script>
/* Tema y paleta ANTES de pintar nada (claves propias de la agenda), y el
   manifiesto generado aquí mismo: arranca en ESTA página se llame como se
   llame el archivo, y lleva el logo. Sin él Android no ofrece instalar. */
(function(){
  try{
    var t = localStorage.getItem('agenda_tema');
    var p = localStorage.getItem('agenda_paleta');
    /* Eléctrico pasa a ser la de siempre: quien tenía Brasa por defecto, cambia una vez */
    /* Negro pasa a ser la de siempre: todos cambian una vez al diseño nuevo */
    if(!localStorage.getItem('agenda_pal_v3')){ p = 'negro'; localStorage.setItem('agenda_paleta', p); localStorage.setItem('agenda_pal_v3', '1'); }
    if(t === 'claro') document.documentElement.setAttribute('data-tema','claro');
    if(/^(negro|electrico|brasa|jade|grafito)$/.test(p || '')) document.documentElement.setAttribute('data-paleta', p);
  }catch(e){}
  try{
    var aqui = location.pathname || './';
    var carpeta = aqui.replace(/[^\/]*$/, '');
    var base = location.origin && location.origin !== 'null' ? location.origin : '';
    var m = {
      name:'Agenda · Mi organización', short_name:'Agenda',
      description:'Tareas, listas, calendario, recordatorios, hábitos, metas, diario, pagos, notas y cuentas.',
      start_url: base + aqui, id: base + aqui, scope: base + carpeta,
      display:'standalone', orientation:'any', lang:'es',
      background_color:'#000000', theme_color:'#000000',
      categories:['productivity','lifestyle','finance'],
      icons:[{src:base+carpeta+"icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},{src:base+carpeta+"icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"},{src:base+carpeta+"icon-maskable-512.png",sizes:"512x512",type:"image/png",purpose:"maskable"}],
      shortcuts:[
        { name:'Anotar gasto', short_name:'Gasto', url: base + aqui + '#gasto' },
        { name:'Añadir tarea', short_name:'Tarea', url: base + aqui + '#anadir' },
        { name:'Calendario', url: base + aqui + '#calendario' },
        { name:'Tareas',     url: base + aqui + '#tareas' }
      ]
    };
    var txt = JSON.stringify(m), h;
    try{ h = URL.createObjectURL(new Blob([txt], { type:'application/manifest+json' })); }
    catch(_){ h = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(txt); }
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = h;
    document.head.appendChild(l);
  }catch(e){}
  window.ICONO_AGENDA = 'icon-192.png';
  window.FUENTE_AGENDA = new URL("jakarta.woff2", location.href).href;
  window.SERIF_AGENDA = new URL("barlow-700.woff2", location.href).href;
})();
</script>

*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100% }
body{
margin:0; min-height:100vh; min-height:100dvh;
font-family:var(--letra); font-size:15px; line-height:1.5;
color:var(--tinta); background:var(--papel);

overscroll-behavior-y:none;
}
button,input,select,textarea{ font:inherit; color:inherit }
button{ cursor:pointer; background:none; border:none; padding:0 }
a{ color:var(--verde) }
:focus-visible{ outline:2px solid var(--verde); outline-offset:2px; border-radius:6px }
.oculto{ display:none !important }
.cifra{ font-family:var(--cifra); font-variant-numeric:tabular-nums; letter-spacing:-.01em; font-feature-settings:'tnum' }
svg.i{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }

*,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important }
}
.app{ min-height:100vh; min-height:100dvh }
.lateral{
position:fixed; inset:0 auto 0 0; width:var(--lateral); z-index:30;

}
.marca{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px }

.nav-lat{ display:flex; flex-direction:column; gap:2px }
.nav-lat button{

padding:9px 10px; border-radius:10px; text-align:left;

.nav-lat button:hover{ background:var(--hoja-2); color:var(--tinta) }

.lateral .pie{ margin-top:auto; padding-top:12px }
.principal{ min-width:0 }
.cabecera{
position:sticky; top:0; z-index:20;

.cabecera h1{ margin:0; font-size:19px; letter-spacing:-.02em; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

}
.btn-icono:hover{ background:var(--hoja-2); color:var(--tinta) }

}
.pastilla .punto{ width:7px; height:7px; border-radius:50%; background:var(--tinta-3) }
.pastilla[data-estado="ok"] .punto{ background:var(--haber) }

.barra-inf{

display:grid; grid-template-columns:repeat(5,1fr);
height:calc(var(--barra) + env(safe-area-inset-bottom));
padding-bottom:env(safe-area-inset-bottom);

}
.barra-inf button svg{ width:22px; height:22px }
.barra-inf button[aria-current="page"]{ color:var(--verde-sube) }

}
.barra-inf .globo{

}
.fab{
position:fixed; right:18px; bottom:calc(var(--barra) + 16px + env(safe-area-inset-bottom)); z-index:25;
width:56px; height:56px; border-radius:18px; display:grid; place-items:center;
background:var(--verde); color:var(--papel); box-shadow:var(--sombra-alta);
transition:transform .15s;
}
.fab:hover{ transform:translateY(-2px) }
.fab svg{ width:26px; height:26px; stroke-width:2.6 }
@media (min-width:900px){

        <button type="button" class="btn-icono" id="btnAdelante" data-acc="nav-adelante" title="Pantalla siguiente (Alt+→)" aria-label="Pantalla siguiente" disabled><svg class="i"><use href="#i-der"/></svg></button>

        <button type="button" class="btn-icono" id="btnRehacer" data-acc="rehacer" title="Rehacer (Ctrl+Y)" aria-label="Rehacer" disabled><svg class="i"><use href="#i-rehacer"/></svg></button>

        <button type="button" class="btn-icono" id="btnBuscar" title="Buscar (/)" aria-label="Buscar"><svg class="i"><use href="#i-buscar"/></svg></button>
        <button type="button" class="btn-icono solo-escritorio" id="btnTema" title="Claro u oscuro" aria-label="Cambiar tema"><svg class="i"><use href="#i-luna"/></svg></button>
        <button type="button" class="btn-icono solo-movil" data-ir="ajustes" aria-label="Ajustes"><svg class="i"><use href="#i-ajustes"/></svg></button>
      </div>
    </header>

    <main class="contenido" id="contenido"></main>
  </div>
