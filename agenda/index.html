<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="jakarta.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="barlow-700.woff2" as="font" type="font/woff2" crossorigin>
<title>Agenda</title>
<script>
/* Tema y paleta ANTES de pintar nada (claves propias de la agenda), y el
   manifiesto generado aquí mismo: arranca en ESTA página se llame como se
   llame el archivo, y lleva el logo. Sin él Android no ofrece instalar. */
(function(){
  try{
    var t = localStorage.getItem('agenda_tema');
    var p = localStorage.getItem('agenda_paleta');
    /* Eléctrico pasa a ser la de siempre: quien tenía Brasa por defecto, cambia una vez */
    /* Negro pasa a ser la de siempre: todos cambian una vez al diseño nuevo */
    if(!localStorage.getItem('agenda_pal_v3')){ p = 'negro'; localStorage.setItem('agenda_paleta', p); localStorage.setItem('agenda_pal_v3', '1'); }
    if(t === 'claro') document.documentElement.setAttribute('data-tema','claro');
    if(/^(negro|electrico|brasa|jade|grafito)$/.test(p || '')) document.documentElement.setAttribute('data-paleta', p);
  }catch(e){}
  try{
    var aqui = location.pathname || './';
    var carpeta = aqui.replace(/[^\/]*$/, '');
    var base = location.origin && location.origin !== 'null' ? location.origin : '';
    var m = {
      name:'Agenda · Mi organización', short_name:'Agenda',
      description:'Tareas, listas, calendario, recordatorios, hábitos, metas, diario, pagos, notas y cuentas.',
      start_url: base + aqui, id: base + aqui, scope: base + carpeta,
      display:'standalone', orientation:'any', lang:'es',
      background_color:'#000000', theme_color:'#000000',
      categories:['productivity','lifestyle','finance'],
      icons:[{src:base+carpeta+"icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},{src:base+carpeta+"icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"},{src:base+carpeta+"icon-maskable-512.png",sizes:"512x512",type:"image/png",purpose:"maskable"}],
      shortcuts:[
        { name:'Anotar gasto', short_name:'Gasto', url: base + aqui + '#gasto' },
        { name:'Anotar ingreso', short_name:'Ingreso', url: base + aqui + '#ingreso' },
        { name:'Añadir tarea', short_name:'Tarea', url: base + aqui + '#anadir' },
        { name:'Mi día', short_name:'Agenda', url: base + aqui + '#agenda' }
      ]
    };
    var txt = JSON.stringify(m), h;
    try{ h = URL.createObjectURL(new Blob([txt], { type:'application/manifest+json' })); }
    catch(_){ h = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(txt); }
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = h;
    document.head.appendChild(l);
  }catch(e){}
  window.ICONO_AGENDA = 'icon-192.png';
  window.FUENTE_AGENDA = new URL("jakarta.woff2", location.href).href;
  window.SERIF_AGENDA = new URL("barlow-700.woff2", location.href).href;
})();
</script>

.peso-form .entrada{ width:110px; height:34px }
.spark{ width:100%; height:64px; display:block; margin-top:8px }
.nota-chip{ display:inline-grid; place-items:center; min-width:34px; height:20px; padding:0 6px; border-radius:99px; font-family:var(--cifra); font-size:11.5px; font-weight:800; vertical-align:1px }
.nota-chip.ok{ background:var(--haber-piso); color:var(--haber) }
.nota-chip.mal{ background:var(--debe-piso); color:var(--debe) }
.fila-clase.nota-curso{ grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.8fr) 34px }
.fila-clase.nota-curso input:first-child{ text-align:left }
.vista .rejilla > *, .vista .proy-rejilla > *{ animation:entra .45s cubic-bezier(.2,.8,.2,1) both }
.vista .rejilla > *:nth-child(2), .vista .proy-rejilla > *:nth-child(2){ animation-delay:.05s }
.vista .rejilla > *:nth-child(3), .vista .proy-rejilla > *:nth-child(3){ animation-delay:.1s }
.vista .rejilla > *:nth-child(4), .vista .proy-rejilla > *:nth-child(4){ animation-delay:.15s }
.vista .rejilla > *:nth-child(n+5){ animation-delay:.2s }
.tarjeta{ transition:border-color .2s, box-shadow .2s }
.tarjeta:hover{ border-color:color-mix(in srgb, var(--verde) 28%, var(--regla)) }
.heroe{ animation:entra .5s cubic-bezier(.2,.8,.2,1) both }
.linea-tiempo{ position:relative; padding:4px 0 6px }
.linea-tiempo::before{ content:""; position:absolute; left:62px; top:10px; bottom:10px; width:2px; background:var(--regla); border-radius:2px }
.lt-item{ position:relative }
.lt-item .fila{ border-bottom:none; padding-top:9px; padding-bottom:9px }
.lt-item::before{ content:""; position:absolute; left:58px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--hoja); z-index:1 }
.lt-item .fila .hora{ width:38px }
.lt-item .fila > .barrita, .lt-item .fila > .icono-tipo, .lt-item .fila > .casilla{ margin-left:14px }
.lt-item.pasado{ opacity:.5 }
.lt-item.pasado::before{ background:var(--tinta-3) }
.ahora{ position:relative; height:22px; margin:2px 14px 2px 56px }
.ahora::before{ content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:var(--debe); border-radius:2px }
.ahora::after{ content:""; position:absolute; left:-1px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:var(--debe); box-shadow:0 0 0 4px color-mix(in srgb, var(--debe) 25%, transparent); animation:latirAhora 2s infinite }
.ahora span{ position:relative; z-index:1; margin-left:18px; padding:1px 8px; border-radius:99px; background:var(--debe); color:#fff; font-size:10.5px; font-weight:800; letter-spacing:.03em }
@keyframes latirAhora{ 50%{ box-shadow:0 0 0 8px color-mix(in srgb, var(--debe) 0%, transparent) } }
.esp-semana{ display:block; height:5px; border-radius:99px; background:color-mix(in srgb, var(--c) 18%, var(--regla-2)); overflow:hidden; position:relative; z-index:1 }
.esp-semana i{ display:block; height:100%; border-radius:99px; background:var(--c) }
.esp-semana-t{ font-size:10.5px !important }
.proy-rejilla{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)) }
.proy-card{ text-align:left; padding:14px; display:flex; flex-direction:column; gap:10px; border-top:3px solid var(--c); transition:transform .15s }
.proy-card:hover{ transform:translateY(-2px) }
.proy-cab{ display:flex; align-items:center; gap:12px }
.proy-cab b{ display:block; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.proy-cab small{ font-size:12px; color:var(--tinta-3) }
.proy-sig{ font-size:12.5px; color:var(--tinta-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.proy-sig b{ color:var(--tinta) }
.proy-lim{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--tinta-3) }
.proy-lim svg{ width:13px; height:13px } .proy-lim.pronto{ color:var(--oro) } .proy-lim.tarde{ color:var(--debe) }
.anillo-mini{ flex:none }
.heroe .anillo-mini circle:first-child{ stroke:rgba(255,255,255,.25) }
.heroe .anillo-mini text{ fill:#fff }
.sem-envoltura{ overflow-x:auto; -webkit-overflow-scrolling:touch }
.sem-rejilla{ display:grid; grid-template-columns:46px repeat(7, minmax(88px, 1fr)); min-width:680px }
.sem-horas .sem-cuerpo{ position:relative }
.sem-h{ position:absolute; right:6px; transform:translateY(-6px); font-family:var(--cifra); font-size:10.5px; color:var(--tinta-3) }
.sem-col{ border-left:1px solid var(--regla-2); min-width:0 }
.sem-col.hoy{ background:color-mix(in srgb, var(--verde) 6%, transparent) }
.sem-cab{ width:100%; height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-bottom:1px solid var(--regla) }
.sem-cab small{ font-size:10.5px; font-weight:800; text-transform:uppercase; color:var(--tinta-3) }
.sem-cab b{ font-size:17px }
.sem-col.hoy .sem-cab b{ color:var(--sobre-acento, var(--papel)); background:var(--verde); border-radius:8px; padding:0 7px }
.sem-todo{ padding:3px; display:flex; flex-direction:column; gap:2px; border-bottom:1px solid var(--regla); overflow:hidden }
.sem-chip{ font-size:11px; font-weight:650; text-align:left; padding:2px 6px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:color-mix(in srgb, var(--c) 22%, transparent); color:var(--tinta); height:20px; flex:none }
.sem-cuerpo{ position:relative; background:repeating-linear-gradient(180deg, transparent 0 45px, var(--regla-2) 45px 46px) }
.sem-ev{ position:absolute; text-align:left; padding:3px 6px; border-radius:8px; overflow:hidden; display:flex; flex-direction:column;
background:color-mix(in srgb, var(--c) 26%, var(--hoja)); border-left:3px solid var(--c); font-size:11px; line-height:1.25; transition:transform .12s, box-shadow .12s }
.sem-ev:hover{ transform:scale(1.02); box-shadow:var(--sombra); z-index:2 }
.sem-ev b{ font-weight:700; color:var(--tinta); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.sem-ev small{ color:var(--tinta-2); font-family:var(--cifra); font-size:10px }
.sem-ev.hecho{ opacity:.5 } .sem-ev.hecho b{ text-decoration:line-through }
.sem-ahora{ position:absolute; left:0; right:0; height:2px; background:var(--debe); z-index:3 }
.sem-ahora::before{ content:""; position:absolute; left:-4px; top:-4px; width:10px; height:10px; border-radius:50%; background:var(--debe) }
.sem-ev.corto{ justify-content:center; padding:0 6px } .sem-ev.corto b{ font-size:10.5px } .sem-ev.corto b small{ font-weight:700; margin-right:3px }
:root{ --letra:'Jakarta', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --barra:66px }
body{ font-family:var(--letra); font-feature-settings:"ss01" 1, "cv11" 1; letter-spacing:-.005em }
::selection{ background:color-mix(in srgb, var(--verde) 35%, transparent) }
*{ scrollbar-width:thin; scrollbar-color:var(--regla) transparent }
h1, h2, h3, .heroe h2, .tarjeta-cab h2{ font-family:var(--letra); text-wrap:balance }
.heroe h2{ font-weight:800; letter-spacing:-.035em }
.cifra, .monto, .hora, .kpi b{ font-variant-numeric:tabular-nums }
.cabecera{ height:62px }
.cabecera h1{ font-size:20px; font-weight:800; letter-spacing:-.03em }
.cabecera .btn-icono{ border-radius:12px }
.lateral{ padding:18px 12px 14px; background:linear-gradient(180deg, var(--hoja), color-mix(in srgb, var(--hoja) 85%, var(--papel))) }
.marca{ padding:4px 8px 16px }
.marca b{ font-size:18px; font-weight:800; letter-spacing:-.03em }
.nav-lat button{ font-weight:650; border-radius:12px; padding:8px 10px }
.nav-lat .grupo{ padding:16px 12px 6px; font-size:10px; letter-spacing:.14em }
.lateral .pie{ margin-top:auto; padding-top:14px; border-top:1px solid var(--regla-2) }
.perfil{ width:100%; display:flex; align-items:center; gap:10px; padding:8px; border-radius:14px; text-align:left; transition:background .15s }
.perfil:hover, .perfil[aria-current="page"]{ background:var(--hoja-2) }
.avatar{ width:36px; height:36px; border-radius:12px; flex:none; display:grid; place-items:center; font-weight:800; font-size:15px; color:#fff;
background:linear-gradient(135deg, var(--verde-sube), var(--verde)); box-shadow:0 4px 12px color-mix(in srgb, var(--verde) 35%, transparent) }
.perfil-txt{ flex:1; min-width:0 }
.perfil-txt b{ display:block; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.perfil-txt small{ font-size:11.5px; color:var(--tinta-3) }
.perfil svg{ color:var(--tinta-3) }
@media (max-width:899px){
.barra-inf{
left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); height:var(--barra); padding-bottom:0;
border-radius:24px; border:1px solid color-mix(in srgb, var(--tinta) 10%, transparent);
background:color-mix(in srgb, var(--hoja) 82%, transparent); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
box-shadow:0 12px 34px rgba(0,0,0,.35);
}
.fab{ bottom:calc(var(--barra) + 24px + env(safe-area-inset-bottom)) }
.avisos{ bottom:calc(var(--barra) + 26px + env(safe-area-inset-bottom)) }
.contenido{ padding-bottom:130px }
body.en-cuentas .marco-cuentas{ height:calc(100vh - var(--barra) - 20px - env(safe-area-inset-bottom)); height:calc(100dvh - var(--barra) - 20px - env(safe-area-inset-bottom)) }
}
.barra-inf button{ font-size:10.5px; font-weight:700 }
.tarjeta{ border-radius:22px }
.tarjeta-cab{ padding:16px 16px 10px }
.tarjeta-cab h2, .tarjeta-cab h3{ font-size:15.5px; font-weight:800; letter-spacing:-.02em }
.azulejo{ width:32px; height:32px; border-radius:11px }
.fila{ padding:12px 16px }
.fila .titulo{ font-weight:650 }
.btn{ font-weight:700; border-radius:12px }
.ficha{ font-weight:700 }
.captura{ border-radius:18px; padding:6px 6px 6px 16px }
.captura input{ font-size:15.5px }
.hoja-flot{ border-radius:26px 26px 0 0 }
@media (min-width:640px){ .hoja-flot{ border-radius:26px } }
.hoja-flot .cab h3{ font-size:19px; font-weight:800; letter-spacing:-.03em }
.regresivas{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; padding:4px 16px 16px }
.regresiva{ position:relative; overflow:hidden; text-align:left; padding:14px; border-radius:18px; display:flex; flex-direction:column; gap:2px;
background:linear-gradient(150deg, color-mix(in srgb, var(--c) 28%, var(--hoja-2)), var(--hoja-2)); border:1px solid color-mix(in srgb, var(--c) 40%, var(--regla)) }
.regresiva b{ font-size:34px; font-weight:800; letter-spacing:-.05em; line-height:1; color:var(--tinta) }
.regresiva small{ font-size:12px; font-weight:700; color:var(--c); margin-bottom:6px }
.regresiva span{ font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.regresiva em{ font-style:normal; font-size:11.5px; color:var(--tinta-3) }
.horario{ display:grid; gap:6px; padding:4px 12px 14px; overflow-x:auto }
.hor-col{ display:flex; flex-direction:column; gap:6px; min-width:84px }
.hor-col > b{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-3); text-align:center; padding:4px 0; border-radius:8px }
.hor-col.hoy > b{ background:var(--esp-estudios); color:#0B1020 }
.hor-clase{ text-align:left; padding:8px; border-radius:12px; display:flex; flex-direction:column; gap:1px; border-left:3px solid var(--t); background:color-mix(in srgb, var(--t) 16%, var(--hoja-2)) }
.hor-clase small{ font-size:10.5px; font-weight:700; color:var(--tinta-2); font-variant-numeric:tabular-nums }
.hor-clase span{ font-size:12.5px; font-weight:750; line-height:1.25 }
.hor-clase em{ font-style:normal; font-size:10.5px; color:var(--tinta-3) }
.hoy-toca{ padding:0 16px 8px; display:flex; flex-direction:column; gap:6px }
.hoy-toca-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:color-mix(in srgb, var(--esp-deporte) 14%, var(--hoja-2)); border:1px solid color-mix(in srgb, var(--esp-deporte) 40%, var(--regla)); font-size:13px }
.hoy-toca-item span{ flex:1; min-width:0 }
.records{ padding:6px 16px 16px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px }
.records-tit{ grid-column:1 / -1; font-size:12.5px; color:var(--tinta-2) }
.record{ padding:10px 12px; border-radius:14px; background:var(--hoja-2); border:1px solid var(--regla); display:flex; flex-direction:column; min-width:0 }
.record span{ font-size:12px; color:var(--tinta-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.record b{ font-size:19px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums }
.record small{ font-size:11px; color:var(--haber); font-weight:700 }
.ej-cab, .fila-ej{ display:grid; grid-template-columns:minmax(0,2.2fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.9fr) 34px; gap:6px; align-items:center }
.ej-cab span{ font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-3) }
.fila-ej input{ height:38px; padding:0 8px; border-radius:10px; background:var(--hoja-2); border:1px solid var(--regla); color:var(--tinta); min-width:0; font-variant-numeric:tabular-nums }
.heroe .deco{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0 }
.heroe.esp-heroe .arriba, .heroe.esp-heroe .datos{ position:relative; z-index:1 }
.heroe.esp-heroe[class*="tema-"]::after{ display:none }
body[data-esp="deporte"]{ --verde-piso:color-mix(in srgb, var(--esp-deporte) 16%, transparent) }
.heroe.tema-deporte{
background:
linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.38)),
repeating-linear-gradient(90deg, #15803D 0 44px, #178a43 44px 88px);
box-shadow:0 18px 40px rgba(21,128,61,.35), inset 0 0 0 1px rgba(255,255,255,.12);
}
.heroe.tema-deporte .deco{ opacity:.3 }
.heroe.tema-deporte h2{ font-style:italic; text-transform:uppercase; letter-spacing:.01em; font-weight:900 }
.heroe.tema-deporte .dato{ background:rgba(0,0,0,.28); border-color:rgba(255,255,255,.18) }
.heroe.tema-deporte .dato b{ font-family:var(--cifra); color:#FDE047 }
body[data-esp="deporte"] .tarjeta{ border-top:3px solid var(--esp-deporte) }
body[data-esp="deporte"] .tarjeta-cab h2{ text-transform:uppercase; font-style:italic; font-weight:850; letter-spacing:.02em; font-size:14px }
body[data-esp="deporte"] .azulejo{ border-radius:50%; background:var(--esp-deporte); color:#06281A }
body[data-esp="deporte"] .resumen-dep b{ font-family:var(--cifra); color:var(--esp-deporte) }
.forma{ margin-left:auto; display:flex; gap:4px }
.forma i{
width:24px; height:24px; border-radius:50%; display:grid; place-items:center; flex:none;
font-style:normal; font-size:11px; font-weight:900; color:#fff; background:var(--tinta-3)
}
.forma i.v{ background:#16A34A } .forma i.e{ background:#64748B } .forma i.d{ background:#DC2626 }
.partido-campos{ display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:14px; background:color-mix(in srgb, var(--esp-deporte) 8%, var(--hoja-2)); border:1px dashed color-mix(in srgb, var(--esp-deporte) 45%, transparent) }
.heroe.tema-estudios{
background:
radial-gradient(260px 120px at 20% 30%, rgba(255,255,255,.07), transparent 70%),
radial-gradient(300px 140px at 80% 80%, rgba(255,255,255,.05), transparent 70%),
linear-gradient(160deg, #24453A, #1A332B 60%, #142821);
border:7px solid #8A5A34; border-bottom-width:12px;
box-shadow:0 18px 40px rgba(20,40,33,.4), inset 0 0 40px rgba(0,0,0,.35);
}
.heroe.tema-estudios h2, .heroe.tema-estudios .frase{ font-family:Georgia, "Times New Roman", serif }
.heroe.tema-estudios h2{ font-weight:700; letter-spacing:0; text-shadow:0 0 1px rgba(255,255,255,.6) }
.heroe.tema-estudios .dato{ background:rgba(255,255,255,.08); border:1px dashed rgba(255,255,255,.35); backdrop-filter:none; -webkit-backdrop-filter:none }
.tiza span{
position:absolute; white-space:nowrap; font-family:Georgia, "Times New Roman", serif; font-style:italic;
font-size:clamp(13px, 2.6vw, 19px); color:rgba(255,255,255,.2); transform:rotate(-6deg)
}
.tiza span:nth-child(2n){ transform:rotate(4deg) }
@media (max-width:600px){ .tiza span:nth-child(2), .tiza span:nth-child(3){ display:none } }
body[data-esp="estudios"] .tarjeta{
background-image:linear-gradient(90deg, transparent 26px, color-mix(in srgb, #EF4444 30%, transparent) 26px 27.5px, transparent 27.5px);
background-color:var(--hoja);
}
body[data-esp="estudios"] .tarjeta-cab{ padding-left:36px }
body[data-esp="estudios"] .tarjeta-cab h2{ font-family:Georgia, "Times New Roman", serif; font-weight:700; font-size:16.5px; letter-spacing:0 }
body[data-esp="estudios"] .lista-filas .fila{ padding-left:36px }
body[data-esp="estudios"] .azulejo{ border-radius:6px; transform:rotate(-4deg) }
body[data-esp="estudios"] .curso-ico{ font-family:Georgia, serif; font-size:17px }
.curso-extra{ margin-top:4px }
.necesita, .faltas{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:750; background:var(--hoja-2); border:1px solid var(--regla); color:var(--tinta-2) }
.necesita.ok{ color:var(--haber); border-color:color-mix(in srgb, var(--haber) 40%, transparent); background:color-mix(in srgb, var(--haber) 10%, transparent) }
.necesita.ojo, .faltas.ojo{ color:var(--oro); border-color:color-mix(in srgb, var(--oro) 45%, transparent); background:color-mix(in srgb, var(--oro) 10%, transparent) }
.necesita.mal, .faltas.mal{ color:var(--debe); border-color:color-mix(in srgb, var(--debe) 45%, transparent); background:color-mix(in srgb, var(--debe) 10%, transparent) }
.falta-btn{ font-family:var(--cifra); font-size:12px !important; font-weight:800; color:var(--tinta-3) }
.falta-btn:hover{ color:var(--debe) }
.heroe.tema-oficina{
background:
linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px) 0 0/22px 22px,
linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px) 0 0/22px 22px,
linear-gradient(135deg, #1E3A5F, #0F1F38 60%, #0A1528);
border-bottom:4px solid #F2B34B; border-radius:16px;
box-shadow:0 18px 40px rgba(10,21,40,.4);
}
.heroe.tema-oficina .deco{ opacity:.13 }
.heroe .deco.deco-der{ left:auto; right:14px; top:auto; bottom:0; width:auto; height:88%; aspect-ratio:170/184 }
.heroe.tema-oficina .fecha{ color:#F2B34B; opacity:1 }
.heroe.tema-oficina h2{ font-weight:750; letter-spacing:-.02em }
.heroe.tema-oficina .dato{ border-radius:8px; background:rgba(255,255,255,.07); border-color:rgba(242,179,75,.3) }
.heroe.tema-oficina .dato b{ font-family:var(--cifra); color:#F2B34B }
body[data-esp="oficina"] .tarjeta{ border-radius:12px; box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 22px rgba(0,0,0,.14) }
body[data-esp="oficina"] .tarjeta-cab{ border-bottom:1px solid var(--regla); padding-bottom:11px; margin-bottom:4px }
body[data-esp="oficina"] .tarjeta-cab h2{ font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.09em; color:var(--tinta-2) }
body[data-esp="oficina"] .azulejo{ border-radius:7px; width:28px; height:28px }
body[data-esp="oficina"] .tarjeta-cab .mas{ border-radius:7px }
body[data-esp="oficina"] .cambia-esp, body[data-esp="oficina"] .captura{ border-radius:12px }
@keyframes parpadeo{ 50%{ opacity:.2 } }
.heroe.tema-personal{
background:linear-gradient(125deg, #F59E7A 0%, #E57AA6 45%, #9F7AEA 100%);
border-radius:28px; box-shadow:0 18px 44px rgba(229,122,166,.32);
}
.heroe.tema-personal .dato{ border-radius:99px; background:rgba(255,255,255,.2) }
.burbujas i{ position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.55), rgba(255,255,255,.08) 70%); animation:flotar 9s ease-in-out infinite }
.burbujas i:nth-child(1){ width:120px; height:120px; right:-20px; top:-30px }
.burbujas i:nth-child(2){ width:60px; height:60px; right:26%; bottom:-14px; animation-delay:-3s }
