<meta name="description" content="Agenda personal: tareas, listas, calendario, recordatorios, hábitos, metas, diario, pagos, notas y cuentas.">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="jakarta.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="barlow-700.woff2" as="font" type="font/woff2" crossorigin>
<title>Agenda</title>
<script>
/* Tema y paleta ANTES de pintar nada (claves propias de la agenda), y el
   manifiesto generado aquí mismo: arranca en ESTA página se llame como se
   llame el archivo, y lleva el logo. Sin él Android no ofrece instalar. */
(function(){
  try{
    var t = localStorage.getItem('agenda_tema');
    var p = localStorage.getItem('agenda_paleta');
    if(t === 'claro') document.documentElement.setAttribute('data-tema','claro');
    if(/^(brasa|jade|acero|grafito)$/.test(p || '')) document.documentElement.setAttribute('data-paleta', p);
  }catch(e){}
  try{
    var aqui = location.pathname || './';
    var carpeta = aqui.replace(/[^\/]*$/, '');
    var base = location.origin && location.origin !== 'null' ? location.origin : '';
    var m = {
      name:'Agenda · Mi organización', short_name:'Agenda',
      description:'Tareas, listas, calendario, recordatorios, hábitos, metas, diario, pagos, notas y cuentas.',
      start_url: base + aqui, id: base + aqui, scope: base + carpeta,
      display:'standalone', orientation:'any', lang:'es',
      background_color:'#121110', theme_color:'#121110',
      categories:['productivity','lifestyle','finance'],
      icons:[{src:base+carpeta+"icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},{src:base+carpeta+"icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"},{src:base+carpeta+"icon-maskable-512.png",sizes:"512x512",type:"image/png",purpose:"maskable"}],
      shortcuts:[
        { name:'Tareas',     url: base + aqui + '#tareas' },
        { name:'Calendario', url: base + aqui + '#calendario' },
        { name:'Gastos personales', url: base + aqui + '#personal' },
        { name:'Oficina',    url: base + aqui + '#oficina' }
      ]
    };
    var txt = JSON.stringify(m), h;
    try{ h = URL.createObjectURL(new Blob([txt], { type:'application/manifest+json' })); }
    catch(_){ h = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(txt); }
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = h;
    document.head.appendChild(l);
  }catch(e){}
  window.ICONO_AGENDA = 'icon-192.png';
  window.FUENTE_AGENDA = new URL("jakarta.woff2", location.href).href;
  window.SERIF_AGENDA = new URL("barlow-700.woff2", location.href).href;
})();
</script>

*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100% }

}
.app{ min-height:100vh; min-height:100dvh }
.lateral{

.fab{

.fab:hover{ transform:translateY(-2px) }
.fab svg{ width:26px; height:26px; stroke-width:2.6 }

:root{ --r-card:20px; --borde-card:color-mix(in srgb, var(--regla) 80%, transparent) }
body{
background:
radial-gradient(1100px 520px at 70% -220px, color-mix(in srgb, var(--verde) 13%, transparent), transparent 70%),
radial-gradient(800px 420px at -10% 0%, color-mix(in srgb, var(--azul) 6%, transparent), transparent 70%),

background-attachment:fixed;
}
.contenido{ padding-top:20px }

.tarjeta{

<div class="app">
  <aside class="lateral" aria-label="Secciones">
    <div class="marca">
      <i class="logo-img" aria-hidden="true"></i>
      <div><b>Agenda</b><small id="marcaNombre">Mi organización</small></div>
    </div>
    <nav class="nav-lat" id="navLat"></nav>
    <div class="pie">
      <button type="button" class="perfil" data-ir="ajustes" title="Ajustes">
        <span class="avatar" id="avatar">A</span>
        <span class="perfil-txt"><b id="perfilNombre">Tu agenda</b><small>Ajustes y respaldo</small></span>
        <svg class="i"><use href="#i-ajustes"/></svg>
      </button>
    </div>
  </aside>

  <div class="principal">
    <header class="cabecera">
      <button type="button" class="btn-icono solo-movil" id="btnMarcaMovil" data-ir="hoy" aria-label="Ir a Hoy" style="width:34px">
        <i class="logo-img" style="width:32px;height:32px" aria-hidden="true"></i>
      </button>
      <div class="pasos" role="group" aria-label="Moverte entre pantallas">
        <button type="button" class="btn-icono" id="btnAtras" data-acc="nav-atras" title="Pantalla anterior (Alt+←)" aria-label="Pantalla anterior" disabled><svg class="i izq"><use href="#i-der"/></svg></button>
        <button type="button" class="btn-icono" id="btnAdelante" data-acc="nav-adelante" title="Pantalla siguiente (Alt+→)" aria-label="Pantalla siguiente" disabled><svg class="i"><use href="#i-der"/></svg></button>
      </div>
      <h1 id="tituloVista">Hoy</h1>
      <div class="acciones">
        <button type="button" class="pastilla oculto" id="pastillaNube" data-estado="off" title="Sincronizar ahora">
          <span class="punto"></span><span id="pastillaTexto">Nube</span>
        </button>
        <button type="button" class="pastilla foco oculto" id="pastillaFoco" data-ir="foco" title="Temporizador de enfoque">
          <svg class="i"><use href="#i-reloj"/></svg><span id="pastillaFocoTexto">25:00</span>
        </button>
        <button type="button" class="btn-icono" id="btnDeshacer" data-acc="deshacer" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled><svg class="i"><use href="#i-deshacer"/></svg></button>
        <button type="button" class="btn-icono" id="btnRehacer" data-acc="rehacer" title="Rehacer (Ctrl+Y)" aria-label="Rehacer" disabled><svg class="i"><use href="#i-rehacer"/></svg></button>
        <button type="button" class="btn-icono solo-escritorio" data-ir="papelera" title="Papelera" aria-label="Papelera"><svg class="i"><use href="#i-basura"/></svg></button>
        <button type="button" class="btn-icono" id="btnBuscar" title="Buscar (/)" aria-label="Buscar"><svg class="i"><use href="#i-buscar"/></svg></button>
        <button type="button" class="btn-icono solo-escritorio" id="btnTema" title="Claro u oscuro" aria-label="Cambiar tema"><svg class="i"><use href="#i-luna"/></svg></button>
        <button type="button" class="btn-icono solo-movil" data-ir="ajustes" aria-label="Ajustes"><svg class="i"><use href="#i-ajustes"/></svg></button>
      </div>
    </header>

    <main class="contenido" id="contenido"></main>
  </div>

  <nav class="barra-inf" id="barraInf" aria-label="Secciones"></nav>
  <button type="button" class="fab" id="fab" aria-label="Añadir" title="Añadir (n)"><svg class="i"><use href="#i-plus"/></svg></button>
  <div class="avisos" id="avisos" aria-live="polite"></div>
  <div id="capaFlotante"></div>
</div>
