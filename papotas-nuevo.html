function panelTarifas(plataforma){
  const linea = lineaTarifas(plataforma);
  const esGeneral = plataforma === 'GENERAL';
  const hoy = tarifaVigente(esGeneral ? '__ninguna__' : plataforma);
  const cuantos = clientes.filter(function(c){
    return esGeneral ? true : platDe(c) === plataforma;
  }).length;
  return '<div class="tarjeta-cuerpo">' +
    '<div class="precios-ahora grande">' +
      '<div class="pr viva"><dt>Hoy vale</dt><dd class="cifra">' + esc(dinero(hoy)) + '</dd>' +
        '<small>por perfil y ciclo</small></div>' +
      '<div class="pr"><dt>Cambios apuntados</dt><dd class="cifra">' + linea.length + '</dd>' +
        '<small>' + (linea.filter(function(x){ return x.cuando==='futuro'; }).length
          ? linea.filter(function(x){ return x.cuando==='futuro'; }).length + ' por venir' : 'ninguno por venir') + '</small></div>' +
      (esGeneral ? '' :
      '<div class="pr"><dt>Gente a este precio</dt><dd class="cifra">' +
        clientes.filter(function(c){ return platDe(c) === plataforma && !esPrecioEspecial(c); }).length +
        '</dd><small>de ' + cuantos + ' ' + plural(cuantos,'cliente','clientes') + '</small></div>') +
    '</div>' +
    '<div class="fila" style="margin-top:var(--e4)">' +
      '<button class="btn mini principal" data-nueva-tarifa="' + esc(plataforma) + '">' + ICONO.mas +
        'Poner un precio nuevo</button>' +
    '</div>' +
    (linea.length
      ? '<div class="linea-precios ancha" style="margin-top:var(--e4)">' + linea.slice().reverse().map(function(x){
          const t = x.t;
          return '<button class="lp ' + x.cuando + ' pulsable" data-editar-tarifa="' + esc(t.id) + '"' +
            ' data-plat-tarifa="' + esc(plataforma) + '">' +
            '<span class="lp-fecha">' + esc(fechaBonita(t.desde)) +
              (t.hasta ? ' → ' + esc(fechaBonita(t.hasta))
               : x.cuando === 'futuro' ? ' → en adelante' : ' → hoy') + '</span>' +
            '<span class="lp-monto cifra">' + esc(dinero(t.precio)) + '</span>' +
            (x.cuando === 'ahora' ? '<span class="lp-marca">rige ahora</span>'
             : x.cuando === 'futuro' ? '<span class="lp-marca futuro">programado</span>' : '') +
            (t.nota ? '<span class="lp-nota">' + esc(t.nota) + '</span>' : '') +
          '</button>';
        }).join('') + '</div>'
      : '<div style="padding:var(--e4) 0">' +
          vacio('Sin precios apuntados',
                'Pon el primero y a partir de ahí queda la historia entera: qué cobrabas, qué cobras y qué vas a cobrar.') +
        '</div>') +
  '</div>';
}

function formGasto(){
  const opc = [['','Sin cuenta']].concat(servicios.map(function(m){ return [m.id, nombreCuenta(m)]; }));
  abrirModal('Registrar un gasto',
    '<div class="rejilla r2">' +
      campo('g-concepto','Concepto',{valor:'', pista:'Compra de cuenta, publicidad…'}) +
      campo('g-monto','Cuánto',{tipo:'number', valor:'', paso:'0.01'}) +
      campo('g-cuenta','¿De qué cuenta?',{tipo:'select', valor:'', opciones:opc}) +
      campo('g-fecha','Cuándo',{tipo:'date', valor:hoyISO()}) +
    '</div>',
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal},
     {texto:'Registrar', clase:'principal', hacer:function(){
       const monto = num('g-monto');
       if(monto <= 0){ avisar('Pon cuánto gastaste', 'mal'); return; }
       const cuentaId = val('g-cuenta');
       const m = cuentaId ? buscarMaster(cuentaId) : null;
       recordarPaso('registrar un gasto');
       inversiones.push({
         id:nuevoId('inv'),
         plataforma: val('g-concepto').trim() || (m ? m.nombre : 'Gasto'),
         cuentaMasterId: cuentaId || null,
         persona: ajustes.nombre || 'PAPOTAS',
         monto: monto, fecha: val('g-fecha') || hoyISO()
       });
       anotar('GASTO', (val('g-concepto').trim()||'Gasto') + ' por ' + dinero(monto));
       guardar(); cerrarModal(); pintar();
       avisar('Gasto de ' + dinero(monto) + ' registrado', 'bien', true);
     }}]);
}

/* ---------- 11. Un solo oyente para todo -------------------------------- */

document.addEventListener('click', function(ev){
  /* closest() sube hasta <html>, y <html> lleva atributos de estilo
     (data-fondo, data-realce). Si alguno de ellos coincidiera con la lista
     de abajo, CUALQUIER clic de la página acabaría aquí dentro creyendo
     que pulsaste ese botón: pasó, y guardar los ajustes dejó de funcionar
     porque la pantalla se repintaba antes de leer lo que habías escrito.
     Los nombres ya no chocan, y además nunca se hace caso a la raíz. */
  const t = ev.target.closest ? ev.target.closest('[data-cola],[data-escribir-a],[data-todos-wa],[data-escribir-cuenta],[data-nueva-en],[data-clientes-de],[data-cobrar-de],[data-quitar-plat],[data-mes],[data-plat],[data-volver],[data-vraiz],[data-vplat],[data-ver-cuenta],[data-poner-en],[data-limpiar-busqueda],[data-desliza],[data-vgente],[data-ordtab],[data-mas-hoy],[data-rescate],[data-renovar-todas],[data-vaj],[data-modo],[data-tono],[data-contraste],[data-modo-elegir],[data-elegir],[data-elegir-todos],[data-lote],[data-adelanto],[data-pausar],[data-mover],[data-hueco],[data-accesos],[data-accesos-m],[data-precio],[data-quitar-precio-cli],[data-nueva-tarifa],[data-editar-tarifa],[data-diag],[data-juntar],[data-csv],[data-deshacer],[data-nueva-rapida],[data-editar-rapida],[data-borrar-rapida],[data-ficha],[data-wa-persona],[data-abrir],[data-cobrar],[data-renovar],[data-correr],[data-cuotas],[data-wa],[data-editar-c],[data-borrar-c],[data-editar-m],[data-borrar-m],[data-renovar-m],[data-verclave],[data-copiar],[data-ver-cliente],[data-fhoy],[data-agrupa],[data-verhoy],[data-fcli],[data-ir-cuentas],[data-ir-clientes],[data-nuevo-cliente],[data-nueva-cuenta],[data-nuevo-gasto],[data-calmes],[data-dia],[data-fhoy-pendientes],[data-fhoy-vencidos],[data-fhoy-hoy],[data-fhoy-semana],[data-fhoy-colgados],[data-fhoy-perdidos],[data-borrar-g]') : null;
  if(!t || t === document.documentElement || t === document.body) return;
  const d = t.dataset;

  /* Si vienes de arrastrar la tira, ese clic no cuenta: soltar encima de una
     plataforma no puede meterte dentro de ella. */
  const tira = t.closest && t.closest('.mando-plat, .segmentos');
  if(tira && tira.dataset.arrastre && Date.now() - Number(tira.dataset.arrastre) < 250){
    delete tira.dataset.arrastre;
    ev.preventDefault();
    return;
  }

  if(d.desliza){
    const carril = t.parentElement && t.parentElement.querySelector('.mando-plat');
    if(carril) carril.scrollBy({left: Number(d.desliza) * Math.max(160, carril.clientWidth * 0.75),
                                behavior: suave()});
    return;
  }

  if(d.verclave){
    const llave = 'clave' + d.verclave;
    if(abiertos.has(llave)) abiertos.delete(llave); else abiertos.add(llave);
    pintar();
    return;
  }
  if(d.copiar){ copiar(d.copiar, d.que || 'Texto'); return; }
  if(d.cobrar){ renovar(d.cobrar, true); return; }
  if(d.renovar){ renovar(d.renovar, false); return; }
  if(d.correr){ correrFecha(d.correr); return; }
  if(d.juntar){ juntarPersonas(d.juntar); return; }
  if(d.agrupa){
    agrupaHoy = !agrupaHoy;
    try{ localStorage.setItem('pap_agrupa_hoy', agrupaHoy ? '1' : '0'); }catch(_){}
    pintar(); return;
  }
  if(d.wa){ abrirWhatsApp(d.wa); return; }
  /* Un solo mensaje con TODO lo que esa persona tiene contigo. */
  if(d.waPersona){
    const c = buscarCliente(d.waPersona);
    if(!c) return;
    const n = normalizarTelefono(c.telefono);
    if(!n.vale){ avisarTelefonoMalo(c, n); return; }
    saltarAWhatsApp(n.tel, textoPersona(c, 'auto'));
    fichasDe(c).forEach(marcarEscrito);
    anotar('WHATSAPP', 'Un solo mensaje a ' + (c.nombre||'') + ' por sus ' +
           fichasDe(c).length + ' servicios');
    guardar(); pintar();
    return;
  }
  if(d.editarC){ formCliente(d.editarC); return; }
  if(d.editarM){ formMaster(d.editarM); return; }
  if(d.renovarM){ renovarMaster(d.renovarM); return; }

  if(d.borrarC){
    const c = buscarCliente(d.borrarC); if(!c) return;
    confirmar('Borrar cliente', '¿Seguro que quieres borrar a ' + (c.nombre||'este cliente') + '? Sus cobros ya registrados se quedan en el historial.',
      'Sí, borrar', function(){
        recordarPaso('borrar a ' + (c.nombre||'un cliente'));
        clientes = clientes.filter(function(x){ return String(x.id) !== String(c.id); });
        abiertos.delete('c'+c.id);
        anotar('BORRAR', 'Cliente borrado: ' + (c.nombre||''));
        /* Si estabas en su pantalla, se sube a la de su cuenta. */
        if(String(rutaCliente) === String(c.id)) rutaCliente = null;
        guardar(); pintar(); avisar('Cliente borrado', 'bien', true);
      }, true);
    return;
  }
  if(d.borrarM){
    const m = buscarMaster(d.borrarM); if(!m) return;
    const cuantos = clientesDe(m.id).length;
    confirmar('Borrar cuenta master',
      '¿Borrar ' + nombreCuenta(m) + '?' + (cuantos ? ' Tiene ' + cuantos + ' ' + plural(cuantos,'cliente','clientes') + ' asignados, que se quedarán sin cuenta.' : ''),
      'Sí, borrar', function(){
        recordarPaso('borrar ' + nombreCuenta(m));
        /* Antes de que la cuenta desaparezca, sus cobros y sus gastos se
           quedan con el nombre escrito. Si no, esa plata seguía en la caja
           pero ya no había manera de saber de dónde había salido. */
        const comoSeLlamaba = nombreCuenta(m);
        ventas.forEach(function(v){
          if(String(v.cuentaMasterId) === String(m.id) && !v.cuentaNombre) v.cuentaNombre = comoSeLlamaba;
        });
        inversiones.forEach(function(g){
          if(String(g.cuentaMasterId) === String(m.id) && !g.cuentaNombre) g.cuentaNombre = comoSeLlamaba;
        });
        clientesDe(m.id).forEach(function(c){ c.cuentaMasterId = null; });
        servicios = servicios.filter(function(x){ return String(x.id) !== String(m.id); });
        abiertos.delete('m'+m.id);
        anotar('BORRAR MASTER', 'Cuenta borrada: ' + nombreCuenta(m));
        if(String(rutaCuenta) === String(m.id)){ rutaCuenta = null; rutaCliente = null; }
        guardar(); pintar(); avisar('Cuenta borrada', 'bien', true);
      }, true);
    return;
  }
  if(d.borrarG){
    recordarPaso('borrar un gasto');
    inversiones = inversiones.filter(function(x){ return String(x.id) !== String(d.borrarG); });
    anotar('BORRAR GASTO', 'Gasto eliminado');
    guardar(); pintar(); avisar('Gasto borrado', 'bien', true);
    return;
  }
  if(d.verCliente){
    busqueda = ''; $('#buscar').value = '';
    abrirCliente(d.verCliente);
    return;
  }
  if(d.cola){ mandoCola(d.cola); return; }
  /* «Mandarles a todos» es la misma ronda, pero encendiendo el modo
     seguido y contando lo que se puede y lo que no ANTES de empezar. */
  const deTodos = !!d.todosWa;
  const aQuien = d.todosWa || d.escribirA;
  if(aQuien){
    /* Las listas que se pueden poner en fila, desde donde se esté. */
    const hoy = hoyISO(), av = Number(ajustes.diasAlerta||5);
    const deben = debe;
    let lista = [];
    if(aQuien === 'hoy-visible'){
      if(filtroHoy === 'perdidos') lista = perdidos(clientes);
      else if(filtroHoy === 'colgados') lista = clientes.filter(muyAtrasado);
      else if(filtroHoy === 'vencidos') lista = clientes.filter(function(c){ const x=diasHasta(c.vencimiento); return x!==null && x<0; });
      else if(filtroHoy === 'hoy') lista = clientes.filter(function(c){ return c.vencimiento === hoy; });
      else if(filtroHoy === 'semana') lista = clientes.filter(function(c){ const x=diasHasta(c.vencimiento); return x!==null && x>0 && x<=av; });
      else lista = clientes.filter(deben).concat(clientes.filter(function(c){ return c.vencimiento === hoy && estadoDe(c)==='activo'; }));
    }else if(aQuien === 'clientes-visible'){
      lista = Array.prototype.slice.call(document.querySelectorAll('#p-negocio .tc[data-cid]'))
        .map(function(el){ return buscarCliente(el.dataset.cid); }).filter(Boolean);
    }else{
      /* Una plataforma concreta: los que deben de ella. */
      const plat = aQuien;
      lista = clientes.filter(function(c){
        const m = masterDe(c);
        return String(c.servicio || (m && m.nombre) || '').trim().toUpperCase() === plat && deben(c);
      });
    }
    /* Sin repetidos y por urgencia. */
    const vistos = {};
    lista = lista.filter(function(c){ if(vistos[c.id]) return false; vistos[c.id]=1; return true; })
                 .sort(function(a,b){ return String(a.vencimiento||'9').localeCompare(String(b.vencimiento||'9')); });
    if(deTodos){ avisarDeMandarATodos(lista); return; }
    abrirCola(lista);
    return;
  }
  if(d.nuevaEn){ formMaster(null, d.nuevaEn); return; }
  /* Escribirle a todos los que deben de una cuenta concreta. */
  if(d.escribirCuenta){
    abrirCola(clientesDe(d.escribirCuenta).filter(debe)
      .sort(function(a,b){ return String(a.vencimiento||'9').localeCompare(String(b.vencimiento||'9')); }));
    return;
  }
  if(d.clientesDe || d.cobrarDe){
    filtroClientes = d.cobrarDe ? 'deben' : 'todos';
    filtroCuenta = 'TODAS';
    ordenClientes = 'vencimiento';
    vistaPlat = 'clientes'; guardarVistas();
    busqueda = ''; $('#buscar').value = '';
    abrirPlataforma(d.clientesDe || d.cobrarDe);
    return;
  }
  /* Entrar a una cuenta, y poner a alguien en un perfil libre. */
  if(d.verCuenta){ busqueda = ''; $('#buscar').value = ''; abrirCuenta(d.verCuenta); return; }
  if(d.ponerEn){
    const m = buscarMaster(d.ponerEn); if(!m) return;
    formCliente(null, {cuentaMasterId:m.id, perfil:d.perfil || primerPerfilLibre(m)});
    return;
  }
  if(d.volver){ volverA(d.volver); return; }
  if(d.deshacer){ deshacerPaso(); return; }
  if(d.rescate){ restaurarCopia(d.rescate); return; }
  if(d.vgente){
    vistaGente = d.vgente; guardarVistas();
    volverElFoco('[data-vgente="' + CSS.escape(d.vgente) + '"]');
    pintar(); return;
  }
  if(d.ordtab){
    if(ordenTabla === d.ordtab) ordenTablaAl = -ordenTablaAl;
    else { ordenTabla = d.ordtab; ordenTablaAl = 1; }
    try{
      localStorage.setItem('pap_orden_tabla', ordenTabla);
      localStorage.setItem('pap_orden_tabla_al', String(ordenTablaAl));
    }catch(_){}
    volverElFoco('[data-ordtab="' + CSS.escape(d.ordtab) + '"]');
    pintar(); return;
  }
  if(d.masHoy){ topeHoy = 500; pintar(); return; }
  if(d.renovarTodas){ renovarTodasVencidas(); return; }
  /* El estilo se ve al momento: se cambia, se pinta y se guarda. No hay
     botón de «aplicar» porque no hace falta: lo estás viendo. */
  if(d.modo){
    ajustes.modoClaro = (d.modo === 'claro');
    aplicarTema(); guardar(); pintar(); return;
  }
  if(d.tono){
    ajustes.tonoOscuro = d.tono;
    if(ajustes.modoClaro){ ajustes.modoClaro = false; }
    aplicarTema(); guardar(); pintar(); return;
  }
  if(d.contraste){
    ajustes.contrasteAlto = (d.contraste === 'alto');
    aplicarTema(); guardar(); pintar(); return;
  }
  if(d.vaj){
    vistaAjustes = d.vaj;
    try{ localStorage.setItem('pap_vista_ajustes', vistaAjustes); }catch(_){}
    /* Esto también se pulsa desde otras pantallas -el aviso de «lo estás
       abriendo suelto» manda a bajar un respaldo-, así que si no estamos en
       Ajustes hay que ir primero. Antes cambiaba la sección de una pantalla
       que no se estaba viendo y parecía que el botón no hacía nada. */
    if(pantalla !== 'ajustes'){ ir('ajustes'); arriba(); return; }
    volverElFoco('[data-vaj="' + CSS.escape(d.vaj) + '"]');
    pintar(); arriba(); return;
  }
  if(d.modoElegir){
    modoElegir = !modoElegir;
    if(!modoElegir) elegidos.clear();
    volverElFoco('[data-modo-elegir]');
    pintar(); return;
  }
  if(d.elegir){
    alternarElegido(d.elegir);
    const puesto = elegidos.has(String(d.elegir));
    /* La tarjeta o la línea de la tabla, la que sea: se marca en el sitio,
       sin repintar la pantalla entera con cien clientes detrás. */
    const donde = t.closest('.tc') || t.closest('tr');
    if(donde){
      donde.classList.toggle('elegido', puesto);
      t.setAttribute('aria-checked', puesto ? 'true' : 'false');
      t.innerHTML = puesto ? ICONO.ok : '';
      const quien = (buscarCliente(d.elegir) || {}).nombre || 'este cliente';
      t.setAttribute('aria-label', (puesto ? 'Quitar de la selección a ' : 'Elegir a ') + quien);
    }
    refrescarLote();
    return;
  }
  if(d.elegirTodos){
    const vista = clientesALaVista();
    const faltan = vista.filter(function(c){ return !elegidos.has(String(c.id)); });
    if(faltan.length) faltan.forEach(function(c){ elegidos.add(String(c.id)); });
    else vista.forEach(function(c){ elegidos.delete(String(c.id)); });
    pintar(); return;
  }
  if(d.lote){
    if(d.lote === 'salir'){ limpiarEleccion(); pintar(); return; }
    if(d.lote === 'cobrar'){ cobrarLote(); return; }
    if(d.lote === 'pausar'){ pausarLote(); return; }
    if(d.lote === 'mover'){ moverLote(); return; }
    if(d.lote === 'escribir'){
      const lista = elegidosVivos().filter(function(c){ return telefonoDe(c); })
        .sort(function(a,b){ return String(a.vencimiento||'9').localeCompare(String(b.vencimiento||'9')); });
      if(!lista.length){ avisar('Ninguno de los elegidos tiene teléfono', 'mal'); return; }
      abrirCola(lista);
      return;
    }
    return;
  }
  if(d.adelanto){ formAdelanto(d.adelanto); return; }
  if(d.pausar){
    const c = buscarCliente(d.pausar); if(!c) return;
    recordarPaso((enPausa(c) ? 'reactivar a ' : 'pausar a ') + (c.nombre||'un cliente'));
    if(enPausa(c)) delete c.pausado; else c.pausado = true;
    anotar(enPausa(c) ? 'PAUSAR' : 'REACTIVAR', c.nombre || '');
    olvidarIndices();
    guardar(); pintar();
    avisar((c.nombre||'Cliente') + (enPausa(c) ? ' queda en pausa: no sale en Hoy' : ' vuelve a estar activo'), 'bien', true);
    return;
  }
  if(d.mover){ formMover(d.mover); return; }
  if(d.hueco){
    if(moviendo){ moviendo.perfil = d.hueco; repintarMover(); }
    return;
  }
  if(d.accesos){
    const c = buscarCliente(d.accesos);
    if(c) copiar(textoAccesos(c), 'Los accesos de ' + (c.nombre||'ese cliente'));
    return;
  }
  if(d.accesosM){
    const m = buscarMaster(d.accesosM);
    if(m) copiar(textoAccesosCuenta(m), 'Los accesos de ' + nombreCuenta(m));
    return;
  }
  if(d.precio){ formPrecio(d.precio); return; }
  if(d.quitarPrecioCli){
    const c = buscarCliente(d.quitarPrecioCli);
    if(!c) return;
    recordarPaso('quitar un cambio de precio');
    c.precios = preciosDe(c).filter(function(p){ return p.desde !== d.desde; });
    madurarUno(c);
    olvidarIndices();
    guardar(); pintar();
    if(cerrarModalActual){ cerrarModal(); formPrecio(c.id); }
    avisar('Cambio de precio quitado', 'bien', true);
    return;
  }
  if(d.nuevaTarifa){ formTarifa(d.nuevaTarifa, null); return; }
  if(d.editarTarifa){ formTarifa(d.platTarifa || 'GENERAL', d.editarTarifa); return; }
  if(d.diag){ verDiagnostico(d.diag); return; }
  if(d.cuotas){
    const par = String(d.cuotas).split('|');
    cerrarModal();
    renovar(par[0], true, par[1]);
    return;
  }
  if(d.csv){ exportarCSV(d.csv); return; }
  if(d.limpiarBusqueda){
    busqueda = ''; $('#buscar').value = ''; pintar(); return;
  }
  if(d.quitarPlat){ volverA('raiz'); return; }
  if(d.mes){ mesDinero = d.mes; pintar(); return; }
  if(d.ficha){ abrirCliente(d.ficha); return; }
  if(d.nuevaRapida){ formRapida(null); return; }
  if(d.editarRapida){ formRapida(d.editarRapida); return; }
  if(d.borrarRapida){
    const g = mensajesRapidos.find(function(x){ return String(x.id) === String(d.borrarRapida); });
    if(!g) return;
    confirmar('Borrar la respuesta', '«' + (g.titulo||'Sin título') + '» se borrará de este dispositivo y de la nube.',
      'Borrar', function(){
        mensajesRapidos = mensajesRapidos.filter(function(x){ return String(x.id) !== String(g.id); });
        anotar('BORRAR RESPUESTA', g.titulo || 'Sin título');
        guardar(); cerrarModal(); pintar();
        avisar('Respuesta borrada', 'bien');
      }, true);
    return;
  }
  if(d.vraiz){ vistaRaiz = d.vraiz; guardarVistas(); volverElFoco('[data-vraiz="' + CSS.escape(d.vraiz) + '"]'); pintar(); arriba(); return; }
  if(d.vplat){ vistaPlat = d.vplat; guardarVistas(); volverElFoco('[data-vplat="' + CSS.escape(d.vplat) + '"]'); pintar(); arriba(); return; }
  if(d.plat){
    busqueda = ''; $('#buscar').value = '';
    /* En Hoy y en Dinero la pastilla solo cambia de qué plataforma hablan;
       sacarte de la pantalla que estabas mirando sería una emboscada. En el
       negocio sí se entra: ahí la plataforma es un sitio al que ir. */
    if(pantalla === 'negocio'){ abrirPlataforma(d.plat); return; }
    ponerPlataforma(d.plat === 'TODAS' ? 'TODAS' : d.plat);
    rutaCuenta = null; rutaCliente = null;
    pintar(); arriba();
    return;
  }
  if(d.verhoy){
    verHoy = d.verhoy;
    volverElFoco('[data-verhoy="' + CSS.escape(d.verhoy) + '"]');
    try{ localStorage.setItem('pap_ver_hoy', verHoy); }catch(_){}
    pintar(); return;
  }
  if(d.fhoy){ filtroHoy = d.fhoy; topeHoy = 20; volverElFoco('[data-fhoy="' + CSS.escape(d.fhoy) + '"]'); pintar(); return; }
  /* Los azulejos llevan a su grupo de la cola de abajo. */
  if(d.fhoyPendientes || d.fhoyVencidos || d.fhoyHoy || d.fhoySemana || d.fhoyColgados || d.fhoyPerdidos){
    filtroHoy = d.fhoyPendientes ? 'pendientes' : d.fhoyVencidos ? 'vencidos'
              : d.fhoyHoy ? 'hoy' : d.fhoyColgados ? 'colgados'
              : d.fhoyPerdidos ? 'perdidos' : 'semana';
    pintar();
    const t = $('#p-hoy .tabla'); if(t) t.scrollIntoView({block:'center', behavior:suave()});
    return;
  }
  if(d.fcli){ filtroClientes = d.fcli; volverElFoco('[data-fcli="' + CSS.escape(d.fcli) + '"]'); pintar(); return; }
  if(d.irCuentas){ volverA('raiz'); return; }
  if(d.irClientes){
    vistaRaiz = 'clientes'; vistaGente = 'tabla';
    filtroClientes = 'deben'; filtroCuenta = 'TODAS';
    guardarVistas(); volverA('raiz'); return;
  }
  if(d.nuevoCliente){ formCliente(null); return; }
  if(d.nuevaCuenta){ formMaster(null); return; }
  if(d.nuevoGasto){ formGasto(); return; }
  if(d.calmes){ mesCalendario = d.calmes; pintar(); return; }
  if(d.dia){
    /* Un día del calendario: se buscan los que vencen ese día. */
    const gente = clientes.filter(enPlataformaActiva)
      .filter(function(c){ return String(c.vencimiento||'') === d.dia; });
    if(!gente.length){ avisar('Nadie cobra el ' + fechaBonita(d.dia)); return; }
    verDia(d.dia, gente);
    return;
  }
});

/* ---------- 13. Que se pueda usar de verdad -----------------------------
   No es un adorno: con el teclado, con lector de pantalla o con el móvil en
   «reducir movimiento», el programa tiene que seguir siendo el mismo. */

/* Lo que se le dice en voz alta a quien no ve la pantalla. Se vacía antes
   de escribir para que el lector lo lea aunque el texto se repita. */
function anunciar(texto){
  const caja = document.getElementById('anuncio');
  if(!caja || !texto) return;
  caja.textContent = '';
  setTimeout(function(){ caja.textContent = texto; }, 40);
}

/* Si el sistema pide menos movimiento, no se desplaza con animación. */
function suave(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; }
  catch(_){ return 'smooth'; }
}

/* El nombre de la pestaña del navegador dice dónde estás: con tres PAPOTAS
   abiertos, «PAPOTAS» a secas no distingue ninguno. */
function ponerTituloVentana(){
  const t = ($('#titulo') || {}).textContent || '';
  const n = (ajustes && ajustes.nombre) || 'PAPOTAS';
  try{ document.title = t && t !== n ? t + ' · ' + n : n; }catch(_){}
}

/* Las tiras de pestañas son pestañas de verdad: el lector las anuncia como
   tales y se cambian con las flechas, sin tabular una por una. */
function ponerRolesPestanas(){
  $$('.segmentos').forEach(function(tira){
    tira.setAttribute('role','tablist');
    const botones = Array.prototype.filter.call(tira.children, function(e){ return e.tagName === 'BUTTON'; });
    botones.forEach(function(b){
      b.setAttribute('role','tab');
      if(!b.hasAttribute('aria-selected')) b.setAttribute('aria-selected','false');
      b.setAttribute('tabindex', b.getAttribute('aria-selected') === 'true' ? '0' : '-1');
    });
  });
}

/* Flechas dentro de una tira de pestañas. Va antes que los atajos generales
   para que la flecha derecha cambie de pestaña y no de plataforma. */
document.addEventListener('keydown', function(ev){
  const tab = ev.target && ev.target.closest && ev.target.closest('[role="tab"]');
  if(!tab) return;
  const tira = tab.closest('.segmentos');
  if(!tira) return;
  const botones = Array.prototype.filter.call(tira.children, function(e){ return e.tagName === 'BUTTON'; });
  const i = botones.indexOf(tab);
  let j = -1;
  if(ev.key === 'ArrowRight' || ev.key === 'ArrowDown') j = (i + 1) % botones.length;
  else if(ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') j = (i - 1 + botones.length) % botones.length;
  else if(ev.key === 'Home') j = 0;
  else if(ev.key === 'End') j = botones.length - 1;
  if(j < 0) return;
  ev.preventDefault();
  ev.stopPropagation();
  botones[j].focus();
  botones[j].click();
}, true);

/* ---------- La ventana no se te escapa ----------------------------------
   Al abrirla, el foco entra dentro. Mientras está abierta, el tabulador da
   vueltas ahí y no se va a pasear por la pantalla de detrás. Al cerrarla, el
   foco vuelve al botón que la abrió, que es donde estabas mirando. */
let focoAntesDeModal = null;

function focoDentroDeModal(){
  const modal = $('#modal');
  if(!modal) return [];
  return Array.prototype.filter.call(
    modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
    function(e){ return e.offsetParent !== null || e === document.activeElement; });
}
document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Tab' || !cerrarModalActual) return;
  const f = focoDentroDeModal();
  if(!f.length) return;
  const primero = f[0], ultimo = f[f.length - 1];
  if(ev.shiftKey && document.activeElement === primero){ ev.preventDefault(); ultimo.focus(); }
  else if(!ev.shiftKey && document.activeElement === ultimo){ ev.preventDefault(); primero.focus(); }
}, true);

/* ---------- La chuleta de atajos, con «?» -------------------------------- */
const ATAJOS = [
  ['1 … 9', 'ir a esa plataforma'],
  ['0', 'ver todas las plataformas'],
  ['←  →', 'plataforma anterior o siguiente'],
  ['Esc', 'subir un escalón: del cliente a su cuenta, de la cuenta a su plataforma'],
  ['/', 'ir al buscador'],
  ['H', 'Hoy'],
  ['P', 'Plataformas'],
  ['D', 'Dinero'],
  ['A', 'Ajustes'],
  ['E', 'elegir varios clientes de una vez'],
  ['Enter', 'en la ronda: mandar el WhatsApp'],
  ['C', 'en la ronda: ya me pagó, cobrar'],
  ['→', 'en la ronda: pasar al siguiente'],
  ['Ctrl+Z', 'deshacer lo último que hiciste (hasta 20 pasos)'],
  ['?', 'esta misma lista']
];
function verAtajos(){
  abrirModal('Atajos de teclado',
    '<p style="margin:0 0 var(--e4);color:var(--txt-3);font-size:12.5px;line-height:1.6">' +
      'Para cuando trabajas en la laptop. Ninguno se dispara mientras escribes en un campo.</p>' +
    '<div class="atajos">' + ATAJOS.map(function(a){
      return '<div class="atajo">' +
        a[0].split(/\s+/).map(function(k){ return '<kbd>' + esc(k) + '</kbd>'; }).join(' ') +
        '<span>' + esc(a[1]) + '</span></div>';
    }).join('') + '</div>',
    [{texto:'Entendido', clase:'principal', hacer:cerrarModal}]);
}

/* ---------- Atajos de teclado -------------------------------------------
   Para cuando se trabaja en la laptop: cambiar de plataforma y de pantalla
   sin soltar el teclado. Nunca se disparan mientras se escribe en un campo
   ni con una ventana abierta. */
document.addEventListener('keydown', function(ev){
  /* Ctrl+Z es lo que le sale a cualquiera cuando se equivoca. */
  if((ev.ctrlKey || ev.metaKey) && !ev.altKey && String(ev.key).toLowerCase() === 'z'){
    const dentroCampo = ev.target && ev.target.closest &&
      ev.target.closest('input,textarea,[contenteditable="true"]');
    if(!dentroCampo && hayQueDeshacer()){ ev.preventDefault(); deshacerPaso(); }
    return;
  }
  if(ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const dentro = ev.target && ev.target.closest &&
                 ev.target.closest('input,textarea,select,[contenteditable="true"]');
  /* Va antes que la barra suelta: según el teclado, «?» llega como Shift+/. */
  if(!dentro && (ev.key === '?' || (ev.key === '/' && ev.shiftKey))){
    ev.preventDefault(); verAtajos(); return;
  }
  if(ev.key === '/' && !dentro){
    ev.preventDefault();
    const bu = $('#buscar'); if(bu){ bu.focus(); bu.select(); }
    return;
  }
  if(dentro){
    /* Escape dentro del buscador lo vacía y suelta el foco. */
    if(ev.key === 'Escape' && ev.target.id === 'buscar'){
      ev.target.value = ''; ev.target.blur();
      ev.target.dispatchEvent(new Event('input', {bubbles:true}));
    }
    return;
  }
  if(cerrarModalActual) return;
  /* Con la ronda abierta, el teclado es de la ronda: es donde estás
     trabajando y no tiene sentido que la flecha cambie de plataforma. */
  if(cola.length && colaPos < cola.length){
    if(ev.key === 'Enter'){ ev.preventDefault(); mandoCola('enviar'); return; }
    if(String(ev.key).toLowerCase() === 'c'){ ev.preventDefault(); mandoCola('cobrar'); return; }
    if(ev.key === 'ArrowRight' || String(ev.key).toLowerCase() === 's'){ ev.preventDefault(); mandoCola('saltar'); return; }
    if(ev.key === 'Escape'){ ev.preventDefault(); cerrarCola(); return; }
  }
  const platos = resumenPlataformas();
  /* Escape sube un escalon: del cliente a su cuenta, de la cuenta a su
     plataforma, y de la plataforma a todas. */
  if(ev.key === 'Escape'){ subirUno(); return; }
  if(ev.key >= '1' && ev.key <= '9'){
    const x = platos[Number(ev.key) - 1];
    if(x){ ponerPlataforma(x.n); pintar(); avisar('Trabajando con ' + x.n); }
    return;
  }
  if(ev.key === '0'){ ponerPlataforma('TODAS'); pintar(); return; }
  /* Flechas para pasar de una plataforma a la de al lado. */
  if(ev.key === 'ArrowLeft' || ev.key === 'ArrowRight'){
    if(!platos.length) return;
    const nombres = ['TODAS'].concat(platos.map(function(x){ return x.n; }));
    let i = nombres.indexOf(plataformaActiva);
    if(i < 0) i = 0;
    i = (i + (ev.key === 'ArrowRight' ? 1 : -1) + nombres.length) % nombres.length;
    ponerPlataforma(nombres[i]); pintar();
    return;
  }
  if(String(ev.key).toLowerCase() === 'e'){
    modoElegir = !modoElegir;
    if(!modoElegir) elegidos.clear();
    if(pantalla !== 'negocio'){ puerta('clientes'); } else pintar();
    avisar(modoElegir ? 'Elige a los que quieras y actúa sobre todos' : 'Fuera del modo elegir');
    return;
  }
  const saltos = {h:'hoy', c:'negocio', u:'negocio', p:'negocio', d:'dinero', a:'ajustes'};
  const destino = saltos[String(ev.key).toLowerCase()];
  if(destino){ ir(destino); }
});

/* Cargar un respaldo desde el disco. */
$('#archivo-respaldo').addEventListener('change', function(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const lector = new FileReader();
  lector.onload = function(e){
    const r = leerRespaldo(String(e.target.result || ''));
    ev.target.value = '';
    if(!r.ok){ avisar(r.motivo, 'mal'); return; }
    /* Este es el momento más peligroso del programa: cargar un respaldo
       reemplaza TODO. Antes decía solo lo que traía el archivo, y con eso
       no se puede decidir: si lo que traes es una copia de hace tres
       meses, el número suelto parece razonable. Ahora se enseñan las dos
       columnas -lo que tienes y lo que va a quedar- y, si el archivo trae
       menos, se dice en voz alta cuánto se pierde. */
    const ahora = {clientes:clientes.length, servicios:servicios.length,
                   ventas:ventas.length, inversiones:inversiones.length};
    const pierde = Math.max(0, ahora.clientes - r.resumen.clientes);
    const pierdeCobros = Math.max(0, ahora.ventas - r.resumen.ventas);
    const filas = [
      ['Clientes', ahora.clientes, r.resumen.clientes],
      ['Cuentas master', ahora.servicios, r.resumen.servicios],
      ['Cobros', ahora.ventas, r.resumen.ventas],
      ['Gastos', ahora.inversiones, r.resumen.inversiones]
    ];
    confirmarRico('Cargar respaldo',
      '<table class="comparar"><thead><tr><th></th>' +
        '<th>Ahora tienes</th><th>Quedaría</th></tr></thead><tbody>' +
      filas.map(function(f){
        const menos = f[2] < f[1];
        return '<tr' + (menos ? ' class="menos"' : '') + '><td>' + f[0] + '</td>' +
          '<td class="cifra">' + f[1] + '</td>' +
          '<td class="cifra">' + f[2] + (menos ? ' <b>−' + (f[1]-f[2]) + '</b>' : '') + '</td></tr>';
      }).join('') +
      '</tbody></table>' +
      ((pierde || pierdeCobros)
        ? '<p class="confirma-ojo">' + ICONO.alerta + '<span><b>Ojo:</b> este archivo trae ' +
          'menos de lo que tienes ahora. Si es una copia vieja, ' +
          (pierde ? 'se van <b>' + pierde + ' ' + plural(pierde,'cliente','clientes') + '</b>' : '') +
          (pierde && pierdeCobros ? ' y ' : '') +
          (pierdeCobros ? '<b>' + pierdeCobros + ' ' + plural(pierdeCobros,'cobro','cobros') + '</b>' : '') +
          '. Se guarda una copia de lo actual por si acaso, en Ajustes → Recuperar.</span></p>'
        : '<p class="confirma-ojo suave">' + ICONO.ok + '<span>Se guarda una copia de lo actual ' +
          'por si acaso, en Ajustes → Recuperar.</span></p>'),
      'Sí, cargar', function(){
        aplicarRespaldo(r.rec);
        aplicarTema(); pintar();
        avisar('Respaldo cargado: ' + clientes.length + ' clientes', 'bien');
      });
  };
  lector.onerror = function(){ avisar('No se pudo leer el archivo', 'mal'); };
  lector.readAsText(f);
});

/* Si el otro programa (u otra pestaña) cambia los datos, aquí se enteran. */
window.addEventListener('storage', function(ev){
  if(!ev.key || ev.key.indexOf('pap_') !== 0) return;
  cargar(); aplicarTema(); pintar();
});

/* ---------- 12. Arranque ------------------------------------------------- */

cargar();
aplicarTema();
/* Si el navegador no pudo leer algo, no se arranca como si nada: tus datos
   siguen ahí y el programa no los va a pisar, pero hay que enterarse. */
if(clavesDanadas.length){
  setTimeout(function(){
    abrirModal('No pude leer tus datos',
      '<div class="pila">' +
        '<p style="margin:0;font-size:14px;line-height:1.6">Este navegador no ha podido leer ' +
          '<b>' + esc(clavesDanadas.join(', ')) + '</b>. Suele pasar cuando se queda sin sitio ' +
          'o se cierra de golpe a mitad de guardar.</p>' +
        '<p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--txt-2)">' +
          '<b>Lo que había sigue ahí</b> y el programa no lo va a sobrescribir. ' +
          'Entra en Ajustes → Tus datos → Recuperar y vuelve a la última copia.</p>' +
      '</div>',
      [{texto:'Ir a Recuperar', clase:'principal', hacer:function(){
         cerrarModal(); vistaAjustes = 'datos'; ir('ajustes');
       }},
       {texto:'Ahora no', clase:'fantasma', hacer:cerrarModal}]);
  }, 700);
}

if(leerRuta()) ir('negocio');
else {
  const destinoInicial = String(location.hash || '').replace('#','');
  ir(PANTALLAS[destinoInicial] ? destinoInicial : 'hoy');
}

window.PAPOTAS = {
  version:VERSION,
  pintar: pintar,
  ir: ir,
  datos: function(){ return {servicios, clientes, ventas, inversiones, ajustes}; },
  /* Lo que te deben, también desde la consola: cuántas cuotas lleva sin
     pagar alguien, cuánto suma y cuánto le cobrarías ahora. */
  deuda: {
    cuotas:  function(c){ return cuotasPendientes(c); },
    monto:   function(c){ return deudaDe(c); },
    aCobrar: function(c){ return aCobrarDe(c); }
  },
  /* Todo lo que una misma persona tiene contigo, y el mensaje único que
     se le manda por todo junto. Desde fuera para poder comprobarlo. */
  persona: function(id){
    const c = buscarCliente(id);
    if(!c) return null;
    const todas = fichasDe(c);
    return {nombre: c.nombre, servicios: todas.length,
            alCiclo: todas.reduce(function(a,x){ return a + cobroDe(x); }, 0),
            debe: todas.reduce(function(a,x){ return a + (cuotasPendientes(x) ? aCobrarDe(x) : 0); }, 0),
            fichas: todas.map(function(x){ return {id:x.id, servicio:x.servicio, vence:x.vencimiento}; })};
  },
  mensajePersona: function(id){
    const c = buscarCliente(id);
    return c ? textoPersona(c, 'auto') : null;
  },
  /* Lo que una cuenta deja y lo que cuesta, con la cuenta ya hecha. */
  cuenta: function(id){ const m = buscarMaster(id); return m ? resumenCuenta(m) : null; },
  /* Lo que se te puede caer, lo que no se paga solo y los que ya se fueron.
     Desde fuera para poder comprobarlo. */
  riesgo: {
    porCaer:  function(dias){ return mastersPorCaer(servicios, dias || ajustes.diasAlerta); },
    enRojo:   function(){ olvidarIndices(); return cuentasEnRojo(servicios).map(function(x){
                 return {cuenta:nombreCuenta(x.m), margen:x.r.margen, clientes:x.r.clientes}; }); },
    perdidos: function(){ return perdidos(clientes).map(function(c){
                 return {nombre:c.nombre, cuotas:cuotasPendientes(c), debe:deudaDe(c)}; }); },
    umbral:   function(){ return umbralPerdido(); }
  },
  /* Lo que no cae en ninguna cuenta viva: está en la caja pero no se puede
     repartir. Aquí para poder comprobar que la suma cuadra. */
  sueltos: function(){ olvidarIndices(); const e = economia();
    return {ingresos:e.sueltos.ingresos, gastos:e.sueltos.gastos, cobros:e.sueltos.cobros,
            de:Array.from(e.sueltos.cuentas.entries())}; },
  /* La revisión, para poder comprobarla desde fuera. */
  revision: function(){ olvidarIndices(); return diagnostico(); },
  olvidar: function(){ olvidarIndices(); },
  recargar: function(){ cargar(); aplicarTema(); pintar(); },
  /* Los precios, también desde la consola si alguna vez hace falta. */
  precios: {
    hoy:   function(plataforma, fecha){ return tarifaVigente(plataforma, fecha); },
    linea: function(plataforma){ return lineaTarifas(plataforma); },
    poner: function(plataforma, precio, desde, nota){
      const t = ponerTarifa(plataforma === 'GENERAL' ? 'general' : 'plataforma',
                            plataforma, Number(precio), desde || hoyISO(), nota || '');
      olvidarIndices(); guardar(); pintar(); return t;
    },
    deCliente: function(id, monto, desde){
      const c = buscarCliente(id); if(!c) return null;
      ponerPrecioCliente(c, Number(monto), desde || hoyISO());
      olvidarIndices(); guardar(); pintar(); return c.precios;
    }
  },
  deshacer: deshacerPaso,
  /* Abrir una sección concreta de los ajustes. */
  verAjustes: function(cual){
    vistaAjustes = cual || 'negocio';
    try{ localStorage.setItem('pap_vista_ajustes', vistaAjustes); }catch(_){}
    if(pantalla !== 'ajustes') ir('ajustes'); else pintar();
  },
  revisar: diagnostico,
  /* Las cuatro puertas del negocio, para volver al principio de una. */
  verPlataformas: function(){ puerta('plataformas'); },
  verCuentas:     function(){ puerta('cuentas'); },
  verClientes:    function(){ puerta('clientes'); },
  /* Entrar a una cuenta por su id, para poder llegar a su pantalla sin
     tener que ir pulsando plataforma por plataforma. */
  /* WhatsApp, para poder comprobarlo desde fuera. */
  wa: {
    numero: function(crudo){ return normalizarTelefono(crudo); },
    enlace: function(tel, texto){ return enlaceWhatsApp(tel, texto); },
    tactil: function(){ return esTactil(); }
  },
  escribirA: function(id){ return abrirWhatsApp(id, 'auto'); },
  verCuenta: function(id){
    const m = buscarMaster(id);
    if(!m) return false;
    ponerPlataforma(String(m.nombre||'').trim().toUpperCase() || 'SIN PLATAFORMA');
    rutaCuenta = String(m.id); rutaCliente = null;
    irNegocio(true);
    return true;
  }
};

Nube.arrancar();

/* El programa se guarda en el navegador para abrir sin conexión, pero hasta
   ahora nadie comprobaba nunca si había una versión nueva: se registraba y
   ahí quedaba. Así es como subes una actualización y al abrir sale igual que
   antes. Aquí se pregunta al abrir, al volver a la pestaña, al recuperar la
   conexión y cada quince minutos; y cuando la versión nueva toma el mando,
   la página se recarga sola una vez. La primera instalación no recarga. */
if('serviceWorker' in navigator && (location.protocol === 'https:' ||
   location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  var teniaControlador = !!navigator.serviceWorker.controller;
  var recargandoPorVersion = false;
  var estrenar = function(){
    if(!teniaControlador || recargandoPorVersion) return;  /* nada viejo que reemplazar */
    recargandoPorVersion = true;
    avisar('Hay una versión nueva. Actualizando…');
    setTimeout(function(){ location.reload(); }, 350);
  };
  navigator.serviceWorker.addEventListener('controllerchange', estrenar);
  window.addEventListener('load', function(){
    /* Antes de registrarlo, se mira si el archivo está.

       Por qué: mucha gente sube SOLO este archivo a su dirección, sin el
       sw.js al lado. Registrarlo a ciegas hacía que el navegador pidiera un
       archivo que no existe y dejara un 404 rojo en su registro. No rompía
       nada -el programa funciona igual, solo que sin guardado para trabajar
       sin internet- pero era un error de los que asustan al abrir la
       consola. Preguntar primero con una petición normal no deja rastro:
       un 404 así es una respuesta corriente, no un fallo. */
    var CLAVE_SW = 'pap_sin_sw';
    var marca = document.querySelector('meta[name="pap-sitio"]');
    var esSitioCompleto = !!(marca && marca.content === '1');
    var yaSabemos = false;
    try{ yaSabemos = localStorage.getItem(CLAVE_SW) === location.pathname; }catch(_){}
    (esSitioCompleto
      /* El publicador marca la copia que va con sw.js al lado. Ahí se sabe
         que está y se registra sin preguntar: ni un 404 en el registro. */
      ? navigator.serviceWorker.register('sw.js')
      : yaSabemos
      /* Ya se preguntó una vez y no estaba: no se vuelve a preguntar nunca.
         Así el 404 sale como mucho una vez en la vida, no en cada apertura. */
      ? Promise.resolve(null)
      /* Se pide entero y se lee entero (son cuatro kilobytes). Pedir solo la
         cabecera dejaba la respuesta a medio consumir y el navegador la
         anotaba como cancelada: otro rojo en el registro para nada. */
      : fetch('sw.js').then(function(r){
          return r.text().then(function(){ return r.ok; });
        }).then(function(hay){
          if(hay) return navigator.serviceWorker.register('sw.js');
          try{ localStorage.setItem(CLAVE_SW, location.pathname); }catch(_){}
          return null;
        })
    ).catch(function(){ return null; }).then(function(reg){
      if(!reg) return;
      /* El relevo de trabajador no siempre llega: según el navegador, cuando
         la versión nueva se activa el cliente se queda con la vieja hasta la
         próxima navegación. Se vigila también esta otra señal, que sí es
         fiable: aparece un trabajador nuevo y se le sigue hasta que queda
         activado. */
      reg.addEventListener('updatefound', function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', function(){
          if(nuevo.state === 'activated') estrenar();
        });
      });
      /* Preguntar por una versión nueva tiene su freno: al registrar, el
         navegador ya acaba de descargar el archivo, y volver a pedirlo en
         ese mismo momento -o dos veces seguidas al cambiar de pestaña-
         hacía que cancelara la descarga anterior y dejara un
         «net::ERR_ABORTED» en el registro. Se espera medio minuto entre
         preguntas y no se solapan. */
      var ultima = Date.now(), enCurso = false;
      var preguntar = function(forzar){
        if(enCurso) return;
        if(!forzar && Date.now() - ultima < 30000) return;
        ultima = Date.now(); enCurso = true;
        try{
          var q = reg.update();
          if(q && q.then) q.then(function(){ enCurso = false; }, function(){ enCurso = false; });
          else enCurso = false;
        }catch(_){ enCurso = false; }
      };
      document.addEventListener('visibilitychange', function(){ if(!document.hidden) preguntar(); });
      window.addEventListener('online', preguntar);
      setInterval(preguntar, 15 * 60 * 1000);
      window.papotasBuscarActualizacion = function(){ avisar('Buscando una versión nueva…'); preguntar(true); };
    }).catch(function(){});
  });
}

})();
