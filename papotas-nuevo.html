      '<p style="margin:0;color:var(--txt-3);font-size:12.5px;line-height:1.6">Se reparten por los perfiles que queden libres, en orden. Si no caben todos, se mueven los que quepan y te digo cuántos se quedaron fuera.</p>' +
      campo('lt-cuenta','A qué cuenta',{tipo:'select', valor:'', opciones:[['','Elige una cuenta']].concat(opc)}) +
    '</div>',
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal},
     {texto:'Moverlos', clase:'principal', hacer:function(){
       const m = buscarMaster(val('lt-cuenta'));
       if(!m){ avisar('Elige a qué cuenta', 'mal'); return; }
       recordarPaso('mover ' + lista.length + ' clientes');
       const huecos = perfilesDe(m).filter(function(x){ return x.n && !x.cliente; }).map(function(x){ return 'Perfil ' + x.n; });
       let movidos = 0;
       lista.forEach(function(c){
         if(String(c.cuentaMasterId) === String(m.id)){ movidos++; return; }
         if(!huecos.length) return;
         c.cuentaMasterId = m.id;
         c.servicio = m.nombre;
         c.perfil = huecos.shift();
         movidos++;
       });
       const fuera = lista.length - movidos;
       anotar('MOVER EN LOTE', movidos + ' a ' + nombreCuenta(m));
       olvidarIndices();
       guardar(); cerrarModal(); limpiarEleccion();
       ponerPlataforma(String(m.nombre||'').trim().toUpperCase());
       rutaCuenta = String(m.id); rutaCliente = null;
       irNegocio(true);
       avisar(movidos + ' ' + plural(movidos,'movido','movidos') + ' a ' + nombreCuenta(m) +
         (fuera ? ' · ' + fuera + ' no ' + plural(fuera,'cupo','cupieron') : ''),
         fuera ? 'aviso' : 'bien', true);
     }}]);
}

/* ---------- Cobrar por adelantado --------------------------------------
   Hay clientes que pagan tres meses de golpe. Antes había que cobrarles
   tres veces seguidas, y en el historial quedaban tres cobros de un mes. */
/* ---------- LO QUE SE TE PUEDE CAER -------------------------------------
   El programa avisaba de las cuentas master CUANDO YA ESTABAN VENCIDAS, y
   para entonces tus clientes ya se quedaron sin servicio y te están
   escribiendo. Una master que se cae no es como un cliente que se atrasa:
   se lleva por delante a TODOS los que tiene dentro de una vez.

   Estas tres cuentas miran hacia delante, no hacia atrás. */

/* Las que vencen pronto pero TODAVÍA NO. Es el aviso que sirve. */
function mastersPorCaer(lista, dias){
  const tope = Math.max(1, Number(dias) || 5);
  return (lista || servicios).filter(function(m){
    const d = diasHasta(m.vencimiento);
    return d !== null && d >= 0 && d <= tope;
  }).sort(function(a,b){ return String(a.vencimiento||'').localeCompare(String(b.vencimiento||'')); });
}

/* Cuánta gente se queda sin servicio si esa cuenta se cae. */
function genteEnRiesgo(lista){
  return (lista || []).reduce(function(a,m){ return a + clientesDe(m.id).length; }, 0);
}

/* Las cuentas que NO se pagan solas: te cuestan más de lo que cobras por
   ellas. Con veinte cuentas es fácil tener una arrastrando pérdida sin
   enterarte, porque el total sigue dando positivo. */
function cuentasEnRojo(lista, eco){
  eco = eco || economia();
  return (lista || servicios).map(function(m){
    return {m:m, r:resumenCuenta(m, eco)};
  }).filter(function(x){
    return x.r.margen < 0 || (x.r.clientes === 0 && x.r.costo > 0);
  }).sort(function(a,b){ return a.r.margen - b.r.margen; });
}

/* Los que ya no son clientes, aunque el programa siga contándolos.
   Alguien que lleva muchas cuotas sin pagar no es un moroso: se fue. Y
   mientras siga contando como deuda, el número de «te deben» es mentira. */
function umbralPerdido(){
  const n = parseInt(ajustes.cuotasPerdido, 10);
  return n > 0 ? n : 4;
}
function perdidos(lista){
  const tope = umbralPerdido();
  return (lista || clientes).filter(function(c){
    return !enPausa(c) && cuotasPendientes(c) >= tope;
  }).sort(function(a,b){ return cuotasPendientes(b) - cuotasPendientes(a); });
}

function mesesDeCiclo(c){
  const ciclo = cicloDe(c);
  return ciclo.tipo === 'meses' ? Math.max(1, ciclo.cantidad) : 1;
}

/* ---------- LO QUE DE VERDAD TE DEBEN -----------------------------------
   Aquí había una cuenta que salía mal con dinero de por medio, y hay que
   decirlo tal cual: el programa sumaba UNA cuota por cada cliente vencido,
   estuviera atrasado tres días o tres meses. Alguien que no te paga desde
   junio te debe tres cuotas, no una, y en la pantalla figuraba por quince
   soles cuando en realidad te debía cuarenta y cinco.

   `cuotasPendientes` cuenta cuántos cobros hacen falta para ponerlo al día:
   uno por cada ciclo que se le pasó, más el que está corriendo. Es la misma
   cuenta que hace `cobrarUno` al renovar, que avanza desde el vencimiento y
   no desde hoy, así que las dos van siempre de la mano. */
function cuotasPendientes(c){
  if(!c || enPausa(c)) return 0;
  const hasta = c.vencimiento;
  if(!hasta) return 0;
  const d = diasHasta(hasta);
  if(d === null) return 0;
  if(d > 0) return 0;                 /* todavía no le toca */
  const ciclo = cicloDe(c);
  let f = hasta, n = 0;
  /* Se avanza ciclo a ciclo hasta pasar de hoy. El tope es por si alguien
     tiene una fecha de hace años: ni se cuelga ni inventa cien cuotas. */
  while(diasHasta(f) <= 0 && n < 60){ f = avanzar(f, ciclo); n++; }
  return Math.max(1, n);
}
/* Lo que se le cobra de una vez: el precio por los meses de su ciclo. */
function cuotaDe(c){ return cobroDe(c) * mesesDeCiclo(c); }
/* Lo que te debe ya, sin contar lo que todavía no le toca. */
function deudaDe(c){ return cuotaDe(c) * cuotasPendientes(c); }
/* Lo que le cobrarías ahora para dejarlo al día. Al que aún no le toca se
   le cobra su cuota; al atrasado, todas las que debe. */
function aCobrarDe(c){ return cuotaDe(c) * Math.max(1, cuotasPendientes(c)); }
/* Debe más de una: es el que se te está yendo de las manos. */
function muyAtrasado(c){ return cuotasPendientes(c) > 1; }
function formAdelanto(id){
  const c = buscarCliente(id);
  if(!c){ avisar('Ese cliente ya no está', 'mal'); return; }
  const ciclo = cicloDe(c);
  const unidad = ciclo.tipo === 'dias' ? plural(ciclo.cantidad,'día','días') : plural(ciclo.cantidad,'mes','meses');
  abrirModal('Cobrar adelantado a ' + (c.nombre || 'este cliente'),
    '<div class="pila">' +
      '<p style="margin:0;color:var(--txt-3);font-size:12.5px;line-height:1.6">' +
        'Su ciclo es de <b style="color:var(--txt)">' + ciclo.cantidad + ' ' + esc(unidad) + '</b> y le cobras <b style="color:var(--txt)">' +
        esc(dinero(cobroDe(c))) + '</b> cada uno. Elige cuántos ciclos te paga hoy.</p>' +
      '<div class="rejilla r2">' +
        campo('ad-ciclos','Cuántos ciclos',{tipo:'number', valor:1, paso:'1'}) +
        campo('ad-total','Le cobras en total',{valor:dinero(cobroDe(c)),
          atributos:' readonly aria-readonly="true"', ayuda:'Se recalcula al escribir arriba'}) +
      '</div>' +
      '<p class="pista" id="ad-hasta" style="margin:0"></p>' +
    '</div>',
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal},
     {texto:'Cobrar', clase:'principal', hacer:function(){
       const n = Math.max(1, Math.round(num('ad-ciclos')) || 1);
       recordarPaso('cobrar ' + n + ' ciclos a ' + (c.nombre||'un cliente'));
       const total = cobrarUno(c, true, n);
       anotar('COBRO ADELANTADO', (c.nombre||'') + ': ' + n + ' ciclos por ' + dinero(total));
       guardar(); cerrarModal(); pintar();
       avisar('Cobrados ' + dinero(total) + ' · ' + (c.nombre||'') + ' hasta ' + fechaBonita(c.vencimiento), 'bien', true);
     }}],
    function(){
      const recalcular = function(){
        const n = Math.max(1, Math.round(num('ad-ciclos')) || 1);
        const campoTotal = document.getElementById('ad-total');
        if(campoTotal) campoTotal.value = dinero(cobroDe(c) * mesesDeCiclo(c) * n);
        let hasta = c.vencimiento || hoyISO();
        for(let i = 0; i < n; i++) hasta = avanzar(hasta, ciclo);
        const pie = document.getElementById('ad-hasta');
        if(pie) pie.textContent = 'Le quedaría pagado hasta el ' + fechaBonita(hasta) + '.';
      };
      const campoN = document.getElementById('ad-ciclos');
      if(campoN) campoN.addEventListener('input', recalcular);
      recalcular();
    });
}

/* ---------- Cobrar y renovar ------------------------------------------- */
/* El trabajo en bruto: corre el vencimiento y, si se cobra, apunta la venta
   y la cuota. NO guarda ni pinta, porque a veces se llama cien veces
   seguidas y cien guardados son cien subidas a la nube. Devuelve cuánto se
   cobró. */
function cobrarUno(c, cobrando, ciclos){
  const n = Math.max(1, Math.round(Number(ciclos) || 1));
  const ciclo = cicloDe(c);
  const meses = ciclo.tipo === 'meses' ? Math.max(1, ciclo.cantidad) : 1;
  const monto = cobroDe(c);
  let hasta = c.vencimiento || hoyISO();
  for(let i = 0; i < n; i++) hasta = avanzar(hasta, ciclo);
  c.inicio = c.vencimiento || hoyISO();
  c.vencimiento = hasta;
  if(!cobrando || monto <= 0) return 0;
  const total = monto * meses * n;
  ventas.push({
    id:nuevoId('v'), clienteId:c.id, cliente:c.nombre, servicio:c.servicio,
    cuentaMasterId:c.cuentaMasterId || null, monto:total, meses:meses * n,
    metodo:c.metodo || ajustes.metodoDefecto || 'PLIN', fecha:hoyISO()
  });
  /* La cuota queda apuntada en su ficha con el mismo molde que usa el
     PAPOTAS de siempre, para que la vea en «Historial de cuotas». */
  if(!Array.isArray(c.historialPrecios)) c.historialPrecios = [];
  c.historialPrecios.push({fecha:hoyISO(), monto:monto, meses:meses * n,
                           tipo:esPrecioEspecial(c) ? 'especial' : 'tarifa',
                           plataforma:c.servicio || platDe(c) || ''});
  if(c.historialPrecios.length > 80) c.historialPrecios = c.historialPrecios.slice(-80);
  return total;
}

/* Cuando alguien debe varias, se pregunta cuántas: casi siempre te pagan
   todo lo atrasado, pero a veces te dan una y quedan debiendo el resto, y
   el programa tiene que saber apuntar las dos cosas. */
function preguntarCuotas(c, debia){
  const una  = cuotaDe(c);
  const todo = una * debia;
  const desde = c.vencimiento;
  abrirModal('¿Cuánto te pagó ' + esc(c.nombre || 'este cliente') + '?',
    '<p style="margin:0 0 var(--e4);color:var(--txt-2);font-size:13.5px;line-height:1.6">' +
      'Está vencido desde el ' + esc(fechaBonita(desde)) + ', así que te debe <b>' + debia +
      ' cuotas</b>: ' + esc(dinero(todo)) + ' en total.</p>' +
    '<div class="cuotas-opciones">' +
      '<button class="btn grande principal" data-cuotas="' + esc(c.id) + '|' + debia + '">' +
        ICONO.ok + '<span><b>Me pagó todo</b><small>' + debia + ' cuotas · ' +
        esc(dinero(todo)) + ' · queda al día</small></span></button>' +
      '<button class="btn grande" data-cuotas="' + esc(c.id) + '|1">' +
        ICONO.cobrar + '<span><b>Solo una cuota</b><small>' + esc(dinero(una)) +
        ' · seguirá debiendo ' + (debia-1) + '</small></span></button>' +
    '</div>',
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal}]);
}

/* Cobrar a uno. `cuantas` son las cuotas: una, o todas las que deba para
   quedar al día. Si se le cobra una sola a quien debe tres, sigue vencido,
   y eso está bien -debe dos más- pero hay que preguntárselo antes, no
   dejarlo en rojo sin explicación. */
function renovar(id, cobrando, cuantas){
  const c = buscarCliente(id);
  if(!c){ avisar('No encontré a ese cliente', 'mal'); return; }
  const debia = cuotasPendientes(c);
  if(cobrando && debia > 1 && !cuantas){ preguntarCuotas(c, debia); return; }
  const n = Math.max(1, Math.round(Number(cuantas) || 1));
  recordarPaso(cobrando ? 'cobrar a ' + (c.nombre||'un cliente')
                        : 'renovar a ' + (c.nombre||'un cliente'));
  const cobrado = cobrarUno(c, cobrando, n);
  const nueva = c.vencimiento;
  const monto = cobrado;
  const meses = 1;
  if(cobrado > 0){
    anotar('COBRAR', c.nombre + ' pagó ' + dinero(cobrado) + ', ahora vence ' + fechaBonita(nueva));
  }else{
    anotar('RENOVAR', c.nombre + ' renovado hasta ' + fechaBonita(nueva) + ' sin cobrar');
  }
  guardar();
  /* Si se cobró desde la ficha abierta, la ficha se cierra: el trabajo está
     hecho y dejarla abierta con los datos viejos solo confunde. */
  if(cerrarModalActual) cerrarModal();
  pintar();
  avisar(cobrando
    ? 'Cobrado ' + dinero(monto*meses) + ' · ' + c.nombre + ' hasta ' + fechaBonita(nueva)
    : c.nombre + ' renovado hasta ' + fechaBonita(nueva), 'bien', true);
}

function renovarMaster(id){
  const m = buscarMaster(id);
  if(!m) return;
  recordarPaso('renovar ' + nombreCuenta(m));
  const nueva = avanzar(m.vencimiento || hoyISO(), cicloDe(m));
  m.vencimiento = nueva;
  const costo = Number(m.costo) || 0;
  if(costo > 0){
    inversiones.push({
      id:nuevoId('inv'), plataforma:m.nombre, cuentaMasterId:m.id,
      persona:ajustes.nombre || 'PAPOTAS', monto:costo, fecha:hoyISO()
    });
  }
  anotar('RENOVAR MASTER', nombreCuenta(m) + ' renovada hasta ' + fechaBonita(nueva) +
         (costo>0 ? ' (gasto de ' + dinero(costo) + ')' : ''));
  guardar(); pintar();
  avisar(nombreCuenta(m) + ' vence ahora el ' + fechaBonita(nueva), 'bien', true);
}

/* UN SOLO MENSAJE POR PERSONA
   Si la misma persona te debe Netflix, Disney y Spotify, mandarle tres
   mensajes seguidos el mismo día no es ser ordenado: es ser pesado, y
   encima te contesta a uno solo y pierdes los otros dos. Esto arma un
   mensaje con las tres cosas y el total. La plantilla suya se respeta
   igual: lo que cambia es que la lista va dentro. */
function textoPersona(c, cual, cuales){
  const lista = (cuales && cuales.length ? cuales : fichasDe(c))
    .filter(function(x){ return cuotasPendientes(x) > 0 || String(x.id) === String(c.id); })
    .sort(function(a,b){ return String(a.vencimiento||'9').localeCompare(String(b.vencimiento||'9')); });
  if(lista.length < 2) return textoWhatsApp(c, cual);
  const total = lista.reduce(function(a,x){ return a + aCobrarDe(x); }, 0);
  const detalle = lista.map(function(x){
    const mm = masterDe(x);
    const q = cuotasPendientes(x);
    return '· ' + (x.servicio || (mm && mm.nombre) || 'Servicio') +
           ' — ' + dinero(aCobrarDe(x)) +
           (q > 1 ? ' (' + q + ' cuotas)' : '') +
           ' — vence ' + fechaBonita(x.vencimiento);
  }).join('\n');
  let t = 'Hola ' + (c.nombre || '') + ' 👋 Te paso lo que tienes conmigo:\n\n' +
          detalle + '\n\nEn total son ' + dinero(total) + '. ¡Gracias!';
  if(ajustes.firmaWs) t += '\n\n' + ajustes.firmaWs;
  return t;
}

function textoWhatsApp(c, cual){
  const m = masterDe(c);
  const vencido = c.vencimiento && c.vencimiento < hoyISO();
  let t;
  /* "guardado:<id>" es una de tus respuestas guardadas; el resto son las
     tres plantillas fijas. Una respuesta guardada que ya no existe cae en el
     mensaje automático en vez de mandar un texto vacío. */
  let esGuardada = false;
  if(String(cual||'').indexOf('guardado:') === 0){
    const g = mensajesRapidos.find(function(x){ return String(x.id) === cual.slice(9); });
    if(g){ t = g.texto; esGuardada = true; }
  }
  if(!esGuardada){
    if(cual === 'cobro')        t = ajustes.plantillaCobro;
    else if(cual === 'vencido') t = ajustes.plantillaVencido;
    else if(cual === 'entrega') t = ajustes.plantillaEntrega;
    else t = vencido ? ajustes.plantillaVencido : ajustes.plantillaCobro;
  }
  t = t || '';
  if(ajustes.firmaWs) t += '\n\n' + ajustes.firmaWs;
  return t
    .replace(/\{cliente\}/g, c.nombre || '')
    .replace(/\{servicio\}/g, c.servicio || '')
    .replace(/\{vencimiento\}/g, fechaBonita(c.vencimiento))
    .replace(/\{monto\}/g, dinero(cobroDe(c)))
    .replace(/\{correo\}/g, (m && m.correo) || '')
    .replace(/\{contrasena\}/g, (m && m.contrasena) || '')
    .replace(/\{perfil\}/g, c.perfil || '')
    .replace(/\{pin\}/g, c.pin || 'sin PIN')
    .replace(/\{dias\}/g, String(Math.abs(diasHasta(c.vencimiento) || 0)))
    .replace(/\{negocio\}/g, ajustes.nombre || 'PAPOTAS');
}
/* Cuando el número no sirve, no basta con decir «no se pudo»: se dice cuál
   es el número, qué le pasa, y se abre ahí mismo para arreglarlo. */
function avisarTelefonoMalo(c, n){
  abrirModal('El número de ' + esc(c.nombre || 'este cliente') + ' no sirve',
    '<p style="margin:0 0 var(--e3);color:var(--txt-2);font-size:13.5px;line-height:1.6">' +
      (c.telefono
        ? 'Tienes apuntado <b>' + esc(c.telefono) + '</b>, y así ' + esc(n.porque) + '. ' +
          'WhatsApp lo rechaza sin decir de quién es, por eso te lo digo aquí.'
        : 'No tiene teléfono apuntado, así que no hay a dónde escribirle.') +
    '</p>' +
    '<p style="margin:0;color:var(--txt-3);font-size:12.5px;line-height:1.6">' +
      'Con el prefijo <b>' + esc(ajustes.prefijoPais || '—') + '</b> puesto en Ajustes, un celular ' +
      'se apunta con sus dígitos y el programa le pone el país solo.</p>',
    [{texto:'Ahora no', clase:'fantasma', hacer:cerrarModal},
     {texto:'Arreglar el número', clase:'principal', hacer:function(){ cerrarModal(); formCliente(c.id); }}]);
}
function abrirWhatsApp(id, cual){
  const c = buscarCliente(id);
  if(!c) return false;
  const n = normalizarTelefono(c.telefono);
  if(!n.vale){ avisarTelefonoMalo(c, n); return false; }
  const tel = n.tel;
  saltarAWhatsApp(tel, textoWhatsApp(c, cual));
  marcarEscrito(c);
  anotar('WHATSAPP', 'Mensaje abierto para ' + c.nombre);
  guardar();
  return true;
}

/* ---------- LA RONDA DE WHATSAPP ----------------------------------------
   Escribirle a cuarenta y ocho personas es el trabajo que más tiempo se
   lleva del día. La versión de antes los ponía en fila, pero al pulsar
   «mandar» saltaba sola al siguiente: si el cliente te pagaba en ese mismo
   momento —que es lo que pasa la mitad de las veces— ya no lo tenías
   delante para cobrarle. Ahora la ronda va en dos tiempos, que son los dos
   tiempos de verdad: primero mandas, y cuando te paga, cobras.

   Además se ve el mensaje ANTES de mandarlo, se puede cambiar para esa
   persona concreta, se puede copiar, y se lleva con el teclado. */
let cola = [], colaPos = 0;
let colaPlantilla = 'auto';
try{ colaPlantilla = localStorage.getItem('pap_plantilla_cola') || 'auto'; }catch(_){}
let colaMandados = new Set();   /* a quién ya le escribiste en esta ronda */
let colaTextos = {};            /* el mensaje retocado a mano, por cliente */
let colaEditando = false;
/* ---- MANDARLES A TODOS, DE UNA -----------------------------------------
   Lo primero, la verdad incómoda: WhatsApp NO deja mandar mensajes en lote
   desde una página web. Ni wa.me, ni la aplicación, ni WhatsApp Web. Abre
   un chat cada vez, y es a propósito: si dejara, esto sería una máquina de
   spam y te cerrarían el número en dos días.

   Lo que sí se puede es quitar de en medio todo lo demás. En modo seguido,
   al volver de WhatsApp el programa salta solo al siguiente y te deja el
   botón de mandar debajo del pulgar: cien mensajes pasan de trescientos
   toques a cien. Y si prefieres usar otra herramienta, aquí se copian los
   cien mensajes o se bajan en una hoja con teléfono y texto. */
let colaSeguido = false;
try{ colaSeguido = localStorage.getItem('pap_cola_seguido') === '1'; }catch(_){}
let colaEsperandoVuelta = false;

function abrirCola(lista, titulo){
  const conTel = lista.filter(function(c){ return telefonoDe(c); });
  const sinTel = lista.length - conTel.length;
  if(!conTel.length){
    avisar(lista.length ? 'Ninguno de esos ' + lista.length + ' tiene teléfono guardado'
                        : 'No hay nadie en esa lista', 'mal');
    return;
  }
  cola = conTel.slice();
  colaPos = 0;
  colaMandados = new Set();
  colaTextos = {};
  colaEditando = false;
  pintarCola();
  avisar(conTel.length + ' en la ronda' + (sinTel ? ' · ' + sinTel + ' sin teléfono se quedan fuera' : ''), 'bien');
}

/* La ventana de «mandarles a todos». Dice la verdad de entrada -WhatsApp
   abre un chat cada vez y no hay forma de saltárselo- y ofrece las tres
   maneras que sí funcionan, con el número de gente de cada una delante. */
function avisarDeMandarATodos(lista){
  const conTel = lista.filter(function(c){ return telefonoDe(c); });
  const sinTel = lista.length - conTel.length;
  if(!conTel.length){
    avisar(lista.length ? 'Ninguno de esos ' + lista.length + ' tiene teléfono guardado'
                        : 'No hay nadie a quien escribirle', 'mal');
    return;
  }
  /* La lista se deja puesta para que «copiar» y «bajar» tengan de dónde
     sacar los textos sin abrir la barra antes de tiempo. */
  cola = conTel.slice(); colaPos = 0; colaMandados = new Set(); colaTextos = {};
  abrirModal('Mandarles a todos · ' + conTel.length,
    '<div class="pila">' +
      '<p class="ayuda-modal">WhatsApp <b>no deja mandar mensajes en lote</b> desde una ' +
      'página: abre un chat cada vez, y es a propósito -si dejara, esto sería una ' +
      'máquina de spam y te cerrarían el número-. Lo que sí se puede es quitar de en ' +
      'medio todo lo demás.</p>' +
      (sinTel ? '<p class="ayuda-modal"><b>' + sinTel + '</b> ' +
        plural(sinTel,'se queda fuera','se quedan fuera') + ': no ' +
        plural(sinTel,'tiene','tienen') + ' teléfono guardado.</p>' : '') +
      '<div class="pila opciones-todos">' +
        '<button type="button" class="opcion-todos" data-todos="seguido">' +
          '<span class="ot-ico bien">' + ICONO.rayo + '</span>' +
          '<span class="crece"><b>Uno detrás de otro</b>' +
          '<small>Mandas, y al volver a PAPOTAS salta solo al siguiente. ' +
          conTel.length + ' mensajes con un toque cada uno.</small></span>' +
        '</button>' +
        '<button type="button" class="opcion-todos" data-todos="copiar">' +
          '<span class="ot-ico">' + ICONO.copiar + '</span>' +
          '<span class="crece"><b>Copiar los ' + conTel.length + ' mensajes</b>' +
          '<small>Con su nombre y su teléfono delante, para pegarlos donde quieras.</small></span>' +
        '</button>' +
        '<button type="button" class="opcion-todos" data-todos="bajar">' +
          '<span class="ot-ico">' + ICONO.bajar + '</span>' +
          '<span class="crece"><b>Bajar la lista</b>' +
          '<small>Una hoja de cálculo con teléfono y mensaje, por si usas otra herramienta.</small></span>' +
        '</button>' +
      '</div>' +
    '</div>',
    [{texto:'Cancelar', clase:'fantasma', hacer:function(){ cola = []; colaPos = 0; cerrarModal(); }}]);
  const zona = document.getElementById('modal-cuerpo');
  if(zona) zona.addEventListener('click', function(ev){
    const b = ev.target.closest && ev.target.closest('[data-todos]');
    if(!b) return;
    const q = b.dataset.todos;
    if(q === 'copiar'){ copiarTodaLaCola(); return; }
    if(q === 'bajar'){ bajarListaDeLaCola(); return; }
    cerrarModal();
    colaSeguido = true;
    try{ localStorage.setItem('pap_cola_seguido','1'); }catch(_){}
    abrirCola(lista);
  });
}

function cerrarCola(){
  cola = []; colaPos = 0; colaEditando = false;
  pintarCola();
}

/* El texto que se va a mandar: el tuyo si lo retocaste, si no la plantilla. */
function textoDeLaRonda(c){
  const propio = colaTextos[String(c.id)];
  return (propio != null) ? propio : textoWhatsApp(c, colaPlantilla);
}

function pintarCola(){
  let caja = document.getElementById('cola');
  if(!cola.length || colaPos >= cola.length){
    if(caja) caja.classList.remove('puesta');
    document.body.classList.remove('con-cola');
    if(cola.length && colaPos >= cola.length){
      const mandados = colaMandados.size;
      cola = []; colaPos = 0;
      avisar('Ronda terminada · ' + mandados + ' ' + plural(mandados,'mensaje mandado','mensajes mandados'), 'bien');
    }
    return;
  }
  if(!caja){
    caja = document.createElement('div');
    caja.id = 'cola';
    caja.setAttribute('role','region');
    caja.setAttribute('aria-label','Ronda de WhatsApp');
    document.body.appendChild(caja);
  }
  const c = cola[colaPos];
  const m = masterDe(c);
  const mandado = colaMandados.has(String(c.id));
  const texto = textoDeLaRonda(c);
  const retocado = colaTextos[String(c.id)] != null;

  caja.innerHTML =
    '<div class="cola-barra"><i style="width:' + Math.round(colaPos/cola.length*100) + '%"></i></div>' +

    '<div class="cola-alto">' +
      logoPlataforma(c.servicio || (m && m.nombre), 36) +
      '<div class="cola-quien">' +
        '<b>' + esc(c.nombre || 'Cliente') + '</b>' +
        '<small>' + esc((m ? nombreCuenta(m) : (c.servicio || '')) +
          (perfilBonito(c) ? ' · ' + perfilBonito(c) : '') +
          ' · ' + dinero(cobroDe(c)) + ' · ' + textoDias(c.vencimiento)) + '</small>' +
      '</div>' +
      (mandado ? '<span class="cola-marca">' + ICONO.ok + 'mandado</span>' : '') +
      '<span class="cola-paso">' + (colaPos + 1) + ' de ' + cola.length + '</span>' +
      '<button class="btn icono mini' + (colaSeguido ? ' bien' : ' fantasma') + '" data-cola="seguido"' +
        ' aria-pressed="' + colaSeguido + '"' +
        ' title="' + (colaSeguido
          ? 'Modo seguido encendido: al volver de WhatsApp salta solo al siguiente'
          : 'Modo seguido: manda, y al volver a PAPOTAS salta solo al siguiente') + '"' +
        ' aria-label="Modo seguido">' + ICONO.rayo + '</button>' +
      '<button class="btn icono mini fantasma" data-cola="copiar-todos"' +
        ' title="Copiar los ' + cola.length + ' mensajes de la ronda"' +
        ' aria-label="Copiar todos los mensajes">' + ICONO.copiar + '</button>' +
      '<button class="btn icono mini fantasma" data-cola="bajar-todos"' +
        ' title="Bajar la lista: teléfono y mensaje de los ' + cola.length + '"' +
        ' aria-label="Bajar la lista">' + ICONO.bajar + '</button>' +
      '<button class="btn icono mini fantasma" data-cola="cerrar" aria-label="Terminar la ronda">' + ICONO.x + '</button>' +
    '</div>' +

    /* El mensaje, a la vista. Antes se mandaba a ciegas. */
    (colaEditando
      ? '<div class="cola-texto editando">' +
          '<textarea id="cola-edita" rows="4" aria-label="El mensaje que se va a mandar">' + esc(texto) + '</textarea>' +
          '<div class="cola-texto-pie">' +
            '<button class="btn mini principal" data-cola="guardar-texto">' + ICONO.ok + 'Listo</button>' +
            '<button class="btn mini fantasma" data-cola="dejar-texto">Cancelar</button>' +
            (retocado ? '<button class="btn mini fantasma" data-cola="restaurar-texto">Volver a la plantilla</button>' : '') +
          '</div>' +
        '</div>'
      : '<div class="cola-texto">' +
          '<p class="cola-previa">' + esc(texto) + '</p>' +
          '<div class="cola-texto-pie">' +
            (retocado ? '<span class="insignia aviso">retocado</span>' : '') +
            '<button class="btn mini fantasma" data-cola="editar">' + ICONO.lapiz + 'Cambiar el texto</button>' +
            '<button class="btn mini fantasma" data-cola="copiar">' + ICONO.copiar + 'Copiar</button>' +
          '</div>' +
        '</div>') +

    '<div class="cola-mando">' +
      '<select id="cola-plantilla" aria-label="Qué mensaje mandar">' +
        '<option value="auto"' + (colaPlantilla==='auto'?' selected':'') + '>El que toque</option>' +
        '<option value="cobro"' + (colaPlantilla==='cobro'?' selected':'') + '>Recordatorio de cobro</option>' +
        '<option value="vencido"' + (colaPlantilla==='vencido'?' selected':'') + '>Ya venció</option>' +
        '<option value="entrega"' + (colaPlantilla==='entrega'?' selected':'') + '>Entrega de datos</option>' +
        (mensajesRapidos.length ?
          '<optgroup label="Tus respuestas guardadas">' +
            mensajesRapidos.map(function(g){
              const v = 'guardado:' + g.id;
              return '<option value="' + esc(v) + '"' + (colaPlantilla===v?' selected':'') + '>' +
                     esc(g.titulo || 'Sin título') + '</option>';

      '<button class="btn mini principal' + (mandado ? ' crece' : '') + '" data-cola="cobrar"' +

        ICONO.cobrar + '<span class="et">Me pagó · ' + esc(dinero(cobroDe(c))) + '</span></button>' +
      '<button class="btn mini fantasma" data-cola="saltar" title="Pasar al siguiente sin cobrar">' +
        '<span class="et">Siguiente</span>' + ICONO.flecha + '</button>' +
    '</div>' +

    '<p class="cola-teclas">' +
      (colaSeguido
        ? '<b class="cola-seguido-si">Seguido:</b> mandas, y al volver salta solo al siguiente. '
        : '') +
      'Enter mandar · C cobrar · → siguiente · Esc salir</p>';

  caja.classList.add('puesta');
  document.body.classList.add('con-cola');
  document.body.style.setProperty('--alto-cola', caja.offsetHeight + 'px');
  if(colaEditando){
    const t = document.getElementById('cola-edita');
    if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }
}

function avanzarCola(){
  colaEditando = false;
  colaPos++;
  pintarCola();
}

/* Al volver a PAPOTAS después de mandar, en modo seguido se pasa solo al
   siguiente. Solo cuenta si de verdad saliste de la pantalla -de ahí lo de
   esperar a que el documento se esconda-, para que cambiar de pestaña sin
   más no te salte a nadie. */
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ return; }
  if(!colaSeguido || !colaEsperandoVuelta) return;
  if(!cola.length || colaPos >= cola.length){ colaEsperandoVuelta = false; return; }
  colaEsperandoVuelta = false;
  avanzarCola();
});

/* Los mensajes de toda la ronda, en texto plano. */
function textosDeLaCola(){
  return cola.map(function(c){
    const n = normalizarTelefono(c.telefono);
    return {cliente: c.nombre || 'Cliente',
            tel: n.vale ? n.tel : String(c.telefono || ''),
            texto: textoDeLaRonda(c)};
  });
}
function copiarTodaLaCola(){
  const t = textosDeLaCola();
  if(!t.length){ avisar('No hay nadie en la ronda', 'mal'); return; }
  copiar(t.map(function(x){
    return x.cliente + ' · +' + x.tel + '\n' + x.texto;
  }).join('\n\n———\n\n'), 'Los ' + t.length + ' mensajes');
}
function bajarListaDeLaCola(){
  const t = textosDeLaCola();
  if(!t.length){ avisar('No hay nadie en la ronda', 'mal'); return; }
  bajarArchivo('papotas-mensajes-' + hoyISO() + '.csv',
    csvDe([['Cliente','Telefono','Mensaje']].concat(
      t.map(function(x){ return [x.cliente, '+' + x.tel, x.texto]; }))),
    'text/csv');
  avisar(t.length + ' ' + plural(t.length,'mensaje bajado','mensajes bajados'), 'bien');
}

/* Todo lo que se puede hacer desde la barra de la ronda, en un solo sitio. */
function mandoCola(que){
  if(que === 'cerrar'){ cerrarCola(); return; }
  const c = cola[colaPos];
  if(!c) return;
  const clave = String(c.id);

  if(que === 'editar'){ colaEditando = true; pintarCola(); return; }
  if(que === 'dejar-texto'){ colaEditando = false; pintarCola(); return; }
  if(que === 'guardar-texto'){
    const t = document.getElementById('cola-edita');
    if(t) colaTextos[clave] = t.value;
    colaEditando = false; pintarCola(); return;
  }
  if(que === 'restaurar-texto'){
    delete colaTextos[clave];
    colaEditando = false; pintarCola(); return;
  }
  if(que === 'copiar'){ copiar(textoDeLaRonda(c), 'El mensaje'); return; }
  if(que === 'copiar-todos'){ copiarTodaLaCola(); return; }
  if(que === 'bajar-todos'){ bajarListaDeLaCola(); return; }
  if(que === 'seguido'){
    colaSeguido = !colaSeguido;
    try{ localStorage.setItem('pap_cola_seguido', colaSeguido ? '1' : '0'); }catch(_){}
    avisar(colaSeguido
      ? 'Modo seguido: al volver de WhatsApp salta solo al siguiente'
      : 'Modo seguido apagado: vuelves tú cuando quieras', 'bien');
    pintarCola();
    return;
  }

  if(que === 'enviar'){
    /* Mandar NO pasa al siguiente. Mandas, esperas, y cuando te paga le
       das a «me pagó»: ahí sí avanza. */
    const n = normalizarTelefono(c.telefono);
    if(!n.vale){ avisarTelefonoMalo(c, n); return; }
    saltarAWhatsApp(n.tel, textoDeLaRonda(c));
    colaEsperandoVuelta = true;
    marcarEscrito(c);
    colaMandados.add(clave);
    anotar('WHATSAPP', 'Mensaje mandado a ' + (c.nombre||''));
    guardar();
    pintarCola();
    return;
  }
  if(que === 'cobrar'){ renovar(c.id, true); avanzarCola(); return; }
  if(que === 'saltar'){ avanzarCola(); return; }
}

/* Queda apuntado a quién le escribiste hoy, para no repetirte. */
function marcarEscrito(c){
  c.ultimoAviso = hoyISO();
}
function escritoHoy(c){
  return !!(c && c.ultimoAviso === hoyISO());
}

    '</div>',

       const texto  = val('rp-texto').trim();

/* `previo` llega cuando se crea desde un perfil libre: la cuenta y el

      campo('cl-ciclotipo','Su ciclo',{tipo:'select', valor:ciclo.tipo, opciones:[['meses','Meses'],['dias','Días']]}) +

    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal},
     {texto:esNuevo?'Crear cliente':'Guardar', clase:'principal', hacer:function(){
       const nombre = val('cl-nombre').trim();
       if(!nombre){ avisar('Ponle un nombre al cliente', 'mal'); return; }
       const cuentaId = val('cl-cuenta');
       const master = cuentaId ? buscarMaster(cuentaId) : null;
       /* Se conserva todo lo que el programa no conoce. */
       const destino = c || {id:nuevoId('c')};
       recordarPaso(esNuevo ? 'crear a ' + nombre : 'editar a ' + nombre);
       /* Si le cambias el precio, queda apuntado cuándo y de cuánto a cuánto:
          «¿este desde cuándo paga 15?» dejaba de tener respuesta. */
       const antes = Number(destino.monto);
       const ahora = num('cl-monto');
       if(!esNuevo && isFinite(antes) && antes !== ahora){
         if(!Array.isArray(destino.historialPrecios)) destino.historialPrecios = [];
         destino.historialPrecios.unshift({fecha:hoyISO(), de:antes, a:ahora});
         if(destino.historialPrecios.length > 30) destino.historialPrecios.length = 30;
       }
       destino.nombre = nombre;
       destino.nota = val('cl-nota').trim();
       destino.telefono = val('cl-tel').trim();
       destino.cuentaMasterId = cuentaId || null;
       destino.servicio = master ? master.nombre : (destino.servicio || '');
       destino.perfil = val('cl-perfil').trim() || 'Perfil 1';
       destino.pin = val('cl-pin').trim();
       destino.monto = num('cl-monto');
       destino.metodo = val('cl-metodo').trim() || 'PLIN';
       destino.vencimiento = val('cl-vence');
       destino.cicloTipo = val('cl-ciclotipo');
       destino.cicloCantidad = Math.max(1, Math.round(num('cl-ciclocant')) || 1);
       if(!destino.inicio) destino.inicio = hoyISO();
       if(esNuevo){ clientes.push(destino); anotar('ALTA', 'Cliente nuevo: ' + nombre); }
       else anotar('EDITAR', 'Cliente modificado: ' + nombre);
       guardar(); cerrarModal(); pintar();
       avisar(esNuevo ? nombre + ' agregado' : 'Cambios guardados', 'bien', true);
     }}]);
}

function formMaster(id, plataformaPuesta){
  const m = id ? buscarMaster(id) : null;
  const esNuevo = !m;
  /* Al crear desde una plataforma, viene ya escrita y con el siguiente
     número libre, que es lo que se iba a teclear igualmente. */
  const nombrePre = m ? m.nombre : (plataformaPuesta || '');
  const numeroPre = m ? m.numero : (plataformaPuesta
    ? servicios.filter(function(x){ return String(x.nombre||'').trim().toUpperCase() === plataformaPuesta; })
               .reduce(function(a,x){ return Math.max(a, Number(x.numero)||0); }, 0) + 1
    : 1);
  abrirModal(esNuevo ? 'Nueva cuenta master' : 'Editar cuenta',
    '<div class="rejilla r2">' +
      campo('ms-nombre','Plataforma',{valor:nombrePre, pista:'NETFLIX, DISNEY+, MAX…'}) +
      campo('ms-numero','Número de cuenta',{tipo:'number', valor:numeroPre, ayuda:'Para distinguir varias de la misma plataforma'}) +
      campo('ms-correo','Correo',{valor:m?m.correo:''}) +
      campo('ms-clave','Clave',{valor:m?m.contrasena:''}) +
      campo('ms-perfiles','Cuántos perfiles',{tipo:'number', valor:m?m.perfiles:5, paso:'1'}) +
      campo('ms-costo','Cuánto te cuesta',{tipo:'number', valor:m?m.costo:'', paso:'0.01'}) +
      campo('ms-vence','Vence el',{tipo:'date', valor:m?m.vencimiento:avanzar(hoyISO(), cicloDe(m))}) +
      campo('ms-etiqueta','Etiqueta',{valor:m?m.etiqueta:'', pista:'Opcional: casa, proveedor…'}) +
      /* Su ciclo, igual que el de un cliente: no todas las cuentas se
         compran por meses. Las hay de 45, de 90 y de 15 días. */
      campo('ms-ciclotipo','Su ciclo',{tipo:'select', valor:cicloDe(m).tipo,
        opciones:[['meses','Meses'],['dias','Días']]}) +
      campo('ms-ciclocant','Cada cuántos',{tipo:'number', valor:cicloDe(m).cantidad, paso:'1',
        ayuda:'Cada cuántos meses (o días) hay que volver a pagarla'}) +
    '</div>' +
    campo('ms-nota','Nota',{tipo:'textarea', valor:m?m.nota:'', filas:2,
      pista:'De quién la compraste, con qué correo la recuperas…'}) +
    (esNuevo ? '<label class="fila" style="gap:8px;font-size:13px;font-weight:500;color:var(--txt-2)">' +
      '<input type="checkbox" id="ms-gasto" checked> Registrar la compra como gasto del día</label>' : ''),
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal},
     {texto:esNuevo?'Crear cuenta':'Guardar', clase:'principal', hacer:function(){
       const nombre = val('ms-nombre').trim().toUpperCase();
       if(!nombre){ avisar('Ponle el nombre de la plataforma', 'mal'); return; }
       const destino = m || {id:nuevoId('s')};
       recordarPaso(esNuevo ? 'crear una cuenta de ' + nombre : 'editar ' + nombreCuenta(destino));
       destino.nombre = nombre;
       destino.nota = val('ms-nota').trim();
       destino.numero = Math.max(1, Math.round(num('ms-numero')) || 1);
       destino.correo = val('ms-correo').trim();
       destino.contrasena = val('ms-clave');
       destino.perfiles = Math.max(0, Math.round(num('ms-perfiles')));
       destino.costo = num('ms-costo');
       destino.vencimiento = val('ms-vence');
       destino.etiqueta = val('ms-etiqueta').trim();
       destino.cicloTipo = val('ms-ciclotipo');
       destino.cicloCantidad = Math.max(1, Math.round(num('ms-ciclocant')) || 1);
       if(esNuevo){
         servicios.push(destino);
         anotar('ALTA MASTER', 'Cuenta nueva: ' + nombreCuenta(destino));
         const marcar = document.getElementById('ms-gasto');
         if(marcar && marcar.checked && destino.costo > 0){
           inversiones.push({id:nuevoId('inv'), plataforma:destino.nombre, cuentaMasterId:destino.id,
                             persona:ajustes.nombre||'PAPOTAS', monto:destino.costo, fecha:hoyISO()});
           anotar('GASTO', 'Compra de ' + nombreCuenta(destino) + ' por ' + dinero(destino.costo));
         }
       }else{
         /* Si cambia el nombre, los clientes de esa cuenta lo siguen. */
         clientesDe(destino.id).forEach(function(c){ c.servicio = destino.nombre; });
         anotar('EDITAR MASTER', 'Cuenta modificada: ' + nombreCuenta(destino));
       }
       guardar(); cerrarModal(); pintar();
       avisar(esNuevo ? nombreCuenta(destino) + ' agregada' : 'Cambios guardados', 'bien', true);
     }}]);
}

/* ---------- Mover a alguien de sitio ------------------------------------
   Un cliente cambia de cuenta más veces de las que parece: se te llena una,
   compras otra y hay que repartir. Antes tocaba editar al cliente y acordarse
   de memoria de qué perfiles estaban libres. Ahora se ven todos. */
let moviendo = null;

function formMover(id){
  const c = buscarCliente(id);
  if(!c){ avisar('Ese cliente ya no está', 'mal'); return; }
  moviendo = {id:String(c.id),
              cuenta:c.cuentaMasterId ? String(c.cuentaMasterId) : '',
              perfil:String(c.perfil || '')};
  abrirModal('Mover a ' + (c.nombre || 'este cliente'), cuerpoMover(),
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal},
     {texto:'Mover aquí', clase:'principal', hacer:aplicarMover}]);
}

function cuerpoMover(){
  const c = buscarCliente(moviendo.id);
  if(!c) return '';
  const actual = masterDe(c);
  const opc = [['','Dejarlo sin cuenta']].concat(
    servicios.slice().sort(function(a,b){ return nombreCuenta(a).localeCompare(nombreCuenta(b),'es'); })
      .map(function(m){
        const libres = perfilesDe(m).filter(function(x){ return x.n && !x.cliente; }).length;
        return [m.id, nombreCuenta(m) + ' · ' + (libres ? libres + ' ' + plural(libres,'sitio libre','sitios libres') : 'sin sitio')];
      }));
  return '<div class="pila">' +
    '<p style="margin:0;color:var(--txt-3);font-size:12.5px;line-height:1.6">Ahora está en <b style="color:var(--txt)">' +
      esc(actual ? nombreCuenta(actual) : 'ninguna cuenta') + '</b>' +
      (perfilBonito(c) ? ', en ' + esc(perfilBonito(c)) : '') + '.</p>' +
    campo('mv-cuenta','A qué cuenta', {tipo:'select', valor:moviendo.cuenta, opciones:opc}) +
    huecosDe(moviendo.cuenta, moviendo.perfil) +
  '</div>';
}
function repintarMover(){
  const cuerpo = $('#modal-cuerpo');
  if(cuerpo) cuerpo.innerHTML = cuerpoMover();
}

/* Los perfiles de una cuenta como botones: se ve de un golpe cuál está
   libre y quién ocupa los demás. */
function huecosDe(mid, elegido){
  const m = mid ? buscarMaster(mid) : null;
  if(!m) return '<p class="pista" style="margin:0">Sin cuenta no hace falta perfil.</p>';
  const casillas = perfilesDe(m).filter(function(x){ return x.n; });
  if(!casillas.length) return '<p class="pista" style="margin:0">Esta cuenta no tiene perfiles puestos. Edítala y dile cuántos tiene.</p>';
  return '<div class="campo"><label>En qué perfil</label>' +
    '<div class="huecos">' + casillas.map(function(x){
      const nombre = 'Perfil ' + x.n;
      const suyo = x.cliente && String(x.cliente.id) === String(moviendo.id);
      const ocupado = x.cliente && !suyo;
      return '<button type="button" class="hueco' + (ocupado?' ocupado':'') +
        (String(elegido) === nombre ? ' viva' : '') + '" data-hueco="' + esc(nombre) + '"' +
        ' aria-pressed="' + (String(elegido) === nombre ? 'true' : 'false') + '">' +
        '<b>' + x.n + '</b>' +
        '<small>' + esc(suyo ? 'donde está' : ocupado ? (x.cliente.nombre || 'ocupado') : 'libre') + '</small>' +
      '</button>';
    }).join('') + '</div>' +
    '<span class="pista">Puedes ponerlo en uno ocupado si de verdad comparten: se avisa, pero se deja.</span></div>';
}

function aplicarMover(){
  const c = moviendo && buscarCliente(moviendo.id);
  if(!c){ cerrarModal(); return; }
  const m = moviendo.cuenta ? buscarMaster(moviendo.cuenta) : null;
  const desde = masterDe(c);
  /* Si no eliges perfil y la cuenta tiene sitio, se le da el primero libre:
     dejarle el número del perfil de la cuenta de la que viene es cómo se
     acaba con dos personas en el mismo sitio sin enterarte. */
  const perfil = moviendo.perfil || (m ? primerPerfilLibre(m) : '') || c.perfil || 'Perfil 1';
  /* Aviso, no muro: si de verdad comparten el perfil, es cosa suya. */
  const choca = m && clientesDe(m.id).some(function(x){
    return String(x.id) !== String(c.id) &&
           String(x.perfil||'').trim().toLowerCase() === String(perfil).trim().toLowerCase();
  });

  recordarPaso('mover a ' + (c.nombre || 'un cliente'));
  c.cuentaMasterId = m ? m.id : null;
  if(m) c.servicio = m.nombre;
  c.perfil = m ? perfil : (c.perfil || '');
  anotar('MOVER', (c.nombre||'') + ': ' +
    (desde ? nombreCuenta(desde) : 'sin cuenta') + ' → ' +
    (m ? nombreCuenta(m) + ' · ' + perfil : 'sin cuenta'));
  guardar();
  cerrarModal();
  if(m){
    ponerPlataforma(String(m.nombre||'').trim().toUpperCase());
    rutaCuenta = String(m.id);
  }
  pintar();
  avisar((c.nombre || 'Cliente') + ' ahora está en ' +
    (m ? nombreCuenta(m) + ' · ' + perfil : 'ninguna cuenta') +
    (choca ? ' (comparte perfil)' : ''), choca ? 'aviso' : 'bien', true);
}

/* ---------- Los accesos, listos para pegar en WhatsApp -------------------
   Es el mensaje que mandas veinte veces al día. Tenerlo a un toque, ya
   escrito y sin faltarle el PIN, ahorra más tiempo que cualquier otra cosa
   del programa. */
function textoAccesos(c){
  const m = masterDe(c);
  const l = [platDe(c) || 'TU CUENTA'];
  if(m && m.correo)     l.push('Correo: ' + m.correo);
  if(m && m.contrasena) l.push('Clave: ' + m.contrasena);
  if(perfilBonito(c))   l.push('Perfil: ' + perfilBonito(c));
  if(c.pin)             l.push('PIN: ' + c.pin);
  if(c.vencimiento)     l.push('Vence: ' + fechaBonita(c.vencimiento));
  return l.join('\n');
}
function textoAccesosCuenta(m){
  const l = [String(m.nombre || 'CUENTA').toUpperCase()];
  if(m.correo)      l.push('Correo: ' + m.correo);
  if(m.contrasena)  l.push('Clave: ' + m.contrasena);
  if(m.vencimiento) l.push('Vence: ' + fechaBonita(m.vencimiento));
  return l.join('\n');
}

/* ---------- Bajar un archivo, sin repetir el mismo baile tres veces ----- */
function bajarArchivo(nombre, texto, tipo){
  const url = URL.createObjectURL(new Blob([texto], {type:(tipo||'text/plain') + ';charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

/* ---------- Sacar los datos a una hoja de cálculo -----------------------
   Punto y coma, no coma: es lo que abre Excel en español sin preguntar. Y
   el BOM del principio es lo que hace que las tildes no salgan rotas. */
function csvDe(filas){
  return '﻿' + filas.map(function(f){
    return f.map(function(v){
      const t = String(v == null ? '' : v);
      return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
    }).join(';');
  }).join('\r\n');
}
function exportarCSV(que){
  let filas, nombre;
  if(que === 'cobros'){
    nombre = 'papotas_cobros_' + hoyISO() + '.csv';
    filas = [['Fecha','Cliente','Plataforma','Cuenta','Monto','Meses','Método']];
    ventas.slice().sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); })
      .forEach(function(v){
        const m = v.cuentaMasterId ? buscarMaster(v.cuentaMasterId) : null;
        filas.push([v.fecha||'', v.cliente||'', v.servicio||'', m?nombreCuenta(m):'',
                    Number(v.monto)||0, v.meses||1, v.metodo||'']);
      });
  }else if(que === 'gastos'){
    nombre = 'papotas_gastos_' + hoyISO() + '.csv';
    filas = [['Fecha','Concepto','Cuenta','Monto']];
    inversiones.slice().sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); })
      .forEach(function(i){
        const m = i.cuentaMasterId ? buscarMaster(i.cuentaMasterId) : null;
        filas.push([i.fecha||'', i.plataforma||'', m?nombreCuenta(m):'', Number(i.monto)||0]);
      });
  }else{
    /* 'clientes' baja a todos; 'lista' baja lo que tienes delante, filtrado
       y en el orden que elegiste, que es lo que uno quiere mandar. */
    const deLaVista = que === 'lista';
    nombre = 'papotas_' + (deLaVista ? 'lista' : 'clientes') + '_' + hoyISO() + '.csv';
    filas = [['Nombre','Teléfono','Plataforma','Cuenta','Perfil','PIN','Le cobras','Ciclo','Vence','Estado','Método','Nota']];
    (deLaVista
      ? ordenarParaTabla(clientesFiltrados())
      : clientes.slice().sort(function(a,b){ return String(a.nombre||'').localeCompare(String(b.nombre||''),'es'); }))
      .forEach(function(c){
        const m = masterDe(c);
        const ciclo = cicloDe(c);
        filas.push([c.nombre||'', telefonoDe(c), platDe(c), m?nombreCuenta(m):'',
          perfilBonito(c)||'', c.pin||'', cobroDe(c),
          ciclo.cantidad + ' ' + (ciclo.tipo === 'dias' ? 'días' : 'meses'),
          c.vencimiento||'', textoDias(c.vencimiento), c.metodo||'', c.nota||'']);
      });
  }
  bajarArchivo(nombre, csvDe(filas), 'text/csv');
  anotar('EXPORTAR', nombre);
  avisar('Se bajó ' + nombre, 'bien');
}

/* ---------- Diagnóstico -------------------------------------------------
   Con cien clientes y veinte cuentas, los líos no se ven: un cliente sin
   cuenta, dos en el mismo perfil, una master vencida que te van a cortar.
   Esto los saca a la cara, contados y con la puerta para ir a arreglarlos. */
function diagnostico(){
  const casos = [];
  function caso(clave, titulo, explica, lista, tono){
    if(lista.length) casos.push({clave:clave, titulo:titulo, explica:explica, lista:lista, tono:tono});
  }

  /* Fichas que se llaman igual pero llevan teléfonos distintos. No se
     juntan solas -dos «FERNANDA» pueden ser dos personas de verdad- pero
     si son la misma, tener bien el número lo arregla todo de golpe: un
     solo mensaje, y ver de un vistazo cuánto te deja en total. */
  const porNombre = new Map();
  clientes.forEach(function(c){
    const n = sinTildes(String(c.nombre||'').trim().toUpperCase());
    if(!n) return;
    if(!porNombre.has(n)) porNombre.set(n, []);
    porNombre.get(n).push(c);
  });
  const mismoNombre = [];
  porNombre.forEach(function(grupo, n){
    if(grupo.length < 2) return;
    const tels = new Set(grupo.map(function(c){
      const t = normalizarTelefono(c.telefono); return t.vale ? t.tel : '';
    }));
    tels.delete('');
    if(tels.size > 1) mismoNombre.push({
      texto: n + ': ' + grupo.length + ' fichas con ' + tels.size + ' teléfonos distintos',
      cliente: grupo[0].id,
      /* Con esto la ventana puede ofrecer el arreglo de un toque en vez de
         mandarle a editar cien fichas a mano. */
      juntar: grupo.map(function(c){ return c.id; })
    });
  });
  caso('misma_persona', '¿La misma persona con varias fichas?',
    'Se llaman igual pero tienen teléfonos distintos, así que el programa no las junta por su cuenta. Si es la misma persona, pon el mismo número en todas: se juntan solas, le escribes UNA vez por todo y ves cuánto te deja de verdad.',
    mismoNombre, 'aviso');

  caso('sin_cuenta', 'Clientes sin cuenta asignada',
    'Les cobras, pero el programa no sabe en qué cuenta están: no salen en ningún perfil y sus accesos no se pueden copiar.',
    clientes.filter(function(c){ return !masterDe(c); }).map(fichaDiagCliente), 'mal');

  const sobre = [];
  const repetidos = [];
  servicios.forEach(function(m){
    const cl = clientesDe(m.id);
    const tope = Math.max(0, Number(m.perfiles||0));
    if(tope && cl.length > tope) sobre.push({texto:nombreCuenta(m) + ': ' + cl.length + ' clientes en ' + tope + ' perfiles', cuenta:m.id});
    const vistos = {};
    cl.forEach(function(c){
      const k = String(c.perfil||'').trim().toLowerCase();
      if(!k) return;
      if(vistos[k]) repetidos.push({texto:nombreCuenta(m) + ' · ' + (c.perfil||'?') + ': ' + vistos[k] + ' y ' + (c.nombre||'?'), cuenta:m.id});
      else vistos[k] = c.nombre || '?';
    });
  });
  caso('sobreventa', 'Cuentas con más gente que perfiles',
    'Vendiste más sitios de los que tiene la cuenta. Alguien se va a quedar fuera.', sobre, 'mal');
  caso('perfil_repetido', 'Dos personas en el mismo perfil',
    'Comparten perfil sin saberlo: se pisan la lista de «seguir viendo» y se echan mutuamente.', repetidos, 'aviso');

  caso('master_vencida', 'Cuentas master vencidas',
    'La renovación está pasada. Si no la pagas, se cae y con ella todos sus clientes.',
    servicios.filter(function(m){ const d = diasHasta(m.vencimiento); return d !== null && d < 0; })
      .map(function(m){ return {texto:nombreCuenta(m) + ' · ' + textoDias(m.vencimiento) + ' · ' + clientesDe(m.id).length + ' clientes dentro', cuenta:m.id}; }), 'mal');

  /* Cobros que apuntan a una cuenta que ya no está. La plata sigue en la
     caja, pero no se puede repartir y en «Qué te deja cada plataforma»
     faltaba sin que nada lo dijera. */
  const vivas = new Set(servicios.map(function(m){ return String(m.id); }));
  const sueltos = {};
  ventas.forEach(function(v){
    if(!v.cuentaMasterId || vivas.has(String(v.cuentaMasterId))) return;
    const k = v.cuentaNombre || 'Una cuenta borrada';
    if(!sueltos[k]) sueltos[k] = {n:0, suma:0};
    sueltos[k].n++; sueltos[k].suma += Number(v.monto)||0;
  });
  caso('cobros_sueltos', 'Cobros de una cuenta que ya no existe',
    'Esa plata está en la caja, pero su cuenta fue borrada: no se puede repartir por cuenta ni saber qué te dejó.',
    Object.keys(sueltos).map(function(k){
      return {texto:k + ': ' + sueltos[k].n + ' ' + plural(sueltos[k].n,'cobro','cobros') +
                    ' · ' + dinero(sueltos[k].suma)};
    }), 'aviso');

  caso('sin_telefono', 'Clientes sin teléfono',
    'No les puedes escribir por WhatsApp: cuando les toque pagar, tendrás que buscarlos a mano.',
    clientes.filter(function(c){ return !telefonoDe(c); }).map(fichaDiagCliente), 'aviso');

  caso('sin_fecha', 'Clientes sin fecha de vencimiento',
    'No aparecen nunca en «Hoy» ni en el calendario: puedes estar regalándoles el servicio.',
    clientes.filter(function(c){ return !c.vencimiento; }).map(fichaDiagCliente), 'aviso');

  caso('monto_cero', 'Clientes a los que no les cobras nada',
    'Están puestos en cero. O es un regalo a propósito, o se te olvidó ponerle el precio.',
    clientes.filter(function(c){ return !enPausa(c) && cobroDe(c) <= 0; }).map(fichaDiagCliente), 'aviso');

  caso('muy_vencido', 'Vencidos hace más de 30 días',
    'O ya no son clientes y ocupan un perfil que podrías vender, o llevas un mes sin cobrarles.',
    clientes.filter(function(c){ const d = diasHasta(c.vencimiento); return !enPausa(c) && d !== null && d < -30; })
      .sort(function(a,b){ return String(a.vencimiento||'').localeCompare(String(b.vencimiento||'')); })
      .map(fichaDiagCliente), 'aviso');

  caso('sin_clave', 'Cuentas sin correo o sin clave guardada',
    'Sin eso no puedes pasarle los accesos a nadie ni entrar tú.',
    servicios.filter(function(m){ return !m.correo || !m.contrasena; })
      .map(function(m){ return {texto:nombreCuenta(m) + ' · ' + (!m.correo && !m.contrasena ? 'sin correo ni clave' : !m.correo ? 'sin correo' : 'sin clave'), cuenta:m.id}; }), 'aviso');

  const eco = economia();
  caso('pierde', 'Cuentas que te cuestan más de lo que dejan',
    'Con los clientes que tienen ahora, cada ciclo pones dinero de tu bolsillo.',
    servicios.filter(function(m){ return resumenCuenta(m, eco).margen < 0; })
      .map(function(m){ const r = resumenCuenta(m, eco);

  return casos;
}

/* JUNTAR VARIAS FICHAS EN UNA SOLA PERSONA
   No se junta nada por su cuenta: se pregunta CUÁL de los teléfonos es el
   bueno y se enseña qué ficha tiene cada uno, porque puede que dos se
   llamen igual y sean dos personas de verdad. Lo único que se cambia es
   el teléfono -ni el precio, ni la cuenta, ni el vencimiento-, y se puede
   deshacer como cualquier otra cosa. */
function juntarPersonas(ids){
  const lista = String(ids||'').split(',').map(buscarCliente).filter(Boolean);
  if(lista.length < 2){ avisar('No encontré esas fichas', 'mal'); return; }
  const nombre = lista[0].nombre || 'esta persona';
  /* Los teléfonos que hay, con cuántas fichas usa cada uno. */
  const porTel = new Map();
  lista.forEach(function(c){
    const n = normalizarTelefono(c.telefono);
    const k = n.vale ? n.tel : '';
    if(!porTel.has(k)) porTel.set(k, []);
    porTel.get(k).push(c);
  });
  const opciones = Array.from(porTel.entries())
    .filter(function(e){ return e[0]; })
    .sort(function(a,b){ return b[1].length - a[1].length; });
  if(!opciones.length){ avisar('Ninguna de esas fichas tiene teléfono', 'mal'); return; }

  abrirModal('¿Es la misma persona?',
    '<div class="pila">' +
      '<p class="ayuda-modal">Hay <b>' + lista.length + ' fichas</b> a nombre de <b>' +
        esc(nombre) + '</b> con teléfonos distintos. Si son la misma persona, elige ' +
        'cuál es el número bueno y se pone en todas: a partir de ahí PAPOTAS las ' +
        'trata como una sola -un mensaje por todo, y la cuenta de lo que te deja ' +
        'entera-. <b>Si son dos personas distintas, cancela</b> y cámbiale el nombre ' +
        'a una para no confundirte.</p>' +
      '<div class="pila opciones-todos">' +
        opciones.map(function(e){
          const quienes = e[1].map(function(c){
            const m = masterDe(c);
            return (m ? nombreCuenta(m) : (c.servicio||'?')) + (perfilBonito(c) ? ' · ' + perfilBonito(c) : '');
          }).join(' · ');
          return '<button type="button" class="opcion-todos" data-tel-bueno="' + esc(e[0]) + '">' +
            '<span class="ot-ico">' + ICONO.wa + '</span>' +
            '<span class="crece"><b>+' + esc(e[0]) + '</b>' +
            '<small>lo usan ' + e[1].length + ' de las ' + lista.length + ': ' + esc(quienes) + '</small></span>' +
          '</button>';
        }).join('') +
      '</div>' +
    '</div>',
    [{texto:'Cancelar · son personas distintas', clase:'fantasma', hacer:cerrarModal}]);

  const zona = document.getElementById('modal-cuerpo');
  if(zona) zona.addEventListener('click', function(ev){
    const b = ev.target.closest && ev.target.closest('[data-tel-bueno]');
    if(!b) return;
    const tel = b.dataset.telBueno;
    /* Se escribe el número TAL COMO ÉL LO TIENE ESCRITO, no el que sale de
       normalizar. Si él guarda «940000001», que todas digan «940000001»:
       normalizando, la que ya estaba bien se quedaba como estaba y a las
       otras les entraba «51940000001», y acababa con el mismo número
       escrito de dos maneras. Funcionar funcionaba -para juntarlas se
       normalizan igual- pero al abrir la ficha veía dos números distintos
       y no había forma de saber cuál era el bueno. */
    const grupo = porTel.get(tel);
    const crudo = (grupo && grupo[0] && String(grupo[0].telefono || '').trim()) || tel;
    recordarPaso('juntar las fichas de ' + nombre);
    let tocadas = 0;
    lista.forEach(function(c){
      if(String(c.telefono || '').trim() === crudo) return;
      c.telefono = crudo;
      tocadas++;
    });
    anotar('JUNTAR FICHAS', nombre + ': ' + lista.length + ' fichas con el teléfono ' + crudo);
    guardar(); cerrarModal(); pintar();
    avisar(nombre + ': ' + lista.length + ' fichas juntas' +
           (tocadas ? ' · ' + tocadas + ' ' + plural(tocadas,'teléfono cambiado','teléfonos cambiados') : ''),
           'bien', true);
  });
}

/* ---------- LOS PRECIOS, CON TODAS SUS VUELTAS ---------------------------
   Un precio no es un número, es una línea del tiempo. Netflix te costaba
   12, en marzo lo subiste a 15, en noviembre lo vas a subir a 18, y a
   Fernanda le sigues cobrando 10 porque es tu prima. Todo eso tiene que
   caber, y tiene que caber SIN inventar un formato nuevo: el PAPOTAS de
   siempre ya guarda las tarifas en ajustes.historialPrecios con este
   molde, así que los dos programas ven exactamente los mismos precios.

     {id, tipo:'general'|'plataforma', plataforma, precio, desde, hasta, nota}

   `hasta` en null quiere decir «y de ahí en adelante». Cuando pones un
   precio nuevo, el anterior se cierra solo el día antes. Puedes dejar
   tantos programados hacia delante como quieras.

   Y cada cliente puede además tener el suyo, con su propia línea del
   tiempo, que manda sobre la tarifa de su plataforma. */

function tarifas(){
  if(!Array.isArray(ajustes.historialPrecios)) ajustes.historialPrecios = [];
  return ajustes.historialPrecios;
}
function clavePlat(v){ return String(v||'').trim().toUpperCase(); }

/* La misma cuenta que hace tu programa de siempre, paso por paso: primero
   la tarifa de esa plataforma que cubra ese día, luego la general, luego
   el precio suelto de la plataforma y al final el precio por defecto. */
function tarifaVigente(plataforma, fecha){
  const dia  = fecha || hoyISO();
  const plat = clavePlat(plataforma);
  const lista = tarifas();
  const cubre = function(t){ return t.desde && t.desde <= dia && (!t.hasta || t.hasta >= dia); };
  const porFecha = function(a,b){ return String(b.desde).localeCompare(String(a.desde)); };

  const suya = lista.filter(function(t){
    return t.tipo === 'plataforma' && clavePlat(t.plataforma) === plat && cubre(t);
  }).sort(porFecha);
  if(suya[0] && Number(suya[0].precio) > 0) return Number(suya[0].precio);

  const gen = lista.filter(function(t){ return t.tipo === 'general' && cubre(t); }).sort(porFecha);
  if(gen[0] && Number(gen[0].precio) > 0) return Number(gen[0].precio);

  const suelto = parseFloat((ajustes.preciosPlataforma || {})[plat]);
  return suelto > 0 ? suelto : (parseFloat(ajustes.precioDefecto) || 0);
}

/* Toda la línea del tiempo de una plataforma (o la general), de la más
   antigua a la más nueva, marcando cuál rige hoy y cuáles están por venir. */
function lineaTarifas(plataforma){
  const plat = plataforma === 'GENERAL' ? 'GENERAL' : clavePlat(plataforma);
  const tipo = plataforma === 'GENERAL' ? 'general' : 'plataforma';
  const hoy = hoyISO();
  return tarifas().filter(function(t){
    return t.tipo === tipo && (tipo === 'general' || clavePlat(t.plataforma) === plat);
  }).slice().sort(function(a,b){ return String(a.desde).localeCompare(String(b.desde)); })
    .map(function(t){
      const empezo  = t.desde && t.desde <= hoy;
      const termino = t.hasta && t.hasta < hoy;
      return {t:t, cuando: !empezo ? 'futuro' : termino ? 'pasado' : 'ahora'};
    });
}

/* Poner un precio nuevo: cierra el que estaba y, si ya había otro puesto
   más adelante, se cierra a sí mismo el día antes de ese. Así se pueden
   encadenar los que hagan falta sin que se pisen. */
function ponerTarifa(tipo, plataforma, precio, desde, nota){
  const lista = tarifas();
  const plat = tipo === 'general' ? 'GENERAL' : clavePlat(plataforma);
  const mias = lista.filter(function(t){
    return t.tipo === tipo && clavePlat(t.plataforma) === plat;
  });
  /* Si ya hay una que arranca justo ese día, se le cambia el precio y ya:
     dos tarifas el mismo día no significan nada. */
  const misma = mias.filter(function(t){ return t.desde === desde; })[0];
  if(misma){
    misma.precio = precio;
    if(nota != null) misma.nota = nota;
    return misma;
  }
  const nueva = {id:nuevoId('ph'), tipo:tipo, plataforma:plat,
                 precio:precio, desde:desde, hasta:null, nota:nota || ''};
  const antes = mias.filter(function(t){ return t.desde && t.desde < desde; })
                    .sort(function(a,b){ return String(b.desde).localeCompare(String(a.desde)); })[0];
  if(antes && (!antes.hasta || antes.hasta >= desde)) antes.hasta = sumarDias(desde, -1);
  const luego = mias.filter(function(t){ return t.desde && t.desde > desde; })
                    .sort(function(a,b){ return String(a.desde).localeCompare(String(b.desde)); })[0];
  if(luego) nueva.hasta = sumarDias(luego.desde, -1);
  lista.push(nueva);
  return nueva;
}

/* Quitar una: la de antes vuelve a quedar abierta hasta donde llegaba esta,
   para que no quede un agujero de días sin precio. */
function quitarTarifa(id){
  const lista = tarifas();
  const i = lista.findIndex(function(t){ return String(t.id) === String(id); });
  if(i < 0) return false;
  const fuera = lista[i];
  const mias = lista.filter(function(t){
    return t.tipo === fuera.tipo && clavePlat(t.plataforma) === clavePlat(fuera.plataforma) &&
           String(t.id) !== String(fuera.id);
  });
  const antes = mias.filter(function(t){ return t.desde && t.desde < fuera.desde; })
                    .sort(function(a,b){ return String(b.desde).localeCompare(String(a.desde)); })[0];
  if(antes) antes.hasta = fuera.hasta || null;
  lista.splice(i, 1);
  return true;
}

/* ---------- El precio de UN cliente -------------------------------------
   `monto` es lo que le cobras hoy, y es lo que lee el programa de siempre.
   `precios` es su propia línea del tiempo, con los cambios que dejaste
   programados. El día que toca, el de mañana pasa a ser el de hoy. */
function preciosDe(c){
  return (c && Array.isArray(c.precios)) ? c.precios.filter(function(p){
    return p && p.desde && isFinite(Number(p.monto));
  }).slice().sort(function(a,b){ return String(a.desde).localeCompare(String(b.desde)); }) : [];
}
function preciosFuturos(c){
  const hoy = hoyISO();
  return preciosDe(c).filter(function(p){ return p.desde > hoy; });
}
function proximoPrecio(c){
  return preciosFuturos(c)[0] || null;
}
/* De cuánto venía: el último cambio ya cumplido. */
function precioAnterior(c){
  const hoy = hoyISO();
  const cumplidos = preciosDe(c).filter(function(p){ return p.desde <= hoy; });
  if(cumplidos.length >= 2) return cumplidos[cumplidos.length - 2];
  const h = (c && Array.isArray(c.historialPrecios)) ? c.historialPrecios : [];
  const previo = h.filter(function(x){ return isFinite(Number(x.monto)) && Number(x.monto) !== cobroDe(c); })
                  .sort(function(a,b){ return String(b.fecha).localeCompare(String(a.fecha)); })[0];
  return previo ? {desde:previo.fecha, monto:Number(previo.monto)} : null;
}
/* ¿Le cobras algo distinto de lo que dice la tarifa de su plataforma? */
function esPrecioEspecial(c){
  const t = tarifaVigente(platDe(c));
  return t > 0 && Math.abs(cobroDe(c) - t) > 0.005;
}

/* Poner un precio a un cliente, con su fecha. Hoy o más adelante: da igual,
   cabe todo y en el orden que sea. */
function ponerPrecioCliente(c, monto, desde){
  if(!Array.isArray(c.precios)) c.precios = [];
  const i = c.precios.findIndex(function(p){ return p && p.desde === desde; });
  if(i >= 0) c.precios[i].monto = monto;
  else c.precios.push({desde:desde, monto:monto});
  c.precios.sort(function(a,b){ return String(a.desde).localeCompare(String(b.desde)); });
  if(c.precios.length > 60) c.precios = c.precios.slice(-60);
  madurarUno(c);
}
/* Deja `monto` valiendo lo que toque hoy según su línea del tiempo. */
function madurarUno(c){
  const hoy = hoyISO();
  const cumplidos = preciosDe(c).filter(function(p){ return p.desde <= hoy; });
  if(!cumplidos.length) return false;
  const debe = Number(cumplidos[cumplidos.length - 1].monto);
  if(!isFinite(debe) || Number(c.monto) === debe) return false;
  c.monto = debe;
  return true;
}
/* Al abrir el programa y una vez al día: los precios que tenían fecha de
   hoy entran solos, sin que tengas que acordarte. */
let diaPreciosRevisado = '';
function madurarPrecios(){
  let cambios = 0;
  clientes.forEach(function(c){ if(madurarUno(c)) cambios++; });
  if(cambios){
    anotar('PRECIOS', cambios + ' ' + plural(cambios,'precio que estaba programado entró hoy','precios que estaban programados entraron hoy'));
    olvidarIndices();
    guardar();
  }
  return cambios;
}
function revisarPrecios(){
  const hoy = hoyISO();
  if(diaPreciosRevisado === hoy) return;
  diaPreciosRevisado = hoy;
  madurarPrecios();
}

/* ---------- Poner un precio, desde donde sea ---------------------------- */
function formTarifa(plataforma, id){
  const esGeneral = plataforma === 'GENERAL';
  const previa = id ? tarifas().filter(function(t){ return String(t.id) === String(id); })[0] : null;
  const vigente = esGeneral ? tarifaVigente('__ninguna__') : tarifaVigente(plataforma);
  abrirModal(previa ? 'Cambiar este precio'
                    : (esGeneral ? 'Precio general nuevo' : 'Precio nuevo de ' + plataforma),

        (esGeneral

            esc(dinero(vigente)) + '</b>. El precio que pongas aquí manda desde el día que le digas, y el de antes se cierra solo.') +
      '</p>' +
      '<div class="rejilla r2">' +
        campo('tf-precio','Cuánto vale',{tipo:'number', valor:previa?previa.precio:vigente, paso:'0.01'}) +
        campo('tf-desde','Desde cuándo',{tipo:'date', valor:previa?previa.desde:hoyISO(),
          ayuda:'Puedes poner una fecha de más adelante y dejarlo programado.'}) +
      '</div>' +
      campo('tf-nota','Por qué',{valor:previa?previa.nota:'', pista:'Opcional: subida de Netflix, promo…'}) +
    '</div>',
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal}]
    .concat(previa ? [{texto:'Quitar', clase:'peligro', hacer:function(){
        recordarPasoAjustes('quitar un precio');
        quitarTarifa(previa.id);
        anotar('TARIFA', 'Precio quitado de ' + (previa.plataforma||''));
        guardar(); cerrarModal(); pintar();
        avisar('Precio quitado', 'bien', true);
      }}] : [])
    .concat([{texto:'Guardar el precio', clase:'principal', hacer:function(){

       anotar('TARIFA', (esGeneral?'GENERAL':plataforma) + ': ' + dinero(precio) + ' desde el ' + fechaBonita(desde));
       olvidarIndices();
       guardar(); cerrarModal(); pintar();
       avisar(desde > hoyISO()
         ? 'Programado: ' + dinero(precio) + ' desde el ' + fechaBonita(desde)

}

/* La línea del tiempo de un cliente, dentro de su ventana de precio. */
function lineaPreciosCliente(c){
  const lista = preciosDe(c);
  if(!lista.length) return '';
  const hoy = hoyISO();

          ' title="Quitar este cambio" aria-label="Quitar este cambio">' + ICONO.x + '</button>' +
      '</div>';
    }).join('') + '</div></div>';

/* ---------- La tarjeta del precio dentro de la pantalla del cliente ----- */
function tarjetaPrecio(c){
  const ahora  = cobroDe(c);
  const tarifa = tarifaVigente(platDe(c));
  const ant    = precioAnterior(c);
  const futuros = preciosFuturos(c);
  const cuotas = (Array.isArray(c.historialPrecios) ? c.historialPrecios : [])
    .slice().sort(function(a,b){ return String(b.fecha).localeCompare(String(a.fecha)); });
  const especial = esPrecioEspecial(c);

  return '<div class="tarjeta"><div class="tarjeta-cabeza">' +
      '<span class="cabeza-icono ambar">' + ICONO.etiqueta + '</span>' +
      '<div class="crece"><h2>Su precio</h2>' +
        '<p>' + (futuros.length
                  ? futuros.length + ' ' + plural(futuros.length,'cambio programado','cambios programados') +
                    ' · el próximo, ' + esc(dinero(futuros[0].monto)) + ' el ' + esc(fechaBonita(futuros[0].desde))
                  : especial ? 'Precio especial: la tarifa de ' + esc(platDe(c) || 'su plataforma') + ' es ' + esc(dinero(tarifa))
                  : 'Le cobras la tarifa de ' + esc(platDe(c) || 'su plataforma')) + '</p></div>' +
      '<button class="btn mini" data-precio="' + esc(c.id) + '">' + ICONO.lapiz +
        '<span class="et">Cambiar el precio</span></button>' +
    '</div>' +
    '<div class="tarjeta-cuerpo">' +
      '<div class="precios-ahora">' +
        '<div class="pr"><dt>Le cobrabas</dt><dd class="cifra">' +
          (ant ? esc(dinero(ant.monto)) : '—') + '</dd>' +
          '<small>' + (ant && ant.desde ? 'hasta el ' + esc(fechaBonita(ant.desde)) : 'no le has cambiado el precio') + '</small></div>' +
        '<div class="pr viva"><dt>Le cobras</dt><dd class="cifra">' + esc(dinero(ahora)) + '</dd>' +
          '<small>' + (especial ? 'precio especial suyo' : 'la tarifa de su plataforma') + '</small></div>' +
        '<div class="pr' + (futuros.length ? ' futuro' : '') + '"><dt>Le cobrarás</dt><dd class="cifra">' +
          (futuros.length ? esc(dinero(futuros[0].monto)) : '—') + '</dd>' +
          '<small>' + (futuros.length ? 'desde el ' + esc(fechaBonita(futuros[0].desde)) : 'nada programado') + '</small></div>' +
      '</div>' +
      (futuros.length > 1
        ? '<p class="pista" style="margin:var(--e3) 0 0">Y después: ' +
            futuros.slice(1).map(function(p){
              return esc(dinero(p.monto)) + ' el ' + esc(fechaBonita(p.desde));
            }).join(' · ') + '</p>'
        : '') +
      (preciosDe(c).length
        ? '<div class="linea-precios ancha">' + preciosDe(c).map(function(p){
            const hoy = hoyISO();
            const cuando = p.desde > hoy ? 'futuro' : 'pasado';
            return '<div class="lp ' + cuando + '">' +
              '<span class="lp-fecha">' + esc(fechaBonita(p.desde)) + '</span>' +
              '<span class="lp-monto cifra">' + esc(dinero(p.monto)) + '</span>' +
            '</div>';
          }).join('') + '</div>'
        : '') +
      (cuotas.length
        ? '<div class="historial" style="margin-top:var(--e4);border-top:1px solid var(--linea)">' +
            '<div class="h" style="border:0"><span class="crece"><small>LO QUE LE HAS COBRADO DE VERDAD</small></span></div>' +
            cuotas.slice(0, 10).map(function(x){
              return '<div class="h">' +
                '<span class="crece">' + esc(fechaBonita(x.fecha)) +
                  (Number(x.meses) > 1 ? ' <small>· ' + x.meses + ' meses</small>' : '') + '</span>' +
                '<span class="cifra">' + esc(dinero(x.monto)) + '</span>' +
              '</div>';
            }).join('') +
          '</div>'
        : '') +
    '</div></div>';
}
