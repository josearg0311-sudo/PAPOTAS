/* ---------- 11. Un solo oyente para todo -------------------------------- */

document.addEventListener('click', function(ev){
  const t = ev.target.closest ? ev.target.closest('[data-abrir],[data-cobrar],[data-renovar],[data-wa],[data-editar-c],[data-borrar-c],[data-editar-m],[data-borrar-m],[data-renovar-m],[data-verclave],[data-copiar],[data-ver-cliente],[data-fhoy],[data-fcli],[data-ir-cuentas],[data-borrar-g]') : null;
  if(!t) return;
  const d = t.dataset;

  /* Abrir o cerrar el cajón de una fila, sin repintar toda la pantalla.
     El cajón es SIEMPRE el hermano de al lado del botón. Buscarlo por su
     atributo en todo el documento estaba mal: una misma cuenta puede salir
     a la vez en "Hoy" (como vencida) y en "Cuentas", y entonces se abría
     la copia de la pantalla que no se está viendo. */
  if(d.abrir){
    const llave = d.abrir;
    const cajon = (t.nextElementSibling && t.nextElementSibling.classList.contains('cajon'))
                  ? t.nextElementSibling : null;
    if(abiertos.has(llave)){
      abiertos.delete(llave);
      if(cajon){ cajon.classList.remove('abierto'); }
      t.setAttribute('aria-expanded','false');
    }else{
      abiertos.add(llave);
      if(cajon){
        const dentro = cajon.querySelector('.cajon-dentro');
        if(dentro && !dentro.innerHTML.trim()){
          if(llave.charAt(0) === 'c'){ const c = buscarCliente(llave.slice(1)); if(c) dentro.innerHTML = cajonCliente(c); }
          else { const m = buscarMaster(llave.slice(1)); if(m) dentro.innerHTML = cajonMaster(m, resumenCuenta(m)); }
        }
        cajon.classList.add('abierto');
      }
      t.setAttribute('aria-expanded','true');
    }
    return;
  }

  if(d.verclave){
    const llave = 'clave' + d.verclave;
    if(abiertos.has(llave)) abiertos.delete(llave); else abiertos.add(llave);
    const m = buscarMaster(d.verclave);
    /* El mismo criterio: se repinta el cajón donde de verdad se pulsó. */
    const dentro = t.closest('.cajon-dentro');
    if(m && dentro) dentro.innerHTML = cajonMaster(m, resumenCuenta(m));
    return;
  }
  if(d.copiar){ copiar(d.copiar, d.que || 'Texto'); return; }
  if(d.cobrar){ renovar(d.cobrar, true); return; }
  if(d.renovar){ renovar(d.renovar, false); return; }
  if(d.wa){ abrirWhatsApp(d.wa); return; }
  if(d.editarC){ formCliente(d.editarC); return; }
  if(d.editarM){ formMaster(d.editarM); return; }
  if(d.renovarM){ renovarMaster(d.renovarM); return; }

  if(d.borrarC){
    const c = buscarCliente(d.borrarC); if(!c) return;
    confirmar('Borrar cliente', '¿Seguro que quieres borrar a ' + (c.nombre||'este cliente') + '? Sus cobros ya registrados se quedan en el historial.',
      'Sí, borrar', function(){
        clientes = clientes.filter(function(x){ return String(x.id) !== String(c.id); });
        abiertos.delete('c'+c.id);
        anotar('BORRAR', 'Cliente borrado: ' + (c.nombre||''));
        guardar(); pintar(); avisar('Cliente borrado', 'bien');
      }, true);
    return;
  }
  if(d.borrarM){
    const m = buscarMaster(d.borrarM); if(!m) return;
    const cuantos = clientesDe(m.id).length;
    confirmar('Borrar cuenta master',
      '¿Borrar ' + nombreCuenta(m) + '?' + (cuantos ? ' Tiene ' + cuantos + ' ' + plural(cuantos,'cliente','clientes') + ' asignados, que se quedarán sin cuenta.' : ''),
      'Sí, borrar', function(){
        servicios = servicios.filter(function(x){ return String(x.id) !== String(m.id); });
        clientesDe(m.id).forEach(function(c){ c.cuentaMasterId = null; });
        abiertos.delete('m'+m.id);
        anotar('BORRAR MASTER', 'Cuenta borrada: ' + nombreCuenta(m));
        guardar(); pintar(); avisar('Cuenta borrada', 'bien');
      }, true);
    return;
  }
  if(d.borrarG){
    inversiones = inversiones.filter(function(x){ return String(x.id) !== String(d.borrarG); });
    anotar('BORRAR GASTO', 'Gasto eliminado');
    guardar(); pintar(); avisar('Gasto borrado', 'bien');
    return;
  }
  if(d.verCliente){
    abiertos.add('c' + d.verCliente);
    busqueda = ''; $('#buscar').value = '';
    filtroClientes = 'todos'; filtroCuenta = 'TODAS';
    ir('clientes');
    setTimeout(function(){
      const el = document.querySelector('#p-clientes [data-cid="' + CSS.escape(d.verCliente) + '"]');
      if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
    }, 80);
    return;
  }
  if(d.fhoy){ filtroHoy = d.fhoy; pintar(); return; }
  if(d.fcli){ filtroClientes = d.fcli; pintar(); return; }
  if(d.irCuentas){ ir('cuentas'); return; }
});

    guardar(); pintar(); avisar('Ajustes guardados', 'bien');
  }
  else if(id === 'btn-guardar-plantillas'){
    ajustes.plantillaCobro = val('aj-pl-cobro');
    ajustes.plantillaVencido = val('aj-pl-vencido');
    ajustes.plantillaEntrega = val('aj-pl-entrega');
    ajustes.firmaWs = val('aj-firma');
    guardar(); avisar('Mensajes guardados', 'bien');
  }
  else if(id === 'btn-exportar'){
    const r = exportarRespaldo();
    avisar('Respaldo descargado: ' + r.clientes + ' clientes y ' + r.servicios + ' cuentas', 'bien');
    pintar();
  }
  else if(id === 'btn-importar'){ $('#archivo-respaldo').click(); }
  else if(id === 'btn-guardar-nube'){
    ajustes.supabaseUrl = val('aj-sb-url').trim();
    ajustes.supabaseKey = val('aj-sb-key').trim();
    guardar(false);
    if(!Nube.hayCredenciales()){ Nube.ponEstado('local'); pintar(); avisar('Nube desconectada'); return; }
    avisar('Conectando con la nube…');
    Nube.arrancar().then(function(){ pintar(); });
  }
  else if(id === 'btn-subir'){
    avisar('Subiendo…');
    Nube.subir().then(function(){ Nube.ponEstado('sincronizado'); avisar('Todo subido a la nube', 'bien'); })
      .catch(function(e){ Nube.ponEstado('error'); avisar('No se pudo subir: ' + e.message, 'mal'); });
  }
  else if(id === 'btn-bajar'){
    confirmar('Traer lo de la nube',
      'Lo que hay en la nube reemplazará lo que tienes en este dispositivo. ¿Continuar?',
      'Sí, traer', function(){
        Nube.bajar().then(function(r){ pintar(); avisar('Traídos ' + r.aplicados + ' registros de la nube', 'bien'); })
          .catch(function(e){ avisar('No se pudo traer: ' + e.message, 'mal'); });
      });
  }
  else if(id === 'btn-gasto'){ formGasto(); }
  else if(id === 'btn-tema-2'){
    ajustes.modoClaro = !ajustes.modoClaro; aplicarTema(); guardar(); pintar();
  }
});

/* Cargar un respaldo desde el disco. */
$('#archivo-respaldo').addEventListener('change', function(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const lector = new FileReader();
  lector.onload = function(e){
    const r = leerRespaldo(String(e.target.result || ''));
    ev.target.value = '';
    if(!r.ok){ avisar(r.motivo, 'mal'); return; }
    confirmar('Cargar respaldo',
      'El archivo trae ' + r.resumen.clientes + ' clientes, ' + r.resumen.servicios + ' cuentas master, ' +
      r.resumen.ventas + ' cobros y ' + r.resumen.inversiones + ' gastos. Reemplazará lo que tienes ahora ' +
      '(se guarda una copia de lo actual por si acaso). ¿Continuar?',
      'Sí, cargar', function(){
        aplicarRespaldo(r.rec);
        aplicarTema(); pintar();
        avisar('Respaldo cargado: ' + clientes.length + ' clientes', 'bien');
      });
  };
  lector.onerror = function(){ avisar('No se pudo leer el archivo', 'mal'); };
  lector.readAsText(f);
});

/* Si el otro programa (u otra pestaña) cambia los datos, aquí se enteran. */
window.addEventListener('storage', function(ev){
  if(!ev.key || ev.key.indexOf('pap_') !== 0) return;
  cargar(); aplicarTema(); pintar();
});

/* ---------- 12. Arranque ------------------------------------------------- */

cargar();
aplicarTema();

const destinoInicial = String(location.hash || '').replace('#','');
ir(PANTALLAS[destinoInicial] ? destinoInicial : 'hoy');

window.PAPOTAS = {
  version:'2.0',
  pintar: pintar,
  datos: function(){ return {servicios, clientes, ventas, inversiones, ajustes}; },
  recargar: function(){ cargar(); aplicarTema(); pintar(); }
};

Nube.arrancar();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

})();
</script>
