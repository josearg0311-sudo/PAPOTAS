<!-- Sin tipografías de fuera, y a propósito.
     Antes se pedían a Google: eso son dos conexiones a internet cada vez
     que abres el programa, y sin cobertura la letra cambiaba a mitad de
     carga -primero una, luego otra- justo en un programa que presume de
     funcionar sin conexión. Ahora usa la letra del propio aparato: Roboto
     en Android, San Francisco en iPhone, Segoe en Windows. Las tres están
     hechas para leerse en pantalla, van instaladas de fábrica, aparecen al
     instante y no dependen de nadie. -->
<style>
/* ===========================================================================
   PAPOTAS · sistema de diseño
   Lejos del "oscuro con brillos rojos": superficies planas, una sola línea de
   1px en vez de sombras, un único acento (el rojo de la marca) reservado para
   la acción principal, y el color semántico -rojo vencido, ámbar por vencer,
   verde al día- haciendo todo el trabajo de avisar.
   =========================================================================== */

:root{
  /* ===== LA PALETA, SACADA DEL LOGOTIPO ================================
     Antes los grises eran FRÍOS -tiraban a azul- y los colores de estado
     venían de cualquier sitio. Un logo rojo encima de una interfaz azulada
     no es una marca: son dos cosas que conviven.

     Ahora todo sale del rojo de la marca (tono 347°):

       · Las superficies llevan una gota de ese rojo. Siguen siendo casi
         negras, pero TIBIAS. Al lado del logo no desentonan.
       · Los grises del texto llevan la misma gota, así que el texto no se
         ve azulado sobre un fondo cálido.
       · El semáforo se ordena alrededor del rojo, a distancias parejas y
         con la misma fuerza, para que los cuatro parezcan de la misma
         familia en vez de cuatro colores sueltos.

     Lo que NO se toca: el contraste. Los cuatro grises siguen midiendo
     7.3, 5.6 y 4.5 a 1 contra la capa más clara, que es lo que pide la
     norma, y la batería lo comprueba en cada pantalla y en los dos temas. */

  /* Superficies. Tres niveles y no más.
     Aquí hubo una pasada de rosca: al «templarlas» con el rojo de la marca
     les subí el rojo SIN bajar el azul, y un gris con el rojo y el azul
     casi iguales no sale cálido, sale rosa. Ahora el azul va por debajo de
     los otros dos -que es lo que hace que un gris sea cálido- y la
     diferencia es de dos o tres puntos, no de diez: se nota al lado del
     logo y no se nota como color. */
     Segunda pasada: estaban DEMASIADO negras. Un negro casi puro no es
     elegante en un teléfono, es un agujero: los bordes desaparecen, las
     tarjetas no se despegan del fondo y todo se lee como una sola mancha.
     Los tres niveles suben parejos a un carbón tibio, se mantiene la
     misma distancia entre ellos -para que se sigan distinguiendo- y los
     grises del texto suben con ellos para no perder ni un punto de
     contraste. */
  --fondo:#1e1c1a;
  --capa:#272522;
  --capa-alta:#312f2b;
  /* Sobre una superficie más clara, una línea al 8% se borra. Suben las
     dos lo justo para que los bordes sigan marcando igual que antes. */
  --linea:rgba(255,255,255,.10);
  --linea-fuerte:rgba(255,255,255,.19);

  /* Texto. Cuatro pesos, con la misma pizca de calor y ni una más. */
  --txt:#f5f3f0;
  --txt-2:#c3bfb9;
  --txt-3:#aba7a1;
  --txt-4:#9b9791;
  /* La tinta que se lee encima de cada color de estado: en oscuro los
     colores son claros, así que encima va tinta oscura, no blanca. */
  --velo-n:rgba(0,0,0,.42);
  --tinta-mal:#2a0808;
  --tinta-aviso:#271502;
  --tinta-bien:#04170f;
  --tinta-info:#050f22;

  /* ===== LA MARCA =======================================================
     PAPOTAS es roja y lo ha sido siempre. El semáforo también usa rojo
     para «vencido», así que los dos se separan por tono y por forma, no
     cambiando la marca: la marca es un rojo PROFUNDO y solo aparece
     rellena -el logo, la acción principal, la pestaña viva-, mientras que
     «vencido» es un rojo CLARO que siempre va con su triángulo de alerta
     y la palabra escrita. Nunca se confunde un botón con un estado. */
  --marca:#e11d48;
  --marca-alta:#f43f5e;
  --marca-canto:#7f1128;     /* el canto del logo, que baja a los botones */
  /* La pegatina, en dos piezas. Con estas dos el programa entero se viste
     igual que el logotipo, y solo hace falta cambiarlas aquí. */
  --contorno:rgba(0,0,0,.62);   /* la línea que recorta la pieza del fondo */
  --canto:rgba(0,0,0,.30);      /* la sombra bajo la cara, que le da cuerpo */
  --marca-suave:rgba(225,29,72,.13);
  --marca-linea:rgba(225,29,72,.33);

  /* ===== EL SEMÁFORO, EN FAMILIA =======================================
     Los cuatro a la misma fuerza y repartidos alrededor del rojo de la
     marca, no cogidos de donde fuera. «Vencido» comparte tono con la marca
     pero mucho más claro -por eso no se confunden-; «por vencer» es el
     ámbar cálido que queda justo al lado; «al día» y «para saber» se van
     al otro extremo, que es donde no estorban. */
  /* «Vencido» era un rosa, no un rojo: tenía tanto azul como verde por
     debajo del rojo, y eso lo empujaba al rosa. Ahora el verde y el azul
     van iguales, que es lo que hace que un rojo se vea rojo. */
  --mal:#f87171;      --mal-fondo:rgba(248,113,113,.13);  --mal-linea:rgba(248,113,113,.30);
  --aviso:#f9a53c;    --aviso-fondo:rgba(249,165,60,.12); --aviso-linea:rgba(249,165,60,.28);
  --bien:#3fd6a4;     --bien-fondo:rgba(63,214,164,.12);  --bien-linea:rgba(63,214,164,.28);
  --info:#7aa2f7;     --info-fondo:rgba(122,162,247,.12); --info-linea:rgba(122,162,247,.28);

  --r-s:8px; --r:11px; --r-l:16px; --r-xl:22px;
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px; --e7:44px;
  --rail:88px;

  /* Profundidad. Hasta ahora todo era plano con una línea de 1px, y por eso
     nada destacaba sobre nada: las tarjetas, las filas y los títulos pesaban
     igual. Tres niveles de relieve y un brillo arriba dan volumen sin
     ensuciar. */
  --brillo:inset 0 1px 0 rgba(255,255,255,.045);
  --sombra-1:0 1px 2px rgba(0,0,0,.28);
  --sombra-2:0 4px 14px -6px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3);
  --sombra-3:0 18px 44px -22px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.28);
  --velo:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,0) 62%);
  --curva:cubic-bezier(.32,.72,0,1);
  --rapido:140ms; --medio:220ms;
  /* La letra del aparato, en el orden en que conviene pedirla. */
  --fuente:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,
           'Helvetica Neue',Arial,sans-serif;
  /* Para el dinero y las fechas: de ancho fijo, para que las cifras queden
     en columna y se puedan comparar de un vistazo. */
  --cifra:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,
          'Liberation Mono','Courier New',monospace;
}

/* ===== EL TONO DEL OSCURO, A TU GUSTO ==================================
   Un negro casi puro no le sienta igual a todo el mundo ni a toda
   pantalla: en un OLED a oscuras se ve elegante y en un celular a pleno
   sol se ve como un agujero sin bordes. En vez de acertar por él, se
   eligen tres tonos y dos niveles de contraste desde Ajustes.

   Cada tono trae SUS grises, no los del vecino: al subir la superficie,
   un gris que antes medía 4.6 contra ella se queda en 3.9 y deja de
   leerse. Los de aquí están calculados uno a uno para que los tres tonos
   midan lo mismo -7.4, 5.7 y 4.6 contra la capa más clara-, que es lo que
   pide la norma y lo que comprueba la batería de contraste en cada
   pantalla. El tono más claro además aclara «vencido» y «para saber»,
   porque sobre una superficie más clara esos dos se quedaban cortos. */
html[data-tema="oscuro"][data-fondo="negro"]{
  --fondo:#0c0b0a; --capa:#171614; --capa-alta:#21201d;
  --linea:rgba(255,255,255,.085); --linea-fuerte:rgba(255,255,255,.16);
  --txt-2:#b2aea8; --txt-3:#9c9892; --txt-4:#8c8882;
}
html[data-tema="oscuro"][data-fondo="negro"][data-realce="alto"]{
  --linea:rgba(255,255,255,.17); --linea-fuerte:rgba(255,255,255,.30);
  --txt-2:#d3cfc9; --txt-3:#b9b5af; --txt-4:#a7a39d;
}
/* «carbón» es el de casa y sus valores ya viven en :root, pero se repiten
   aquí a propósito: así los tres tonos se leen juntos y se comparan de un
   vistazo, en vez de tener uno escondido doscientas líneas más arriba. */
html[data-tema="oscuro"][data-fondo="carbon"]{
  --fondo:#1e1c1a; --capa:#272522; --capa-alta:#312f2b;
  --linea:rgba(255,255,255,.10); --linea-fuerte:rgba(255,255,255,.19);
  --txt-2:#c3bfb9; --txt-3:#aba7a1; --txt-4:#9b9791;
}
html[data-tema="oscuro"][data-fondo="carbon"][data-realce="alto"]{
  --linea:rgba(255,255,255,.19); --linea-fuerte:rgba(255,255,255,.33);
  --txt-2:#e8e4de; --txt-3:#ccc8c2; --txt-4:#b8b4ae;
}
html[data-tema="oscuro"][data-fondo="pizarra"]{
  --fondo:#2a2724; --capa:#343029; --capa-alta:#3e3a33;
  --linea:rgba(255,255,255,.13); --linea-fuerte:rgba(255,255,255,.23);
  --txt-2:#d5d1cb; --txt-3:#c6c2bc; --txt-4:#a9a59f;
  --mal:#ff9a9a;   --mal-fondo:rgba(255,154,154,.13);  --mal-linea:rgba(255,154,154,.30);
  --info:#a8c2ff;  --info-fondo:rgba(168,194,255,.13); --info-linea:rgba(168,194,255,.30);
}
html[data-tema="oscuro"][data-fondo="pizarra"][data-realce="alto"]{
  --linea:rgba(255,255,255,.22); --linea-fuerte:rgba(255,255,255,.36);
  --txt-2:#f9f5ef; --txt-3:#dcd8d2; --txt-4:#c8c4be;
}
/* En claro el contraste alto oscurece la tinta y marca más los bordes. */
html[data-tema="claro"][data-realce="alto"]{
  --linea:rgba(30,24,18,.18); --linea-fuerte:rgba(30,24,18,.30);
  --txt-2:#3a3630; --txt-3:#423e37; --txt-4:#4a453e;
}

html[data-tema="claro"]{
  --brillo:inset 0 1px 0 rgba(255,255,255,.9);
  --sombra-1:0 1px 2px rgba(15,23,42,.06);
  --sombra-2:0 4px 14px -6px rgba(15,23,42,.14), 0 1px 3px rgba(15,23,42,.06);
  --sombra-3:0 18px 44px -22px rgba(15,23,42,.24), 0 2px 8px rgba(15,23,42,.08);
  --velo:linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0) 62%);
  /* El claro sigue la misma regla: las superficies y los grises llevan la
     gota de rojo de la marca, así que el programa es el mismo de día y de
     noche, no dos programas distintos. */
  --fondo:#f6f4f2;
  --capa:#ffffff;
  --capa-alta:#f5f3f0;
  --linea:rgba(30,24,18,.09);
  --linea-fuerte:rgba(30,24,18,.16);
  --txt:#17140f;
  --txt-2:#55514a;
  --txt-3:#615c55;
  --txt-4:#6a655e;
  /* En claro los colores de estado son oscuros: encima va blanco. */
  --velo-n:rgba(0,0,0,.78);
  --tinta-mal:#ffffff;
  --tinta-aviso:#ffffff;
  --tinta-bien:#ffffff;
  --tinta-info:#ffffff;
  --marca-canto:#9f1239;
  --contorno:rgba(0,0,0,.42);
  --canto:rgba(0,0,0,.18);
  --marca-suave:rgba(225,29,72,.08);
  --marca-linea:rgba(225,29,72,.24);
  /* En claro el semáforo va oscuro, pero con los mismos tonos de la
     familia: «vencido» comparte tono con la marca, «por vencer» es el
     ámbar de al lado, y los otros dos se van al extremo opuesto. */
  --mal:#b91c1c;   --mal-fondo:rgba(185,28,28,.08);   --mal-linea:rgba(185,28,28,.22);
  --aviso:#a9560b; --aviso-fondo:rgba(169,86,11,.09); --aviso-linea:rgba(169,86,11,.22);
  --bien:#05755a;  --bien-fondo:rgba(5,117,90,.09);   --bien-linea:rgba(5,117,90,.22);
  --info:#3450c7;  --info-fondo:rgba(52,80,199,.08);  --info-linea:rgba(52,80,199,.22);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--txt);
  font-family:var(--fuente); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
::selection{background:var(--marca-suave);color:var(--txt)}
.cifra{font-family:var(--cifra);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  font-feature-settings:"zero" 0}
.oculto{display:none!important}
.solo-lectores{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}

/* barras de desplazamiento discretas ------------------------------------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--linea-fuerte);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--txt-4);background-clip:content-box}

/* ===== ARMAZÓN ========================================================== */
#app{display:flex;height:100dvh;overflow:hidden}

/* --- Carril lateral (escritorio): iconos, no una pared de texto --------- */
#carril{
  width:var(--rail); flex:0 0 var(--rail);
  background:var(--capa); border-right:1px solid var(--linea);
  display:flex; flex-direction:column; align-items:center;
  padding:var(--e5) 0 var(--e4); gap:2px; z-index:20;
  box-shadow:1px 0 0 rgba(0,0,0,.2);
}
/* La marca: la P de PAPOTAS con el hueco del ojo en forma de play. Va
   dibujada, no escrita, así que se ve igual de limpia a 46 px que a 512
   y es exactamente el mismo dibujo que queda de icono al instalarlo. */
#marca{
  width:46px;height:46px;border-radius:14px;
  margin-bottom:var(--e5); flex:0 0 auto; overflow:hidden;
  box-shadow:0 10px 26px -10px rgba(225,29,72,.75),
             0 2px 10px -2px rgba(225,29,72,.35), var(--brillo);
}
#marca svg{display:block;width:100%;height:100%}
/* En pantalla ancha manda el carril, así que aquí no hace falta. */
#marca-cabecera{
  display:none;width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  overflow:hidden;margin-right:2px;
  box-shadow:0 6px 16px -8px rgba(225,29,72,.7), var(--brillo);
}
#marca-cabecera svg{display:block;width:100%;height:100%}
.nav-btn{
  width:68px;padding:11px 0 9px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--txt-3); position:relative;
  transition:color var(--rapido) var(--curva),background var(--rapido) var(--curva);
}
.nav-btn svg{width:23px;height:23px;stroke-width:1.7}
.nav-btn span{font-size:10.5px;font-weight:650;letter-spacing:-.005em}
.nav-btn:hover{color:var(--txt);background:var(--capa-alta)}
.nav-btn[aria-current="page"]{
  color:var(--txt);
  background:linear-gradient(180deg, var(--capa-alta), rgba(255,255,255,.02));
  box-shadow:var(--brillo), var(--sombra-1);
}
/* La pestaña viva lleva el rojo de la marca, con su resplandor. Aquí no
   hay texto encima, así que puede lucirse sin pelearse con el contraste:
   donde hay que leer algo mandan los grises, no la marca. */
.nav-btn[aria-current="page"]::before{
  content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);
  width:4px;height:26px;border-radius:0 4px 4px 0;
  background:var(--marca);
  box-shadow:0 0 14px 1px rgba(225,29,72,.6), 0 0 24px 3px rgba(225,29,72,.3);
}
.nav-punto{
  position:absolute;top:6px;right:10px;min-width:16px;height:16px;padding:0 4px;
  border-radius:99px;background:var(--mal);color:var(--tinta-mal);
  font-size:9px;font-weight:700;line-height:16px;text-align:center;
}
#carril-pie{margin-top:auto;display:flex;flex-direction:column;gap:var(--e1);align-items:center}
#btn-viejo-movil{ display:none; width:38px; padding:0 }
@media (max-width:860px){ #btn-viejo-movil{ display:inline-flex; order:2 } }
#sello-carril{
  font-size:9px;font-weight:700;color:var(--txt-4);letter-spacing:.02em;
  padding:3px 6px;border-radius:6px;border:1px solid var(--linea);
}
.carril-mini{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--txt-3);transition:color var(--rapido),background var(--rapido);
}
.carril-mini:hover{color:var(--txt);background:var(--capa-alta)}
.carril-mini svg{width:17px;height:17px;stroke-width:1.75}

/* --- Zona principal ----------------------------------------------------- */
#principal{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

#cabecera{
  flex:0 0 auto;
  background:linear-gradient(180deg, var(--capa) 0%, var(--fondo) 100%);
  border-bottom:1px solid var(--linea);
  padding:var(--e5) var(--e6) var(--e4);
  display:flex;align-items:center;gap:var(--e4);
  position:relative;
}
/* Un filo de color bajo la cabecera: firma la pantalla sin gritar. */
#cabecera::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg, var(--marca) 0, transparent 38%);
  opacity:.5;
}
#titulo{
  font-size:29px;font-weight:700;letter-spacing:-.04em;margin:0;line-height:1.05;
}
#subtitulo{
  font-size:12.5px;color:var(--txt-3);font-weight:550;margin:5px 0 0;
  letter-spacing:.005em;
}
#cabecera .crece{flex:1;min-width:0}

#lienzo{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--e6)}
@media (min-width:1500px){ #lienzo{padding:var(--e7) var(--e6)} }
.pagina{max-width:1320px;margin:0 auto;display:none}
.pagina.viva{display:block;animation:entra var(--medio) var(--curva)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .pagina.viva{animation:none}
  *{transition-duration:1ms!important}
}

/* --- Barra inferior (celular) ------------------------------------------- */
#barra{
  display:none; flex:0 0 auto;
  background:var(--capa); border-top:1px solid var(--linea);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:30;
}
#barra .nav-btn{flex:1;width:auto;min-height:50px}
/* En el carril el acento es una barrita a la izquierda; abajo, en el
   teléfono, tiene que cruzar por arriba del botón o se ve como un borrón
   rojo colgando entre dos iconos. */
#barra .nav-btn[aria-current="page"]::before{
  left:50%;top:0;bottom:auto;transform:translateX(-50%);
  width:24px;height:3px;border-radius:0 0 3px 3px;
}

/* ===== PIEZAS =========================================================== */

/* Botones ---------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;padding:0 14px;border-radius:var(--r);
  border:1px solid var(--linea-fuerte); background:var(--capa);
  font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--txt);
  white-space:nowrap;text-decoration:none;
  transition:background var(--rapido) var(--curva),border-color var(--rapido) var(--curva),transform var(--rapido) var(--curva);
}
.btn svg{width:16px;height:16px;stroke-width:2;flex:0 0 auto}
.btn:hover{background:var(--capa-alta);border-color:var(--txt-4)}
.btn:active{transform:scale(.975)}
/* ===== EL CANTO ========================================================
   La regla que baja del logotipo. La P de PAPOTAS tiene una cara delante y
   un canto detrás; aquí pasa lo mismo: la acción principal lleva su canto
   abajo, así que se ve que es una pieza con cuerpo y no un rectángulo
   pintado. Al pulsarla, el canto se hunde y el botón baja: se nota en el
   dedo que algo pasó.

   Y es una regla, no un adorno: SOLO lo que se pulsa lleva canto. Lo que
   no se pulsa es plano. Si un día ves canto en algo que no hace nada, está
   mal puesto. */
.btn.principal{
  background:var(--marca);border-color:var(--marca);color:#fff;
  box-shadow:0 0 0 1.5px var(--contorno),
             inset 0 -3px 0 0 var(--marca-canto), var(--sombra-1);
  transition:background var(--rapido) var(--curva),
             box-shadow var(--rapido) var(--curva),
             transform var(--rapido) var(--curva);
}
.btn.principal:hover{background:var(--marca-alta);border-color:var(--marca-alta)}
.btn.principal:active{
  transform:translateY(1px);
  box-shadow:0 0 0 1.5px var(--contorno), inset 0 -1px 0 0 var(--marca-canto);
}
@media (prefers-reduced-motion: reduce){
  .btn.principal:active{transform:none}
}
.btn.fantasma{background:transparent;border-color:transparent;color:var(--txt-2)}
.btn.fantasma:hover{background:var(--capa-alta);color:var(--txt)}
.btn.mini{min-height:30px;padding:0 10px;font-size:12px;border-radius:var(--r-s)}
.btn.mini svg{width:14px;height:14px}
.btn.icono{width:38px;padding:0}
.btn.icono.mini{width:30px}
.btn.peligro{color:var(--mal);border-color:var(--mal-linea)}
.btn.peligro:hover{background:var(--mal-fondo)}
.btn.bien{color:var(--bien);border-color:var(--bien-linea)}
.btn.bien:hover{background:var(--bien-fondo)}
.btn:disabled{opacity:.45;pointer-events:none}

/* Campos ----------------------------------------------------------------- */
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo > label{font-size:11px;font-weight:600;color:var(--txt-3);letter-spacing:.01em}
.campo .pista{font-size:11px;color:var(--txt-4);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],
input[type=password],input[type=url],select,textarea{
  width:100%;min-height:38px;padding:8px 11px;
  background:var(--capa);border:1px solid var(--linea-fuerte);border-radius:var(--r);
  color:var(--txt);font-size:13.5px;font-weight:500;
  transition:border-color var(--rapido),background var(--rapido);
}
textarea{min-height:80px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--info);background:var(--capa-alta)}
input::placeholder,textarea::placeholder{color:var(--txt-4);font-weight:400}
select{appearance:none;padding-right:30px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23737b87' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center}
input[type=checkbox]{width:17px;height:17px;min-height:0;accent-color:var(--marca);cursor:pointer}
.campo-numero{font-family:var(--cifra);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Buscador de la cabecera ------------------------------------------------ */
.buscador{position:relative;flex:0 1 320px;min-width:0}
.buscador svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke-width:2;color:var(--txt-4);pointer-events:none}
.buscador input{padding-left:33px}

/* Tarjeta ---------------------------------------------------------------- */
.tarjeta{
  background:var(--capa);border:1px solid var(--linea);border-radius:var(--r-l);
  /* clip y no hidden: hidden convierte la tarjeta en su propio contenedor de
     scroll y los separadores pegajosos se quedan pegados fuera de la vista. */
  overflow:clip;position:relative;
  box-shadow:var(--brillo), var(--sombra-2);
}
/* Un velo claro arriba: da volumen sin cambiar el color de la tarjeta. */
.tarjeta::before{
  content:"";position:absolute;inset:0 0 auto;height:96px;
  background:var(--velo);pointer-events:none;
}
.tarjeta > *{position:relative}
.tarjeta-cabeza{
  display:flex;align-items:center;gap:var(--e3);
  padding:var(--e5) var(--e5) var(--e4);
}
/* Un azulejo con el icono a la izquierda del título. Es lo que hace que una
   tarjeta se reconozca de un vistazo sin leerla, igual que el logo hace
   reconocible una plataforma. */
.cabeza-icono{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  display:grid;place-items:center;
  color:var(--tinte, var(--marca));
  background:linear-gradient(150deg, var(--tinte-suave, var(--marca-suave)), transparent 85%),
             var(--capa-alta);
  border:1px solid var(--tinte-linea, var(--marca-linea));
  box-shadow:var(--brillo);
}
.cabeza-icono svg{width:19px;height:19px;stroke-width:1.9}
.cabeza-icono.rosa  {--tinte:var(--marca);--tinte-suave:var(--marca-suave);--tinte-linea:var(--marca-linea)}
.cabeza-icono.verde {--tinte:var(--bien); --tinte-suave:rgba(16,185,129,.16); --tinte-linea:rgba(16,185,129,.34)}
.cabeza-icono.ambar {--tinte:var(--aviso);--tinte-suave:rgba(245,158,11,.16); --tinte-linea:rgba(245,158,11,.34)}
.cabeza-icono.azul  {--tinte:var(--info); --tinte-suave:rgba(56,132,255,.16); --tinte-linea:rgba(56,132,255,.34)}
.cabeza-icono.rojo  {--tinte:var(--mal);  --tinte-suave:rgba(244,63,94,.16);  --tinte-linea:rgba(244,63,94,.34)}
.cabeza-icono.gris  {--tinte:var(--txt-3);--tinte-suave:rgba(148,163,184,.14);--tinte-linea:var(--linea-fuerte)}
@media (max-width:640px){
  .cabeza-icono{width:32px;height:32px;border-radius:9px}
  .cabeza-icono svg{width:17px;height:17px}
}
.tarjeta-cabeza h2{
  font-size:17px;font-weight:700;letter-spacing:-.028em;margin:0;line-height:1.15;
  /* Que un título largo parta línea en vez de estirar la tarjeta fuera de
     la pantalla: "Calendario de cobros" no cabe entero en 320px. */
  min-width:0;overflow-wrap:anywhere;
}
.tarjeta-cabeza > .crece{min-width:0}
.tarjeta-cabeza p{overflow-wrap:anywhere}
.tarjeta-cabeza p{font-size:12.5px;color:var(--txt-3);margin:3px 0 0;font-weight:500}
.tarjeta-cuerpo{padding:0 var(--e5) var(--e5)}
.tarjeta-cuerpo.pegado{padding:0}

/* Rejillas --------------------------------------------------------------- */
.rejilla{display:grid;gap:var(--e4)}
@media (min-width:1280px){ .rejilla{gap:var(--e5)} }
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* Cinco huecos: la cifra que manda ocupa dos y las otras tres uno cada una. */
.r5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){ .r5{grid-template-columns:repeat(3,minmax(0,1fr))} .r5 .metrica.mayor{grid-column:1 / -1} }
/* En el teléfono las tres cifras pequeñas no entran como tarjetas sin dejar
   un hueco suelto al final. Se leen mejor como un renglón cada una:
   nombre a la izquierda, cifra a la derecha. */
@media (max-width:640px){
  .r5{grid-template-columns:minmax(0,1fr);gap:var(--e2)}
  .r5 > .metrica:not(.mayor){
    flex-direction:row;align-items:baseline;gap:10px;
    padding:11px var(--e4);
  }
  .r5 > .metrica:not(.mayor)::before{display:none}
  .r5 > .metrica:not(.mayor) .k{flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .r5 > .metrica:not(.mayor) .v{font-size:19px;flex:0 0 auto}
  .r5 > .metrica:not(.mayor) .n{font-size:11px;flex:0 0 auto;
    max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r5 > .metrica.mayor{margin-bottom:var(--e2)}
}
.pila{display:flex;flex-direction:column;gap:var(--e5)}
@media (min-width:1280px){ .pila{gap:var(--e6)} }
.fila{display:flex;align-items:center;gap:var(--e2);flex-wrap:wrap}
.crece{flex:1;min-width:0}

/* Cifras grandes --------------------------------------------------------- */
.metrica{
  background:var(--capa);border:1px solid var(--linea);border-radius:var(--r-l);
  padding:var(--e5);display:flex;flex-direction:column;gap:4px;min-width:0;
  position:relative;overflow:hidden;
  box-shadow:var(--brillo), var(--sombra-1);
  transition:border-color var(--rapido) var(--curva), transform var(--rapido) var(--curva),
             box-shadow var(--rapido) var(--curva);
}
.metrica::before{
  content:"";position:absolute;inset:0 0 auto;height:70px;
  background:var(--velo);pointer-events:none;
}
.metrica > *{position:relative}
.metrica:hover{border-color:var(--linea-fuerte);box-shadow:var(--brillo), var(--sombra-2)}
.metrica .k{
  font-size:10.5px;font-weight:700;color:var(--txt-3);
  letter-spacing:.09em;text-transform:uppercase;
}
.metrica .v{font-size:30px;font-weight:700;letter-spacing:-.045em;line-height:1.08}
.metrica .n{font-size:12px;color:var(--txt-4);font-weight:500}

/* La métrica que manda: ocupa el doble y lleva el acento. Sin un punto
   focal, cuatro cajas iguales no dicen cuál importa. */
.metrica.mayor{
  grid-column:span 2;
  background:linear-gradient(135deg, var(--capa-alta), var(--capa) 62%);
  border-color:var(--linea-fuerte);
  box-shadow:var(--brillo), var(--sombra-2);
}
.metrica.mayor::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg, var(--marca-alta), var(--marca));
}
.metrica.mayor .v{font-size:44px;letter-spacing:-.05em}
.metrica.mayor .k{color:var(--txt-2)}
@media (max-width:860px){
  .metrica{padding:var(--e4)}
  .metrica .v{font-size:23px}
  .metrica.mayor{grid-column:1 / -1}
  .metrica.mayor .v{font-size:36px}
}
.metrica.mal .v{color:var(--mal)}
.metrica.aviso .v{color:var(--aviso)}
.metrica.bien .v{color:var(--bien)}
.metrica.info .v{color:var(--info)}
button.metrica{text-align:left;cursor:pointer}
button.metrica:hover{background:var(--capa-alta)}

/* Insignias -------------------------------------------------------------- */
.insignia{
  display:inline-flex;align-items:center;gap:5px;
  height:21px;padding:0 8px;border-radius:6px;
  border:1px solid var(--linea);background:var(--capa-alta);
  font-size:11px;font-weight:600;color:var(--txt-2);white-space:nowrap;
  letter-spacing:-.005em;
}
.insignia.mal{color:var(--mal);background:var(--mal-fondo);border-color:var(--mal-linea)}
.insignia.aviso{color:var(--aviso);background:var(--aviso-fondo);border-color:var(--aviso-linea)}
.insignia.bien{color:var(--bien);background:var(--bien-fondo);border-color:var(--bien-linea)}
.insignia.info{color:var(--info);background:var(--info-fondo);border-color:var(--info-linea)}
.punto{width:6px;height:6px;border-radius:99px;background:currentColor;flex:0 0 auto}

/* Segmentos (filtros) ---------------------------------------------------- */
.segmentos{
  display:flex;gap:2px;padding:3px;background:var(--capa);
  border:1px solid var(--linea);border-radius:var(--r);
  overflow-x:auto;scrollbar-width:none;
}
.segmentos::-webkit-scrollbar{display:none}
.segmentos button{
  flex:0 0 auto;min-height:30px;padding:0 12px;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--txt-3);white-space:nowrap;
  transition:color var(--rapido),background var(--rapido);
  display:inline-flex;align-items:center;gap:6px;
}
.segmentos button:hover{color:var(--txt)}
.segmentos button[aria-selected="true"]{color:var(--txt);background:var(--capa-alta)}
.segmentos .cuenta{
  font-size:10.5px;font-weight:700;padding:0 5px;height:16px;line-height:16px;
  border-radius:5px;background:var(--linea);color:var(--txt-3);
}
.segmentos button[aria-selected="true"] .cuenta{background:var(--marca);color:#fff}

/* Lista de filas --------------------------------------------------------- */
.lista{display:flex;flex-direction:column}
.lista > * + *{border-top:1px solid var(--linea)}

.f{
  display:flex;align-items:center;gap:var(--e3);
  padding:11px var(--e4);position:relative;width:100%;text-align:left;
  transition:background var(--rapido) var(--curva);
}
.f::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.f.mal::before{background:var(--mal)}
.f.aviso::before{background:var(--aviso)}
.f.bien::before{background:var(--bien)}
.f:hover{background:var(--capa-alta)}
/* El azulejo de cada plataforma es una pegatina pequeña: lleva su contorno
   y su canto, igual que la P. Por eso los logos se ven pegados encima y no
   dibujados dentro. */
.f-marca{
  width:32px;height:32px;border-radius:9px;flex:0 0 auto;
  display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;
  letter-spacing:-.03em;position:relative;overflow:hidden;
  box-shadow:0 0 0 1.5px var(--contorno), inset 0 -2px 0 0 var(--canto);
}
/* El logo tapa la inicial SOLO cuando de verdad ha cargado.
   El fondo blanco estaba puesto en la propia imagen, así que una imagen a
   medio cargar -o que nunca llegará, sin internet- pintaba un cuadro blanco
   encima de la inicial. Ahora nace invisible y solo se enciende al cargar;
   si falla, se borra sola. En los dos casos se ve la inicial. */
.f-marca img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;border-radius:inherit;
  opacity:0;background:transparent;
  transition:opacity var(--rapido) var(--curva);
}
.f-marca img.cargado{ opacity:1;background:#fff }
/* La fila y sus acciones comparten franja: el botón grande abre la ficha y
   a la derecha quedan cobrar y escribir, siempre a la vista. */
.f-envoltura{display:flex;align-items:stretch;position:relative}
.f-envoltura > .f{flex:1;min-width:0}
.f-acciones{
  display:flex;align-items:center;gap:6px;
  padding:0 var(--e4) 0 0;flex:0 0 auto;
}
.f-envoltura:hover{background:var(--capa-alta)}
.f-envoltura:hover > .f{background:transparent}
.f-sin-tel{
  display:grid;place-items:center;width:34px;height:34px;
  color:var(--txt-4);opacity:.3;
}
.f-sin-tel svg{width:17px;height:17px}
@media (max-width:640px){
  .f-acciones{padding-right:var(--e3);gap:4px}
  .f-sin-tel{display:none}
}
/* En pantalla estrecha el importe y el vencimiento no caben a la derecha
   del nombre: entre el logo, los dos botones y la pastilla, al nombre no le
   quedaba ni un píxel y desaparecía. Se bajan a su propio renglón. */
/* Solo las filas de cliente, que son las que llevan botones al lado: las de
   cobros y gastos no tienen ese problema y con esta regla se les salía el
   importe fuera de la pantalla. */
@media (max-width:480px){
  .f-envoltura > .f{flex-wrap:wrap;row-gap:4px}
  /* base 0, no auto: con "auto" el nombre largo empujaba al logo a su
     propio renglón y la fila se partía en tres. */
  .f-envoltura > .f > .f-txt{flex:1 1 0;min-width:0}
  .f-envoltura > .f > .f-der{
    order:3;flex:1 1 100%;box-sizing:border-box;
    flex-direction:row;align-items:center;justify-content:flex-start;
    gap:8px;padding-left:50px;
  }
  .f-envoltura .f-monto{font-size:13px;white-space:nowrap}
}

/* El chip de la cuenta, con el color de su plataforma, y el del perfil. */
.chip-cuenta{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);
  display:inline-block;max-width:100%;
  padding:1px 7px;border-radius:7px;
  border:1px solid var(--tono-linea);
  background:var(--tono-suave, transparent);
  font-size:11px;font-weight:700;letter-spacing:-.005em;color:var(--txt-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
.chip-perfil{
  display:inline-block;margin-left:6px;
  font-size:11.5px;font-weight:600;color:var(--txt-3);vertical-align:middle;
}
.chip-perfil.sin{color:var(--aviso)}

/* La pastilla del vencimiento: un estado se lee mejor con forma que sin
   ella, sobre todo cuando hay ochenta seguidos. */
.pastilla{
  display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:10.5px;font-weight:700;letter-spacing:-.005em;white-space:nowrap;
  border:1px solid var(--linea-fuerte);color:var(--txt-3);
}
.pastilla.mal{color:var(--mal)} .pastilla.aviso{color:var(--aviso)} .pastilla.bien{color:var(--bien)}
/* Antes la pastilla iba sin caja dentro de las tarjetas para no hacer ruido.
   Pero entonces vencido y por vencer se parecían demasiado: el estado es lo
   primero que hay que ver, así que la caja vuelve, con su icono. */
.ficha-cabeza .pastilla{
  border:1px solid var(--linea-fuerte);padding:2px 8px;border-radius:99px;
}
.ficha-cabeza .pastilla.mal  {border-color:rgba(244,63,94,.4); background:rgba(244,63,94,.12)}
.ficha-cabeza .pastilla.aviso{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.12)}
.ficha-cabeza .pastilla.bien {border-color:rgba(16,185,129,.34);background:rgba(16,185,129,.1)}

.f-txt{flex:1;min-width:0}
.f-txt{display:flex;flex-direction:column}
.f-nom{display:block;font-size:14px;font-weight:650;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* El perfil, dentro del subtítulo, se separa para que se distinga de la
   cuenta de un vistazo. */
.f-perfil{
  font-style:normal;color:var(--txt-4);
}
.f-perfil::before{ content:"·";margin:0 5px;color:var(--txt-4) }
.f-perfil.sin{ color:var(--aviso) }
/* El cuerpo de una respuesta guardada: se ve entero, con sus saltos de
   línea, porque lo que importa es poder releerlo antes de mandarlo. */
.f-texto-largo{
  display:block;margin-top:5px;padding:9px 11px;
  background:var(--capa-alta);border:1px solid var(--linea);border-radius:10px;
  font-size:12px;line-height:1.55;color:var(--txt-2);
  white-space:pre-wrap;word-break:break-word;
}
.f-sub{display:block;font-size:11.5px;color:var(--txt-3);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.f-der{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
.f-monto{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.f-cuando{display:block;font-size:11px;font-weight:600;color:var(--txt-3)}
.f-cuando.mal{color:var(--mal)} .f-cuando.aviso{color:var(--aviso)} .f-cuando.bien{color:var(--bien)}
.f-flecha{color:var(--txt-4);flex:0 0 auto;transition:transform var(--medio) var(--curva)}
.f-flecha svg{width:16px;height:16px;stroke-width:2}
.f[aria-expanded="true"] .f-flecha,
.f-envoltura:has(.f[aria-expanded="true"]) .f-flecha{transform:rotate(90deg)}
.f-acciones .f-flecha{display:grid;place-items:center;width:16px}
.f[aria-expanded="true"]{background:var(--capa-alta)}

/* Panel que se abre dentro de la fila (lo "dinámico") -------------------- */
.cajon{
  overflow:hidden;background:var(--capa-alta);
  border-top:1px solid var(--linea);
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows var(--medio) var(--curva);
}
.cajon.abierto{grid-template-rows:1fr}
.cajon > div{min-height:0;overflow:hidden}
.cajon-dentro{padding:var(--e4);display:flex;flex-direction:column;gap:var(--e3)}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px, 100%), 1fr));gap:var(--e2) var(--e4)}
.dato{display:flex;flex-direction:column;gap:1px;min-width:0}
.dato dt{font-size:10.5px;font-weight:600;color:var(--txt-4);text-transform:uppercase;letter-spacing:.03em}
.dato dd{margin:0;font-size:13px;font-weight:600;word-break:break-word}

/* Barra de ocupación ----------------------------------------------------- */
.barra{height:5px;border-radius:99px;background:var(--linea);overflow:hidden;display:flex}
.barra i{display:block;height:100%;background:var(--info);transition:width var(--medio) var(--curva)}
.barra.llena i{background:var(--mal)}
.barra.casi i{background:var(--aviso)}

/* Casillas de perfil: una casilla por perfil, llenas las que están usadas.
   Una raya continua debajo del correo parecía un subrayado roto; así se
   cuentan los sitios de un vistazo, que es lo que de verdad se mira. */
.casillas{display:flex;gap:3px;margin-top:7px;align-items:center}
.casillas i{
  display:block;width:13px;height:5px;border-radius:2px;
  background:var(--linea-fuerte);flex:0 0 auto;
}
.casillas i.usado{background:var(--info)}
.casillas.llena i.usado{background:var(--mal)}
.casillas.casi i.usado{background:var(--aviso)}
.casillas.llena i:not(.usado), .casillas.casi i:not(.usado){background:var(--linea-fuerte)}
.casillas small{font-size:10.5px;font-weight:700;color:var(--txt-4);margin-left:4px;white-space:nowrap}

/* El mando del mes -------------------------------------------------------- */
.mes-mando{
  display:flex;align-items:center;gap:var(--e2);flex-wrap:wrap;
  padding:9px var(--e3);border-radius:var(--r-l);
  border:1px solid var(--linea);background:var(--capa);
  box-shadow:var(--brillo), var(--sombra-1);
}
.mes-mando > select{
  flex:0 1 210px;min-width:0;font-weight:650;
}
.mes-mando .btn[disabled]{opacity:.32;pointer-events:none}

/* La meta del mes --------------------------------------------------------- */
.meta-barra{
  height:14px;border-radius:99px;background:var(--linea);overflow:hidden;display:flex;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35);
}
.meta-barra i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg, var(--info), var(--bien));
  transition:width var(--medio) var(--curva);
}
.meta-barra.llena i{background:linear-gradient(90deg, var(--bien), var(--bien))}
.meta-pies{
  display:flex;justify-content:space-between;gap:var(--e3);
  margin-top:9px;font-size:12px;color:var(--txt-3);font-weight:500;
}
.meta-pies b{font-size:15px;font-weight:750;letter-spacing:-.025em;color:var(--txt);margin-right:5px}
.meta-pies span:last-child{text-align:right}

/* Los doce meses ---------------------------------------------------------- */
.meses{
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  gap:5px;align-items:end;
}
.mes{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px 2px 5px;border-radius:9px;min-width:0;
  transition:background var(--rapido) var(--curva);
}
.mes:hover{background:var(--capa-alta)}
.mes.vivo{background:var(--capa-alta)}
.mes.vivo .mes-barras::after{
  content:"";position:absolute;left:12%;right:12%;bottom:-5px;height:2px;
  border-radius:2px;background:var(--marca);
}
/* Cada mes tiene su carril de fondo, así los meses sin movimiento se ven
   como un hueco y no como un fallo de dibujo. */
.mes-barras{
  position:relative;
  display:flex;align-items:flex-end;justify-content:center;gap:3px;
  width:100%;height:104px;
  border-bottom:1px solid var(--linea-fuerte);
}
.mes-barras::before{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  bottom:0;width:30px;height:100%;border-radius:6px 6px 0 0;
  background:linear-gradient(180deg, transparent, var(--linea));
  opacity:.5;
}
.mes-barras i{
  position:relative;z-index:1;
  display:block;width:12px;min-height:0;border-radius:4px 4px 0 0;
  transition:height var(--medio) var(--curva);
}
.mes-barras .ent{background:var(--bien)}
.mes-barras .sal{background:var(--mal);opacity:.75}
.mes-txt{
  font-size:10px;font-weight:700;color:var(--txt-4);
  text-transform:uppercase;letter-spacing:.04em;margin-top:2px;
}
.mes.vivo .mes-txt{color:var(--txt)}
@media (max-width:640px){
  .meses{gap:3px}
  .mes-barras{height:64px}
  .mes-barras i{width:6px}
  .mes-barras::before{width:16px}
  .mes-txt{font-size:8.5px;letter-spacing:0}
}

/* Separador dentro de una lista ----------------------------------------- */
.tramo{
  display:flex;align-items:center;gap:9px;
  padding:9px var(--e4);background:var(--capa-alta);
  font-size:11.5px;font-weight:700;letter-spacing:.01em;color:var(--txt-2);
  /* Nada de pegajoso: clavada arriba, esta cabecera se dibujaba ENCIMA de
     la primera fila de tarjetas y la lista parecía partida por la mitad.
     Pero sigue siendo su propio marco: sin esto, la rayita de color de la
     plataforma se estiraba por toda la tarjeta de arriba abajo. */
  position:relative;
  border-bottom:1px solid var(--linea);
}
.tramo b{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.tramo.mal{color:var(--mal)} .tramo.aviso{color:var(--aviso)} .tramo.bien{color:var(--bien)}
.tramo .tramo-n{
  min-width:20px;height:19px;padding:0 6px;border-radius:6px;
  background:var(--linea);color:var(--txt-2);
  font-size:10.5px;font-weight:700;line-height:19px;text-align:center;
}
.tramo .tramo-monto{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--txt-2)}
.tramo.plat-tramo{color:var(--txt)}
.tramo.plat-tramo b{font-size:11.5px;letter-spacing:.02em}
.lista > .tramo + .f{border-top:0}

/* Barra de plataformas --------------------------------------------------- */
.plataformas{
  display:flex;gap:var(--e2);overflow-x:auto;scrollbar-width:none;
  padding:2px;margin:calc(var(--e2) * -1) 0;
}
.plataformas::-webkit-scrollbar{display:none}
.plat{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;
  min-height:48px;padding:7px 13px 7px 9px;border-radius:var(--r);
  border:1px solid var(--linea);background:var(--capa);
  text-align:left;position:relative;
  transition:border-color var(--rapido) var(--curva),background var(--rapido) var(--curva);
}
.plat:hover{border-color:var(--linea-fuerte);background:var(--capa-alta)}
.plat.viva{border-color:var(--marca-linea);background:var(--marca-suave)}
.plat .plat-txt{min-width:0;line-height:1.25}
.plat b{display:block;font-size:12.5px;font-weight:650;letter-spacing:-.015em;
  white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.plat small{display:block;font-size:10.5px;font-weight:500;color:var(--txt-3);white-space:nowrap}
.plat.viva b{color:var(--txt)}
.plat-aviso{
  position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;
  border-radius:99px;background:var(--mal);color:var(--tinta-mal);
  font-size:10px;font-weight:700;line-height:18px;text-align:center;
  border:2px solid var(--fondo);
}

/* Barra de filtros en dos renglones -------------------------------------
   Todo en una sola línea no cabía: los últimos filtros quedaban cortados a
   media palabra. Arriba los filtros, abajo lo demás. */
.barra-filtros{ display:flex;flex-direction:column;gap:var(--e2) }
/* Dentro de la tarjeta los filtros son parte de ella: van pegados a su
   cabecera y se cierran con una línea antes de la lista. */
.barra-filtros.dentro{
  padding:0 var(--e5) var(--e4);
  border-bottom:1px solid var(--linea);
}
@media (max-width:640px){ .barra-filtros.dentro{ padding:0 var(--e3) var(--e3) } }
.barra-filtros > .segmentos{ width:100% }
.fila-controles{ display:flex;gap:var(--e2);flex-wrap:wrap;align-items:center }
.fila-controles select{ flex:0 1 240px;min-width:0 }
.fila-controles .btn{ flex:0 0 auto }
.fila-controles > .crece{ flex:1 1 auto;min-width:0 }
@media (max-width:620px){
  .fila-controles > .crece{ display:none }
  .fila-controles select{ flex:1 1 calc(50% - 4px) }
  .fila-controles .btn{ flex:1 1 100%;order:3 }
}

/* En pantalla ancha las plataformas caben en dos renglones: mejor verlas
   todas que dejar una cortada a medias en el borde. */
@media (min-width:1100px){
  .plataformas{ flex-wrap:wrap; overflow-x:visible }
  .plataformas .plat{ flex:1 1 auto; min-width:190px }
}

/* ===== MOSAICO DE PLATAFORMAS ==========================================
   La plataforma es la unidad con la que se piensa el negocio, así que es la
   unidad con la que se entra: un mosaico donde cada una lleva su color, su
   logo, sus perfiles y lo que deja. Antes eran nueve pastillas grises en
   fila, que no decían nada de un vistazo. */
.mosaico{
  display:grid;gap:var(--e4);
  grid-template-columns:repeat(auto-fill, minmax(min(250px, 100%), 1fr));
}
.ficha{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;overflow:hidden;text-align:left;
  display:flex;flex-direction:column;gap:10px;
  padding:var(--e4);border-radius:var(--r-xl);
  border:1px solid var(--linea);background:var(--capa);
  box-shadow:var(--brillo), var(--sombra-2);
  transition:transform var(--rapido) var(--curva),
             border-color var(--rapido) var(--curva),
             box-shadow var(--rapido) var(--curva);
}
/* El color de la marca entra como un velo, no como un fondo: así el texto
   sigue leyéndose igual de bien en claro y en oscuro. */
.ficha::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(135% 105% at 0% 0%, var(--tono) 0%, transparent 62%);
  opacity:.17;
}
html[data-tema="claro"] .ficha::after{opacity:.10}
.ficha::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;z-index:2;
  background:linear-gradient(90deg, var(--tono), transparent 85%);
}
/* ===== LA REJILLA DE PLATAFORMAS, CON SU PROPIO AIRE ====================
   Es la primera pantalla y la que más se mira, así que no puede parecer
   una tabla con bordes. Cada ficha es la marca: su color entra por la
   esquina y por el canto izquierdo, el logo va sobre un azulejo de vidrio
   y al pasar por encima cruza un brillo. Nada de esto va detrás de un
   texto que haya que leer: ahí sigue mandando el contraste. */
.ficha{
  border-left:3px solid transparent;
  background:
    linear-gradient(180deg, rgba(255,255,255,.028), transparent 38%),
    var(--capa);
}
.ficha::before{
  background:linear-gradient(90deg, var(--tono) 0%, var(--tono) 18%, transparent 88%);
  height:2px;
}
/* El canto de color: dice de qué plataforma es antes de leer el nombre.
   Va en el borde y no dentro, porque la ficha recorta lo que se le sale. */
.ficha{border-left-color:var(--tono)}
/* El brillo que cruza al pasar por encima. Se mueve solo si el equipo no
   pide que se quede quieto. */
.ficha .ficha-tapa::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(100deg, transparent 32%,
             rgba(255,255,255,.07) 48%, transparent 64%);
  transform:translateX(-120%);
  transition:transform .62s var(--curva);
}
.ficha:hover .ficha-tapa::before{transform:translateX(120%)}
@media (prefers-reduced-motion: reduce){
  .ficha .ficha-tapa::before{display:none}
}
/* El logo de la plataforma, sobre su azulejo. */
.ficha .f-marca{
  border-radius:13px;
  box-shadow:0 5px 16px -6px var(--tono), 0 0 0 1px rgba(255,255,255,.07) inset;
}

/* Las casillas de perfil: las ocupadas llevan el color de la plataforma. */
.ficha .casillas i.usado, .ficha .barra i{
  box-shadow:0 0 8px -2px var(--tono);
}
/* La tapa cubre la ficha entera; el contenido no atrapa el clic salvo los
   botones de mando, que van por encima de ella. */
.ficha-tapa{
  position:absolute;inset:0;z-index:1;border-radius:inherit;
  background:transparent;border:0;cursor:pointer;
}
.ficha-tapa:focus-visible{outline:2px solid var(--marca);outline-offset:-3px}
.ficha > *:not(.ficha-tapa){position:relative;z-index:2;pointer-events:none}
.ficha > .ficha-mando, .ficha > .ficha-marcas{z-index:3;pointer-events:auto}
.ficha-mando{
  display:flex;gap:6px;align-items:center;
  border-top:1px solid var(--linea);padding-top:10px;
}
.ficha-mando .crece{flex:1;min-width:0}
/* «Entrar» se pinta del color de la plataforma: es su puerta, no la del
   programa. El color del texto se calcula sobre el de la marca para que
   siempre se lea (Spotify verde pide texto oscuro; Netflix rojo, claro). */
.ficha-mando .btn.principal, .plat-hero .mando .btn.principal{
  background:var(--tono-btn);border-color:var(--tono-btn);color:var(--tono-txt);
  /* Misma pegatina, pero con el color de la plataforma: contorno, canto y
     un brillo. El canto se calcula con `color-mix` sobre el propio tono, así
     que una cuenta de Spotify verde no lleva el canto rojo de PAPOTAS. */
  box-shadow:0 0 0 1.5px var(--contorno),
             inset 0 -3px 0 0 color-mix(in srgb, var(--tono-btn) 62%, #000),
             var(--brillo);
}
.ficha-mando .btn.principal:active, .plat-hero .mando .btn.principal:active{
  transform:translateY(1px);
  box-shadow:0 0 0 1.5px var(--contorno),
             inset 0 -1px 0 0 color-mix(in srgb, var(--tono-btn) 62%, #000);
}
.ficha-mando .btn.principal:hover, .plat-hero .mando .btn.principal:hover{
  filter:brightness(1.1);
}
.ficha:hover{transform:translateY(-2px);border-color:var(--tono-linea);box-shadow:var(--sombra-3)}
.ficha:focus-within{border-color:var(--tono-linea)}
.ficha.viva{border-color:var(--tono-linea);box-shadow:var(--brillo), var(--sombra-3)}
/* El canto se queda de su color pase lo que pase con el resto del borde. */
.ficha:hover, .ficha:focus-within, .ficha.viva{border-left-color:var(--tono)}

.ficha-alto{display:flex;align-items:center;gap:10px;min-width:0}
.ficha-id{min-width:0;flex:1}
.ficha-id b{display:block;font-size:15px;font-weight:750;letter-spacing:-.025em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ficha-id small{display:block;font-size:11.5px;color:var(--txt-3);font-weight:500;margin-top:1px}

.ficha-perfiles{display:flex;align-items:center;gap:9px;min-width:0}
.ficha-perfiles .barra{flex:1;min-width:60px}
.ficha-perfiles > small{font-size:10.5px;font-weight:700;color:var(--txt-4);white-space:nowrap}
.ficha-perfiles .casillas{margin-top:0;flex-wrap:wrap;gap:3px 3px}
.ficha-alto .insignia{flex:0 0 auto}

.ficha-pie{
  display:flex;align-items:flex-end;gap:var(--e2);
  border-top:1px solid var(--linea);padding-top:10px;margin-top:auto;
}
.ficha-pie + .ficha-mando{margin-top:0}
.ficha-deja{flex:1;min-width:0}
.ficha-deja b{display:block;font-size:19px;font-weight:750;letter-spacing:-.035em}
.ficha-deja small{display:block;font-size:10.5px;color:var(--txt-4);font-weight:600;
  text-transform:uppercase;letter-spacing:.07em}
.ficha-nums{text-align:right;font-size:11px;color:var(--txt-3);font-weight:550;line-height:1.5}
.ficha-nums i{display:block;font-style:normal;white-space:nowrap}
.ficha-marcas{display:flex;gap:5px;flex-wrap:wrap;pointer-events:auto;z-index:3}
/* Una insignia que además se pulsa: lleva a esos clientes. */
.insignia.pulsable{cursor:pointer;min-height:28px;padding:0 10px}
.insignia.pulsable:hover{filter:brightness(1.25)}
.mosaico{grid-template-columns:repeat(auto-fill, minmax(min(262px, 100%), 1fr))}
/* La rejilla de personas, dentro de una tarjeta: se aprieta un poco más y
   respira por los lados como el resto del cuerpo de la tarjeta. */
.mosaico.gente{
  padding:var(--e3) var(--e5) var(--e5);
  grid-template-columns:repeat(auto-fill, minmax(min(248px, 100%), 1fr));
  gap:var(--e3);
}
.tramo + .mosaico.gente{padding-top:var(--e4)}
@media (max-width:700px){
  .mosaico.gente{
    grid-template-columns:minmax(0,1fr);
    gap:var(--e2);
    padding:var(--e2) var(--e3) var(--e3);
  }
}

/* En el teléfono las plataformas van primero: son con lo que se trabaja.
   Debajo de las cuatro cifras quedaban a dos pantallas de distancia. */
@media (max-width:860px){
  #p-negocio .caja-plataformas{order:-1}
}
/* Y la ficha se aprieta: con nueve plataformas, una ficha por pantalla es
   demasiado desplazamiento. El desglose de cobras y cuesta se guarda para
   cuando se entra a la plataforma, que es donde hace falta. */
@media (max-width:640px){
  /* La explicación sobra en el teléfono: las fichas se explican solas y esa
     línea empujaba la primera plataforma media pantalla hacia abajo. */
  .caja-plataformas > .tarjeta-cabeza p{display:none}
  .caja-plataformas > .tarjeta-cuerpo:not(.pegado){padding:0 var(--e3) var(--e3)}
  .ficha{padding:var(--e3);gap:8px;border-radius:var(--r-l)}
  .ficha-id b{font-size:14px}
  .ficha-pie{
    display:flex;flex-direction:row;align-items:baseline;gap:8px;padding-top:8px;
  }
  .ficha-deja{display:flex;align-items:baseline;gap:8px;flex:1}
  .ficha-deja small{margin:0}
  .ficha-deja b{font-size:17px}
  .ficha-nums{display:none}
  .ficha-mando{padding-top:8px}
}

/* En pantalla ancha, Ajustes deja de ser una columna interminable: las
   tarjetas se reparten en dos y se leen de un vistazo. Se usa columnas de
   verdad para que ninguna tarjeta se parta por la mitad. */


/* ===== AZULEJOS DE CIFRAS ==============================================
   Del PAPOTAS de siempre: cada cifra en su azulejo, con su icono a la
   derecha y su propio color. Ocho cifras pequeñas y distintas se leen mejor
   que una enorme y cuatro apagadas. */
.azulejos{
  display:grid;gap:var(--e3);
  grid-template-columns:repeat(4, minmax(0,1fr));
}
/* Cinco cifras: cinco columnas. Cuatro y una suelta debajo se ve roto. */
.azulejos.cinco{grid-template-columns:repeat(5, minmax(0,1fr))}
@media (max-width:1280px){ .azulejos.cinco{grid-template-columns:repeat(3, minmax(0,1fr))} }
@media (max-width:820px){ .azulejos.cinco{grid-template-columns:repeat(2, minmax(0,1fr))} }
@media (max-width:1100px){ .azulejos{grid-template-columns:repeat(3, minmax(0,1fr))} }
@media (max-width:820px){ .azulejos{grid-template-columns:repeat(2, minmax(0,1fr))} }
.azulejo{
  --t:var(--txt);--t-suave:rgba(255,255,255,.06);--t-linea:var(--linea-fuerte);
  position:relative;text-align:left;min-width:0;
  padding:13px var(--e4) 12px;border-radius:var(--r-l);
  border:1px solid var(--linea);background:var(--capa);
  display:flex;flex-direction:column;gap:5px;
  box-shadow:var(--brillo);
  transition:border-color var(--rapido) var(--curva), background var(--rapido) var(--curva);
}
button.azulejo{cursor:pointer}
button.azulejo:hover{border-color:var(--t-linea);background:var(--capa-alta)}
.azulejo .k{
  font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--txt-3);padding-right:36px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.azulejo .v{font-size:25px;font-weight:750;letter-spacing:-.04em;line-height:1.05;color:var(--t)}
.azulejo .n{font-size:11px;color:var(--txt-4);font-weight:550;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azulejo .ico{
  position:absolute;top:11px;right:11px;
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:var(--t-suave);border:1px solid var(--t-linea);color:var(--t);
}
.azulejo .ico svg{width:15px;height:15px;stroke-width:2}
.azulejo.mal  {--t:var(--mal);  --t-suave:var(--mal-fondo);  --t-linea:var(--mal-linea)}
.azulejo.aviso{--t:var(--aviso);--t-suave:var(--aviso-fondo);--t-linea:var(--aviso-linea)}
.azulejo.bien {--t:var(--bien); --t-suave:var(--bien-fondo); --t-linea:var(--bien-linea)}
.azulejo.info {--t:var(--info); --t-suave:var(--info-fondo); --t-linea:var(--info-linea)}
@media (max-width:420px){
  .cal-dias, .cal-semana{gap:2px}
  .dia{min-height:36px;font-size:12px;border-radius:7px}
  .cal-pie{font-size:9.5px;gap:5px var(--e2)}
}
@media (max-width:640px){
  .azulejos{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e2)}
  .azulejo{padding:11px var(--e3) 10px}
  .azulejo .v{font-size:20px}
  .azulejo .k{padding-right:30px;font-size:9px}
  .azulejo .ico{width:24px;height:24px;top:9px;right:9px;border-radius:7px}
  .azulejo .ico svg{width:13px;height:13px}
}

/* ===== ACCIONES RÁPIDAS ================================================= */
.acciones-rapidas{display:flex;gap:var(--e2);flex-wrap:wrap;align-items:center}
.acciones-rapidas .crece{flex:1 1 auto;min-width:0}
@media (max-width:860px){
  .acciones-rapidas .crece{display:none}
  /* Dos por renglón y la ronda entera abajo: cuatro botones sueltos se
     comían media pantalla antes de enseñar una sola cifra. Y "ver todos los
     clientes" ya está en la barra de abajo. */
  .acciones-rapidas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e2)}
  .acciones-rapidas .btn{min-width:0}
  .acciones-rapidas .btn[data-escribir-a]{grid-column:1 / -1}
  .acciones-rapidas .btn[data-ir-clientes]{display:none}
}
@media (max-width:420px){
  .acciones-rapidas .btn{padding:0 10px;font-size:12.5px}
}

/* ===== EL CALENDARIO DEL MES ===========================================
   El del programa de siempre: el mes entero, un punto por cobro y el día de
   hoy marcado. */
.calendario-mes{display:flex;flex-direction:column;gap:var(--e3)}
.cal-cabeza{display:flex;align-items:center;gap:var(--e2)}
.cal-titulo{flex:1;text-align:center;min-width:0}
.cal-titulo b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.015em}
.cal-titulo small{display:block;font-size:11px;color:var(--txt-3);font-weight:550;margin-top:1px}
.cal-semana{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
  font-size:9.5px;font-weight:800;color:var(--txt-4);
  text-transform:uppercase;letter-spacing:.06em;text-align:center;
}
.cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dia{
  /* Nada de aspect-ratio: en el teléfono la altura del contenido mandaba
     sobre el ancho y cada día se hacía de 66px, así que la rejilla de siete
     columnas se salía de la pantalla. */
  position:relative;min-height:40px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:9px;border:1px solid transparent;
  font-size:12.5px;color:var(--txt-3);
  transition:background var(--rapido) var(--curva), border-color var(--rapido) var(--curva);
}
.dia.vacio{pointer-events:none}
.dia b{font-weight:600;line-height:1}
.dia.con{color:var(--txt);background:var(--capa-alta);border-color:var(--linea)}
.dia.con:hover{border-color:var(--linea-fuerte);background:var(--capa-alta)}
.dia.hoy{border-color:var(--marca);color:var(--txt);font-weight:800}
.dia.hoy b{font-weight:800}
.puntos{display:flex;gap:2px;height:5px;align-items:center}
.puntos i{width:5px;height:5px;border-radius:50%;display:block}
.puntos i.mal{background:var(--mal)} .puntos i.aviso{background:var(--aviso)}
.puntos i.bien{background:var(--bien)} .puntos i.info{background:var(--info)}
.cal-pie{
  display:flex;flex-wrap:wrap;gap:6px var(--e3);
  border-top:1px solid var(--linea);padding-top:10px;
  font-size:10.5px;color:var(--txt-4);font-weight:600;
}
.cal-pie span{display:flex;align-items:center;gap:5px}
.cal-pie i{width:6px;height:6px;border-radius:50%;display:block}
.cal-pie i.mal{background:var(--mal)} .cal-pie i.aviso{background:var(--aviso)}
.cal-pie i.bien{background:var(--bien)} .cal-pie i.info{background:var(--info)}

.rejilla.dos-tercios{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* minmax(0,1fr) y no 1fr: con 1fr el ancho mínimo lo pone el contenido y
   una tarjeta se salía 50px de la pantalla en un móvil de 320. */
@media (max-width:1100px){ .rejilla.dos-tercios{grid-template-columns:minmax(0,1fr)} }

.lista-dia{max-height:52vh;overflow-y:auto;border:1px solid var(--linea);border-radius:var(--r-l)}

/* ===== EL TABLERO DE HOY ================================================
   Hoy no es un listado: es el parte del día. Una cifra que manda, el anillo
   del mes, el botón que arranca la ronda y cinco números de apoyo. */
.tablero{
  display:grid;gap:var(--e4) var(--e5);
  grid-template-columns:minmax(0,1.5fr) auto minmax(0,1fr);
  grid-template-areas:"cifra anillo acciones" "mini mini mini";
  align-items:center;
  padding:var(--e5);border-radius:var(--r-xl);
  border:1px solid var(--linea);background:var(--capa);
  box-shadow:var(--brillo), var(--sombra-2);
  position:relative;overflow:hidden;
}
.tablero::before{
  content:"";position:absolute;inset:0 0 auto;height:2px;
  background:linear-gradient(90deg, var(--marca), transparent 55%);
}
.tab-cifra{grid-area:cifra;min-width:0}
.tab-cifra .k{
  display:block;font-size:10.5px;font-weight:700;color:var(--txt-3);
  letter-spacing:.1em;text-transform:uppercase;
}
.tab-cifra b{
  display:block;font-size:46px;font-weight:750;letter-spacing:-.05em;
  line-height:1.02;margin:6px 0 4px;color:var(--aviso);
}
.tab-cifra .n{display:block;font-size:12.5px;color:var(--txt-3);font-weight:500}
.tab-cifra .n em{font-style:normal;font-weight:700}
.tab-cifra .n em.mal{color:var(--mal)}

.tab-anillo{grid-area:anillo;display:flex;align-items:center;gap:var(--e3)}
.anillo{flex:0 0 auto}
.anillo-txt{
  font-family:var(--cifra);font-size:17px;font-weight:700;
  fill:var(--txt);letter-spacing:-.04em;
}
.tab-anillo-txt b{display:block;font-size:17px;font-weight:750;letter-spacing:-.03em}
.tab-anillo-txt small{display:block;font-size:11.5px;color:var(--txt-3);font-weight:500;margin-top:2px}

.tab-acciones{grid-area:acciones;display:flex;flex-direction:column;gap:var(--e2);align-items:stretch}
.btn.grande{min-height:48px;font-size:14px;font-weight:700;padding:0 var(--e4)}
/* Las dos formas de cobrarle al que debe varias cuotas, una debajo de otra
   y con la cuenta hecha en cada una, para elegir sin pensar. */
.cuotas-opciones{display:grid;gap:10px}
.cuotas-opciones .btn{
  min-height:62px;justify-content:flex-start;text-align:left;
  padding:12px var(--e4);gap:12px;
}
.cuotas-opciones .btn svg{width:20px;height:20px;flex:0 0 auto}
.cuotas-opciones .btn span{display:flex;flex-direction:column;gap:2px;min-width:0}
.cuotas-opciones .btn b{font-size:14px;font-weight:750}
.cuotas-opciones .btn small{font-size:11.5px;font-weight:600;opacity:.82}
.btn-n{
  margin-left:4px;min-width:22px;height:20px;padding:0 6px;border-radius:99px;
  background:var(--velo-n);color:#fff;
  font-size:11px;font-weight:800;line-height:20px;
}
.tab-mini{
  grid-area:mini;margin:0;display:grid;gap:var(--e2);
  grid-template-columns:repeat(5,minmax(0,1fr));
  border-top:1px solid var(--linea);padding-top:var(--e3);
}
.tab-mini > div{min-width:0}
.tab-mini dt{font-size:10px;font-weight:700;color:var(--txt-4);text-transform:uppercase;
  letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-mini dd{margin:3px 0 0;font-size:19px;font-weight:750;letter-spacing:-.03em}
.tab-mini dd.mal{color:var(--mal)} .tab-mini dd.aviso{color:var(--aviso)} .tab-mini dd.bien{color:var(--bien)}
@media (max-width:1100px){
  .tablero{grid-template-columns:minmax(0,1fr) auto;
           grid-template-areas:"cifra anillo" "acciones acciones" "mini mini"}
}
@media (max-width:640px){
  .tablero{padding:var(--e4);gap:var(--e3);
           grid-template-columns:minmax(0,1fr) auto;
           grid-template-areas:"cifra anillo" "acciones acciones" "mini mini"}
  .tab-cifra b{font-size:34px}
  .anillo{width:64px;height:64px}
  .tab-anillo-txt{display:none}
  .tab-mini{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e2) var(--e3)}
  .tab-mini dd{font-size:16px}
}

/* ===== EL CALENDARIO DE LO QUE VIENE ==================================== */
.calendario{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:5px;align-items:end}
.cal-col{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:7px 2px 6px;border-radius:10px;min-width:0;
  transition:background var(--rapido) var(--curva);
}
.cal-col:hover{background:var(--capa-alta)}
.cal-n{font-size:12px;font-weight:750;letter-spacing:-.02em;height:15px;color:var(--txt-2)}
.cal-barra{
  width:100%;max-width:34px;height:52px;border-radius:5px;
  background:var(--linea);display:flex;align-items:flex-end;overflow:hidden;
}
.cal-barra i{display:block;width:100%;border-radius:5px;background:var(--bien)}
.cal-col.mal .cal-barra i{background:var(--mal)}
.cal-col.aviso .cal-barra i{background:var(--aviso)}
.cal-col.mal .cal-n{color:var(--mal)}
.cal-col.aviso .cal-n{color:var(--aviso)}
.cal-dia{font-size:10px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em}
.cal-sub{font-size:10px;color:var(--txt-4);font-weight:600}

/* ===== EL RANKING DE PLATAFORMAS ======================================== */
.ranking{display:flex;flex-direction:column;gap:2px}
.rank{
  --tono:var(--txt-4);
  display:flex;align-items:center;gap:10px;
  padding:7px 8px;border-radius:10px;
  transition:background var(--rapido) var(--curva);
}
.rank:hover{background:var(--capa-alta)}
.rank-n{
  flex:0 0 132px;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rank-barra{
  flex:1 1 auto;min-width:40px;max-width:360px;
  height:8px;border-radius:99px;background:var(--linea);overflow:hidden;
}
.rank-relleno{flex:0 1 auto;min-width:0;max-width:24px}
.rank-barra i{display:block;height:100%;border-radius:99px;background:var(--tono)}
.rank-gente{
  flex:0 0 auto;min-width:26px;height:20px;padding:0 6px;border-radius:6px;
  background:var(--linea);color:var(--txt-2);
  font-size:11px;font-weight:700;line-height:20px;text-align:center;
}
.rank-suma{flex:1 1 auto;text-align:right;font-size:13px;font-weight:750;letter-spacing:-.02em}
@media (max-width:640px){
  .rank-n{flex:0 0 92px;font-size:12px}
  .rank-suma{flex:0 0 74px;font-size:12px}
  .rank-barra{display:none}
}
/* El plegable cerrado mide 280px de ancho: la pantalla más estrecha que
   existe. Ahí ya no caben el nombre, la cifra y el botón con esas medidas
   fijas, así que se dejan encoger. */
@media (max-width:340px){
  .rank{gap:6px;padding:7px 4px}
  .rank-n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-suma{flex:0 0 auto;font-size:11.5px}
  .rank .f-marca{width:24px;height:24px}
}

/* ===== LA TABLA DE TRABAJO =============================================
   Para veinte líneas que se leen de un vistazo, una tabla apretada gana a
   veinte tarjetas: menos tinta, más información por pantalla. */
.tabla-envoltura{overflow-x:auto}
.tabla{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.tabla col.c-quien{width:30%}
.tabla col.c-cuenta{width:24%}
.tabla col.c-vence{width:17%}
.tabla col.c-monto{width:13%}
.tabla col.c-hacer{width:16%}
@media (max-width:860px){
  .tabla col.c-quien{width:44%} .tabla col.c-vence{width:22%}
  .tabla col.c-monto{width:16%} .tabla col.c-hacer{width:18%}
}
@media (max-width:560px){
  .tabla col.c-quien{width:52%} .tabla col.c-monto{width:22%} .tabla col.c-hacer{width:26%}
}
.tabla thead th{
  padding:8px var(--e4);text-align:left;
  background:var(--capa-alta);
  border-bottom:1px solid var(--linea);
  font-size:10px;font-weight:800;color:var(--txt-4);
  text-transform:uppercase;letter-spacing:.09em;white-space:nowrap;
}
.tabla tbody tr{border-bottom:1px solid var(--linea)}
.tabla tbody tr:last-child{border-bottom:0}
.tabla tbody tr:hover{background:var(--capa-alta)}
.tabla td{padding:7px var(--e4);vertical-align:middle}
.tabla td.t-quien{padding-left:calc(var(--e4) - 3px)}
/* El acento de estado va en la primera celda, no en la fila: un ::before
   sobre un <tr> se convierte en una celda fantasma y descuadraba la tabla
   entera una columna. */
.tabla tbody tr.mal   td:first-child{box-shadow:inset 3px 0 0 var(--mal)}
.tabla tbody tr.aviso td:first-child{box-shadow:inset 3px 0 0 var(--aviso)}
.tabla tbody tr.bien  td:first-child{box-shadow:inset 3px 0 0 var(--bien)}
.t-nom{
  display:flex;align-items:center;gap:9px;min-width:0;width:100%;text-align:left;
  min-height:30px;padding:0 4px;margin:0 -4px;border-radius:8px;
  font-size:13.5px;font-weight:650;letter-spacing:-.012em;color:var(--txt);
}
.t-nom span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.t-nom:hover{color:var(--marca-alta)}
.tabla .t-monto, .tabla th.t-monto{text-align:right}
.tabla .t-monto{font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.tabla th.t-hacer{text-align:right}
.tabla .t-vence{white-space:nowrap}
/* En la tabla la pastilla también se ve entera: con ochenta filas, el color
   del texto solo no distinguía el rojo del ámbar. */
.tabla .pastilla{font-size:11px;padding:2px 8px}
.tabla .t-hacer{text-align:right;white-space:nowrap}
.tabla .t-hacer .btn{margin-left:4px}
.tabla .f-sin-tel{display:inline-grid;vertical-align:middle;margin-left:4px}
@media (max-width:860px){
  .tabla .t-cuenta{display:none}
  .tabla thead .t-cuenta{display:none}
}
@media (max-width:560px){
  .tabla .t-vence{display:none}
  .tabla thead .t-vence{display:none}
  .t-nom span{max-width:120px}
  .tabla td{padding:6px var(--e3)}
  .tabla thead th{padding:7px var(--e3)}
}

/* ===== EL MANDO DE PLATAFORMAS =========================================
   La barra de arriba de todas las pantallas. No es un filtro más: es con
   quién estás trabajando. */
.mando-plat{
  display:flex;gap:var(--e2);overflow-x:auto;scrollbar-width:none;
  padding:3px 3px 5px;margin:0 -3px;
  scroll-snap-type:x proximity;
}
.mando-plat::-webkit-scrollbar{display:none}
.pastel{
  --tono:var(--txt-3);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;flex:0 0 auto;scroll-snap-align:start;
  display:flex;align-items:center;gap:9px;
  padding:7px 14px 7px 8px;border-radius:99px;
  border:1px solid var(--linea);background:var(--capa);
  text-align:left;overflow:hidden;
  transition:border-color var(--rapido) var(--curva),
             background var(--rapido) var(--curva),
             transform var(--rapido) var(--curva);
}
.pastel::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, var(--tono), transparent 62%);
  opacity:0;transition:opacity var(--medio) var(--curva);
}
.pastel > *{position:relative;z-index:1}
.pastel:hover{border-color:var(--tono-linea);transform:translateY(-1px)}
.pastel.viva{border-color:var(--tono-linea)}
.pastel.viva::after{opacity:.2}
html[data-tema="claro"] .pastel.viva::after{opacity:.13}
.pastel-ojo{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;overflow:hidden;
  border:1.5px solid var(--tono-linea);
  background:var(--capa-alta);color:var(--tono);
  transition:border-color var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva);
}
.pastel-ojo .f-marca{width:22px;height:22px;border-radius:50%;font-size:10px}
.pastel-ojo.todas svg{width:16px;height:16px;stroke-width:2}
.pastel.viva .pastel-ojo{
  border-color:var(--tono);
  box-shadow:0 0 0 2px var(--tono-suave), 0 0 12px -2px var(--tono);
}
.pastel-txt{min-width:0;line-height:1.2}
.pastel-txt b{
  display:block;font-size:12.5px;font-weight:700;letter-spacing:-.018em;
  max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pastel-txt small{display:block;font-size:10.5px;color:var(--txt-4);font-weight:600;margin-top:1px}
.pastel.viva .pastel-txt small{color:var(--txt-3)}
.pastel-n{
  flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;
  background:var(--mal);color:var(--tinta-mal);
  font-size:10.5px;font-weight:800;line-height:20px;text-align:center;
}
@media (pointer: coarse){
  .pastel{ padding:9px 15px 9px 9px }
  .pastel-ojo{ width:34px;height:34px }
  .pastel-ojo .f-marca{ width:26px;height:26px }
}
@media (max-width:640px){
  .pastel-txt b{max-width:108px}
}

/* ===== ENTRADA ESCALONADA ==============================================
   Las tarjetas no aparecen de golpe: entran una detrás de otra en poco más
   de un parpadeo. Solo las primeras doce llevan retraso; a partir de ahí ya
   estás desplazándote y no se nota. */
@keyframes sube{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.mosaico.gente > .tc, .mosaico > .ficha{
  animation:sube 260ms var(--curva) both;
}
.mosaico.gente > .tc:nth-child(1), .mosaico > .ficha:nth-child(1){animation-delay:0ms}
.mosaico.gente > .tc:nth-child(2), .mosaico > .ficha:nth-child(2){animation-delay:14ms}
.mosaico.gente > .tc:nth-child(3), .mosaico > .ficha:nth-child(3){animation-delay:28ms}
.mosaico.gente > .tc:nth-child(4), .mosaico > .ficha:nth-child(4){animation-delay:42ms}
.mosaico.gente > .tc:nth-child(5), .mosaico > .ficha:nth-child(5){animation-delay:56ms}
.mosaico.gente > .tc:nth-child(6), .mosaico > .ficha:nth-child(6){animation-delay:70ms}
.mosaico.gente > .tc:nth-child(7), .mosaico > .ficha:nth-child(7){animation-delay:84ms}
.mosaico.gente > .tc:nth-child(8), .mosaico > .ficha:nth-child(8){animation-delay:98ms}
.mosaico.gente > .tc:nth-child(n+9), .mosaico > .ficha:nth-child(n+9){animation-delay:110ms}
@media (prefers-reduced-motion:reduce){
  .mosaico.gente > .tc, .mosaico > .ficha{animation:none}
}

/* El foco se ve: se trabaja con teclado y hay que saber dónde se está. */
.pastel:focus-visible, .tc-mando .btn:focus-visible, .ficha-mando .btn:focus-visible{
  outline:2px solid var(--marca);outline-offset:2px;
}

/* La chuleta de atajos, abajo del todo en Ajustes. */
.atajos{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(210px, 100%), 1fr))}
.atajo{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt-3);font-weight:500}
kbd{
  display:inline-block;min-width:22px;padding:2px 7px;border-radius:6px;
  border:1px solid var(--linea-fuerte);border-bottom-width:2px;
  background:var(--capa-alta);color:var(--txt-2);
  font-family:var(--mono, ui-monospace, monospace);font-size:11px;font-weight:700;text-align:center;
}

/* ===== PANEL DE UNA PLATAFORMA DENTRO DE UNA LISTA =====================
   La unidad con la que se trabaja: su color a la izquierda, su nombre, su
   chispa de los últimos seis meses, lo que suma y sus botones. */
.panel-plat{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  border-top:1px solid var(--linea);
}
.panel-plat:first-child{border-top:0}
.panel-cabeza{
  /* Su propio marco. Sin esto, el velo de color de la plataforma se salía
     de la cabecera y teñía la tarjeta entera de morado. */
  position:relative;
  display:flex;align-items:center;gap:10px;
  padding:10px var(--e5);
  background:var(--capa-alta);
  border-bottom:1px solid var(--linea);
  overflow:hidden;
}
.panel-cabeza::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tono);
}
.panel-cabeza::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, var(--tono), transparent 42%);opacity:.12;
}
html[data-tema="claro"] .panel-cabeza::after{opacity:.08}
.panel-cabeza > *{position:relative;z-index:1}
.panel-id{min-width:0;flex:1}
.panel-id b{
  display:block;font-size:13px;font-weight:800;letter-spacing:.02em;
  text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.panel-id small{display:block;font-size:11px;color:var(--txt-3);font-weight:600;margin-top:1px}
.panel-suma{font-size:14px;font-weight:750;letter-spacing:-.025em;color:var(--txt-2);flex:0 0 auto}
.chispa{flex:0 0 auto;opacity:.85;display:block}
@media (max-width:640px){
  .panel-cabeza{padding:9px var(--e3);gap:8px}
  .chispa{display:none}
  .panel-id b{font-size:12px}
}
@media (max-width:420px){
  .panel-cabeza .btn.icono[href]{display:none}
}

/* ===== TARJETA DE CLIENTE ==============================================
   El mismo esqueleto que la ficha de una plataforma. Cambia lo que cuenta
   —una persona en vez de un servicio— pero no el idioma. */
.tc{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;overflow:hidden;text-align:left;
  display:flex;flex-direction:column;gap:9px;
  padding:var(--e4);border-radius:var(--r-xl);
  border:1px solid var(--linea);background:var(--capa);
  box-shadow:var(--brillo), var(--sombra-2);
  transition:transform var(--rapido) var(--curva),
             border-color var(--rapido) var(--curva),
             box-shadow var(--rapido) var(--curva);
}
/* Un roce del color de la marca, no un baño: con cien tarjetas seguidas de
   Netflix, un velo fuerte teñía la pantalla entera de rosa. */
.tc::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 95% at 0% 0%, var(--tono) 0%, transparent 55%);
  opacity:.07;
}
html[data-tema="claro"] .tc::after{opacity:.05}
/* La franja de arriba dice el estado, no la marca: en esta pantalla lo que
   manda es a quién le toca, y el color de la plataforma ya lo lleva el
   logo y el chip de su cuenta. */
.tc::before{
  content:"";position:absolute;inset:0 0 auto;height:2px;z-index:2;opacity:.7;
  background:linear-gradient(90deg, var(--tono), transparent 70%);
}
.tc.mal::before  {background:linear-gradient(90deg, var(--mal), transparent 70%)}
.tc.aviso::before{background:linear-gradient(90deg, var(--aviso), transparent 70%)}
.tc.bien::before {background:linear-gradient(90deg, var(--bien), transparent 70%)}
.tc > *:not(.ficha-tapa){position:relative;z-index:2;pointer-events:none}
.tc > .tc-mando{z-index:3;pointer-events:auto}
.tc:hover{transform:translateY(-2px);border-color:var(--tono-linea);box-shadow:var(--sombra-3)}
.tc:focus-within{border-color:var(--tono-linea)}

.tc-alto{display:flex;align-items:center;gap:10px;min-width:0}
.tc-id{min-width:0;flex:1}
.tc-id b{
  display:block;font-size:14.5px;font-weight:700;letter-spacing:-.022em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tc-id small{
  display:block;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tc-pie{
  display:flex;align-items:center;gap:var(--e2);
  border-top:1px solid var(--linea);padding-top:9px;margin-top:auto;
}
.tc-monto{flex:1;min-width:0}
.tc-monto small{
  display:block;font-size:10px;color:var(--txt-4);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
}
.tc-monto b{display:block;font-size:19px;font-weight:750;letter-spacing:-.035em;margin-top:1px}
.tc-mando{
  display:flex;gap:6px;align-items:center;
  border-top:1px solid var(--linea);padding-top:9px;
}
.tc-mando .crece{flex:1;min-width:0}
.tc-mando .btn[data-ficha]{color:var(--txt-3)}
/* Cien botones rojos macizos, uno debajo de otro, no avisan de nada: solo
   gritan. El botón es sobrio y el color lo lleva el texto, que es lo que se
   lee. El estado ya lo dicen la rayita de arriba y la fecha. */
.tc-cobrar{
  background:var(--capa-alta);border-color:var(--linea-fuerte);color:var(--txt-2);
  font-weight:700;
}
.tc-cobrar:hover{border-color:var(--txt-4);color:var(--txt);background:var(--capa-alta)}
