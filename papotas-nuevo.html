.tc.mal   .tc-cobrar{color:var(--mal);  border-color:rgba(244,63,94,.32)}
.tc.aviso .tc-cobrar{color:var(--aviso);border-color:rgba(245,158,11,.32)}
.tc.mal   .tc-cobrar:hover{background:var(--mal-fondo);  border-color:var(--mal-linea);  color:var(--mal)}
.tc.aviso .tc-cobrar:hover{background:var(--aviso-fondo);border-color:var(--aviso-linea);color:var(--aviso)}

/* En pantalla estrecha la misma tarjeta se aplana: identidad arriba, cifra
   y estado debajo, y el mando a la derecha. Sin cambiar una línea de HTML. */
@media (max-width:700px){
  .tc{
    display:grid;gap:5px 10px;padding:10px var(--e3);border-radius:var(--r-l);
    grid-template-columns:minmax(0,1fr) auto;
    /* Los botones ocupaban la columna de la derecha en LAS DOS filas, y
       eso rompía las dos:

       · Abajo no cabían «S/ 15.00» y «venció hace 21 días» en lo que
         sobraba, así que la pastilla se salía de su celda y se metía por
         debajo de los botones. En pantalla parecía que el botón estaba
         encima del texto.
       · Arriba se comían noventa píxeles, y el nombre se quedaba en
         «DIEGO DE LA …» con el perfil caído a otro renglón. Justo el
         perfil, que es lo único que distingue una ficha de DIEGO QUIROZ
         de la otra ficha de DIEGO QUIROZ.

       Así que la identidad se lleva el ancho entero y los botones bajan a
       la derecha de la fila del dinero, que es donde hay sitio. */
    grid-template-areas:"alto alto" "pie mando";
    align-items:center;
  }
  .tc-alto{grid-area:alto}
  .tc-pie{
    grid-area:pie;border-top:0;padding-top:0;margin-top:0;
    /* Sin sangrar: ahora que la identidad tiene su propio renglón, la
       fila del dinero puede empezar en el borde y así le caben el precio
       y la pastilla en la misma línea. Sangrada se partía en dos y cada
       tarjeta crecía medio dedo por nada. */
    padding-left:0;gap:6px;flex-wrap:wrap;row-gap:6px;
  }
  /* Y aun así, que puedan encoger: un hijo de flex no se encoge por debajo
     de su contenido a menos que se le diga, y esa es la otra mitad del
     mismo problema. */
  .tc-pie > *{min-width:0}
  /* Apretada lo justo: trece píxeles eran los que faltaban para que el
     precio y el estado entraran en la misma línea, y esa línea de más se
     pagaba cien veces al bajar la lista. */
  .tc-pie .pastilla{overflow:hidden;text-overflow:ellipsis;
    font-size:10px;padding:2px 7px;gap:4px}
  .tc-pie .pastilla svg{width:11px;height:11px}
  .tc-monto{flex:0 0 auto}
  .tc-monto small{display:none}
  .tc-monto b{font-size:13.5px}
  /* La cuenta y el perfil pueden ocupar dos renglones antes de cortarse.
     Cortados por lo alto se quedaban en «NETFLIX 1 …», y lo que se perdía
     era justo el perfil: lo único que distingue una ficha de DIEGO QUIROZ
     de la otra ficha de DIEGO QUIROZ. */
  .tc-id small{white-space:normal;display:flex;flex-wrap:wrap;gap:4px}
  /* Y que quepan de una: la cuenta puede recortarse -«NETFLIX 1» se
     reconoce a medias- pero el perfil no, que es lo que distingue una
     ficha de otra de la misma persona. */
  .tc-id .chip-cuenta{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .tc-id .chip-perfil{flex:0 0 auto}
  .tc-alto{gap:8px}
  .tc-mando{
    grid-area:mando;border-top:0;padding-top:0;
    flex-direction:row;align-self:center;
  }
  .tc-mando .btn.principal .et{display:none}
  .tc-mando .btn.principal{width:44px;padding:0;flex:0 0 auto}
  .tc-mando .crece{flex:0 0 auto}
  /* La flecha sobra en el teléfono: la tarjeta entera ya abre la ficha, y
     esos cincuenta píxeles se los estaba comiendo al nombre de la cuenta. */
  .tc-mando .btn[data-ficha]{display:none}
  .tc .f-marca{width:36px;height:36px;flex:0 0 auto}
  .tc-mando{gap:6px}
}
/* Por debajo de 400 px el boton de cobrar se queda solo con su icono: con
   la palabra dentro, el nombre del cliente se quedaba en dos letras. */
@media (max-width:400px){
  .tc-mando .tc-cobrar .et{display:none}
  .tc-mando .tc-cobrar{width:44px;padding:0;flex:0 0 auto;justify-content:center}
}

/* En la LISTA la pastilla no va rellena. La tarjeta ya dice el estado tres
   veces -el filo de la izquierda, la franja de arriba y el tinte del
   fondo-, así que catorce pastillas macizas seguidas no avisan de nada:
   pintan la pantalla de rojo y dejan de leerse. Rellena se queda donde sí
   manda, que es la ficha de uno solo. */
.tc .pastilla.llena{ box-shadow:none }
.tc .pastilla.llena.mal  {background:var(--mal-fondo);  color:var(--mal);  border-color:var(--mal-linea)}
.tc .pastilla.llena.aviso{background:var(--aviso-fondo);color:var(--aviso);border-color:var(--aviso-linea)}
.tc .pastilla.llena.bien {background:var(--bien-fondo); color:var(--bien); border-color:var(--bien-linea)}

/* La cabecera de la ficha en ventana. */
.ficha-cabeza{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:var(--e3);
  padding:12px var(--e4);margin-bottom:var(--e4);
  border:1px solid var(--tono-linea);border-radius:var(--r-l);background:var(--capa-alta);
}
.ficha-cabeza::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, var(--tono), transparent 55%);opacity:.15;
}
html[data-tema="claro"] .ficha-cabeza::after{opacity:.09}
.ficha-cabeza > *{position:relative;z-index:1}
.ficha-cabeza b{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em}
.ficha-cabeza small{display:block;font-size:12px;color:var(--txt-3);font-weight:500;margin-top:1px}

/* ===== CABECERA DE UNA PLATAFORMA =======================================
   Cuando se entra a una, manda ella: su color, su logo grande y todo lo que
   se puede hacer con ella, junto. */
.plat-hero{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;overflow:hidden;border-radius:var(--r-xl);
  border:1px solid var(--tono-linea);background:var(--capa);
  padding:var(--e5);display:flex;flex-direction:column;gap:var(--e4);
  box-shadow:var(--brillo), var(--sombra-2);
}
.plat-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 150% at 0% 0%, var(--tono) 0%, transparent 58%);
  opacity:.19;
}
html[data-tema="claro"] .plat-hero::after{opacity:.11}
.plat-hero::before{
  content:"";position:absolute;inset:0 0 auto;height:4px;z-index:2;
  background:linear-gradient(90deg, var(--tono), transparent 78%);
}
.plat-hero > *{position:relative;z-index:1}
.plat-hero-alto{display:flex;align-items:center;gap:var(--e3);flex-wrap:wrap}
.plat-hero-id{min-width:0;flex:1}
.plat-hero-id h2{font-size:25px;font-weight:750;letter-spacing:-.04em;line-height:1.1}
.plat-hero-id p{margin:3px 0 0;font-size:12.5px;color:var(--txt-3);font-weight:500}
@media (max-width:640px){
  .plat-hero{padding:var(--e4)}
  .plat-hero-id h2{font-size:20px}
  /* En el teléfono el «volver» va arriba del todo, como en cualquier app;
     colgado debajo del nombre parecía un botón más de la plataforma. */
  .plat-hero-alto > [data-plat="TODAS"]{order:-1;flex:1 1 100%;justify-content:flex-start}
  .plat-hero .mando{flex-direction:column;align-items:stretch}
  .plat-hero .mando .btn{width:100%}
}

/* La tarjeta de una plataforma dentro de la pila, con su color arriba. */
.tarjeta.de-plat{--tono:var(--txt-4);--tono-linea:var(--linea-fuerte)}
.tarjeta.de-plat::after{
  content:"";position:absolute;inset:0 0 auto;height:3px;z-index:2;
  background:linear-gradient(90deg, var(--tono), transparent 72%);
}
.tarjeta.de-plat > .tarjeta-cabeza{
  background:linear-gradient(180deg, var(--tono-suave), transparent);
}

/* El separador de tramo también se tiñe cuando agrupa por plataforma. */
.tramo.plat-tramo{--tono:var(--txt-4)}
.tramo.plat-tramo::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tono);
}

/* Aviso de que la fila sigue hacia el lado ------------------------------- */
.segmentos, .plataformas{ position:relative }
.segmentos.desborda, .plataformas.desborda{
  -webkit-mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 34px), transparent 100%);
  mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 34px), transparent 100%);
}
.segmentos.desborda-izq, .plataformas.desborda-izq{
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 34px), transparent 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 34px), transparent 100%);
}
.segmentos.desborda-fin, .plataformas.desborda-fin{
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 28px, #000 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 28px, #000 100%);
}

/* Cartel de "estás viendo solo esta plataforma" ------------------------- */
.cartel{
  display:flex;align-items:center;gap:var(--e3);
  padding:10px var(--e4);border-radius:var(--r-l);
  border:1px solid var(--marca-linea);background:var(--marca-suave);
}
/* Cuando el cartel habla de una plataforma, lleva el color de esa marca y
   no el rojo del programa: así se sabe de quién se está hablando. */
.cartel.de-plat{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;overflow:hidden;
  border-color:var(--tono-linea);background:var(--capa);
  padding:12px var(--e4);
}
.cartel.de-plat::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, var(--tono), transparent 52%);opacity:.16;
}
html[data-tema="claro"] .cartel.de-plat::after{opacity:.10}
.cartel.de-plat > *{position:relative;z-index:1}
.cartel b{display:block;font-size:13px;font-weight:700;letter-spacing:-.015em}
.cartel small{display:block;font-size:11.5px;color:var(--txt-3);font-weight:500}

/* Los botones de mando de una plataforma -------------------------------- */
.mando{
  display:flex;flex-wrap:wrap;gap:var(--e2);
  padding-bottom:var(--e3);
  border-bottom:1px solid var(--linea);
  margin-bottom:var(--e3);
}
.mando .btn{min-height:34px;min-width:0;max-width:100%}
/* Con un nombre largo -"Entrar a AMAZON PRIME"- y una pantalla de 320, el
   botón se salía de la tarjeta. Ahora el texto se recorta con puntos y el
   icono no se encoge. */
.mando .btn .et{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mando .btn svg{flex:0 0 auto}
@media (max-width:520px){
  .mando{display:grid;grid-template-columns:1fr 1fr}
  .mando .btn:first-child{grid-column:1 / -1}
}

/* Resumen de una plataforma --------------------------------------------- */
.resumen-plat{
  display:grid;gap:var(--e3);
  grid-template-columns:repeat(auto-fit,minmax(min(112px, 100%), 1fr));
}
.resumen-plat > div{min-width:0}
.resumen-plat dt{
  font-size:10.5px;font-weight:600;color:var(--txt-4);
  text-transform:uppercase;letter-spacing:.03em;
}
.resumen-plat dd{margin:2px 0 0;font-size:16px;font-weight:700;letter-spacing:-.025em}
.resumen-plat .barra{margin-top:7px;max-width:118px;height:4px}

/* Vacío ------------------------------------------------------------------ */
.vacio{
  padding:var(--e6) var(--e4);text-align:center;color:var(--txt-3);
  display:flex;flex-direction:column;align-items:center;gap:var(--e2);
}
.vacio svg{width:26px;height:26px;stroke-width:1.5;color:var(--txt-4)}
.vacio b{font-size:13.5px;font-weight:650;color:var(--txt-2)}
.vacio span{font-size:12.5px;max-width:320px}

/* Modal ------------------------------------------------------------------ */
.telon{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.66);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:var(--e4);
  opacity:0;pointer-events:none;transition:opacity var(--medio) var(--curva);
}
.telon.abierto{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;
  background:var(--capa);border:1px solid var(--linea-fuerte);border-radius:var(--r-xl);
  transform:translateY(10px) scale(.99);
  transition:transform var(--medio) var(--curva);
}
.telon.abierto .modal{transform:none}
.modal-cabeza{
  position:sticky;top:0;z-index:2;background:var(--capa);
  display:flex;align-items:center;gap:var(--e3);
  padding:var(--e4) var(--e4) var(--e3);border-bottom:1px solid var(--linea);
}
.modal-cabeza h2{font-size:15px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1}
.modal-cuerpo{padding:var(--e4);display:flex;flex-direction:column;gap:var(--e3)}
.modal-pie{
  position:sticky;bottom:0;background:var(--capa);border-top:1px solid var(--linea);
  padding:var(--e3) var(--e4);display:flex;gap:var(--e2);justify-content:flex-end;
}

/* La fila de WhatsApp ---------------------------------------------------- */
/* Cerrada desaparece del todo, sin animación de salida.
   Antes se apagaba con una transición, y las transiciones SE CONGELAN cuando
   la pestaña pasa a segundo plano: al abrir WhatsApp en otra pestaña, la
   barra se quedaba a medio apagar y seguía robando los toques de abajo.
   Aparecer sí se anima, que eso ocurre con la pestaña delante. */
#cola{
  display:none;
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:18px;z-index:150;width:min(760px, calc(100vw - 24px));
  background:var(--capa);border:1px solid var(--linea-fuerte);
  border-radius:var(--r-l);overflow:hidden;
  box-shadow:0 18px 44px -20px rgba(0,0,0,.7);
}
#cola.puesta{ display:block;animation:subeCola var(--medio) var(--curva) }
@keyframes subeCola{ from{ transform:translateX(-50%) translateY(115%) } to{ transform:translateX(-50%) translateY(0) } }
@media (prefers-reduced-motion:reduce){ #cola.puesta{ animation:none } }
.cola-barra{ height:3px;background:var(--linea) }
.cola-barra i{ display:block;height:100%;background:var(--bien);transition:width var(--medio) var(--curva) }

/* Quién es, arriba del todo. */
.cola-alto{ display:flex;align-items:center;gap:10px;padding:11px var(--e4) 8px }
.cola-quien{ min-width:0;flex:1 }
.cola-quien b{ display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
.cola-quien small{ display:block;font-size:11.5px;color:var(--txt-3);font-weight:550;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
.cola-marca{
  display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
  font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;
  color:var(--bien);border:1px solid var(--bien-linea);background:var(--bien-fondo);
  border-radius:99px;padding:3px 9px;
}
.cola-marca svg{ width:12px;height:12px;stroke-width:3 }
.cola-paso{ font-family:var(--cifra);font-size:11.5px;font-weight:700;color:var(--txt-4);flex:0 0 auto }

/* El mensaje, a la vista y editable. Antes se mandaba a ciegas. */
.cola-texto{ padding:0 var(--e4) 10px }
.cola-previa{
  margin:0;padding:10px 12px;border-radius:var(--r);
  background:var(--capa-alta);border:1px solid var(--linea);
  font-size:12.5px;line-height:1.55;color:var(--txt-2);
  white-space:pre-wrap;overflow-wrap:anywhere;
  max-height:76px;overflow:auto;
}
.cola-texto.editando textarea{
  width:100%;min-height:96px;font-size:12.5px;line-height:1.55;resize:vertical;
}
.cola-texto-pie{ display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px }
.cola-texto-pie .insignia{ margin-right:auto }

/* Qué hago. */
.cola-mando{ display:flex;align-items:center;gap:6px;padding:0 var(--e4) 10px }
.cola-mando .crece{ flex:1 }
.cola-mando select{ max-width:170px;min-height:36px!important;font-size:12px;flex:0 0 auto }
#cola .btn .et{ white-space:nowrap }
.cola-teclas{
  margin:0;padding:7px var(--e4) 9px;
  border-top:1px solid var(--linea);background:var(--capa-alta);
  font-size:10.5px;color:var(--txt-4);font-weight:600;letter-spacing:.02em;
}
@media (pointer: coarse){ .cola-teclas{ display:none } }

@media (max-width:860px){
  #cola{ bottom:calc(70px + env(safe-area-inset-bottom));width:calc(100vw - 14px) }
  .cola-alto{ padding:10px 12px 7px;gap:8px }
  /* El nombre es lo que hay que leer: la palabra «mandado» se queda en su
     tilde y el contador se encoge para dejarle sitio. */
  .cola-marca{ padding:4px;gap:0 }
  .cola-marca span, .cola-marca{ font-size:0 }
  .cola-marca svg{ width:14px;height:14px }
  .cola-paso{ font-size:10.5px }
  .cola-texto{ padding:0 12px 9px }
  .cola-previa{ max-height:78px;font-size:12px }
  /* Dos pisos: el mensaje que mandas y los dos botones grandes. */
  .cola-mando{
    display:grid;gap:7px;padding:0 12px 11px;
    grid-template-columns:1fr 1fr;
    grid-template-areas: "plant plant" "envia envia" "cobra salta";
  }
  .cola-mando select{ grid-area:plant;max-width:none;width:100% }
  #cola .btn[data-cola="enviar"]{ grid-area:envia;justify-content:center }
  #cola .btn[data-cola="cobrar"]{ grid-area:cobra;justify-content:center }
  #cola .btn[data-cola="saltar"]{ grid-area:salta;justify-content:center }
  #cola .cola-mando .btn{ min-height:46px;font-size:13.5px }
}
@media (max-width:360px){
  .cola-mando{ grid-template-areas: "plant plant" "envia envia" "cobra cobra" "salta salta" }
}

/* Con la fila puesta, los avisos se apartan por encima de ella, midiéndola
   de verdad en vez de suponer una altura. */
body.con-cola #avisos{ bottom:calc(var(--alto-cola, 64px) + 34px) }
@media (max-width:860px){
  body.con-cola #avisos{ bottom:calc(var(--alto-cola, 160px) + 86px + env(safe-area-inset-bottom)) }
}

/* Aviso flotante --------------------------------------------------------- */
#avisos{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:min(420px,calc(100vw - 32px));
}
#avisos .aviso{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:11px 14px;border-radius:var(--r);
  background:var(--capa-alta);border:1px solid var(--linea-fuerte);
  font-size:13px;font-weight:600;
  animation:sube var(--medio) var(--curva);
}
#avisos .aviso svg{width:16px;height:16px;stroke-width:2.2;flex:0 0 auto}
#avisos .aviso.bien{color:var(--bien);border-color:var(--bien-linea)}
#avisos .aviso.mal{color:var(--mal);border-color:var(--mal-linea)}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Estado de la nube ------------------------------------------------------ */
.nube-punto{width:7px;height:7px;border-radius:99px;background:var(--txt-4)}
.nube-punto.ok{background:var(--bien)}
.nube-punto.trabajando{background:var(--aviso);animation:late 1.4s ease-in-out infinite}
.nube-punto.mal{background:var(--mal)}
@keyframes late{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== PANTALLA TÁCTIL ==================================================
   Esto NO mira el ancho, mira si se toca con el dedo. Asi cubre igual el
   telefono chiquito, el grande, la tablet y un portatil tactil. Un boton de
   30 px se falla al tocarlo; la guia de Apple pide 44 y la de Android 48.
   ======================================================================== */
@media (pointer: coarse){
  /* En la ficha de una plataforma conviven insignias que se pulsan y otras
     que solo informan. Si solo crece la que se pulsa, la fila queda torcida:
     crecen las tres y se leen como una sola linea. */
  .ficha-marcas{ align-items:stretch }
  .ficha-marcas .insignia{ min-height:40px }
  .btn{ min-height:44px; padding:0 16px }
  .btn.mini{ min-height:40px; padding:0 13px }
  .btn.icono{ width:44px; padding:0 }
  .btn.icono.mini{ width:40px; padding:0 }
  .mando .btn{ min-height:42px }
  .segmentos{ padding:4px; gap:3px }
  .segmentos button{ min-height:40px; padding:0 14px; font-size:13px }
  .plat{ min-height:54px }
  input:not([type="checkbox"]):not([type="radio"]), select, textarea{ min-height:46px }
  input[type="checkbox"]{ width:22px; height:22px }
  .f{ padding-top:13px; padding-bottom:13px }
  .nav-btn{ min-height:56px }
  .carril-mini{ width:44px; height:44px }
  .mes{ min-height:44px }
  /* La insignia que se pulsa es un botón de verdad: en el teléfono tiene que
     poder tocarse con el dedo, no solo verse. */
  .insignia.pulsable{ min-height:44px; padding:0 13px; font-size:12px; border-radius:11px }
  /* Cobrar y escribir se pulsan cien veces al día, en una lista apretada de
     cien filas: 44 de lado, que es lo que mide un pulgar. */
  .f-acciones .btn.icono.mini{ width:44px; min-height:44px }
  .tc-mando .btn.mini{ min-height:44px }
  .tc-mando .btn.icono.mini{ width:44px }
  /* En la tabla, el nombre es el botón que abre la ficha: tiene que poder
     tocarse con el dedo, no solo verse. */
  .t-nom{ min-height:44px }
  .tabla .t-hacer .btn.icono.mini{ width:44px; min-height:44px }
  /* Nada de efectos de "pasar el ratón" donde no hay ratón. */
  .btn:hover, .f:hover, .plat:hover, .mes:hover, .metrica:hover{ background:inherit }
  .btn:active{ transform:scale(.97) }
  .f:active{ background:var(--capa-alta) }
}

.f-lia{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--linea)}
.f-lia:last-child{border-bottom:0}
.f-lia .f{border-bottom:0;flex:1;min-width:0}
.f-lia > .btn{flex:0 0 auto;margin-right:var(--e3)}

.comparar{width:100%;border-collapse:collapse;margin:0 0 var(--e3);font-size:13px}
.comparar th{padding:0 0 7px;font-size:10.5px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--txt-4);text-align:right}
.comparar th:first-child{text-align:left}
.comparar td{padding:7px 0;border-top:1px solid var(--linea);text-align:right;color:var(--txt-2)}
.comparar td:first-child{text-align:left;color:var(--txt-3)}
.comparar tr.menos td{color:var(--mal)}
.comparar tr.menos td b{color:var(--mal);font-weight:800}
.confirma-ojo{display:flex;gap:9px;align-items:flex-start;margin:0;
  padding:10px var(--e3);border-radius:var(--r-m);font-size:12.5px;line-height:1.6;
  border:1px solid var(--mal-linea);background:var(--mal-fondo);color:var(--txt-2)}
.confirma-ojo svg{width:16px;height:16px;flex:0 0 auto;color:var(--mal);margin-top:1px}
.confirma-ojo.suave{border-color:var(--linea);background:var(--capa-alta)}
.confirma-ojo.suave svg{color:var(--bien)}
.confirma-ojo b{color:var(--txt)}

.mudanza-donde{margin:0;font-size:12px;color:var(--txt-3);line-height:1.6}
.mudanza-donde code{font-family:var(--cifra);font-size:11.5px;color:var(--txt-2);
  background:var(--capa-alta);border:1px solid var(--linea);
  border-radius:6px;padding:2px 6px;word-break:break-all}
.aviso-mudanza{display:flex;gap:9px;align-items:flex-start;
  margin:var(--e3) 0 0;padding:10px var(--e3);border-radius:var(--r-m);
  border:1px dashed var(--aviso-linea);background:var(--aviso-fondo);
  font-size:12px;line-height:1.6;color:var(--txt-2)}
.aviso-mudanza svg{width:16px;height:16px;flex:0 0 auto;color:var(--aviso);margin-top:1px}
.aviso-mudanza b{color:var(--txt)}

.firma-aviso{flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px var(--e3);border-radius:var(--r-m);
  border:1px dashed var(--aviso-linea);background:var(--aviso-fondo)}
.firma-muestra{flex:1 1 200px;min-width:0;font-family:var(--fuente);
  font-size:12px;color:var(--txt-2);white-space:pre-wrap;word-break:break-word}

/* ---- La misma persona, en varias fichas ---- */
.tarjeta.persona .f-aqui{background:var(--marca-suave);cursor:default}
.tarjeta.persona .f-aqui b{color:var(--marca-alta)}
.tarjeta.persona .f-monto{font-weight:800;color:var(--txt-2)}
.tarjeta.persona .rojo{color:var(--mal)}

/* ---- Los grupos de la tabla de Hoy ---- */
.tabla .t-grupo > td{
  padding:11px var(--e3) 9px;
  background:var(--capa-alta);
  border-top:1px solid var(--linea-fuerte);
  border-bottom:1px solid var(--linea);
}
.tabla.agrupada tbody tr:first-child .t-grupo > td,
.tabla .t-grupo:first-child > td{border-top:0}
.tg-marca{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;
  border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.02em;
  vertical-align:middle;
  /* El color de la marca, rebajado: el mismo que ya lleva su ficha. */
  background:var(--tono-suave);border:1px solid var(--tono-linea);color:var(--txt)}
.tg-marca svg,.tg-marca img{width:16px;height:16px;border-radius:4px}
.tg-cuantos{margin-left:10px;font-size:11.5px;font-weight:600;color:var(--txt-3);
  vertical-align:middle}
.tg-cuantos .tg-mal{font-style:normal;color:var(--mal);font-weight:800}
.tg-suma{font-weight:800;color:var(--txt-2)}
/* La barrita de color de cada fila NO se pinta en la cabecera del grupo:
   la cabecera no es nadie a quien cobrar. */
.tabla .t-grupo > td::before{display:none}

.opciones-todos{gap:8px}
.opcion-todos{display:flex;align-items:flex-start;gap:var(--e3);width:100%;
  padding:var(--e3);border-radius:var(--r-m);text-align:left;
  border:1px solid var(--linea);background:var(--capa-alta);
  transition:border-color .14s}
.opcion-todos:hover{border-color:var(--marca)}
.opcion-todos b{display:block;font-size:13.5px;color:var(--txt)}
.opcion-todos small{display:block;margin-top:2px;font-size:11.5px;
  color:var(--txt-3);line-height:1.4}
.ot-ico{display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;
  border-radius:10px;border:1px solid var(--linea-fuerte);color:var(--txt-2)}
.ot-ico svg{width:17px;height:17px}
.ot-ico.bien{color:var(--bien);border-color:var(--bien-linea);background:var(--bien-fondo)}

.cola-seguido-si{color:var(--bien);font-weight:800}

.ayuda-modal{margin:0;font-size:12.5px;color:var(--txt-2);line-height:1.45}
.ayuda-modal b{color:var(--txt)}
.atajos-dias{flex-wrap:wrap;gap:6px}

/* ===== EL PANEL DE ESTILO ==============================================
   Se elige viendo, no leyendo: cada tono enseña sus tres capas de verdad
   y debajo hay una prueba con los tres tamaños de texto y el semáforo,
   así se ve antes de decidir si el renglón pequeño se lee o no. */
.estilo-grupo{display:flex;flex-direction:column;gap:8px}
.estilo-etq{font-size:11px;font-weight:800;letter-spacing:.07em;
            text-transform:uppercase;color:var(--txt-3)}
.tonos{display:grid;gap:var(--e2);
       grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.tono{display:flex;flex-direction:column;align-items:flex-start;gap:6px;
      padding:var(--e3);border-radius:var(--r-m);text-align:left;
      border:1px solid var(--linea);background:var(--capa-alta);
      transition:border-color .14s, transform .14s}
.tono b{font-size:13.5px;color:var(--txt)}
.tono small{font-size:11.5px;color:var(--txt-3);line-height:1.35}
.tono:hover{border-color:var(--linea-fuerte)}
.tono.vivo{border-color:var(--marca);box-shadow:0 0 0 1px var(--marca) inset}
.muestra-tono{display:block;position:relative;width:100%;height:52px;
              border-radius:9px;overflow:hidden;padding:6px;
              border:1px solid var(--linea-fuerte)}
.muestra-tono .mt-tarjeta{display:block;border-radius:5px;padding:6px;
                          height:26px}
.muestra-tono .mt-tarjeta b{display:block;height:5px;width:62%;border-radius:3px}
.muestra-tono .mt-tarjeta u{display:block;height:4px;width:40%;border-radius:3px;
                            margin-top:4px;opacity:.9}
.muestra-tono .mt-barra{display:block;height:10px;border-radius:4px;margin-top:5px}
.estilo-grupo .ayuda{margin:2px 0 0;font-size:11.5px;color:var(--txt-3);line-height:1.4}
.estilo-prueba{padding:var(--e3);border-radius:var(--r-m);
               border:1px solid var(--linea);background:var(--capa-alta)}
.estilo-prueba .ep-fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.estilo-prueba .ep-fila b{font-size:14px;color:var(--txt)}
.estilo-prueba .ep-2{margin:8px 0 0;font-size:12.5px;color:var(--txt-2)}
.estilo-prueba .ep-3{margin:4px 0 0;font-size:11.5px;color:var(--txt-4)}

/* ===== CELULAR ========================================================== */
@media (max-width:860px){
  #app{flex-direction:column}
  #carril{display:none}
  #barra{display:flex}
  /* Con el carril oculto, la marca pasa a la cabecera. */
  #marca-cabecera{display:block}
  /* En el teléfono la cabecera se parte en dos filas: arriba el título con
     el botón de acción, y el buscador entero debajo. Antes se apretaban los
     tres en la misma línea y el título salía cortado en cuatro renglones. */
  #cabecera{padding:calc(var(--e3) + env(safe-area-inset-top)) var(--e4) var(--e3);
            flex-wrap:wrap; row-gap:9px}
  /* Ojo: esto apuntaba al «primer div», y al meter la marca delante pasó a
     pillarla a ella, que se estiraba a 165px de ancho por 38 de alto. Ahora
     se nombra el bloque del título, que es lo que de verdad tiene que
     estirarse. */
  /* Base 0, no «auto»: con «auto» el bloque pedía todo el ancho de su
     texto más largo, no cabía al lado del logo y se iba a su propio
     renglón, dejando al logo solo arriba como si fuera un adorno. */
  #cabecera > .cabecera-txt{flex:1 1 0;min-width:0}
  #cabecera > .crece{display:none}
  #titulo{font-size:17px}
  /* El resumen puede ocupar dos renglones antes de cortarse. En una línea
     sola se quedaba en «102 clientes · 102/1…», que no dice nada. */
  #subtitulo{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
             overflow:hidden;white-space:normal;line-height:1.3}
  /* En el teléfono el botón de acción va arriba, junto al título, que es
     donde se busca con el pulgar; el buscador se lleva su propio renglón. */
  #btn-accion{order:1;flex:0 0 auto}
  #btn-accion #btn-accion-txt{max-width:36vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* El "volver al de siempre" se queda solo en Ajustes: aquí se llevaba un
     renglón entero de la cabecera para un botón que se usa una vez. */
  #btn-viejo-movil{display:none}
  .buscador{flex:1 1 100%;order:4}
  /* El mando del mes: la flecha de «siguiente» no cabía por dos dedos y se
     caía al renglón de abajo, dejando un hueco en blanco del alto de media
     tarjeta. Se quita el adorno, el desplegable cede ancho y las dos
     flechas se quedan donde se buscan: al lado del mes. */
  .mes-mando > .cabeza-icono{display:none}
  .mes-mando > select{flex:1 1 90px}
  .mes-mando > .crece{display:none}
  #lienzo{padding:var(--e4) var(--e3)}
  .r4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .r3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metrica{padding:var(--e3)}
  .metrica .v{font-size:21px}
  /* Lo mismo dentro de las tarjetas: el título arriba y los filtros debajo. */
  .tarjeta-cabeza{flex-wrap:wrap;row-gap:10px}
  .resumen-plat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plat b{max-width:130px}
  /* El icono y el título comparten renglón; lo demás baja. Antes el título
     se iba a su propia línea y la cabecera se comía media pantalla antes de
     enseñar el primer cliente. */
  .tarjeta-cabeza > .crece{flex:1 1 calc(100% - 50px);min-width:0}
  .tarjeta-cabeza{padding:var(--e4) var(--e4) var(--e3)}
  .tarjeta-cuerpo{padding:0 var(--e4) var(--e4)}
  .tarjeta-cabeza h2{font-size:15.5px}
  .tarjeta-cabeza p{font-size:12px}
  .tarjeta-cabeza .segmentos{flex:1 1 100%;order:5}
  .fila > .segmentos{flex:1 1 100%}
  .fila > select{flex:1 1 45%;max-width:none!important}
  .f{padding:11px var(--e3)}
  #avisos{bottom:calc(74px + env(safe-area-inset-bottom))}
  .modal{max-width:none;max-height:92dvh;border-radius:var(--r-xl) var(--r-xl) 0 0;align-self:flex-end}
  .telon{align-items:flex-end;padding:0}
  .telon.abierto .modal{transform:none}
  .modal-pie{padding-bottom:calc(var(--e3) + env(safe-area-inset-bottom))}
}

/* ===== EL CAMINO Y LAS SUBPANTALLAS ====================================
   Clientes y Cuentas eran dos pantallas que contaban la misma historia por
   separado. Ahora es una sola en la que se ENTRA: plataforma → cuenta →
   perfil → cliente. Arriba del todo, siempre, por dónde vas y cómo volver. */
.migas{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.miga-volver{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  height:34px;padding:0 13px 0 10px;border-radius:99px;
  border:1px solid var(--linea-fuerte);background:var(--capa);color:var(--txt-2);
  font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;
  box-shadow:var(--brillo), var(--sombra-1);
  transition:background var(--rapido) var(--curva), color var(--rapido) var(--curva),
             border-color var(--rapido) var(--curva);
}
.miga-volver:hover{background:var(--capa-alta);color:var(--txt);border-color:var(--txt-4)}
.miga-volver svg{width:15px;height:15px;flex:0 0 auto}
.migas .miga{
  border:0;background:transparent;padding:0;font:inherit;font-size:12px;font-weight:600;
  color:var(--txt-3);cursor:pointer;min-width:0;max-width:40vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.migas button.miga:hover{color:var(--txt);text-decoration:underline}
.migas b.miga{cursor:default}
.migas .miga.viva{color:var(--txt);font-weight:750}
.miga-sep{color:var(--txt-4);font-style:normal;font-size:12px;flex:0 0 auto}
/* En el teléfono solo cabe dónde estás; el resto lo dice el botón de volver. */
@media (max-width:620px){
  .migas button.miga, .migas .miga-sep{display:none}
  .migas .miga.viva{max-width:none}
}
@media (pointer:coarse){ .miga-volver{height:40px} }

/* La hoja: la cabecera de una subpantalla, con el color de su plataforma. */
.hoja{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;overflow:hidden;
  padding:var(--e5);border-radius:var(--r-xl);
  border:1px solid var(--linea);background:var(--capa);
  box-shadow:var(--brillo), var(--sombra-2);
  display:flex;flex-direction:column;gap:var(--e4);
}
.hoja::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 0% 0%, var(--tono) 0%, transparent 60%);
  opacity:.15;
}
html[data-tema="claro"] .hoja::after{opacity:.09}
.hoja::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg, var(--tono), transparent 82%);
}
.hoja > *{position:relative;z-index:2}
.hoja-alto{display:flex;align-items:center;gap:var(--e3);min-width:0}
.hoja-id{min-width:0;flex:1}
.hoja-id h2{margin:0;font-size:21px;font-weight:780;letter-spacing:-.03em;overflow-wrap:anywhere}
.hoja-id p{
  margin:5px 0 0;font-size:12px;color:var(--txt-3);font-weight:550;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.hoja-monto{text-align:right;flex:0 0 auto}
.hoja-monto b{display:block;font-family:var(--cifra);font-size:25px;font-weight:700;letter-spacing:-.04em}
.hoja-monto small{
  display:block;font-size:10px;color:var(--txt-4);font-weight:650;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;
}
.hoja .mando{
  border-top:1px solid var(--linea);border-bottom:0;
  padding-top:var(--e3);padding-bottom:0;margin:0;
}
.hoja .datos{border-top:1px solid var(--linea);padding-top:var(--e3);margin:0}
@media (max-width:560px){
  .hoja{padding:var(--e4);gap:var(--e3);border-radius:var(--r-l)}
  .hoja-id h2{font-size:18px}
  .hoja-alto{flex-wrap:wrap}
  .hoja-alto > .logo-plat, .hoja-alto > .logo{flex:0 0 auto}
  .hoja-id{flex:1 1 140px}
  .hoja-monto{
    order:9;width:100%;text-align:left;
    display:flex;align-items:baseline;gap:8px;
    border-top:1px solid var(--linea);padding-top:10px;
  }
  .hoja-monto small{margin:0}
  .hoja-monto b{font-size:21px}
  .hoja .mando .btn{justify-content:center}
}

/* ===== LOS PERFILES DE UNA CUENTA =====================================
   La casilla es la unidad de verdad del negocio: un perfil, o lo ocupa
   alguien o está libre. Verlas todas juntas dice de un golpe cuánto sitio
   te queda, que era la pregunta que había que cruzar entre dos pantallas. */
.perfiles{display:grid;gap:var(--e3);grid-template-columns:repeat(auto-fill,minmax(min(232px, 100%), 1fr))}
.perfil{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;display:flex;flex-direction:column;gap:9px;min-width:0;
  padding:13px var(--e4) 12px;border-radius:var(--r-l);
  border:1px solid var(--linea);background:var(--capa);
  box-shadow:var(--brillo), var(--sombra-1);
}
.perfil.mal  {border-color:var(--mal-linea)}
.perfil.aviso{border-color:var(--aviso-linea)}
.perfil.libre{border-style:dashed;background:transparent;box-shadow:none;justify-content:center}
.perfil-n{
  position:absolute;top:11px;right:13px;font-size:10px;font-weight:750;
  color:var(--txt-4);letter-spacing:.06em;text-transform:uppercase;
}
.perfil-quien{display:flex;align-items:center;gap:9px;min-width:0;padding-right:60px}
.perfil-quien .crece{min-width:0;flex:1}
.perfil-quien b{
  display:block;font-size:14.5px;font-weight:700;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.perfil-quien small{display:block;font-size:11px;color:var(--txt-3);font-weight:550;margin-top:2px}
.perfil-pie{
  display:flex;align-items:center;gap:8px;
  border-top:1px solid var(--linea);padding-top:9px;margin-top:auto;
}
.perfil-pie .cifra{font-size:15px;font-weight:700;letter-spacing:-.03em}
.perfil-pie .crece{flex:1;min-width:0}
.perfil-mando{display:flex;gap:6px;align-items:center}
.perfil-mando .crece{flex:1;min-width:0}
.perfil.mal   .tc-cobrar{color:var(--mal);  border-color:rgba(244,63,94,.32)}
.perfil.aviso .tc-cobrar{color:var(--aviso);border-color:rgba(245,158,11,.32)}
.perfil.mal   .tc-cobrar:hover{background:var(--mal-fondo);  border-color:var(--mal-linea);  color:var(--mal)}
.perfil.aviso .tc-cobrar:hover{background:var(--aviso-fondo);border-color:var(--aviso-linea);color:var(--aviso)}
.perfil-vacio{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  text-align:center;padding:var(--e4) 0 var(--e2);color:var(--txt-4);
}
.perfil-vacio svg{width:22px;height:22px;stroke-width:1.7}
.perfil-vacio b{font-size:12.5px;font-weight:650;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.06em}
@media (max-width:480px){
  .perfiles{grid-template-columns:minmax(0,1fr);gap:var(--e2)}
}

/* Lo que te ha pagado un cliente, en la pantalla del cliente. */
.historial{display:flex;flex-direction:column}
.historial .h{
  display:flex;align-items:center;gap:var(--e3);
  padding:11px var(--e5);border-top:1px solid var(--linea);font-size:13px;
}
.historial .h:first-child{border-top:0}
.historial .h .crece{flex:1;min-width:0;color:var(--txt-2);font-weight:550}
.historial .h small{font-size:11px;color:var(--txt-4);font-weight:600;white-space:nowrap}
.historial .h .cifra{font-weight:700;color:var(--bien);white-space:nowrap}
@media (max-width:640px){ .historial .h{padding:11px var(--e3)} }


/* ===== DESHACER, NOTAS, PRECIOS Y REVISIÓN ============================ */
/* El botón de deshacer dentro del propio aviso: donde estás mirando. */
/* El aviso entero deja pasar los clics para no tapar la pantalla; el botón,
   que es lo único que se pulsa ahí, los recoge. */
.aviso-deshacer{
  pointer-events:auto;
  margin-left:auto;flex:0 0 auto;
  border:1px solid currentColor;background:transparent;color:inherit;
  font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;
  height:26px;padding:0 11px;border-radius:99px;opacity:.9;
}
.aviso-deshacer:hover{opacity:1;background:rgba(255,255,255,.08)}
@media (pointer: coarse){ .aviso-deshacer{height:34px;padding:0 14px} }

/* Una nota escrita a mano, dentro de la hoja. */
.nota-caja{
  display:flex;gap:10px;align-items:flex-start;
  border-top:1px solid var(--linea);padding-top:var(--e3);margin-top:var(--e2);
  font-size:13px;color:var(--txt-2);line-height:1.6;
}
.nota-caja svg{width:16px;height:16px;flex:0 0 auto;color:var(--txt-4);margin-top:2px}
.nota-caja span{white-space:pre-wrap;overflow-wrap:anywhere}

/* Los tres precios, uno al lado del otro: de dónde viene, dónde está y
   adónde va. Es la única forma de leerlos sin pensar. */
.precios-ahora{
  display:grid;gap:var(--e2);
  grid-template-columns:repeat(3, minmax(0,1fr));
}
.precios-ahora .pr{
  min-width:0;padding:11px var(--e3);border-radius:var(--r);
  border:1px solid var(--linea);background:var(--capa-alta);
}
.precios-ahora .pr.viva{border-color:var(--marca-linea);background:var(--marca-suave)}
.precios-ahora .pr.futuro{border-color:var(--info-linea);background:var(--info-fondo)}
.precios-ahora dt{
  font-size:9.5px;font-weight:700;color:var(--txt-4);
  text-transform:uppercase;letter-spacing:.07em;
}
.precios-ahora dd{margin:3px 0 0;font-size:19px;font-weight:750;letter-spacing:-.035em}
.precios-ahora .pr.viva dd{color:var(--marca-alta)}
.precios-ahora .pr.futuro dd{color:var(--info)}
.precios-ahora small{display:block;font-size:10.5px;color:var(--txt-4);font-weight:550;margin-top:2px}
.precios-ahora.grande dd{font-size:23px}
@media (max-width:560px){
  .precios-ahora{grid-template-columns:minmax(0,1fr)}
  .precios-ahora .pr{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .precios-ahora dd{margin:0;font-size:17px}
  .precios-ahora small{margin:0}
}

/* La línea del tiempo de precios: cada escalón con su fecha. */
.linea-precios{display:flex;flex-direction:column;gap:5px}
.linea-precios.ancha{margin-top:var(--e4)}
.linea-precios .lp{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;text-align:left;
  padding:9px var(--e3);border-radius:var(--r);
  border:1px solid var(--linea);background:var(--capa-alta);
  font:inherit;color:var(--txt-2);
}
.linea-precios .lp.pulsable{cursor:pointer}
.linea-precios .lp.pulsable:hover{border-color:var(--linea-fuerte);color:var(--txt)}
.linea-precios .lp.pasado{opacity:.72}
.linea-precios .lp.ahora{border-color:var(--marca-linea);background:var(--marca-suave);opacity:1;color:var(--txt)}
.linea-precios .lp.futuro{border-style:dashed;border-color:var(--info-linea);color:var(--info)}
.lp-fecha{font-size:12px;font-weight:600;flex:1;min-width:90px}
.lp-monto{font-size:14px;font-weight:750;letter-spacing:-.03em;color:var(--txt)}
.lp-marca{
  font-size:9.5px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;
  padding:2px 8px;border-radius:99px;background:var(--marca);color:#fff;
}
.lp-marca.futuro{background:var(--info);color:var(--tinta-info)}
.lp-nota{flex:1 0 100%;font-size:11px;color:var(--txt-4);font-weight:500}
@media (pointer: coarse){ .linea-precios .lp{min-height:44px} }

/* Los perfiles como botones, al mover a alguien de sitio. */
.huecos{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.hueco{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:56px;padding:8px 6px;border-radius:var(--r);
  border:1px dashed var(--linea-fuerte);background:transparent;
  font:inherit;color:var(--txt-2);cursor:pointer;
}
.hueco b{font-size:15px;font-weight:750;letter-spacing:-.02em}
.hueco small{font-size:10px;color:var(--txt-4);font-weight:600;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hueco:hover{border-color:var(--txt-4);color:var(--txt)}
.hueco.ocupado{border-style:solid;background:var(--capa-alta)}
.hueco.viva{
  border-style:solid;border-color:var(--marca);background:var(--marca-suave);color:var(--txt);
  box-shadow:0 0 0 1px var(--marca-linea);
}
@media (pointer: coarse){ .hueco{min-height:64px} }

/* La revisión de datos: un lío por fila, con su cuenta y su puerta. */
.diags{display:flex;flex-direction:column}
.diag{
  display:flex;align-items:center;gap:var(--e3);width:100%;text-align:left;
  padding:13px var(--e5);border:0;border-top:1px solid var(--linea);
  background:transparent;font:inherit;color:var(--txt);cursor:pointer;
}
.diag:first-child{border-top:0}
.diag:hover{background:var(--capa-alta)}
.diag-n{
  flex:0 0 auto;min-width:34px;height:28px;padding:0 9px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:750;font-family:var(--cifra);
  background:var(--capa-alta);color:var(--txt-2);border:1px solid var(--linea);
}
.diag.mal   .diag-n{color:var(--mal);  border-color:var(--mal-linea);  background:var(--mal-fondo)}
.diag.aviso .diag-n{color:var(--aviso);border-color:var(--aviso-linea);background:var(--aviso-fondo)}
.diag-txt{flex:1;min-width:0}
.diag-txt b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.015em}
.diag-txt small{display:block;font-size:11.5px;color:var(--txt-3);font-weight:500;line-height:1.5;margin-top:2px}
.diag-ir{flex:0 0 auto;color:var(--txt-4)}
.diag-ir svg{width:16px;height:16px}
@media (max-width:640px){ .diag{padding:13px var(--e3)} }
@media (pointer: coarse){ .diag{min-height:56px} }


/* ===== QUE SE PUEDA USAR DE VERDAD ===================================== */
/* El enlace que se salta el menú entero. Invisible hasta que lo pisas con
   el tabulador, que es justo cuando hace falta. */
.saltar{
  position:fixed;top:-100px;left:12px;z-index:400;
  display:inline-flex;align-items:center;height:44px;padding:0 18px;
  border-radius:0 0 var(--r) var(--r);
  background:var(--marca);color:#fff;
  font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:var(--sombra-3);
  transition:top var(--rapido) var(--curva);
}
.saltar:focus{top:0}

/* El título recibe el foco al entrar a una subpantalla, pero no es un botón:
   se marca con una línea discreta, no con un recuadro de formulario. */
#titulo:focus{outline:none}
#titulo:focus-visible{
  outline:none;
  box-shadow:0 3px 0 -1px var(--marca);
  border-radius:3px;
}
#lienzo:focus{outline:none}

/* Todo lo que se pulsa se ve cuando lo pisa el tabulador. Sin esto, con el
   teclado no sabes dónde estás. */
:focus-visible{
  outline:2px solid var(--marca-alta);
  outline-offset:2px;
  border-radius:var(--r-s);
}
.segmentos button:focus-visible,
.pastel:focus-visible,
.hueco:focus-visible,
.diag:focus-visible{outline-offset:-2px}

/* Si el sistema pide menos movimiento, no se mueve nada. Hay gente a la que
   las animaciones le marean de verdad. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .ficha:hover, .tc:hover{transform:none}
  .nube-punto.trabajando{animation:none}
}


/* ===== EL CARRIL DE PLATAFORMAS SE MUEVE =============================== */
/* Con nueve plataformas la tira se sale de la pantalla y la barra de
   desplazamiento está escondida a propósito. Con el dedo se arrastra; con
   ratón no había nada que tocar. Ahora hay flechas, rueda y arrastre. */
.carril-plat{position:relative;min-width:0}
.carril-flecha{
  position:absolute;top:50%;transform:translateY(-50%);z-index:4;
  width:32px;height:32px;border-radius:99px;
  display:none;align-items:center;justify-content:center;
  border:1px solid var(--linea-fuerte);background:var(--capa-alta);color:var(--txt-2);
  box-shadow:var(--sombra-2);cursor:pointer;padding:0;
  transition:opacity var(--rapido) var(--curva), color var(--rapido) var(--curva);
}
.carril-plat.con-flechas .carril-flecha{display:flex}
.carril-flecha svg{width:16px;height:16px;stroke-width:2.4}
.carril-flecha.izq{left:-6px}
.carril-flecha.der{right:-6px}
.carril-flecha:hover{color:var(--txt);border-color:var(--txt-4)}
.carril-flecha.apagada{opacity:0;pointer-events:none}
/* Con el dedo sobran: la tira ya se arrastra. */
@media (pointer: coarse){ .carril-plat.con-flechas .carril-flecha{display:none} }
@media (max-width:860px){ .carril-plat.con-flechas .carril-flecha{display:none} }

.mando-plat{cursor:grab}
.mando-plat.arrastrando{cursor:grabbing;scroll-snap-type:none}
.mando-plat.arrastrando .pastel{pointer-events:none}
/* Los velos de los bordes dicen que hay más hacia ese lado. */
.mando-plat.desborda, .mando-plat.desborda-izq, .mando-plat.desborda-fin{
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
}
.mando-plat.desborda{
  -webkit-mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 26px), transparent 100%);
  mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 26px), transparent 100%);
}
.mando-plat.desborda-fin{
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 100%);
}


/* ===== TRABAJAR CON VARIOS A LA VEZ ==================================== */
.elegir-fila{align-items:center;gap:var(--e3)}
.elegir-fila .pista{margin:0;flex:1;min-width:0}
@media (max-width:640px){ .elegir-fila .pista{display:none} }

/* La casilla ocupa la tarjeta entera: en modo elegir, tocar en cualquier
   sitio marca, que es lo que espera la mano. El marco dice cuál está. */
.tc-marca{
  position:absolute;inset:0;z-index:3;border:0;background:transparent;cursor:pointer;
  border-radius:inherit;display:flex;align-items:flex-start;justify-content:flex-end;
  padding:10px;color:var(--marca);
}
.tc-marca svg{
  width:20px;height:20px;stroke-width:3;flex:0 0 auto;
  background:var(--marca);color:#fff;border-radius:99px;padding:3px;
}
.tc.elegido{
  border-color:var(--marca);
  box-shadow:var(--brillo), 0 0 0 1px var(--marca-linea), var(--sombra-2);
}
.tc.elegido::after{opacity:.02}
/* Un cliente en pausa se ve apagado, pero se ve. */
.tc.pausado{opacity:.62}
.tc.pausado .pastilla{color:var(--txt-3)}

/* La barra de abajo con lo que se puede hacer con los elegidos. */
.lote{
  position:sticky;bottom:0;z-index:12;
  display:flex;align-items:center;gap:var(--e3);flex-wrap:wrap;
  margin-top:var(--e3);padding:var(--e3) var(--e4);
  border-top:1px solid var(--linea-fuerte);
  background:var(--capa-alta);
  box-shadow:0 -10px 24px -18px rgba(0,0,0,.7);
}
.lote-cuenta{display:flex;align-items:baseline;gap:7px;flex:0 0 auto}
.lote-cuenta b{font-size:19px;font-weight:780;letter-spacing:-.03em;font-family:var(--cifra)}
.lote-cuenta span{font-size:12px;color:var(--txt-3);font-weight:600}
.lote-botones{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;justify-content:flex-end}
@media (max-width:700px){
  .lote{padding:var(--e3);bottom:0}
  .lote-botones{justify-content:flex-start}
  .lote-botones .btn{flex:1 1 auto;justify-content:center}
}


/* ===== PANELES DE MANDO ================================================
   Una lista dice qué hay. Un panel dice qué hay, cuánto pesa y qué hacer.
   Tres cifras arriba y un botón que actúa sobre el montón entero. */
.panel-mando{
  position:relative;overflow:hidden;
  border:1px solid var(--linea);border-radius:var(--r-xl);
  background:var(--capa);box-shadow:var(--brillo), var(--sombra-2);
}
.panel-mando.peligro{border-color:var(--mal-linea)}
.panel-mando.peligro::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg, var(--mal), transparent 78%);
}
/* El aviso de lo que va a caer. Ámbar, no rojo: todavía estás a tiempo, y
   si esto fuera rojo competiría con lo que ya se cayó, que es peor. */
.panel-mando.urgente{border-color:var(--aviso-linea);background:var(--capa)}
.panel-mando.urgente::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg, var(--aviso), transparent 78%);
}
.panel-mando.urgente .pm-icono{
  background:var(--aviso-fondo);border-color:var(--aviso-linea);color:var(--aviso);
}
.pm-pie{
  padding:10px var(--e4);border-top:1px solid var(--linea);
  color:var(--txt-3);font-size:11.5px;font-weight:600;
}
.pm-alto{
  display:flex;align-items:center;gap:var(--e3);
  padding:var(--e4) var(--e5) var(--e3);
}
.pm-icono{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  display:grid;place-items:center;
  background:var(--mal-fondo);color:var(--mal);border:1px solid var(--mal-linea);
}
.pm-icono svg{width:19px;height:19px;stroke-width:2}
.pm-id{flex:1;min-width:0}
.pm-id h2{margin:0;font-size:16px;font-weight:750;letter-spacing:-.025em;color:var(--mal)}
.pm-id p{margin:3px 0 0;font-size:12.5px;color:var(--txt-3);font-weight:500;line-height:1.5}

/* La fila de cifras: es lo que convierte una lista en un tablero. */
.pm-cifras{
  display:grid;gap:1px;
  grid-template-columns:repeat(4, minmax(0,1fr));
  background:var(--linea);
  border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);
}
.pm-cifras.tres{grid-template-columns:repeat(3, minmax(0,1fr))}
.pmc{
  --t:var(--txt);
  background:var(--capa);padding:13px var(--e4);min-width:0;
}
.pmc.mal{--t:var(--mal)} .pmc.aviso{--t:var(--aviso)}
.pmc.bien{--t:var(--bien)} .pmc.info{--t:var(--info)}
.pmc dt{
  font-size:9.5px;font-weight:750;color:var(--txt-4);
  text-transform:uppercase;letter-spacing:.08em;
}
.pmc dd{margin:4px 0 0;font-size:22px;font-weight:780;letter-spacing:-.04em;color:var(--t)}
.pmc small{display:block;font-size:10.5px;color:var(--txt-4);font-weight:550;margin-top:2px}
.pm-cuerpo{padding:0}
.pm-cuerpo > .lista > * + *{border-top:1px solid var(--linea)}
@media (max-width:860px){ .pm-cifras{grid-template-columns:repeat(2, minmax(0,1fr))} }
@media (max-width:560px){
  .pm-alto{padding:var(--e3);flex-wrap:wrap}
  .pm-id{flex:1 1 140px}
  .pm-alto .btn{width:100%;justify-content:center}
  .pmc{padding:11px var(--e3)}
  .pmc dd{font-size:19px}
}
/* La fila de una cuenta vencida lleva su botón de renovar a la vista. */
.f-vencida .f-acciones{padding-right:var(--e4)}
@media (max-width:640px){ .f-vencida .f-acciones{padding-right:var(--e3)} }
/* En un teléfono de 320 no caben el logo, el nombre, los días, el coste y
   el botón en la misma línea: el botón se salía por la derecha. Se parte en
   dos pisos y el de renovar ocupa todo el ancho, que además se toca mejor. */
@media (max-width:560px){
  .f-vencida{
    display:grid;align-items:center;gap:8px 10px;
    grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"logo txt" "der der" "acc acc";
  }
  .f-vencida > .f-marca{grid-area:logo}
  .f-vencida > .f-txt{grid-area:txt;min-width:0}
  .f-vencida > .f-der{
    grid-area:der;flex-direction:row;align-items:center;
    gap:9px;text-align:left;flex-wrap:wrap;
  }
  .f-vencida > .f-acciones{grid-area:acc;padding:0;display:flex;gap:6px;width:100%}
  .f-vencida > .f-acciones .btn:first-child{flex:1;justify-content:center}
}

/* El pie de la tabla de cobros: qué estás viendo y qué puedes hacer. */
.pie-tabla{
  display:flex;align-items:center;gap:var(--e3);flex-wrap:wrap;
  padding:12px var(--e5);
  border-top:1px solid var(--linea-fuerte);
  background:var(--capa-alta);
}
.pt-txt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pt-txt b{font-size:14px;font-weight:780;letter-spacing:-.02em;font-family:var(--cifra)}
.pt-txt span{font-size:12px;color:var(--txt-3);font-weight:550}
.pt-botones{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){
  .pie-tabla{padding:12px var(--e3)}
  .pt-botones{width:100%}
  .pt-botones .btn{flex:1 1 auto;justify-content:center}
}

/* ===== SITIOS LIBRES ===================================================
   Antes: dieciocho filas iguales. Ahora: una tarjeta por plataforma, sus
   cuentas dentro y los huecos como casillas que se pulsan. */
.libres-rejilla{
  display:grid;gap:var(--e3);padding:var(--e4) var(--e5) var(--e5);
  grid-template-columns:repeat(auto-fill, minmax(min(290px, 100%), 1fr));
}
.libre-plat{
  --tono:var(--txt-4);--tono-linea:var(--linea-fuerte);--tono-suave:transparent;
  position:relative;overflow:hidden;min-width:0;
  border:1px solid var(--linea);border-radius:var(--r-l);
  background:var(--capa-alta);
}
.libre-plat::before{
  content:"";position:absolute;inset:0 0 auto;height:2px;
  background:linear-gradient(90deg, var(--tono), transparent 80%);
}
.lb-alto{display:flex;align-items:center;gap:10px;padding:12px var(--e4) 10px;min-width:0}
.lb-id{flex:1;min-width:0}
.lb-id b{display:block;font-size:14px;font-weight:750;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-id small{display:block;font-size:11px;color:var(--txt-3);font-weight:550;margin-top:1px}
.lb-cuentas{display:flex;flex-direction:column;border-top:1px solid var(--linea)}
.lb-cuenta{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px var(--e4);border-top:1px solid var(--linea);
}
.lb-cuenta:first-child{border-top:0}
.lb-nombre{
  flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0;
  font:inherit;font-size:12px;font-weight:650;color:var(--txt-2);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lb-nombre:hover{color:var(--txt);text-decoration:underline}
.lb-huecos{display:flex;gap:5px;flex-wrap:wrap}
/* Cada hueco es una casilla numerada que se pulsa para meter a alguien. */
.hueco-chip{
  display:inline-flex;align-items:center;gap:3px;
  height:28px;min-width:38px;padding:0 8px;border-radius:8px;
  border:1px dashed var(--tono-linea);background:transparent;
  font:inherit;color:var(--txt-2);cursor:pointer;
  transition:background var(--rapido) var(--curva), color var(--rapido) var(--curva),
             border-color var(--rapido) var(--curva);
}
.hueco-chip i{font-style:normal;font-size:12.5px;font-weight:750;font-family:var(--cifra)}
.hueco-chip svg{width:12px;height:12px;stroke-width:2.6;opacity:.6}
.hueco-chip:hover{
  border-style:solid;border-color:var(--bien-linea);
  background:var(--bien-fondo);color:var(--bien);
}
.hueco-chip:hover svg{opacity:1}
@media (pointer: coarse){ .hueco-chip{height:40px;min-width:46px} }
@media (max-width:640px){
  .libres-rejilla{grid-template-columns:minmax(0,1fr);padding:var(--e3)}
  .lb-alto{padding:11px var(--e3) 9px}
  .lb-cuenta{padding:9px var(--e3)}
}

/* ===== AJUSTES POR SECCIONES =========================================== */
.secciones-aj button{gap:7px}
.secciones-aj button svg{width:15px;height:15px;flex:0 0 auto}
.pila-aj{display:flex;flex-direction:column;gap:var(--e5)}
@media (min-width:1180px){
  .pila-aj{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:var(--e5);align-items:start}
  .pila-aj > .ancha{grid-column:1 / -1}
}

/* La cabecera de cada plataforma en la lista de clientes: antes era una
   línea de texto gris; ahora tiene cuerpo, sus cuentas en pastillas y el
   dinero con su etiqueta. */
.panel-cabeza{gap:12px}
.panel-id{min-width:0;flex:1}
.panel-id b{display:block;font-size:14.5px;font-weight:780;letter-spacing:-.02em}
.panel-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.panel-pills .pp{
  font-style:normal;font-size:10.5px;font-weight:700;
  padding:2px 8px;border-radius:99px;
  border:1px solid var(--linea);background:var(--capa);color:var(--txt-3);
  white-space:nowrap;
}
.panel-pills .pp.mal  {color:var(--mal);  border-color:var(--mal-linea);  background:var(--mal-fondo)}
.panel-pills .pp.aviso{color:var(--aviso);border-color:var(--aviso-linea);background:var(--aviso-fondo)}
.panel-suma{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto;line-height:1.2}
.panel-suma i{
  font-style:normal;font-size:9.5px;font-weight:750;color:var(--txt-4);
  text-transform:uppercase;letter-spacing:.08em;
}
.panel-suma b{font-size:15px;font-weight:780;letter-spacing:-.03em}
@media (max-width:640px){
  .panel-suma i{display:none}
  .panel-pills .pp{font-size:10px;padding:2px 7px}
}


/* Un tilde de WhatsApp en la tarjeta del que ya recibió su mensaje hoy: sin
   esto, en una ronda de cuarenta no sabes por dónde ibas. */
.marca-escrito{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:20px;height:20px;border-radius:99px;
  background:var(--bien-fondo);border:1px solid var(--bien-linea);color:var(--bien);
}
.marca-escrito svg{width:11px;height:11px;stroke-width:2.4}


/* ===== EL ESTADO SE VE DESDE LEJOS =====================================
   Vencido, por vencer y al día no se distinguen por un matiz de rojo: se
   distinguen por color, por forma y por icono. Y la tarjeta entera lleva
   un filo grueso del color, que es lo que se ve sin leer nada. */
.pastilla{
  display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  border-radius:99px;padding:3px 10px;
  font-size:11.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  border:1px solid transparent;
}
.pastilla svg{width:12px;height:12px;stroke-width:2.6;flex:0 0 auto}
.pastilla b{font-weight:750}
.pastilla i{font-style:normal;opacity:.75;font-weight:600}
/* Lo que pide acción va relleno: se ve antes que nada en la pantalla.
   Y va como el logotipo: su contorno oscuro y su canto debajo. Es la misma
   regla, no un parecido -toda pieza rellena de color es una pegatina-. */
.pastilla.llena{
  box-shadow:0 0 0 1.5px var(--contorno), inset 0 -2px 0 0 var(--canto);
}
.pastilla.llena.mal   {background:var(--mal);   color:var(--tinta-mal)}
.pastilla.llena.aviso {background:var(--aviso); color:var(--tinta-aviso)}
.pastilla.llena.bien  {background:var(--bien);  color:var(--tinta-bien)}
/* Lo que no pide nada va con contorno: está, pero no grita. */
.pastilla.suave.bien{
  background:var(--bien-fondo);color:var(--bien);border-color:var(--bien-linea);
}
.pastilla.suave.pausado, .pastilla.pausado{
  background:var(--capa-alta);color:var(--txt-3);border-color:var(--linea-fuerte);
}
.pastilla.suave{background:var(--capa-alta);color:var(--txt-3);border-color:var(--linea)}

/* El filo de la tarjeta: cuatro píxeles a la izquierda, que es lo que se
   ve de reojo cuando pasas la lista con el dedo. */
.tc{border-left-width:4px;border-left-style:solid;border-left-color:var(--linea)}
.tc.mal    {border-left-color:var(--mal)}
.tc.aviso  {border-left-color:var(--aviso)}
.tc.bien   {border-left-color:var(--bien)}
.tc.pausado{border-left-color:var(--txt-4);border-left-style:dashed}
/* La franja de arriba deja de competir con el filo. */
.tc::before{display:none}

/* Y la fila de la tabla, lo mismo. */
.tabla tbody tr.mal    td:first-child{box-shadow:inset 4px 0 0 var(--mal)}
.tabla tbody tr.aviso  td:first-child{box-shadow:inset 4px 0 0 var(--aviso)}
.tabla tbody tr.bien   td:first-child{box-shadow:inset 4px 0 0 var(--bien)}
.tabla tbody tr.pausado td:first-child{box-shadow:inset 4px 0 0 var(--txt-4)}
.tabla tbody tr.pausado{opacity:.68}

/* ===== LA LEYENDA ======================================================
   Dice qué es cada color y cuántos hay de cada uno, y de paso filtra. */
.leyenda{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ley{
  display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 12px;border-radius:99px;
  border:1px solid var(--linea);background:var(--capa);
  font:inherit;font-size:12px;font-weight:650;color:var(--txt-3);cursor:pointer;
  transition:border-color var(--rapido) var(--curva), color var(--rapido) var(--curva),
             background var(--rapido) var(--curva);
}
.ley svg{width:13px;height:13px;stroke-width:2.4}
.ley-punto{width:9px;height:9px;border-radius:99px;flex:0 0 auto;background:currentColor}
.ley b{font-family:var(--cifra);font-size:12.5px;font-weight:750;color:var(--txt)}
.ley.mal    {color:var(--mal)}
.ley.aviso  {color:var(--aviso)}
.ley.bien   {color:var(--bien)}
.ley.pausado{color:var(--txt-3)}
.ley:hover{background:var(--capa-alta)}
.ley.mal.viva   {background:var(--mal-fondo);  border-color:var(--mal-linea)}
.ley.aviso.viva {background:var(--aviso-fondo);border-color:var(--aviso-linea)}
.ley.bien.viva  {background:var(--bien-fondo); border-color:var(--bien-linea)}
.ley.pausado.viva{background:var(--capa-alta); border-color:var(--linea-fuerte)}
.ley.quitar{color:var(--txt-3)}
.ley.quitar .ley-punto{display:none}
@media (pointer: coarse){ .ley{height:42px;padding:0 14px} }
@media (max-width:560px){ .ley span{display:none} .ley{padding:0 11px} }

/* ===== LA LISTA COMPLETA ==============================================
   Ochenta y un clientes en nueve paneles de tarjetas eran media tarde de
   bajar. Aquí entran treinta por pantalla, ordenables por columna. */
.vista-gente button{gap:6px}
.vista-gente button svg{width:14px;height:14px;flex:0 0 auto}
.tabla-clientes .c-estado{width:132px}
.tabla-clientes .c-quien{width:auto}
.tabla-clientes .c-cuenta{width:210px}
.tabla-clientes .c-vence{width:118px}
.tabla-clientes .c-monto{width:96px}
.tabla-clientes .c-hacer{width:132px}
.t-orden{
  border:0;background:transparent;padding:0;font:inherit;
  font-size:inherit;font-weight:inherit;letter-spacing:inherit;
  text-transform:inherit;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  /* La cabecera es un botón de verdad: en un teléfono hay que poder darle
     con el dedo, no acertarle a diez píxeles de letra. */
  min-height:34px;padding:0 2px;margin:0 -2px;border-radius:7px;
}
.t-orden:hover{color:var(--txt);background:var(--capa)}
.t-orden:active{background:var(--linea)}
/* El rosa de marca sobre el gris de la cabecera no llegaba a leerse bien
   (4.3:1 en oscuro, 3.3:1 en claro). La columna viva se marca con el tono
   de texto más fuerte y la flechita, que es lo que de verdad la distingue. */
/* La columna viva se distingue por el fondo teñido, no por un rosa flojo
   en letra de diez píxeles que no llegaba a leerse. */
.t-orden.viva{color:var(--txt);background:var(--marca-suave)}
.t-orden.viva:hover{background:var(--marca-linea)}
.t-orden i{font-style:normal;font-size:9px}
@media (pointer: coarse){
  .t-orden{min-height:44px;padding:0 6px;margin:0 -6px}
}
.t-escrito{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:17px;height:17px;border-radius:99px;margin-left:6px;
  background:var(--bien-fondo);border:1px solid var(--bien-linea);color:var(--bien);
}
.t-escrito svg{width:9px;height:9px;stroke-width:2.6}
.tabla tfoot td{
  border-top:1px solid var(--linea-fuerte);
  padding:11px var(--e3);font-size:12px;font-weight:650;color:var(--txt-3);
  background:var(--capa-alta);
}
.t-pie-etq{
  text-align:right;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--txt-4);font-weight:750;
}
.t-pie-suma{font-size:14px;font-weight:780;color:var(--txt)}
/* Quien debe más de una cuota lleva su cuenta al lado del monto: es la
   diferencia entre «me debe quince» y «me debe cuarenta y cinco». */
/* El aviso de deuda va arriba de todo en su ficha, con el borde rojo: es
   lo primero que tiene que ver al abrirlo. */
.aviso-deuda{border-color:var(--mal-linea);background:var(--mal-fondo)}
.aviso-deuda h2{color:var(--mal)}
.t-atraso{
  display:block;font-style:normal;font-size:10px;font-weight:750;
  margin-top:2px;color:var(--mal);letter-spacing:.01em;
}
.pie-colgados{color:var(--mal)}
.t-pie-bajar{text-align:right;padding-right:var(--e3)}
.t-pie-bajar .btn{white-space:nowrap}
@media (max-width:560px){ .t-pie-bajar .et{display:none} }
@media (max-width:860px){
  .tabla-clientes .c-cuenta, .tabla-clientes .c-vence{width:auto}
  .t-pie-etq{display:none}
}


/* En la tabla el estado va corto -«Vencido»- porque la fecha tiene su propia
   columna al lado; repetirla dejaba la pastilla más ancha que la celda. */
.pastilla.corta{max-width:100%}
.tabla-clientes .c-estado{width:128px}
.tabla-clientes .c-vence{width:132px}
.tabla-clientes .t-estado{overflow:hidden}
.t-fecha{display:block;font-size:12.5px;font-weight:600;color:var(--txt-2)}
.tabla-clientes .t-vence small{
  display:block;font-size:10.5px;font-weight:650;margin-top:1px;color:var(--txt-4);
}
.tabla-clientes .t-vence small.mal{color:var(--mal)}
.tabla-clientes .t-vence small.aviso{color:var(--aviso)}
.tabla-clientes .t-vence small.bien{color:var(--bien)}


/* Marcar a varios desde la lista completa. En las tarjetas la marca se
   estira por toda la tarjeta; aquí tiene que ser una casilla de verdad,
   del tamaño de un dedo, dentro de su celda. */
.tabla-clientes .c-marca{width:44px}
.tabla-clientes .t-marca{padding-right:0;text-align:center}
.tabla .tc-marca{
  position:static;inset:auto;width:22px;height:22px;padding:0;
  border:2px solid var(--linea-fuerte);border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--capa);transition:background .12s, border-color .12s;
}
.tabla .tc-marca:hover{border-color:var(--marca)}
.tabla .tc-marca[aria-checked="true"]{background:var(--marca);border-color:var(--marca)}
.tabla .tc-marca svg{width:14px;height:14px;padding:0;background:none;color:#fff}
.tabla .tc-marca.cab{border-radius:7px}
.tabla tbody tr.elegido{background:var(--marca-suave)}
.tabla tbody tr.elegido .t-nom span{color:var(--txt)}
@media (pointer: coarse){
  .tabla-clientes .c-marca{width:52px}
  .tabla .tc-marca{width:26px;height:26px}
}


/* La leyenda es ahora la única fila de filtros: cabe todo y se desliza. */
.leyenda{
  overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;
  padding:2px 0;margin:0 -2px;
}
.leyenda::-webkit-scrollbar{display:none}
.ley{flex:0 0 auto}
.ley.ambar{color:var(--aviso)}
.ley.ambar.viva{background:var(--aviso-fondo);border-color:var(--aviso-linea)}
.ley.viva:not(.mal):not(.aviso):not(.bien):not(.pausado):not(.ambar){
  background:var(--marca-suave);border-color:var(--marca-linea);color:var(--txt);
}
@media (max-width:560px){ .ley span{display:inline} }

@media (max-width:420px){
  .r2,.r3,.r4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .datos{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- Con el teclado, lo primero que se pisa es esto: te salta el carril de
     secciones entero y te deja en lo que de verdad viniste a leer. -->
<a class="saltar" href="#lienzo">Saltar al contenido</a>
<!-- Lo que se le dice al lector de pantalla cuando cambias de sitio. -->
<p id="anuncio" class="solo-lectores" role="status" aria-live="polite" aria-atomic="true"></p>

<div id="app">

  <!-- Carril lateral: solo en pantalla ancha. Iconos con su nombre debajo,
       que es lo que de verdad se lee rápido. -->
  <nav id="carril" aria-label="Secciones">
    <!-- La marca «Pegatina». Sistema medido en módulos de u = 64:
         trazo 1.28u · canto 0.38u · contorno 0.19u · radios a la mitad del
         lado corto. La letra va al 86% para que quepa CON su contorno; sin
         eso se sale del azulejo y Android recorta media P.
         El orden de las capas importa: el canto con su contorno primero, la
         cara con el suyo después, para que se lea una pieza con volumen y
         no dos letras superpuestas.
         Y el canto no es adorno: es la regla que baja al programa, donde lo
         que se pulsa lo lleva y lo que no se pulsa es plano.
         Es el mismo dibujo que queda de icono al instalar. -->
    <div id="marca" aria-hidden="true">
      <svg viewBox="0 0 512 512">
        <rect width="512" height="512" rx="112" fill="var(--marca)"/>
        <g transform="translate(256 256) scale(.86) translate(-262 -250)"
           fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M153.6 412.8 V99.2 H265.6 a76.8 76.8 0 0 1 0 153.6 H153.6"
                stroke="#0b0b0f" stroke-width="106.24" transform="translate(24.32 24.32)"/>
          <path d="M153.6 412.8 V99.2 H265.6 a76.8 76.8 0 0 1 0 153.6 H153.6"
                stroke="var(--marca-canto)" stroke-width="81.92" transform="translate(24.32 24.32)"/>
          <path d="M153.6 412.8 V99.2 H265.6 a76.8 76.8 0 0 1 0 153.6 H153.6"
                stroke="#0b0b0f" stroke-width="106.24"/>
          <path d="M153.6 412.8 V99.2 H265.6 a76.8 76.8 0 0 1 0 153.6 H153.6"
                stroke="#fff" stroke-width="81.92"/>
        </g>
        <rect x="12.16" y="12.16" width="487.68" height="487.68" rx="99.84"
              fill="none" stroke="#0b0b0f" stroke-width="24.32"/>
      </svg>
    </div>
    <button class="nav-btn" data-ir="hoy" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
      <span>Hoy</span><em class="nav-punto oculto" data-punto="hoy"></em>
    </button>
    <button class="nav-btn" data-ir="negocio">

      <span>Plataformas</span><em class="nav-punto oculto" data-punto="clientes"></em>

      <span>Ajustes</span>

    <div id="carril-pie">

      <!-- La marca también aquí. En el celular el carril lateral está

            <path d="M153.6 412.8 V99.2 H265.6 a76.8 76.8 0 0 1 0 153.6 H153.6"

            <path d="M153.6 412.8 V99.2 H265.6 a76.8 76.8 0 0 1 0 153.6 H153.6"

      <div class="cabecera-txt">

        <h1 id="titulo" tabindex="-1">Hoy</h1>

      </div>
      <div class="crece"></div>
      <label class="buscador">
        <span class="solo-lectores">Buscar cliente o cuenta</span>

      <a class="btn" id="btn-viejo-movil" href="index.html" title="Volver al PAPOTAS de siempre" aria-label="Volver al PAPOTAS de siempre">

      </a>
      <button class="btn principal" id="btn-accion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="btn-accion-txt">Nuevo</span>

    <!-- Barra inferior: solo en celular -->

        <span>Ajustes</span>

  </div>

<script id="papotas-libreria-supabase">
/* ============================================================================
   La libreria de Supabase, dentro del archivo
