try{ verHoy = localStorage.getItem('pap_ver_hoy') || 'plataforma'; }catch(_){}

function pintaHoy(){
  const eco = economia();
  const hoy = hoyISO();
  const aviso = Number(ajustes.diasAlerta||5);
  /* Todo lo de esta pantalla pasa por la plataforma con la que estás
     trabajando: si entras a NETFLIX, aquí solo hay Netflix. */
  /* Hoy es la pantalla de a quién hay que cobrarle: los pausados no pintan
     nada ahí. Siguen enteros en su plataforma y en su cuenta. */
  const suyos = clientes.filter(enPlataformaActiva).filter(function(c){ return !enPausa(c); });
  const vencidos = suyos.filter(function(c){ const d=diasHasta(c.vencimiento); return d!==null && d<0; });
  const deHoy    = suyos.filter(function(c){ return c.vencimiento === hoy; });
  const semana   = suyos.filter(function(c){ const d=diasHasta(c.vencimiento); return d!==null && d>0 && d<=aviso; });
  const porCobrar = vencidos.concat(deHoy, semana);
  /* Todo lo que te deben, no una cuota por cabeza: quien lleva tres meses
     sin pagar sale por sus tres cuotas, que es lo que le vas a cobrar. */
  const total = porCobrar.reduce(function(a,c){ return a + aCobrarDe(c); }, 0);
  const colgados = porCobrar.filter(muyAtrasado);
  const colgadoSuma = colgados.reduce(function(a,c){ return a + deudaDe(c); }, 0);

  const enPlatM = function(m){
    return plataformaActiva === 'TODAS' ||
           String(m.nombre||'').trim().toUpperCase() === plataformaActiva;
  };
  const susCuentas = servicios.filter(enPlatM);
  const idsSuyos = new Set(susCuentas.map(function(m){ return String(m.id); }));

  const mes = hoy.slice(0,7);
  const delMes = function(f){ return String(f||'').indexOf(mes)===0; };
  const suya = function(x, campo){
    return plataformaActiva === 'TODAS' ||
           String(x[campo]||'').trim().toUpperCase() === plataformaActiva ||
           idsSuyos.has(String(x.cuentaMasterId));
  };
  const ventasMes = ventas.filter(function(v){ return delMes(v.fecha) && suya(v,'servicio'); });
  const cobradoMes = ventasMes.reduce(function(a,v){ return a + (Number(v.monto)||0); }, 0);
  const gastadoMes = inversiones.filter(function(i){ return delMes(i.fecha) && suya(i,'plataforma'); })
                                .reduce(function(a,i){ return a + (Number(i.monto)||0); }, 0);
  const libres = susCuentas.reduce(function(a,m){ return a + libresDe(m); }, 0);
  const mastersVencidos = susCuentas.filter(function(m){ const d=diasHasta(m.vencimiento); return d!==null && d<0; });
  /* Las que van a caer, que es el aviso que de verdad sirve. */
  const porCaer = mastersPorCaer(susCuentas, aviso);
  const enRiesgo = genteEnRiesgo(porCaer);
  /* Los que ya se fueron, aunque sigan contando como deuda. */
  const seFueron = perdidos(suyos);

  const porFecha = function(a,b){ return String(a.vencimiento||'9').localeCompare(String(b.vencimiento||'9')); };

  /* Qué entra en la cola de trabajo, según el grupo elegido arriba. */
  let cola;
  if(filtroHoy === 'vencidos')    cola = vencidos;
  else if(filtroHoy === 'hoy')    cola = deHoy;
  else if(filtroHoy === 'semana') cola = semana;
  else if(filtroHoy === 'colgados') cola = colgados;
  else if(filtroHoy === 'perdidos')  cola = seFueron;
  else cola = porCobrar;
  cola = cola.slice().sort(porFecha);
  const conTel = cola.filter(function(c){ return telefonoDe(c); }).length;

  /* La meta del mes, si la has puesto; si no, el anillo mide lo cobrado
     contra lo cobrado más lo que queda pendiente. */
  const meta = Number(ajustes.metaMensual) || 0;
  const base = meta > 0 ? meta : (cobradoMes + total);
  const pct  = base > 0 ? (cobradoMes / base) * 100 : 0;

  const fecha = new Date().toLocaleDateString('es-PE', {weekday:'long', day:'numeric', month:'long'});
  $('#subtitulo').textContent = (plataformaActiva === 'TODAS' ? '' : plataformaActiva + ' · ') +
    fecha.charAt(0).toUpperCase() + fecha.slice(1);

  $('#p-hoy').innerHTML =
  '<div class="pila">' +
    barraPlataformas() +

    /* ---- Lo que se hace a diario, de primeras ---- */
    /* «Nuevo cliente» NO se repite aquí: es el botón rojo de la cabecera,
       que en esta pantalla hace justo eso y no se va nunca de la vista.
       Tenerlo dos veces a un dedo de distancia solo gastaba renglón y hacía
       dudar de si los dos hacían lo mismo. */
    '<div class="acciones-rapidas">' +
      '<button class="btn" data-nueva-cuenta="1">' + ICONO.tele + 'Nueva cuenta</button>' +
      '<button class="btn" data-nuevo-gasto="1">' + ICONO.caja + 'Registrar gasto</button>' +
      '<button class="btn bien" data-escribir-a="hoy-visible">' + ICONO.wa +
        'Empezar la ronda<span class="btn-n">' + (conTel || cola.length) + '</span></button>' +
      '<button class="btn" data-todos-wa="hoy-visible" title="Manda uno detrás de otro sin volver a buscar nada">' +
        ICONO.rayo + 'Mandarles a todos</button>' +
      '<div class="crece"></div>' +
      '<button class="btn fantasma" data-ir-clientes="1">' + ICONO.gente + 'Ver todos los clientes</button>' +
    '</div>' +

    /* ---- Las cifras, cada una con su color y su icono ---- */
    /* Lo primero de todo: si lo que escribe no se va a guardar, da igual
       todo lo demás de esta pantalla. */
    avisoDeDonde() +
    panelMudanza() +

    /* Esto va ANTES que las cifras, y a propósito. Una cuenta a punto de
       caerse no es un dato para mirar: es algo que hay que hacer HOY, y si
       queda debajo de «gastado este mes» no lo ves hasta que es tarde. */
    panelPorCaer(porCaer, enRiesgo) +

    '<div class="azulejos">' +
      azulejo('Por cobrar', esc(dinero(total)), 'aviso', ICONO.cobrar,
        {pie: porCobrar.length + ' ' + plural(porCobrar.length,'persona','personas'), ir:'fhoy-pendientes'}) +
      azulejo('Vencidos', vencidos.length, 'mal', ICONO.alerta,
        {pie: esc(dinero(vencidos.reduce(function(a,c){return a+aCobrarDe(c);},0))), ir:'fhoy-vencidos'}) +
      /* Los que llevan más de una cuota sin pagar. Van aparte porque no es
         lo mismo que se le pasaran tres días a que lleve tres meses. */
      (colgados.length
        ? azulejo('Te deben varias', colgados.length, 'mal', ICONO.billete,
            {pie: esc(dinero(colgadoSuma)) + ' atrasados', ir:'fhoy-colgados'})
        : '') +
      /* Y de esos, los que ya no volvieron. Un número honesto vale más que
         uno grande: esta plata está contada como deuda y no vas a verla. */
      (seFueron.length
        ? azulejo('Puede que ya no sean', seFueron.length, 'aviso', ICONO.info,
            {pie: esc(dinero(seFueron.reduce(function(a,c){ return a + deudaDe(c); }, 0))) +
                  ' que no vas a ver', ir:'fhoy-perdidos',
             tit:'Llevan ' + umbralPerdido() + ' cuotas o más sin pagarte'})
        : '') +
      azulejo('Vencen hoy', deHoy.length, 'aviso', ICONO.reloj,
        {pie: esc(dinero(deHoy.reduce(function(a,c){return a+aCobrarDe(c);},0))), ir:'fhoy-hoy'}) +
      azulejo('Próximos ' + aviso + ' días', semana.length, 'bien', ICONO.calendario,
        {pie: esc(dinero(semana.reduce(function(a,c){return a+cobroDe(c);},0))), ir:'fhoy-semana'}) +
      azulejo('Cobrado en ' + esc(NOMBREMES[Number(mes.slice(5,7))-1]), esc(dinero(cobradoMes)), 'bien', ICONO.subir,
        {pie: ventasMes.length + ' ' + plural(ventasMes.length,'venta','ventas') +
              (meta > 0 ? ' · ' + Math.round(pct) + '% de la meta' : '')}) +
      azulejo('Gastado', esc(dinero(gastadoMes)), 'mal', ICONO.caja,

      azulejo('Clientes', suyos.length, '', ICONO.gente,

    '</div>' +

    /* ---- La meta, si la has puesto ---- */
    (meta > 0 ?
      '<div class="tarjeta">' +
        '<div class="tarjeta-cabeza">' +
          '<span class="cabeza-icono verde">' + ICONO.diana + '</span>' +
          '<div class="crece"><h2>Meta de ' + esc(NOMBREMES[Number(mes.slice(5,7))-1]) + '</h2>' +

        '</div>' +

    /* ---- El calendario del mes y lo que viene, lado a lado ---- */
    '<div class="rejilla dos-tercios">' +
      '<div class="tarjeta">' +
        '<div class="tarjeta-cabeza">' +
          '<span class="cabeza-icono azul">' + ICONO.calendario + '</span>' +

          }).join('') +

        '<button class="btn mini' + (agrupaHoy ? '' : ' fantasma') + '" data-agrupa="1"' +
          ' aria-pressed="' + agrupaHoy + '"' +
          ' title="' + (agrupaHoy ? 'Ahora van agrupados por plataforma' : 'Ahora van seguidos, del más urgente al que menos') + '">' +
          ICONO.capas + (agrupaHoy ? 'Por plataforma' : 'Seguidos') + '</button>' +
      '</div>' +
      (cola.length
        ? '<div class="tarjeta-cuerpo pegado">' + tablaCobro(cola, topeHoy) + pieTabla(cola, topeHoy) + '</div>'
        : '<div class="tarjeta-cuerpo">' +
            vacio('Nada pendiente', 'No hay nadie a quien cobrar en este grupo. Buen día.') +
          '</div>') +
    '</div>' +

    /* ---- Cuentas master vencidas: si no se renuevan, se cae el negocio ---- */
    panelMastersVencidos(mastersVencidos, eco) +

  '</div>';
}

/* --- EL NEGOCIO: plataforma → cuenta → perfil → cliente -----------------
   Antes esto eran dos pantallas, «Clientes» y «Cuentas», que contaban la
   misma historia por separado: una decía cuántos perfiles tiene una cuenta
   y la otra quién los ocupa, y para cruzarlas había que saltar de una a la
   otra y perder el hilo. Ahora es UNA sola pantalla en la que se ENTRA:
   se pulsa una plataforma y se abre su subpantalla, se pulsa una cuenta y
   se abre la suya con sus perfiles, se pulsa un perfil y se abre el cliente.
   Cada nivel es su propia pantalla, con su camino de vuelta arriba y con el
   botón «atrás» del teléfono funcionando. */

let filtroClientes = 'todos', ordenClientes = 'plataforma', filtroCuenta = 'TODAS';
try{ ordenClientes = localStorage.getItem('pap_orden_cli') || 'plataforma'; }catch(_){}

/* Dónde estás dentro del negocio. La plataforma es la de siempre
   (plataformaActiva), para que Hoy y Dinero sigan hablando de lo mismo. */
let rutaCuenta  = null;              /* id de la cuenta master abierta */
let rutaCliente = null;              /* id del cliente abierto */
let vistaRaiz   = 'plataformas';     /* plataformas | cuentas | clientes */
let vistaGente  = 'tarjetas';        /* tarjetas | tabla */
let vistaPlat   = 'cuentas';         /* cuentas | clientes | libres */
try{
  vistaRaiz  = localStorage.getItem('pap_vista_raiz') || 'plataformas';
  vistaPlat  = localStorage.getItem('pap_vista_plat') || 'cuentas';
  vistaGente = localStorage.getItem('pap_vista_gente') || 'tarjetas';
}catch(_){}
function guardarVistas(){
  try{
    localStorage.setItem('pap_vista_raiz', vistaRaiz);
    localStorage.setItem('pap_vista_plat', vistaPlat);
    localStorage.setItem('pap_vista_gente', vistaGente);
  }catch(_){}
}

/* ---------- El camino, en la barra de direcciones -----------------------
   Cada subpantalla tiene su propia dirección, así que el botón «atrás» del
   teléfono sube un nivel en vez de sacarte del programa. */
function hashRuta(){
  let h = '#negocio';
  if(plataformaActiva !== 'TODAS') h += '/' + encodeURIComponent(plataformaActiva);
  if(rutaCuenta)  h += '/m' + encodeURIComponent(rutaCuenta);
  if(rutaCliente) h += '/c' + encodeURIComponent(rutaCliente);
  return h;
}
function apuntarRuta(empuja){
  try{
    if(empuja) history.pushState(null, '', hashRuta());
    else history.replaceState(null, '', hashRuta());
  }catch(_){}
}
function leerRuta(){
  const partes = String(location.hash || '').replace(/^#/, '').split('/');
  if(partes[0] !== 'negocio') return false;
  ponerPlataforma(partes[1] ? decodeURIComponent(partes[1]) : 'TODAS');
  rutaCuenta = null; rutaCliente = null;
  for(let i = 2; i < partes.length; i++){
    const p = partes[i];
    if(!p) continue;
    if(p.charAt(0) === 'm') rutaCuenta  = decodeURIComponent(p.slice(1));
    else if(p.charAt(0) === 'c') rutaCliente = decodeURIComponent(p.slice(1));
  }
  return true;
}
window.addEventListener('popstate', function(){
  if(!leerRuta()) return;
  if(pantalla !== 'negocio') ir('negocio'); else pintar();
  arriba();
});

function arriba(){ const l = $('#lienzo'); if(l) l.scrollTop = 0; }

/* Al cambiar de pestaña se repinta media pantalla y el botón que acabas de
   pulsar deja de existir: con el ratón da igual, con el teclado te quedas
   sin foco y la siguiente flecha hace cualquier otra cosa. Aquí se apunta
   dónde tiene que volver el foco después de pintar. */
let focoPendiente = null;
function volverElFoco(sel){ focoPendiente = sel; }
function recolocarFoco(){
  if(!focoPendiente) return;
  const sel = focoPendiente;
  focoPendiente = null;
  const e = document.querySelector(sel);
  if(e && typeof e.focus === 'function'){ try{ e.focus({preventScroll:true}); }catch(_){ e.focus(); } }
}

/* Entrar al negocio por una de sus tres puertas, desde donde sea. */
function puerta(cual){
  vistaRaiz = cual; guardarVistas();
  ponerPlataforma('TODAS');
  rutaCuenta = null; rutaCliente = null;
  busqueda = ''; const bu = $('#buscar'); if(bu) bu.value = '';
  irNegocio(false);
}

function irNegocio(empuja){
  moverFocoAlTitulo = true;
  if(empuja) apuntarRuta(true);
  if(pantalla !== 'negocio') ir('negocio'); else pintar();
  arriba();
}
function abrirPlataforma(n){
  if(!n || n === 'TODAS'){ volverA('raiz'); return; }
  ponerPlataforma(n);
  rutaCuenta = null; rutaCliente = null;
  irNegocio(true);
}
function abrirCuenta(id){
  const m = buscarMaster(id);
  if(!m){ avisar('Esa cuenta ya no está', 'mal'); return; }
  ponerPlataforma(String(m.nombre || '').trim().toUpperCase());
  rutaCuenta = String(m.id); rutaCliente = null;
  irNegocio(true);
}
function abrirCliente(id){
  const c = buscarCliente(id);
  if(!c){ avisar('Ese cliente ya no está', 'mal'); return; }
  const m = masterDe(c);
  ponerPlataforma(platDe(c) || 'SIN PLATAFORMA');
  rutaCuenta  = m ? String(m.id) : null;
  rutaCliente = String(c.id);
  irNegocio(true);
}
function volverA(nivel){
  if(nivel === 'raiz'){ ponerPlataforma('TODAS'); rutaCuenta = null; rutaCliente = null; }
  else if(nivel === 'plat'){ rutaCuenta = null; rutaCliente = null; }
  else if(nivel === 'cuenta'){ rutaCliente = null; }
  busqueda = ''; const bu = $('#buscar'); if(bu) bu.value = '';
  /* Desde Hoy o Dinero, soltar la plataforma no te muda de pantalla: te
     deja donde estabas, hablando de todas. */
  if(pantalla !== 'negocio'){ pintar(); arriba(); return; }
  irNegocio(true);
}
/* Subir un escalón, sea cual sea el que pisas. Lo usa la tecla Escape. */
function subirUno(){
  if(modoElegir){ limpiarEleccion(); pintar(); return true; }
  if(busqueda){ busqueda = ''; const bu = $('#buscar'); if(bu) bu.value = ''; pintar(); return true; }
  if(rutaCliente){ volverA(rutaCuenta ? 'cuenta' : 'plat'); return true; }
  if(rutaCuenta){ volverA('plat'); return true; }
  if(plataformaActiva !== 'TODAS'){ volverA('raiz'); return true; }
  return false;
}

/* El camino de vuelta, arriba del todo. Lo último es donde estás. */
function migas(pasos){
  const anterior = pasos.length > 1 ? pasos[pasos.length - 2][1] : 'raiz';
  return '<nav class="migas" aria-label="Dónde estás">' +
    '<button class="miga-volver" data-volver="' + esc(anterior || 'raiz') + '">' +
      ICONO.volver + '<span class="et">Volver</span></button>' +
    pasos.map(function(p, i){
      const ultimo = i === pasos.length - 1;
      return (i ? '<i class="miga-sep" aria-hidden="true">›</i>' : '') +
        (ultimo || !p[1]
          ? '<b class="miga viva">' + esc(p[0]) + '</b>'
          : '<button class="miga" data-volver="' + esc(p[1]) + '">' + esc(p[0]) + '</button>');
    }).join('') +
  '</nav>';
}

/* ---------- Las plataformas, con todo lo suyo sumado -------------------- */
function gruposPlataforma(eco){
  eco = eco || economia();
  const grupos = {};
  function caja(k){
    return grupos[k] || (grupos[k] = {nombre:k, cuentas:[], tope:0, libres:0, costo:0,
                                      cobra:0, clientes:0, vencidas:0, deben:0, sueltos:[]});
  }
  servicios.forEach(function(m){
    const k = String(m.nombre || 'SIN PLATAFORMA').trim().toUpperCase();
    const g = caja(k);
    const r = resumenCuenta(m, eco);
    g.cuentas.push(m);
    g.tope   += Math.max(0, Number(m.perfiles||0));
    g.libres += libresDe(m);
    g.costo  += r.costo;
    g.cobra  += r.recurrente;
    g.clientes += r.clientes;
    const d = diasHasta(m.vencimiento);
    if(d !== null && d < 0) g.vencidas++;
  });
  /* Un cliente puede tener plataforma escrita y ninguna cuenta detrás. Es
     parte del negocio igual, así que tiene su sitio y no desaparece. */
  clientes.forEach(function(c){
    const k = platDe(c) || 'SIN PLATAFORMA';
    const g = caja(k);
    if(!masterDe(c)){ g.clientes++; g.cobra += cobroDe(c); g.sueltos.push(c); }
    const e = estadoDe(c);
    if(debe(c)) g.deben++;
  });
  const nombres = Object.keys(grupos).sort();
  return {grupos:grupos, nombres:nombres};
}

/* Los clientes de una plataforma, tenga cuenta o no. */
function genteDe(n){
  return clientes.filter(function(c){ return (platDe(c) || 'SIN PLATAFORMA') === n; });
}
/* Las casillas de perfil de una cuenta: cuál está ocupada y por quién.
   El perfil se casa con su número, así «Perfil 3» es la casilla 3 y no una
   fila cualquiera de una lista. Quien no encaje sale igual, al final. */
function perfilesDe(m){
  const tope = Math.max(0, Number(m.perfiles||0));
  const puestos = new Map();
  const sobrantes = [];
  clientesDe(m.id).slice().sort(function(a,b){
    return String(a.perfil||'').localeCompare(String(b.perfil||''), 'es', {numeric:true});
  }).forEach(function(c){
    const cara = String(c.perfil || '').match(/(\d+)/);
    const i = cara ? Number(cara[1]) : 0;
    if(i >= 1 && i <= tope && !puestos.has(i)) puestos.set(i, c);
    else sobrantes.push(c);
  });
  const casillas = [];
  for(let i = 1; i <= tope; i++) casillas.push({n:i, cliente:puestos.get(i) || null});
  sobrantes.forEach(function(c){ casillas.push({n:null, cliente:c}); });
  return casillas;
}
function primerPerfilLibre(m){
  const hueco = perfilesDe(m).filter(function(x){ return x.n && !x.cliente; })[0];
  return hueco ? 'Perfil ' + hueco.n : '';
}
/* Un cliente pausado sigue ahí, con su perfil y su historia, pero deja de
   salir en «por cobrar»: se fue de viaje, dejó de pagar un mes, le guardas
   el sitio. Borrarlo para eso era perder todo lo que llevaba pagado. */
function enPausa(c){ return !!(c && c.pausado); }
function debe(c){
  if(enPausa(c)) return false;
  const e = estadoDe(c);
  return e === 'vencido' || e === 'por_vencer';
}

/* ---------- El botón grande de arriba, según dónde estés ---------------- */
/* El boton grande de la cabecera lleva un «+»: siempre da de alta algo, y
   lo que da de alta es lo que estas mirando. Si estas viendo clientes, un
   cliente; si estas viendo cuentas, una cuenta. */
function daDeAltaCliente(){
  if(rutaCliente || rutaCuenta) return true;
  if(plataformaActiva !== 'TODAS') return vistaPlat === 'clientes';
  return vistaRaiz === 'clientes';
}
function etiquetaAccion(){
  if(rutaCuenta && buscarMaster(rutaCuenta)) return 'Poner un cliente';
  if(daDeAltaCliente()) return plataformaActiva !== 'TODAS' && !rutaCliente
    ? 'Nuevo cliente aquí' : 'Nuevo cliente';
  return plataformaActiva !== 'TODAS' ? 'Nueva cuenta aquí' : 'Nueva cuenta';
}
function accionNegocio(){
  const m = rutaCuenta ? buscarMaster(rutaCuenta) : null;
  if(m){ formCliente(null, {cuentaMasterId:m.id, perfil:primerPerfilLibre(m)}); return; }
  if(daDeAltaCliente()){
    const actual = rutaCliente ? buscarCliente(rutaCliente) : null;
    const suyo = actual ? masterDe(actual) : null;
    formCliente(null, suyo ? {cuentaMasterId:suyo.id, perfil:primerPerfilLibre(suyo)} : {});
    return;
  }
  formMaster(null, plataformaActiva !== 'TODAS' ? plataformaActiva : null);
}

/* ---------- El repartidor: qué subpantalla toca ------------------------- */
function pintaNegocio(){
  let html;
  if(busqueda) html = hojaBusqueda();
  else if(rutaCliente && buscarCliente(rutaCliente)) html = hojaCliente(buscarCliente(rutaCliente));
  else if(rutaCuenta && buscarMaster(rutaCuenta))    html = hojaCuenta(buscarMaster(rutaCuenta));
  else {
    /* Si la cuenta o el cliente se borraron, se sube solo al nivel que sí
       existe en vez de quedarse en una pantalla en blanco. */
    rutaCuenta = null; rutaCliente = null;
    html = (plataformaActiva !== 'TODAS') ? hojaPlataforma(plataformaActiva) : hojaRaiz();
  }
  $('#p-negocio').innerHTML = html;
  const txt = $('#btn-accion-txt');
  if(txt) txt.textContent = etiquetaAccion();
  apuntarRuta(false);
  ponerTituloVentana();
  /* Solo cuando de verdad has cambiado de sitio: si no, cobrar a alguien te
     robaría el foco del botón que acabas de pulsar. */
  const donde = hashRuta();
  if(donde !== ultimaRutaPintada){
    ultimaRutaPintada = donde;
    anunciar(($('#titulo')||{}).textContent + '. ' + (($('#subtitulo')||{}).textContent || ''));
    const h = $('#titulo');
    if(h && moverFocoAlTitulo){ try{ h.focus({preventScroll:true}); }catch(_){ h.focus(); } }
  }
  moverFocoAlTitulo = false;
}
let ultimaRutaPintada = '';
/* Se enciende solo cuando la navegación la pediste tú, no cuando se repinta
   porque cambiaron los datos. */
let moverFocoAlTitulo = false;

/* ---------- NIVEL 0 · todas tus plataformas ----------------------------- */
function hojaRaiz(){
  const eco = economia();
  const G = gruposPlataforma(eco);
  const grupos = G.grupos, nombres = G.nombres;
  const tope   = nombres.reduce(function(a,n){ return a + grupos[n].tope; }, 0);
  const libres = nombres.reduce(function(a,n){ return a + grupos[n].libres; }, 0);
  const costo  = nombres.reduce(function(a,n){ return a + grupos[n].costo; }, 0);
  const cobra  = nombres.reduce(function(a,n){ return a + grupos[n].cobra; }, 0);
  const deben  = clientes.filter(debe).length;

  $('#titulo').textContent = 'Plataformas';
  $('#subtitulo').textContent =
    nombres.length + ' ' + plural(nombres.length,'plataforma','plataformas') + ' · ' +
    servicios.length + ' ' + plural(servicios.length,'cuenta','cuentas') + ' · ' +
    clientes.length + ' ' + plural(clientes.length,'cliente','clientes') + ' · ' +
    (tope - libres) + '/' + tope + ' perfiles ocupados';

  const pestanas = [
    ['plataformas', 'Plataformas', nombres.length],
    ['cuentas',     'Cuentas',     servicios.length],
    ['clientes',    'Clientes',    clientes.length],
    ['libres',      'Sitios libres', libres]
  ];

  let cuerpo;
  if(vistaRaiz === 'cuentas'){
    cuerpo = '<div class="tarjeta-cuerpo pegado">' +
      (servicios.length
        ? nombres.filter(function(n){ return grupos[n].cuentas.length; }).map(function(n){
            const g = grupos[n];
            return tramoPlataforma(n, g.cuentas.length, g.cobra - g.costo) +
              '<div class="lista">' + ordenarCuentas(g.cuentas).map(function(m){
                return filaCuenta(m, eco);
              }).join('') + '</div>';
          }).join('')
        : '<div style="padding:var(--e5)">' +
            vacio('Todavía no hay cuentas','Pulsa «Nueva cuenta» para registrar tu primera cuenta master.') +
          '</div>') +
    '</div>';
  }else if(vistaRaiz === 'clientes'){
    cuerpo = filtrosClientes(clientes) + cuerpoClientes(clientes);
  }else if(vistaRaiz === 'libres'){
    /* La pregunta de todos los días: «me entró un cliente nuevo de Netflix,
       ¿dónde lo meto?». Aquí está la respuesta entera, de un vistazo. */
    cuerpo = panelLibres(huecosGlobales());
  }else{
    cuerpo = '<div class="tarjeta-cuerpo">' +
      (nombres.length
        ? '<div class="mosaico">' + nombres.map(function(n){
            return fichaPlataforma(n, grupos[n]);
          }).join('') + '</div>'
        : vacio('Todavía no hay nada','Pulsa «Nueva cuenta» y empieza por tu primera cuenta master.')) +
    '</div>';
  }

  return '<div class="pila">' +
    '<div class="azulejos cinco">' +
      azulejo('Plataformas', nombres.length, 'info', ICONO.tele,
        {pie: servicios.length + ' ' + plural(servicios.length,'cuenta','cuentas')}) +
      azulejo('Clientes', clientes.length, deben ? 'aviso' : 'bien', ICONO.gente,
        {pie: deben ? deben + ' por cobrar' : 'todos al día'}) +
      azulejo('Perfiles libres', libres, libres ? 'bien' : 'mal', ICONO.mascliente,
        {pie: 'de ' + tope + ' · ' + (tope - libres) + ' ocupados'}) +
      azulejo('Te cuestan', dinero(costo), 'mal', ICONO.caja, {pie:'al ciclo'}) +
      azulejo('Te dejan', dinero(cobra - costo), cobra - costo >= 0 ? 'bien' : 'mal', ICONO.billete,
        {pie: 'cobras ' + dinero(cobra)}) +
    '</div>' +
    '<div class="tarjeta caja-plataformas">' +
      '<div class="tarjeta-cabeza">' +
        '<span class="cabeza-icono rosa">' + ICONO.capas + '</span>' +
        '<div class="crece"><h2>Tu negocio</h2>' +
          '<p>Pulsa una plataforma para entrar. Dentro están sus cuentas, y dentro de cada cuenta, sus perfiles y quién los ocupa.</p></div>' +
        '<div class="segmentos">' + pestanas.map(function(p){
          return '<button data-vraiz="' + p[0] + '" aria-selected="' + (vistaRaiz===p[0]?'true':'false') + '">' +
                 p[1] + (p[2] ? '<span class="cuenta">' + p[2] + '</span>' : '') + '</button>';
        }).join('') + '</div>' +
      '</div>' + cuerpo +
    '</div>' +
  '</div>';
}

/* Todos los perfiles libres del negocio, ordenados por plataforma y por
   número de cuenta: es la lista de lo que todavía puedes vender. */
function huecosGlobales(){
  const fuera = [];
  servicios.slice().sort(function(a,b){
    const pa = String(a.nombre||'').trim().toUpperCase(), pb = String(b.nombre||'').trim().toUpperCase();
    return pa.localeCompare(pb,'es') || (Number(a.numero)||0) - (Number(b.numero)||0);
  }).forEach(function(m){
    perfilesDe(m).forEach(function(x){
      if(x.n && !x.cliente) fuera.push({plataforma:String(m.nombre||'').trim().toUpperCase(), m:m, n:x.n});
    });
  });
  return fuera;
}
function ordenarCuentas(lista){
  return lista.slice().sort(function(a,b){ return (Number(a.numero)||0) - (Number(b.numero)||0); });
}
function tramoPlataforma(n, cuantas, deja){
  return '<div class="tramo plat-tramo" style="' + tonoDe(n) + '">' +
    logoPlataforma(n, 22) +
    '<b>' + esc(n) + '</b>' +
    '<span class="tramo-n">' + cuantas + '</span>' +
    '<span class="tramo-monto cifra" style="color:' + (deja>=0?'var(--bien)':'var(--mal)') + '">' +
      (deja>=0?'+':'') + esc(dinero(deja)) + '</span>' +
    '<button class="btn mini fantasma" data-plat="' + esc(n) + '">' +
      '<span class="et">Entrar</span>' + ICONO.flecha + '</button>' +
  '</div>';
}

/* ---------- Los clientes: filtros y cuerpo, compartidos ----------------- */
function filtrosClientes(universo){
  const barra = '<div class="fila-controles elegir-fila">' +
    '<div class="segmentos vista-gente" aria-label="Cómo verlos">' +
      [['tarjetas','Tarjetas',ICONO.capas],['tabla','Lista completa',ICONO.barras]].map(function(v){
        return '<button data-vgente="' + v[0] + '" aria-selected="' + (vistaGente===v[0]?'true':'false') + '">' +
               v[2] + v[1] + '</button>';
      }).join('') +
    '</div>' +
    '<button class="btn mini' + (modoElegir ? ' principal' : '') + '" data-modo-elegir="1"' +
      ' aria-pressed="' + (modoElegir ? 'true' : 'false') + '">' + ICONO.capas +
      (modoElegir ? 'Salir de elegir' : 'Elegir varios') + '</button>' +
    '<span class="crece"></span>' +
  '</div>' +
  leyendaEstados(universo);
  return barra + filtrosClientesBase(universo);
}
function filtrosClientesBase(universo){
  const cuentasPosibles = servicios.filter(function(m){
    return plataformaActiva === 'TODAS' ||
           String(m.nombre||'').trim().toUpperCase() === plataformaActiva;
  });
  return '<div class="barra-filtros dentro">' +
    '<div class="fila-controles">' +
      '<select id="sel-cuenta-cli" aria-label="Filtrar por cuenta">' +
        '<option value="TODAS">Todas las cuentas</option>' +
        '<option value="SIN"' + (filtroCuenta==='SIN'?' selected':'') + '>Sin cuenta asignada</option>' +
        cuentasPosibles.slice().sort(function(a,b){ return nombreCuenta(a).localeCompare(nombreCuenta(b),'es'); })
          .map(function(m){ return '<option value="' + esc(m.id) + '"' + (String(filtroCuenta)===String(m.id)?' selected':'') + '>' + esc(nombreCuenta(m)) + '</option>'; }).join('') +
      '</select>' +
      '<select id="sel-orden-cli" aria-label="Cómo ordenarlos">' +
        '<option value="plataforma"' + (ordenClientes==='plataforma'?' selected':'') + '>Por plataforma</option>' +
        '<option value="vencimiento"' + (ordenClientes==='vencimiento'?' selected':'') + '>Por vencimiento</option>' +
        '<option value="nombre"' + (ordenClientes==='nombre'?' selected':'') + '>Por nombre</option>' +
        '<option value="monto"' + (ordenClientes==='monto'?' selected':'') + '>Por monto</option>' +
      '</select>' +

}

/* El grupo del que se parte: si estás dentro de una plataforma, la suya;
   si no, todos. Lo mismo que ve la pantalla. */
function clientesDelAmbito(){
  return plataformaActiva === 'TODAS' ? clientes.slice() : genteDe(plataformaActiva);
}

/* Quién pasa los filtros de arriba. Está aparte porque lo usan tanto la
   lista de la pantalla como el botón de bajarla a Excel: si estuviera
   escrito dos veces, un día uno de los dos se quedaría atrás. */
function clientesFiltrados(universo){
  return (universo || clientesDelAmbito()).filter(function(c){
    if(!coincide(c)) return false;
    if(filtroCuenta !== 'TODAS'){
      if(filtroCuenta === 'SIN'){ if(masterDe(c)) return false; }
      else if(String(c.cuentaMasterId) !== String(filtroCuenta)) return false;
    }
    if(filtroClientes === 'todos') return true;
    if(filtroClientes === 'sin_cuenta') return !masterDe(c);
    if(filtroClientes === 'deben') return debe(c);
    if(filtroClientes === 'pausa') return enPausa(c);
    /* Quien está en pausa sale SOLO en su grupo. Si no, aparecía además
       entre los vencidos y la lista no cuadraba con lo que dice arriba. */
    if(enPausa(c)) return false;
    return estadoDe(c) === filtroClientes;
  });
}

function cuerpoClientes(universo){
  let lista = clientesFiltrados(universo);

  lista.sort(function(a,b){
    if(ordenClientes === 'nombre') return String(a.nombre||'').localeCompare(String(b.nombre||''), 'es');
    if(ordenClientes === 'monto')  return cobroDe(b) - cobroDe(a);
    return String(a.vencimiento||'9').localeCompare(String(b.vencimiento||'9'));
  });

  if(!lista.length){
    return '<div class="tarjeta-cuerpo"><div style="padding:var(--e4) 0">' +
      vacio(busqueda ? 'Nadie con ese nombre' : 'Sin clientes aquí',
            busqueda ? 'Prueba con otra palabra o borra el buscador.'
                     : 'Pulsa «Nuevo cliente» para empezar.') +
    '</div></div>';
  }

  /* «Lista completa» es lo que contesta a «no puedo ver a todos»: una línea
     por cabeza, todos de un tirón, sin paneles por medio. */
  if(vistaGente === 'tabla'){
    return '<div class="tarjeta-cuerpo pegado">' + tablaClientes(lista) + '</div>' + barraLote();
  }

  let cuerpo;
  if(ordenClientes === 'plataforma' && plataformaActiva === 'TODAS'){
    cuerpo = panelesPorPlataforma(lista, {uno:'cliente', varias:'clientes'});
  }else if(ordenClientes === 'vencimiento'){
    const cajones = {vencido:[], por_vencer:[], activo:[], sin_fecha:[]};
    lista.forEach(function(c){ cajones[estadoDe(c)].push(c); });
    const aviso = Number(ajustes.diasAlerta||5);
    const tramosCli = [
      ['vencido',    'Vencidos',                             'mal'],
      ['por_vencer', 'Vencen en ' + aviso + ' días o menos', 'aviso'],
      ['activo',     'Al día',                               'bien'],
      ['sin_fecha',  'Sin fecha de vencimiento',             '']
    ].filter(function(t){ return cajones[t[0]].length; });
    const partido = tramosCli.length > 1;
    cuerpo = tramosCli.map(function(t){
      const g = cajones[t[0]];
      const suma = g.reduce(function(a,c){ return a + cobroDe(c); }, 0);
      return (partido ?
        '<div class="tramo ' + t[2] + '"><span class="punto"></span>' +
          '<b>' + esc(t[1]) + '</b>' +
          '<span class="tramo-n">' + g.length + '</span>' +
          '<span class="tramo-monto cifra">' + esc(dinero(suma)) + '</span>' +
        '</div>' : '') +
        '<div class="mosaico gente">' + g.map(tarjetaCliente).join('') + '</div>';
    }).join('');
  }else{
    cuerpo = '<div class="mosaico gente">' + lista.map(tarjetaCliente).join('') + '</div>';
  }
  return '<div class="tarjeta-cuerpo pegado">' + cuerpo + '</div>' + barraLote();
}

/* Las cuentas de la pantalla Dinero, agrupadas por plataforma y ordenadas
   de la plataforma que más deja a la que menos. Devuelve una lista mezclada
   de cabeceras y cuentas, para pintarla de un tirón. */
function porPlataforma(lista){
  const g = new Map();
  lista.forEach(function(x){
    const k = String(x.m.nombre||'Sin plataforma').trim().toUpperCase();
    let b = g.get(k);
    if(!b){ b = {nombre:k, filas:[], margen:0, clientes:0}; g.set(k, b); }
    b.filas.push(x); b.margen += x.r.margen; b.clientes += x.r.clientes;
  });
  const orden = Array.from(g.values()).sort(function(a,b){ return b.margen - a.margen; });
  const fuera = [];
  orden.forEach(function(b){
    fuera.push({cabeza:
      '<div class="tramo plat-tramo" style="' + tonoDe(b.nombre) + '">' +
        logoPlataforma(b.nombre, 22) +
        '<b>' + esc(b.nombre) + '</b>' +
        '<span class="tramo-n">' + b.filas.length + '</span>' +
        '<span class="tramo-monto cifra" style="color:' + (b.margen>=0?'var(--bien)':'var(--mal)') + '">' +
          (b.margen>=0?'+':'') + esc(dinero(b.margen)) + '</span>' +
      '</div>'});
    b.filas.forEach(function(x){ fuera.push(x); });
  });
  return fuera;
}

/* ---------- NIVEL 1 · dentro de una plataforma --------------------------
   Sus cuentas, su gente y sus sitios libres. Tres pestañas, porque son tres
   preguntas distintas: qué tengo, a quién le vendo y dónde me cabe uno más. */
function hojaPlataforma(n){
  const eco = economia();
  const G = gruposPlataforma(eco);
  const g = G.grupos[n];
  if(!g){ ponerPlataforma('TODAS'); return hojaRaiz(); }

  const gente  = genteDe(n);
  const huecos = [];
  g.cuentas.forEach(function(m){
    perfilesDe(m).forEach(function(x){ if(x.n && !x.cliente) huecos.push({m:m, n:x.n}); });
  });

  $('#titulo').textContent = n;
  $('#subtitulo').textContent =
    g.cuentas.length + ' ' + plural(g.cuentas.length,'cuenta','cuentas') + ' · ' +
    gente.length + ' ' + plural(gente.length,'cliente','clientes') + ' · ' +
    (huecos.length ? huecos.length + ' ' + plural(huecos.length,'perfil libre','perfiles libres') : 'sin sitio libre') +
    ' · ' + dinero(g.cobra - g.costo) + ' al ciclo';

  const cambiosPrecio = lineaTarifas(n).length;
  const pestanas = [
    ['cuentas',  'Cuentas',        g.cuentas.length],
    ['clientes', 'Clientes',       gente.length],
    ['libres',   'Perfiles libres', huecos.length],
    ['precios',  'Precios',        cambiosPrecio]
  ];
  const cual = ['cuentas','clientes','libres','precios'].indexOf(vistaPlat) >= 0 ? vistaPlat : 'cuentas';

  let cuerpo;
  if(cual === 'clientes'){
    cuerpo = filtrosClientes(gente) + cuerpoClientes(gente);
  }else if(cual === 'precios'){
    cuerpo = panelTarifas(n);
  }else if(cual === 'libres'){
    cuerpo = panelLibres(huecos, {
      vacioTitulo:'No queda sitio en ' + n,
      vacioTexto:'Todos los perfiles de ' + n + ' están ocupados. Compra otra cuenta para meter más gente.'});
  }else{
    cuerpo = '<div class="tarjeta-cuerpo pegado">' +
      (g.cuentas.length
        ? '<div class="lista">' + ordenarCuentas(g.cuentas).map(function(m){
            return filaCuenta(m, eco);
          }).join('') + '</div>'
        : '<div style="padding:var(--e5)">' +
            vacio('Sin cuentas de ' + n, 'Pulsa «Nueva cuenta aquí» para registrar la primera.') +
          '</div>') +
    '</div>';
  }

  return '<div class="pila">' +
    barraPlataformas() +
    migas([['Plataformas','raiz'], [n, null]]) +
    heroPlataforma(n, g) +
    '<div class="tarjeta">' +
      '<div class="tarjeta-cabeza">' +
        '<span class="cabeza-icono rosa">' + ICONO.capas + '</span>' +
        '<div class="crece"><h2>' + (cual === 'cuentas' ? 'Sus cuentas'
              : cual === 'clientes' ? 'Su gente'
              : cual === 'precios'  ? 'Su precio, con toda su historia' : 'Dónde te cabe uno más') + '</h2>' +
          '<p>' + (cual === 'cuentas' ? 'Pulsa una cuenta para ver sus perfiles y quién los ocupa.'
                 : cual === 'clientes' ? 'Todo el que te paga por ' + esc(n) + ', tenga cuenta puesta o no.'
                 : cual === 'precios'  ? 'Lo que valía, lo que vale y lo que va a valer un perfil de ' + esc(n) + '.'
                 : 'Los perfiles que te quedan por vender, y en qué cuenta está cada uno.') + '</p></div>' +
        '<div class="segmentos">' + pestanas.map(function(p){
          return '<button data-vplat="' + p[0] + '" aria-selected="' + (cual===p[0]?'true':'false') + '">' +
                 p[1] + (p[2] ? '<span class="cuenta">' + p[2] + '</span>' : '') + '</button>';
        }).join('') + '</div>' +
      '</div>' + cuerpo +
    '</div>' +
  '</div>';
}

/* Una cuenta en una lista: se pulsa y se ENTRA. Antes se desplegaba un
   cajón dentro de la fila y la lista entera daba un salto; ahora abre su
   propia pantalla, que es donde de verdad cabe lo que tiene dentro. */
function filaCuenta(m, eco){
  const casillas = perfilesDe(m);
  const tope   = Math.max(0, Number(m.perfiles||0));
  const usados = casillas.filter(function(x){ return x.cliente && x.n; }).length;
  const libres = Math.max(0, tope - usados);
  const dv = diasHasta(m.vencimiento);
  const claseV = dv===null ? '' : dv<0 ? 'mal' : dv<=Number(ajustes.diasAlerta||5) ? 'aviso' : 'bien';
  const deben = clientesDe(m.id).filter(debe).length;
  return '<button class="f ' + claseV + '" data-ver-cuenta="' + esc(m.id) + '"' +
    ' aria-label="Abrir ' + esc(nombreCuenta(m)) + '">' +
    logoPlataforma(m.nombre) +
    '<span class="f-txt">' +
      '<span class="f-nom">' + esc(nombreCuenta(m)) + '</span>' +
      '<span class="f-sub">' + esc(m.correo || 'Sin correo') + '</span>' +
      casillasPerfiles(usados, tope, libres===0?'llena':libres<=1?'casi':'') +
    '</span>' +
    '<span class="f-der">' +
      (deben ? '<span class="insignia mal">' + deben + ' por cobrar</span>' :
        '<span class="insignia ' + (libres===0?'mal':libres<=1?'aviso':'info') + '">' +
          usados + '/' + tope + (libres ? ' · ' + libres + ' ' + plural(libres,'libre','libres') : ' · llena') + '</span>') +
      '<span class="f-cuando ' + claseV + '">' + esc(textoDias(m.vencimiento)) + '</span>' +
    '</span>' +
    '<span class="f-flecha">' + ICONO.flecha + '</span>' +
  '</button>';
}

  const verClave = abiertos.has('clave' + m.id);

      '<dl class="datos">' +
        '<div class="dato"><dt>Correo</dt><dd style="display:flex;align-items:center;gap:6px">' +
          '<span style="min-width:0;word-break:break-all">' + esc(m.correo||'—') + '</span>' +

        '</dd></div>' +
        '<div class="dato"><dt>Clave</dt><dd style="display:flex;align-items:center;gap:6px">' +
          '<span class="cifra" style="min-width:0;word-break:break-all">' +
            (clave ? (verClave ? esc(clave) : '•'.repeat(Math.min(12, clave.length||8))) : '—') + '</span>' +
          (clave ? '<button class="btn icono mini fantasma" data-verclave="' + esc(m.id) + '" title="Ver u ocultar la clave" aria-label="Ver u ocultar la clave">' + (verClave?ICONO.ojoNo:ICONO.ojo) + '</button>' : '') +
          (clave ? '<button class="btn icono mini fantasma" data-copiar="' + esc(clave) + '" data-que="Clave" title="Copiar clave" aria-label="Copiar clave">' + ICONO.copiar + '</button>' : '') +
        '</dd></div>' +

/* Una casilla de perfil: o la ocupa alguien, o está libre y se puede poner
   a alguien ahí mismo. Es la pieza con la que de verdad se trabaja. */
function casillaPerfil(m, x){
  const plat = String(m.nombre||'').trim().toUpperCase();
  if(!x.cliente){
    return '<div class="perfil libre">' +
      '<span class="perfil-n">Perfil ' + x.n + '</span>' +
      '<div class="perfil-vacio">' + ICONO.mascliente +
        '<b>Libre</b>' +
        '<button class="btn mini" data-poner-en="' + esc(m.id) + '" data-perfil="Perfil ' + x.n + '">' +
          ICONO.mas + 'Poner un cliente</button>' +
      '</div></div>';
  }
  const c = x.cliente;
  const est = estadoDe(c);
  const clase = est==='vencido' ? 'mal' : est==='por_vencer' ? 'aviso' : est==='activo' ? 'bien' : '';
  const tel = telefonoDe(c);
  return '<div class="perfil ' + clase + '" data-cid="' + esc(c.id) + '" style="' + tonoDe(plat) + '">' +
    '<span class="perfil-n">' + esc(x.n ? 'Perfil ' + x.n : (c.perfil || 'De más')) + '</span>' +
    '<div class="perfil-quien">' +
      '<span class="crece"><b>' + esc(c.nombre || 'Sin nombre') + '</b>' +
        '<small>' + esc(tel || 'sin teléfono') + (c.pin ? ' · PIN ' + esc(c.pin) : '') + '</small></span>' +
    '</div>' +
    '<div class="perfil-pie">' +
      '<span class="cifra crece">' + esc(dinero(cobroDe(c))) + '</span>' +
      '<span class="pastilla ' + clase + '">' + esc(textoDias(c.vencimiento)) + '</span>' +
    '</div>' +
    '<div class="perfil-mando">' +
      '<button class="btn mini crece tc-cobrar" data-cobrar="' + esc(c.id) + '"' +
        ' title="Cobrar ' + esc(dinero(cobroDe(c))) + ' a ' + esc(c.nombre||'') + ' y renovarle">' +
        ICONO.cobrar + '<span class="et">Cobrar</span></button>' +
      (tel ? '<button class="btn mini icono bien" data-wa="' + esc(c.id) + '"' +
        ' title="Escribir a ' + esc(c.nombre||'') + '" aria-label="Escribir a ' + esc(c.nombre||'') + '">' + ICONO.wa + '</button>'
        : '<span class="f-sin-tel" title="Sin teléfono guardado" aria-hidden="true">' + ICONO.wa + '</span>') +
      '<button class="btn mini icono" data-mover="' + esc(c.id) + '"' +
        ' title="Mover a ' + esc(c.nombre||'') + ' de perfil o de cuenta"' +
        ' aria-label="Mover a ' + esc(c.nombre||'') + ' de perfil o de cuenta">' + ICONO.capas + '</button>' +
      '<button class="btn mini icono" data-ficha="' + esc(c.id) + '"' +
        ' title="Abrir a ' + esc(c.nombre||'') + '" aria-label="Abrir a ' + esc(c.nombre||'') + '">' + ICONO.flecha + '</button>' +
    '</div>' +
  '</div>';
}

/* ---------- NIVEL 3 · un cliente ---------------------------------------
   Su pantalla entera, no una ventanita encima: lo que le cobras, cuándo
   vence, en qué cuenta y en qué perfil está, y todo lo que te ha pagado. */
function hojaCliente(c){
  const m = masterDe(c);
  const plat = platDe(c) || 'SIN PLATAFORMA';
  const est = estadoDe(c);
  const clase = est==='vencido' ? 'mal' : est==='por_vencer' ? 'aviso' : est==='activo' ? 'bien' : '';
  const tel = telefonoDe(c);
  const ciclo = cicloDe(c);
  const cobros = ventas.filter(function(v){ return String(v.clienteId) === String(c.id); })
    .slice().sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); });
  const pagado = cobros.reduce(function(a,v){ return a + (Number(v.monto)||0); }, 0);

  $('#titulo').textContent = c.nombre || 'Cliente';
  $('#subtitulo').textContent = (m ? nombreCuenta(m) : plat) +
    (perfilBonito(c) ? ' · ' + perfilBonito(c) : '') + ' · ' + textoDias(c.vencimiento);

  const pasos = [['Plataformas','raiz'], [plat,'plat']];
  if(m) pasos.push([nombreCuenta(m),'cuenta']);
  pasos.push([c.nombre || 'Cliente', null]);

  const fut = proximoPrecio(c);
  const datos = [
    ['Vence',    fechaBonita(c.vencimiento)],
    ['Le cobras', dinero(cobroDe(c)) + (fut ? ' → ' + dinero(fut.monto) + ' el ' + fechaBonita(fut.desde) : '')],
    ['Su ciclo', ciclo.tipo === 'dias' ? 'cada ' + ciclo.cantidad + ' días'
                                       : 'cada ' + ciclo.cantidad + ' ' + plural(ciclo.cantidad,'mes','meses')],
    ['Cuenta',   m ? nombreCuenta(m) : 'Sin asignar'],
    ['Perfil',   perfilBonito(c) || '—'],
    ['PIN',      c.pin || '—'],
    ['Teléfono', tel || 'Sin teléfono'],
    ['Método',   c.metodo || ajustes.metodoDefecto || '—'],
    ['Cliente desde', fechaBonita(c.inicio) || '—'],
    ['Te ha pagado',  dinero(pagado) + (cobros.length ? ' en ' + cobros.length + ' ' + plural(cobros.length,'cobro','cobros') : '')]
  ];
  const debiendo = cuotasPendientes(c);
  if(debiendo > 1) datos.splice(2, 0, ['Te debe', debiendo + ' cuotas · ' + dinero(deudaDe(c))]);

  /* Lo demás que tiene esta misma persona. Con esto a la vista se decide
     distinto: no es «uno que me debe 15», es «uno que me deja 45 al mes». */
  const otras = mismaPersona(c);
  const panelPersona = !otras.length ? '' :
    (function(){
      const todas = [c].concat(otras);
      const alCiclo = todas.reduce(function(a,x){ return a + cobroDe(x); }, 0);
      const deben = todas.filter(function(x){ return cuotasPendientes(x) > 0; });
      const debe = deben.reduce(function(a,x){ return a + aCobrarDe(x); }, 0);
      return '<div class="tarjeta persona">' +
        '<div class="tarjeta-cabeza">' +
          '<span class="cabeza-icono rosa">' + ICONO.gente + '</span>' +
          '<div class="crece"><h2>' + esc(c.nombre || 'Esta persona') + ', en total</h2>' +
          '<p>' + todas.length + ' ' + plural(todas.length,'servicio','servicios') +
            ' · te deja <b>' + esc(dinero(alCiclo)) + '</b> al ciclo' +
            (debe > 0 ? ' · te debe <b class="rojo">' + esc(dinero(debe)) + '</b> en ' +
              deben.length + ' ' + plural(deben.length,'servicio','servicios') : '') +
          '</p></div>' +
          (telefonoDe(c) && deben.length > 1
            ? '<button class="btn mini bien" data-wa-persona="' + esc(c.id) + '"' +
              ' title="Un solo mensaje con todo lo que debe">' + ICONO.wa +
              '<span class="et">Escribirle por todo</span></button>' : '') +
        '</div>' +
        '<div class="tarjeta-cuerpo pegado"><div class="lista">' +
          todas.map(function(x){
            const mm = masterDe(x);
            const esEste = String(x.id) === String(c.id);
            return '<div class="f' + (esEste ? ' f-aqui' : '') + '"' +
                   (esEste ? '' : ' data-ficha="' + esc(x.id) + '"') + '>' +
              logoPlataforma(platDe(x), 26) +
              '<span class="f-txt"><span class="f-nom">' +
                esc(mm ? nombreCuenta(mm) : (x.servicio || 'Sin cuenta')) + '</span>' +
                '<span class="f-sub">' + esc(perfilBonito(x) || 'Sin perfil') +
                (esEste ? ' · <b>estás aquí</b>' : '') + '</span></span>' +
              pastillaEstado(x, false) +
              '<span class="f-monto cifra">' + esc(dinero(cobroDe(x))) + '</span>' +
            '</div>';
          }).join('') +
        '</div></div>' +
      '</div>';
    })();

  return '<div class="pila">' +
    barraPlataformas() +
    migas(pasos) +

    '<div class="hoja" style="' + tonoDe(plat) + '">' +
      '<div class="hoja-alto">' +
        logoPlataforma(plat, 54) +
        '<div class="hoja-id"><h2>' + esc(c.nombre || 'Sin nombre') + '</h2>' +
          '<p>' +
            '<span class="chip-cuenta" style="' + tonoDe(plat) + '">' + esc(m ? nombreCuenta(m) : plat) + '</span>' +
            (perfilBonito(c) ? '<span class="chip-perfil">' + esc(perfilBonito(c)) + '</span>'
                             : '<span class="chip-perfil sin">sin perfil</span>') +
            '<span class="pastilla ' + clase + '">' + esc(textoDias(c.vencimiento)) + '</span>' +
            (enPausa(c) ? '<span class="insignia aviso" title="No sale en Hoy ni en «por cobrar»">' +
              ICONO.reloj + 'En pausa</span>' : '') +
            (fut ? '<span class="insignia info" title="Ya está programado">' + ICONO.etiqueta +
              esc(dinero(fut.monto)) + ' desde el ' + esc(fechaBonita(fut.desde)) + '</span>' : '') +
          '</p></div>' +
        '<div class="hoja-monto"><small>Le cobras</small>' +
          '<b>' + esc(dinero(cobroDe(c))) + '</b></div>' +
      '</div>' +
      '<div class="mando">' +
        '<button class="btn mini principal" data-cobrar="' + esc(c.id) + '">' + ICONO.cobrar +
          '<span class="et">Cobrar ' + esc(dinero(cobroDe(c))) + '</span></button>' +
        (tel ? '<button class="btn mini bien" data-wa="' + esc(c.id) + '">' + ICONO.wa + '<span class="et">WhatsApp</span></button>' : '') +
        '<button class="btn mini" data-adelanto="' + esc(c.id) + '">' + ICONO.calendario +
          '<span class="et">Cobrar adelantado</span></button>' +
        '<button class="btn mini" data-renovar="' + esc(c.id) + '">' + ICONO.renovar + '<span class="et">Renovar sin cobrar</span></button>' +
        '<button class="btn mini" data-correr="' + esc(c.id) + '">' + ICONO.reloj + '<span class="et">Correr la fecha</span></button>' +
        '<button class="btn mini' + (enPausa(c) ? ' aviso' : '') + '" data-pausar="' + esc(c.id) + '">' +
          (enPausa(c) ? ICONO.ok : ICONO.reloj) +

        (m ? '<button class="btn mini" data-accesos="' + esc(c.id) + '">' + ICONO.copiar +
          '<span class="et">Copiar sus accesos</span></button>' : '') +
        '<button class="btn mini" data-precio="' + esc(c.id) + '">' + ICONO.etiqueta + '<span class="et">Cambiar el precio</span></button>' +
        '<button class="btn mini" data-mover="' + esc(c.id) + '">' + ICONO.capas + '<span class="et">Moverlo de cuenta</span></button>' +
        '<button class="btn mini" data-editar-c="' + esc(c.id) + '">' + ICONO.lapiz + '<span class="et">Editar</span></button>' +
        (m ? '<button class="btn mini" data-ver-cuenta="' + esc(m.id) + '">' + ICONO.tele +
          '<span class="et">Ver la cuenta</span></button>' : '') +
        '<button class="btn mini peligro icono" data-borrar-c="' + esc(c.id) + '" title="Borrar cliente" aria-label="Borrar cliente">' + ICONO.basura + '</button>' +
      '</div>' +
      '<dl class="datos">' + datos.map(function(d){
        return '<div class="dato"><dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1]) + '</dd></div>';
      }).join('') + '</dl>' +
      (c.nota ? '<div class="nota-caja">' + ICONO.chat + '<span>' + esc(c.nota) + '</span></div>' : '') +
    '</div>' +

    panelPersona +

    (debiendo > 1
      ? '<div class="tarjeta aviso-deuda"><div class="tarjeta-cabeza">' +
          '<span class="cabeza-icono rojo">' + ICONO.alerta + '</span>' +
          '<div class="crece"><h2>Te debe ' + debiendo + ' cuotas</h2>' +
            '<p>No te paga desde el ' + esc(fechaBonita(c.vencimiento)) + '. Son ' +
            esc(dinero(deudaDe(c))) + ' en total.</p></div>' +
          '<button class="btn principal" data-cuotas="' + esc(c.id) + '|' + debiendo + '">' +
            ICONO.cobrar + '<span class="et">Cobrar las ' + debiendo + '</span></button>' +
        '</div></div>'
      : '') +

    tarjetaPrecio(c) +

    (m ? '<div class="tarjeta"><div class="tarjeta-cabeza">' +
        '<span class="cabeza-icono azul">' + ICONO.tele + '</span>' +
        '<div class="crece"><h2>Su cuenta</h2><p>Lo que le tienes que pasar para entrar.</p></div>' +
        '<button class="btn mini principal" data-accesos="' + esc(c.id) + '">' + ICONO.copiar +
          '<span class="et">Copiar todo junto</span></button>' +
      '</div><div class="tarjeta-cuerpo"><dl class="datos">' +

          (m.contrasena ? '<button class="btn icono mini fantasma" data-verclave="' + esc(m.id) + '" title="Ver u ocultar la clave" aria-label="Ver u ocultar la clave">' + (abiertos.has('clave'+m.id)?ICONO.ojoNo:ICONO.ojo) + '</button>' : '') +
          (m.contrasena ? '<button class="btn icono mini fantasma" data-copiar="' + esc(m.contrasena) + '" data-que="Clave" title="Copiar clave" aria-label="Copiar clave">' + ICONO.copiar + '</button>' : '') +
        '</dd></div>' +
        '<div class="dato"><dt>La cuenta vence</dt><dd>' + esc(fechaBonita(m.vencimiento)) + '</dd></div>' +
      '</dl></div></div>' : '') +

    (cobros.length ?

        '<span class="cabeza-icono verde">' + ICONO.billete + '</span>' +
        '<div class="crece"><h2>Lo que te ha pagado</h2><p>' + cobros.length + ' ' +
          plural(cobros.length,'cobro','cobros') + ' · ' + esc(dinero(pagado)) + ' en total</p></div>' +

            '<span class="crece">' + esc(fechaBonita(v.fecha)) +
              (v.meses > 1 ? ' <small>· ' + v.meses + ' meses</small>' : '') + '</span>' +
            '<small>' + esc(v.metodo || '—') + '</small>' +

        (cobros.length > 24 ? '<div class="h"><span class="crece"><small>y ' + (cobros.length-24) + ' más antes</small></span></div>' : '') +
      '</div></div></div>' : '') +
  '</div>';
}

/* --- DINERO ------------------------------------------------------------- */
let mesDinero = '';

function pintaDinero(){
  if(!mesDinero) mesDinero = hoyISO().slice(0,7);
  const eco = economia();

  /* El dinero también se mira por plataforma: si estás en NETFLIX, aquí
     solo hay lo que entra y sale de Netflix. */
  const enPlatM = function(m){
    return plataformaActiva === 'TODAS' ||
           String(m.nombre||'').trim().toUpperCase() === plataformaActiva;
  };
  const susCuentas = servicios.filter(enPlatM);
  const idsSuyos = new Set(susCuentas.map(function(m){ return String(m.id); }));
  const esSuya = function(x, campo){
    if(plataformaActiva === 'TODAS') return true;
    return String(x[campo]||'').trim().toUpperCase() === plataformaActiva ||
           idsSuyos.has(String(x.cuentaMasterId));
  };
  const ventasPlat = ventas.filter(function(v){ return esSuya(v, 'servicio'); });
  const gastosPlat = inversiones.filter(function(i){ return esSuya(i, 'plataforma'); });

  const ventasMes = ventasPlat.filter(function(v){ return String(v.fecha||'').indexOf(mesDinero)===0; });
  const gastosMes = gastosPlat.filter(function(i){ return String(i.fecha||'').indexOf(mesDinero)===0; });
  const cobrado = ventasMes.reduce(function(a,v){ return a + (Number(v.monto)||0); }, 0);
  const gastado = gastosMes.reduce(function(a,i){ return a + (Number(i.monto)||0); }, 0);
  const ticket  = ventasMes.length ? cobrado/ventasMes.length : 0;

  /* Los meses que existen en los datos, del más nuevo al más viejo. */
  const meses = {};
  ventas.forEach(function(v){ const m=String(v.fecha||'').slice(0,7); if(m.length===7) meses[m]=1; });

  const ultimas = ventasPlat.slice().sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); }).slice(0,12);

  '<div class="pila">' +
    barraPlataformas() +
    /* El mes, con sus flechas: se pasa de mes sin abrir ningún desplegable,
       que es como se mira el dinero — hacia atrás, uno a uno. */
    (function(){

      const masNuevo = i > 0 ? listaMeses[i-1] : '';

    /* La meta del mes. Solo aparece si la has puesto: una barra en blanco

/* Preguntarle a la copia guardada cómo se llama. Si el programa dice una
   versión y la copia dice otra, se ve al momento de dónde viene el problema. */
function contarCopiaGuardada(){
  const celda = document.getElementById('dato-copia');
  if(!celda) return;
  if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller){
    celda.textContent = 'ninguna (viene de internet)';
    return;
  }
  let contestó = false;
  const oir = function(ev){
    if(!ev.data || ev.data.tipo !== 'papotas:version') return;
    contestó = true;
    navigator.serviceWorker.removeEventListener('message', oir);
    celda.textContent = ev.data.cache;
  };
  navigator.serviceWorker.addEventListener('message', oir);
  try{ navigator.serviceWorker.controller.postMessage('papotas:version'); }catch(_){}
  setTimeout(function(){ if(!contestó) celda.textContent = 'no contestó'; }, 2500);
}

/* ---------- El estilo, a tu gusto --------------------------------------
   Aquí no hay nada que adivinar: el mismo negro que en un OLED a oscuras
   se ve elegante, a pleno sol se ve como un agujero. Se elige el tono y
   se ve al momento, sin guardar ni recargar nada. */
function muestraTono(t){
  const c = t === 'negro'   ? ['#0c0b0a','#171614','#21201d']
          : t === 'pizarra' ? ['#2a2724','#343029','#3e3a33']
                            : ['#1e1c1a','#272522','#312f2b'];
  /* Tres cuadrados sueltos no dicen nada: entre un tono y otro hay diez
     puntos de gris y a ese tamaño se ven iguales. Esto es una maqueta
     diminuta del programa -fondo, tarjeta y dos renglones-, que es donde
     la diferencia se ve de verdad. */
  const g = t === 'negro'   ? ['#b2aea8','#8c8882']
          : t === 'pizarra' ? ['#d5d1cb','#a9a59f']
                            : ['#c3bfb9','#9b9791'];
  return '<span class="muestra-tono" aria-hidden="true" style="background:' + c[0] + '">' +
    '<i class="mt-tarjeta" style="background:' + c[2] + '">' +
      '<b style="background:' + g[0] + '"></b>' +
      '<u style="background:' + g[1] + '"></u>' +
    '</i>' +
    '<i class="mt-barra" style="background:' + c[1] + '"></i>' +
  '</span>';
}

/* ---------- PANELES DE MANDO ---------------------------------------------
   Una lista de filas dice QUÉ hay. Un panel dice qué hay, cuánto pesa y qué
   se puede hacer con ello sin salir de ahí. La diferencia entre mirar y
   administrar son tres cifras arriba y un botón que actúa sobre el montón. */

/* --- Las cuentas master vencidas: lo más caro que te puede pasar -------- */
/* El aviso ANTES de que se caiga. Va primero de todo: no hay nada más
   urgente en esta pantalla, porque una master que se cae se lleva a todos
   sus clientes de una vez y encima te los deja escribiendo. */
function panelPorCaer(lista, dentro){
  if(!lista.length) return '';
  const cuanto = lista.reduce(function(a,m){ return a + (Number(m.costo)||0); }, 0);
  const manana = lista.filter(function(m){ const d=diasHasta(m.vencimiento); return d<=1; });
  return '<div class="panel-mando urgente">' +
    '<div class="pm-alto">' +
      '<span class="pm-icono">' + ICONO.reloj + '</span>' +
      '<div class="pm-id"><h2>' + lista.length + ' ' +
        plural(lista.length,'cuenta está a punto de caerse','cuentas están a punto de caerse') + '</h2>' +
        '<p>Todavía puedes renovarlas. Si se caen, ' + dentro + ' ' +
          plural(dentro,'cliente se queda','clientes se quedan') + ' sin servicio de golpe' +
          (manana.length ? ' — y ' + manana.length + ' ' +
            plural(manana.length,'vence','vencen') + ' hoy o mañana' : '') + '.</p></div>' +
    '</div>' +
    '<div class="tarjeta-cuerpo pegado"><div class="lista">' +
      lista.map(function(m){
        const d = diasHasta(m.vencimiento);
        const suyos = clientesDe(m.id).length;
        return '<div class="f ' + (d<=1?'mal':'aviso') + '" style="cursor:default">' +
          logoPlataforma(m.nombre) +
          '<span class="f-txt"><span class="f-nom">' + esc(nombreCuenta(m)) + '</span>' +
            '<span class="f-sub">' + suyos + ' ' + plural(suyos,'cliente dentro','clientes dentro') +
            ' · te cuesta ' + esc(dinero(Number(m.costo)||0)) + '</span></span>' +
          '<span class="f-der">' +
            '<span class="f-monto" style="font-size:12.5px;color:' + (d<=1?'var(--mal)':'var(--aviso)') + '">' +
              (d===0 ? 'vence hoy' : d===1 ? 'mañana' : 'en ' + d + ' días') + '</span>' +
            '<span class="f-cuando">' + esc(fechaBonita(m.vencimiento)) + '</span></span>' +
          '<button class="btn mini principal" data-renovar-m="' + esc(m.id) + '">' + ICONO.renovar +
            '<span class="et">Renové</span></button>' +
        '</div>';
      }).join('') +
    '</div></div>' +
    '<div class="pm-pie"><small>Renovarlas todas te cuesta ' + esc(dinero(cuanto)) + '.</small></div>' +
  '</div>';
}

function panelMastersVencidos(lista, eco){
  if(!lista.length) return '';
  const dentro  = lista.reduce(function(a,m){ return a + clientesDe(m.id).length; }, 0);
  const enJuego = lista.reduce(function(a,m){ return a + resumenCuenta(m, eco).recurrente; }, 0);
  const cuesta  = lista.reduce(function(a,m){ return a + (Number(m.costo)||0); }, 0);
  const deben   = lista.reduce(function(a,m){ return a + clientesDe(m.id).filter(debe).length; }, 0);
  const peor    = lista.reduce(function(a,m){
    const d = diasHasta(m.vencimiento);
    return (d !== null && d < a) ? d : a;
  }, 0);

  return '<div class="panel-mando peligro">' +
    '<div class="pm-alto">' +

/* --- Los sitios libres, agrupados y contados ----------------------------
   Antes era una fila por perfil: dieciocho filas iguales que no decían nada.
   Ahora cada plataforma es una tarjeta con sus cuentas y sus huecos como
   casillas, y arriba lo único que de verdad importa: cuánto dinero es eso
   si los llenas. */
function panelLibres(huecos, opciones){
  const o = opciones || {};
  if(!huecos.length){
    return '<div class="tarjeta-cuerpo"><div style="padding:var(--e3) 0">' +
      vacio(o.vacioTitulo || 'No te queda sitio en ninguna parte',
            o.vacioTexto || 'Todos los perfiles de todas tus cuentas están ocupados. Para meter a alguien más, compra otra cuenta.') +
    '</div></div>';
  }
  const porPlat = new Map();
  huecos.forEach(function(h){
    if(!porPlat.has(h.plataforma)) porPlat.set(h.plataforma, new Map());
    const cuentas = porPlat.get(h.plataforma);
    const k = String(h.m.id);
    if(!cuentas.has(k)) cuentas.set(k, {m:h.m, nums:[]});
    cuentas.get(k).nums.push(h.n);
  });
  const cuantosDe = function(n){
    return Array.from(porPlat.get(n).values()).reduce(function(a,c){ return a + c.nums.length; }, 0);
  };
  const plats = Array.from(porPlat.keys()).sort(function(a,b){
    return cuantosDe(b) - cuantosDe(a) || a.localeCompare(b,'es');
  });
  const potencial = plats.reduce(function(a,n){ return a + cuantosDe(n) * tarifaVigente(n); }, 0);

  return '<div class="panel-mando">' +
    '<div class="pm-cifras tres">' +
      '<div class="pmc bien"><dt>Sitios libres</dt><dd class="cifra">' + huecos.length + '</dd>' +
        '<small>en ' + plats.length + ' ' + plural(plats.length,'plataforma','plataformas') + '</small></div>' +
      '<div class="pmc info"><dt>Si los llenas</dt><dd class="cifra">' + esc(dinero(potencial)) + '</dd>' +
        '<small>más al ciclo, a tarifa de hoy</small></div>' +
      '<div class="pmc"><dt>Al año</dt><dd class="cifra">' + esc(dinero(potencial * 12)) + '</dd>' +
        '<small>lo que pierdes si los dejas vacíos</small></div>' +
    '</div>' +
    '<div class="pm-cuerpo"><div class="libres-rejilla">' +
      plats.map(function(n){
        const cuentas = Array.from(porPlat.get(n).values())
          .sort(function(a,b){ return (Number(a.m.numero)||0) - (Number(b.m.numero)||0); });
        const cuantos = cuantosDe(n);
        return '<div class="libre-plat" style="' + tonoDe(n) + '">' +
          '<div class="lb-alto">' +
            logoPlataforma(n, 34) +
            '<span class="lb-id"><b>' + esc(n) + '</b>' +
              '<small>' + cuantos + ' ' + plural(cuantos,'libre','libres') + ' · ' +
                esc(dinero(cuantos * tarifaVigente(n))) + '</small></span>' +
            '<button class="btn mini icono fantasma" data-plat="' + esc(n) + '"' +
              ' title="Entrar a ' + esc(n) + '" aria-label="Entrar a ' + esc(n) + '">' + ICONO.flecha + '</button>' +
          '</div>' +
          '<div class="lb-cuentas">' + cuentas.map(function(c){
            return '<div class="lb-cuenta">' +
              '<button class="lb-nombre" data-ver-cuenta="' + esc(c.m.id) + '"' +
                ' title="Abrir ' + esc(nombreCuenta(c.m)) + '">' + esc(nombreCuenta(c.m)) + '</button>' +
              '<span class="lb-huecos">' + c.nums.map(function(x){
                return '<button class="hueco-chip" data-poner-en="' + esc(c.m.id) + '" data-perfil="Perfil ' + x + '"' +
                  ' title="Poner un cliente en el perfil ' + x + ' de ' + esc(nombreCuenta(c.m)) + '"' +
                  ' aria-label="Poner un cliente en el perfil ' + x + ' de ' + esc(nombreCuenta(c.m)) + '">' +
                  '<i>P' + x + '</i>' + ICONO.mas + '</button>';
              }).join('') + '</span>' +
            '</div>';
          }).join('') + '</div>' +
        '</div>';
      }).join('') +
    '</div></div>' +
  '</div>';
}

function renovarTodasVencidas(){

    'Sí, las renové', function(){
      recordarPaso('renovar ' + lista.length + ' cuentas');
      let gasto = 0;
      lista.forEach(function(m){
        /* Cada cuenta se corre con SU ciclo. Antes iban todas con el
           general, así que una comprada por 45 días se renovaba como si
           fuera mensual y la fecha quedaba mal desde el primer día. */
        m.vencimiento = avanzar(m.vencimiento || hoyISO(), cicloDe(m));

    });

/* --- El pintor ---------------------------------------------------------- */
/* Una lista que se desplaza de lado sin avisar parece cortada. Se le pone
   un difuminado en el borde por el que todavía hay cosas. */
function marcarDesbordes(){
  document.querySelectorAll('.segmentos, .plataformas, .mando-plat').forEach(function(el){
    const hay = el.scrollWidth > el.clientWidth + 2;
    const alPrincipio = el.scrollLeft < 4;
    const alFinal = el.scrollLeft >= el.scrollWidth - el.clientWidth - 4;
    el.classList.toggle('desborda', hay && alPrincipio);
    el.classList.toggle('desborda-izq', hay && !alPrincipio && !alFinal);
    el.classList.toggle('desborda-fin', hay && alFinal);
    if(!el.dataset.oyendo){
      el.dataset.oyendo = '1';
      el.addEventListener('scroll', function(){ marcarDesbordes(); }, {passive:true});
      /* La rueda del ratón mueve la tira a lo ancho: es lo que intenta
         cualquiera antes de buscar una flecha. */
      el.addEventListener('wheel', function(ev){
        if(ev.deltaX) return;                       /* ya viene de lado */
        if(el.scrollWidth <= el.clientWidth + 2) return;
        ev.preventDefault();
        el.scrollLeft += ev.deltaY;
      }, {passive:false});
      arrastrable(el);
    }
    /* Las flechas del carril solo existen si hay algo hacia donde ir. */
    const carril = el.parentElement;
    if(carril && carril.classList.contains('carril-plat')){
      carril.classList.toggle('con-flechas', hay);
      const izq = carril.querySelector('.carril-flecha.izq');
      const der = carril.querySelector('.carril-flecha.der');
      if(izq) izq.classList.toggle('apagada', !hay || alPrincipio);
      if(der) der.classList.toggle('apagada', !hay || alFinal);
    }
  });
}

/* Arrastrar con el ratón, como se arrastra con el dedo. Si el arrastre pasa
   de unos pocos píxeles, el clic que venía detrás se anula: si no, soltar
   encima de una plataforma te metía dentro sin querer. */
function arrastrable(el){
  let pulsando = false, desde = 0, scroll0 = 0, movido = 0;
  el.addEventListener('pointerdown', function(ev){
    if(ev.pointerType === 'touch') return;          /* el dedo ya funciona */
    if(el.scrollWidth <= el.clientWidth + 2) return;
    pulsando = true; movido = 0;
    desde = ev.clientX; scroll0 = el.scrollLeft;
  });
  el.addEventListener('pointermove', function(ev){
    if(!pulsando) return;
    const d = ev.clientX - desde;
    if(Math.abs(d) > 3){ movido = Math.abs(d); el.classList.add('arrastrando'); }
    el.scrollLeft = scroll0 - d;
  });
  const soltar = function(){
    if(!pulsando) return;
    pulsando = false;
    el.classList.remove('arrastrando');
    if(movido > 6){ el.dataset.arrastre = String(Date.now()); }
  };
  el.addEventListener('pointerup', soltar);
  el.addEventListener('pointerleave', soltar);
  el.addEventListener('pointercancel', soltar);
}

/* La plataforma con la que trabajas se deja siempre a la vista: si eliges
   una con el teclado, no se queda fuera de la pantalla. */
function acercarPlataformaViva(){
  document.querySelectorAll('.pagina.viva .mando-plat').forEach(function(tira){
    const viva = tira.querySelector('.pastel.viva');
    if(!viva) return;
    const t = tira.getBoundingClientRect(), v = viva.getBoundingClientRect();
    if(v.left < t.left + 4 || v.right > t.right - 4){
      tira.scrollTo({left: viva.offsetLeft - tira.clientWidth/2 + viva.offsetWidth/2,
                     behavior: suave()});
    }
  });
}
window.addEventListener('resize', function(){ marcarDesbordes(); });

function pintar(){
  olvidarIndices();
  /* Los precios que tenían fecha de hoy entran solos antes de dibujar nada,
     para que lo que veas ya sea lo que de verdad cobras. */
  revisarPrecios();
  if(pantalla === 'hoy') pintaHoy();
  else if(pantalla === 'negocio') pintaNegocio();
  else if(pantalla === 'dinero') pintaDinero();
  else if(pantalla === 'ajustes'){ pintaAjustes(); contarCopiaGuardada(); }
  pintarAvisosNav();
  ponerRolesPestanas();
  ponerTituloVentana();
  recolocarFoco();
  requestAnimationFrame(function(){ marcarDesbordes(); acercarPlataformaViva(); });
}
function pintarAvisosNav(){
  /* Cada pestaña avisa de LO SUYO. Antes las dos llevaban el mismo número
     -los clientes vencidos- y en el teléfono se veían dos globos iguales
     pegados: parecía un error de la pantalla, y además el aviso de
     Plataformas no servía para nada porque no hablaba de plataformas. */
  const vencidos = clientes.filter(function(c){
    const d = diasHasta(c.vencimiento); return d !== null && d < 0;
  }).length;
  const tope = Number(ajustes.diasAlerta || 5);
  const cuentasEnApuros = servicios.filter(function(m){
    const d = diasHasta(m.vencimiento); return d !== null && d <= tope;
  }).length;
  const cuenta = { hoy: vencidos, clientes: cuentasEnApuros };
  const dice = { hoy: 'clientes vencidos', clientes: 'cuentas por renovar' };
  $$('[data-punto]').forEach(function(el){
    const q = cuenta[el.dataset.punto] || 0;
    if(q > 0){
      el.classList.remove('oculto');
      el.textContent = q > 99 ? '99+' : q;
      el.setAttribute('title', q + ' ' + (dice[el.dataset.punto] || ''));
    }
    else { el.classList.add('oculto'); el.removeAttribute('title'); }
  });
}

function buscarCliente(id){ return clientes.find(function(c){ return String(c.id)===String(id); }); }
function buscarMaster(id){ return servicios.find(function(m){ return String(m.id)===String(id); }); }

/* CORRER LA FECHA UNOS DÍAS
   No todo es «un ciclo entero». A veces le das tres días más porque te
   pidió esperar, o le quitas dos porque te pagó tarde y no quieres
   regalarle el mes. Antes había que abrir «Editar» y calcular la fecha a
   mano en la cabeza; y si te equivocabas, no quedaba ni rastro de por qué
   ese cliente vence un martes raro. Esto la corre y lo deja apuntado. */
function correrFecha(id){
  const c = buscarCliente(id);
  if(!c){ avisar('No encontré a ese cliente', 'mal'); return; }
  const desde = c.vencimiento || hoyISO();
  const ciclo = cicloDe(c);
  const atajos = [3, 7, 15, 30];
  abrirModal('Correr la fecha de ' + (c.nombre || 'este cliente'),
    '<div class="pila">' +
      '<p class="ayuda-modal">Ahora vence el <b>' + esc(fechaBonita(desde)) + '</b>. ' +
      'Esto solo mueve la fecha: no cobra nada ni apunta ninguna venta.</p>' +
      '<div class="fila atajos-dias">' +
        atajos.map(function(n){
          return '<button type="button" class="btn mini" data-suma="' + n + '">+' + n + ' días</button>';
        }).join('') +
        '<button type="button" class="btn mini fantasma" data-suma="-1">−1 día</button>' +
        '<button type="button" class="btn mini fantasma" data-suma="ciclo">+1 ciclo (' +
          ciclo.cantidad + ' ' + (ciclo.tipo === 'dias' ? plural(ciclo.cantidad,'día','días')
                                                        : plural(ciclo.cantidad,'mes','meses')) + ')</button>' +
      '</div>' +
      campo('cf-dias','Cuántos días',{tipo:'number', valor:7, paso:'1',
        ayuda:'En negativo se la echas para atrás'}) +
      '<p class="ayuda-modal" id="cf-previa">—</p>' +
    '</div>',
    [{texto:'Cancelar', clase:'fantasma', hacer:cerrarModal},
     {texto:'Correr la fecha', clase:'principal', hacer:function(){
       const n = Math.round(num('cf-dias'));
       if(!n){ avisar('Pon cuántos días', 'mal'); return; }
       const nueva = sumarDias(desde, n);
       recordarPaso('correr la fecha de ' + (c.nombre || 'un cliente'));
       c.vencimiento = nueva;
       anotar('CORRER FECHA', (c.nombre || '') + ': de ' + fechaBonita(desde) +
              ' a ' + fechaBonita(nueva) + ' (' + (n > 0 ? '+' : '') + n + ' días)');
       guardar(); cerrarModal(); pintar();
       avisar((c.nombre || 'El cliente') + ' vence ahora el ' + fechaBonita(nueva), 'bien', true);
     }}]);
  /* La fecha resultante se ve MIENTRAS escribes: sumar días de cabeza
     encima de un calendario es justo donde se equivoca uno. */
  const caja = document.getElementById('cf-dias');
  const previa = document.getElementById('cf-previa');
  function refrescar(){
    const n = Math.round(Number(caja && caja.value) || 0);
    if(!previa) return;
    previa.innerHTML = n
      ? 'Pasaría a vencer el <b>' + esc(fechaBonita(sumarDias(desde, n))) + '</b>'
      : '—';
  }
  if(caja){ caja.addEventListener('input', refrescar); refrescar(); }
  const zona = document.getElementById('modal-cuerpo');
  if(zona) zona.addEventListener('click', function(ev){
    const b = ev.target.closest && ev.target.closest('[data-suma]');
    if(!b || !caja) return;
    ev.preventDefault();
    if(b.dataset.suma === 'ciclo'){
      const hasta = avanzar(desde, ciclo);
      caja.value = Math.round((new Date(hasta + 'T00:00:00') - new Date(desde + 'T00:00:00')) / 86400000);
    } else {
      caja.value = b.dataset.suma;
    }
    refrescar();
  });
}

/* Renueva y, si se cobra, deja la venta registrada. Misma lógica que antes. */
/* ---------- TRABAJAR CON VARIOS A LA VEZ --------------------------------
   Con cien clientes, hacer las cosas de una en una es el trabajo. Cobrarle
   a los doce de Netflix que vencieron el mismo día son doce ventanas, doce
   confirmaciones y doce oportunidades de perder el hilo. Aquí se marcan los
   que sean y se hace una sola vez. */
let modoElegir = false;
let elegidos = new Set();

function limpiarEleccion(){ elegidos.clear(); modoElegir = false; }
function alternarElegido(id){
  const k = String(id);
  if(elegidos.has(k)) elegidos.delete(k); else elegidos.add(k);
}
function elegidosVivos(){
  return Array.from(elegidos).map(buscarCliente).filter(Boolean);
}
/* Los que están a la vista ahora mismo, en el orden en que se ven. */
/* Los que están a la vista AHORA MISMO, se estén viendo en tarjetas o en
   la lista completa. Antes solo miraba las tarjetas, así que desde la lista
   "marcar a todos" no encontraba a nadie y no marcaba nada. */
function clientesALaVista(){
  const nodos = document.querySelectorAll('#p-negocio .tc[data-cid], #p-negocio tbody tr[data-cid]');
  const vistos = {}, fuera = [];
  Array.prototype.forEach.call(nodos, function(el){
    const id = String(el.dataset.cid);
    if(vistos[id]) return;
    vistos[id] = 1;
    const c = buscarCliente(id);
    if(c) fuera.push(c);
  });
  return fuera;
}

/* La casilla de la cabecera de la tabla se pone o se quita sola según estén
   marcados todos los que se ven, sin repintar la tabla entera. */
function marcaDeCabecera(){
  const cab = document.querySelector('#p-negocio .tabla-clientes thead .tc-marca');
  if(!cab) return;
  const vista = clientesALaVista();
  const todos = vista.length > 0 && vista.every(function(c){ return elegidos.has(String(c.id)); });
  cab.setAttribute('aria-checked', todos ? 'true' : 'false');
  cab.innerHTML = todos ? ICONO.ok : '';
  const dilo = todos ? 'Quitar la marca a todos' : 'Marcar a todos los que se ven';
  cab.setAttribute('aria-label', dilo);
  cab.setAttribute('title', dilo);
}

/* La barra que aparece abajo cuando hay alguien marcado. */
/* Solo la barra de abajo, sin tocar la lista. */
function refrescarLote(){
  marcaDeCabecera();
  const caja = document.querySelector('#p-negocio .lote');
  const html = barraLote();
  if(caja && html){ caja.outerHTML = html; return; }
  if(caja && !html){ caja.remove(); return; }
  if(!caja && html) pintar();
}

function barraLote(){
  const lista = elegidosVivos();
  if(!modoElegir) return '';
  const suma = lista.reduce(function(a,c){ return a + cobroDe(c); }, 0);
  const conTel = lista.filter(function(c){ return telefonoDe(c); }).length;

        '<span class="et">Marcar los que se ven</span></button>' +
      (lista.length ? '<button class="btn mini principal" data-lote="cobrar">' + ICONO.cobrar +
        '<span class="et">Cobrar a los ' + lista.length + '</span></button>' : '') +
      (conTel ? '<button class="btn mini bien" data-lote="escribir">' + ICONO.wa +
        '<span class="et">Escribir a ' + conTel + '</span></button>' : '') +
      (lista.length ? '<button class="btn mini" data-lote="mover">' + ICONO.capas +
        '<span class="et">Moverlos</span></button>' : '') +
      (lista.length ? '<button class="btn mini" data-lote="pausar">' + ICONO.reloj +
        '<span class="et">Pausarlos</span></button>' : '') +
      '<button class="btn mini fantasma" data-lote="salir">' + ICONO.x +
        '<span class="et">Salir</span></button>' +
    '</div>' +
  '</div>';
}

/* Cobrar a todos de una: una sola foto para deshacer, un solo guardado y
   una sola pintada. De uno en uno eran cien guardados y cien subidas. */
function cobrarLote(){
  const lista = elegidosVivos();
  if(!lista.length) return;
  const suma = lista.reduce(function(a,c){ return a + cobroDe(c) * mesesDeCiclo(c); }, 0);
  confirmar('Cobrar a ' + lista.length,
    'Se van a apuntar ' + lista.length + ' ' + plural(lista.length,'cobro','cobros') +
    ' por ' + dinero(suma) + ' en total, y a todos se les corre el vencimiento. ¿Seguro?',
    'Sí, cobrar a los ' + lista.length, function(){
      recordarPaso('cobrar a ' + lista.length + ' ' + plural(lista.length,'cliente','clientes'));
      let hechos = 0, total = 0;
      lista.forEach(function(c){ const r = cobrarUno(c, true, 1); if(r){ hechos++; total += r; } });
      anotar('COBRO EN LOTE', hechos + ' cobros por ' + dinero(total));
      guardar(); limpiarEleccion(); pintar();
      avisar('Cobrados ' + dinero(total) + ' de ' + hechos + ' ' + plural(hechos,'cliente','clientes'), 'bien', true);
    });
}

function pausarLote(){
  const lista = elegidosVivos();
  if(!lista.length) return;
  const encendidos = lista.filter(function(c){ return !c.pausado; }).length;
  const pausar = encendidos > 0;
  recordarPaso((pausar ? 'pausar ' : 'reactivar ') + lista.length + ' clientes');
  lista.forEach(function(c){ c.pausado = pausar ? true : false; if(!pausar) delete c.pausado; });
  anotar(pausar ? 'PAUSAR' : 'REACTIVAR', lista.length + ' clientes');
  guardar(); limpiarEleccion(); olvidarIndices(); pintar();
  avisar((pausar ? 'Pausados ' : 'Reactivados ') + lista.length, 'bien', true);
}

/* Moverlos a todos a la misma cuenta, repartiéndolos por los perfiles que
   queden libres y avisando si no caben. */
function moverLote(){
  const lista = elegidosVivos();
  if(!lista.length) return;
  const opc = servicios.slice().sort(function(a,b){ return nombreCuenta(a).localeCompare(nombreCuenta(b),'es'); })
    .map(function(m){
      const libres = perfilesDe(m).filter(function(x){ return x.n && !x.cliente; }).length;
      return [m.id, nombreCuenta(m) + ' · ' + (libres ? libres + ' ' + plural(libres,'sitio libre','sitios libres') : 'sin sitio')];
    });
  abrirModal('Mover a ' + lista.length,
